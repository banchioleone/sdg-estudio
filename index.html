>(Y<sub>t</sub> - <span class=\"ov\">Y</span>)(Y<sub>t-k</sub> - <span class=\"ov\">Y</span>)</span><span class=\"den\"><span class=\"op\">Σ<sub>t=1</sub><sup>n</sup></span>(Y<sub>t</sub> - <span class=\"ov\">Y</span>)<sup>2</sup></span></span></span>","html":"El numerador suma, para cada par separado por k períodos, el producto de sus desvíos contra la media. El denominador normaliza entre −1 y +1.","titleHtml":"rₖ mide la «memoria» de la serie."},{"type":"pregunta","k":"A ver…","title":"En una serie mensual, un pico en r₁₂ te está diciendo…","options":["Que hay tendencia, porque 12 es un número grande","Estacionalidad anual: cada mes se parece al mismo mes del año anterior","Que la serie es aleatoria"],"correct":1,"feedback":"El lag donde salta el pico te dice la longitud estacional. Datos mensuales con pico en r₁₂ → estacionalidad anual. En trimestrales, el pico típico es r₄.","titleHtml":"En una serie mensual, un pico en r₁₂ te está diciendo…"},{"type":"concepto","k":"El correlograma","title":"Cada patrón deja una huella dactilar.","text":"Se calculan muchos rₖ (r₁, r₂, … hasta r₁₂ o más) y se grafican como barras: eje horizontal = lag, eje vertical = valor. Eso es el correlograma (FAC/ACF). Un rₖ suelto sirve poco.","html":"Se calculan muchos rₖ (r₁, r₂, … hasta r₁₂ o más) y se grafican como barras: eje horizontal = lag, eje vertical = valor. Eso es el correlograma (FAC/ACF). Un rₖ suelto sirve poco.","titleHtml":"Cada patrón deja una huella dactilar."},{"type":"concepto","k":"Huella 1 y 2","title":"Aleatoria o con tendencia.","text":"Aleatoria (estacionaria pura): todas las barras cerca de cero. Métodos: promedio móvil, suavizado exponencial simple. Tendencia: primeras barras grandes y positivas que caen gradualmente. La serie NO es estacionaria. Métodos: Holt, Brown, regresión — o diferenciar.","html":"Aleatoria (estacionaria pura): todas las barras cerca de cero. Métodos: promedio móvil, suavizado exponencial simple. Tendencia: primeras barras grandes y positivas que caen gradualmente. La serie NO es estacionaria. Métodos: Holt, Brown, regresión — o diferenciar.","titleHtml":"Aleatoria o con tendencia."},{"type":"concepto","k":"Huella 3 y 4","title":"Estacionalidad, sola o combinada.","text":"Estacionalidad: pico aislado en el lag del ciclo (r₄ trimestral, r₁₂ mensual), a veces repetido en r₈, r₂₄. Métodos: Winter, descomposición. Combinación (lo más frecuente): decaen lento (tendencia) y además hay picos cada L lags.","ejemplo":"El criterio más útil: el lag del pico te dice la longitud estacional.","html":"Estacionalidad: pico aislado en el lag del ciclo (r₄ trimestral, r₁₂ mensual), a veces repetido en r₈, r₂₄. Métodos: Winter, descomposición. Combinación (lo más frecuente): decaen lento (tendencia) y además hay picos cada L lags.","titleHtml":"Estacionalidad, sola o combinada."},{"type":"pregunta","k":"A ver…","title":"Barras altas al principio que caen de a poco, y un pico que se destaca en r₁₂. ¿Qué hay?","options":["Solo una serie aleatoria","Tendencia y estacionalidad anual (huella combinada)","Solo ciclo económico"],"correct":1,"feedback":"Decaimiento gradual → tendencia. Pico en r₁₂ → estacionalidad anual. Es la huella combinada: Winter o descomposición multiplicativa.","titleHtml":"Barras altas al principio que caen de a poco, y un pico que se destaca en r₁₂. ¿Qué hay?"},{"type":"concepto","k":"La banda","title":"¿Cuándo un rₖ es de verdad?","text":"Un rₖ nunca da exactamente cero por azar. La banda de significancia es ±2/√n. Fuera de la banda = patrón real. Dentro = ruido.","formula":"\\pm \\frac{2}{\\sqrt{n}}","ejemplo":"Con n = 48, la banda es ±0,29. En los correlogramas de Minitab (el software de la cátedra) las bandas aparecen como líneas punteadas.","formulaHtml":"<span class=\"eq-block\">± <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">√<span class=\"rad\">n</span></span></span></span>","html":"Un rₖ nunca da exactamente cero por azar. La banda de significancia es ±2/√n. Fuera de la banda = patrón real. Dentro = ruido.","titleHtml":"¿Cuándo un rₖ es de verdad?"},{"type":"concepto","k":"Ejemplo de examen","title":"Ventas mensuales, n = 48.","text":"r₁=0,85, r₂=0,72, r₃=0,61… r₁₁=0,15, r₁₂=0,68, r₁₃=0,55. Las primeras decaen (tendencia) y hay un repunte en r₁₂ (estacionalidad anual). Ambos superan ±0,29.","ejemplo":"Redacción: «La serie presenta tendencia (autocorrelaciones significativas que decaen gradualmente) y estacionalidad de período 12 (pico significativo en el desfasamiento 12). No es estacionaria. Corresponde aplicar Winter o descomposición multiplicativa.»","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><line x1=\"28\" y1=\"69.91304347826087\" x2=\"272\" y2=\"69.91304347826087\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"28\" y1=\"54.34968839575791\" x2=\"272\" y2=\"54.34968839575791\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"28\" y1=\"85.47639856076383\" x2=\"272\" y2=\"85.47639856076383\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140.0\" y=\"12\" font-size=\"8\" fill=\"#e8c56a\" text-anchor=\"middle\">banda ±2/√n</text><rect x=\"34.91428571428571\" y=\"24.086956521739125\" width=\"19.014285714285716\" height=\"45.82608695652175\" fill=\"#8cb4d6\"/><text x=\"44.42142857142857\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">1</text><rect x=\"69.48571428571428\" y=\"31.095652173913038\" width=\"19.014285714285716\" height=\"38.81739130434784\" fill=\"#8cb4d6\"/><text x=\"78.99285714285713\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">2</text><rect x=\"104.05714285714285\" y=\"37.02608695652174\" width=\"19.014285714285716\" height=\"32.88695652173914\" fill=\"#8cb4d6\"/><text x=\"113.5642857142857\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">3</text><rect x=\"138.62857142857143\" y=\"42.95652173913043\" width=\"19.014285714285716\" height=\"26.956521739130444\" fill=\"#8cb4d6\"/><text x=\"148.1357142857143\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">4</text><rect x=\"173.2\" y=\"61.826086956521735\" width=\"19.014285714285716\" height=\"8.08695652173914\" fill=\"#8cb4d6\"/><text x=\"182.70714285714286\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">11</text><rect x=\"207.77142857142854\" y=\"33.25217391304347\" width=\"19.014285714285716\" height=\"36.6608695652174\" fill=\"#e25b16\"/><text x=\"217.2785714285714\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">12</text><rect x=\"242.34285714285713\" y=\"40.260869565217384\" width=\"19.014285714285716\" height=\"29.65217391304349\" fill=\"#8cb4d6\"/><text x=\"251.85\" y=\"132\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">13</text></svg>","chartLabel":"n=48 · pico en r₁₂ (estacionalidad anual) · banda ±2/√n","html":"r₁=0,85, r₂=0,72, r₃=0,61… r₁₁=0,15, r₁₂=0,68, r₁₃=0,55. Las primeras decaen (tendencia) y hay un repunte en r₁₂ (estacionalidad anual). Ambos superan ±0,29.","titleHtml":"Ventas mensuales, n = 48."},{"type":"concepto","k":"El truco de los errores","title":"El correlograma también evalúa tu modelo.","text":"Después del pronóstico, calculá el correlograma de los errores. Si todavía tienen autocorrelación, el modelo dejó un patrón sin capturar. Si son ruido puro (todo dentro de la banda), exprimiste la información disponible.","ejemplo":"Es el mejor test de calidad de un modelo de pronóstico.","html":"Después del pronóstico, calculá el correlograma de los errores. Si todavía tienen autocorrelación, el modelo dejó un patrón sin capturar. Si son ruido puro (todo dentro de la banda), exprimiste la información disponible.","titleHtml":"El correlograma también evalúa tu modelo."},{"type":"pregunta","k":"A ver…","title":"Hiciste un suavizado exponencial simple y el correlograma de los errores tiene un pico significativo en r₁₂. ¿Qué te dice?","options":["Que el método está perfecto: r₁₂ alto es una buena señal","Que quedó un patrón estacional anual sin capturar: hay que cambiar o completar el método","Nada: los errores siempre tienen r₁₂ alto"],"correct":1,"feedback":"Si los errores todavía tienen autocorrelación, el modelo dejó un patrón sin capturar. Un pico en r₁₂ es estacionalidad anual: el suavizado simple no la modela; correspondería Winter o descomposición.","titleHtml":"Hiciste un suavizado exponencial simple y el correlograma de los errores tiene un pico significativo en r₁₂. ¿Qué te dice?"},{"type":"cierre","title":"Llevate esto de la Clase 3.b.","text":"El correlograma es el diagnóstico con números: decaimiento = tendencia, pico en r_L = estacionalidad. Fuera de ±2/√n, el patrón es real. También se aplica a los errores del modelo. El ejercicio queda para resolver juntos.","html":"El correlograma es el diagnóstico con números: decaimiento = tendencia, pico en r_L = estacionalidad. Fuera de ±2/√n, el patrón es real. También se aplica a los errores del modelo. El ejercicio queda para resolver juntos.","titleHtml":"Llevate esto de la Clase 3.b."}],"titleHtml":"Clase 3.b · Autocorrelación","ledeHtml":"en la Clase 3.a diagnosticabas la serie a ojo. La autocorrelación es el mismo diagnóstico con números: evidencia objetiva de qué patrón tiene la serie, y por lo tanto de qué método corresponde aplicar."},"c4":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c4","title":"Clase 4 · Medidas de error","name":"Medidas de error","lede":"el árbol de decisión (Clase 3.a) propone *candidatos*; las medidas de error deciden. Sin ellas, \"comparar modelos\" es una opinión; con ellas, es un argumento. Y la cátedra pide explícitamente comparar modelos e interpretar.","visto":true,"source":["clases_previas/SG/Clase04_MedidasDeError.md","clases_previas/SG/Clase04_MedidasDeError.svg","clases_previas/SG/ArbolDecisorio_MetodosPronostico.svg"],"laminas":["u2/img/Clase04_MedidasDeError.svg","u2/img/ArbolDecisorio_MetodosPronostico.svg"],"next":"Integrador · El proceso completo","teoria":[{"type":"paragraph","text":"**Sistemas de Gestión (UTN FRRo) · Unidad 2.b (cierre) · Serie: 0 → 0.1 → 1 → 1.b → 2 → 3.a → 3.b → **4****","html":"<strong>Sistemas de Gestión (UTN FRRo) · Unidad 2.b (cierre) · Serie: 0 → 0.1 → 1 → 1.b → 2 → 3.a → 3.b → </strong>4****"},{"type":"callout","kind":"idea","text":"**Idea central:** el árbol de decisión (Clase 3.a) propone *candidatos*; las medidas de error **deciden**. Sin ellas, \"comparar modelos\" es una opinión; con ellas, es un argumento. Y la cátedra pide explícitamente comparar modelos e interpretar.","html":"<strong>Idea central:</strong> el árbol de decisión (Clase 3.a) propone <em>candidatos</em>; las medidas de error <strong>deciden</strong>. Sin ellas, \"comparar modelos\" es una opinión; con ellas, es un argumento. Y la cátedra pide explícitamente comparar modelos e interpretar."},{"type":"heading","level":2,"text":"1. La pregunta que resuelve","html":"1. La pregunta que resuelve"},{"type":"paragraph","text":"Pronosticaste 500 y vendiste 480. ¿Estuviste bien o mal? Y sobre todo: si otro método pronosticó 510, **¿cuál de los dos es mejor?**","html":"Pronosticaste 500 y vendiste 480. ¿Estuviste bien o mal? Y sobre todo: si otro método pronosticó 510, <strong>¿cuál de los dos es mejor?</strong>"},{"type":"paragraph","text":"No se puede responder mirando un mes suelto — cualquiera puede pegarle una vez. Hay que medir el error **a lo largo de toda la serie** y resumirlo en un número.","html":"No se puede responder mirando un mes suelto — cualquiera puede pegarle una vez. Hay que medir el error <strong>a lo largo de toda la serie</strong> y resumirlo en un número."},{"type":"heading","level":2,"text":"2. El ladrillo: el residual","html":"2. El ladrillo: el residual"},{"type":"formula","tex":"e_t = Y_t - \\hat{Y}_t","html":"<span class=\"eq-block\">e<sub>t</sub> = Y<sub>t</sub> - <span class=\"hat\">Y</span><sub>t</sub></span>"},{"type":"svg","file":"u2/img/Clase04_MedidasDeError.svg","caption":"Lámina de la Clase 4 · Medidas de error","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 1080\" width=\"980\" height=\"1080\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/></marker>\n  </defs>\n  <rect width=\"980\" height=\"1080\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">CLASE 4 · Medidas de error del pronóstico</text>\n  <text x=\"560\" y=\"34\" font-size=\"12.5\" fill=\"#666\">U2.b (cierre) — cómo se DECIDE cuál método usar</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">El árbol propone candidatos; las medidas de error deciden. Sin ellas, “comparar modelos” es opinión.</text>\n\n  <!-- ===== EL RESIDUAL ===== -->\n  <rect x=\"40\" y=\"72\" width=\"450\" height=\"146\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"94\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">El ladrillo: el RESIDUAL</text>\n  <text x=\"140\" y=\"128\" font-size=\"18\" font-weight=\"700\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\">eₜ = Yₜ − Ŷₜ</text>\n  <text x=\"300\" y=\"128\" font-size=\"11\" fill=\"#666\">real − pronosticado</text>\n  <rect x=\"56\" y=\"142\" width=\"418\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"70\" y=\"162\" font-size=\"11.5\" fill=\"#333\"><tspan font-weight=\"700\" fill=\"#1E6B33\">e POSITIVO</tspan> → vendiste MÁS de lo previsto → <tspan font-weight=\"700\">SUBESTIMASTE</tspan></text>\n  <text x=\"70\" y=\"182\" font-size=\"11.5\" fill=\"#333\"><tspan font-weight=\"700\" fill=\"#C00000\">e NEGATIVO</tspan> → vendiste MENOS de lo previsto → <tspan font-weight=\"700\">SOBREESTIMASTE</tspan></text>\n  <text x=\"70\" y=\"198\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Las 4 medidas son distintas formas de promediar estos e.</text>\n\n  <!-- ===== POR QUE 4 ===== -->\n  <rect x=\"504\" y=\"72\" width=\"436\" height=\"146\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"520\" y=\"94\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">¿Por qué hacen falta CUATRO?</text>\n  <text x=\"520\" y=\"116\" font-size=\"11.5\" fill=\"#333\">Problema: promediar los errores crudos → <tspan font-weight=\"700\">SE CANCELAN</tspan>.</text>\n  <text x=\"520\" y=\"134\" font-size=\"11\" fill=\"#666\">Si te equivocás +50 y −50, el promedio da 0 y parecerías perfecto.</text>\n  <text x=\"520\" y=\"160\" font-size=\"11.5\" fill=\"#333\">Dos soluciones a la cancelación:</text>\n  <text x=\"534\" y=\"178\" font-size=\"11.5\" fill=\"#333\">· <tspan font-weight=\"700\">valor absoluto</tspan> → MAD, MAPE</text>\n  <text x=\"534\" y=\"194\" font-size=\"11.5\" fill=\"#333\">· <tspan font-weight=\"700\">elevar al cuadrado</tspan> → MSE</text>\n  <text x=\"520\" y=\"212\" font-size=\"11.5\" fill=\"#C00000\" font-weight=\"700\">Y una que APROVECHA la cancelación para medir sesgo → PME</text>\n\n  <!-- ===== LAS 4 MEDIDAS ===== -->\n  <rect x=\"40\" y=\"232\" width=\"900\" height=\"320\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"256\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">Las 4 medidas — cada una dice algo DISTINTO</text>\n\n  <!-- MAD -->\n  <rect x=\"58\" y=\"268\" width=\"208\" height=\"270\" rx=\"6\" fill=\"#fff\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"72\" y=\"290\" font-size=\"14\" font-weight=\"700\" fill=\"#1E6B33\">MAD</text>\n  <text x=\"72\" y=\"306\" font-size=\"10\" fill=\"#666\">Desviación Absoluta Media</text>\n  <text x=\"92\" y=\"336\" font-size=\"12\" fill=\"#1E6B33\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Σ |Yₜ − Ŷₜ|</text>\n  <line x1=\"84\" y1=\"343\" x2=\"240\" y2=\"343\" stroke=\"#1E6B33\" stroke-width=\"1.4\"/>\n  <text x=\"155\" y=\"362\" font-size=\"12\" fill=\"#1E6B33\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">n</text>\n  <text x=\"72\" y=\"388\" font-size=\"10.8\" fill=\"#333\">Le saca el signo y promedia.</text>\n  <text x=\"72\" y=\"406\" font-size=\"10.8\" font-weight=\"700\" fill=\"#1E6B33\">LA MÁS INTUITIVA</text>\n  <text x=\"72\" y=\"422\" font-size=\"10.5\" fill=\"#333\">Queda en unidades originales.</text>\n  <rect x=\"70\" y=\"432\" width=\"184\" height=\"38\" rx=\"4\" fill=\"#F1F7F2\"/>\n  <text x=\"80\" y=\"448\" font-size=\"10\" fill=\"#333\" font-style=\"italic\">“MAD = 15 unidades” →</text>\n  <text x=\"80\" y=\"462\" font-size=\"10\" fill=\"#333\" font-style=\"italic\">me equivoco típicamente en 15 u.</text>\n  <text x=\"72\" y=\"490\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">CUÁNDO:</text>\n  <text x=\"72\" y=\"506\" font-size=\"10.2\" fill=\"#333\">fácil de comunicar, en unidades</text>\n  <text x=\"72\" y=\"519\" font-size=\"10.2\" fill=\"#333\">reales. Base de la señal de rastreo.</text>\n\n  <!-- MSE -->\n  <rect x=\"278\" y=\"268\" width=\"208\" height=\"270\" rx=\"6\" fill=\"#fff\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"292\" y=\"290\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">MSE</text>\n  <text x=\"292\" y=\"306\" font-size=\"10\" fill=\"#666\">Error Cuadrático Medio</text>\n  <text x=\"308\" y=\"336\" font-size=\"12\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Σ (Yₜ − Ŷₜ)²</text>\n  <line x1=\"304\" y1=\"343\" x2=\"460\" y2=\"343\" stroke=\"#1F4E79\" stroke-width=\"1.4\"/>\n  <text x=\"375\" y=\"362\" font-size=\"12\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">n</text>\n  <text x=\"292\" y=\"388\" font-size=\"10.8\" font-weight=\"700\" fill=\"#C00000\">CASTIGA LOS ERRORES GRANDES</text>\n  <rect x=\"290\" y=\"396\" width=\"184\" height=\"52\" rx=\"4\" fill=\"#EAF6FB\"/>\n  <text x=\"300\" y=\"412\" font-size=\"10\" fill=\"#333\" font-weight=\"700\">Mismo error total, distinto MSE:</text>\n  <text x=\"300\" y=\"427\" font-size=\"10\" fill=\"#333\">errores 10 y 10 → MSE = 100</text>\n  <text x=\"300\" y=\"441\" font-size=\"10\" fill=\"#C00000\" font-weight=\"700\">errores 0 y 20 → MSE = 200 (¡el doble!)</text>\n  <text x=\"292\" y=\"466\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">CUÁNDO:</text>\n  <text x=\"292\" y=\"481\" font-size=\"10.2\" fill=\"#333\">un error grande ocasional es peor</text>\n  <text x=\"292\" y=\"494\" font-size=\"10.2\" fill=\"#333\">que muchos chicos (quedarse sin stock).</text>\n  <text x=\"292\" y=\"514\" font-size=\"10.2\" font-weight=\"700\" fill=\"#C00000\">★ Criterio estándar para elegir</text>\n  <text x=\"292\" y=\"527\" font-size=\"10.2\" font-weight=\"700\" fill=\"#C00000\">parámetros (el α del suavizado)</text>\n\n  <!-- MAPE -->\n  <rect x=\"498\" y=\"268\" width=\"208\" height=\"270\" rx=\"6\" fill=\"#fff\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"512\" y=\"290\" font-size=\"14\" font-weight=\"700\" fill=\"#8A5A16\">MAPE</text>\n  <text x=\"512\" y=\"306\" font-size=\"10\" fill=\"#666\">% de Error Medio Absoluto</text>\n  <text x=\"530\" y=\"336\" font-size=\"12\" fill=\"#8A5A16\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Σ |(Yₜ − Ŷₜ)/Yₜ|</text>\n  <line x1=\"524\" y1=\"343\" x2=\"680\" y2=\"343\" stroke=\"#8A5A16\" stroke-width=\"1.4\"/>\n  <text x=\"588\" y=\"362\" font-size=\"12\" fill=\"#8A5A16\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">n</text>\n  <text x=\"640\" y=\"352\" font-size=\"11\" fill=\"#8A5A16\" font-weight=\"700\">× 100</text>\n  <text x=\"512\" y=\"388\" font-size=\"10.8\" fill=\"#333\">Divide cada error por el valor real</text>\n  <text x=\"512\" y=\"403\" font-size=\"10.8\" fill=\"#333\">→ queda en <tspan font-weight=\"700\">PORCENTAJE</tspan>.</text>\n  <rect x=\"510\" y=\"412\" width=\"184\" height=\"52\" rx=\"4\" fill=\"#FBF6EE\"/>\n  <text x=\"520\" y=\"428\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">★ SU SUPERPODER:</text>\n  <text x=\"520\" y=\"443\" font-size=\"10\" fill=\"#333\">permite comparar SERIES DISTINTAS</text>\n  <text x=\"520\" y=\"457\" font-size=\"9.5\" fill=\"#666\" font-style=\"italic\">(panadería vs. automotriz)</text>\n  <text x=\"512\" y=\"482\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">CUÁNDO:</text>\n  <text x=\"512\" y=\"497\" font-size=\"10.2\" fill=\"#333\">comparar entre series o fijar</text>\n  <text x=\"512\" y=\"510\" font-size=\"10.2\" fill=\"#333\">objetivos (“MAPE &lt; 10%”).</text>\n  <text x=\"512\" y=\"528\" font-size=\"10\" fill=\"#C00000\" font-weight=\"700\">⚠ explota si algún Yₜ ≈ 0</text>\n\n  <!-- PME -->\n  <rect x=\"718\" y=\"268\" width=\"204\" height=\"270\" rx=\"6\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"2\"/>\n  <text x=\"732\" y=\"290\" font-size=\"14\" font-weight=\"700\" fill=\"#9C3838\">PME</text>\n  <text x=\"732\" y=\"306\" font-size=\"10\" fill=\"#666\">Porcentaje Medio de Error</text>\n  <text x=\"748\" y=\"336\" font-size=\"12\" fill=\"#9C3838\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Σ (Yₜ − Ŷₜ)/Yₜ</text>\n  <line x1=\"742\" y1=\"343\" x2=\"896\" y2=\"343\" stroke=\"#9C3838\" stroke-width=\"1.4\"/>\n  <text x=\"806\" y=\"362\" font-size=\"12\" fill=\"#9C3838\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">n</text>\n  <text x=\"856\" y=\"352\" font-size=\"11\" fill=\"#9C3838\" font-weight=\"700\">× 100</text>\n  <text x=\"732\" y=\"386\" font-size=\"10.8\" font-weight=\"700\" fill=\"#C00000\">SIN valor absoluto ⇒ mide SESGO</text>\n  <text x=\"732\" y=\"406\" font-size=\"10.5\" fill=\"#1E6B33\" font-weight=\"700\">≈ 0 → centrado ✔</text>\n  <text x=\"732\" y=\"422\" font-size=\"10.5\" fill=\"#333\"><tspan font-weight=\"700\">+ grande</tspan> → subestima siempre</text>\n  <text x=\"732\" y=\"438\" font-size=\"10.5\" fill=\"#333\"><tspan font-weight=\"700\">− grande</tspan> → sobreestima siempre</text>\n  <rect x=\"730\" y=\"446\" width=\"180\" height=\"84\" rx=\"4\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"740\" y=\"462\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">★ LA MÁS REVELADORA:</text>\n  <text x=\"740\" y=\"477\" font-size=\"9.8\" fill=\"#333\">PME alto NO dice “impreciso”,</text>\n  <text x=\"740\" y=\"490\" font-size=\"9.8\" fill=\"#333\">dice <tspan font-weight=\"700\">“se le escapa un patrón”</tspan>.</text>\n  <text x=\"740\" y=\"507\" font-size=\"9.5\" fill=\"#666\" font-style=\"italic\">Suavizado simple sobre serie con</text>\n  <text x=\"740\" y=\"519\" font-size=\"9.5\" fill=\"#666\" font-style=\"italic\">tendencia → PME+ ⇒ pasar a HOLT</text>\n\n  <!-- ===== EJEMPLO COMPARATIVO ===== -->\n  <rect x=\"40\" y=\"566\" width=\"900\" height=\"256\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"590\" font-size=\"14\" font-weight=\"700\" fill=\"#8A5A16\">Ejemplo comparativo — dos métodos sobre la misma serie (6 meses)</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"600\" width=\"400\" height=\"18\" fill=\"#8A5A16\"/>\n    <text x=\"66\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Mes</text><text x=\"120\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Real</text><text x=\"185\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Mét. A</text><text x=\"250\" y=\"613\" fill=\"#fff\" font-weight=\"700\">e_A</text><text x=\"310\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Mét. B</text><text x=\"395\" y=\"613\" fill=\"#fff\" font-weight=\"700\">e_B</text>\n    <text x=\"66\" y=\"631\" fill=\"#333\">1</text><text x=\"120\" y=\"631\" fill=\"#333\">100</text><text x=\"185\" y=\"631\" fill=\"#333\">95</text><text x=\"250\" y=\"631\" fill=\"#1E6B33\">+5</text><text x=\"310\" y=\"631\" fill=\"#333\">90</text><text x=\"395\" y=\"631\" fill=\"#1E6B33\">+10</text>\n    <text x=\"66\" y=\"647\" fill=\"#333\">2</text><text x=\"120\" y=\"647\" fill=\"#333\">110</text><text x=\"185\" y=\"647\" fill=\"#333\">105</text><text x=\"250\" y=\"647\" fill=\"#1E6B33\">+5</text><text x=\"310\" y=\"647\" fill=\"#333\">108</text><text x=\"395\" y=\"647\" fill=\"#1E6B33\">+2</text>\n    <text x=\"66\" y=\"663\" fill=\"#333\">3</text><text x=\"120\" y=\"663\" fill=\"#333\">105</text><text x=\"185\" y=\"663\" fill=\"#333\">108</text><text x=\"250\" y=\"663\" fill=\"#C00000\">−3</text><text x=\"310\" y=\"663\" fill=\"#333\">112</text><text x=\"395\" y=\"663\" fill=\"#C00000\">−7</text>\n    <text x=\"66\" y=\"679\" fill=\"#333\">4</text><text x=\"120\" y=\"679\" fill=\"#333\">120</text><text x=\"185\" y=\"679\" fill=\"#333\">112</text><text x=\"250\" y=\"679\" fill=\"#1E6B33\">+8</text><text x=\"310\" y=\"679\" fill=\"#333\">118</text><text x=\"395\" y=\"679\" fill=\"#1E6B33\">+2</text>\n    <text x=\"66\" y=\"695\" fill=\"#333\">5</text><text x=\"120\" y=\"695\" fill=\"#333\">115</text><text x=\"185\" y=\"695\" fill=\"#333\">118</text><text x=\"250\" y=\"695\" fill=\"#C00000\">−3</text><text x=\"310\" y=\"695\" fill=\"#333\">130</text><text x=\"395\" y=\"695\" fill=\"#C00000\" font-weight=\"700\">−15</text>\n    <text x=\"66\" y=\"711\" fill=\"#333\">6</text><text x=\"120\" y=\"711\" fill=\"#333\">125</text><text x=\"185\" y=\"711\" fill=\"#333\">120</text><text x=\"250\" y=\"711\" fill=\"#1E6B33\">+5</text><text x=\"310\" y=\"711\" fill=\"#333\">122</text><text x=\"395\" y=\"711\" fill=\"#1E6B33\">+3</text>\n  </g>\n\n  <g font-size=\"11\">\n    <rect x=\"476\" y=\"600\" width=\"200\" height=\"18\" fill=\"#1F4E79\"/>\n    <text x=\"486\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Medida</text><text x=\"570\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Mét. A</text><text x=\"630\" y=\"613\" fill=\"#fff\" font-weight=\"700\">Mét. B</text>\n    <text x=\"486\" y=\"633\" fill=\"#333\" font-weight=\"700\">MAD</text><text x=\"570\" y=\"633\" fill=\"#1E6B33\" font-weight=\"700\">4,83</text><text x=\"630\" y=\"633\" fill=\"#333\">6,50</text>\n    <text x=\"486\" y=\"653\" fill=\"#333\" font-weight=\"700\">MSE</text><text x=\"570\" y=\"653\" fill=\"#1E6B33\" font-weight=\"700\">26,2</text><text x=\"630\" y=\"653\" fill=\"#C00000\" font-weight=\"700\">65,2</text>\n    <text x=\"486\" y=\"673\" fill=\"#333\" font-weight=\"700\">MAPE</text><text x=\"570\" y=\"673\" fill=\"#1E6B33\" font-weight=\"700\">4,3%</text><text x=\"630\" y=\"673\" fill=\"#333\">5,9%</text>\n    <text x=\"486\" y=\"693\" fill=\"#333\" font-weight=\"700\">PME</text><text x=\"570\" y=\"693\" fill=\"#333\">+2,5%</text><text x=\"630\" y=\"693\" fill=\"#1E6B33\" font-weight=\"700\">−0,6%</text>\n    <text x=\"486\" y=\"713\" fill=\"#888\" font-size=\"9.5\" font-style=\"italic\">verde = mejor en esa medida</text>\n  </g>\n\n  <rect x=\"56\" y=\"724\" width=\"868\" height=\"86\" rx=\"6\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"68\" y=\"742\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">★ Interpretación — así se redacta en el examen:</text>\n  <text x=\"68\" y=\"760\" font-size=\"10.3\" fill=\"#333\" font-style=\"italic\">“El método A presenta menor error en las tres medidas de precisión (MAD 4,83 vs. 6,50; MSE 26,2 vs. 65,2; MAPE 4,3% vs. 5,9%), por lo que resulta</text>\n  <text x=\"68\" y=\"774\" font-size=\"10.3\" fill=\"#333\" font-style=\"italic\">más preciso. La diferencia es especialmente marcada en el MSE, lo que indica que B produce errores grandes ocasionales (mes 5: −15). En cuanto</text>\n  <text x=\"68\" y=\"788\" font-size=\"10.3\" fill=\"#333\" font-style=\"italic\">al sesgo, B está mejor centrado (PME −0,6% vs. +2,5%), lo que sugiere que A tiende a subestimar levemente. Se recomienda A por su mayor</text>\n  <text x=\"68\" y=\"802\" font-size=\"10.3\" fill=\"#333\" font-style=\"italic\">precisión, monitoreando la tendencia a subestimar.”</text>\n\n  <!-- ===== VALIDACION + RASTREO ===== -->\n  <rect x=\"40\" y=\"836\" width=\"450\" height=\"140\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"858\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">Procedimiento de validación (Hanke cap. 5)</text>\n  <text x=\"56\" y=\"878\" font-size=\"10.8\" fill=\"#333\">① Elegir método según el patrón (árbol Clase 3.a)</text>\n  <text x=\"56\" y=\"894\" font-size=\"10.8\" fill=\"#333\">② Partir datos: <tspan font-weight=\"700\">inicialización</tspan> + <tspan font-weight=\"700\">prueba</tspan></text>\n  <text x=\"56\" y=\"910\" font-size=\"10.8\" fill=\"#333\">③ Ajustar el método con la inicialización</text>\n  <text x=\"56\" y=\"926\" font-size=\"10.8\" fill=\"#333\">④ Pronosticar la prueba y medir el error ahí</text>\n  <text x=\"56\" y=\"942\" font-size=\"10.8\" fill=\"#333\">⑤ Decidir: usar, modificar o cambiar de método</text>\n  <text x=\"56\" y=\"964\" font-size=\"10.2\" fill=\"#1E6B33\" font-weight=\"700\">Lógica: medir sobre los datos con que ajustaste = hacer trampa.</text>\n\n  <rect x=\"504\" y=\"836\" width=\"436\" height=\"140\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"520\" y=\"858\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">Señal de rastreo</text>\n  <text x=\"520\" y=\"878\" font-size=\"10.8\" fill=\"#333\">Un método que hoy funciona puede dejar de servir</text>\n  <text x=\"520\" y=\"893\" font-size=\"10.8\" fill=\"#333\">(cambió el mercado, entró un competidor).</text>\n  <text x=\"520\" y=\"913\" font-size=\"10.8\" fill=\"#333\">Es un <tspan font-weight=\"700\">control continuo</tspan>: se monitorea el error y se</text>\n  <text x=\"520\" y=\"928\" font-size=\"10.8\" fill=\"#333\">fijan límites; al rebasarlos, se <tspan font-weight=\"700\">alerta al pronosticador</tspan>.</text>\n  <text x=\"520\" y=\"950\" font-size=\"10.5\" fill=\"#5B3E8E\" font-weight=\"700\">Versión simple: contar subestimaciones (U) de los últimos n.</text>\n  <text x=\"520\" y=\"965\" font-size=\"10.5\" fill=\"#333\">Si el método está sano, U ≈ n/2. Muy lejos de n/2 → sesgo.</text>\n\n  <!-- PIE EJERCICIO -->\n  <rect x=\"40\" y=\"990\" width=\"900\" height=\"72\" rx=\"6\" fill=\"#FAFAFA\" stroke=\"#CCC\"/>\n  <text x=\"56\" y=\"1010\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">EJERCICIO — Real: 200, 210, 225, 230, 245 · Método X: 190, 198, 205, 215, 222 · Método Y: 205, 202, 230, 222, 250</text>\n  <text x=\"56\" y=\"1028\" font-size=\"10.8\" fill=\"#555\">a) tabla con e, |e|, e², |e/Y|   b) MAD, MSE, MAPE y PME de ambos   c) ¿cuál es más preciso? ¿cuál mejor centrado?</text>\n  <text x=\"56\" y=\"1046\" font-size=\"10.8\" fill=\"#555\">d) ★ mirá el PME de X y la evolución de los datos reales: ¿qué te dice? ¿qué TIPO de método parece X y qué le cambiarías?   e) conclusión redactada</text>\n</svg>"},{"type":"svg","file":"u2/img/ArbolDecisorio_MetodosPronostico.svg","caption":"Árbol decisorio de métodos de pronóstico","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 1360\" width=\"1000\" height=\"1360\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"a1\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"a2\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#888\"/></marker>\n  </defs>\n  <rect width=\"1000\" height=\"1360\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">ÁRBOL DECISORIO · ¿Qué método de pronóstico uso?</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina complementaria Clase 3.a — U2 · La respuesta a “justifique la metodología aplicada”</text>\n\n  <rect x=\"40\" y=\"68\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">REGLA MADRE: graficar la serie SIEMPRE antes de decidir. Con pocos datos, graficar es obligatorio. El gráfico manda sobre cualquier fórmula.</text>\n\n  <!-- ===== NIVEL 0 ===== -->\n  <rect x=\"380\" y=\"116\" width=\"240\" height=\"42\" rx=\"21\" fill=\"#1F4E79\"/>\n  <text x=\"500\" y=\"142\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Necesito pronosticar</text>\n\n  <line x1=\"500\" y1=\"158\" x2=\"500\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"770\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"230\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"770\" y1=\"176\" x2=\"770\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- PREGUNTA 1 -->\n  <text x=\"500\" y=\"170\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\" text-anchor=\"middle\">① ¿Tengo datos históricos suficientes y representativos?</text>\n\n  <!-- RAMA NO: CUALITATIVOS -->\n  <rect x=\"700\" y=\"200\" width=\"260\" height=\"152\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"716\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">NO → MÉTODOS CUALITATIVOS</text>\n  <text x=\"716\" y=\"240\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Se basan en juicio e intuición, no en datos</text>\n  <text x=\"716\" y=\"260\" font-size=\"10.8\" fill=\"#333\">· Delphi (panel de expertos anónimo)</text>\n  <text x=\"716\" y=\"276\" font-size=\"10.8\" fill=\"#333\">· Investigación de mercado / encuestas</text>\n  <text x=\"716\" y=\"292\" font-size=\"10.8\" fill=\"#333\">· Analogía histórica (producto similar)</text>\n  <text x=\"716\" y=\"308\" font-size=\"10.8\" fill=\"#333\">· Consenso de comité / fuerza de ventas</text>\n  <text x=\"716\" y=\"330\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Cuándo: producto nuevo, sin historia,</text>\n  <text x=\"716\" y=\"345\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">o largo plazo (&gt; 2 años)</text>\n\n  <!-- RAMA SI: CUANTITATIVOS -->\n  <rect x=\"60\" y=\"200\" width=\"580\" height=\"60\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SÍ → MÉTODOS CUANTITATIVOS</text>\n  <text x=\"76\" y=\"242\" font-size=\"11\" fill=\"#333\">② ¿Explico la serie con SU PROPIO pasado, o con OTRAS variables?</text>\n  <text x=\"76\" y=\"256\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">(en la práctica se combinan: lo cuantitativo se ajusta con juicio experto)</text>\n\n  <line x1=\"200\" y1=\"260\" x2=\"200\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"500\" y1=\"260\" x2=\"500\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- CAUSALES -->\n  <rect x=\"360\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"376\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#9C3838\">CAUSALES / EXPLICATIVOS</text>\n  <text x=\"376\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Las ventas dependen de X” (precio,</text>\n  <text x=\"376\" y=\"343\" font-size=\"10.8\" fill=\"#333\">publicidad, PBI, temperatura…)</text>\n  <text x=\"376\" y=\"363\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión simple (1 variable X)</text>\n  <text x=\"376\" y=\"379\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión múltiple (varias X)</text>\n  <text x=\"376\" y=\"396\" font-size=\"10.5\" fill=\"#666\">· Modelos econométricos · indicadores</text>\n\n  <!-- SERIES DE TIEMPO -->\n  <rect x=\"60\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SERIES DE TIEMPO</text>\n  <text x=\"76\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Proyecto el patrón que la serie</text>\n  <text x=\"76\" y=\"343\" font-size=\"10.8\" fill=\"#333\">viene mostrando en el tiempo”</text>\n  <text x=\"76\" y=\"366\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">③ ¿QUÉ PATRÓN tiene la serie?</text>\n  <text x=\"76\" y=\"384\" font-size=\"10.5\" fill=\"#666\">→ mirar el gráfico y el correlograma</text>\n  <text x=\"76\" y=\"399\" font-size=\"10.5\" fill=\"#666\">→ bajar a los 4 casos de abajo ↓</text>\n\n  <line x1=\"200\" y1=\"408\" x2=\"200\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"880\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"120\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"373\" y1=\"430\" x2=\"373\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"627\" y1=\"430\" x2=\"627\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"880\" y1=\"430\" x2=\"880\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- ===== CASO A: ESTACIONARIA ===== -->\n  <rect x=\"40\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"54\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">A · ESTACIONARIA</text>\n  <text x=\"54\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">promedio constante, sin rumbo</text>\n  <line x1=\"58\" y1=\"536\" x2=\"58\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"536\" x2=\"248\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"520\" x2=\"248\" y2=\"520\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <polyline points=\"64,526 88,512 112,528 136,514 160,530 184,512 208,524 236,516\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n\n  <text x=\"54\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">MÉTODOS:</text>\n  <text x=\"54\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Promedio simple (todo el historial)</text>\n  <text x=\"54\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil de orden n</text>\n  <text x=\"54\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Suavizado exponencial simple (SES)</tspan></text>\n  <text x=\"54\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Métodos ingenuos: Ŷₜ₊₁ = Yₜ</text>\n  <text x=\"54\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins (ARIMA)</text>\n\n  <rect x=\"52\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <text x=\"62\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\">Elegir n / α:</text>\n  <text x=\"62\" y=\"683\" font-size=\"9.8\" fill=\"#333\">n grande o α chico → más suave</text>\n  <text x=\"62\" y=\"697\" font-size=\"9.8\" fill=\"#333\">n chico o α grande → más reactivo</text>\n\n  <text x=\"54\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"54\" y=\"744\" font-size=\"10\" fill=\"#333\">· Panadería de barrio estable</text>\n  <text x=\"54\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto maduro sin cambios</text>\n  <text x=\"54\" y=\"772\" font-size=\"10\" fill=\"#333\">· Repuestos de demanda pareja</text>\n\n  <!-- ===== CASO B: TENDENCIA ===== -->\n  <rect x=\"274\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">B · TENDENCIA</text>\n  <text x=\"288\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">sube o baja sostenidamente</text>\n  <line x1=\"292\" y1=\"536\" x2=\"292\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"292\" y1=\"536\" x2=\"482\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"298,530 326,522 354,514 382,506 410,514 438,500 466,492\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n\n  <text x=\"288\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODOS:</text>\n  <text x=\"288\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Holt</tspan> (suav. exp. 2 parámetros α, β)</text>\n  <text x=\"288\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Brown (suav. exp. doble, 1 parám.)</text>\n  <text x=\"288\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil doble</text>\n  <text x=\"288\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión simple contra el tiempo</text>\n  <text x=\"288\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Gompertz, curvas de crecimiento</text>\n\n  <rect x=\"286\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"296\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1F4E79\">Holt vs. Brown:</text>\n  <text x=\"296\" y=\"683\" font-size=\"9.8\" fill=\"#333\">Brown usa un solo α → tendencia</text>\n  <text x=\"296\" y=\"697\" font-size=\"9.8\" fill=\"#333\">sensible al ruido. Holt separa β → mejor.</text>\n\n  <text x=\"288\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"288\" y=\"744\" font-size=\"10\" fill=\"#333\">· Suscripciones de una app en alza</text>\n  <text x=\"288\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto en etapa de crecimiento</text>\n  <text x=\"288\" y=\"772\" font-size=\"10\" fill=\"#333\">· Serie inflacionada año a año</text>\n\n  <!-- ===== CASO C: ESTACIONALIDAD ===== -->\n  <rect x=\"508\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#8A5A16\" stroke-width=\"2\"/>\n  <text x=\"522\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · ESTACIONALIDAD</text>\n  <text x=\"522\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">patrón fijo que se repite cada año</text>\n  <line x1=\"526\" y1=\"536\" x2=\"526\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"526\" y1=\"536\" x2=\"716\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 532 528 L 548 508 L 564 528 L 580 530 L 596 508 L 612 528 L 628 530 L 644 506 L 660 528 L 676 530 L 700 508\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2\"/>\n\n  <text x=\"522\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">MÉTODOS:</text>\n  <text x=\"522\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Winter</tspan> (suav. exp. 3 parám. α, β, γ)</text>\n  <text x=\"522\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Descomposición clásica</tspan> (multiplicativa)</text>\n  <text x=\"522\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Desestacionalizar → pronosticar →</text>\n  <text x=\"532\" y=\"622\" font-size=\"10.8\" fill=\"#333\">re-estacionalizar</text>\n  <text x=\"522\" y=\"638\" font-size=\"10.5\" fill=\"#666\">· Regresión múltiple con dummies · Census II</text>\n\n  <rect x=\"520\" y=\"648\" width=\"198\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"530\" y=\"666\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">Ojo con L y la cantidad de datos:</text>\n  <text x=\"530\" y=\"681\" font-size=\"9.8\" fill=\"#333\">L=4 (trim.) · L=12 (mens.) · L=7 (diario)</text>\n  <text x=\"530\" y=\"695\" font-size=\"9.8\" fill=\"#333\">Winter necesita ≥ 2 ciclos completos</text>\n\n  <text x=\"522\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"522\" y=\"744\" font-size=\"10\" fill=\"#333\">· Heladería / aires acondicionados</text>\n  <text x=\"522\" y=\"758\" font-size=\"10\" fill=\"#333\">· Ventas de diciembre, útiles escolares</text>\n  <text x=\"522\" y=\"772\" font-size=\"10\" fill=\"#333\">· Consumo eléctrico</text>\n\n  <!-- ===== CASO D: CICLO ===== -->\n  <rect x=\"742\" y=\"456\" width=\"218\" height=\"330\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"756\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">D · CICLO</text>\n  <text x=\"756\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">ondas plurianuales, período variable</text>\n  <line x1=\"760\" y1=\"536\" x2=\"760\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"760\" y1=\"536\" x2=\"946\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 766 518 C 792 496, 812 496, 834 522 C 858 548, 882 546, 906 512 C 916 498, 926 494, 936 492\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n\n  <text x=\"756\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#5B3E8E\">MÉTODOS:</text>\n  <text x=\"756\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Descomposición clásica</text>\n  <text x=\"756\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Indicadores económicos (líderes)</text>\n  <text x=\"756\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Modelos econométricos</text>\n  <text x=\"756\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión múltiple</text>\n  <text x=\"756\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins</text>\n\n  <rect x=\"754\" y=\"650\" width=\"196\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"764\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">⚠ El más difícil de todos:</text>\n  <text x=\"764\" y=\"683\" font-size=\"9.8\" fill=\"#333\">no tiene período fijo → los métodos</text>\n  <text x=\"764\" y=\"697\" font-size=\"9.8\" fill=\"#333\">de suavizado NO capturan giros bruscos</text>\n\n  <text x=\"756\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"756\" y=\"744\" font-size=\"10\" fill=\"#333\">· Construcción, acero, automotriz</text>\n  <text x=\"756\" y=\"758\" font-size=\"10\" fill=\"#333\">· Bienes durables y de capital</text>\n  <text x=\"756\" y=\"772\" font-size=\"10\" fill=\"#333\">· Cualquier serie ligada al PBI</text>\n\n  <!-- ===== CASO COMBINADO ===== -->\n  <rect x=\"40\" y=\"800\" width=\"920\" height=\"96\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">★ EL CASO MÁS FRECUENTE EN EXAMEN: TENDENCIA **+** ESTACIONALIDAD (los patrones se combinan)</text>\n  <text x=\"56\" y=\"844\" font-size=\"11.5\" fill=\"#333\">Si la serie sube año a año Y además repite picos estacionales → <tspan font-weight=\"700\" fill=\"#C00000\">WINTER</tspan> (captura ambos) o <tspan font-weight=\"700\" fill=\"#C00000\">DESCOMPOSICIÓN</tspan> (los separa y proyecta por partes).</text>\n  <text x=\"56\" y=\"864\" font-size=\"11.5\" fill=\"#333\">Alternativa válida y muy defendible: <tspan font-weight=\"700\">desestacionalizar</tspan> la serie → aplicar Holt a la serie sin estacionalidad → <tspan font-weight=\"700\">re-estacionalizar</tspan> el pronóstico.</text>\n  <text x=\"56\" y=\"884\" font-size=\"11\" fill=\"#8A5A16\" font-style=\"italic\">Nunca usar suavizado simple ni promedio móvil acá: van siempre “atrás” de la serie y subestiman sistemáticamente (sesgo visible en el PME).</text>\n\n  <!-- ===== FACTORES ADICIONALES ===== -->\n  <rect x=\"40\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">④ Otros factores que inclinan la elección</text>\n\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">HORIZONTE:</text>\n  <text x=\"66\" y=\"970\" font-size=\"10.5\" fill=\"#333\">· Corto plazo (días–meses) → suavizados, promedios</text>\n  <text x=\"66\" y=\"985\" font-size=\"10.5\" fill=\"#333\">· Mediano (meses–2 años) → regresión, descomposición</text>\n  <text x=\"66\" y=\"1000\" font-size=\"10.5\" fill=\"#333\">· Largo plazo (&gt;2 años) → cualitativos, econométricos</text>\n\n  <text x=\"56\" y=\"1022\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">CANTIDAD DE DATOS:</text>\n  <text x=\"66\" y=\"1038\" font-size=\"10.5\" fill=\"#333\">· Muy pocos → ingenuos o promedio simple (y graficar!)</text>\n  <text x=\"66\" y=\"1053\" font-size=\"10.5\" fill=\"#333\">· Winter/descomposición exigen ≥2 ciclos completos</text>\n\n  <text x=\"56\" y=\"1075\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">OTROS CRITERIOS (Hanke):</text>\n  <text x=\"66\" y=\"1091\" font-size=\"10.5\" fill=\"#333\">· Costo del método vs. beneficio del pronóstico</text>\n  <text x=\"66\" y=\"1106\" font-size=\"10.5\" fill=\"#333\">· Facilidad de comprensión para quien decide</text>\n  <text x=\"66\" y=\"1121\" font-size=\"10.5\" fill=\"#333\">· Precisión requerida y confiabilidad</text>\n\n  <!-- ===== VALIDACION ===== -->\n  <rect x=\"510\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"526\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">⑤ Elegido el método… ¡hay que VALIDARLO!</text>\n  <text x=\"526\" y=\"952\" font-size=\"11\" fill=\"#333\">El árbol propone candidatos; la <tspan font-weight=\"700\">medida de error decide</tspan>.</text>\n\n  <text x=\"526\" y=\"976\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">Procedimiento (Hanke cap. 5):</text>\n  <text x=\"536\" y=\"992\" font-size=\"10.5\" fill=\"#333\">① Partir los datos: inicialización + prueba</text>\n  <text x=\"536\" y=\"1007\" font-size=\"10.5\" fill=\"#333\">② Ajustar el método con la parte de inicialización</text>\n  <text x=\"536\" y=\"1022\" font-size=\"10.5\" fill=\"#333\">③ Pronosticar la parte de prueba y medir el error</text>\n  <text x=\"536\" y=\"1037\" font-size=\"10.5\" fill=\"#333\">④ Comparar contra un método alternativo</text>\n  <text x=\"536\" y=\"1052\" font-size=\"10.5\" fill=\"#333\">⑤ Decidir: usarlo, ajustarlo o cambiarlo</text>\n\n  <rect x=\"526\" y=\"1062\" width=\"418\" height=\"56\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"536\" y=\"1080\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">Qué mirar en los errores:</text>\n  <text x=\"536\" y=\"1095\" font-size=\"10\" fill=\"#333\">MAD/MSE/MAPE bajos = buen ajuste · <tspan font-weight=\"700\">PME ≈ 0 = sin sesgo</tspan></text>\n  <text x=\"536\" y=\"1110\" font-size=\"10\" fill=\"#333\">Si el PME es grande y del mismo signo → el método pierde un patrón</text>\n\n  <!-- ===== EJEMPLOS RESUELTOS ===== -->\n  <rect x=\"40\" y=\"1142\" width=\"920\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"1164\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">DIAGNÓSTICOS RESUELTOS — así se redacta la justificación en el examen</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"1174\" width=\"888\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"66\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Serie</text>\n    <text x=\"330\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Diagnóstico</text>\n    <text x=\"600\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Método y justificación</text>\n\n    <rect x=\"56\" y=\"1194\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1210\" fill=\"#333\">Ventas parejas 900–1.100 kg hace 10 años</text>\n    <text x=\"330\" y=\"1210\" fill=\"#333\">estacionaria, solo irregularidad</text>\n    <text x=\"600\" y=\"1210\" fill=\"#1E6B33\" font-weight=\"700\">SES o promedio móvil: no hay patrón que proyectar</text>\n\n    <rect x=\"56\" y=\"1218\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1234\" fill=\"#333\">App: 1.000 → 2.290 creciendo parejo</text>\n    <text x=\"330\" y=\"1234\" fill=\"#333\">tendencia lineal, sin estacionalidad</text>\n    <text x=\"600\" y=\"1234\" fill=\"#1F4E79\" font-weight=\"700\">Holt o regresión vs. tiempo: capturan la pendiente</text>\n\n    <rect x=\"56\" y=\"1242\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1258\" fill=\"#333\">Heladería trimestral, picos en T1 y T4, subiendo</text>\n    <text x=\"330\" y=\"1258\" fill=\"#333\">tendencia + estacionalidad (L=4)</text>\n    <text x=\"600\" y=\"1258\" fill=\"#C00000\" font-weight=\"700\">WINTER o descomposición multiplicativa</text>\n\n    <rect x=\"56\" y=\"1266\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1282\" fill=\"#333\">Constructora: sube, se derrumba 3 años, se recupera</text>\n    <text x=\"330\" y=\"1282\" fill=\"#333\">ciclo dominante (+ tendencia)</text>\n    <text x=\"600\" y=\"1282\" fill=\"#5B3E8E\" font-weight=\"700\">Descomposición o indicadores económicos; no suavizado</text>\n\n    <rect x=\"56\" y=\"1290\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1306\" fill=\"#333\">Producto nuevo, sin historia</text>\n    <text x=\"330\" y=\"1306\" fill=\"#333\">sin datos utilizables</text>\n    <text x=\"600\" y=\"1306\" fill=\"#5B3E8E\" font-weight=\"700\">Cualitativo: Delphi, analogía histórica, investigación</text>\n\n    <rect x=\"56\" y=\"1314\" width=\"888\" height=\"22\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1329\" fill=\"#333\">Ventas explicadas por publicidad y precio</text>\n    <text x=\"330\" y=\"1329\" fill=\"#333\">relación causal con otras variables</text>\n    <text x=\"600\" y=\"1329\" fill=\"#9C3838\" font-weight=\"700\">Regresión múltiple (revisar colinealidad y residuos)</text>\n  </g>\n</svg>"},{"type":"paragraph","text":"El **residual** o **error de pronóstico**: lo real menos lo pronosticado, período por período.","html":"El <strong>residual</strong> o <strong>error de pronóstico</strong>: lo real menos lo pronosticado, período por período."},{"type":"paragraph","text":"**El signo importa:**","html":"<strong>El signo importa:</strong>"},{"type":"table","headers":["Signo","Significa"],"rows":[["---","---"],["**e positivo**","vendiste MÁS de lo previsto → **subestimaste**"],["**e negativo**","vendiste MENOS de lo previsto → **sobreestimaste**"]],"headersHtml":["Signo","Significa"],"rowsHtml":[["---","---"],["<strong>e positivo</strong>","vendiste MÁS de lo previsto → <strong>subestimaste</strong>"],["<strong>e negativo</strong>","vendiste MENOS de lo previsto → <strong>sobreestimaste</strong>"]]},{"type":"paragraph","text":"Las cuatro medidas son distintas maneras de promediar estos e.","html":"Las cuatro medidas son distintas maneras de promediar estos e."},{"type":"heading","level":2,"text":"3. Por qué hacen falta cuatro y no una","html":"3. Por qué hacen falta cuatro y no una"},{"type":"paragraph","text":"**El problema de promediar los errores crudos: se cancelan.** Si un mes te equivocás +50 y otro −50, el promedio da 0 y parecerías perfecto, cuando en realidad te equivocaste feo dos veces.","html":"<strong>El problema de promediar los errores crudos: se cancelan.</strong> Si un mes te equivocás +50 y otro −50, el promedio da 0 y parecerías perfecto, cuando en realidad te equivocaste feo dos veces."},{"type":"paragraph","text":"Hay **dos soluciones a la cancelación**:","html":"Hay <strong>dos soluciones a la cancelación</strong>:"},{"type":"list","ordered":false,"items":["**Valor absoluto** → MAD, MAPE","**Elevar al cuadrado** → MSE"],"itemsHtml":["<strong>Valor absoluto</strong> → MAD, MAPE","<strong>Elevar al cuadrado</strong> → MSE"]},{"type":"paragraph","text":"Y una medida que **aprovecha la cancelación a propósito** para medir sesgo: **PME**.","html":"Y una medida que <strong>aprovecha la cancelación a propósito</strong> para medir sesgo: <strong>PME</strong>."},{"type":"heading","level":2,"text":"4. Las cuatro medidas","html":"4. Las cuatro medidas"},{"type":"heading","level":3,"text":"4.1 MAD — Desviación Absoluta Media","html":"4.1 MAD — Desviación Absoluta Media"},{"type":"formula","tex":"MAD = \\frac{\\sum |Y_t - \\hat{Y}_t|}{n}","html":"<span class=\"eq-block\">MAD = <span class=\"frac\"><span class=\"num\">Σ |Y<sub>t</sub> - <span class=\"hat\">Y</span><sub>t</sub>|</span><span class=\"den\">n</span></span></span>"},{"type":"paragraph","text":"Le saca el signo a cada error y promedia. **La más intuitiva**: queda en las unidades originales.","html":"Le saca el signo a cada error y promedia. <strong>La más intuitiva</strong>: queda en las unidades originales."},{"type":"list","ordered":false,"items":["**Lectura:** *\"MAD = 15 unidades\"* → me equivoco típicamente en 15 unidades, para arriba o para abajo.","**Cuándo usarla:** cuando querés una medida fácil de comunicar y en unidades reales. Es también la base de la **señal de rastreo**."],"itemsHtml":["<strong>Lectura:</strong> <em>\"MAD = 15 unidades\"</em> → me equivoco típicamente en 15 unidades, para arriba o para abajo.","<strong>Cuándo usarla:</strong> cuando querés una medida fácil de comunicar y en unidades reales. Es también la base de la <strong>señal de rastreo</strong>."]},{"type":"heading","level":3,"text":"4.2 MSE — Error Cuadrático Medio","html":"4.2 MSE — Error Cuadrático Medio"},{"type":"formula","tex":"MSE = \\frac{\\sum (Y_t - \\hat{Y}_t)^2}{n}","html":"<span class=\"eq-block\">MSE = <span class=\"frac\"><span class=\"num\">Σ (Y<sub>t</sub> - <span class=\"hat\">Y</span><sub>t</sub>)<sup>2</sup></span><span class=\"den\">n</span></span></span>"},{"type":"paragraph","text":"Eleva cada error al cuadrado y promedia. Como el cuadrado agranda desproporcionadamente los números grandes, **castiga fuerte los errores grandes**.","html":"Eleva cada error al cuadrado y promedia. Como el cuadrado agranda desproporcionadamente los números grandes, <strong>castiga fuerte los errores grandes</strong>."},{"type":"paragraph","text":"**Ejemplo del castigo:**","html":"<strong>Ejemplo del castigo:</strong>"},{"type":"table","headers":["Caso","Errores","Error total","MSE"],"rows":[["---","---","---","---"],["A","10 y 10","20","(100+100)/2 = **100**"],["B","0 y 20","20","(0+400)/2 = **200**"]],"headersHtml":["Caso","Errores","Error total","MSE"],"rowsHtml":[["---","---","---","---"],["A","10 y 10","20","(100+100)/2 = <strong>100</strong>"],["B","0 y 20","20","(0+400)/2 = <strong>200</strong>"]]},{"type":"paragraph","text":"Mismo error total, pero B \"paga\" el doble.","html":"Mismo error total, pero B \"paga\" el doble."},{"type":"list","ordered":false,"items":["**Cuándo usarla:** cuando un error grande ocasional es mucho peor que varios chicos. *Quedarte sin stock un mes entero es catastrófico; equivocarte por poco todos los meses es tolerable.*","**★ Dato clave:** el MSE es el **criterio estándar para elegir los parámetros** de un método. Cuando en las próximas clases digamos *\"probamos α de 0,1 a 0,9 y elegimos el que minimiza el error\"*, ese error es el MSE.","**Ojo:** está en unidades **al cuadrado** → no es interpretable directamente. Sirve para comparar, no para comunicar."],"itemsHtml":["<strong>Cuándo usarla:</strong> cuando un error grande ocasional es mucho peor que varios chicos. <em>Quedarte sin stock un mes entero es catastrófico; equivocarte por poco todos los meses es tolerable.</em>","<strong>★ Dato clave:</strong> el MSE es el <strong>criterio estándar para elegir los parámetros</strong> de un método. Cuando en las próximas clases digamos <em>\"probamos α de 0,1 a 0,9 y elegimos el que minimiza el error\"</em>, ese error es el MSE.","<strong>Ojo:</strong> está en unidades <strong>al cuadrado</strong> → no es interpretable directamente. Sirve para comparar, no para comunicar."]},{"type":"heading","level":3,"text":"4.3 MAPE — Porcentaje de Error Medio Absoluto","html":"4.3 MAPE — Porcentaje de Error Medio Absoluto"},{"type":"formula","tex":"MAPE = \\frac{\\sum \\left|\\dfrac{Y_t - \\hat{Y}_t}{Y_t}\\right|}{n} \\times 100","html":"<span class=\"eq-block\">MAPE = <span class=\"frac\"><span class=\"num\">Σ |<span class=\"frac\"><span class=\"num\">Y<sub>t</sub> - <span class=\"hat\">Y</span><sub>t</sub></span><span class=\"den\">Y<sub>t</sub></span></span>|</span><span class=\"den\">n</span></span> × 100</span>"},{"type":"paragraph","text":"Cada error se divide por el valor real → queda en **porcentaje**.","html":"Cada error se divide por el valor real → queda en <strong>porcentaje</strong>."},{"type":"list","ordered":false,"items":["**Lectura:** *\"MAPE = 8%\"* → me equivoco en promedio un 8% respecto de lo que realmente pasó.","**★ Su superpoder:** permite **comparar series distintas**. Un MAD de 500 unidades es horrible para una panadería y excelente para una automotriz; el MAPE es comparable entre ambas. También sirve para fijar objetivos (\"MAPE menor al 10%\").","**Ojo:** explota si algún Yₜ es cero o muy chico (división por cero)."],"itemsHtml":["<strong>Lectura:</strong> <em>\"MAPE = 8%\"</em> → me equivoco en promedio un 8% respecto de lo que realmente pasó.","<strong>★ Su superpoder:</strong> permite <strong>comparar series distintas</strong>. Un MAD de 500 unidades es horrible para una panadería y excelente para una automotriz; el MAPE es comparable entre ambas. También sirve para fijar objetivos (\"MAPE menor al 10%\").","<strong>Ojo:</strong> explota si algún Yₜ es cero o muy chico (división por cero)."]},{"type":"heading","level":3,"text":"4.4 PME — Porcentaje Medio de Error","html":"4.4 PME — Porcentaje Medio de Error"},{"type":"formula","tex":"PME = \\frac{\\sum \\dfrac{Y_t - \\hat{Y}_t}{Y_t}}{n} \\times 100","html":"<span class=\"eq-block\">PME = <span class=\"frac\"><span class=\"num\">Σ <span class=\"frac\"><span class=\"num\">Y<sub>t</sub> - <span class=\"hat\">Y</span><sub>t</sub></span><span class=\"den\">Y<sub>t</sub></span></span></span><span class=\"den\">n</span></span> × 100</span>"},{"type":"paragraph","text":"Idéntica al MAPE **pero SIN valor absoluto**. Al dejar que los errores se cancelen, mide lo que las otras esconden: **el SESGO**.","html":"Idéntica al MAPE <strong>pero SIN valor absoluto</strong>. Al dejar que los errores se cancelen, mide lo que las otras esconden: <strong>el SESGO</strong>."},{"type":"table","headers":["PME","Significa"],"rows":[["---","---"],["**≈ 0**","método **centrado**, se equivoca parejo para ambos lados ✔"],["**positivo y grande**","**subestima sistemáticamente** (siempre pronostica menos de lo que pasa)"],["**negativo y grande**","**sobreestima sistemáticamente**"]],"headersHtml":["PME","Significa"],"rowsHtml":[["---","---"],["<strong>≈ 0</strong>","método <strong>centrado</strong>, se equivoca parejo para ambos lados ✔"],["<strong>positivo y grande</strong>","<strong>subestima sistemáticamente</strong> (siempre pronostica menos de lo que pasa)"],["<strong>negativo y grande</strong>","<strong>sobreestima sistemáticamente</strong>"]]},{"type":"paragraph","text":"**★ Por qué es la más reveladora:** un PME grande no dice *\"el método es impreciso\"*, dice **\"al método se le está escapando un patrón\"**.","html":"<strong>★ Por qué es la más reveladora:</strong> un PME grande no dice <em>\"el método es impreciso\"</em>, dice <strong>\"al método se le está escapando un patrón\"</strong>."},{"type":"callout","kind":"idea","text":"**Caso típico:** aplicás suavizado exponencial simple a una serie con **tendencia creciente**. El método siempre va \"atrás\" de la serie, siempre pronostica de menos → **PME positivo consistente**. La solución NO es afinar el parámetro: es **cambiar a un método con tendencia (Holt)**.","html":"<strong>Caso típico:</strong> aplicás suavizado exponencial simple a una serie con <strong>tendencia creciente</strong>. El método siempre va \"atrás\" de la serie, siempre pronostica de menos → <strong>PME positivo consistente</strong>. La solución NO es afinar el parámetro: es <strong>cambiar a un método con tendencia (Holt)</strong>."},{"type":"heading","level":2,"text":"5. Ejemplo comparativo completo","html":"5. Ejemplo comparativo completo"},{"type":"paragraph","text":"Ventas reales y pronósticos de dos métodos, 6 meses:","html":"Ventas reales y pronósticos de dos métodos, 6 meses:"},{"type":"table","headers":["Mes","Real (Y)","Método A (Ŷ)","e_A","Método B (Ŷ)","e_B"],"rows":[["---","---","---","---","---","---"],["1","100","95","+5","90","+10"],["2","110","105","+5","108","+2"],["3","105","108","−3","112","−7"],["4","120","112","+8","118","+2"],["5","115","118","−3","130","−15"],["6","125","120","+5","122","+3"]],"headersHtml":["Mes","Real (Y)","Método A (Ŷ)","e_A","Método B (Ŷ)","e_B"],"rowsHtml":[["---","---","---","---","---","---"],["1","100","95","+5","90","+10"],["2","110","105","+5","108","+2"],["3","105","108","−3","112","−7"],["4","120","112","+8","118","+2"],["5","115","118","−3","130","−15"],["6","125","120","+5","122","+3"]]},{"type":"heading","level":3,"text":"Método A","html":"Método A"},{"type":"list","ordered":false,"items":["**MAD** = (5+5+3+8+3+5)/6 = 29/6 = **4,83**","**MSE** = (25+25+9+64+9+25)/6 = 157/6 = **26,2**","**MAPE** = (5,0+4,5+2,9+6,7+2,6+4,0)/6 ≈ **4,3%**","**PME** = (+5,0+4,5−2,9+6,7−2,6+4,0)/6 ≈ **+2,5%**"],"itemsHtml":["<strong>MAD</strong> = (5+5+3+8+3+5)/6 = 29/6 = <strong>4,83</strong>","<strong>MSE</strong> = (25+25+9+64+9+25)/6 = 157/6 = <strong>26,2</strong>","<strong>MAPE</strong> = (5,0+4,5+2,9+6,7+2,6+4,0)/6 ≈ <strong>4,3%</strong>","<strong>PME</strong> = (+5,0+4,5−2,9+6,7−2,6+4,0)/6 ≈ <strong>+2,5%</strong>"]},{"type":"heading","level":3,"text":"Método B","html":"Método B"},{"type":"list","ordered":false,"items":["**MAD** = (10+2+7+2+15+3)/6 = 39/6 = **6,50**","**MSE** = (100+4+49+4+225+9)/6 = 391/6 = **65,2**","**MAPE** = (10,0+1,8+6,7+1,7+13,0+2,4)/6 ≈ **5,9%**","**PME** = (+10,0+1,8−6,7+1,7−13,0+2,4)/6 ≈ **−0,6%**"],"itemsHtml":["<strong>MAD</strong> = (10+2+7+2+15+3)/6 = 39/6 = <strong>6,50</strong>","<strong>MSE</strong> = (100+4+49+4+225+9)/6 = 391/6 = <strong>65,2</strong>","<strong>MAPE</strong> = (10,0+1,8+6,7+1,7+13,0+2,4)/6 ≈ <strong>5,9%</strong>","<strong>PME</strong> = (+10,0+1,8−6,7+1,7−13,0+2,4)/6 ≈ <strong>−0,6%</strong>"]},{"type":"heading","level":3,"text":"Interpretación — así se redacta en el examen ★","html":"Interpretación — así se redacta en el examen ★"},{"type":"callout","kind":"idea","text":"*\"El método A presenta menor error en las tres medidas de precisión (MAD 4,83 vs. 6,50; MSE 26,2 vs. 65,2; MAPE 4,3% vs. 5,9%), por lo que resulta más preciso. La diferencia es especialmente marcada en el MSE, lo que indica que el método B produce errores grandes ocasionales (mes 5: −15). En cuanto al sesgo, el método B está mejor centrado (PME −0,6% vs. +2,5%), lo que sugiere que A tiende a subestimar levemente. Se recomienda el método A por su mayor precisión, monitoreando la tendencia a subestimar.\"*","html":"<em>\"El método A presenta menor error en las tres medidas de precisión (MAD 4,83 vs. 6,50; MSE 26,2 vs. 65,2; MAPE 4,3% vs. 5,9%), por lo que resulta más preciso. La diferencia es especialmente marcada en el MSE, lo que indica que el método B produce errores grandes ocasionales (mes 5: −15). En cuanto al sesgo, el método B está mejor centrado (PME −0,6% vs. +2,5%), lo que sugiere que A tiende a subestimar levemente. Se recomienda el método A por su mayor precisión, monitoreando la tendencia a subestimar.\"</em>"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 132\" width=\"100%\" height=\"132\" aria-hidden=\"true\"><text x=\"28\" y=\"12\" font-size=\"9\" fill=\"#1f4e79\" font-weight=\"700\">A</text><text x=\"52\" y=\"12\" font-size=\"9\" fill=\"#c45c26\" font-weight=\"700\">B</text><rect x=\"28\" y=\"57.98461538461538\" width=\"14\" height=\"52.01538461538462\" fill=\"#1f4e79\"/><rect x=\"46\" y=\"40.0\" width=\"14\" height=\"70.0\" fill=\"#c45c26\"/><line x1=\"22\" y1=\"110\" x2=\"68\" y2=\"110\" stroke=\"#d0d5db\" stroke-width=\"1\"/><text x=\"46\" y=\"126\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">MAD</text><text x=\"35\" y=\"24\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">4,83</text><text x=\"53\" y=\"24\" font-size=\"8\" fill=\"#c45c26\" text-anchor=\"middle\">6,50</text><rect x=\"94\" y=\"81.87116564417178\" width=\"14\" height=\"28.128834355828218\" fill=\"#1f4e79\"/><rect x=\"112\" y=\"40.0\" width=\"14\" height=\"70.0\" fill=\"#c45c26\"/><line x1=\"88\" y1=\"110\" x2=\"134\" y2=\"110\" stroke=\"#d0d5db\" stroke-width=\"1\"/><text x=\"112\" y=\"126\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">MSE</text><text x=\"101\" y=\"24\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">26,20</text><text x=\"119\" y=\"24\" font-size=\"8\" fill=\"#c45c26\" text-anchor=\"middle\">65,20</text><rect x=\"160\" y=\"58.98305084745763\" width=\"14\" height=\"51.01694915254237\" fill=\"#1f4e79\"/><rect x=\"178\" y=\"40.0\" width=\"14\" height=\"70.0\" fill=\"#c45c26\"/><line x1=\"154\" y1=\"110\" x2=\"200\" y2=\"110\" stroke=\"#d0d5db\" stroke-width=\"1\"/><text x=\"178\" y=\"126\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">MAPE %</text><text x=\"167\" y=\"24\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">4,30</text><text x=\"185\" y=\"24\" font-size=\"8\" fill=\"#c45c26\" text-anchor=\"middle\">5,90</text><rect x=\"226\" y=\"50.0\" width=\"14\" height=\"50.0\" fill=\"#1f4e79\"/><rect x=\"244\" y=\"100\" width=\"14\" height=\"12.0\" fill=\"#c45c26\"/><line x1=\"220\" y1=\"100\" x2=\"266\" y2=\"100\" stroke=\"#d0d5db\" stroke-width=\"1\"/><text x=\"244\" y=\"126\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">PME %</text><text x=\"233\" y=\"24\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">2,50</text><text x=\"251\" y=\"24\" font-size=\"8\" fill=\"#c45c26\" text-anchor=\"middle\">-0,60</text></svg>","caption":"Comparación del ejemplo (6 meses): A gana en MAD, MSE y MAPE (más preciso); B está un poco mejor centrado (PME más cerca de 0). El MSE de B se dispara por el error de −15 del mes 5."},{"type":"paragraph","text":"**Lo importante:** cada medida dice algo **distinto**. Usar las cuatro es lo que convierte una cuenta en una interpretación.","html":"<strong>Lo importante:</strong> cada medida dice algo <strong>distinto</strong>. Usar las cuatro es lo que convierte una cuenta en una interpretación."},{"type":"heading","level":2,"text":"6. El procedimiento de validación (Hanke, cap. 5)","html":"6. El procedimiento de validación (Hanke, cap. 5)"},{"type":"list","ordered":true,"items":["**Elegir un método** según el patrón de datos (árbol de la Clase 3.a).","**Partir los datos en dos**: parte de **inicialización** (para ajustar) y parte de **prueba** (que el método no vio).","**Ajustar** el método con la parte de inicialización.","**Pronosticar la parte de prueba** y medir los errores ahí.","**Decidir**: usar el método, modificarlo, o probar otro y comparar."],"itemsHtml":["<strong>Elegir un método</strong> según el patrón de datos (árbol de la Clase 3.a).","<strong>Partir los datos en dos</strong>: parte de <strong>inicialización</strong> (para ajustar) y parte de <strong>prueba</strong> (que el método no vio).","<strong>Ajustar</strong> el método con la parte de inicialización.","<strong>Pronosticar la parte de prueba</strong> y medir los errores ahí.","<strong>Decidir</strong>: usar el método, modificarlo, o probar otro y comparar."]},{"type":"callout","kind":"idea","text":"**La lógica:** si medís el error sobre los mismos datos con los que ajustaste, hacés trampa sin querer. La prueba honesta es sobre datos que el método no conoce.","html":"<strong>La lógica:</strong> si medís el error sobre los mismos datos con los que ajustaste, hacés trampa sin querer. La prueba honesta es sobre datos que el método no conoce."},{"type":"heading","level":2,"text":"7. La señal de rastreo","html":"7. La señal de rastreo"},{"type":"paragraph","text":"Un método que hoy funciona puede dejar de funcionar (cambió el mercado, entró un competidor).","html":"Un método que hoy funciona puede dejar de funcionar (cambió el mercado, entró un competidor)."},{"type":"paragraph","text":"La **señal de rastreo** es un control continuo: se monitorea alguna medida del error a través del tiempo y se fijan **límites**; cuando el error los rebasa, se **alerta al pronosticador** para revisar el método o recalibrar sus parámetros (por ejemplo, cambiar el α).","html":"La <strong>señal de rastreo</strong> es un control continuo: se monitorea alguna medida del error a través del tiempo y se fijan <strong>límites</strong>; cuando el error los rebasa, se <strong>alerta al pronosticador</strong> para revisar el método o recalibrar sus parámetros (por ejemplo, cambiar el α)."},{"type":"paragraph","text":"**Versión simple (Hanke):** contar cuántas de las últimas n predicciones fueron **subestimaciones** (U). Si el método está sano, deberían ser aproximadamente **n/2**. Un valor muy alejado de n/2 indica sesgo sistemático. Si el método es razonablemente preciso, los errores deberían distribuirse normalmente con media cero.","html":"<strong>Versión simple (Hanke):</strong> contar cuántas de las últimas n predicciones fueron <strong>subestimaciones</strong> (U). Si el método está sano, deberían ser aproximadamente <strong>n/2</strong>. Un valor muy alejado de n/2 indica sesgo sistemático. Si el método es razonablemente preciso, los errores deberían distribuirse normalmente con media cero."},{"type":"heading","level":2,"text":"8. Chequeos de sensatez","html":"8. Chequeos de sensatez"},{"type":"list","ordered":false,"items":["MAD, MSE y MAPE **nunca** pueden ser negativos (llevan valor absoluto o cuadrado)","El PME **sí** puede ser negativo — de hecho su signo es toda la información","MSE ≥ MAD² aproximadamente (por la desigualdad del cuadrado)","Si el MAPE da enorme, revisá si hay algún Yₜ cercano a cero","Si MAD y MAPE son bajos pero el PME es alto → el método es preciso pero **sesgado**: le falta capturar un patrón"],"itemsHtml":["MAD, MSE y MAPE <strong>nunca</strong> pueden ser negativos (llevan valor absoluto o cuadrado)","El PME <strong>sí</strong> puede ser negativo — de hecho su signo es toda la información","MSE ≥ MAD² aproximadamente (por la desigualdad del cuadrado)","Si el MAPE da enorme, revisá si hay algún Yₜ cercano a cero","Si MAD y MAPE son bajos pero el PME es alto → el método es preciso pero <strong>sesgado</strong>: le falta capturar un patrón"]},{"type":"heading","level":2,"text":"9. Mini-resumen para tu doc","html":"9. Mini-resumen para tu doc"},{"type":"callout","kind":"idea","text":"**Clase 4.** Residual: e = Y − Ŷ (positivo = subestimé). Cuatro medidas: **MAD** (error promedio en unidades, intuitiva), **MSE** (castiga errores grandes, criterio estándar para elegir parámetros como α), **MAPE** (error en %, única comparable entre series distintas), **PME** (sin valor absoluto → mide **sesgo**: ≈0 centrado, positivo = subestima sistemáticamente). Un PME alto no indica imprecisión sino que el método pierde un patrón (ej.: suavizado simple sobre serie con tendencia → cambiar a Holt). Validación: partir datos en inicialización y prueba, ajustar con una, medir con la otra. Señal de rastreo: control continuo que alerta cuando el error se sale de límites.","html":"<strong>Clase 4.</strong> Residual: e = Y − Ŷ (positivo = subestimé). Cuatro medidas: <strong>MAD</strong> (error promedio en unidades, intuitiva), <strong>MSE</strong> (castiga errores grandes, criterio estándar para elegir parámetros como α), <strong>MAPE</strong> (error en %, única comparable entre series distintas), <strong>PME</strong> (sin valor absoluto → mide <strong>sesgo</strong>: ≈0 centrado, positivo = subestima sistemáticamente). Un PME alto no indica imprecisión sino que el método pierde un patrón (ej.: suavizado simple sobre serie con tendencia → cambiar a Holt). Validación: partir datos en inicialización y prueba, ajustar con una, medir con la otra. Señal de rastreo: control continuo que alerta cuando el error se sale de límites."},{"type":"ejercicio","title":"10. EJERCICIO — Clase 4","estado":"para resolver","blocks":[{"type":"table","headers":["Mes","Real","Método X","Método Y"],"rows":[["---","---","---","---"],["1","200","190","205"],["2","210","198","202"],["3","225","205","230"],["4","230","215","222"],["5","245","222","250"]],"headersHtml":["Mes","Real","Método X","Método Y"],"rowsHtml":[["---","---","---","---"],["1","200","190","205"],["2","210","198","202"],["3","225","205","230"],["4","230","215","222"],["5","245","222","250"]]},{"type":"paragraph","text":"**a)** Calculá e, |e|, e² y |e/Y| para cada método (armá la tabla completa).\n**b)** Obtené MAD, MSE, MAPE y PME de ambos métodos.\n**c)** ¿Cuál es más preciso? ¿Cuál está mejor centrado?\n**d) ★ La pregunta clave:** mirá el PME del método X y la evolución de los datos reales. ¿Qué te está diciendo? ¿Qué **tipo** de método parece ser X y qué le cambiarías?\n**e)** Redactá la conclusión como respuesta de examen (usando las cuatro medidas para decir cosas distintas).","html":"<strong>a)</strong> Calculá e, |e|, e² y |e/Y| para cada método (armá la tabla completa).\n<strong>b)</strong> Obtené MAD, MSE, MAPE y PME de ambos métodos.\n<strong>c)</strong> ¿Cuál es más preciso? ¿Cuál está mejor centrado?\n<strong>d) ★ La pregunta clave:</strong> mirá el PME del método X y la evolución de los datos reales. ¿Qué te está diciendo? ¿Qué <strong>tipo</strong> de método parece ser X y qué le cambiarías?\n<strong>e)</strong> Redactá la conclusión como respuesta de examen (usando las cuatro medidas para decir cosas distintas)."}],"nota":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","notaHtml":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","titleHtml":"10. EJERCICIO — Clase 4"},{"type":"heading","level":2,"text":"11. Ejercicios acumulados pendientes de corrección","html":"11. Ejercicios acumulados pendientes de corrección"},{"type":"list","ordered":true,"items":["**Clase 1.b** (ventas 120, 135, 105, 140, 100): a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110<X<145) · e) inverso 90% · f) ¿Z o t?","**Clase 2** (temperatura vs. bebidas): a) tabla y sumatorias · b) r · c) interpretación · d) ¿causalidad?","**Clase 3.a** (diagnóstico de 4 series): a) a d)","**Clase 3.b** (correlogramas): 1) a 3)","**Clase 4** (comparación de métodos X e Y): a) a e)"],"itemsHtml":["<strong>Clase 1.b</strong> (ventas 120, 135, 105, 140, 100): a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110&lt;X&lt;145) · e) inverso 90% · f) ¿Z o t?","<strong>Clase 2</strong> (temperatura vs. bebidas): a) tabla y sumatorias · b) r · c) interpretación · d) ¿causalidad?","<strong>Clase 3.a</strong> (diagnóstico de 4 series): a) a d)","<strong>Clase 3.b</strong> (correlogramas): 1) a 3)","<strong>Clase 4</strong> (comparación de métodos X e Y): a) a e)"]},{"type":"paragraph","text":"**Material asociado:** `Clase04_MedidasDeError.svg` · `ArbolDecisorio_MetodosPronostico.svg`\n**Fuente:** Hanke, *Pronósticos en los Negocios*, caps. 4 y 5 — completo en Drive/Teoría/Libros. Fórmulas también en `Formulas SdG.docx`.","html":"<strong>Material asociado:</strong> <code>Clase04_MedidasDeError.svg</code> · <code>ArbolDecisorio_MetodosPronostico.svg</code>\n<strong>Fuente:</strong> Hanke, <em>Pronósticos en los Negocios</em>, caps. 4 y 5 — completo en Drive/Teoría/Libros. Fórmulas también en <code>Formulas SdG.docx</code>."},{"type":"paragraph","text":"**Con esta clase se cierra la Unidad 2.b (demanda, datos y patrones).**","html":"<strong>Con esta clase se cierra la Unidad 2.b (demanda, datos y patrones).</strong>"},{"type":"paragraph","text":"**Sigue → Clase 5: Métodos no formales y promedios** (promedio simple, promedio móvil, promedio móvil doble): el primer bloque de métodos de pronóstico. Arranca la Unidad 2.c. Ya está cargada.","html":"<strong>Sigue → Clase 5: Métodos no formales y promedios</strong> (promedio simple, promedio móvil, promedio móvil doble): el primer bloque de métodos de pronóstico. Arranca la Unidad 2.c. Ya está cargada."}],"historias":[{"type":"concepto","k":"La idea","title":"El árbol propone. Las medidas deciden.","text":"Pronosticaste 500 y vendiste 480. ¿Estuviste bien o mal? Y si otro método dijo 510, ¿cuál es mejor? Un mes suelto no
