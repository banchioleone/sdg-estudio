típica de final es: cómo se genera esa información e indicar los subsistemas participantes.","titleHtml":"La información no aparece sola."},{"type":"concepto","k":"El ERP","title":"El modelo ERP aparece ya en la U1.","text":"No hay que esperar a la Unidad 7 para oír la palabra. El programa y el mapa lo ponen acá como integrador: la U7 va a mostrar el software; la U1 anticipa el modelo de gestión integral.","html":"No hay que esperar a la Unidad 7 para oír la palabra. El programa y el mapa lo ponen acá como integrador: la U7 va a mostrar el software; la U1 anticipa el modelo de gestión integral.","titleHtml":"El modelo ERP aparece ya en la U1."},{"type":"pregunta","k":"A ver…","title":"Una pregunta típica de final de esta unidad pide…","options":["Calcular un EOQ","Cómo se genera la información e indicar los subsistemas participantes","Armar el correlograma de una serie"],"correct":1,"feedback":"Así lo anotan el Documento Maestro y el mapa v2. Es teoría, y pide relaciones entre contenidos, no un cálculo.","titleHtml":"Una pregunta típica de final de esta unidad pide…"},{"type":"concepto","k":"Antecedentes","title":"Se llegó al enfoque de sistemas por la historia.","text":"El apunte de Morán (2000) recorre Taylor, Gantt y los Gilbreth; después Shewhart y Ford; y apunta que al ver la interacción de diseño, planta, gente, materiales y clientes se empezó a estudiar los medios de producción como sistemas.","html":"El apunte de Morán (2000) recorre Taylor, Gantt y los Gilbreth; después Shewhart y Ford; y apunta que al ver la interacción de diseño, planta, gente, materiales y clientes se empezó a estudiar los medios de producción como sistemas.","titleHtml":"Se llegó al enfoque de sistemas por la historia."},{"type":"concepto","k":"Más adelante","title":"De la Investigación Operativa al MRP y al JIT.","text":"El mismo apunte: Investigación Operativa en la guerra; en los 70, sistemas de programación por computadora, «por ejemplo el MRP de Joseph Orlicky»; en los 80, justo a tiempo (Ohno) y calidad total (Deming, Juran).","html":"El mismo apunte: Investigación Operativa en la guerra; en los 70, sistemas de programación por computadora, «por ejemplo el MRP de Joseph Orlicky»; en los 80, justo a tiempo (Ohno) y calidad total (Deming, Juran).","titleHtml":"De la Investigación Operativa al MRP y al JIT."},{"type":"pregunta","k":"A ver…","title":"Según el apunte de Evolución, estudiar la interacción de diseño, planta, gente, materiales y clientes condujo a…","options":["Abandonar la planificación","Estudiar los medios de producción como sistemas","Usar solo el incentivo salarial de Taylor"],"correct":1,"feedback":"Morán lo escribe así: esas consideraciones «condujeron naturalmente al estudio de los medios de producción como sistemas».","titleHtml":"Según el apunte de Evolución, estudiar la interacción de diseño, planta, gente, materiales y clientes condujo a…"},{"type":"concepto","k":"Lo que falta","title":"Esta clase no inventa el diagrama ni los indicadores.","text":"El diagrama funcional y la lista de indicadores de productividad están en el programa, y el Maestro los remite a Monks y a Chase. Acá no están reproducidos. Tampoco se marca la clase como Vista: no se dictó en la serie 0 → 1.","html":"El diagrama funcional y la lista de indicadores de productividad están en el programa, y el Maestro los remite a Monks y a Chase. Acá no están reproducidos. Tampoco se marca la clase como Vista: no se dictó en la serie 0 → 1.","titleHtml":"Esta clase no inventa el diagrama ni los indicadores."},{"type":"cierre","title":"Llevate el marco.","text":"Empresa como sistema, conversión (insumos → transformación → productos), subsistemas y flujo de información, ERP como integrador. Si te preguntan cómo se genera un dato, nombrá los subsistemas. Sigue el mapa de toda la materia: Clase 0.","html":"Empresa como sistema, conversión (insumos → transformación → productos), subsistemas y flujo de información, ERP como integrador. Si te preguntan cómo se genera un dato, nombrá los subsistemas. Sigue el mapa de toda la materia: Clase 0.","titleHtml":"Llevate el marco."}],"titleHtml":"Enfoque sistémico","ledeHtml":"Objetivo del programa: conocer la empresa bajo un enfoque sistémico y desde la administración de la producción. Es la unidad-marco: da el vocabulario que atraviesa las otras seis. Esta clase no está marcada como Vista: no se dictó en la serie 0 → 1, se arma ahora con el programa, el mapa y los apuntes."},"c0":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c0","title":"Clase 0 · Mapa de la materia","name":"Mapa","lede":"La materia es la anatomía de un ERP: de la empresa como sistema (U1) al software que la gestiona (U7). Esta clase arma el mapa oficial, cómo se conectan las 7 unidades y qué se toma en el final, con las frecuencias reales de los exámenes fechados.","visto":true,"source":["clases_previas/SG/MapaMateria_SistemasDeGestion_v2.svg","clases_previas/SG/MapaMateria_SistemasDeGestion.svg","clases_previas/SG/SistemasDeGestion_DocumentoMaestro_v2.txt","programa.md (SG1Progr2008.doc)","patrones_examenes.md","clases_previas/conversacion_previa_notas.md","INDEX.md","aportes_emiliano/examen_2018_transcripcion.md"],"laminas":["u2/img/MapaMateria_SistemasDeGestion_v2.svg","u2/img/MapaMateria_SistemasDeGestion.svg"],"next":"Clase 0.1 · Siglas","teoria":[{"type":"callout","kind":"idea","text":"**Idea central (mapa v2):** «la materia es la anatomía de un ERP — de la empresa como sistema (U1) al software que la gestiona (U7)». Las cuatro unidades del medio (pronósticos, producto, proceso y logística) son los insumos; la U6 es el motor donde se juntan; la U7 empaqueta todo en software.","html":"<strong>Idea central (mapa v2):</strong> «la materia es la anatomía de un ERP — de la empresa como sistema (U1) al software que la gestiona (U7)». Las cuatro unidades del medio (pronósticos, producto, proceso y logística) son los insumos; la U6 es el motor donde se juntan; la U7 empaqueta todo en software."},{"type":"heading","level":2,"text":"1. De dónde sale esta clase","html":"1. De dónde sale esta clase"},{"type":"paragraph","text":"No hay un apunte titulado «Clase 0». En la cursada se dictó el mapa general (notas de la conversación previa: serie 0 → 0.1 → 1). Lo que sigue se arma con el mapa v2, el **programa oficial 2008** (`SG1Progr2008.doc`), el Documento Maestro v2 y el mapa de frecuencias de exámenes. Si algo no está en esas fuentes, se marca.","html":"No hay un apunte titulado «Clase 0». En la cursada se dictó el mapa general (notas de la conversación previa: serie 0 → 0.1 → 1). Lo que sigue se arma con el mapa v2, el <strong>programa oficial 2008</strong> (<code>SG1Progr2008.doc</code>), el Documento Maestro v2 y el mapa de frecuencias de exámenes. Si algo no está en esas fuentes, se marca."},{"type":"callout","kind":"examen","text":"**Programa vigente en el material:** Sistemas de Gestión 1, UTN FRRo, 2008. No aparece un programa posterior. Estudiar con esa estructura importa: uno de los criterios de evaluación es «el establecimiento de relaciones lógicas y jerárquicas entre los contenidos».","html":"<strong>Programa vigente en el material:</strong> Sistemas de Gestión 1, UTN FRRo, 2008. No aparece un programa posterior. Estudiar con esa estructura importa: uno de los criterios de evaluación es «el establecimiento de relaciones lógicas y jerárquicas entre los contenidos»."},{"type":"heading","level":2,"text":"2. El mapa oficial (versión 2)","html":"2. El mapa oficial (versión 2)"},{"type":"svg","file":"u2/img/MapaMateria_SistemasDeGestion_v2.svg","caption":"Mapa de la materia, versión 2, alineado a las 7 unidades del programa oficial","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 940\" width=\"980\" height=\"940\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n    <marker id=\"arG\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#8A8A8A\"/>\n    </marker>\n  </defs>\n\n  <rect width=\"980\" height=\"940\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"36\" font-size=\"24\" font-weight=\"700\" fill=\"#1F4E79\">SISTEMAS DE GESTIÓN — mapa v2 según programa oficial</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" fill=\"#666\">Hilo conductor: la materia es la anatomía de un ERP — de la empresa como sistema (U1) al software que la gestiona (U7)</text>\n\n  <!-- ============ U1: MARCO SUPERIOR ============ -->\n  <rect x=\"40\" y=\"76\" width=\"900\" height=\"96\" rx=\"10\" fill=\"#EDF3F9\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"102\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 1 · LA EMPRESA COMO PRODUCTORA DE BIENES</text>\n  <text x=\"700\" y=\"102\" font-size=\"11\" font-weight=\"700\" fill=\"#2E74B5\">[T] el marco de todo</text>\n  <text x=\"58\" y=\"124\" font-size=\"11.5\" fill=\"#444\">La empresa como sistema · diagrama funcional · proceso de conversión (insumos → transformación → productos)</text>\n  <text x=\"58\" y=\"142\" font-size=\"11.5\" fill=\"#444\">Subsistemas y sus interacciones · flujo de información · el modelo ERP como integrador · productividad e indicadores · mejora continua</text>\n  <text x=\"58\" y=\"162\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Pregunta típica: “¿cómo se genera esta información? indique los subsistemas participantes”</text>\n\n  <line x1=\"490\" y1=\"172\" x2=\"490\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ FILA CENTRAL: U2 U3 U4 U5 (los insumos de la planificación) ============ -->\n  <text x=\"40\" y=\"216\" font-size=\"13\" font-weight=\"700\" fill=\"#555\">LOS 4 INSUMOS DE LA PLANIFICACIÓN — qué necesito saber antes de planificar:</text>\n\n  <!-- U2 -->\n  <rect x=\"40\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"54\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">U2 · PRONÓSTICOS</text>\n  <text x=\"54\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P] ½ de la práctica</text>\n  <text x=\"54\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto van a comprar?</text>\n  <text x=\"54\" y=\"311\" font-size=\"10.8\" fill=\"#333\">· Base estadística (normal, t)</text>\n  <text x=\"54\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Patrones: tendencia, ciclo,</text>\n  <text x=\"62\" y=\"343\" font-size=\"10.8\" fill=\"#333\">estacionalidad · autocorrelación</text>\n  <text x=\"54\" y=\"360\" font-size=\"10.8\" fill=\"#333\">· Errores MAD/MSE/MAPE</text>\n  <text x=\"54\" y=\"377\" font-size=\"10.8\" fill=\"#333\">· Suavización: simple, Holt, Winter</text>\n  <text x=\"54\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Descomposición multiplicativa</text>\n  <text x=\"54\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Regresión simple y múltiple</text>\n  <text x=\"54\" y=\"426\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Clave: elegir método y justificar</text>\n\n  <!-- U3 -->\n  <rect x=\"270\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"284\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">U3 · EL PRODUCTO</text>\n  <text x=\"284\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">[T + cálculo puntual]</text>\n  <text x=\"284\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Qué fabricamos y cómo</text>\n  <text x=\"284\" y=\"305\" font-size=\"11\" fill=\"#444\">se representa en el sistema?</text>\n  <text x=\"284\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tangibles vs. intangibles</text>\n  <text x=\"284\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Ciclo de vida y sus etapas ★</text>\n  <text x=\"284\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Codificación: significativos o no,</text>\n  <text x=\"292\" y=\"377\" font-size=\"10.8\" fill=\"#333\">códigos de barras</text>\n  <text x=\"284\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Dígito verificador IBM-11 ★ [P]</text>\n  <text x=\"284\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· BOM: explosión por niveles,</text>\n  <text x=\"292\" y=\"426\" font-size=\"10.8\" fill=\"#333\">implosión indentada ★</text>\n\n  <!-- U4 -->\n  <rect x=\"500\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"514\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1E6B33\">U4 · EL PROCESO</text>\n  <text x=\"514\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1E6B33\">[T + P]</text>\n  <text x=\"514\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cómo se produce</text>\n  <text x=\"514\" y=\"305\" font-size=\"11\" fill=\"#444\">físicamente?</text>\n  <text x=\"514\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tipos de procesos industriales</text>\n  <text x=\"514\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Máquinas y centros de trabajo</text>\n  <text x=\"514\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Estudio del trabajo:</text>\n  <text x=\"522\" y=\"377\" font-size=\"10.8\" fill=\"#333\">gráfica hombre–máquina ★ [P]</text>\n  <text x=\"514\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· JIT ★ · Kanban · TQM · SMED</text>\n  <text x=\"514\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Teoría de las Restricciones</text>\n  <text x=\"522\" y=\"426\" font-size=\"10.8\" fill=\"#333\">(Goldratt, cuellos de botella)</text>\n\n  <!-- U5 -->\n  <rect x=\"730\" y=\"228\" width=\"210\" height=\"204\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#E5C2C2\" stroke-width=\"1.5\"/>\n  <text x=\"744\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#9C3838\">U5 · LOGÍSTICA</text>\n  <text x=\"744\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P + T]</text>\n  <text x=\"744\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto material tener</text>\n  <text x=\"744\" y=\"305\" font-size=\"11\" fill=\"#444\">y cómo abastecerse?</text>\n  <text x=\"744\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· EOQ/LEC · punto de reorden</text>\n  <text x=\"744\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· EOQ con descuentos ★</text>\n  <text x=\"744\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Periódico vs. perpetuo ★</text>\n  <text x=\"744\" y=\"379\" font-size=\"10.8\" fill=\"#333\">· Stock de seguridad (normal)</text>\n  <text x=\"744\" y=\"396\" font-size=\"10.8\" fill=\"#333\">· Clasificación ABC ★</text>\n  <text x=\"744\" y=\"413\" font-size=\"10.8\" fill=\"#333\">· Compras, proveedores JIT ★</text>\n  <text x=\"744\" y=\"428\" font-size=\"10.8\" fill=\"#333\">· Almacenes y trazabilidad</text>\n\n  <!-- flechas de los 4 a U6 -->\n  <line x1=\"146\" y1=\"432\" x2=\"330\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"376\" y1=\"432\" x2=\"420\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"606\" y1=\"432\" x2=\"560\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"835\" y1=\"432\" x2=\"650\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n\n  <!-- ============ U6: EL MOTOR ============ -->\n  <rect x=\"120\" y=\"504\" width=\"740\" height=\"196\" rx=\"10\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2.5\"/>\n  <text x=\"140\" y=\"530\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 6 · PLANIFICACIÓN Y CONTROL DE LA PRODUCCIÓN</text>\n  <text x=\"700\" y=\"530\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">[P] la otra ½ de la práctica</text>\n  <text x=\"140\" y=\"548\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">El motor donde se juntan los 4 insumos — la cadena operativa:</text>\n\n  <g font-size=\"11\" font-weight=\"700\">\n    <rect x=\"140\" y=\"560\" width=\"126\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"203\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">PLAN AGREGADO ★</text>\n    <line x1=\"270\" y1=\"575\" x2=\"288\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"292\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"335\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MPS ★</text>\n    <line x1=\"382\" y1=\"575\" x2=\"400\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"404\" y=\"560\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"464\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CAPACIDAD ★</text>\n    <line x1=\"528\" y1=\"575\" x2=\"546\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"550\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"593\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MRP ★</text>\n    <line x1=\"640\" y1=\"575\" x2=\"658\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"662\" y=\"560\" width=\"178\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"751\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CONTROL DE PISO</text>\n  </g>\n\n  <text x=\"140\" y=\"618\" font-size=\"10.8\" fill=\"#333\">· Plan agregado: persecución / nivelación, costos ★   · MPS: pronóstico vs. ventas confirmadas ★ (examen 2018)</text>\n  <text x=\"140\" y=\"636\" font-size=\"10.8\" fill=\"#333\">· Capacidad: listas de capacidad y perfiles de recursos ★, factor de actividad, scrap, curvas de aprendizaje</text>\n  <text x=\"140\" y=\"654\" font-size=\"10.8\" fill=\"#333\">· MRP: brutos→netos, lead times, scrap ★, loteo LEC/TBO-POQ ★/PPB   [tema huérfano: refuerzo extra]   · MRP II (CRP)</text>\n  <text x=\"140\" y=\"672\" font-size=\"10.8\" fill=\"#333\">· Balanceo de línea ★: precedencias, tiempo de ciclo, eficiencia   · Emisión y lanzamiento de órdenes, hoja de ruta ★</text>\n  <text x=\"140\" y=\"691\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">La U6 consume: la demanda de U2, el BOM de U3, la capacidad y métodos de U4, y los modelos de stock de U5.</text>\n\n  <line x1=\"490\" y1=\"700\" x2=\"490\" y2=\"724\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ U7 ============ -->\n  <rect x=\"120\" y=\"728\" width=\"740\" height=\"80\" rx=\"10\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"140\" y=\"754\" font-size=\"15\" font-weight=\"700\" fill=\"#5B3E8E\">UNIDAD 7 · SOFTWARES ERP</text>\n  <text x=\"700\" y=\"754\" font-size=\"11\" font-weight=\"700\" fill=\"#7B5AA6\">[T] el zoom out final</text>\n  <text x=\"140\" y=\"776\" font-size=\"11.5\" fill=\"#444\">Historia: MRP → MRP II → ERP · caracterización de los sistemas comerciales (SAP como caso típico)</text>\n  <text x=\"140\" y=\"795\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Todo lo anterior, empaquetado en software: por eso esta materia es “la anatomía de un ERP”.</text>\n\n  <!-- ============ COMPLEMENTOS ============ -->\n  <rect x=\"120\" y=\"822\" width=\"740\" height=\"56\" rx=\"8\" fill=\"#FAFAFA\" stroke=\"#BBB\" stroke-dasharray=\"5 4\"/>\n  <text x=\"140\" y=\"844\" font-size=\"12\" font-weight=\"700\" fill=\"#555\">COMPLEMENTOS (fuera del programa 2008, pero preguntados en el examen 2018):</text>\n  <text x=\"140\" y=\"864\" font-size=\"11\" fill=\"#444\">· BI / Data Warehouse: relación ERP–BI ★, modelo dimensional, Kimball    · Métodos de decisión racional ★ (nivel conceptual)</text>\n\n  <!-- LEYENDA -->\n  <text x=\"40\" y=\"906\" font-size=\"11.5\" fill=\"#333\"><tspan font-weight=\"700\" fill=\"#C00000\">[P]</tspan> se calcula → práctica (eliminatoria, primero)    <tspan font-weight=\"700\">[T]</tspan> se explica → teoría + coloquio globalizador    <tspan font-weight=\"700\">★</tspan> cayó en finales relevados</text>\n  <text x=\"40\" y=\"926\" font-size=\"11.5\" fill=\"#333\">Evaluación oficial: claridad conceptual · relaciones entre contenidos · vocabulario específico · interpretación · fundamentación</text>\n</svg>"},{"type":"heading","level":2,"text":"3. Las 7 unidades del programa","html":"3. Las 7 unidades del programa"},{"type":"paragraph","text":"Títulos (eje conceptual) y objetivos, textuales del programa 2008:","html":"Títulos (eje conceptual) y objetivos, textuales del programa 2008:"},{"type":"table","headers":["Unidad","Eje conceptual","Objetivo (síntesis del programa)"],"rows":[["U1","La Empresa como productora de Bienes (y Servicios)","Conocimiento general de las empresas bajo un enfoque sistémico y desde la administración de la producción."],["U2","Los Métodos de Pronósticos","Métodos y técnicas de pronósticos más utilizados y su aplicación en la gestión industrial."],["U3","El Producto","El concepto de producto y las estructuras de información con que se definen y producen."],["U4","El Proceso de Producción","El concepto de Sistema de Producción y el sistema de información que lo mantiene activo."],["U5","Logística","Logística integral e interna, y el modelo de gestión de inventarios adecuado a cada proceso."],["U6","El Sistema de Planificación y Control de la Producción","Determinar las operaciones básicas de un sistema de gestión, planificación y control de los procesos de conversión."],["U7","Softwares ERP","Conocer la oferta de paquetes pre-programados parametrizables para la gestión integral de los recursos en empresas industriales (ERP)."]],"headersHtml":["Unidad","Eje conceptual","Objetivo (síntesis del programa)"],"rowsHtml":[["U1","La Empresa como productora de Bienes (y Servicios)","Conocimiento general de las empresas bajo un enfoque sistémico y desde la administración de la producción."],["U2","Los Métodos de Pronósticos","Métodos y técnicas de pronósticos más utilizados y su aplicación en la gestión industrial."],["U3","El Producto","El concepto de producto y las estructuras de información con que se definen y producen."],["U4","El Proceso de Producción","El concepto de Sistema de Producción y el sistema de información que lo mantiene activo."],["U5","Logística","Logística integral e interna, y el modelo de gestión de inventarios adecuado a cada proceso."],["U6","El Sistema de Planificación y Control de la Producción","Determinar las operaciones básicas de un sistema de gestión, planificación y control de los procesos de conversión."],["U7","Softwares ERP","Conocer la oferta de paquetes pre-programados parametrizables para la gestión integral de los recursos en empresas industriales (ERP)."]]},{"type":"heading","level":2,"text":"4. Cómo se conectan","html":"4. Cómo se conectan"},{"type":"paragraph","text":"El mapa v2 lo plantea así. La **U1** es el marco: la empresa como sistema, el proceso de conversión (insumos → transformación → productos) y el modelo ERP como integrador. Antes de planificar hace falta saber cuatro cosas:","html":"El mapa v2 lo plantea así. La <strong>U1</strong> es el marco: la empresa como sistema, el proceso de conversión (insumos → transformación → productos) y el modelo ERP como integrador. Antes de planificar hace falta saber cuatro cosas:"},{"type":"list","ordered":false,"items":["**U2 · Pronósticos:** ¿cuánto van a comprar? Demanda y método justificado.","**U3 · El producto:** ¿qué fabricamos y cómo se representa en el sistema? Ciclo de vida, codificación, BOM.","**U4 · El proceso:** ¿cómo se produce físicamente? Centros de trabajo, hombre-máquina, JIT, TOC.","**U5 · Logística:** ¿cuánto material tener y cómo abastecerse? EOQ, stock de seguridad, ABC."],"itemsHtml":["<strong>U2 · Pronósticos:</strong> ¿cuánto van a comprar? Demanda y método justificado.","<strong>U3 · El producto:</strong> ¿qué fabricamos y cómo se representa en el sistema? Ciclo de vida, codificación, BOM.","<strong>U4 · El proceso:</strong> ¿cómo se produce físicamente? Centros de trabajo, hombre-máquina, JIT, TOC.","<strong>U5 · Logística:</strong> ¿cuánto material tener y cómo abastecerse? EOQ, stock de seguridad, ABC."]},{"type":"paragraph","text":"Esos cuatro insumos entran a la **U6**, «el motor donde se juntan». La cadena operativa del mapa es: **plan agregado → MPS → capacidad → MRP → control de piso**. El mapa lo resume en una frase: «La U6 consume: la demanda de U2, el BOM de U3, la capacidad y métodos de U4, y los modelos de stock de U5.»","html":"Esos cuatro insumos entran a la <strong>U6</strong>, «el motor donde se juntan». La cadena operativa del mapa es: <strong>plan agregado → MPS → capacidad → MRP → control de piso</strong>. El mapa lo resume en una frase: «La U6 consume: la demanda de U2, el BOM de U3, la capacidad y métodos de U4, y los modelos de stock de U5.»"},{"type":"paragraph","text":"La **U7** es el zoom out final: historia MRP → MRP II → ERP. «Todo lo anterior, empaquetado en software: por eso esta materia es “la anatomía de un ERP”.»","html":"La <strong>U7</strong> es el zoom out final: historia MRP → MRP II → ERP. «Todo lo anterior, empaquetado en software: por eso esta materia es “la anatomía de un ERP”.»"},{"type":"heading","level":2,"text":"5. Qué se calcula y qué se explica","html":"5. Qué se calcula y qué se explica"},{"type":"paragraph","text":"El mapa distingue dos marcas, que coinciden con la operatoria del final (notas de cursada y foto 2018):","html":"El mapa distingue dos marcas, que coinciden con la operatoria del final (notas de cursada y foto 2018):"},{"type":"list","ordered":false,"items":["**[P] se calcula** → práctica (eliminatoria, primero).","**[T] se explica** → teoría + coloquio globalizador."],"itemsHtml":["<strong>[P] se calcula</strong> → práctica (eliminatoria, primero).","<strong>[T] se explica</strong> → teoría + coloquio globalizador."]},{"type":"paragraph","text":"El examen fotografiado de 2018 tenía 1 ejercicio de práctica (40 min, un MPS a partir de ventas confirmadas frente a un pronóstico SES) y 5 preguntas de teoría (30 min).","html":"El examen fotografiado de 2018 tenía 1 ejercicio de práctica (40 min, un MPS a partir de ventas confirmadas frente a un pronóstico SES) y 5 preguntas de teoría (30 min)."},{"type":"paragraph","text":"Criterios de evaluación, textuales del programa (van impresos en el encabezado de cada examen):","html":"Criterios de evaluación, textuales del programa (van impresos en el encabezado de cada examen):"},{"type":"list","ordered":false,"items":["La claridad conceptual al responder las consignas.","El establecimiento de relaciones lógicas y jerárquicas entre los contenidos estudiados.","La utilización de un vocabulario específico.","La interpretación de los resultados obtenidos en la ejercitación.","La fundamentación de las respuestas dadas."],"itemsHtml":["La claridad conceptual al responder las consignas.","El establecimiento de relaciones lógicas y jerárquicas entre los contenidos estudiados.","La utilización de un vocabulario específico.","La interpretación de los resultados obtenidos en la ejercitación.","La fundamentación de las respuestas dadas."]},{"type":"callout","kind":"examen","text":"**Traducción práctica (Documento Maestro):** nunca entregar solo el número. Cada ejercicio se cierra con interpretación y justificación del método, usando el vocabulario de la cátedra.","html":"<strong>Traducción práctica (Documento Maestro):</strong> nunca entregar solo el número. Cada ejercicio se cierra con interpretación y justificación del método, usando el vocabulario de la cátedra."},{"type":"heading","level":2,"text":"6. Qué se toma en la práctica (conteo real)","html":"6. Qué se toma en la práctica (conteo real)"},{"type":"paragraph","text":"Las frecuencias de abajo salen de `patrones_examenes.md`, no de una estimación. Criterio: **una mesa cuenta 1 vez por tema** si ese tema apareció en la práctica con atribución segura. Denominador: **19 finales/exámenes con fecha, 2002–2018**. No se incluyen los sin fecha. También se informan los **7 finales fechados 2011–2018**, más cercanos al formato actual (en general 1 ejercicio de práctica + 3 a 5 preguntas de teoría).","html":"Las frecuencias de abajo salen de <code>patrones_examenes.md</code>, no de una estimación. Criterio: <strong>una mesa cuenta 1 vez por tema</strong> si ese tema apareció en la práctica con atribución segura. Denominador: <strong>19 finales/exámenes con fecha, 2002–2018</strong>. No se incluyen los sin fecha. También se informan los <strong>7 finales fechados 2011–2018</strong>, más cercanos al formato actual (en general 1 ejercicio de práctica + 3 a 5 preguntas de teoría)."},{"type":"table","headers":["Tema de práctica","2002–2018 (n=19)","%","2011–2018 (n=7)","%"],"rows":[["MRP","8","42%","2","29%"],["Pronósticos (series de tiempo)","6","32%","2","29%"],["Inventarios (EOQ, descuentos, SS, ABC)","5","26%","0","0%"],["Balanceo","4","21%","1","14%"],["Plan agregado","2","11%","0","0%"],["Hombre-máquina","2","11%","1","14%"],["Otros (estructura / scrap, sin MRP completo)","2","11%","0","0%"],["MPS","1","5%","1","14%"],["Capacidad / CRP","1","5%","0","0%"],["Regresión","0","0%","0","0%"],["Dígito verificador","0","0%","0","0%"]],"headersHtml":["Tema de práctica","2002–2018 (n=19)","%","2011–2018 (n=7)","%"],"rowsHtml":[["MRP","8","42%","2","29%"],["Pronósticos (series de tiempo)","6","32%","2","29%"],["Inventarios (EOQ, descuentos, SS, ABC)","5","26%","0","0%"],["Balanceo","4","21%","1","14%"],["Plan agregado","2","11%","0","0%"],["Hombre-máquina","2","11%","1","14%"],["Otros (estructura / scrap, sin MRP completo)","2","11%","0","0%"],["MPS","1","5%","1","14%"],["Capacidad / CRP","1","5%","0","0%"],["Regresión","0","0%","0","0%"],["Dígito verificador","0","0%","0","0%"]]},{"type":"svg","svg":"<svg viewBox=\"0 0 280 132\" width=\"100%\" height=\"132\" aria-hidden=\"true\"><line x1=\"28\" y1=\"112\" x2=\"272\" y2=\"112\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><rect x=\"32.0\" y=\"30.0\" width=\"18.3\" height=\"82.0\" fill=\"#a67c00\"/><text x=\"41.15\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">MRP</text><text x=\"41.15\" y=\"27.0\" font-size=\"8\" fill=\"#a67c00\" text-anchor=\"middle\">8</text><rect x=\"62.5\" y=\"50.5\" width=\"18.3\" height=\"61.5\" fill=\"#1f4e79\"/><text x=\"71.65\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">Pron</text><text x=\"71.65\" y=\"47.5\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">6</text><rect x=\"93.0\" y=\"60.75\" width=\"18.3\" height=\"51.25\" fill=\"#1f4e79\"/><text x=\"102.15\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">Inv</text><text x=\"102.15\" y=\"57.75\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">5</text><rect x=\"123.5\" y=\"71.0\" width=\"18.3\" height=\"41.0\" fill=\"#1f4e79\"/><text x=\"132.65\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">Bal</text><text x=\"132.65\" y=\"68.0\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">4</text><rect x=\"154.0\" y=\"91.5\" width=\"18.3\" height=\"20.5\" fill=\"#1f4e79\"/><text x=\"163.15\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">PA</text><text x=\"163.15\" y=\"88.5\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">2</text><rect x=\"184.5\" y=\"91.5\" width=\"18.3\" height=\"20.5\" fill=\"#1f4e79\"/><text x=\"193.65\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">HM</text><text x=\"193.65\" y=\"88.5\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">2</text><rect x=\"215.0\" y=\"101.75\" width=\"18.3\" height=\"10.25\" fill=\"#1f4e79\"/><text x=\"224.15\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">MPS</text><text x=\"224.15\" y=\"98.75\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">1</text><rect x=\"245.5\" y=\"101.75\" width=\"18.3\" height=\"10.25\" fill=\"#1f4e79\"/><text x=\"254.65\" y=\"126\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">Cap</text><text x=\"254.65\" y=\"98.75\" font-size=\"8\" fill=\"#1f4e79\" text-anchor=\"middle\">1</text></svg>","caption":"Conteo de mesas (n=19) por tema de práctica. MRP es el más frecuente; la regresión no aparece en este set."},{"type":"paragraph","text":"Límites de la muestra, también del mismo documento: no hay finales 2016–2017 ni 2019–2026; la muestra reciente es chica (7 mesas); la compilación 2002–2006 a veces mezcla hojas, y se fue conservador. Los porcentajes de 2011–2018 hay que tomarlos con ese límite. **Regresión no aparece en la práctica de ningún final fechado**, pese a tener guía y apunte. El dígito verificador no se tomó como ejercicio de práctica; sí en teoría (2011, 2013, 2018).","html":"Límites de la muestra, también del mismo documento: no hay finales 2016–2017 ni 2019–2026; la muestra reciente es chica (7 mesas); la compilación 2002–2006 a veces mezcla hojas, y se fue conservador. Los porcentajes de 2011–2018 hay que tomarlos con ese límite. <strong>Regresión no aparece en la práctica de ningún final fechado</strong>, pese a tener guía y apunte. El dígito verificador no se tomó como ejercicio de práctica; sí en teoría (2011, 2013, 2018)."},{"type":"callout","kind":"examen","text":"**Tema huérfano:** las notas de cursada dicen que el MRP no se dio en la práctica de la cursada, pero **sí se tomó** en finales (2013, 2015 y, con fuerza, 2002–2006). En el conteo 2002–2018 es el tema de práctica más frecuente (42%).","html":"<strong>Tema huérfano:</strong> las notas de cursada dicen que el MRP no se dio en la práctica de la cursada, pero <strong>sí se tomó</strong> en finales (2013, 2015 y, con fuerza, 2002–2006). En el conteo 2002–2018 es el tema de práctica más frecuente (42%)."},{"type":"paragraph","text":"Ojo con el mapa v2: ahí U2 y U6 aparecen como «½ de la práctica» cada una. Eso es un esquema del mapa, no el conteo de mesas. Para estudiar el peso de cada tema, usá la tabla de arriba.","html":"Ojo con el mapa v2: ahí U2 y U6 aparecen como «½ de la práctica» cada una. Eso es un esquema del mapa, no el conteo de mesas. Para estudiar el peso de cada tema, usá la tabla de arriba."},{"type":"heading","level":2,"text":"7. Qué se toma en la teoría (2011–2018)","html":"7. Qué se toma en la teoría (2011–2018)"},{"type":"paragraph","text":"Conteo de aparición en teoría sobre los **7 finales fechados 2011–2018** (una mesa, un punto, aunque haya más de una pregunta del tema):","html":"Conteo de aparición en teoría sobre los <strong>7 finales fechados 2011–2018</strong> (una mesa, un punto, aunque haya más de una pregunta del tema):"},{"type":"table","headers":["Tema de teoría","Mesas / 7","Preguntas típicas (según patrones)"],"rows":[["Codificación (saturación, DV, ventajas, potencialidad)","6","Incluye dígito verificador IBM-11 (2018: 987-95617-03-01) e IBM13 en el recuerdo de 2011"],["Capacidad (estación, sistema, listas/perfiles)","5","En 2018: hipótesis de listas de capacidad y perfiles de recursos"],["Pronósticos (función, para qué, hipótesis, SES)","5","Incluye explicar nivelación o suavización exponencial"],["Ciclo de vida del producto","3","Función, variables, o graficar (lámpara incandescente, 2013)"],["Estructura de producto / BOM / hoja de ruta","3","Incluye BOM en un ERP (2014)"],["MRP / MCP / ERP / JIT","3","2012: qué es MRP, MCP, ERP; 2018: cuándo JIT necesita MRP y relación ERP–BI"],["BI / decisiones racionales","1","Solo 2018. Están fuera del programa 2008, pero cayeron"]],"headersHtml":["Tema de teoría","Mesas / 7","Preguntas típicas (según patrones)"],"rowsHtml":[["Codificación (saturación, DV, ventajas, potencialidad)","6","Incluye dígito verificador IBM-11 (2018: 987-95617-03-01) e IBM13 en el recuerdo de 2011"],["Capacidad (estación, sistema, listas/perfiles)","5","En 2018: hipótesis de listas de capacidad y perfiles de recursos"],["Pronósticos (función, para qué, hipótesis, SES)","5","Incluye explicar nivelación o suavización exponencial"],["Ciclo de vida del producto","3","Función, variables, o graficar (lámpara incandescente, 2013)"],["Estructura de producto / BOM / hoja de ruta","3","Incluye BOM en un ERP (2014)"],["MRP / MCP / ERP / JIT","3","2012: qué es MRP, MCP, ERP; 2018: cuándo JIT necesita MRP y relación ERP–BI"],["BI / decisiones racionales","1","Solo 2018. Están fuera del programa 2008, pero cayeron"]]},{"type":"paragraph","text":"El mapa v2 anota esos complementos con la misma salvedad: «fuera del programa 2008, pero preguntados en el examen 2018» (BI / Data Warehouse y métodos de decisión racional, a nivel conceptual).","html":"El mapa v2 anota esos complementos con la misma salvedad: «fuera del programa 2008, pero preguntados en el examen 2018» (BI / Data Warehouse y métodos de decisión racional, a nivel conceptual)."},{"type":"heading","level":2,"text":"8. Una versión anterior del mapa","html":"8. Una versión anterior del mapa"},{"type":"paragraph","text":"Antes de alinear el mapa a las 7 unidades oficiales, había una versión de 18 temas en 4 capas (PREDECIR / PLANIFICAR / EJECUTAR / SISTEMAS). Los temas 1–11 eran práctica y los 12–18 teoría. Se conserva como referencia; el mapa que usamos para estudiar es el v2.","html":"Antes de alinear el mapa a las 7 unidades oficiales, había una versión de 18 temas en 4 capas (PREDECIR / PLANIFICAR / EJECUTAR / SISTEMAS). Los temas 1–11 eran práctica y los 12–18 teoría. Se conserva como referencia; el mapa que usamos para estudiar es el v2."},{"type":"svg","file":"u2/img/MapaMateria_SistemasDeGestion.svg","caption":"Mapa de la materia, versión anterior (18 temas / 4 capas)","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 900\" width=\"960\" height=\"900\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n    <marker id=\"arS\" markerWidth=\"8\" markerHeight=\"7\" refX=\"7\" refY=\"3.5\" orient=\"auto\">\n      <path d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"#2E74B5\"/>\n    </marker>\n  </defs>\n\n  <rect width=\"960\" height=\"900\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"24\" font-weight=\"700\" fill=\"#1F4E79\">SISTEMAS DE GESTIÓN — mapa de la materia</text>\n  <text x=\"40\" y=\"53\" font-size=\"12.5\" fill=\"#666\">Los 18 temas ubicados en la cadena real de planificación de una empresa</text>\n\n  <!-- CADENA / COLUMNA VERTEBRAL -->\n  <g font-size=\"11.5\" font-weight=\"700\">\n    <rect x=\"40\" y=\"68\" width=\"152\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"116\" y=\"88\" fill=\"#fff\" text-anchor=\"middle\">PRONÓSTICO</text>\n    <line x1=\"196\" y1=\"83\" x2=\"216\" y2=\"83\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"222\" y=\"68\" width=\"152\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"298\" y=\"88\" fill=\"#fff\" text-anchor=\"middle\">PLAN AGREGADO</text>\n    <line x1=\"378\" y1=\"83\" x2=\"398\" y2=\"83\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"404\" y=\"68\" width=\"152\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"480\" y=\"88\" fill=\"#fff\" text-anchor=\"middle\">MPS</text>\n    <line x1=\"560\" y1=\"83\" x2=\"580\" y2=\"83\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"586\" y=\"68\" width=\"152\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"662\" y=\"88\" fill=\"#fff\" text-anchor=\"middle\">MRP</text>\n    <line x1=\"742\" y1=\"83\" x2=\"762\" y2=\"83\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"768\" y=\"68\" width=\"152\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"844\" y=\"88\" fill=\"#fff\" text-anchor=\"middle\">COMPRAS / PROD.</text>\n  </g>\n\n  <!-- ===== CAPA 1 ===== -->\n  <rect x=\"40\" y=\"118\" width=\"640\" height=\"212\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\"/>\n  <text x=\"58\" y=\"143\" font-size=\"15.5\" font-weight=\"700\" fill=\"#1F4E79\">CAPA 1 · PREDECIR</text>\n  <text x=\"205\" y=\"143\" font-size=\"12\" fill=\"#666\">¿Qué nos van a comprar?</text>\n  <text x=\"662\" y=\"143\" font-size=\"11\" font-weight=\"700\" fill=\"#2E74B5\" text-anchor=\"end\">Temas 1–5</text>\n\n  <rect x=\"58\" y=\"154\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"72\" y=\"176\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">1 · Fundamentos estadísticos</text>\n  <text x=\"72\" y=\"196\" font-size=\"11.5\" fill=\"#444\">Promedio, desvío, curva normal,</text>\n  <text x=\"72\" y=\"213\" font-size=\"11.5\" fill=\"#444\">t de Student, correlación</text>\n\n  <rect x=\"366\" y=\"154\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"380\" y=\"176\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">2 · Patrones y elección de técnica</text>\n  <text x=\"380\" y=\"196\" font-size=\"11.5\" fill=\"#444\">Tendencia, ciclo, estacionalidad;</text>\n  <text x=\"380\" y=\"213\" font-size=\"11.5\" fill=\"#444\">autocorrelación; errores MAD/MSE/MAPE</text>\n\n  <rect x=\"58\" y=\"240\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"72\" y=\"262\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">3 · Promedios y suavizado</text>\n  <text x=\"72\" y=\"282\" font-size=\"11.5\" fill=\"#444\">Promedio móvil, exponencial simple,</text>\n  <text x=\"72\" y=\"299\" font-size=\"11.5\" fill=\"#444\">Brown, Holt, Winter</text>\n\n  <rect x=\"366\" y=\"240\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"380\" y=\"262\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">4 y 5 · Regresión simple y múltiple</text>\n  <text x=\"380\" y=\"282\" font-size=\"11.5\" fill=\"#444\">Explicar la demanda con otras variables;</text>\n  <text x=\"380\" y=\"299\" font-size=\"11.5\" fill=\"#444\">R², residuos, comparación de modelos</text>\n\n  <line x1=\"360\" y1=\"330\" x2=\"360\" y2=\"356\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ===== CAPA 2 ===== -->\n  <rect x=\"40\" y=\"362\" width=\"640\" height=\"212\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\"/>\n  <text x=\"58\" y=\"387\" font-size=\"15.5\" font-weight=\"700\" fill=\"#1E6B33\">CAPA 2 · PLANIFICAR</text>\n  <text x=\"215\" y=\"387\" font-size=\"12\" fill=\"#666\">¿Cuánto produzco y qué materiales necesito?</text>\n  <text x=\"662\" y=\"387\" font-size=\"11\" font-weight=\"700\" fill=\"#2E8B57\" text-anchor=\"end\">Temas 6, 7, 8, 12</text>\n\n  <rect x=\"58\" y=\"398\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#CBE3D0\"/>\n  <text x=\"72\" y=\"420\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1E6B33\">6 · Planeación agregada → MPS</text>\n  <text x=\"72\" y=\"440\" font-size=\"11.5\" fill=\"#444\">Estrategias persecución / nivelación;</text>\n  <text x=\"72\" y=\"457\" font-size=\"11.5\" fill=\"#444\">costos, horas extra, plan mensual</text>\n\n  <rect x=\"366\" y=\"398\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#CBE3D0\"/>\n  <text x=\"380\" y=\"420\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1E6B33\">7 · Inventarios (stock)</text>\n  <text x=\"380\" y=\"440\" font-size=\"11.5\" fill=\"#444\">EOQ/LEC, punto de reorden,</text>\n  <text x=\"380\" y=\"457\" font-size=\"11.5\" fill=\"#444\">stock de seguridad, clasificación ABC</text>\n\n  <rect x=\"58\" y=\"484\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#CBE3D0\"/>\n  <text x=\"72\" y=\"506\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1E6B33\">8 · MRP</text>\n  <text x=\"72\" y=\"526\" font-size=\"11.5\" fill=\"#444\">BOM, requerimientos brutos y netos,</text>\n  <text x=\"72\" y=\"543\" font-size=\"11.5\" fill=\"#444\">lead times, loteo (EOQ/POQ/PPB)</text>\n\n  <rect x=\"366\" y=\"484\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#CBE3D0\" stroke-dasharray=\"4 3\"/>\n  <text x=\"380\" y=\"506\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1E6B33\">12 · Teoría de la decisión  (transversal)</text>\n  <text x=\"380\" y=\"526\" font-size=\"11.5\" fill=\"#444\">Criterios bajo incertidumbre y riesgo,</text>\n  <text x=\"380\" y=\"543\" font-size=\"11.5\" fill=\"#444\">valor esperado, árboles de decisión</text>\n\n  <line x1=\"360\" y1=\"574\" x2=\"360\" y2=\"600\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ===== CAPA 3 ===== -->\n  <rect x=\"40\" y=\"606\" width=\"640\" height=\"212\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\"/>\n  <text x=\"58\" y=\"631\" font-size=\"15.5\" font-weight=\"700\" fill=\"#8A5A16\">CAPA 3 · EJECUTAR</text>\n  <text x=\"205\" y=\"631\" font-size=\"12\" fill=\"#666\">¿Cómo se produce y cómo se identifica cada cosa?</text>\n  <text x=\"662\" y=\"631\" font-size=\"11\" font-weight=\"700\" fill=\"#B07C2A\" text-anchor=\"end\">Temas 9–11, 13, 14</text>\n\n  <rect x=\"58\" y=\"642\" width=\"192\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#EADCC5\"/>\n  <text x=\"70\" y=\"664\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">9 · Balanceo de línea</text>\n  <text x=\"70\" y=\"684\" font-size=\"11.5\" fill=\"#444\">Precedencias, tiempo de</text>\n  <text x=\"70\" y=\"701\" font-size=\"11.5\" fill=\"#444\">ciclo, eficiencia</text>\n\n  <rect x=\"262\" y=\"642\" width=\"192\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#EADCC5\"/>\n  <text x=\"274\" y=\"664\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">10 · Hombre–máquina</text>\n  <text x=\"274\" y=\"684\" font-size=\"11.5\" fill=\"#444\">Ciclo, tiempo ocioso,</text>\n  <text x=\"274\" y=\"701\" font-size=\"11.5\" fill=\"#444\">costo horario</text>\n\n  <rect x=\"466\" y=\"642\" width=\"198\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#EADCC5\"/>\n  <text x=\"478\" y=\"664\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">11 · Capacidad</text>\n  <text x=\"478\" y=\"684\" font-size=\"11.5\" fill=\"#444\">Capacidad real, scrap,</text>\n  <text x=\"478\" y=\"701\" font-size=\"11.5\" fill=\"#444\">curvas de aprendizaje</text>\n\n  <rect x=\"58\" y=\"728\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#EADCC5\"/>\n  <text x=\"72\" y=\"750\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">13 · Producto</text>\n  <text x=\"72\" y=\"770\" font-size=\"11.5\" fill=\"#444\">Ciclo de vida y sus etapas, estructura</text>\n  <text x=\"72\" y=\"787\" font-size=\"11.5\" fill=\"#444\">del producto (BOM), hoja de ruta</text>\n\n  <rect x=\"366\" y=\"728\" width=\"298\" height=\"76\" rx=\"6\" fill=\"#fff\" stroke=\"#EADCC5\"/>\n  <text x=\"380\" y=\"750\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">14 · Identificación y codificación</text>\n  <text x=\"380\" y=\"770\" font-size=\"11.5\" fill=\"#444\">Clasificación de materiales, códigos,</text>\n  <text x=\"380\" y=\"787\" font-size=\"11.5\" fill=\"#444\">dígito verificador IBM-11</text>\n\n  <!-- ===== CAPA 4 (banda derecha) ===== -->\n  <rect x=\"700\" y=\"118\" width=\"220\" height=\"700\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#D3C4E4\"/>\n  <text x=\"716\" y=\"143\" font-size=\"15.5\" font-weight=\"700\" fill=\"#5B3E8E\">CAPA 4</text>\n  <text x=\"716\" y=\"162\" font-size=\"14\" font-weight=\"700\" fill=\"#5B3E8E\">SISTEMAS</text>\n  <text x=\"716\" y=\"180\" font-size=\"11.5\" fill=\"#666\">Gobiernan las 3 capas</text>\n  <text x=\"904\" y=\"143\" font-size=\"11\" font-weight=\"700\" fill=\"#7B5AA6\" text-anchor=\"end\">Temas 15–18</text>\n\n  <rect x=\"716\" y=\"196\" width=\"188\" height=\"88\" rx=\"6\" fill=\"#fff\" stroke=\"#DFD3EC\"/>\n  <text x=\"728\" y=\"218\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">15 · Estrategia</text>\n  <text x=\"728\" y=\"238\" font-size=\"11.5\" fill=\"#444\">Administración estratégica</text>\n  <text x=\"728\" y=\"255\" font-size=\"11.5\" fill=\"#444\">de la capacidad; visión</text>\n  <text x=\"728\" y=\"272\" font-size=\"11.5\" fill=\"#444\">de largo plazo</text>\n\n  <rect x=\"716\" y=\"296\" width=\"188\" height=\"106\" rx=\"6\" fill=\"#fff\" stroke=\"#DFD3EC\"/>\n  <text x=\"728\" y=\"318\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">16 · Sistemas de</text>\n  <text x=\"728\" y=\"335\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">planificación</text>\n  <text x=\"728\" y=\"356\" font-size=\"11.5\" fill=\"#444\">MRP → MRP II (MCP) → ERP</text>\n  <text x=\"728\" y=\"373\" font-size=\"11.5\" fill=\"#444\">PAC · DRP (distribución)</text>\n  <text x=\"728\" y=\"390\" font-size=\"11.5\" fill=\"#444\">JIT (justo a tiempo)</text>\n\n  <rect x=\"716\" y=\"414\" width=\"188\" height=\"106\" rx=\"6\" fill=\"#fff\" stroke=\"#DFD3EC\"/>\n  <text x=\"728\" y=\"436\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">17 · Decisión y datos</text>\n  <text x=\"728\" y=\"457\" font-size=\"11.5\" fill=\"#444\">DSS · BI · Data Warehouse</text>\n  <text x=\"728\" y=\"474\" font-size=\"11.5\" fill=\"#444\">ETL, modelo dimensional,</text>\n  <text x=\"728\" y=\"491\" font-size=\"11.5\" fill=\"#444\">drill down / roll up,</text>\n  <text x=\"728\" y=\"508\" font-size=\"11.5\" fill=\"#444\">ciclo de vida Kimball</text>\n\n  <rect x=\"716\" y=\"532\" width=\"188\" height=\"88\" rx=\"6\" fill=\"#fff\" stroke=\"#DFD3EC\"/>\n  <text x=\"728\" y=\"554\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">18 · Complementos</text>\n  <text x=\"728\" y=\"574\" font-size=\"11.5\" fill=\"#444\">Calidad Six Sigma, lean,</text>\n  <text x=\"728\" y=\"591\" font-size=\"11.5\" fill=\"#444\">logística, programación</text>\n  <text x=\"728\" y=\"608\" font-size=\"11.5\" fill=\"#888\">(prioridad baja)</text>\n\n  <line x1=\"700\" y1=\"470\" x2=\"682\" y2=\"470\" stroke=\"#7B5AA6\" stroke-width=\"2\" marker-end=\"url(#arS)\"/>\n  <text x=\"716\" y=\"648\" font-size=\"11.5\" fill=\"#5B3E8E\" font-weight=\"700\">El ERP es la versión</text>\n  <text x=\"716\" y=\"665\" font-size=\"11.5\" fill=\"#5B3E8E\" font-weight=\"700\">informatizada de todo</text>\n  <text x=\"716\" y=\"682\" font-size=\"11.5\" fill=\"#5B3E8E\" font-weight=\"700\">lo que está a la izquierda.</text>\n  <text x=\"716\" y=\"712\" font-size=\"11.5\" fill=\"#555\">Como ingeniero en sistemas,</text>\n  <text x=\"716\" y=\"729\" font-size=\"11.5\" fill=\"#555\">esta capa es el puente entre</text>\n  <text x=\"716\" y=\"746\" font-size=\"11.5\" fill=\"#555\">la fábrica y el software que</text>\n  <text x=\"716\" y=\"763\" font-size=\"11.5\" fill=\"#555\">la gobierna.</text>\n\n  <!-- LEYENDA -->\n  <rect x=\"40\" y=\"838\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#1F4E79\"/>\n  <text x=\"62\" y=\"850\" font-size=\"12\" fill=\"#333\"><tspan font-weight=\"700\">Temas 1 a 11:</tspan> se CALCULAN → examen de práctica (eliminatorio, se rinde primero)</text>\n  <rect x=\"40\" y=\"862\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#7B5AA6\"/>\n  <text x=\"62\" y=\"874\" font-size=\"12\" fill=\"#333\"><tspan font-weight=\"700\">Temas 12 a 18:</tspan> se EXPLICAN → examen de teoría (después de aprobar la práctica)</text>\n</svg>"},{"type":"heading","level":2,"text":"9. Bibliografía que cita el material","html":"9. Bibliografía que cita el material"},{"type":"list","ordered":false,"items":["Programa oficial: Chase (10.ª ed.), Monks, APICS y apuntes de Sessa.","Práctica de pronósticos (Documento Maestro / notas): Hanke, capítulos 2 a 6, más el apunte de regresión.","APICS aparece citado como American Production & Inventory Control Society, referencia de vocabulario (Documento Maestro)."],"itemsHtml":["Programa oficial: Chase (10.ª ed.), Monks, APICS y apuntes de Sessa.","Práctica de pronósticos (Documento Maestro / notas): Hanke, capítulos 2 a 6, más el apunte de regresión.","APICS aparece citado como American Production &amp; Inventory Control Society, referencia de vocabulario (Documento Maestro)."]},{"type":"heading","level":2,"text":"10. Qué sigue","html":"10. Qué sigue"},{"type":"paragraph","text":"La Clase 0.1 junta las **siglas** con el significado tal como está en los apuntes (y marca las que aparecen sin expansión). Después entra la Clase 1: la base estadística, que ya está cargada.","html":"La Clase 0.1 junta las <strong>siglas</strong> con el significado tal como está en los apuntes (y marca las que aparecen sin expansión). Después entra la Clase 1: la base estadística, que ya está cargada."},{"type":"callout","kind":"idea","text":"**Para llevarte:** 7 unidades, 4 insumos, una cadena en la U6, práctica primero (eliminatoria) y teoría después. El peso de cada tema se lee en el conteo de finales, no en un 50 y 50.","html":"<strong>Para llevarte:</strong> 7 unidades, 4 insumos, una cadena en la U6, práctica primero (eliminatoria) y teoría después. El peso de cada tema se lee en el conteo de finales, no en un 50 y 50."}],"historias":[{"type":"concepto","k":"La idea","title":"La materia es la anatomía de un ERP.","text":"Así lo dice el mapa v2: de la empresa como sistema (U1) al software que la gestiona (U7). En el medio están los insumos y el motor que los junta.","html":"Así lo dice el mapa v2: de la empresa como sistema (U1) al software que la gestiona (U7). En el medio están los insumos y el motor que los junta.","titleHtml":"La materia es la anatomía de un ERP."},{"type":"concepto","k":"El programa","title":"Son 7 unidades, las del programa 2008.","text":"U1 la empresa, U2 pronósticos, U3 el producto, U4 el proceso, U5 logística, U6 planificación y control, U7 softwares ERP. En el material no hay un programa más nuevo.","svg":"<svg viewBox=\"0 0 284 100\" width=\"100%\" height=\"100\" aria-hidden=\"true\"><path d=\"M 60 58 L 70 58\" stroke=\"#9aa3ad\" stroke-width=\"1.4\" marker-end=\"\"/><path d=\"M 176 44 L 186 56\" stroke=\"#9aa3ad\" stroke-width=\"1.4\"/><path d=\"M 240 58 L 248 58\" stroke=\"#9aa3ad\" stroke-width=\"1.4\"/><rect x=\"8\" y=\"40\" width=\"52\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\" t-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">U7</text><text x=\"262.0\" y=\"68\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">ERP</text></svg>","chartLabel":"U1 marco · U2–U5 insumos · U6 motor · U7 software","html":"U1 la empresa, U2 pronósticos, U3 el producto, U4 el proceso, U5 logística, U6 planificación y control, U7 softwares ERP. En el material no hay un programa más nuevo.","titleHtml":"Son 7 unidades, las del programa 2008."},{"type":"concepto","k":"La conexión","title":"Cuatro insumos entran al motor.","text":"U2 te dice la demanda, U3 el BOM, U4 la capacidad y los métodos, U5 los modelos de stock. La U6 los consume y arma: plan agregado → MPS → capacidad → MRP → control de piso.","svg":"<svg viewBox=\"0 0 284 100\" width=\"100%\" height=\"100\" aria-hidden=\"true\"><path d=\"M 60 58 L 70 58\" stroke=\"#9aa3ad\" stroke-width=\"1.4\" marker-end=\"\"/><path d=\"M 176 44 L 186 56\" stroke=\"#9aa3ad\" stroke-width=\"1.4\"/><path d=\"M 240 58 L 248 58\" stroke=\"#9aa3ad\" stroke-width=\"1.4\"/><rect x=\"8\" y=\"40\" width=\"52\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.6\"/><text x=\"34.0\" y=\"56\" font-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">U1</text><text x=\"34.0\" y=\"68\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">marco</text><rect x=\"72\" y=\"14\" width=\"48\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"#e8c56a\" stroke-width=\"1.6\"/><text x=\"96.0\" y=\"30\" font-size=\"11\" fill=\"#e8c56a\" font-weight=\"700\" text-anchor=\"middle\">U2</text><text x=\"96.0\" y=\"42\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">demanda</text><rect x=\"72\" y=\"46\" width=\"48\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"#e8c56a\" stroke-width=\"1.6\"/><text x=\"96.0\" y=\"62\" font-size=\"11\" fill=\"#e8c56a\" font-weight=\"700\" text-anchor=\"middle\">U3</text><text x=\"96.0\" y=\"74\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"mid "Según el mapa v2, ¿qué le entra a la U6?"},{"type":"concepto","k":"El final","title":"Primero se calcula. Después se explica.","text":"[P] es práctica, eliminatoria y va primero. [T] es teoría. En el examen de 2018: 40 minutos de práctica (un MPS) y 30 minutos de teoría (5 preguntas).","html":"[P] es práctica, eliminatoria y va primero. [T] es teoría. En el examen de 2018: 40 minutos de práctica (un MPS) y 30 minutos de teoría (5 preguntas).","titleHtml":"Primero se calcula. Después se explica."},{"type":"concepto","k":"Cómo te evalúan","title":"No alcanza con el número.","text":"El programa pide claridad conceptual, relaciones entre contenidos, vocabulario específico, interpretación y fundamentación. Esas cinco líneas van impresas en el encabezado del examen.","html":"El programa pide claridad conceptual, relaciones entre contenidos, vocabulario específico, interpretación y fundamentación. Esas cinco líneas van impresas en el encabezado del examen.","titleHtml":"No alcanza con el número."},{"type":"pregunta","k":"A ver…","title":"Si no aprobás la práctica del final…","options":["Pasás igual a la teoría","Quedás libre","No pasás a la teoría: es eliminatoria"],"correct":2,"feedback":"Según las notas de cursada y el Documento Maestro, se rinde primero la práctica y es eliminatoria. Recién después va la teoría.","titleHtml":"Si no aprobás la práctica del final…"},{"type":"concepto","k":"La práctica","title":"El peso se cuenta, no se estima.","text":"En 19 finales fechados (2002–2018), una mesa cuenta una vez por tema: MRP 42%, pronósticos 32%, inventarios 26%, balanceo 21%. Plan agregado y hombre-máquina, 11%. MPS y capacidad, 5%.","svg":"<svg viewBox=\"0 0 280 132\" width=\"100%\" height=\"132\" aria-hidden=\"true\"><line x1=\"28\" y1=\"112\" x2=\"272\" y2=\"112\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><rect x=\"32.0\" y=\"30.0\" width=\"18.3\" height=\"82.0\" fill=\"#e8c56a\"/><text x=\"41.15\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">MRP</text><text x=\"41.15\" y=\"27.0\" font-size=\"8\" fill=\"#e8c56a\" text-anchor=\"middle\">8</text><rect x=\"62.5\" y=\"50.5\" width=\"18.3\" height=\"61.5\" fill=\"#8cb4d6\"/><text x=\"71.65\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">Pron</text><text x=\"71.65\" y=\"47.5\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">6</text><rect x=\"93.0\" y=\"60.75\" width=\"18.3\" height=\"51.25\" fill=\"#8cb4d6\"/><text x=\"102.15\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">Inv</text><text x=\"102.15\" y=\"57.75\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">5</text><rect x=\"123.5\" y=\"71.0\" width=\"18.3\" height=\"41.0\" fill=\"#8cb4d6\"/><text x=\"132.65\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">Bal</text><text x=\"132.65\" y=\"68.0\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">4</text><rect x=\"154.0\" y=\"91.5\" width=\"18.3\" height=\"20.5\" fill=\"#8cb4d6\"/><text x=\"163.15\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">PA</text><text x=\"163.15\" y=\"88.5\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">2</text><rect x=\"184.5\" y=\"91.5\" width=\"18.3\" height=\"20.5\" fill=\"#8cb4d6\"/><text x=\"193.65\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">HM</text><text x=\"193.65\" y=\"88.5\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">2</text><rect x=\"215.0\" y=\"101.75\" width=\"18.3\" height=\"10.25\" fill=\"#8cb4d6\"/><text x=\"224.15\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">MPS</text><text x=\"224.15\" y=\"98.75\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">1</text><rect x=\"245.5\" y=\"101.75\" width=\"18.3\" height=\"10.25\" fill=\"#8cb4d6\"/><text x=\"254.65\" y=\"126\" font-size=\"8\" fill=\"#9aa3ad\" text-anchor=\"middle\">Cap</text><text x=\"254.65\" y=\"98.75\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">1</text></svg>","chartLabel":"Mesas con el tema en la práctica (n=19 finales con fecha)","html":"En 19 finales fechados (2002–2018), una mesa cuenta una vez por tema: MRP 42%, pronósticos 32%, inventarios 26%, balanceo 21%. Plan agregado y hombre-máquina, 11%. MPS y capacidad, 5%.","titleHtml":"El peso se cuenta, no se estima."},{"type":"concepto","k":"Con cuidado","title":"No uses un «50 y 50».","text":"El mapa v2 dibuja U2 y U6 como media práctica cada una; el conteo de mesas no dice eso. Faltan finales 2016–17 y 2019–26, y la muestra 2011–2018 es de solo 7 mesas.","html":"El mapa v2 dibuja U2 y U6 como media práctica cada una; el conteo de mesas no dice eso. Faltan finales 2016–17 y 2019–26, y la muestra 2011–2018 es de solo 7 mesas.","titleHtml":"No uses un «50 y 50»."},{"type":"pregunta","k":"A ver…","title":"En esos 19 finales, el tema de práctica más frecuente fue…","options":["Pronósticos","MRP","Inventarios (EOQ)"],"correct":1,"feedback":"MRP aparece en 8 de 19 mesas (42%). Importante: en la cursada práctica no se llegó a dar, pero sí cae en el final.","titleHtml":"En esos 19 finales, el tema de práctica más frecuente fue…"},{"type":"concepto","k":"La teoría","title":"En 7 finales (2011–2018), lo que más sale.","text":"Codificación en 6 de 7, capacidad y pronósticos en 5 de 7. BI y decisiones racionales aparecieron solo en 2018, y están fuera del programa 2008.","html":"Codificación en 6 de 7, capacidad y pronósticos en 5 de 7. BI y decisiones racionales aparecieron solo en 2018, y están fuera del programa 2008.","titleHtml":"En 7 finales (2011–2018), lo que más sale."},{"type":"concepto","k":"Bibliografía","title":"Lo que cita el material.","text":"Chase, Monks, APICS y los apuntes de Sessa. La práctica de pronósticos se apoya en Hanke (capítulos 2 a 6) y en el apunte de regresión.","html":"Chase, Monks, APICS y los apuntes de Sessa. La práctica de pronósticos se apoya en Hanke (capítulos 2 a 6) y en el apunte de regresión.","titleHtml":"Lo que cita el material."},{"type":"cierre","title":"Llevate el mapa.","text":"Siete unidades. Cuatro insumos que alimentan la U6. Práctica primero (eliminatoria), teoría después. El peso de cada tema sale del conteo de finales. Sigue la Clase 0.1: las siglas, con el significado tal como está en los apuntes.","html":"Siete unidades. Cuatro insumos que alimentan la U6. Práctica primero (eliminatoria), teoría después. El peso de cada tema sale del conteo de finales. Sigue la Clase 0.1: las siglas, con el significado tal como está en los apuntes.","titleHtml":"Llevate el mapa."}],"titleHtml":"Clase 0 · Mapa de la materia","ledeHtml":"La materia es la anatomía de un ERP: de la empresa como sistema (U1) al software que la gestiona (U7). Esta clase arma el mapa oficial, cómo se conectan las 7 unidades y qué se toma en el final, con las frecuencias reales de los exámenes fechados."},"c01":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c01","title":"Clase 0.1 · Siglas","name":"Siglas","lede":"El criterio de evaluación pide vocabulario específico. Esta clase junta las siglas del programa, el mapa, los apuntes y los exámenes, con el significado tal como aparece en el material. Si una sigla se usa pero no se desarrolla, va al final: no se inventa.","visto":true,"source":["texto/resumenes/Resumen_Sistema_de_Gestion_7p.txt","texto/resumenes/ResumenSG-Final-V6_345p.txt","texto/resumenes/Resumen_Hanke_25p.txt","texto/Preguntas_Frecuentes.txt","clases_previas/SG/SistemasDeGestion_DocumentoMaestro_v2.txt","clases_previas/SG/Clase04_MedidasDeError.md","clases_previas/SG/Clase03b_Autocorrelacion.md","clases_previas/SG/Clase02_Correlacion.md","programa.md (SG1Progr2008.doc)","patrones_examenes.md","clases_previas/SG/MapaMateria_SistemasDeGestion_v2.svg","clases_previas/conversacion_previa_notas.md","aportes_emiliano/examen_2018_transcripcion.md","drive/03_El proceso de Producción/PAC.pdf (R. Morán, 2001) → texto/apuntes_nuevos/PAC.txt","drive/06_Decisiones en Logística Integral/DRP.pdf (R. Morán, 2000) → texto/apuntes_nuevos/DRP.txt","drive/03_El proceso de Producción/Planificacion de la Capacidad.pdf (R. Morán, 2001)","drive/07_Sistema de Soporte a la Toma de Decisiones/2014 - Inteligencia de Negocios.pdf","texto/examenes/Preguntas SG1.txt (y bancos de teoría equivalentes)"],"laminas":["u2/img/MapaMateria_SistemasDeGestion_v2.svg"],"next":"Clase 1 · Base estadística","teoria":[{"type":"callout","kind":"idea","text":"**Idea central:** no memorices una lista suelta. Las siglas son el vocabulario de la cadena de planificación (plan agregado → MPS → capacidad → MRP → control de piso → ERP) y de los insumos que la alimentan. El programa pide «la utilización de un vocabulario específico».","html":"<strong>Idea central:</strong> no memorices una lista suelta. Las siglas son el vocabulario de la cadena de planificación (plan agregado → MPS → capacidad → MRP → control de piso → ERP) y de los insumos que la alimentan. El programa pide «la utilización de un vocabulario específico»."},{"type":"heading","level":2,"text":"1. De dónde sale esta clase","html":"1. De dónde sale esta clase"},{"type":"paragraph","text":"No hay un apunte titulado «Clase 0.1 · Siglas». En la cursada se dictó (notas de la conversación previa). El glosario se reconstruyó con el Resumen de 7 páginas, el Resumen SG Final V6 (Chase), el resumen de Hanke, Preguntas frecuentes, el Documento Maestro v2, el programa 2008, el mapa v2, los apuntes de las Clases 2 a 4 y la transcripción del final 2018. Cada significado lleva la fuente. **No se completa una sigla “de memoria general”.**","html":"No hay un apunte titulado «Clase 0.1 · Siglas». En la cursada se dictó (notas de la conversación previa). El glosario se reconstruyó con el Resumen de 7 páginas, el Resumen SG Final V6 (Chase), el resumen de Hanke, Preguntas frecuentes, el Documento Maestro v2, el programa 2008, el mapa v2, los apuntes de las Clases 2 a 4 y la transcripción del final 2018. Cada significado lleva la fuente. <strong>No se completa una sigla “de memoria general”.</strong>"},{"type":"heading","level":2,"text":"2. La cadena corta","html":"2. La cadena corta"},{"type":"paragraph","text":"El Resumen de 7 páginas dice que el sistema de **Planificación de los Requerimientos de Materiales (MRP: Material Requirements Planning)** obtiene las necesidades de cada una de las partes, en cada período, para cumplir con las cantidades de los productos finales fijadas en el **Plan Maestro de Producción (MPS)**. El MRP gestiona existencias de **demanda dependiente**: las necesidades se calculan a partir del MPS.","html":"El Resumen de 7 páginas dice que el sistema de <strong>Planificación de los Requerimientos de Materiales (MRP: Material Requirements Planning)</strong> obtiene las necesidades de cada una de las partes, en cada período, para cumplir con las cantidades de los productos finales fijadas en el <strong>Plan Maestro de Producción (MPS)</strong>. El MRP gestiona existencias de <strong>demanda dependiente</strong>: las necesidades se calculan a partir del MPS."},{"type":"paragraph","text":"En el Resumen V6, «el programa maestro de producción (MPS) es el plan con los tiempos desglosados que especifica cuántas piezas finales va a fabricar la empresa y cuándo».","html":"En el Resumen V6, «el programa maestro de producción (MPS) es el plan con los tiempos desglosados que especifica cuántas piezas finales va a fabricar la empresa y cuándo»."},{"type":"paragraph","text":"El mismo V6 presenta **MRP II** como **planeación de recursos de manufactura**: una expansión del MRP para planear y monitorear más áreas de la empresa. El programa oficial habla de «Sistemas MRPII (CRP)». El Documento Maestro anota: «MRP II (CRP — planificación de requerimientos de capacidad)» y la pregunta textual «MRP vs. MRP II/MCP vs. ERP». **MCP aparece en esa pregunta; el material leído no desarrolla la sigla** (queda en la sección 8).","html":"El mismo V6 presenta <strong>MRP II</strong> como <strong>planeación de recursos de manufactura</strong>: una expansión del MRP para planear y monitorear más áreas de la empresa. El programa oficial habla de «Sistemas MRPII (CRP)». El Documento Maestro anota: «MRP II (CRP — planificación de requerimientos de capacidad)» y la pregunta textual «MRP vs. MRP II/MCP vs. ERP». <strong>MCP aparece en esa pregunta; el material leído no desarrolla la sigla</strong> (queda en la sección 8)."},{"type":"paragraph","text":"**ERP**, en el objetivo de la U7 del programa: «paquetes pre-programados parametrizables existentes en el mercado para la gestión integral de los recursos en empresas industriales (ERP)». El V6 habla de «sistemas de planeación de recursos empresariales». El mapa resume la historia: **MRP → MRP II → ERP**. SAP aparece como «caso típico» de sistema comercial, no como una sigla a expandir.","html":"<strong>ERP</strong>, en el objetivo de la U7 del programa: «paquetes pre-programados parametrizables existentes en el mercado para la gestión integral de los recursos en empresas industriales (ERP)». El V6 habla de «sistemas de planeación de recursos empresariales». El mapa resume la historia: <strong>MRP → MRP II → ERP</strong>. SAP aparece como «caso típico» de sistema comercial, no como una sigla a expandir."},{"type":"svg","file":"u2/img/MapaMateria_SistemasDeGestion_v2.svg","caption":"Mapa v2: la cadena vive en la U6 y se empaqueta en la U7","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 940\" width=\"980\" height=\"940\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n    <marker id=\"arG\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#8A8A8A\"/>\n    </marker>\n  </defs>\n\n  <rect width=\"980\" height=\"940\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"36\" font-size=\"24\" font-weight=\"700\" fill=\"#1F4E79\">SISTEMAS DE GESTIÓN — mapa v2 según programa oficial</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" fill=\"#666\">Hilo conductor: la materia es la anatomía de un ERP — de la empresa como sistema (U1) al software que la gestiona (U7)</text>\n\n  <!-- ============ U1: MARCO SUPERIOR ============ -->\n  <rect x=\"40\" y=\"76\" width=\"900\" height=\"96\" rx=\"10\" fill=\"#EDF3F9\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"102\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 1 · LA EMPRESA COMO PRODUCTORA DE BIENES</text>\n  <text x=\"700\" y=\"102\" font-size=\"11\" font-weight=\"700\" fill=\"#2E74B5\">[T] el marco de todo</text>\n  <text x=\"58\" y=\"124\" font-size=\"11.5\" fill=\"#444\">La empresa como sistema · diagrama funcional · proceso de conversión (insumos → transformación → productos)</text>\n  <text x=\"58\" y=\"142\" font-size=\"11.5\" fill=\"#444\">Subsistemas y sus interacciones · flujo de información · el modelo ERP como integrador · productividad e indicadores · mejora continua</text>\n  <text x=\"58\" y=\"162\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Pregunta típica: “¿cómo se genera esta información? indique los subsistemas participantes”</text>\n\n  <line x1=\"490\" y1=\"172\" x2=\"490\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ FILA CENTRAL: U2 U3 U4 U5 (los insumos de la planificación) ============ -->\n  <text x=\"40\" y=\"216\" font-size=\"13\" font-weight=\"700\" fill=\"#555\">LOS 4 INSUMOS DE LA PLANIFICACIÓN — qué necesito saber antes de planificar:</text>\n\n  <!-- U2 -->\n  <rect x=\"40\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"54\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">U2 · PRONÓSTICOS</text>\n  <text x=\"54\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P] ½ de la práctica</text>\n  <text x=\"54\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto van a comprar?</text>\n  <text x=\"54\" y=\"311\" font-size=\"10.8\" fill=\"#333\">· Base estadística (normal, t)</text>\n  <text x=\"54\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Patrones: tendencia, ciclo,</text>\n  <text x=\"62\" y=\"343\" font-size=\"10.8\" fill=\"#333\">estacionalidad · autocorrelación</text>\n  <text x=\"54\" y=\"360\" font-size=\"10.8\" fill=\"#333\">· Errores MAD/MSE/MAPE</text>\n  <text x=\"54\" y=\"377\" font-size=\"10.8\" fill=\"#333\">· Suavización: simple, Holt, Winter</text>\n  <text x=\"54\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Descomposición multiplicativa</text>\n  <text x=\"54\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Regresión simple y múltiple</text>\n  <text x=\"54\" y=\"426\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Clave: elegir método y justificar</text>\n\n  <!-- U3 -->\n  <rect x=\"270\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"284\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">U3 · EL PRODUCTO</text>\n  <text x=\"284\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">[T + cálculo puntual]</text>\n  <text x=\"284\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Qué fabricamos y cómo</text>\n  <text x=\"284\" y=\"305\" font-size=\"11\" fill=\"#444\">se representa en el sistema?</text>\n  <text x=\"284\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tangibles vs. intangibles</text>\n  <text x=\"284\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Ciclo de vida y sus etapas ★</text>\n  <text x=\"284\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Codificación: significativos o no,</text>\n  <text x=\"292\" y=\"377\" font-size=\"10.8\" fill=\"#333\">códigos de barras</text>\n  <text x=\"284\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Dígito verificador IBM-11 ★ [P]</text>\n  <text x=\"284\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· BOM: explosión por niveles,</text>\n  <text x=\"292\" y=\"426\" font-size=\"10.8\" fill=\"#333\">implosión indentada ★</text>\n\n  <!-- U4 -->\n  <rect x=\"500\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"514\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1E6B33\">U4 · EL PROCESO</text>\n  <text x=\"514\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1E6B33\">[T + P]</text>\n  <text x=\"514\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cómo se produce</text>\n  <text x=\"514\" y=\"305\" font-size=\"11\" fill=\"#444\">físicamente?</text>\n  <text x=\"514\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tipos de procesos industriales</text>\n  <text x=\"514\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Máquinas y centros de trabajo</text>\n  <text x=\"514\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Estudio del trabajo:</text>\n  <text x=\"522\" y=\"377\" font-size=\"10.8\" fill=\"#333\">gráfica hombre–máquina ★ [P]</text>\n  <text x=\"514\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· JIT ★ · Kanban · TQM · SMED</text>\n  <text x=\"514\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Teoría de las Restricciones</text>\n  <text x=\"522\" y=\"426\" font-size=\"10.8\" fill=\"#333\">(Goldratt, cuellos de botella)</text>\n\n  <!-- U5 -->\n  <rect x=\"730\" y=\"228\" width=\"210\" height=\"204\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#E5C2C2\" stroke-width=\"1.5\"/>\n  <text x=\"744\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#9C3838\">U5 · LOGÍSTICA</text>\n  <text x=\"744\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P + T]</text>\n  <text x=\"744\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto material tener</text>\n  <text x=\"744\" y=\"305\" font-size=\"11\" fill=\"#444\">y cómo abastecerse?</text>\n  <text x=\"744\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· EOQ/LEC · punto de reorden</text>\n  <text x=\"744\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· EOQ con descuentos ★</text>\n  <text x=\"744\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Periódico vs. perpetuo ★</text>\n  <text x=\"744\" y=\"379\" font-size=\"10.8\" fill=\"#333\">· Stock de seguridad (normal)</text>\n  <text x=\"744\" y=\"396\" font-size=\"10.8\" fill=\"#333\">· Clasificación ABC ★</text>\n  <text x=\"744\" y=\"413\" font-size=\"10.8\" fill=\"#333\">· Compras, proveedores JIT ★</text>\n  <text x=\"744\" y=\"428\" font-size=\"10.8\" fill=\"#333\">· Almacenes y trazabilidad</text>\n\n  <!-- flechas de los 4 a U6 -->\n  <line x1=\"146\" y1=\"432\" x2=\"330\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"376\" y1=\"432\" x2=\"420\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"606\" y1=\"432\" x2=\"560\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"835\" y1=\"432\" x2=\"650\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n\n  <!-- ============ U6: EL MOTOR ============ -->\n  <rect x=\"120\" y=\"504\" width=\"740\" height=\"196\" rx=\"10\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2.5\"/>\n  <text x=\"140\" y=\"530\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 6 · PLANIFICACIÓN Y CONTROL DE LA PRODUCCIÓN</text>\n  <text x=\"700\" y=\"530\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">[P] la otra ½ de la práctica</text>\n  <text x=\"140\" y=\"548\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">El motor donde se juntan los 4 insumos — la cadena operativa:</text>\n\n  <g font-size=\"11\" font-weight=\"700\">\n    <rect x=\"140\" y=\"560\" width=\"126\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"203\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">PLAN AGREGADO ★</text>\n    <line x1=\"270\" y1=\"575\" x2=\"288\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"292\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"335\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MPS ★</text>\n    <line x1=\"382\" y1=\"575\" x2=\"400\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"404\" y=\"560\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"464\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CAPACIDAD ★</text>\n    <line x1=\"528\" y1=\"575\" x2=\"546\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"550\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"593\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MRP ★</text>\n    <line x1=\"640\" y1=\"575\" x2=\"658\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"662\" y=\"560\" width=\"178\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"751\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CONTROL DE PISO</text>\n  </g>\n\n  <text x=\"140\" y=\"618\" font-size=\"10.8\" fill=\"#333\">· Plan agregado: persecución / nivelación, costos ★   · MPS: pronóstico vs. ventas confirmadas ★ (examen 2018)</text>\n  <text x=\"140\" y=\"636\" font-size=\"10.8\" fill=\"#333\">· Capacidad: listas de capacidad y perfiles de recursos ★, factor de actividad, scrap, curvas de aprendizaje</text>\n  <text x=\"140\" y=\"654\" font-size=\"10.8\" fill=\"#333\">· MRP: brutos→netos, lead times, scrap ★, loteo LEC/TBO-POQ ★/PPB   [tema huérfano: refuerzo extra]   · MRP II (CRP)</text>\n  <text x=\"140\" y=\"672\" font-size=\"10.8\" fill=\"#333\">· Balanceo de línea ★: precedencias, tiempo de ciclo, eficiencia   · Emisión y lanzamiento de órdenes, hoja de ruta ★</text>\n  <text x=\"140\" y=\"691\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">La U6 consume: la demanda de U2, el BOM de U3, la capacidad y métodos de U4, y
