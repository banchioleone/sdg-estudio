 alcanza. Hay que medir el error a lo largo de toda la serie y resumirlo en un número.","html":"Pronosticaste 500 y vendiste 480. ¿Estuviste bien o mal? Y si otro método dijo 510, ¿cuál es mejor? Un mes suelto no alcanza. Hay que medir el error a lo largo de toda la serie y resumirlo en un número.","titleHtml":"El árbol propone. Las medidas deciden."},{"type":"concepto","k":"El ladrillo","title":"El residual: lo real menos lo pronosticado.","text":"eₜ = Yₜ − Ŷₜ. El signo importa: e positivo = vendiste MÁS de lo previsto (subestimaste). e negativo = vendiste MENOS (sobreestimaste).","formula":"e_t = Y_t - \\hat{Y}_t","formulaHtml":"<span class=\"eq-block\">e<sub>t</sub> = Y<sub>t</sub> - <span class=\"hat\">Y</span><sub>t</sub></span>","html":"eₜ = Yₜ − Ŷₜ. El signo importa: e positivo = vendiste MÁS de lo previsto (subestimaste). e negativo = vendiste MENOS (sobreestimaste).","titleHtml":"El residual: lo real menos lo pronosticado."},{"type":"pregunta","k":"A ver…","title":"Vendiste 480 y el pronóstico era 500. El residual es…","options":["+20: subestimaste","−20: sobreestimaste","−20: subestimaste"],"correct":1,"feedback":"e = 480 − 500 = −20. Vendiste menos de lo previsto → sobreestimaste.","titleHtml":"Vendiste 480 y el pronóstico era 500. El residual es…"},{"type":"concepto","k":"Por qué son cuatro","title":"Si promediás los errores crudos, se cancelan.","text":"Un mes +50 y otro −50: el promedio da 0 y parecerías perfecto. Hay dos soluciones a la cancelación: valor absoluto (MAD, MAPE) o elevar al cuadrado (MSE). Y una medida que aprovecha la cancelación a propósito para medir sesgo: PME.","html":"Un mes +50 y otro −50: el promedio da 0 y parecerías perfecto. Hay dos soluciones a la cancelación: valor absoluto (MAD, MAPE) o elevar al cuadrado (MSE). Y una medida que aprovecha la cancelación a propósito para medir sesgo: PME.","titleHtml":"Si promediás los errores crudos, se cancelan."},{"type":"concepto","k":"MAD y MSE","title":"Unidades reales vs. castigo a los grandes.","text":"MAD = promedio de |e|: queda en las unidades originales («me equivoco típicamente en 15 unidades»). Es la base de la señal de rastreo. MSE = promedio de e²: castiga fuerte los errores grandes y es el criterio estándar para elegir parámetros (el α que minimiza el error).","ejemplo":"Errores 10 y 10 → MSE = 100. Errores 0 y 20 (mismo total) → MSE = 200. El MSE está en unidades al cuadrado: sirve para comparar, no para comunicar.","html":"MAD = promedio de |e|: queda en las unidades originales («me equivoco típicamente en 15 unidades»). Es la base de la señal de rastreo. MSE = promedio de e²: castiga fuerte los errores grandes y es el criterio estándar para elegir parámetros (el α que minimiza el error).","titleHtml":"Unidades reales vs. castigo a los grandes."},{"type":"concepto","k":"MAPE y PME","title":"Porcentaje, con y sin valor absoluto.","text":"MAPE deja el error en % y permite comparar series distintas (un MAD de 500 es horrible para una panadería y excelente para una automotriz). Cuidado: explota si algún Yₜ es cero. PME es igual pero SIN valor absoluto: mide el SESGO.","ejemplo":"PME ≈ 0: método centrado. Positivo y grande: subestima sistemáticamente. Negativo y grande: sobreestima sistemáticamente.","html":"MAPE deja el error en % y permite comparar series distintas (un MAD de 500 es horrible para una panadería y excelente para una automotriz). Cuidado: explota si algún Yₜ es cero. PME es igual pero SIN valor absoluto: mide el SESGO.","titleHtml":"Porcentaje, con y sin valor absoluto."},{"type":"pregunta","k":"A ver…","title":"Un PME positivo y grande te está diciendo…","options":["Que el método es impreciso, nada más","Que subestima sistemáticamente: se le está escapando un patrón","Que sobreestima, porque el signo del PME se lee al revés"],"correct":1,"feedback":"PME positivo = subestima (siempre pronostica de menos). Un PME grande no dice «impreciso»: dice que al método se le escapa un patrón. Caso típico: suavizado simple sobre una serie con tendencia creciente → conviene pasar a Holt.","titleHtml":"Un PME positivo y grande te está diciendo…"},{"type":"concepto","k":"El caso típico","title":"Si el PME delata tendencia, cambiá de método.","text":"Aplicás suavizado exponencial simple a una serie con tendencia creciente. El método siempre va «atrás», siempre pronostica de menos → PME positivo consistente. La solución no es afinar el α: es cambiar a un método con tendencia (Holt).","html":"Aplicás suavizado exponencial simple a una serie con tendencia creciente. El método siempre va «atrás», siempre pronostica de menos → PME positivo consistente. La solución no es afinar el α: es cambiar a un método con tendencia (Holt).","titleHtml":"Si el PME delata tendencia, cambiá de método."},{"type":"concepto","k":"Ejemplo A vs. B","title":"Cada medida dice algo distinto.","text":"Método A: MAD 4,83 · MSE 26,2 · MAPE 4,3% · PME +2,5%. Método B: MAD 6,50 · MSE 65,2 · MAPE 5,9% · PME −0,6%. A es más preciso (sobre todo en MSE: B tiene un error de −15 en el mes 5). B está mejor centrado.","ejemplo":"Se recomienda A por su mayor precisión, monitoreando la tendencia a subestimar. Usar las cuatro medidas es lo que convierte una cuenta en una interpretación.","svg":"<svg viewBox=\"0 0 280 132\" width=\"100%\" height=\"132\" aria-hidden=\"true\"><text x=\"28\" y=\"12\" font-size=\"9\" fill=\"#8cb4d6\" font-weight=\"700\">A</text><text x=\"52\" y=\"12\" font-size=\"9\" fill=\"#e25b16\" font-weight=\"700\">B</text><rect x=\"28\" y=\"57.98461538461538\" width=\"14\" height=\"52.01538461538462\" fill=\"#8cb4d6\"/><rect x=\"46\" y=\"40.0\" width=\"14\" height=\"70.0\" fill=\"#e25b16\"/><line x1=\"22\" y1=\"110\" x2=\"68\" y2=\"110\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1\"/><text x=\"46\" y=\"126\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">MAD</text><text x=\"35\" y=\"24\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">4,83</text><text x=\"53\" y=\"24\" font-size=\"8\" fill=\"#e25b16\" text-anchor=\"middle\">6,50</text><rect x=\"94\" y=\"81.87116564417178\" width=\"14\" height=\"28.128834355828218\" fill=\"#8cb4d6\"/><rect x=\"112\" y=\"40.0\" width=\"14\" height=\"70.0\" fill=\"#e25b16\"/><line x1=\"88\" y1=\"110\" x2=\"134\" y2=\"110\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1\"/><text x=\"112\" y=\"126\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">MSE</text><text x=\"101\" y=\"24\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">26,20</text><text x=\"119\" y=\"24\" font-size=\"8\" fill=\"#e25b16\" text-anchor=\"middle\">65,20</text><rect x=\"160\" y=\"58.98305084745763\" width=\"14\" height=\"51.01694915254237\" fill=\"#8cb4d6\"/><rect x=\"178\" y=\"40.0\" width=\"14\" height=\"70.0\" fill=\"#e25b16\"/><line x1=\"154\" y1=\"110\" x2=\"200\" y2=\"110\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1\"/><text x=\"178\" y=\"126\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">MAPE %</text><text x=\"167\" y=\"24\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">4,30</text><text x=\"185\" y=\"24\" font-size=\"8\" fill=\"#e25b16\" text-anchor=\"middle\">5,90</text><rect x=\"226\" y=\"50.0\" width=\"14\" height=\"50.0\" fill=\"#8cb4d6\"/><rect x=\"244\" y=\"100\" width=\"14\" height=\"12.0\" fill=\"#e25b16\"/><line x1=\"220\" y1=\"100\" x2=\"266\" y2=\"100\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1\"/><text x=\"244\" y=\"126\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">PME %</text><text x=\"233\" y=\"24\" font-size=\"8\" fill=\"#8cb4d6\" text-anchor=\"middle\">2,50</text><text x=\"251\" y=\"24\" font-size=\"8\" fill=\"#e25b16\" text-anchor=\"middle\">-0,60</text></svg>","chartLabel":"Método A vs. B: MAD, MSE, MAPE y PME del ejemplo","html":"Método A: MAD 4,83 · MSE 26,2 · MAPE 4,3% · PME +2,5%. Método B: MAD 6,50 · MSE 65,2 · MAPE 5,9% · PME −0,6%. A es más preciso (sobre todo en MSE: B tiene un error de −15 en el mes 5). B está mejor centrado.","titleHtml":"Cada medida dice algo distinto."},{"type":"concepto","k":"Validación (Hanke)","title":"No midas el error sobre los datos con los que ajustaste.","text":"Elegí el método según el patrón (árbol). Partí los datos en inicialización (para ajustar) y prueba (que el método no vio). Ajustá con una, pronosticá la otra, medí ahí. Después decidí: usar, modificar o probar otro.","ejemplo":"Si medís el error sobre los mismos datos con los que ajustaste, hacés trampa sin querer.","html":"Elegí el método según el patrón (árbol). Partí los datos en inicialización (para ajustar) y prueba (que el método no vio). Ajustá con una, pronosticá la otra, medí ahí. Después decidí: usar, modificar o probar otro.","titleHtml":"No midas el error sobre los datos con los que ajustaste."},{"type":"concepto","k":"Señal de rastreo","title":"Un método que hoy funciona puede dejar de funcionar.","text":"Se monitorea alguna medida del error y se fijan límites; cuando los rebasa, se alerta para revisar o recalibrar (por ejemplo, cambiar el α).","ejemplo":"Versión simple de Hanke: contar cuántas de las últimas n predicciones fueron subestimaciones (U). Si está sano, deberían ser ≈ n/2. Muy lejos de n/2 indica sesgo sistemático.","html":"Se monitorea alguna medida del error y se fijan límites; cuando los rebasa, se alerta para revisar o recalibrar (por ejemplo, cambiar el α).","titleHtml":"Un método que hoy funciona puede dejar de funcionar."},{"type":"pregunta","k":"A ver…","title":"MAD, MSE y MAPE ¿pueden ser negativos?","options":["Sí, si sobreestimaste","No: llevan valor absoluto o cuadrado. El que sí puede ser negativo es el PME","Solo el MSE puede ser negativo"],"correct":1,"feedback":"MAD, MSE y MAPE nunca pueden ser negativos. El PME sí: de hecho su signo es toda la información.","titleHtml":"MAD, MSE y MAPE ¿pueden ser negativos?"},{"type":"cierre","title":"Llevate esto de la Clase 4.","text":"Usá las cuatro medidas: MAD (unidades), MSE (castiga lo grande), MAPE (%) y PME (sesgo). Validá en datos de prueba, no en los de ajuste. El ejercicio X vs. Y queda para resolver juntos.","html":"Usá las cuatro medidas: MAD (unidades), MSE (castiga lo grande), MAPE (%) y PME (sesgo). Validá en datos de prueba, no en los de ajuste. El ejercicio X vs. Y queda para resolver juntos.","titleHtml":"Llevate esto de la Clase 4."}],"titleHtml":"Clase 4 · Medidas de error","ledeHtml":"el árbol de decisión (Clase 3.a) propone <em>candidatos</em>; las medidas de error deciden. Sin ellas, \"comparar modelos\" es una opinión; con ellas, es un argumento. Y la cátedra pide explícitamente comparar modelos e interpretar."},"cint":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"cint","title":"Integrador · Proceso completo","name":"Proceso completo","lede":"En una frase: *3.a me da la SOSPECHA · 3.b me da la PRUEBA · el árbol me da el MÉTODO · la clase 4 me dice si ACERTÉ.*","visto":true,"source":["clases_previas/SG/Integrador_ProcesoCompleto.md","clases_previas/SG/ProcesoCompleto_Pronostico.svg","clases_previas/SG/ArbolDecisorio_MetodosPronostico.svg"],"laminas":["u2/img/ProcesoCompleto_Pronostico.svg","u2/img/ArbolDecisorio_MetodosPronostico.svg"],"next":"Clase 5 · Métodos no formales y promedios","teoria":[{"type":"paragraph","text":"**Cómo se conectan las clases 3.a, 3.b y 4** · Sistemas de Gestión (UTN FRRo) · Unidad 2","html":"<strong>Cómo se conectan las clases 3.a, 3.b y 4</strong> · Sistemas de Gestión (UTN FRRo) · Unidad 2"},{"type":"callout","kind":"idea","text":"**En una frase:** *3.a me da la SOSPECHA · 3.b me da la PRUEBA · el árbol me da el MÉTODO · la clase 4 me dice si ACERTÉ.*","html":"<strong>En una frase:</strong> <em>3.a me da la SOSPECHA · 3.b me da la PRUEBA · el árbol me da el MÉTODO · la clase 4 me dice si ACERTÉ.</em>"},{"type":"svg","file":"u2/img/ProcesoCompleto_Pronostico.svg","caption":"Lámina · El proceso completo de pronóstico","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 900\" width=\"980\" height=\"900\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ab\" markerWidth=\"11\" markerHeight=\"9\" refX=\"10\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L11,4.5 L0,9 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"ard\" markerWidth=\"11\" markerHeight=\"9\" refX=\"10\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L11,4.5 L0,9 Z\" fill=\"#C00000\"/></marker>\n  </defs>\n  <rect width=\"980\" height=\"900\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">EL PROCESO COMPLETO DE PRONÓSTICO</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina integradora — cómo se conectan las clases 3.a, 3.b y 4</text>\n\n  <!-- ANALOGIA -->\n  <rect x=\"40\" y=\"70\" width=\"900\" height=\"56\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"91\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">LA ANALOGÍA DEL MÉDICO:</text>\n  <text x=\"270\" y=\"91\" font-size=\"12\" fill=\"#333\"><tspan font-weight=\"700\">3.a</tspan> = mirar al paciente (síntomas a simple vista) · <tspan font-weight=\"700\">3.b</tspan> = pedir análisis (confirmar con números)</text>\n  <text x=\"270\" y=\"112\" font-size=\"12\" fill=\"#333\"><tspan font-weight=\"700\">Árbol</tspan> = recetar el tratamiento · <tspan font-weight=\"700\">Clase 4</tspan> = controlar si el paciente mejoró (y si no, cambiar el remedio)</text>\n\n  <!-- ===== PASO 1 ===== -->\n  <rect x=\"40\" y=\"146\" width=\"176\" height=\"230\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.8\"/>\n  <circle cx=\"70\" cy=\"176\" r=\"16\" fill=\"#1F4E79\"/>\n  <text x=\"70\" y=\"182\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text>\n  <text x=\"96\" y=\"174\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">GRAFICAR</text>\n  <text x=\"96\" y=\"190\" font-size=\"10\" fill=\"#888\">clase 3.a</text>\n  <!-- mini serie -->\n  <rect x=\"56\" y=\"204\" width=\"144\" height=\"76\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"66\" y1=\"270\" x2=\"66\" y2=\"214\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"66\" y1=\"270\" x2=\"192\" y2=\"270\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 72 258 L 88 226 L 104 262 L 120 264 L 136 222 L 152 258 L 168 260 L 184 218\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"300\" font-size=\"11\" fill=\"#333\">Dibujo la serie y miro:</text>\n  <text x=\"56\" y=\"316\" font-size=\"10.5\" fill=\"#333\">¿sube? ¿tiene olas?</text>\n  <text x=\"56\" y=\"330\" font-size=\"10.5\" fill=\"#333\">¿es plana?</text>\n  <rect x=\"54\" y=\"340\" width=\"148\" height=\"28\" rx=\"4\" fill=\"#EAF6FB\"/>\n  <text x=\"64\" y=\"358\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1F4E79\">→ Me da la SOSPECHA</text>\n\n  <line x1=\"216\" y1=\"260\" x2=\"238\" y2=\"260\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ab)\"/>\n\n  <!-- ===== PASO 2 ===== -->\n  <rect x=\"244\" y=\"146\" width=\"176\" height=\"230\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.8\"/>\n  <circle cx=\"274\" cy=\"176\" r=\"16\" fill=\"#1E6B33\"/>\n  <text x=\"274\" y=\"182\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text>\n  <text x=\"300\" y=\"174\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1E6B33\">DIAGNOSTICAR</text>\n  <text x=\"300\" y=\"190\" font-size=\"10\" fill=\"#888\">clase 3.b · correlograma</text>\n  <!-- mini correlograma -->\n  <rect x=\"260\" y=\"204\" width=\"144\" height=\"76\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <line x1=\"270\" y1=\"270\" x2=\"270\" y2=\"214\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"270\" y1=\"270\" x2=\"396\" y2=\"270\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"270\" y1=\"248\" x2=\"396\" y2=\"248\" stroke=\"#C00000\" stroke-width=\"0.9\" stroke-dasharray=\"3 2\"/>\n  <rect x=\"278\" y=\"256\" width=\"8\" height=\"14\" fill=\"#1E6B33\"/>\n  <rect x=\"292\" y=\"260\" width=\"8\" height=\"10\" fill=\"#1E6B33\"/>\n  <rect x=\"306\" y=\"254\" width=\"8\" height=\"16\" fill=\"#1E6B33\"/>\n  <rect x=\"320\" y=\"220\" width=\"8\" height=\"50\" fill=\"#1E6B33\"/>\n  <rect x=\"334\" y=\"258\" width=\"8\" height=\"12\" fill=\"#1E6B33\"/>\n  <rect x=\"348\" y=\"261\" width=\"8\" height=\"9\" fill=\"#1E6B33\"/>\n  <rect x=\"362\" y=\"256\" width=\"8\" height=\"14\" fill=\"#1E6B33\"/>\n  <rect x=\"376\" y=\"230\" width=\"8\" height=\"40\" fill=\"#1E6B33\"/>\n  <text x=\"260\" y=\"300\" font-size=\"11\" fill=\"#333\">Confirmo con números</text>\n  <text x=\"260\" y=\"316\" font-size=\"10.5\" fill=\"#333\">lo que vi en el gráfico:</text>\n  <text x=\"260\" y=\"330\" font-size=\"10.5\" fill=\"#333\">pico en r₄, decaimiento…</text>\n  <rect x=\"258\" y=\"340\" width=\"148\" height=\"28\" rx=\"4\" fill=\"#E8F3EA\"/>\n  <text x=\"268\" y=\"358\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1E6B33\">→ Me da la PRUEBA</text>\n\n  <line x1=\"420\" y1=\"260\" x2=\"442\" y2=\"260\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ab)\"/>\n\n  <!-- ===== PASO 3 ===== -->\n  <rect x=\"448\" y=\"146\" width=\"176\" height=\"230\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.8\"/>\n  <circle cx=\"478\" cy=\"176\" r=\"16\" fill=\"#8A5A16\"/>\n  <text x=\"478\" y=\"182\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text>\n  <text x=\"504\" y=\"174\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">ELEGIR MÉTODO</text>\n  <text x=\"504\" y=\"190\" font-size=\"10\" fill=\"#888\">árbol de decisión</text>\n  <rect x=\"464\" y=\"204\" width=\"144\" height=\"120\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"474\" y=\"222\" font-size=\"10\" fill=\"#333\">estacionaria →</text>\n  <text x=\"484\" y=\"235\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1E6B33\">promedio móvil, SES</text>\n  <text x=\"474\" y=\"253\" font-size=\"10\" fill=\"#333\">tendencia →</text>\n  <text x=\"484\" y=\"266\" font-size=\"9.5\" font-weight=\"700\" fill=\"#1F4E79\">Holt, Brown, regresión</text>\n  <text x=\"474\" y=\"284\" font-size=\"10\" fill=\"#333\">estacionalidad →</text>\n  <text x=\"484\" y=\"297\" font-size=\"9.5\" font-weight=\"700\" fill=\"#B5651D\">Winter, descomposición</text>\n  <text x=\"474\" y=\"315\" font-size=\"9.5\" fill=\"#333\">ciclo → descomp., econométricos</text>\n  <rect x=\"462\" y=\"340\" width=\"148\" height=\"28\" rx=\"4\" fill=\"#FBF0E0\"/>\n  <text x=\"472\" y=\"358\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">→ Me da el MÉTODO</text>\n\n  <line x1=\"624\" y1=\"260\" x2=\"646\" y2=\"260\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ab)\"/>\n\n  <!-- ===== PASO 4 ===== -->\n  <rect x=\"652\" y=\"146\" width=\"132\" height=\"230\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#D3C4E4\" stroke-width=\"1.8\"/>\n  <circle cx=\"682\" cy=\"176\" r=\"16\" fill=\"#5B3E8E\"/>\n  <text x=\"682\" y=\"182\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">4</text>\n  <text x=\"708\" y=\"174\" font-size=\"13.5\" font-weight=\"700\" fill=\"#5B3E8E\">APLICAR</text>\n  <text x=\"708\" y=\"190\" font-size=\"10\" fill=\"#888\">clases 5+</text>\n  <rect x=\"666\" y=\"204\" width=\"104\" height=\"120\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"676\" y=\"226\" font-size=\"10.5\" fill=\"#333\">Hago las cuentas</text>\n  <text x=\"676\" y=\"242\" font-size=\"10.5\" fill=\"#333\">del método elegido</text>\n  <text x=\"676\" y=\"258\" font-size=\"10.5\" fill=\"#333\">y obtengo los</text>\n  <text x=\"676\" y=\"274\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">pronósticos Ŷ</text>\n  <text x=\"676\" y=\"298\" font-size=\"9.5\" fill=\"#888\" font-style=\"italic\">(todavía no</text>\n  <text x=\"676\" y=\"310\" font-size=\"9.5\" fill=\"#888\" font-style=\"italic\">vimos esto)</text>\n  <rect x=\"664\" y=\"340\" width=\"108\" height=\"28\" rx=\"4\" fill=\"#F0EAF7\"/>\n  <text x=\"674\" y=\"358\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">→ Los NÚMEROS</text>\n\n  <line x1=\"784\" y1=\"260\" x2=\"806\" y2=\"260\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ab)\"/>\n\n  <!-- ===== PASO 5 ===== -->\n  <rect x=\"812\" y=\"146\" width=\"128\" height=\"230\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"2\"/>\n  <circle cx=\"842\" cy=\"176\" r=\"16\" fill=\"#C00000\"/>\n  <text x=\"842\" y=\"182\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">5</text>\n  <text x=\"868\" y=\"174\" font-size=\"13.5\" font-weight=\"700\" fill=\"#9C3838\">MEDIR</text>\n  <text x=\"868\" y=\"190\" font-size=\"10\" fill=\"#888\">clase 4</text>\n  <rect x=\"826\" y=\"204\" width=\"100\" height=\"120\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"836\" y=\"224\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\">MAD</text>\n  <text x=\"836\" y=\"240\" font-size=\"9.5\" fill=\"#666\">error en unidades</text>\n  <text x=\"836\" y=\"258\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\">MSE</text>\n  <text x=\"836\" y=\"272\" font-size=\"9.5\" fill=\"#666\">castiga los grandes</text>\n  <text x=\"836\" y=\"288\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\">MAPE</text>\n  <text x=\"836\" y=\"300\" font-size=\"9.5\" fill=\"#666\">error en %</text>\n  <text x=\"836\" y=\"316\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">PME → sesgo</text>\n  <rect x=\"824\" y=\"340\" width=\"104\" height=\"28\" rx=\"4\" fill=\"#FBE9E9\"/>\n  <text x=\"834\" y=\"358\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">→ ¿ACERTÉ?</text>\n\n  <!-- CICLO DE RETROALIMENTACION -->\n  <path d=\"M 876 376 L 876 406 L 536 406 L 536 380\" fill=\"none\" stroke=\"#C00000\" stroke-width=\"2.5\" stroke-dasharray=\"7 4\" marker-end=\"url(#ard)\"/>\n  <rect x=\"590\" y=\"388\" width=\"240\" height=\"34\" rx=\"6\" fill=\"#FDF2F2\" stroke=\"#C00000\"/>\n  <text x=\"710\" y=\"410\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C00000\" text-anchor=\"middle\">Si el error dice que está mal → VUELVO al paso 3</text>\n\n  <text x=\"56\" y=\"404\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\">Es un CIRCUITO, no una línea recta.</text>\n\n  <!-- ===== EJEMPLO ===== -->\n  <rect x=\"40\" y=\"436\" width=\"900\" height=\"248\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"460\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">EJEMPLO DE PUNTA A PUNTA — una heladería, ventas trimestrales</text>\n\n  <g font-size=\"11\">\n    <rect x=\"56\" y=\"472\" width=\"868\" height=\"22\" fill=\"#1F4E79\"/>\n    <text x=\"70\" y=\"488\" fill=\"#fff\" font-weight=\"700\">Paso</text>\n    <text x=\"170\" y=\"488\" fill=\"#fff\" font-weight=\"700\">Qué hago</text>\n    <text x=\"530\" y=\"488\" fill=\"#fff\" font-weight=\"700\">Qué obtengo</text>\n\n    <rect x=\"56\" y=\"494\" width=\"868\" height=\"34\" fill=\"#fff\"/>\n    <text x=\"70\" y=\"515\" fill=\"#1F4E79\" font-weight=\"700\">1 · Graficar</text>\n    <text x=\"170\" y=\"515\" fill=\"#333\">Veo que cada verano se dispara y cada invierno se hunde,</text>\n    <text x=\"530\" y=\"515\" fill=\"#333\" font-style=\"italic\">Sospecha: estacionalidad + tendencia</text>\n\n    <rect x=\"56\" y=\"528\" width=\"868\" height=\"34\" fill=\"#F2F6FA\"/>\n    <text x=\"70\" y=\"549\" fill=\"#1E6B33\" font-weight=\"700\">2 · Correlograma</text>\n    <text x=\"170\" y=\"549\" fill=\"#333\">Pico grande en r₄ y en r₈; primeras barras decaen de a poco</text>\n    <text x=\"530\" y=\"549\" fill=\"#333\"><tspan font-weight=\"700\">Prueba:</tspan> r₄ ⇒ estacionalidad L=4; decaimiento ⇒ tendencia</text>\n\n    <rect x=\"56\" y=\"562\" width=\"868\" height=\"34\" fill=\"#fff\"/>\n    <text x=\"70\" y=\"583\" fill=\"#8A5A16\" font-weight=\"700\">3 · Elegir</text>\n    <text x=\"170\" y=\"583\" fill=\"#333\">Voy al árbol: tendencia + estacionalidad</text>\n    <text x=\"530\" y=\"583\" fill=\"#B5651D\" font-weight=\"700\">→ WINTER (o descomposición)</text>\n\n    <rect x=\"56\" y=\"596\" width=\"868\" height=\"34\" fill=\"#F2F6FA\"/>\n    <text x=\"70\" y=\"617\" fill=\"#5B3E8E\" font-weight=\"700\">4 · Aplicar</text>\n    <text x=\"170\" y=\"617\" fill=\"#333\">Hago las cuentas de Winter</text>\n    <text x=\"530\" y=\"617\" fill=\"#333\">Los pronósticos Ŷ para los próximos trimestres</text>\n\n    <rect x=\"56\" y=\"630\" width=\"868\" height=\"34\" fill=\"#fff\"/>\n    <text x=\"70\" y=\"651\" fill=\"#C00000\" font-weight=\"700\">5 · Medir</text>\n    <text x=\"170\" y=\"651\" fill=\"#333\">Calculo MAD, MSE, MAPE y PME → MAPE 5%, PME ≈ 0</text>\n    <text x=\"530\" y=\"651\" fill=\"#1E6B33\" font-weight=\"700\">✔ Preciso y sin sesgo: me quedo con Winter</text>\n  </g>\n\n  <rect x=\"56\" y=\"666\" width=\"868\" height=\"12\" rx=\"0\" fill=\"#EAF6FB\"/>\n\n  <!-- ===== EL CASO DEL ERROR ===== -->\n  <rect x=\"40\" y=\"696\" width=\"450\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <text x=\"56\" y=\"718\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">¿Y si hubiera salido mal?</text>\n  <text x=\"56\" y=\"740\" font-size=\"11\" fill=\"#333\">Supongamos que en el paso 4 usé <tspan font-weight=\"700\">suavizado simple</tspan></text>\n  <text x=\"56\" y=\"756\" font-size=\"11\" fill=\"#333\">(ignorando el diagnóstico). El paso 5 me daría:</text>\n  <text x=\"56\" y=\"778\" font-size=\"12\" font-weight=\"700\" fill=\"#C00000\">PME = +12%, siempre positivo</text>\n  <text x=\"56\" y=\"796\" font-size=\"11\" fill=\"#333\">⇒ “subestimo todos los meses” ⇒ el método pierde la</text>\n  <text x=\"56\" y=\"810\" font-size=\"11\" fill=\"#333\">tendencia ⇒ <tspan font-weight=\"700\">vuelvo al paso 3 y cambio a Winter</tspan>.</text>\n\n  <rect x=\"504\" y=\"696\" width=\"436\" height=\"120\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"1.8\"/>\n  <text x=\"520\" y=\"718\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">La conexión más importante</text>\n  <text x=\"520\" y=\"742\" font-size=\"11.5\" fill=\"#333\">El <tspan font-weight=\"700\">PME de la clase 4</tspan> te DELATA cuando te equivocaste</text>\n  <text x=\"520\" y=\"758\" font-size=\"11.5\" fill=\"#333\">en el <tspan font-weight=\"700\">diagnóstico de la clase 3</tspan>.</text>\n  <text x=\"520\" y=\"782\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">Un método impreciso pero centrado (PME≈0) es un método</text>\n  <text x=\"520\" y=\"796\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">correcto con datos ruidosos. Un método sesgado (PME alto)</text>\n  <text x=\"520\" y=\"810\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">es un método EQUIVOCADO para ese patrón.</text>\n\n  <!-- ===== FRASE FINAL ===== -->\n  <rect x=\"40\" y=\"828\" width=\"900\" height=\"56\" rx=\"8\" fill=\"#1F4E79\"/>\n  <text x=\"490\" y=\"852\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3.a me da la SOSPECHA · 3.b me da la PRUEBA · el árbol me da el MÉTODO · la clase 4 me dice si ACERTÉ</text>\n  <text x=\"490\" y=\"873\" font-size=\"11\" fill=\"#BBD7EE\" text-anchor=\"middle\" font-style=\"italic\">“La serie presenta tendencia y estacionalidad (pico en r₄ y decaimiento gradual), por lo que apliqué Winter; el MAPE de 5% y el PME ≈ 0 confirman que es adecuado.”</text>\n</svg>"},{"type":"svg","file":"u2/img/ArbolDecisorio_MetodosPronostico.svg","caption":"Árbol decisorio de métodos de pronóstico","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 1360\" width=\"1000\" height=\"1360\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"a1\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"a2\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#888\"/></marker>\n  </defs>\n  <rect width=\"1000\" height=\"1360\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">ÁRBOL DECISORIO · ¿Qué método de pronóstico uso?</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina complementaria Clase 3.a — U2 · La respuesta a “justifique la metodología aplicada”</text>\n\n  <rect x=\"40\" y=\"68\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">REGLA MADRE: graficar la serie SIEMPRE antes de decidir. Con pocos datos, graficar es obligatorio. El gráfico manda sobre cualquier fórmula.</text>\n\n  <!-- ===== NIVEL 0 ===== -->\n  <rect x=\"380\" y=\"116\" width=\"240\" height=\"42\" rx=\"21\" fill=\"#1F4E79\"/>\n  <text x=\"500\" y=\"142\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Necesito pronosticar</text>\n\n  <line x1=\"500\" y1=\"158\" x2=\"500\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"770\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"230\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"770\" y1=\"176\" x2=\"770\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- PREGUNTA 1 -->\n  <text x=\"500\" y=\"170\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\" text-anchor=\"middle\">① ¿Tengo datos históricos suficientes y representativos?</text>\n\n  <!-- RAMA NO: CUALITATIVOS -->\n  <rect x=\"700\" y=\"200\" width=\"260\" height=\"152\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"716\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">NO → MÉTODOS CUALITATIVOS</text>\n  <text x=\"716\" y=\"240\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Se basan en juicio e intuición, no en datos</text>\n  <text x=\"716\" y=\"260\" font-size=\"10.8\" fill=\"#333\">· Delphi (panel de expertos anónimo)</text>\n  <text x=\"716\" y=\"276\" font-size=\"10.8\" fill=\"#333\">· Investigación de mercado / encuestas</text>\n  <text x=\"716\" y=\"292\" font-size=\"10.8\" fill=\"#333\">· Analogía histórica (producto similar)</text>\n  <text x=\"716\" y=\"308\" font-size=\"10.8\" fill=\"#333\">· Consenso de comité / fuerza de ventas</text>\n  <text x=\"716\" y=\"330\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Cuándo: producto nuevo, sin historia,</text>\n  <text x=\"716\" y=\"345\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">o largo plazo (&gt; 2 años)</text>\n\n  <!-- RAMA SI: CUANTITATIVOS -->\n  <rect x=\"60\" y=\"200\" width=\"580\" height=\"60\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SÍ → MÉTODOS CUANTITATIVOS</text>\n  <text x=\"76\" y=\"242\" font-size=\"11\" fill=\"#333\">② ¿Explico la serie con SU PROPIO pasado, o con OTRAS variables?</text>\n  <text x=\"76\" y=\"256\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">(en la práctica se combinan: lo cuantitativo se ajusta con juicio experto)</text>\n\n  <line x1=\"200\" y1=\"260\" x2=\"200\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"500\" y1=\"260\" x2=\"500\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- CAUSALES -->\n  <rect x=\"360\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"376\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#9C3838\">CAUSALES / EXPLICATIVOS</text>\n  <text x=\"376\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Las ventas dependen de X” (precio,</text>\n  <text x=\"376\" y=\"343\" font-size=\"10.8\" fill=\"#333\">publicidad, PBI, temperatura…)</text>\n  <text x=\"376\" y=\"363\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión simple (1 variable X)</text>\n  <text x=\"376\" y=\"379\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión múltiple (varias X)</text>\n  <text x=\"376\" y=\"396\" font-size=\"10.5\" fill=\"#666\">· Modelos econométricos · indicadores</text>\n\n  <!-- SERIES DE TIEMPO -->\n  <rect x=\"60\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SERIES DE TIEMPO</text>\n  <text x=\"76\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Proyecto el patrón que la serie</text>\n  <text x=\"76\" y=\"343\" font-size=\"10.8\" fill=\"#333\">viene mostrando en el tiempo”</text>\n  <text x=\"76\" y=\"366\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">③ ¿QUÉ PATRÓN tiene la serie?</text>\n  <text x=\"76\" y=\"384\" font-size=\"10.5\" fill=\"#666\">→ mirar el gráfico y el correlograma</text>\n  <text x=\"76\" y=\"399\" font-size=\"10.5\" fill=\"#666\">→ bajar a los 4 casos de abajo ↓</text>\n\n  <line x1=\"200\" y1=\"408\" x2=\"200\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"880\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"120\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"373\" y1=\"430\" x2=\"373\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"627\" y1=\"430\" x2=\"627\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"880\" y1=\"430\" x2=\"880\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- ===== CASO A: ESTACIONARIA ===== -->\n  <rect x=\"40\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"54\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">A · ESTACIONARIA</text>\n  <text x=\"54\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">promedio constante, sin rumbo</text>\n  <line x1=\"58\" y1=\"536\" x2=\"58\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"536\" x2=\"248\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"520\" x2=\"248\" y2=\"520\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <polyline points=\"64,526 88,512 112,528 136,514 160,530 184,512 208,524 236,516\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n\n  <text x=\"54\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">MÉTODOS:</text>\n  <text x=\"54\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Promedio simple (todo el historial)</text>\n  <text x=\"54\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil de orden n</text>\n  <text x=\"54\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Suavizado exponencial simple (SES)</tspan></text>\n  <text x=\"54\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Métodos ingenuos: Ŷₜ₊₁ = Yₜ</text>\n  <text x=\"54\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins (ARIMA)</text>\n\n  <rect x=\"52\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <text x=\"62\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\">Elegir n / α:</text>\n  <text x=\"62\" y=\"683\" font-size=\"9.8\" fill=\"#333\">n grande o α chico → más suave</text>\n  <text x=\"62\" y=\"697\" font-size=\"9.8\" fill=\"#333\">n chico o α grande → más reactivo</text>\n\n  <text x=\"54\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"54\" y=\"744\" font-size=\"10\" fill=\"#333\">· Panadería de barrio estable</text>\n  <text x=\"54\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto maduro sin cambios</text>\n  <text x=\"54\" y=\"772\" font-size=\"10\" fill=\"#333\">· Repuestos de demanda pareja</text>\n\n  <!-- ===== CASO B: TENDENCIA ===== -->\n  <rect x=\"274\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">B · TENDENCIA</text>\n  <text x=\"288\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">sube o baja sostenidamente</text>\n  <line x1=\"292\" y1=\"536\" x2=\"292\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"292\" y1=\"536\" x2=\"482\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"298,530 326,522 354,514 382,506 410,514 438,500 466,492\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n\n  <text x=\"288\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODOS:</text>\n  <text x=\"288\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Holt</tspan> (suav. exp. 2 parámetros α, β)</text>\n  <text x=\"288\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Brown (suav. exp. doble, 1 parám.)</text>\n  <text x=\"288\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil doble</text>\n  <text x=\"288\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión simple contra el tiempo</text>\n  <text x=\"288\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Gompertz, curvas de crecimiento</text>\n\n  <rect x=\"286\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"296\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1F4E79\">Holt vs. Brown:</text>\n  <text x=\"296\" y=\"683\" font-size=\"9.8\" fill=\"#333\">Brown usa un solo α → tendencia</text>\n  <text x=\"296\" y=\"697\" font-size=\"9.8\" fill=\"#333\">sensible al ruido. Holt separa β → mejor.</text>\n\n  <text x=\"288\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"288\" y=\"744\" font-size=\"10\" fill=\"#333\">· Suscripciones de una app en alza</text>\n  <text x=\"288\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto en etapa de crecimiento</text>\n  <text x=\"288\" y=\"772\" font-size=\"10\" fill=\"#333\">· Serie inflacionada año a año</text>\n\n  <!-- ===== CASO C: ESTACIONALIDAD ===== -->\n  <rect x=\"508\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#8A5A16\" stroke-width=\"2\"/>\n  <text x=\"522\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · ESTACIONALIDAD</text>\n  <text x=\"522\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">patrón fijo que se repite cada año</text>\n  <line x1=\"526\" y1=\"536\" x2=\"526\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"526\" y1=\"536\" x2=\"716\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 532 528 L 548 508 L 564 528 L 580 530 L 596 508 L 612 528 L 628 530 L 644 506 L 660 528 L 676 530 L 700 508\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2\"/>\n\n  <text x=\"522\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">MÉTODOS:</text>\n  <text x=\"522\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Winter</tspan> (suav. exp. 3 parám. α, β, γ)</text>\n  <text x=\"522\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Descomposición clásica</tspan> (multiplicativa)</text>\n  <text x=\"522\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Desestacionalizar → pronosticar →</text>\n  <text x=\"532\" y=\"622\" font-size=\"10.8\" fill=\"#333\">re-estacionalizar</text>\n  <text x=\"522\" y=\"638\" font-size=\"10.5\" fill=\"#666\">· Regresión múltiple con dummies · Census II</text>\n\n  <rect x=\"520\" y=\"648\" width=\"198\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"530\" y=\"666\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">Ojo con L y la cantidad de datos:</text>\n  <text x=\"530\" y=\"681\" font-size=\"9.8\" fill=\"#333\">L=4 (trim.) · L=12 (mens.) · L=7 (diario)</text>\n  <text x=\"530\" y=\"695\" font-size=\"9.8\" fill=\"#333\">Winter necesita ≥ 2 ciclos completos</text>\n\n  <text x=\"522\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"522\" y=\"744\" font-size=\"10\" fill=\"#333\">· Heladería / aires acondicionados</text>\n  <text x=\"522\" y=\"758\" font-size=\"10\" fill=\"#333\">· Ventas de diciembre, útiles escolares</text>\n  <text x=\"522\" y=\"772\" font-size=\"10\" fill=\"#333\">· Consumo eléctrico</text>\n\n  <!-- ===== CASO D: CICLO ===== -->\n  <rect x=\"742\" y=\"456\" width=\"218\" height=\"330\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"756\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">D · CICLO</text>\n  <text x=\"756\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">ondas plurianuales, período variable</text>\n  <line x1=\"760\" y1=\"536\" x2=\"760\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"760\" y1=\"536\" x2=\"946\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 766 518 C 792 496, 812 496, 834 522 C 858 548, 882 546, 906 512 C 916 498, 926 494, 936 492\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n\n  <text x=\"756\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#5B3E8E\">MÉTODOS:</text>\n  <text x=\"756\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Descomposición clásica</text>\n  <text x=\"756\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Indicadores económicos (líderes)</text>\n  <text x=\"756\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Modelos econométricos</text>\n  <text x=\"756\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión múltiple</text>\n  <text x=\"756\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins</text>\n\n  <rect x=\"754\" y=\"650\" width=\"196\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"764\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">⚠ El más difícil de todos:</text>\n  <text x=\"764\" y=\"683\" font-size=\"9.8\" fill=\"#333\">no tiene período fijo → los métodos</text>\n  <text x=\"764\" y=\"697\" font-size=\"9.8\" fill=\"#333\">de suavizado NO capturan giros bruscos</text>\n\n  <text x=\"756\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"756\" y=\"744\" font-size=\"10\" fill=\"#333\">· Construcción, acero, automotriz</text>\n  <text x=\"756\" y=\"758\" font-size=\"10\" fill=\"#333\">· Bienes durables y de capital</text>\n  <text x=\"756\" y=\"772\" font-size=\"10\" fill=\"#333\">· Cualquier serie ligada al PBI</text>\n\n  <!-- ===== CASO COMBINADO ===== -->\n  <rect x=\"40\" y=\"800\" width=\"920\" height=\"96\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">★ EL CASO MÁS FRECUENTE EN EXAMEN: TENDENCIA **+** ESTACIONALIDAD (los patrones se combinan)</text>\n  <text x=\"56\" y=\"844\" font-size=\"11.5\" fill=\"#333\">Si la serie sube año a año Y además repite picos estacionales → <tspan font-weight=\"700\" fill=\"#C00000\">WINTER</tspan> (captura ambos) o <tspan font-weight=\"700\" fill=\"#C00000\">DESCOMPOSICIÓN</tspan> (los separa y proyecta por partes).</text>\n  <text x=\"56\" y=\"864\" font-size=\"11.5\" fill=\"#333\">Alternativa válida y muy defendible: <tspan font-weight=\"700\">desestacionalizar</tspan> la serie → aplicar Holt a la serie sin estacionalidad → <tspan font-weight=\"700\">re-estacionalizar</tspan> el pronóstico.</text>\n  <text x=\"56\" y=\"884\" font-size=\"11\" fill=\"#8A5A16\" font-style=\"italic\">Nunca usar suavizado simple ni promedio móvil acá: van siempre “atrás” de la serie y subestiman sistemáticamente (sesgo visible en el PME).</text>\n\n  <!-- ===== FACTORES ADICIONALES ===== -->\n  <rect x=\"40\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">④ Otros factores que inclinan la elección</text>\n\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">HORIZONTE:</text>\n  <text x=\"66\" y=\"970\" font-size=\"10.5\" fill=\"#333\">· Corto plazo (días–meses) → suavizados, promedios</text>\n  <text x=\"66\" y=\"985\" font-size=\"10.5\" fill=\"#333\">· Mediano (meses–2 años) → regresión, descomposición</text>\n  <text x=\"66\" y=\"1000\" font-size=\"10.5\" fill=\"#333\">· Largo plazo (&gt;2 años) → cualitativos, econométricos</text>\n\n  <text x=\"56\" y=\"1022\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">CANTIDAD DE DATOS:</text>\n  <text x=\"66\" y=\"1038\" font-size=\"10.5\" fill=\"#333\">· Muy pocos → ingenuos o promedio simple (y graficar!)</text>\n  <text x=\"66\" y=\"1053\" font-size=\"10.5\" fill=\"#333\">· Winter/descomposición exigen ≥2 ciclos completos</text>\n\n  <text x=\"56\" y=\"1075\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">OTROS CRITERIOS (Hanke):</text>\n  <text x=\"66\" y=\"1091\" font-size=\"10.5\" fill=\"#333\">· Costo del método vs. beneficio del pronóstico</text>\n  <text x=\"66\" y=\"1106\" font-size=\"10.5\" fill=\"#333\">· Facilidad de comprensión para quien decide</text>\n  <text x=\"66\" y=\"1121\" font-size=\"10.5\" fill=\"#333\">· Precisión requerida y confiabilidad</text>\n\n  <!-- ===== VALIDACION ===== -->\n  <rect x=\"510\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"526\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">⑤ Elegido el método… ¡hay que VALIDARLO!</text>\n  <text x=\"526\" y=\"952\" font-size=\"11\" fill=\"#333\">El árbol propone candidatos; la <tspan font-weight=\"700\">medida de error decide</tspan>.</text>\n\n  <text x=\"526\" y=\"976\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">Procedimiento (Hanke cap. 5):</text>\n  <text x=\"536\" y=\"992\" font-size=\"10.5\" fill=\"#333\">① Partir los datos: inicialización + prueba</text>\n  <text x=\"536\" y=\"1007\" font-size=\"10.5\" fill=\"#333\">② Ajustar el método con la parte de inicialización</text>\n  <text x=\"536\" y=\"1022\" font-size=\"10.5\" fill=\"#333\">③ Pronosticar la parte de prueba y medir el error</text>\n  <text x=\"536\" y=\"1037\" font-size=\"10.5\" fill=\"#333\">④ Comparar contra un método alternativo</text>\n  <text x=\"536\" y=\"1052\" font-size=\"10.5\" fill=\"#333\">⑤ Decidir: usarlo, ajustarlo o cambiarlo</text>\n\n  <rect x=\"526\" y=\"1062\" width=\"418\" height=\"56\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"536\" y=\"1080\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">Qué mirar en los errores:</text>\n  <text x=\"536\" y=\"1095\" font-size=\"10\" fill=\"#333\">MAD/MSE/MAPE bajos = buen ajuste · <tspan font-weight=\"700\">PME ≈ 0 = sin sesgo</tspan></text>\n  <text x=\"536\" y=\"1110\" font-size=\"10\" fill=\"#333\">Si el PME es grande y del mismo signo → el método pierde un patrón</text>\n\n  <!-- ===== EJEMPLOS RESUELTOS ===== -->\n  <rect x=\"40\" y=\"1142\" width=\"920\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"1164\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">DIAGNÓSTICOS RESUELTOS — así se redacta la justificación en el examen</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"1174\" width=\"888\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"66\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Serie</text>\n    <text x=\"330\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Diagnóstico</text>\n    <text x=\"600\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Método y justificación</text>\n\n    <rect x=\"56\" y=\"1194\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1210\" fill=\"#333\">Ventas parejas 900–1.100 kg hace 10 años</text>\n    <text x=\"330\" y=\"1210\" fill=\"#333\">estacionaria, solo irregularidad</text>\n    <text x=\"600\" y=\"1210\" fill=\"#1E6B33\" font-weight=\"700\">SES o promedio móvil: no hay patrón que proyectar</text>\n\n    <rect x=\"56\" y=\"1218\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1234\" fill=\"#333\">App: 1.000 → 2.290 creciendo parejo</text>\n    <text x=\"330\" y=\"1234\" fill=\"#333\">tendencia lineal, sin estacionalidad</text>\n    <text x=\"600\" y=\"1234\" fill=\"#1F4E79\" font-weight=\"700\">Holt o regresión vs. tiempo: capturan la pendiente</text>\n\n    <rect x=\"56\" y=\"1242\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1258\" fill=\"#333\">Heladería trimestral, picos en T1 y T4, subiendo</text>\n    <text x=\"330\" y=\"1258\" fill=\"#333\">tendencia + estacionalidad (L=4)</text>\n    <text x=\"600\" y=\"1258\" fill=\"#C00000\" font-weight=\"700\">WINTER o descomposición multiplicativa</text>\n\n    <rect x=\"56\" y=\"1266\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1282\" fill=\"#333\">Constructora: sube, se derrumba 3 años, se recupera</text>\n    <text x=\"330\" y=\"1282\" fill=\"#333\">ciclo dominante (+ tendencia)</text>\n    <text x=\"600\" y=\"1282\" fill=\"#5B3E8E\" font-weight=\"700\">Descomposición o indicadores económicos; no suavizado</text>\n\n    <rect x=\"56\" y=\"1290\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1306\" fill=\"#333\">Producto nuevo, sin historia</text>\n    <text x=\"330\" y=\"1306\" fill=\"#333\">sin datos utilizables</text>\n    <text x=\"600\" y=\"1306\" fill=\"#5B3E8E\" font-weight=\"700\">Cualitativo: Delphi, analogía histórica, investigación</text>\n\n    <rect x=\"56\" y=\"1314\" width=\"888\" height=\"22\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1329\" fill=\"#333\">Ventas explicadas por publicidad y precio</text>\n    <text x=\"330\" y=\"1329\" fill=\"#333\">relación causal con otras variables</text>\n    <text x=\"600\" y=\"1329\" fill=\"#9C3838\" font-weight=\"700\">Regresión múltiple (revisar colinealidad y residuos)</text>\n  </g>\n</svg>"},{"type":"heading","level":2,"text":"1. La analogía del médico","html":"1. La analogía del médico"},{"type":"paragraph","text":"Las tres clases no son temas sueltos: son **tres partes de un mismo procedimiento**.","html":"Las tres clases no son temas sueltos: son <strong>tres partes de un mismo procedimiento</strong>."},{"type":"table","headers":["Clase","Equivale a…","Qué hace"],"rows":[["---","---","---"],["**3.a** — componentes de la serie","**Mirar al paciente**","Ves los síntomas a simple vista: \"está pálido, le cuesta respirar\""],["**3.b** — autocorrelación","**Pedir análisis**","Confirmás con números lo que sospechabas: \"hemoglobina baja\""],["**Árbol de decisión**","**Recetar**","Según el diagnóstico, corresponde tal tratamiento"],["**Clase 4** — medidas de error","**Control posterior**","¿Mejoró el paciente? Si no, cambiás el remedio"]],"headersHtml":["Clase","Equivale a…","Qué hace"],"rowsHtml":[["---","---","---"],["<strong>3.a</strong> — componentes de la serie","<strong>Mirar al paciente</strong>","Ves los síntomas a simple vista: \"está pálido, le cuesta respirar\""],["<strong>3.b</strong> — autocorrelación","<strong>Pedir análisis</strong>","Confirmás con números lo que sospechabas: \"hemoglobina baja\""],["<strong>Árbol de decisión</strong>","<strong>Recetar</strong>","Según el diagnóstico, corresponde tal tratamiento"],["<strong>Clase 4</strong> — medidas de error","<strong>Control posterior</strong>","¿Mejoró el paciente? Si no, cambiás el remedio"]]},{"type":"paragraph","text":"En pronósticos: **diagnosticar a ojo → confirmar con números → aplicar método → medir si funcionó.**","html":"En pronósticos: <strong>diagnosticar a ojo → confirmar con números → aplicar método → medir si funcionó.</strong>"},{"type":"heading","level":2,"text":"2. El proceso completo en 5 pasos","html":"2. El proceso completo en 5 pasos"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 100\" width=\"100%\" height=\"100\" aria-hidden=\"true\"><rect x=\"8\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.5\"/><text x=\"33\" y=\"38\" font-size=\"8\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">1 Graficar</text><text x=\"58\" y=\"39\" font-size=\"11\" fill=\"#5c6670\">→</text><rect x=\"62\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#a67c00\" stroke-width=\"1.5\"/><text x=\"87\" y=\"38\" font-size=\"8\" fill=\"#a67c00\" font-weight=\"700\" text-anchor=\"middle\">2 Diagnosticar</text><text x=\"112\" y=\"39\" font-size=\"11\" fill=\"#5c6670\">→</text><rect x=\"116\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#a67c00\" stroke-width=\"1.5\"/><text x=\"141\" y=\"38\" font-size=\"8\" fill=\"#a67c00\" font-weight=\"700\" text-anchor=\"middle\">3 Elegir</text><text x=\"166\" y=\"39\" font-size=\"11\" fill=\"#5c6670\">→</text><rect x=\"170\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.5\"/><text x=\"195\" y=\"38\" font-size=\"8\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">4 Aplicar</text><text x=\"220\" y=\"39\" font-size=\"11\" fill=\"#5c6670\">→</text><rect x=\"224\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.5\"/><text x=\"249\" y=\"38\" font-size=\"8\" fill=\"#c45c26\" font-weight=\"700\" text-anchor=\"middle\">5 Medir</text><path d=\"M 258 54 Q 140 92, 22 54\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"140\" y=\"94\" font-size=\"9\" fill=\"#c45c26\" text-anchor=\"middle\">si el error anda mal, volvés a elegir</text></svg>","caption":"El pronóstico es un circuito: si el error delata un patrón no capturado (PME alto y del mismo signo), se vuelve a elegir el método."},{"type":"heading","level":3,"text":"Paso 1 · GRAFICAR *(clase 3.a)*","html":"Paso 1 · GRAFICAR <em>(clase 3.a)</em>"},{"type":"paragraph","text":"Dibujás la serie. Mirás si sube, si tiene olas, si es plana.\n→ **Obtenés: la SOSPECHA.**","html":"Dibujás la serie. Mirás si sube, si tiene olas, si es plana.\n→ <strong>Obtenés: la SOSPECHA.</strong>"},{"type":"heading","level":3,"text":"Paso 2 · DIAGNOSTICAR con el correlograma *(clase 3.b)*","html":"Paso 2 · DIAGNOSTICAR con el correlograma <em>(clase 3.b)</em>"},{"type":"paragraph","text":"Calculás las autocorrelaciones y las comparás con la banda ±2/√n.\n→ **Obtenés: la PRUEBA.** El gráfico daba una impresión; esto es un dato verificable.","html":"Calculás las autocorrelaciones y las comparás con la banda ±2/√n.\n→ <strong>Obtenés: la PRUEBA.</strong> El gráfico daba una impresión; esto es un dato verificable."},{"type":"heading","level":3,"text":"Paso 3 · ELEGIR el método *(árbol de decisión)*","html":"Paso 3 · ELEGIR el método <em>(árbol de decisión)</em>"},{"type":"table","headers":["Diagnóstico","Método"],"rows":[["---","---"],["estacionaria","promedio móvil, suavizado exponencial simple"],["tendencia","Holt, Brown, regresión"],["estacionalidad","Winter, descomposición"],["ciclo","descomposición, indicadores económicos"]],"headersHtml":["Diagnóstico","Método"],"rowsHtml":[["---","---"],["estacionaria","promedio móvil, suavizado exponencial simple"],["tendencia","Holt, Brown, regresión"],["estacionalidad","Winter, descomposición"],["ciclo","descomposición, indicadores económicos"]]},{"type":"paragraph","text":"→ **Obtenés: el MÉTODO.**","html":"→ <strong>Obtenés: el MÉTODO.</strong>"},{"type":"heading","level":3,"text":"Paso 4 · APLICAR el método *(clases 5 en adelante)*","html":"Paso 4 · APLICAR el método <em>(clases 5 en adelante)</em>"},{"type":"paragraph","text":"Hacés las cuentas y obtenés los pronósticos Ŷ.\n→ **Obtenés: los NÚMEROS.**","html":"Hacés las cuentas y obtenés los pronósticos Ŷ.\n→ <strong>Obtenés: los NÚMEROS.</strong>"},{"type":"heading","level":3,"text":"Paso 5 · MEDIR el error *(clase 4)*","html":"Paso 5 · MEDIR el error <em>(clase 4)</em>"},{"type":"paragraph","text":"Calculás MAD, MSE, MAPE y PME comparando Ŷ contra Y.\n→ **Obtenés: la respuesta a \"¿acerté?\"**","html":"Calculás MAD, MSE, MAPE y PME comparando Ŷ contra Y.\n→ <strong>Obtenés: la respuesta a \"¿acerté?\"</strong>"},{"type":"heading","level":3,"text":"⚠ Y acá lo clave: es un CIRCUITO, no una línea recta","html":"⚠ Y acá lo clave: es un CIRCUITO, no una línea recta"},{"type":"paragraph","text":"**Si el error dice que algo anda mal, volvés al paso 3 y cambiás de método.**","html":"<strong>Si el error dice que algo anda mal, volvés al paso 3 y cambiás de método.</strong>"},{"type":"heading","level":2,"text":"3. Ejemplo de punta a punta — una heladería (ventas trimestrales)","html":"3. Ejemplo de punta a punta — una heladería (ventas trimestrales)"},{"type":"table","headers":["Paso","Qué hago","Qué obtengo"],"rows":[["---","---","---"],["**1 · Graficar**","Veo que cada verano se dispara y cada invierno se hunde, y que cada año vende un poco más","*Sospecha:* estacionalidad + tendencia"],["**2 · Correlograma**","Pico grande en r₄ (y otro en r₈); las primeras barras decaen de a poco","**Prueba:** r₄ ⇒ estacionalidad L=4 · decaimiento ⇒ tendencia"],["**3 · Elegir**","Voy al árbol: tendencia + estacionalidad","→ **WINTER** (o descomposición)"],["**4 · Aplicar**","Hago las cuentas de Winter","Los pronósticos Ŷ de los próximos trimestres"],["**5 · Medir**","MAD, MSE, MAPE y PME → MAPE 5%, PME ≈ 0","✔ Preciso y sin sesgo: me quedo con Winter"]],"headersHtml":["Paso","Qué hago","Qué obtengo"],"rowsHtml":[["---","---","---"],["<strong>1 · Graficar</strong>","Veo que cada verano se dispara y cada invierno se hunde, y que cada año vende un poco más","<em>Sospecha:</em> estacionalidad + tendencia"],["<strong>2 · Correlograma</strong>","Pico grande en r₄ (y otro en r₈); las primeras barras decaen de a poco","<strong>Prueba:</strong> r₄ ⇒ estacionalidad L=4 · decaimiento ⇒ tendencia"],["<strong>3 · Elegir</strong>","Voy al árbol: tendencia + estacionalidad","→ <strong>WINTER</strong> (o descomposición)"],["<strong>4 · Aplicar</strong>","Hago las cuentas de Winter","Los pronósticos Ŷ de los próximos trimestres"],["<strong>5 · Medir</strong>","MAD, MSE, MAPE y PME → MAPE 5%, PME ≈ 0","✔ Preciso y sin sesgo: me quedo con Winter"]]},{"type":"heading","level":2,"text":"4. ¿Y si hubiera salido mal?","html":"4. ¿Y si hubiera salido mal?"},{"type":"paragraph","text":"Supongamos que en el paso 4 hubiera usado **suavizado exponencial simple**, ignorando el diagnóstico. El paso 5 me habría dado:","html":"Supongamos que en el paso 4 hubiera usado <strong>suavizado exponencial simple</strong>, ignorando el diagnóstico. El paso 5 me habría dado:"},{"type":"callout","kind":"idea","text":"**PME = +12%, siempre positivo**","html":"<strong>PME = +12%, siempre positivo</strong>"},{"type":"paragraph","text":"**Lectura:** \"estoy subestimando todos los meses\" → el método no captura la tendencia → **vuelvo al paso 3 y cambio a Winter.**","html":"<strong>Lectura:</strong> \"estoy subestimando todos los meses\" → el método no captura la tendencia → <strong>vuelvo al paso 3 y cambio a Winter.</strong>"},{"type":"heading","level":3,"text":"★ La conexión más importante de las tres clases","html":"★ La conexión más importante de las tres clases"},{"type":"callout","kind":"idea","text":"**El PME de la clase 4 te DELATA cuando te equivocaste en el diagnóstico de la clase 3.**","html":"<strong>El PME de la clase 4 te DELATA cuando te equivocaste en el diagnóstico de la clase 3.</strong>"},{"type":"table","headers":["Situación","Qué significa"],"rows":[["---","---"],["Método impreciso pero **centrado** (PME ≈ 0)","Método **correcto**, datos ruidosos. No hay mucho más que hacer."],["Método **sesgado** (PME alto y del mismo signo)","Método **EQUIVOCADO** para ese patrón. Hay que cambiarlo."]],"headersHtml":["Situación","Qué significa"],"rowsHtml":[["---","---"],["Método impreciso pero <strong>centrado</strong> (PME ≈ 0)","Método <strong>correcto</strong>, datos ruidosos. No hay mucho más que hacer."],["Método <strong>sesgado</strong> (PME alto y del mismo signo)","Método <strong>EQUIVOCADO</strong> para ese patrón. Hay que cambiarlo."]]},{"type":"heading","level":2,"text":"5. Cómo se traduce esto en el examen","html":"5. Cómo se traduce esto en el examen"},{"type":"paragraph","text":"Las tres clases juntas te permiten escribir una **justificación completa**, que es lo que puntúa la cátedra (\"interpretación de los resultados\" + \"fundamentación de las respuestas\"):","html":"Las tres clases juntas te permiten escribir una <strong>justificación completa</strong>, que es lo que puntúa la cátedra (\"interpretación de los resultados\" + \"fundamentación de las respuestas\"):"},{"type":"callout","kind":"idea","text":"*\"La serie presenta tendencia y estacionalidad (evidencia: pico significativo en r₄ y decaimiento gradual de las primeras autocorrelaciones), por lo que apliqué el método de Winter; el MAPE de 5% y el PME cercano a cero confirman que el método es adecuado y no presenta sesgo.\"*","html":"<em>\"La serie presenta tendencia y estacionalidad (evidencia: pico significativo en r₄ y decaimiento gradual de las primeras autocorrelaciones), por lo que apliqué el método de Winter; el MAPE de 5% y el PME cercano a cero confirman que el método es adecuado y no presenta sesgo.\"</em>"},{"type":"paragraph","text":"**El molde de esa respuesta:**","html":"<strong>El molde de esa respuesta:</strong>"},{"type":"list","ordered":true,"items":["**Diagnóstico** (qué componentes tiene la serie)","**Evidencia** (gráfico y/o correlograma que lo prueban)","**Método** (cuál elegí)","**Justificación** (por qué ese método corresponde a ese patrón)","**Validación** (qué dicen las medidas de error)"],"itemsHtml":["<strong>Diagnóstico</strong> (qué componentes tiene la serie)","<strong>Evidencia</strong> (gráfico y/o correlograma que lo prueban)","<strong>Método</strong> (cuál elegí)","<strong>Justificación</strong> (por qué ese método corresponde a ese patrón)","<strong>Validación</strong> (qué dicen las medidas de error)"]},{"type":"heading","level":2,"text":"6. Mini-resumen para tu doc","html":"6. Mini-resumen para tu doc"},{"type":"callout","kind":"examen","text":"**Integrador 3.a + 3.b + 4.** El pronóstico es un circuito de 5 pasos: graficar (sospecha) → correlograma (prueba) → árbol (método) → aplicar (números) → medir error (¿acerté?). Si las medidas de error muestran sesgo (PME alto y consistente), se vuelve al paso 3 y se cambia de método: el PME delata un diagnóstico equivocado. La respuesta de examen combina las tres clases: diagnóstico + evidencia + método + justificación + validación.","html":"<strong>Integrador 3.a + 3.b + 4.</strong> El pronóstico es un circuito de 5 pasos: graficar (sospecha) → correlograma (prueba) → árbol (método) → aplicar (números) → medir error (¿acerté?). Si las medidas de error muestran sesgo (PME alto y consistente), se vuelve al paso 3 y se cambia de método: el PME delata un diagnóstico equivocado. La respuesta de examen combina las tres clases: diagnóstico + evidencia + método + justificación + validación."},{"type":"paragraph","text":"**Material asociado:** `ProcesoCompleto_Pronostico.svg` · `Clase03a_SeriesDeTiempo.md` · `Clase03b_Autocorrelacion.md` · `Clase04_MedidasDeError.md` · `ArbolDecisorio_MetodosPronostico.svg`","html":"<strong>Material asociado:</strong> <code>ProcesoCompleto_Pronostico.svg</code> · <code>Clase03a_SeriesDeTiempo.md</code> · <code>Clase03b_Autocorrelacion.md</code> · <code>Clase04_MedidasDeError.md</code> · <code>ArbolDecisorio_MetodosPronostico.svg</code>"},{"type":"paragraph","text":"**Sigue → Clase 5: Métodos no formales y promedios** — el paso 4 del circuito (aplicar el método), ahora con los informales y los promedios.","html":"<strong>Sigue → Clase 5: Métodos no formales y promedios</strong> — el paso 4 del circuito (aplicar el método), ahora con los informales y los promedios."}],"historias":[{"type":"concepto","k":"La idea","title":"Tres clases, un solo procedimiento.","text":"3.a te da la sospecha, 3.b te da la prueba, el árbol te da el método, la clase 4 te dice si acertaste. No son temas sueltos.","svg":"<svg viewBox=\"0 0 280 100\" width=\"100%\" height=\"100\" aria-hidden=\"true\"><rect x=\"8\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.5\"/><text x=\"33\" y=\"38\" font-size=\"8\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">1 Graficar</text><text x=\"58\" y=\"39\" font-size=\"11\" fill=\"#9aa3ad\">→</text><rect x=\"62\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#e8c56a\" stroke-width=\"1.5\"/><text x=\"87\" y=\"38\" font-size=\"8\" fill=\"#e8c56a\" font-weight=\"700\" text-anchor=\"middle\">2 Diagnosticar</text><text x=\"112\" y=\"39\" font-size=\"11\" fill=\"#9aa3ad\">→</text><rect x=\"116\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#e8c56a\" stroke-width=\"1.5\"/><text x=\"141\" y=\"38\" font-size=\"8\" fill=\"#e8c56a\" font-weight=\"700\" text-anchor=\"middle\">3 Elegir</text><text x=\"166\" y=\"39\" font-size=\"11\" fill=\"#9aa3ad\">→</text><rect x=\"170\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.5\"/><text x=\"195\" y=\"38\" font-size=\"8\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">4 Aplicar</text><text x=\"220\" y=\"39\" font-size=\"11\" fill=\"#9aa3ad\">→</text><rect x=\"224\" y=\"16\" width=\"50\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.5\"/><text x=\"249\" y=\"38\" font-size=\"8\" fill=\"#e25b16\" font-weight=\"700\" text-anchor=\"middle\">5 Medir</text><path d=\"M 258 54 Q 140 92, 22 54\" fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"140\" y=\"94\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\">si el error anda mal, volvés a elegir</text></svg>","chartLabel":"Graficar → correlograma → árbol → aplicar → medir, y volver si falla","html":"3.a te da la sospecha, 3.b te da la prueba, el árbol te da el método, la clase 4 te dice si acertaste. No son temas sueltos.","titleHtml":"Tres clases, un solo procedimiento."},{"type":"concepto","k":"La analogía","title":"Como un médico.","text":"3.a es mirar al paciente (los síntomas a simple vista). 3.b es pedir análisis (confirmar con números). El árbol es recetar. La clase 4 es el control posterior: ¿mejoró? Si no, cambiás el remedio.","html":"3.a es mirar al paciente (los síntomas a simple vista). 3.b es pedir análisis (confirmar con números). El árbol es recetar. La clase 4 es el control posterior: ¿mejoró? Si no, cambiás el remedio.","titleHtml":"Como un médico."},{"type":"concepto","k":"Paso 1 y 2","title":"Graficar y diagnosticar.","text":"Paso 1: dibujás la serie y mirás si sube, si tiene olas, si es plana → la SOSPECHA. Paso 2: autocorrelaciones contra la banda ±2/√n → la PRUEBA. El gráfico daba una impresión; esto es un dato verificable.","html":"Paso 1: dibujás la serie y mirás si sube, si tiene olas, si es plana → la SOSPECHA. Paso 2: autocorrelaciones contra la banda ±2/√n → la PRUEBA. El gráfico daba una impresión; esto es un dato verificable.","titleHtml":"Graficar y diagnosticar."},{"type":"concepto","k":"Paso 3, 4 y 5","title":"Elegir, aplicar, medir.","text":"El árbol propone el método (paso 3). Lo aplicás (paso 4, clases 5 en adelante). Medís MAD, MSE, MAPE y PME (paso 5). Si el error anda mal, no afines a ciegas: volvé a elegir.","html":"El árbol propone el método (paso 3). Lo aplicás (paso 4, clases 5 en adelante). Medís MAD, MSE, MAPE y PME (paso 5). Si el error anda mal, no afines a ciegas: volvé a elegir.","titleHtml":"Elegir, aplicar, medir."},{"type":"pregunta","k":"A ver…","title":"El pronóstico es un circuito, no una línea recta. Si el error anda mal, ¿qué hacés?","options":["Ajustás un poco los números a mano y listo","Volvés al paso 3 y cambiás de método","Tiras el modelo y usás el promedio, siempre"],"correct":1,"feedback":"Si el error dice que algo anda mal, volvés al paso 3 y cambiás de método.","titleHtml":"El pronóstico es un circuito, no una línea recta. Si el error anda mal, ¿qué hacés?"},{"type":"concepto","k":"Heladería","title":"De punta a punta.","text":"Heladería, ventas trimestrales: el gráfico sospecha T+S; el correlograma lo prueba (pico en r₄ y decaimiento); el árbol pide Winter; el MAPE 5% y el PME ≈ 0 confirman.","html":"Heladería, ventas trimestrales: el gráfico sospecha T+S; el correlograma lo prueba (pico en r₄ y decaimiento); el árbol pide Winter; el MAPE 5% y el PME ≈ 0 confirman.","titleHtml":"De punta a punta."},{"type":"concepto","k":"¿Y si salía mal?","title":"El PME delata un diagnóstico equivocado.","text":"Si en el paso 4 hubieras usado suavizado exponencial simple, ignorando el diagnóstico, el paso 5 te habría dado PME = +12%, siempre positivo: estás subestimando todos los meses, el método no captura la tendencia. Volvés al paso 3 y cambiás a Winter.","ejemplo":"Método impreciso pero centrado (PME ≈ 0): método correcto, datos ruidosos. Método sesgado (PME alto y del mismo signo): método EQUIVOCADO para ese patrón.","html":"Si en el paso 4 hubieras usado suavizado exponencial simple, ignorando el diagnóstico, el paso 5 te habría dado PME = +12%, siempre positivo: estás subestimando todos los meses, el método no captura la tendencia. Volvés al paso 3 y cambiás a Winter.","titleHtml":"El PME delata un diagnóstico equivocado."},{"type":"pregunta","k":"A ver…","title":"Un método tiene MAPE bajo pero PME alto y siempre del mismo signo. ¿Qué significa?","options":["Está bien: el MAPE bajo gana siempre","Es preciso pero sesgado: el método es equivocado para ese patrón y hay que cambiarlo","Hay que borrar los datos atípicos y nada más"],"correct":1,"feedback":"El PME de la clase 4 te delata cuando te equivocaste en el diagnóstico de la clase 3. Sesgo alto y consistente → cambiar de método.","titleHtml":"Un método tiene MAPE bajo pero PME alto y siempre del mismo signo. ¿Qué significa?"},{"type":"concepto","k":"En el examen","title":"Una justificación completa puntúa.","text":"El molde: 1) diagnóstico (qué componentes tiene), 2) evidencia (gráfico y/o correlograma), 3) método, 4) justificación (por qué ese método para ese patrón), 5) validación (qué dicen las medidas de error).","ejemplo":"«La serie presenta tendencia y estacionalidad (pico significativo en r₄ y decaimiento gradual), por lo que apliqué Winter; el MAPE de 5% y el PME cercano a cero confirman que el método es adecuado y no presenta sesgo.»","html":"El molde: 1) diagnóstico (qué componentes tiene), 2) evidencia (gráfico y/o correlograma), 3) método, 4) justificación (por qué ese método para ese patrón), 5) validación (qué dicen las medidas de error).","titleHtml":"Una justificación completa puntúa."},{"type":"cierre","title":"Llevate el circuito.","text":"Graficar (sospecha) → correlograma (prueba) → árbol (método) → aplicar (números) → medir el error (¿acerté?). Si el PME es alto y consistente, se vuelve al paso 3. La respuesta de examen combina las tres clases: diagnóstico + evidencia + método + justificación + validación.","html":"Graficar (sospecha) → correlograma (prueba) → árbol (método) → aplicar (números) → medir el error (¿acerté?). Si el PME es alto y consistente, se vuelve al paso 3. La respuesta de examen combina las tres clases: diagnóstico + evidencia + método + justificación + validación.","titleHtml":"Llevate el circuito."}],"titleHtml":"Integrador · Proceso completo","ledeHtml":"En una frase: <em>3.a me da la SOSPECHA · 3.b me da la PRUEBA · el árbol me da el MÉTODO · la clase 4 me dice si ACERTÉ.</em>"},"c5":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c5","title":"Clase 5 · Métodos no formales y promedios","name":"No formales y promedios","lede":"Los períodos recientes son, en estos métodos, los mejores pronosticadores del futuro. Arrancamos por los modelos informales y seguimos por promedio simple, móvil, móvil doble y —con Chase— el móvil ponderado. La suavización exponencial queda para la Clase 6.","visto":false,"source":["texto/resumenes/Resumen_Hanke_25p.txt (sección Promedios móviles y métodos de atenuación)","texto/resumenes/Resumen_Sistema_de_Gestion_7p.txt","texto/resumenes/ResumenSG-Final-V6_345p.txt (Cap. 4 Hanke y promedio ponderado de Chase, págs. 16–19 y 222–224 del resumen)","texto/examenes/Formulas SdG.txt (título del capítulo)","clases_previas/SG/ArbolDecisorio_MetodosPronostico.svg","clases_previas/SG/Clase03a_SeriesDeTiempo.md (tabla estacionaria / tendencia)","texto/examenes/SG!EVA.txt (ejercicio alimento para perros)","texto/ocr/sg1_ppm/p-02.png (resolución manuscrita de SG1.doc, Final (1), ítem 2.1)"],"laminas":["u2/img/ArbolDecisorio_MetodosPronostico.svg"],"next":"Clase 6 · Suavizado exponencial simple (próximamente)","teoria":[{"type":"paragraph","text":"**Sistemas de Gestión (UTN FRRo) · Unidad 2.c · Serie: 0 → 0.1 → 1 → 1.b → 2 → 3.a → 3.b → 4 → Integrador → **5**","html":"<strong>Sistemas de Gestión (UTN FRRo) · Unidad 2.c · Serie: 0 → 0.1 → 1 → 1.b → 2 → 3.a → 3.b → 4 → Integrador → </strong>5**"},{"type":"callout","kind":"aviso","text":"**De dónde sale esta clase.** No hay un apunte de la cátedra titulado «Clase 5». Se arma con el resumen de Hanke (25 páginas y 7 páginas), el Capítulo 4 del Resumen V6, el árbol de la Clase 3.a y un ejemplo de promedio móvil ponderado de Chase que está en el mismo Resumen V6. En el plan de clases y en el Documento Maestro se habló de «métodos ingenuos»; Hanke y el V6 dicen **métodos no formales** o **informales**. No presento «ingenuo» como término de Hanke. La suavización exponencial, que el Documento Maestro agrupa en la misma semana, queda para la **Clase 6**.","html":"<strong>De dónde sale esta clase.</strong> No hay un apunte de la cátedra titulado «Clase 5». Se arma con el resumen de Hanke (25 páginas y 7 páginas), el Capítulo 4 del Resumen V6, el árbol de la Clase 3.a y un ejemplo de promedio móvil ponderado de Chase que está en el mismo Resumen V6. En el plan de clases y en el Documento Maestro se habló de «métodos ingenuos»; Hanke y el V6 dicen <strong>métodos no formales</strong> o <strong>informales</strong>. No presento «ingenuo» como término de Hanke. La suavización exponencial, que el Documento Maestro agrupa en la misma semana, queda para la <strong>Clase 6</strong>."},{"type":"callout","kind":"idea","text":"**Idea central:** hay tres enfoques sencillos en este capítulo: el **informal**, el de **promedios** y el de **suavización**. Esta clase cubre los dos primeros. Todos parten de la misma idea: las fluctuaciones de corto plazo se tratan como apartamientos aleatorios de una estructura, y esa estructura se proyecta hacia adelante.","html":"<strong>Idea central:</strong> hay tres enfoques sencillos en este capítulo: el <strong>informal</strong>, el de <strong>promedios</strong> y el de <strong>suavización</strong>. Esta clase cubre los dos primeros. Todos parten de la misma idea: las fluctuaciones de corto plazo se tratan como apartamientos aleatorios de una estructura, y esa estructura se proyecta hacia adelante."},{"type":"heading","level":2,"text":"1. Dónde encajan en el árbol","html":"1. Dónde encajan en el árbol"},{"type":"paragraph","text":"En la Clase 3.a quedó armada la primera bifurcación: *¿la serie es estacionaria?* (el promedio no cambia a lo largo del tiempo). El árbol de la cátedra asigna así las familias de esta clase:","html":"En la Clase 3.a quedó armada la primera bifurcación: <em>¿la serie es estacionaria?</em> (el promedio no cambia a lo largo del tiempo). El árbol de la cátedra asigna así las familias de esta clase:"},{"type":"table","headers":["Diagnóstico (Clase 3.a)","Métodos de esta clase"],"rows":[["**Estacionaria**","promedio simple, promedio móvil (además, más adelante: suavizado exponencial simple y Box-Jenkins)"],["**Tiene tendencia**","promedio móvil doble (además: Brown, Holt, regresión, modelos exponenciales)"]],"caption":"Recorte del árbol y de la tabla de la Clase 3.a. No se inventan asignaciones nuevas.","captionHtml":"Recorte del árbol y de la tabla de la Clase 3.a. No se inventan asignaciones nuevas.","headersHtml":["Diagnóstico (Clase 3.a)","Métodos de esta clase"],"rowsHtml":[["<strong>Estacionaria</strong>","promedio simple, promedio móvil (además, más adelante: suavizado exponencial simple y Box-Jenkins)"],["<strong>Tiene tendencia</strong>","promedio móvil doble (además: Brown, Holt, regresión, modelos exponenciales)"]]},{"type":"svg","file":"u2/img/ArbolDecisorio_MetodosPronostico.svg","caption":"Árbol decisorio de métodos de pronóstico (lámina oficial de la cátedra)","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 1360\" width=\"1000\" height=\"1360\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"a1\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"a2\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#888\"/></marker>\n  </defs>\n  <rect width=\"1000\" height=\"1360\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">ÁRBOL DECISORIO · ¿Qué método de pronóstico uso?</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina complementaria Clase 3.a — U2 · La respuesta a “justifique la metodología aplicada”</text>\n\n  <rect x=\"40\" y=\"68\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">REGLA MADRE: graficar la serie SIEMPRE antes de decidir. Con pocos datos, graficar es obligatorio. El gráfico manda sobre cualquier fórmula.</text>\n\n  <!-- ===== NIVEL 0 ===== -->\n  <rect x=\"380\" y=\"116\" width=\"240\" height=\"42\" rx=\"21\" fill=\"#1F4E79\"/>\n  <text x=\"500\" y=\"142\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Necesito pronosticar</text>\n\n  <line x1=\"500\" y1=\"158\" x2=\"500\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"770\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"230\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"770\" y1=\"176\" x2=\"770\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- PREGUNTA 1 -->\n  <text x=\"500\" y=\"170\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\" text-anchor=\"middle\">① ¿Tengo datos históricos suficientes y representativos?</text>\n\n  <!-- RAMA NO: CUALITATIVOS -->\n  <rect x=\"700\" y=\"200\" width=\"260\" height=\"152\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"716\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">NO → MÉTODOS CUALITATIVOS</text>\n  <text x=\"716\" y=\"240\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Se basan en juicio e intuición, no en datos</text>\n  <text x=\"716\" y=\"260\" font-size=\"10.8\" fill=\"#333\">· Delphi (panel de expertos anónimo)</text>\n  <text x=\"716\" y=\"276\" font-size=\"10.8\" fill=\"#333\">· Investigación de mercado / encuestas</text>\n  <text x=\"716\" y=\"292\" font-size=\"10.8\" fill=\"#333\">· Analogía histórica (producto similar)</text>\n  <text x=\"716\" y=\"308\" font-size=\"10.8\" fill=\"#333\">· Consenso de comité / fuerza de ventas</text>\n  <text x=\"716\" y=\"330\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Cuándo: producto nuevo, sin historia,</text>\n  <text x=\"716\" y=\"345\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">o largo plazo (&gt; 2 años)</text>\n\n  <!-- RAMA SI: CUANTITATIVOS -->\n  <r
