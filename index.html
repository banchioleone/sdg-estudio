agraph","text":"**① Numerador:**\nn·ΣXY − ΣX·ΣY = 5(7.185) − (57)(600) = 35.925 − 34.200 = **1.725**","html":"<strong>① Numerador:</strong>\nn·ΣXY − ΣX·ΣY = 5(7.185) − (57)(600) = 35.925 − 34.200 = <strong>1.725</strong>"},{"type":"paragraph","text":"**② Primer corchete:**\nn·ΣX² − (ΣX)² = 5(749) − 57² = 3.745 − 3.249 = **496**","html":"<strong>② Primer corchete:</strong>\nn·ΣX² − (ΣX)² = 5(749) − 57² = 3.745 − 3.249 = <strong>496</strong>"},{"type":"paragraph","text":"**③ Segundo corchete:**\nn·ΣY² − (ΣY)² = 5(73.250) − 600² = 366.250 − 360.000 = **6.250**","html":"<strong>③ Segundo corchete:</strong>\nn·ΣY² − (ΣY)² = 5(73.250) − 600² = 366.250 − 360.000 = <strong>6.250</strong>"},{"type":"paragraph","text":"**④ Denominador:**\n√(496 × 6.250) = √3.100.000 ≈ **1.760,7**","html":"<strong>④ Denominador:</strong>\n√(496 × 6.250) = √3.100.000 ≈ <strong>1.760,7</strong>"},{"type":"paragraph","text":"**⑤ Resultado:**","html":"<strong>⑤ Resultado:</strong>"},{"type":"formula","tex":"r = \\frac{1.725}{1.760,7} \\approx \\mathbf{0,98}","html":"<span class=\"eq-block\">r = <span class=\"frac\"><span class=\"num\">1.725</span><span class=\"den\">1.760,7</span></span> ≈ <b>0,98</b></span>"},{"type":"paragraph","text":"**Interpretación:** correlación positiva **muy fuerte**. La publicidad y las ventas se mueven casi en línea recta. Con un r así, un modelo de regresión sobre estos datos va a ajustar muy bien.","html":"<strong>Interpretación:</strong> correlación positiva <strong>muy fuerte</strong>. La publicidad y las ventas se mueven casi en línea recta. Con un r así, un modelo de regresión sobre estos datos va a ajustar muy bien."},{"type":"heading","level":2,"text":"6. Las DOS advertencias que siempre se preguntan ★","html":"6. Las DOS advertencias que siempre se preguntan ★"},{"type":"heading","level":3,"text":"⚠ 1. Correlación NO implica causalidad","html":"⚠ 1. Correlación NO implica causalidad"},{"type":"paragraph","text":"Que dos cosas se muevan juntas no significa que una cause la otra. Puede haber:","html":"Que dos cosas se muevan juntas no significa que una cause la otra. Puede haber:"},{"type":"list","ordered":false,"items":["Una **tercera variable** moviendo a ambas → *ejemplo clásico: la venta de helados y los ahogamientos suben juntos; no es que el helado ahogue, es el calor que causa ambos.*","**Pura coincidencia** (correlaciones espurias)."],"itemsHtml":["Una <strong>tercera variable</strong> moviendo a ambas → <em>ejemplo clásico: la venta de helados y los ahogamientos suben juntos; no es que el helado ahogue, es el calor que causa ambos.</em>","<strong>Pura coincidencia</strong> (correlaciones espurias)."]},{"type":"paragraph","text":"**r mide asociación, no causa.** Quien decide si hay causalidad es el criterio del analista sobre el negocio, no la fórmula.","html":"<strong>r mide asociación, no causa.</strong> Quien decide si hay causalidad es el criterio del analista sobre el negocio, no la fórmula."},{"type":"heading","level":3,"text":"⚠ 2. Un r bajo NO significa \"sin relación\"","html":"⚠ 2. Un r bajo NO significa \"sin relación\""},{"type":"paragraph","text":"r mide **solo relación lineal**. Una relación en forma de U perfecta puede dar **r ≈ 0** y sin embargo ser una relación fortísima.","html":"r mide <strong>solo relación lineal</strong>. Una relación en forma de U perfecta puede dar <strong>r ≈ 0</strong> y sin embargo ser una relación fortísima."},{"type":"paragraph","text":"**Por eso: primero se grafica, después se calcula.** Si te guiás solo por el número, te perdés las relaciones curvas. *Esta es exactamente la razón por la que la cátedra insiste con el \"análisis de gráficos\".*","html":"<strong>Por eso: primero se grafica, después se calcula.</strong> Si te guiás solo por el número, te perdés las relaciones curvas. <em>Esta es exactamente la razón por la que la cátedra insiste con el \"análisis de gráficos\".</em>"},{"type":"heading","level":2,"text":"7. El puente hacia lo que viene","html":"7. El puente hacia lo que viene"},{"type":"table","headers":["Herramienta","Qué te dice","Dónde se ve"],"rows":[["---","---","---"],["**r**","*Si* hay relación lineal y cuán fuerte","Clase 2 (hoy)"],["**Regresión**","La *ecuación de la recta* para poder pronosticar","Clases 8–9"],["**R² = r²**","Qué **% de la variación de Y** explica el modelo","Clase 9"]],"headersHtml":["Herramienta","Qué te dice","Dónde se ve"],"rowsHtml":[["---","---","---"],["<strong>r</strong>","<em>Si</em> hay relación lineal y cuán fuerte","Clase 2 (hoy)"],["<strong>Regresión</strong>","La <em>ecuación de la recta</em> para poder pronosticar","Clases 8–9"],["<strong>R² = r²</strong>","Qué <strong>% de la variación de Y</strong> explica el modelo","Clase 9"]]},{"type":"paragraph","text":"En el ejemplo: r = 0,98 → **R² = 0,96** → *\"la publicidad explica el 96% de la variación de las ventas\"*. Esa frase es interpretación pura: el tipo de respuesta que puntúa la cátedra.","html":"En el ejemplo: r = 0,98 → <strong>R² = 0,96</strong> → <em>\"la publicidad explica el 96% de la variación de las ventas\"</em>. Esa frase es interpretación pura: el tipo de respuesta que puntúa la cátedra."},{"type":"paragraph","text":"**Más adelante:** con varias variables explicativas (regresión múltiple) se arma la **matriz de correlación** — todos los r cruzados entre todas las variables — para elegir buenas predictoras y detectar **colinealidad**. Todo eso nace de este r.","html":"<strong>Más adelante:</strong> con varias variables explicativas (regresión múltiple) se arma la <strong>matriz de correlación</strong> — todos los r cruzados entre todas las variables — para elegir buenas predictoras y detectar <strong>colinealidad</strong>. Todo eso nace de este r."},{"type":"heading","level":2,"text":"8. Chequeos de sensatez","html":"8. Chequeos de sensatez"},{"type":"list","ordered":false,"items":["r siempre entre −1 y +1 (fuera de ese rango = error de cálculo)","El signo de r debe coincidir con lo que ves en el gráfico (si la nube sube, r > 0)","Si r ≈ 0 pero el gráfico muestra un patrón claro → la relación es **curva**, no inexistente","Un r alto **no autoriza** a hablar de causa"],"itemsHtml":["r siempre entre −1 y +1 (fuera de ese rango = error de cálculo)","El signo de r debe coincidir con lo que ves en el gráfico (si la nube sube, r &gt; 0)","Si r ≈ 0 pero el gráfico muestra un patrón claro → la relación es <strong>curva</strong>, no inexistente","Un r alto <strong>no autoriza</strong> a hablar de causa"]},{"type":"heading","level":2,"text":"9. Mini-resumen para tu doc","html":"9. Mini-resumen para tu doc"},{"type":"callout","kind":"examen","text":"**Clase 2.** Correlación mide si dos variables se mueven juntas. Siempre graficar primero (diagrama de dispersión, X=independiente, Y=dependiente) e identificar el patrón entre los 6 posibles. r ∈ [−1, +1]: el signo da dirección, el valor absoluto la fuerza. Se calcula con la tabla de Σ (X, Y, XY, X², Y²). Dos advertencias de examen: correlación ≠ causalidad, y r bajo solo descarta relación LINEAL (una curva puede dar r≈0). r² = % de variación explicada; enlaza directo con regresión.","html":"<strong>Clase 2.</strong> Correlación mide si dos variables se mueven juntas. Siempre graficar primero (diagrama de dispersión, X=independiente, Y=dependiente) e identificar el patrón entre los 6 posibles. r ∈ [−1, +1]: el signo da dirección, el valor absoluto la fuerza. Se calcula con la tabla de Σ (X, Y, XY, X², Y²). Dos advertencias de examen: correlación ≠ causalidad, y r bajo solo descarta relación LINEAL (una curva puede dar r≈0). r² = % de variación explicada; enlaza directo con regresión."},{"type":"ejercicio","title":"10. EJERCICIO PENDIENTE — Clase 2","estado":"para resolver","blocks":[{"type":"paragraph","text":"Una fábrica registró, para 5 meses, la temperatura media (°C) y las ventas de bebidas (miles de litros):","html":"Una fábrica registró, para 5 meses, la temperatura media (°C) y las ventas de bebidas (miles de litros):"},{"type":"table","headers":["Temp (X)","18","25","30","22","15"],"rows":[["---","---","---","---","---","---"],["Ventas (Y)","40","65","78","52","30"]],"headersHtml":["Temp (X)","18","25","30","22","15"],"rowsHtml":[["---","---","---","---","---","---"],["Ventas (Y)","40","65","78","52","30"]]},{"type":"paragraph","text":"**a)** Armá la tabla con las 5 columnas (X, Y, XY, X², Y²) y obtené las sumatorias.\n**b)** Calculá r.\n**c)** Interpretá: dirección, fuerza, y qué % de la variación de las ventas queda explicado.\n**d)** *Pregunta de criterio:* ¿podés afirmar que la temperatura **causa** las ventas? Justificá.","html":"<strong>a)</strong> Armá la tabla con las 5 columnas (X, Y, XY, X², Y²) y obtené las sumatorias.\n<strong>b)</strong> Calculá r.\n<strong>c)</strong> Interpretá: dirección, fuerza, y qué % de la variación de las ventas queda explicado.\n<strong>d)</strong> <em>Pregunta de criterio:</em> ¿podés afirmar que la temperatura <strong>causa</strong> las ventas? Justificá."},{"type":"callout","kind":"idea","text":"**Recordatorio:** graficá los puntos antes de calcular. El gráfico es método y es puntaje (criterio oficial: \"interpretación de los resultados\" y \"fundamentación de las respuestas\").","html":"<strong>Recordatorio:</strong> graficá los puntos antes de calcular. El gráfico es método y es puntaje (criterio oficial: \"interpretación de los resultados\" y \"fundamentación de las respuestas\")."}],"nota":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","notaHtml":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","titleHtml":"10. EJERCICIO PENDIENTE — Clase 2"},{"type":"heading","level":2,"text":"11. Ejercicios acumulados pendientes de corrección","html":"11. Ejercicios acumulados pendientes de corrección"},{"type":"list","ordered":false,"items":["**Clase 1.b** (ventas 120, 135, 105, 140, 100): ítems a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110<X<145) · e) inverso 90% · f) ¿Z o t?","**Clase 2** (temperatura vs. bebidas): ítems a) a d)"],"itemsHtml":["<strong>Clase 1.b</strong> (ventas 120, 135, 105, 140, 100): ítems a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110&lt;X&lt;145) · e) inverso 90% · f) ¿Z o t?","<strong>Clase 2</strong> (temperatura vs. bebidas): ítems a) a d)"]},{"type":"paragraph","text":"**Material asociado:** `Clase01_y_01b_BaseEstadistica.md` · `Clase01_BaseEstadistica.svg` · `Clase01b_TablaZ_5Casos.svg`\n**Fuente:** Hanke, *Pronósticos en los Negocios*, cap. 2 (análisis de correlación) — disponible completo en Drive/Teoría/Libros.","html":"<strong>Material asociado:</strong> <code>Clase01_y_01b_BaseEstadistica.md</code> · <code>Clase01_BaseEstadistica.svg</code> · <code>Clase01b_TablaZ_5Casos.svg</code>\n<strong>Fuente:</strong> Hanke, <em>Pronósticos en los Negocios</em>, cap. 2 (análisis de correlación) — disponible completo en Drive/Teoría/Libros."},{"type":"paragraph","text":"**Próxima clase → Clase 3: Fuentes y tipos de datos + componentes de una serie de tiempo** (tendencia, ciclo, estacionalidad, irregularidad): el ingreso formal a los pronósticos.","html":"<strong>Próxima clase → Clase 3: Fuentes y tipos de datos + componentes de una serie de tiempo</strong> (tendencia, ciclo, estacionalidad, irregularidad): el ingreso formal a los pronósticos."}],"historias":[{"type":"concepto","k":"La idea","title":"Ahora miramos dos variables juntas.","text":"Hasta ahora mirábamos una variable (ventas y su dispersión). La correlación mide si dos variables se mueven juntas. Si encontrás una que acompaña a tus ventas, entendés por qué varían y podés pronosticarlas. Es la antesala de la regresión.","html":"Hasta ahora mirábamos una variable (ventas y su dispersión). La correlación mide si dos variables se mueven juntas. Si encontrás una que acompaña a tus ventas, entendés por qué varían y podés pronosticarlas. Es la antesala de la regresión.","titleHtml":"Ahora miramos dos variables juntas."},{"type":"concepto","k":"La pregunta útil","title":"¿De qué dependen mis ventas?","text":"No alcanza con «¿cuánto vendo en promedio?». Si dos variables se mueven juntas, entendés el fenómeno y, si conocés una (la publicidad del mes que viene), estimás la otra.","html":"No alcanza con «¿cuánto vendo en promedio?». Si dos variables se mueven juntas, entendés el fenómeno y, si conocés una (la publicidad del mes que viene), estimás la otra.","titleHtml":"¿De qué dependen mis ventas?"},{"type":"concepto","k":"Paso uno","title":"Siempre se grafica primero.","text":"Cada punto es un par: X en el horizontal, Y en el vertical. X es la independiente (la que explica, la que conocés primero). Y es la dependiente (la que querés explicar o predecir).","ejemplo":"Para estimar ventas a partir de publicidad: publicidad = X, ventas = Y. Con 5 meses (10→120, 15→135, 8→105, 18→140, 6→100) se ve que suben juntos. Eso ya es información, antes de cualquier fórmula.","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><line x1=\"32\" y1=\"118\" x2=\"272\" y2=\"118\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"32\" y1=\"20\" x2=\"32\" y2=\"118\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"59.5\" y1=\"102.66666666666667\" x2=\"224.5\" y2=\"41.33333333333333\" stroke=\"#e8c56a\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"114.5\" cy=\"72.0\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"183.25\" cy=\"49.0\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"87.0\" cy=\"95.0\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"224.5\" cy=\"41.33333333333333\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"59.5\" cy=\"102.66666666666667\" r=\"4\" fill=\"#8cb4d6\"/><text x=\"150\" y=\"134\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">Publicidad X (miles $)</text><text x=\"12\" y=\"70\" font-size=\"9\" fill=\"#9aa3ad\" transform=\"rotate(-90 12 70)\">Ventas Y</text></svg>","chartLabel":"Publicidad vs. ventas (5 meses del apunte)","html":"Cada punto es un par: X en el horizontal, Y en el vertical. X es la independiente (la que explica, la que conocés primero). Y es la dependiente (la que querés explicar o predecir).","titleHtml":"Siempre se grafica primero."},{"type":"pregunta","k":"A ver…","title":"Si querés estimar ventas a partir de la publicidad, ¿cuál es X?","options":["Las ventas, porque es lo que más te importa","La publicidad: es la independiente, la que conocés primero","Da igual: r no distingue X de Y"],"correct":1,"feedback":"X es la independiente, la causa candidata, la que conocés primero. Y es la que querés explicar o predecir. Publicidad = X, ventas = Y.","titleHtml":"Si querés estimar ventas a partir de la publicidad, ¿cuál es X?"},{"type":"concepto","k":"Seis patrones","title":"Hanke, capítulo 2.","text":"Lineal positiva o negativa, perfecta o imperfecta; curva; o sin relación. En la práctica, el caso realista es la nube alargada (imperfecta).","ejemplo":"Qué buscar, en este orden: ¿lineal o curva? Si es lineal, ¿positiva o negativa? ¿Cuán apretados están los puntos?","html":"Lineal positiva o negativa, perfecta o imperfecta; curva; o sin relación. En la práctica, el caso realista es la nube alargada (imperfecta).","titleHtml":"Hanke, capítulo 2."},{"type":"concepto","k":"El coeficiente r","title":"Mide la relación LINEAL.","text":"Se arma una tabla con X, Y, XY, X², Y², se suma cada columna y se reemplaza en la fórmula. r siempre está entre −1 y +1. El signo es la dirección; el valor absoluto, la fuerza.","formula":"r = \\frac{n\\sum XY - \\sum X \\sum Y}{\\sqrt{\\left[n\\sum X^2 - (\\sum X)^2\\right]\\cdot\\left[n\\sum Y^2 - (\\sum Y)^2\\right]}}","ejemplo":"Si te da 1,3 o −2, hay error de cálculo.","formulaHtml":"<span class=\"eq-block\">r = <span class=\"frac\"><span class=\"num\">nΣ XY - Σ X Σ Y</span><span class=\"den\">√<span class=\"rad\">[nΣ X<sup>2</sup> - (Σ X)<sup>2</sup>]·[nΣ Y<sup>2</sup> - (Σ Y)<sup>2</sup>]</span></span></span></span>","html":"Se arma una tabla con X, Y, XY, X², Y², se suma cada columna y se reemplaza en la fórmula. r siempre está entre −1 y +1. El signo es la dirección; el valor absoluto, la fuerza.","titleHtml":"Mide la relación LINEAL."},{"type":"concepto","k":"Paso a paso","title":"Publicidad y ventas: r ≈ 0,98.","text":"n = 5, ΣX = 57, ΣY = 600, ΣXY = 7.185, ΣX² = 749, ΣY² = 73.250. Numerador 1.725, denominador ≈ 1.760,7.","ejemplo":"r ≈ 0,98: correlación positiva muy fuerte. Se mueven casi en línea recta. Un modelo de regresión sobre estos datos va a ajustar muy bien.","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><line x1=\"32\" y1=\"118\" x2=\"272\" y2=\"118\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"32\" y1=\"20\" x2=\"32\" y2=\"118\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"59.5\" y1=\"102.66666666666667\" x2=\"224.5\" y2=\"41.33333333333333\" stroke=\"#e8c56a\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"114.5\" cy=\"72.0\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"183.25\" cy=\"49.0\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"87.0\" cy=\"95.0\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"224.5\" cy=\"41.33333333333333\" r=\"4\" fill=\"#8cb4d6\"/><circle cx=\"59.5\" cy=\"102.66666666666667\" r=\"4\" fill=\"#8cb4d6\"/><text x=\"150\" y=\"134\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">Publicidad X (miles $)</text><text x=\"12\" y=\"70\" font-size=\"9\" fill=\"#9aa3ad\" transform=\"rotate(-90 12 70)\">Ventas Y</text></svg>","chartLabel":"r ≈ 0,98: casi una recta","html":"n = 5, ΣX = 57, ΣY = 600, ΣXY = 7.185, ΣX² = 749, ΣY² = 73.250. Numerador 1.725, denominador ≈ 1.760,7.","titleHtml":"Publicidad y ventas: r ≈ 0,98."},{"type":"pregunta","k":"A ver…","title":"Un r = 0,98 entre publicidad y ventas significa…","options":["Que la publicidad causa el 98% de las ventas","Correlación positiva muy fuerte: se mueven casi en línea recta","Que no hay relación, porque r tiene que ser entero"],"correct":1,"feedback":"r = 0,98 es positiva y muy fuerte (cerca de +1). No autoriza a hablar de causa: r mide asociación, no causalidad.","titleHtml":"Un r = 0,98 entre publicidad y ventas significa…"},{"type":"concepto","k":"Advertencia 1","title":"Correlación no implica causalidad.","text":"Que dos cosas se muevan juntas no significa que una cause la otra. Puede haber una tercera variable moviendo a ambas, o pura coincidencia (correlaciones espurias).","ejemplo":"Ejemplo clásico del apunte: la venta de helados y los ahogamientos suben juntos; no es que el helado ahogue, es el calor que causa ambos. Quien decide si hay causalidad es el criterio del analista sobre el negocio, no la fórmula.","html":"Que dos cosas se muevan juntas no significa que una cause la otra. Puede haber una tercera variable moviendo a ambas, o pura coincidencia (correlaciones espurias).","titleHtml":"Correlación no implica causalidad."},{"type":"concepto","k":"Advertencia 2","title":"Un r bajo no es «sin relación».","text":"r mide solo relación lineal. Una relación en forma de U perfecta puede dar r ≈ 0 y ser, igual, una relación fortísima.","ejemplo":"Por eso: primero se grafica, después se calcula. Si te guiás solo por el número, te perdés las curvas. Es exactamente por lo que la cátedra insiste con el análisis de gráficos.","html":"r mide solo relación lineal. Una relación en forma de U perfecta puede dar r ≈ 0 y ser, igual, una relación fortísima.","titleHtml":"Un r bajo no es «sin relación»."},{"type":"pregunta","k":"A ver…","title":"Si el gráfico muestra una U clara pero r ≈ 0, ¿qué pasa?","options":["No hay ninguna relación entre las variables","Hay error de cálculo: r no puede dar 0","Hay relación, pero no es lineal: r no la captura"],"correct":2,"feedback":"r solo mide relación lineal. Una curva puede dar r ≈ 0 y ser una relación fortísima. Por eso se grafica primero.","titleHtml":"Si el gráfico muestra una U clara pero r ≈ 0, ¿qué pasa?"},{"type":"concepto","k":"El puente","title":"r² es el porcentaje que explica el modelo.","text":"r te dice si hay relación lineal y cuán fuerte. La regresión te da la ecuación para pronosticar. R² = r² es el % de la variación de Y que explica el modelo.","ejemplo":"En el ejemplo, r = 0,98 → R² = 0,96 → «la publicidad explica el 96% de la variación de las ventas». Esa frase es el tipo de interpretación que puntúa la cátedra.","html":"r te dice si hay relación lineal y cuán fuerte. La regresión te da la ecuación para pronosticar. R² = r² es el % de la variación de Y que explica el modelo.","titleHtml":"r² es el porcentaje que explica el modelo."},{"type":"cierre","title":"Llevate esto de la Clase 2.","text":"Siempre graficá primero. r dice si hay relación lineal, no si hay causa, y un r bajo no descarta una curva. r² es el % de variación que explica el modelo. El ejercicio de temperatura y bebidas queda para resolver juntos.","html":"Siempre graficá primero. r dice si hay relación lineal, no si hay causa, y un r bajo no descarta una curva. r² es el % de variación que explica el modelo. El ejercicio de temperatura y bebidas queda para resolver juntos.","titleHtml":"Llevate esto de la Clase 2."}],"titleHtml":"Clase 2 · Correlación","ledeHtml":"hasta ahora mirábamos UNA variable (ventas y su dispersión). La correlación mide si DOS variables se mueven juntas. Si encontrás una variable que acompaña a tus ventas, ganás dos cosas: entendés por qué varían y podés pronosticarlas. Es la antesala directa de la regresión."},"c3a":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c3a","title":"Clase 3.a · Series de tiempo","name":"Series de tiempo","lede":"toda serie de ventas es la superposición de cuatro componentes (tendencia, ciclo, estacionalidad, irregularidad). Aprender a mirar un gráfico y decir qué componentes tiene es lo que permite elegir y justificar el método de pronóstico — exactamente lo que evalúa la cátedra.","visto":true,"source":["clases_previas/SG/Clase03a_SeriesDeTiempo.md","clases_previas/SG/Clase03a_SeriesDeTiempo.svg","clases_previas/SG/ArbolDecisorio_MetodosPronostico.svg"],"laminas":["u2/img/Clase03a_SeriesDeTiempo.svg","u2/img/ArbolDecisorio_MetodosPronostico.svg"],"next":"Clase 3.b · Autocorrelación","teoria":[{"type":"paragraph","text":"**Sistemas de Gestión (UTN FRRo) · Unidad 2.b · Serie: 0 → 0.1 → 1 → 1.b → 2 → **3.a****","html":"<strong>Sistemas de Gestión (UTN FRRo) · Unidad 2.b · Serie: 0 → 0.1 → 1 → 1.b → 2 → </strong>3.a****"},{"type":"callout","kind":"idea","text":"**Idea central:** toda serie de ventas es la superposición de cuatro componentes (tendencia, ciclo, estacionalidad, irregularidad). Aprender a mirar un gráfico y decir qué componentes tiene es lo que permite **elegir y justificar el método de pronóstico** — exactamente lo que evalúa la cátedra.","html":"<strong>Idea central:</strong> toda serie de ventas es la superposición de cuatro componentes (tendencia, ciclo, estacionalidad, irregularidad). Aprender a mirar un gráfico y decir qué componentes tiene es lo que permite <strong>elegir y justificar el método de pronóstico</strong> — exactamente lo que evalúa la cátedra."},{"type":"heading","level":2,"text":"1. El cambio de mirada: dos tipos de datos","html":"1. El cambio de mirada: dos tipos de datos"},{"type":"table","headers":["Tipo","Qué es","¿Importa el orden?","Ejemplo"],"rows":[["---","---","---","---"],["**Corte transversal**","datos reunidos en **un solo momento** del tiempo","No","sueldo de 50 empleados hoy"],["**Serie de tiempo**","secuencia **ordenada** de observaciones de una variable a lo largo del tiempo","**Sí, el orden ES la información**","ventas de ene, feb, mar…"]],"headersHtml":["Tipo","Qué es","¿Importa el orden?","Ejemplo"],"rowsHtml":[["---","---","---","---"],["<strong>Corte transversal</strong>","datos reunidos en <strong>un solo momento</strong> del tiempo","No","sueldo de 50 empleados hoy"],["<strong>Serie de tiempo</strong>","secuencia <strong>ordenada</strong> de observaciones de una variable a lo largo del tiempo","<strong>Sí, el orden ES la información</strong>","ventas de ene, feb, mar…"]]},{"type":"paragraph","text":"En las clases 1 y 2 los datos eran de corte transversal: mezclarlos no cambiaba el promedio ni el desvío. **En una serie de tiempo, mezclar los períodos destruye la información.**","html":"En las clases 1 y 2 los datos eran de corte transversal: mezclarlos no cambiaba el promedio ni el desvío. <strong>En una serie de tiempo, mezclar los períodos destruye la información.</strong>"},{"type":"paragraph","text":"**Lógica de fondo del pronóstico:** si descubro el patrón que la serie tuvo en el pasado, puedo proyectarlo al futuro.","html":"<strong>Lógica de fondo del pronóstico:</strong> si descubro el patrón que la serie tuvo en el pasado, puedo proyectarlo al futuro."},{"type":"paragraph","text":"**Notación estándar:** **Yₜ** = valor de la serie en el período t · **Yₜ₋₁** = período anterior · **Ŷₜ** = pronóstico para ese período.","html":"<strong>Notación estándar:</strong> <strong>Yₜ</strong> = valor de la serie en el período t · <strong>Yₜ₋₁</strong> = período anterior · <strong>Ŷₜ</strong> = pronóstico para ese período."},{"type":"heading","level":2,"text":"2. La descomposición clásica: los 4 componentes","html":"2. La descomposición clásica: los 4 componentes"},{"type":"callout","kind":"idea","text":"Analogía: como escuchar una canción y distinguir la batería, el bajo y la voz. Suenan juntos, pero son fuentes separadas.","html":"Analogía: como escuchar una canción y distinguir la batería, el bajo y la voz. Suenan juntos, pero son fuentes separadas."},{"type":"heading","level":3,"text":"T · TENDENCIA","html":"T · TENDENCIA"},{"type":"paragraph","text":"Componente de **largo plazo**: crecimiento o disminución sostenida a lo largo de un período amplio.","html":"Componente de <strong>largo plazo</strong>: crecimiento o disminución sostenida a lo largo de un período amplio."},{"type":"list","ordered":false,"items":["*Causas:* crecimiento poblacional, cambio tecnológico, ganancia/pérdida de mercado, inflación.","*Ejemplo:* la empresa vendía 100 hace cinco años y hoy vende 300."],"itemsHtml":["<em>Causas:</em> crecimiento poblacional, cambio tecnológico, ganancia/pérdida de mercado, inflación.","<em>Ejemplo:</em> la empresa vendía 100 hace cinco años y hoy vende 300."]},{"type":"heading","level":3,"text":"C · CICLO","html":"C · CICLO"},{"type":"paragraph","text":"Fluctuación **en forma de onda alrededor de la tendencia**, de **varios años** (típicamente 2 a 10). Épocas de bonanza y recesión.","html":"Fluctuación <strong>en forma de onda alrededor de la tendencia</strong>, de <strong>varios años</strong> (típicamente 2 a 10). Épocas de bonanza y recesión."},{"type":"list","ordered":false,"items":["*Causas:* ciclo económico general, cambios en el gusto popular, ciclo de vida del producto.","*Por qué es el más difícil:* **no tiene período fijo** (una recesión puede durar 2 años o 6). Por eso es el componente que menos se puede modelar con confianza."],"itemsHtml":["<em>Causas:</em> ciclo económico general, cambios en el gusto popular, ciclo de vida del producto.","<em>Por qué es el más difícil:</em> <strong>no tiene período fijo</strong> (una recesión puede durar 2 años o 6). Por eso es el componente que menos se puede modelar con confianza."]},{"type":"heading","level":3,"text":"S · ESTACIONALIDAD","html":"S · ESTACIONALIDAD"},{"type":"paragraph","text":"Patrón que **se repite año tras año** con período **fijo y conocido**.","html":"Patrón que <strong>se repite año tras año</strong> con período <strong>fijo y conocido</strong>."},{"type":"list","ordered":false,"items":["*Causas:* clima y calendario (fiestas, vacaciones, cierres fiscales).","*Ejemplos:* helados en verano, paraguas en otoño, pico de ventas en diciembre.","**Longitud estacional L** (dato clave para las fórmulas): **L = 4** en datos trimestrales · **L = 12** en mensuales · **L = 7** en diarios. Esta L aparece en el método de Winter."],"itemsHtml":["<em>Causas:</em> clima y calendario (fiestas, vacaciones, cierres fiscales).","<em>Ejemplos:</em> helados en verano, paraguas en otoño, pico de ventas en diciembre.","<strong>Longitud estacional L</strong> (dato clave para las fórmulas): <strong>L = 4</strong> en datos trimestrales · <strong>L = 12</strong> en mensuales · <strong>L = 7</strong> en diarios. Esta L aparece en el método de Winter."]},{"type":"heading","level":3,"text":"I · IRREGULARIDAD (aleatoria o errática)","html":"I · IRREGULARIDAD (aleatoria o errática)"},{"type":"paragraph","text":"Lo que queda **después de sacar los otros tres**. El ruido.","html":"Lo que queda <strong>después de sacar los otros tres</strong>. El ruido."},{"type":"list","ordered":false,"items":["*Ejemplos:* una huelga, un incendio, un pedido excepcional, el azar puro.","*Característica:* **impredecible por definición**. El objetivo de un buen modelo es que lo único que quede sin explicar sea esto."],"itemsHtml":["<em>Ejemplos:</em> una huelga, un incendio, un pedido excepcional, el azar puro.","<em>Característica:</em> <strong>impredecible por definición</strong>. El objetivo de un buen modelo es que lo único que quede sin explicar sea esto."]},{"type":"heading","level":2,"text":"3. ⚠ Ciclo vs. Estacionalidad — la confusión clásica de examen","html":"3. ⚠ Ciclo vs. Estacionalidad — la confusión clásica de examen"},{"type":"table","headers":["","**Estacionalidad**","**Ciclo**"],"rows":[["---","---","---"],["Duración","**fija**, dentro del año","**variable**, varios años"],["¿Predecible?","sí, se sabe cuándo viene","no, difícil de anticipar"],["Causa","clima, calendario","economía, mercado"],["Ejemplo","picos cada diciembre","recesión 2018–2020"]],"headersHtml":["","<strong>Estacionalidad</strong>","<strong>Ciclo</strong>"],"rowsHtml":[["---","---","---"],["Duración","<strong>fija</strong>, dentro del año","<strong>variable</strong>, varios años"],["¿Predecible?","sí, se sabe cuándo viene","no, difícil de anticipar"],["Causa","clima, calendario","economía, mercado"],["Ejemplo","picos cada diciembre","recesión 2018–2020"]]},{"type":"callout","kind":"idea","text":"**Regla mnemotécnica:** si podés poner en el calendario cuándo va a pasar → **estacionalidad**. Si depende de la economía y nadie sabe cuándo → **ciclo**.","html":"<strong>Regla mnemotécnica:</strong> si podés poner en el calendario cuándo va a pasar → <strong>estacionalidad</strong>. Si depende de la economía y nadie sabe cuándo → <strong>ciclo</strong>."},{"type":"heading","level":2,"text":"4. Cómo se combinan: modelo aditivo vs. multiplicativo","html":"4. Cómo se combinan: modelo aditivo vs. multiplicativo"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 128\" width=\"100%\" height=\"128\" aria-hidden=\"true\"><polyline fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.8\" points=\"20.0,44.0 25.0,49.1 30.0,50.1 35.0,45.8 40.0,38.4 45.0,32.3 50.0,31.2 55.0,35.1 60.0,40.8 65.0,43.7 70.0,41.4 75.0,34.7 80.0,27.6 85.0,24.3 90.0,26.5 95.0,32.0 100.0,36.5 105.0,36.3 110.0,31.0 115.0,23.5 120.0,18.3 125.0,18.4 130.0,23.0 135.0,28.5 140.0,30.4\"/><text x=\"20\" y=\"14\" font-size=\"9\" fill=\"#1f4e79\" font-weight=\"700\">Aditivo: ondas del mismo tamaño</text><polyline fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.8\" points=\"20.0,100.0 25.0,105.7 30.0,107.6 35.0,103.0 40.0,93.6 45.0,85.1 50.0,83.1 55.0,89.4 60.0,99.7 65.0,106.2 70.0,103.2 75.0,91.3 80.0,77.4 85.0,70.8 90.0,76.1 95.0,90.0 100.0,102.6 105.0,104.2 110.0,92.2 115.0,73.5 120.0,60.2 125.0,61.4 130.0,76.6 135.0,95.3 140.0,104.0\"/><text x=\"20\" y=\"70\" font-size=\"9\" fill=\"#c45c26\" font-weight=\"700\">Multiplicativo: ondas que se agrandan</text></svg>","caption":"Arriba, modelo aditivo (ondas de amplitud constante). Abajo, multiplicativo (las ondas se agrandan con la tendencia). Esquema del criterio del apunte, no una serie real."},{"type":"heading","level":3,"text":"Aditivo","html":"Aditivo"},{"type":"formula","tex":"Y = T + C + S + I","html":"<span class=\"eq-block\">Y = T + C + S + I</span>"},{"type":"svg","file":"u2/img/Clase03a_SeriesDeTiempo.svg","caption":"Lámina de la Clase 3.a · Serie de tiempo y componentes","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 1010\" width=\"980\" height=\"1010\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n  </defs>\n  <rect width=\"980\" height=\"1010\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">CLASE 3.a · La serie de tiempo y sus 4 componentes</text>\n  <text x=\"620\" y=\"34\" font-size=\"12.5\" fill=\"#666\">U2.b — el diagnóstico de la serie</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">Serie de tiempo = secuencia ORDENADA de observaciones (Yₜ). El orden ES la información.</text>\n\n  <!-- ===== LOS 4 COMPONENTES ===== -->\n  <rect x=\"40\" y=\"72\" width=\"900\" height=\"238\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"95\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">Descomposición clásica: toda serie es la superposición de 4 componentes</text>\n  <text x=\"56\" y=\"113\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Como una canción: batería, bajo y voz suenan juntos, pero son fuentes separadas.</text>\n\n  <!-- T -->\n  <rect x=\"58\" y=\"124\" width=\"208\" height=\"170\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"72\" y=\"146\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">T · TENDENCIA</text>\n  <line x1=\"76\" y1=\"232\" x2=\"76\" y2=\"158\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"76\" y1=\"232\" x2=\"252\" y2=\"232\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"82,224 110,214 138,200 166,192 194,178 222,166 246,158\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2.5\"/>\n  <text x=\"72\" y=\"252\" font-size=\"10.5\" fill=\"#333\">Largo plazo: crecimiento o</text>\n  <text x=\"72\" y=\"266\" font-size=\"10.5\" fill=\"#333\">disminución sostenida.</text>\n  <text x=\"72\" y=\"284\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Población, tecnología, mercado</text>\n\n  <!-- C -->\n  <rect x=\"278\" y=\"124\" width=\"208\" height=\"170\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"292\" y=\"146\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · CICLO</text>\n  <line x1=\"296\" y1=\"232\" x2=\"296\" y2=\"158\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"296\" y1=\"232\" x2=\"472\" y2=\"232\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 302 200 C 330 165, 350 165, 372 200 C 396 235, 420 235, 444 190 C 452 175, 460 170, 466 168\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2.5\"/>\n  <text x=\"292\" y=\"252\" font-size=\"10.5\" fill=\"#333\">Ondas de VARIOS AÑOS</text>\n  <text x=\"292\" y=\"266\" font-size=\"10.5\" fill=\"#C00000\" font-weight=\"700\">sin período fijo (2 a 10 años)</text>\n  <text x=\"292\" y=\"284\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Economía, gusto popular, ciclo de vida</text>\n\n  <!-- S -->\n  <rect x=\"498\" y=\"124\" width=\"208\" height=\"170\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"512\" y=\"146\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">S · ESTACIONALIDAD</text>\n  <line x1=\"516\" y1=\"232\" x2=\"516\" y2=\"158\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"516\" y1=\"232\" x2=\"692\" y2=\"232\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 522 220 L 538 172 L 554 220 L 570 224 L 586 172 L 602 220 L 618 224 L 634 172 L 650 220 L 666 224 L 682 176\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2.2\"/>\n  <text x=\"512\" y=\"252\" font-size=\"10.5\" fill=\"#333\">Se repite AÑO TRAS AÑO</text>\n  <text x=\"512\" y=\"266\" font-size=\"10.5\" fill=\"#1E6B33\" font-weight=\"700\">período FIJO: L=4 trim · L=12 mens</text>\n  <text x=\"512\" y=\"284\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Clima y calendario</text>\n\n  <!-- I -->\n  <rect x=\"718\" y=\"124\" width=\"204\" height=\"170\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"732\" y=\"146\" font-size=\"13\" font-weight=\"700\" fill=\"#666\">I · IRREGULARIDAD</text>\n  <line x1=\"736\" y1=\"232\" x2=\"736\" y2=\"158\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"736\" y1=\"232\" x2=\"908\" y2=\"232\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"742,200 758,182 774,206 790,190 806,212 822,178 838,204 854,194 870,214 886,186 902,202\" fill=\"none\" stroke=\"#888\" stroke-width=\"2\"/>\n  <text x=\"732\" y=\"252\" font-size=\"10.5\" fill=\"#333\">El RUIDO que queda tras</text>\n  <text x=\"732\" y=\"266\" font-size=\"10.5\" fill=\"#333\">sacar los otros tres.</text>\n  <text x=\"732\" y=\"284\" font-size=\"10\" fill=\"#C00000\" font-weight=\"700\">Impredecible por definición</text>\n\n  <!-- ===== CICLO VS ESTACIONALIDAD ===== -->\n  <rect x=\"40\" y=\"322\" width=\"440\" height=\"176\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"345\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">⚠ La confusión clásica de examen</text>\n  <g font-size=\"11\">\n    <rect x=\"56\" y=\"356\" width=\"408\" height=\"20\" fill=\"#D9954A\"/>\n    <text x=\"66\" y=\"371\" fill=\"#fff\" font-weight=\"700\"> </text>\n    <text x=\"160\" y=\"371\" fill=\"#fff\" font-weight=\"700\">ESTACIONALIDAD</text>\n    <text x=\"330\" y=\"371\" fill=\"#fff\" font-weight=\"700\">CICLO</text>\n    <text x=\"66\" y=\"394\" fill=\"#333\" font-weight=\"700\">Duración</text><text x=\"160\" y=\"394\" fill=\"#333\">fija, dentro del año</text><text x=\"330\" y=\"394\" fill=\"#333\">variable, varios años</text>\n    <text x=\"66\" y=\"414\" fill=\"#333\" font-weight=\"700\">¿Predecible?</text><text x=\"160\" y=\"414\" fill=\"#333\">sí, se sabe cuándo</text><text x=\"330\" y=\"414\" fill=\"#333\">no</text>\n    <text x=\"66\" y=\"434\" fill=\"#333\" font-weight=\"700\">Causa</text><text x=\"160\" y=\"434\" fill=\"#333\">clima, calendario</text><text x=\"330\" y=\"434\" fill=\"#333\">economía, mercado</text>\n    <text x=\"66\" y=\"454\" fill=\"#333\" font-weight=\"700\">Ejemplo</text><text x=\"160\" y=\"454\" fill=\"#333\">picos cada diciembre</text><text x=\"330\" y=\"454\" fill=\"#333\">recesión 2018–2020</text>\n  </g>\n  <rect x=\"56\" y=\"464\" width=\"408\" height=\"24\" rx=\"4\" fill=\"#fff\" stroke=\"#D9954A\"/>\n  <text x=\"66\" y=\"481\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">Regla: si podés ponerlo en el CALENDARIO → estacionalidad. Si no → ciclo.</text>\n\n  <!-- ===== ADITIVO VS MULTIPLICATIVO ===== -->\n  <rect x=\"500\" y=\"322\" width=\"440\" height=\"176\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"345\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1E6B33\">¿Cómo se combinan? Mirá la amplitud de las ondas</text>\n\n  <text x=\"530\" y=\"368\" font-size=\"12\" font-weight=\"700\" fill=\"#1E6B33\">ADITIVO:  Y = T + C + S + I</text>\n  <line x1=\"530\" y1=\"424\" x2=\"530\" y2=\"378\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"530\" y1=\"424\" x2=\"700\" y2=\"424\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 536 412 L 552 388 L 568 412 L 584 414 L 600 390 L 616 414 L 632 416 L 648 392 L 664 416 L 680 418 L 694 394\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"712\" y=\"392\" font-size=\"10.5\" fill=\"#333\">ondas de amplitud</text>\n  <text x=\"712\" y=\"406\" font-size=\"10.5\" fill=\"#333\">CONSTANTE</text>\n  <text x=\"712\" y=\"422\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">“+200 u. cada dic.”</text>\n\n  <text x=\"530\" y=\"448\" font-size=\"12\" font-weight=\"700\" fill=\"#C00000\">MULTIPLICATIVO:  Y = T × C × S × I</text>\n  <line x1=\"530\" y1=\"492\" x2=\"530\" y2=\"456\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"530\" y1=\"492\" x2=\"700\" y2=\"492\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 536 484 L 550 472 L 564 484 L 580 482 L 596 464 L 612 482 L 628 478 L 644 456 L 660 478 L 676 474 L 694 458\" fill=\"none\" stroke=\"#C00000\" stroke-width=\"2\"/>\n  <text x=\"712\" y=\"466\" font-size=\"10.5\" fill=\"#333\">ondas que se AGRANDAN</text>\n  <text x=\"712\" y=\"480\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">“+40% cada dic.”</text>\n  <text x=\"712\" y=\"494\" font-size=\"10\" fill=\"#C00000\" font-weight=\"700\">el más común en industria</text>\n\n  <!-- ===== ESTACIONARIA + ARBOL ===== -->\n  <rect x=\"40\" y=\"510\" width=\"900\" height=\"266\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"534\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">SERIE ESTACIONARIA — la primera pregunta del diagnóstico</text>\n  <text x=\"56\" y=\"554\" font-size=\"11.5\" fill=\"#333\">Definición: su <tspan font-weight=\"700\">valor promedio NO cambia a través del tiempo</tspan>. Fluctúa, pero alrededor de un nivel constante.</text>\n\n  <!-- mini graficos estacionaria vs no -->\n  <rect x=\"56\" y=\"566\" width=\"180\" height=\"88\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"66\" y1=\"640\" x2=\"66\" y2=\"578\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"66\" y1=\"640\" x2=\"226\" y2=\"640\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"66\" y1=\"608\" x2=\"226\" y2=\"608\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <polyline points=\"72,614 92,598 112,616 132,600 152,618 172,602 192,612 212,604\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"146\" y=\"586\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\" text-anchor=\"middle\">ESTACIONARIA ✔</text>\n\n  <rect x=\"248\" y=\"566\" width=\"180\" height=\"88\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"258\" y1=\"640\" x2=\"258\" y2=\"578\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"258\" y1=\"640\" x2=\"418\" y2=\"640\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"264,630 284,620 304,614 324,600 344,596 364,586 384,580 404,586\" fill=\"none\" stroke=\"#C00000\" stroke-width=\"2\"/>\n  <text x=\"338\" y=\"586\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\" text-anchor=\"middle\">NO estacionaria (tendencia)</text>\n\n  <!-- arbol -->\n  <text x=\"450\" y=\"584\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">★ ÁRBOL DE DECISIÓN — “justifique la metodología aplicada”</text>\n  <g font-size=\"11\">\n    <rect x=\"450\" y=\"592\" width=\"474\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"462\" y=\"607\" fill=\"#fff\" font-weight=\"700\">Si la serie…</text>\n    <text x=\"606\" y=\"607\" fill=\"#fff\" font-weight=\"700\">Métodos aplicables</text>\n\n    <rect x=\"450\" y=\"612\" width=\"474\" height=\"20\" fill=\"#fff\"/>\n    <text x=\"462\" y=\"627\" fill=\"#1E6B33\" font-weight=\"700\">es ESTACIONARIA</text>\n    <text x=\"606\" y=\"627\" fill=\"#333\">promedio simple/móvil, suavizado exp. simple</text>\n\n    <rect x=\"450\" y=\"632\" width=\"474\" height=\"20\" fill=\"#F2F6FA\"/>\n    <text x=\"462\" y=\"647\" fill=\"#1F4E79\" font-weight=\"700\">tiene TENDENCIA</text>\n    <text x=\"606\" y=\"647\" fill=\"#333\">prom. móvil doble, Brown, HOLT, regresión</text>\n\n    <rect x=\"450\" y=\"652\" width=\"474\" height=\"20\" fill=\"#fff\"/>\n    <text x=\"462\" y=\"667\" fill=\"#8A5A16\" font-weight=\"700\">tiene ESTACIONALIDAD</text>\n    <text x=\"606\" y=\"667\" fill=\"#333\">WINTER, descomposición clásica, Census II</text>\n\n    <rect x=\"450\" y=\"672\" width=\"474\" height=\"20\" fill=\"#F2F6FA\"/>\n    <text x=\"462\" y=\"687\" fill=\"#B5651D\" font-weight=\"700\">tiene CICLO</text>\n    <text x=\"606\" y=\"687\" fill=\"#333\">descomposición, indicadores económicos, reg. múltiple</text>\n  </g>\n\n  <rect x=\"56\" y=\"668\" width=\"372\" height=\"94\" rx=\"6\" fill=\"#fff\" stroke=\"#1F4E79\"/>\n  <text x=\"70\" y=\"690\" font-size=\"12\" font-weight=\"700\" fill=\"#1F4E79\">¿No es estacionaria? → DIFERENCIACIÓN</text>\n  <text x=\"70\" y=\"710\" font-size=\"11\" fill=\"#333\">Trabajar con las diferencias entre períodos:</text>\n  <text x=\"70\" y=\"730\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\">Yₜ − Yₜ₋₁</text>\n  <text x=\"70\" y=\"750\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Si crece de a 10 por mes → todas las diferencias = 10</text>\n  <text x=\"70\" y=\"762\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">→ serie plana → estacionaria. Se le sacó la tendencia.</text>\n\n  <text x=\"450\" y=\"710\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C00000\">⚠ Este cuadro ES la respuesta a la consigna</text>\n  <text x=\"450\" y=\"728\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C00000\">“elabore el MPS justificando la metodología”</text>\n  <text x=\"450\" y=\"750\" font-size=\"11\" fill=\"#333\">y a toda pregunta de “¿qué método usaría y por qué?”</text>\n  <text x=\"450\" y=\"766\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Memorizarlo: es de las cosas más rentables de la unidad.</text>\n\n  <!-- ===== EJEMPLO INTEGRADOR ===== -->\n  <line x1=\"490\" y1=\"780\" x2=\"490\" y2=\"796\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <rect x=\"40\" y=\"800\" width=\"900\" height=\"122\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">Ejemplo integrador — aires acondicionados (ventas trimestrales)</text>\n  <text x=\"56\" y=\"843\" font-size=\"11\" fill=\"#333\">· Cada año vende más que el anterior → <tspan font-weight=\"700\">TENDENCIA</tspan>     · Verano se dispara, invierno se hunde, siempre igual → <tspan font-weight=\"700\">ESTACIONALIDAD (L=4)</tspan></text>\n  <text x=\"56\" y=\"861\" font-size=\"11\" fill=\"#333\">· En 2020 cayó todo por la recesión y se recuperó → <tspan font-weight=\"700\">CICLO</tspan>     · Un mes, pedido raro de un hotel → <tspan font-weight=\"700\">IRREGULARIDAD</tspan></text>\n  <text x=\"56\" y=\"879\" font-size=\"11\" fill=\"#333\">· Los picos de verano son cada vez más grandes en unidades → modelo <tspan font-weight=\"700\">MULTIPLICATIVO</tspan>     · ¿Estacionaria? <tspan font-weight=\"700\">No</tspan>, el promedio sube</text>\n  <text x=\"56\" y=\"901\" font-size=\"12\" font-weight=\"700\" fill=\"#C00000\">⇒ Método: WINTER o DESCOMPOSICIÓN (porque tiene tendencia Y estacionalidad)</text>\n\n  <!-- PIE EJERCICIO -->\n  <rect x=\"40\" y=\"932\" width=\"900\" height=\"64\" rx=\"6\" fill=\"#FAFAFA\" stroke=\"#CCC\"/>\n  <text x=\"56\" y=\"952\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">EJERCICIO — diagnosticar 4 series (componentes / ¿estacionaria? / aditivo o multiplicativo / familia de métodos):</text>\n  <text x=\"56\" y=\"970\" font-size=\"10.8\" fill=\"#555\">a) panadería estable 900–1.100 kg hace 10 años   b) heladería trimestral 2022–24: 800/200/150/700 · 950/240/180/830 · 1100/280/210/980</text>\n  <text x=\"56\" y=\"987\" font-size=\"10.8\" fill=\"#555\">c) app: 1.000, 1.250, 1.480, 1.760, 2.010, 2.290   d) constructora: sube hasta 2018, cae 2019–21, se recupera desde 2022</text>\n</svg>"},{"type":"svg","file":"u2/img/ArbolDecisorio_MetodosPronostico.svg","caption":"Árbol decisorio de métodos de pronóstico","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 1360\" width=\"1000\" height=\"1360\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"a1\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"a2\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#888\"/></marker>\n  </defs>\n  <rect width=\"1000\" height=\"1360\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">ÁRBOL DECISORIO · ¿Qué método de pronóstico uso?</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina complementaria Clase 3.a — U2 · La respuesta a “justifique la metodología aplicada”</text>\n\n  <rect x=\"40\" y=\"68\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">REGLA MADRE: graficar la serie SIEMPRE antes de decidir. Con pocos datos, graficar es obligatorio. El gráfico manda sobre cualquier fórmula.</text>\n\n  <!-- ===== NIVEL 0 ===== -->\n  <rect x=\"380\" y=\"116\" width=\"240\" height=\"42\" rx=\"21\" fill=\"#1F4E79\"/>\n  <text x=\"500\" y=\"142\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Necesito pronosticar</text>\n\n  <line x1=\"500\" y1=\"158\" x2=\"500\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"770\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"230\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"770\" y1=\"176\" x2=\"770\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- PREGUNTA 1 -->\n  <text x=\"500\" y=\"170\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\" text-anchor=\"middle\">① ¿Tengo datos históricos suficientes y representativos?</text>\n\n  <!-- RAMA NO: CUALITATIVOS -->\n  <rect x=\"700\" y=\"200\" width=\"260\" height=\"152\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"716\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">NO → MÉTODOS CUALITATIVOS</text>\n  <text x=\"716\" y=\"240\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Se basan en juicio e intuición, no en datos</text>\n  <text x=\"716\" y=\"260\" font-size=\"10.8\" fill=\"#333\">· Delphi (panel de expertos anónimo)</text>\n  <text x=\"716\" y=\"276\" font-size=\"10.8\" fill=\"#333\">· Investigación de mercado / encuestas</text>\n  <text x=\"716\" y=\"292\" font-size=\"10.8\" fill=\"#333\">· Analogía histórica (producto similar)</text>\n  <text x=\"716\" y=\"308\" font-size=\"10.8\" fill=\"#333\">· Consenso de comité / fuerza de ventas</text>\n  <text x=\"716\" y=\"330\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Cuándo: producto nuevo, sin historia,</text>\n  <text x=\"716\" y=\"345\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">o largo plazo (&gt; 2 años)</text>\n\n  <!-- RAMA SI: CUANTITATIVOS -->\n  <rect x=\"60\" y=\"200\" width=\"580\" height=\"60\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SÍ → MÉTODOS CUANTITATIVOS</text>\n  <text x=\"76\" y=\"242\" font-size=\"11\" fill=\"#333\">② ¿Explico la serie con SU PROPIO pasado, o con OTRAS variables?</text>\n  <text x=\"76\" y=\"256\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">(en la práctica se combinan: lo cuantitativo se ajusta con juicio experto)</text>\n\n  <line x1=\"200\" y1=\"260\" x2=\"200\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"500\" y1=\"260\" x2=\"500\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- CAUSALES -->\n  <rect x=\"360\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"376\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#9C3838\">CAUSALES / EXPLICATIVOS</text>\n  <text x=\"376\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Las ventas dependen de X” (precio,</text>\n  <text x=\"376\" y=\"343\" font-size=\"10.8\" fill=\"#333\">publicidad, PBI, temperatura…)</text>\n  <text x=\"376\" y=\"363\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión simple (1 variable X)</text>\n  <text x=\"376\" y=\"379\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión múltiple (varias X)</text>\n  <text x=\"376\" y=\"396\" font-size=\"10.5\" fill=\"#666\">· Modelos econométricos · indicadores</text>\n\n  <!-- SERIES DE TIEMPO -->\n  <rect x=\"60\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SERIES DE TIEMPO</text>\n  <text x=\"76\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Proyecto el patrón que la serie</text>\n  <text x=\"76\" y=\"343\" font-size=\"10.8\" fill=\"#333\">viene mostrando en el tiempo”</text>\n  <text x=\"76\" y=\"366\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">③ ¿QUÉ PATRÓN tiene la serie?</text>\n  <text x=\"76\" y=\"384\" font-size=\"10.5\" fill=\"#666\">→ mirar el gráfico y el correlograma</text>\n  <text x=\"76\" y=\"399\" font-size=\"10.5\" fill=\"#666\">→ bajar a los 4 casos de abajo ↓</text>\n\n  <line x1=\"200\" y1=\"408\" x2=\"200\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"880\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"120\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"373\" y1=\"430\" x2=\"373\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"627\" y1=\"430\" x2=\"627\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"880\" y1=\"430\" x2=\"880\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- ===== CASO A: ESTACIONARIA ===== -->\n  <rect x=\"40\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"54\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">A · ESTACIONARIA</text>\n  <text x=\"54\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">promedio constante, sin rumbo</text>\n  <line x1=\"58\" y1=\"536\" x2=\"58\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"536\" x2=\"248\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"520\" x2=\"248\" y2=\"520\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <polyline points=\"64,526 88,512 112,528 136,514 160,530 184,512 208,524 236,516\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n\n  <text x=\"54\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">MÉTODOS:</text>\n  <text x=\"54\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Promedio simple (todo el historial)</text>\n  <text x=\"54\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil de orden n</text>\n  <text x=\"54\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Suavizado exponencial simple (SES)</tspan></text>\n  <text x=\"54\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Métodos ingenuos: Ŷₜ₊₁ = Yₜ</text>\n  <text x=\"54\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins (ARIMA)</text>\n\n  <rect x=\"52\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <text x=\"62\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\">Elegir n / α:</text>\n  <text x=\"62\" y=\"683\" font-size=\"9.8\" fill=\"#333\">n grande o α chico → más suave</text>\n  <text x=\"62\" y=\"697\" font-size=\"9.8\" fill=\"#333\">n chico o α grande → más reactivo</text>\n\n  <text x=\"54\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"54\" y=\"744\" font-size=\"10\" fill=\"#333\">· Panadería de barrio estable</text>\n  <text x=\"54\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto maduro sin cambios</text>\n  <text x=\"54\" y=\"772\" font-size=\"10\" fill=\"#333\">· Repuestos de demanda pareja</text>\n\n  <!-- ===== CASO B: TENDENCIA ===== -->\n  <rect x=\"274\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">B · TENDENCIA</text>\n  <text x=\"288\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">sube o baja sostenidamente</text>\n  <line x1=\"292\" y1=\"536\" x2=\"292\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"292\" y1=\"536\" x2=\"482\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"298,530 326,522 354,514 382,506 410,514 438,500 466,492\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n\n  <text x=\"288\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODOS:</text>\n  <text x=\"288\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Holt</tspan> (suav. exp. 2 parámetros α, β)</text>\n  <text x=\"288\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Brown (suav. exp. doble, 1 parám.)</text>\n  <text x=\"288\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil doble</text>\n  <text x=\"288\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión simple contra el tiempo</text>\n  <text x=\"288\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Gompertz, curvas de crecimiento</text>\n\n  <rect x=\"286\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"296\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1F4E79\">Holt vs. Brown:</text>\n  <text x=\"296\" y=\"683\" font-size=\"9.8\" fill=\"#333\">Brown usa un solo α → tendencia</text>\n  <text x=\"296\" y=\"697\" font-size=\"9.8\" fill=\"#333\">sensible al ruido. Holt separa β → mejor.</text>\n\n  <text x=\"288\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"288\" y=\"744\" font-size=\"10\" fill=\"#333\">· Suscripciones de una app en alza</text>\n  <text x=\"288\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto en etapa de crecimiento</text>\n  <text x=\"288\" y=\"772\" font-size=\"10\" fill=\"#333\">· Serie inflacionada año a año</text>\n\n  <!-- ===== CASO C: ESTACIONALIDAD ===== -->\n  <rect x=\"508\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#8A5A16\" stroke-width=\"2\"/>\n  <text x=\"522\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · ESTACIONALIDAD</text>\n  <text x=\"522\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">patrón fijo que se repite cada año</text>\n  <line x1=\"526\" y1=\"536\" x2=\"526\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"526\" y1=\"536\" x2=\"716\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 532 528 L 548 508 L 564 528 L 580 530 L 596 508 L 612 528 L 628 530 L 644 506 L 660 528 L 676 530 L 700 508\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2\"/>\n\n  <text x=\"522\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">MÉTODOS:</text>\n  <text x=\"522\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Winter</tspan> (suav. exp. 3 parám. α, β, γ)</text>\n  <text x=\"522\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Descomposición clásica</tspan> (multiplicativa)</text>\n  <text x=\"522\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Desestacionalizar → pronosticar →</text>\n  <text x=\"532\" y=\"622\" font-size=\"10.8\" fill=\"#333\">re-estacionalizar</text>\n  <text x=\"522\" y=\"638\" font-size=\"10.5\" fill=\"#666\">· Regresión múltiple con dummies · Census II</text>\n\n  <rect x=\"520\" y=\"648\" width=\"198\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"530\" y=\"666\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">Ojo con L y la cantidad de datos:</text>\n  <text x=\"530\" y=\"681\" font-size=\"9.8\" fill=\"#333\">L=4 (trim.) · L=12 (mens.) · L=7 (diario)</text>\n  <text x=\"530\" y=\"695\" font-size=\"9.8\" fill=\"#333\">Winter necesita ≥ 2 ciclos completos</text>\n\n  <text x=\"522\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"522\" y=\"744\" font-size=\"10\" fill=\"#333\">· Heladería / aires acondicionados</text>\n  <text x=\"522\" y=\"758\" font-size=\"10\" fill=\"#333\">· Ventas de diciembre, útiles escolares</text>\n  <text x=\"522\" y=\"772\" font-size=\"10\" fill=\"#333\">· Consumo eléctrico</text>\n\n  <!-- ===== CASO D: CICLO ===== -->\n  <rect x=\"742\" y=\"456\" width=\"218\" height=\"330\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"756\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">D · CICLO</text>\n  <text x=\"756\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">ondas plurianuales, período variable</text>\n  <line x1=\"760\" y1=\"536\" x2=\"760\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"760\" y1=\"536\" x2=\"946\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 766 518 C 792 496, 812 496, 834 522 C 858 548, 882 546, 906 512 C 916 498, 926 494, 936 492\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n\n  <text x=\"756\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#5B3E8E\">MÉTODOS:</text>\n  <text x=\"756\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Descomposición clásica</text>\n  <text x=\"756\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Indicadores económicos (líderes)</text>\n  <text x=\"756\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Modelos econométricos</text>\n  <text x=\"756\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión múltiple</text>\n  <text x=\"756\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins</text>\n\n  <rect x=\"754\" y=\"650\" width=\"196\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"764\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">⚠ El más difícil de todos:</text>\n  <text x=\"764\" y=\"683\" font-size=\"9.8\" fill=\"#333\">no tiene período fijo → los métodos</text>\n  <text x=\"764\" y=\"697\" font-size=\"9.8\" fill=\"#333\">de suavizado NO capturan giros bruscos</text>\n\n  <text x=\"756\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"756\" y=\"744\" font-size=\"10\" fill=\"#333\">· Construcción, acero, automotriz</text>\n  <text x=\"756\" y=\"758\" font-size=\"10\" fill=\"#333\">· Bienes durables y de capital</text>\n  <text x=\"756\" y=\"772\" font-size=\"10\" fill=\"#333\">· Cualquier serie ligada al PBI</text>\n\n  <!-- ===== CASO COMBINADO ===== -->\n  <rect x=\"40\" y=\"800\" width=\"920\" height=\"96\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">★ EL CASO MÁS FRECUENTE EN EXAMEN: TENDENCIA **+** ESTACIONALIDAD (los patrones se combinan)</text>\n  <text x=\"56\" y=\"844\" font-size=\"11.5\" fill=\"#333\">Si la serie sube año a año Y además repite picos estacionales → <tspan font-weight=\"700\" fill=\"#C00000\">WINTER</tspan> (captura ambos) o <tspan font-weight=\"700\" fill=\"#C00000\">DESCOMPOSICIÓN</tspan> (los separa y proyecta por partes).</text>\n  <text x=\"56\" y=\"864\" font-size=\"11.5\" fill=\"#333\">Alternativa válida y muy defendible: <tspan font-weight=\"700\">desestacionalizar</tspan> la serie → aplicar Holt a la serie sin estacionalidad → <tspan font-weight=\"700\">re-estacionalizar</tspan> el pronóstico.</text>\n  <text x=\"56\" y=\"884\" font-size=\"11\" fill=\"#8A5A16\" font-style=\"italic\">Nunca usar suavizado simple ni promedio móvil acá: van siempre “atrás” de la serie y subestiman sistemáticamente (sesgo visible en el PME).</text>\n\n  <!-- ===== FACTORES ADICIONALES ===== -->\n  <rect x=\"40\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">④ Otros factores que inclinan la elección</text>\n\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">HORIZONTE:</text>\n  <text x=\"66\" y=\"970\" font-size=\"10.5\" fill=\"#333\">· Corto plazo (días–meses) → suavizados, promedios</text>\n  <text x=\"66\" y=\"985\" font-size=\"10.5\" fill=\"#333\">· Mediano (meses–2 años) → regresión, descomposición</text>\n  <text x=\"66\" y=\"1000\" font-size=\"10.5\" fill=\"#333\">· Largo plazo (&gt;2 años) → cualitativos, econométricos</text>\n\n  <text x=\"56\" y=\"1022\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">CANTIDAD DE DATOS:</text>\n  <text x=\"66\" y=\"1038\" font-size=\"10.5\" fill=\"#333\">· Muy pocos → ingenuos o promedio simple (y graficar!)</text>\n  <text x=\"66\" y=\"1053\" font-size=\"10.5\" fill=\"#333\">· Winter/descomposición exigen ≥2 ciclos completos</text>\n\n  <text x=\"56\" y=\"1075\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">OTROS CRITERIOS (Hanke):</text>\n  <text x=\"66\" y=\"1091\" font-size=\"10.5\" fill=\"#333\">· Costo del método vs. beneficio del pronóstico</text>\n  <text x=\"66\" y=\"1106\" font-size=\"10.5\" fill=\"#333\">· Facilidad de comprensión para quien decide</text>\n  <text x=\"66\" y=\"1121\" font-size=\"10.5\" fill=\"#333\">· Precisión requerida y confiabilidad</text>\n\n  <!-- ===== VALIDACION ===== -->\n  <rect x=\"510\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"526\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">⑤ Elegido el método… ¡hay que VALIDARLO!</text>\n  <text x=\"526\" y=\"952\" font-size=\"11\" fill=\"#333\">El árbol propone candidatos; la <tspan font-weight=\"700\">medida de error decide</tspan>.</text>\n\n  <text x=\"526\" y=\"976\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">Procedimiento (Hanke cap. 5):</text>\n  <text x=\"536\" y=\"992\" font-size=\"10.5\" fill=\"#333\">① Partir los datos: inicialización + prueba</text>\n  <text x=\"536\" y=\"1007\" font-size=\"10.5\" fill=\"#333\">② Ajustar el método con la parte de inicialización</text>\n  <text x=\"536\" y=\"1022\" font-size=\"10.5\" fill=\"#333\">③ Pronosticar la parte de prueba y medir el error</text>\n  <text x=\"536\" y=\"1037\" font-size=\"10.5\" fill=\"#333\">④ Comparar contra un método alternativo</text>\n  <text x=\"536\" y=\"1052\" font-size=\"10.5\" fill=\"#333\">⑤ Decidir: usarlo, ajustarlo o cambiarlo</text>\n\n  <rect x=\"526\" y=\"1062\" width=\"418\" height=\"56\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"536\" y=\"1080\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">Qué mirar en los errores:</text>\n  <text x=\"536\" y=\"1095\" font-size=\"10\" fill=\"#333\">MAD/MSE/MAPE bajos = buen ajuste · <tspan font-weight=\"700\">PME ≈ 0 = sin sesgo</tspan></text>\n  <text x=\"536\" y=\"1110\" font-size=\"10\" fill=\"#333\">Si el PME es grande y del mismo signo → el método pierde un patrón</text>\n\n  <!-- ===== EJEMPLOS RESUELTOS ===== -->\n  <rect x=\"40\" y=\"1142\" width=\"920\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"1164\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">DIAGNÓSTICOS RESUELTOS — así se redacta la justificación en el examen</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"1174\" width=\"888\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"66\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Serie</text>\n    <text x=\"330\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Diagnóstico</text>\n    <text x=\"600\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Método y justificación</text>\n\n    <rect x=\"56\" y=\"1194\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1210\" fill=\"#333\">Ventas parejas 900–1.100 kg hace 10 años</text>\n    <text x=\"330\" y=\"1210\" fill=\"#333\">estacionaria, solo irregularidad</text>\n    <text x=\"600\" y=\"1210\" fill=\"#1E6B33\" font-weight=\"700\">SES o promedio móvil: no hay patrón que proyectar</text>\n\n    <rect x=\"56\" y=\"1218\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1234\" fill=\"#333\">App: 1.000 → 2.290 creciendo parejo</text>\n    <text x=\"330\" y=\"1234\" fill=\"#333\">tendencia lineal, sin estacionalidad</text>\n    <text x=\"600\" y=\"1234\" fill=\"#1F4E79\" font-weight=\"700\">Holt o regresión vs. tiempo: capturan la pendiente</text>\n\n    <rect x=\"56\" y=\"1242\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1258\" fill=\"#333\">Heladería trimestral, picos en T1 y T4, subiendo</text>\n    <text x=\"330\" y=\"1258\" fill=\"#333\">tendencia + estacionalidad (L=4)</text>\n    <text x=\"600\" y=\"1258\" fill=\"#C00000\" font-weight=\"700\">WINTER o descomposición multiplicativa</text>\n\n    <rect x=\"56\" y=\"1266\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1282\" fill=\"#333\">Constructora: sube, se derrumba 3 años, se recupera</text>\n    <text x=\"330\" y=\"1282\" fill=\"#333\">ciclo dominante (+ tendencia)</text>\n    <text x=\"600\" y=\"1282\" fill=\"#5B3E8E\" font-weight=\"700\">Descomposición o indicadores económicos; no suavizado</text>\n\n    <rect x=\"56\" y=\"1290\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1306\" fill=\"#333\">Producto nuevo, sin historia</text>\n    <text x=\"330\" y=\"1306\" fill=\"#333\">sin datos utilizables</text>\n    <text x=\"600\" y=\"1306\" fill=\"#5B3E8E\" font-weight=\"700\">Cualitativo: Delphi, analogía histórica, investigación</text>\n\n    <rect x=\"56\" y=\"1314\" width=\"888\" height=\"22\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1329\" fill=\"#333\">Ventas explicadas por publicidad y precio</text>\n    <text x=\"330\" y=\"1329\" fill=\"#333\">relación causal con otras variables</text>\n    <text x=\"600\" y=\"1329\" fill=\"#9C3838\" font-weight=\"700\">Regresión múltiple (revisar colinealidad y residuos)</text>\n  </g>\n</svg>"},{"type":"list","ordered":false,"items":["Los componentes **se suman**.","La estacionalidad es una cantidad **fija en unidades**: *\"en diciembre siempre vendo 200 unidades más\"*.","**En el gráfico:** ondas de **amplitud constante**, parejas a lo largo del tiempo."],"itemsHtml":["Los componentes <strong>se suman</strong>.","La estacionalidad es una cantidad <strong>fija en unidades</strong>: <em>\"en diciembre siempre vendo 200 unidades más\"</em>.","<strong>En el gráfico:</strong> ondas de <strong>amplitud constante</strong>, parejas a lo largo del tiempo."]},{"type":"heading","level":3,"text":"Multiplicativo","html":"Multiplicativo"},{"type":"formula","tex":"Y = T \\times C \\times S \\times I","html":"<span class=\"eq-block\">Y = T × C × S × I</span>"},{"type":"list","ordered":false,"items":["Los componentes **se multiplican**.","La estacionalidad es un **porcentaje**: *\"en diciembre siempre vendo un 40% más\"*.","**En el gráfico:** ondas que **se agrandan** a medida que crece la tendencia (forma de embudo abierto)."],"itemsHtml":["Los componentes <strong>se multiplican</strong>.","La estacionalidad es un <strong>porcentaje</strong>: <em>\"en diciembre siempre vendo un 40% más\"</em>.","<strong>En el gráfico:</strong> ondas que <strong>se agrandan</strong> a medida que crece la tendencia (forma de embudo abierto)."]},{"type":"heading","level":3,"text":"Cómo decidir","html":"Cómo decidir"},{"type":"paragraph","text":"Mirando el gráfico: ¿las ondas mantienen el mismo tamaño con los años? → **aditivo**. ¿Se agrandan junto con el nivel de la serie? → **multiplicativo**.","html":"Mirando el gráfico: ¿las ondas mantienen el mismo tamaño con los años? → <strong>aditivo</strong>. ¿Se agrandan junto con el nivel de la serie? → <strong>multiplicativo</strong>."},{"type":"callout","kind":"idea","text":"En la práctica industrial el **multiplicativo** es el más común, y es el que menciona explícitamente el programa de la cátedra (\"modelos de descomposición multiplicativo\").","html":"En la práctica industrial el <strong>multiplicativo</strong> es el más común, y es el que menciona explícitamente el programa de la cátedra (\"modelos de descomposición multiplicativo\")."},{"type":"heading","level":2,"text":"5. Serie estacionaria: el concepto que ordena todo","html":"5. Serie estacionaria: el concepto que ordena todo"},{"type":"callout","kind":"idea","text":"**Una serie es estacionaria cuando su valor promedio no cambia a través del tiempo.** Fluctúa, pero alrededor de un nivel constante — sin irse para arriba ni para abajo.","html":"<strong>Una serie es estacionaria cuando su valor promedio no cambia a través del tiempo.</strong> Fluctúa, pero alrededor de un nivel constante — sin irse para arriba ni para abajo."},{"type":"paragraph","text":"**Por qué importa:** cada familia de métodos sirve para un tipo de serie. \"¿Es estacionaria?\" es la **primera bifurcación** del árbol de decisión.","html":"<strong>Por qué importa:</strong> cada familia de métodos sirve para un tipo de serie. \"¿Es estacionaria?\" es la <strong>primera bifurcación</strong> del árbol de decisión."},{"type":"heading","level":3,"text":"Árbol de decisión de métodos ★","html":"Árbol de decisión de métodos ★"},{"type":"table","headers":["Si la serie…","Métodos aplicables"],"rows":[["---","---"],["**Es estacionaria**","promedio simple, promedio móvil, suavizado exponencial simple, Box-Jenkins"],["**Tiene tendencia**","promedio móvil doble, Brown, **Holt**, regresión simple, modelos exponenciales"],["**Tiene estacionalidad**","**Winter**, descomposición clásica, regresión múltiple de series de tiempo, Census II"],["**Tiene ciclo**","descomposición clásica, indicadores económicos, modelos econométricos, regresión múltiple"]],"headersHtml":["Si la serie…","Métodos aplicables"],"rowsHtml":[["---","---"],["<strong>Es estacionaria</strong>","promedio simple, promedio móvil, suavizado exponencial simple, Box-Jenkins"],["<strong>Tiene tendencia</strong>","promedio móvil doble, Brown, <strong>Holt</strong>, regresión simple, modelos exponenciales"],["<strong>Tiene estacionalidad</strong>","<strong>Winter</strong>, descomposición clásica, regresión múltiple de series de tiempo, Census II"],["<strong>Tiene ciclo</strong>","descomposición clásica, indicadores económicos, modelos econométricos, regresión múltiple"]]},{"type":"callout","kind":"examen","text":"**Este cuadro ES la respuesta a \"justifique la metodología aplicada\" del examen.**","html":"<strong>Este cuadro ES la respuesta a \"justifique la metodología aplicada\" del examen.</strong>"},{"type":"heading","level":3,"text":"Si no es estacionaria: diferenciación","html":"Si no es estacionaria: diferenciación"},{"type":"paragraph","text":"Consiste en trabajar con las **diferencias entre períodos consecutivos** (Yₜ − Yₜ₋₁) en lugar de los valores originales.\n*Ejemplo:* si una serie crece de a 10 por mes, sus diferencias son todas 10 → serie plana → **estacionaria**. Se le sacó la tendencia.","html":"Consiste en trabajar con las <strong>diferencias entre períodos consecutivos</strong> (Yₜ − Yₜ₋₁) en lugar de los valores originales.\n<em>Ejemplo:</em> si una serie crece de a 10 por mes, sus diferencias son todas 10 → serie plana → <strong>estacionaria</strong>. Se le sacó la tendencia."},{"type":"heading","level":2,"text":"6. Ejemplo integrador: aires acondicionados (ventas trimestrales)","html":"6. Ejemplo integrador: aires acondicionados (ventas trimestrales)"},{"type":"table","headers":["Observación","Diagnóstico"],"rows":[["---","---"],["Cada año vende más que el anterior","**Tendencia** creciente"],["Cada verano se dispara, cada invierno se hunde, siempre igual","**Estacionalidad**, L = 4"],["En 2020 todo cayó por la recesión y luego se recuperó","**Ciclo**"],["Un mes hubo un pedido raro de un hotel","**Irregularidad**"],["Los picos de verano son cada vez más grandes en unidades","Modelo **multiplicativo**"],["¿Es estacionaria?","**No**: el promedio sube con los años"],["**¿Qué método?**","**Winter o descomposición** (tiene tendencia Y estacionalidad)"]],"headersHtml":["Observación","Diagnóstico"],"rowsHtml":[["---","---"],["Cada año vende más que el anterior","<strong>Tendencia</strong> creciente"],["Cada verano se dispara, cada invierno se hunde, siempre igual","<strong>Estacionalidad</strong>, L = 4"],["En 2020 todo cayó por la recesión y luego se recuperó","<strong>Ciclo</strong>"],["Un mes hubo un pedido raro de un hotel","<strong>Irregularidad</strong>"],["Los picos de verano son cada vez más grandes en unidades","Modelo <strong>multiplicativo</strong>"],["¿Es estacionaria?","<strong>No</strong>: el promedio sube con los años"],["<strong>¿Qué método?</strong>","<strong>Winter o descomposición</strong> (tiene tendencia Y estacionalidad)"]]},{"type":"heading","level":2,"text":"7. Mini-resumen para tu doc","html":"7. Mini-resumen para tu doc"},{"type":"callout","kind":"idea","text":"**Clase 3.a.** Serie de tiempo = secuencia ordenada de observaciones (Yₜ); el orden es información. Descomposición clásica: toda serie = Tendencia (largo plazo) + Ciclo (ondas plurianuales, sin período fijo) + Estacionalidad (patrón anual de período fijo, L=4 o 12) + Irregularidad (ruido impredecible). Ciclo vs. estacionalidad: si va en el calendario, es estacionalidad. Combinación aditiva (ondas parejas, estacionalidad en unidades) o multiplicativa (ondas crecientes, estacionalidad en %). Serie estacionaria = promedio constante en el tiempo; es la primera pregunta del diagnóstico porque define la familia de métodos. Si no lo es, se puede diferenciar (Yₜ − Yₜ₋₁).","html":"<strong>Clase 3.a.</strong> Serie de tiempo = secuencia ordenada de observaciones (Yₜ); el orden es información. Descomposición clásica: toda serie = Tendencia (largo plazo) + Ciclo (ondas plurianuales, sin período fijo) + Estacionalidad (patrón anual de período fijo, L=4 o 12) + Irregularidad (ruido impredecible). Ciclo vs. estacionalidad: si va en el calendario, es estacionalidad. Combinación aditiva (ondas parejas, estacionalidad en unidades) o multiplicativa (ondas crecientes, estacionalidad en %). Serie estacionaria = promedio constante en el tiempo; es la primera pregunta del diagnóstico porque define la familia de métodos. Si no lo es, se puede diferenciar (Yₜ − Yₜ₋₁)."},{"type":"ejercicio","title":"8. EJERCICIO — Clase 3.a","estado":"para resolver","blocks":[{"type":"paragraph","text":"Para cada serie: ¿qué componentes tiene? ¿es estacionaria? ¿el modelo parece aditivo o multiplicativo? ¿qué familia de métodos usarías?","html":"Para cada serie: ¿qué componentes tiene? ¿es estacionaria? ¿el modelo parece aditivo o multiplicativo? ¿qué familia de métodos usarías?"},{"type":"paragraph","text":"**a)** Ventas mensuales de una panadería de barrio, estables hace 10 años, oscilando entre 900 y 1.100 kg sin patrón visible.","html":"<strong>a)</strong> Ventas mensuales de una panadería de barrio, estables hace 10 años, oscilando entre 900 y 1.100 kg sin patrón visible."},{"type":"paragraph","text":"**b)** Ventas trimestrales de una heladería:","html":"<strong>b)</strong> Ventas trimestrales de una heladería:"},{"type":"table","headers":["Año","T1","T2","T3","T4"],"rows":[["---","---","---","---","---"],["2022","800","200","150","700"],["2023","950","240","180","830"],["2024","1.100","280","210","980"]],"headersHtml":["Año","T1","T2","T3","T4"],"rowsHtml":[["---","---","---","---","---"],["2022","800","200","150","700"],["2023","950","240","180","830"],["2024","1.100","280","210","980"]]},{"type":"paragraph","text":"**c)** Suscripciones de una app que crece sostenidamente: 1.000, 1.250, 1.480, 1.760, 2.010, 2.290.","html":"<strong>c)</strong> Suscripciones de una app que crece sostenidamente: 1.000, 1.250, 1.480, 1.760, 2.010, 2.290."},{"type":"paragraph","text":"**d)** Ventas de una constructora que subieron hasta 2018, se derrumbaron 2019–2021 y se recuperan desde 2022.","html":"<strong>d)<
