los modelos de stock de U5.</text>\n\n  <line x1=\"490\" y1=\"700\" x2=\"490\" y2=\"724\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ U7 ============ -->\n  <rect x=\"120\" y=\"728\" width=\"740\" height=\"80\" rx=\"10\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"140\" y=\"754\" font-size=\"15\" font-weight=\"700\" fill=\"#5B3E8E\">UNIDAD 7 · SOFTWARES ERP</text>\n  <text x=\"700\" y=\"754\" font-size=\"11\" font-weight=\"700\" fill=\"#7B5AA6\">[T] el zoom out final</text>\n  <text x=\"140\" y=\"776\" font-size=\"11.5\" fill=\"#444\">Historia: MRP → MRP II → ERP · caracterización de los sistemas comerciales (SAP como caso típico)</text>\n  <text x=\"140\" y=\"795\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Todo lo anterior, empaquetado en software: por eso esta materia es “la anatomía de un ERP”.</text>\n\n  <!-- ============ COMPLEMENTOS ============ -->\n  <rect x=\"120\" y=\"822\" width=\"740\" height=\"56\" rx=\"8\" fill=\"#FAFAFA\" stroke=\"#BBB\" stroke-dasharray=\"5 4\"/>\n  <text x=\"140\" y=\"844\" font-size=\"12\" font-weight=\"700\" fill=\"#555\">COMPLEMENTOS (fuera del programa 2008, pero preguntados en el examen 2018):</text>\n  <text x=\"140\" y=\"864\" font-size=\"11\" fill=\"#444\">· BI / Data Warehouse: relación ERP–BI ★, modelo dimensional, Kimball    · Métodos de decisión racional ★ (nivel conceptual)</text>\n\n  <!-- LEYENDA -->\n  <text x=\"40\" y=\"906\" font-size=\"11.5\" fill=\"#333\"><tspan font-weight=\"700\" fill=\"#C00000\">[P]</tspan> se calcula → práctica (eliminatoria, primero)    <tspan font-weight=\"700\">[T]</tspan> se explica → teoría + coloquio globalizador    <tspan font-weight=\"700\">★</tspan> cayó en finales relevados</text>\n  <text x=\"40\" y=\"926\" font-size=\"11.5\" fill=\"#333\">Evaluación oficial: claridad conceptual · relaciones entre contenidos · vocabulario específico · interpretación · fundamentación</text>\n</svg>"},{"type":"heading","level":2,"text":"3. Glosario: planificación y producto","html":"3. Glosario: planificación y producto"},{"type":"glosario","title":"Planificación, materiales y producto","intro":"Significado según el material. Entre paréntesis, la fuente.","entries":[{"simbolo":"MRP","nombre":"Material Requirements Planning","significado":"Planificación de los Requerimientos de Materiales. Calcula las necesidades de conjuntos, piezas y materias primas por período para cumplir el MPS. Es gestión de existencias de demanda dependiente. (Resumen 7 p.)","simboloHtml":"MRP","nombreHtml":"Material Requirements Planning","significadoHtml":"Planificación de los Requerimientos de Materiales. Calcula las necesidades de conjuntos, piezas y materias primas por período para cumplir el MPS. Es gestión de existencias de demanda dependiente. (Resumen 7 p.)"},{"simbolo":"MPS","nombre":"Plan Maestro de Producción / Master Production Schedule","significado":"Programa o plan maestro de producción: el plan con los tiempos desglosados que especifica cuántas piezas finales va a fabricar la empresa y cuándo. El inglés Master Production Schedule aparece explícito en PAC.pdf. (apunte: PAC.pdf; también V6 y Resumen 7 p.)","simboloHtml":"MPS","nombreHtml":"Plan Maestro de Producción / Master Production Schedule","significadoHtml":"Programa o plan maestro de producción: el plan con los tiempos desglosados que especifica cuántas piezas finales va a fabricar la empresa y cuándo. El inglés Master Production Schedule aparece explícito en PAC.pdf. (apunte: PAC.pdf; también V6 y Resumen 7 p.)"},{"simbolo":"MRP II","nombre":"planeación de recursos de manufactura","significado":"Planeación de recursos de manufactura: expansión del MRP para planear y monitorear más recursos de la empresa. (V6). El programa lo menciona junto a CRP.","simboloHtml":"MRP II","nombreHtml":"planeación de recursos de manufactura","significadoHtml":"Planeación de recursos de manufactura: expansión del MRP para planear y monitorear más recursos de la empresa. (V6). El programa lo menciona junto a CRP."},{"simbolo":"CRP","nombre":"Capacity Requirements Planning","significado":"Planificación de los Requerimientos de Capacidad (PAC.pdf). El apunte de capacidad la describe como el Plan de Capacidad Detallado: determina período a período lo que resulta del MRP, y es complementaria del RCCP (Rough-Cut Capacity Planning). El Documento Maestro la anota junto a MRP II. (apunte: PAC.pdf y Planificacion de la Capacidad.pdf — R. Morán, 2001)","simboloHtml":"CRP","nombreHtml":"Capacity Requirements Planning","significadoHtml":"Planificación de los Requerimientos de Capacidad (PAC.pdf). El apunte de capacidad la describe como el Plan de Capacidad Detallado: determina período a período lo que resulta del MRP, y es complementaria del RCCP (Rough-Cut Capacity Planning). El Documento Maestro la anota junto a MRP II. (apunte: PAC.pdf y Planificacion de la Capacidad.pdf — R. Morán, 2001)"},{"simbolo":"ERP","nombre":"planeación / gestión integral de recursos empresariales","significado":"En el programa U7: gestión integral de los recursos en empresas industriales, mediante paquetes pre-programados parametrizables. En el V6: planeación de recursos empresariales. Historia del mapa: MRP → MRP II → ERP.","simboloHtml":"ERP","nombreHtml":"planeación / gestión integral de recursos empresariales","significadoHtml":"En el programa U7: gestión integral de los recursos en empresas industriales, mediante paquetes pre-programados parametrizables. En el V6: planeación de recursos empresariales. Historia del mapa: MRP → MRP II → ERP."},{"simbolo":"BOM","nombre":"lista de materiales / estructura de producto","significado":"El programa (U3) dice «Estructura de producto. BOM. Explosión sumarizada y por niveles». Preguntas frecuentes pregunta: «¿En ERP qué información tiene la BOM (lista de materiales)?». El V6 describe el archivo con la lista de materiales que especifica qué se usa para hacer cada pieza.","simboloHtml":"BOM","nombreHtml":"lista de materiales / estructura de producto","significadoHtml":"El programa (U3) dice «Estructura de producto. BOM. Explosión sumarizada y por niveles». Preguntas frecuentes pregunta: «¿En ERP qué información tiene la BOM (lista de materiales)?». El V6 describe el archivo con la lista de materiales que especifica qué se usa para hacer cada pieza."},{"simbolo":"PAC","nombre":"Production Activity Control","significado":"Control de las Actividades de Producción. Objetivo: «realizar el lanzamiento, la programación y el control del progreso de las órdenes de producción, es decir administrar el trabajo en curso de ejecución». También se lo designa Control de la Producción o Control del Taller (SFC: Shop Floor Control). La entrada del PAC son las salidas del MPS, del MRP y del CRP, más datos de ingeniería. (apunte: PAC.pdf — R. Morán, 2001)","simboloHtml":"PAC","nombreHtml":"Production Activity Control","significadoHtml":"Control de las Actividades de Producción. Objetivo: «realizar el lanzamiento, la programación y el control del progreso de las órdenes de producción, es decir administrar el trabajo en curso de ejecución». También se lo designa Control de la Producción o Control del Taller (SFC: Shop Floor Control). La entrada del PAC son las salidas del MPS, del MRP y del CRP, más datos de ingeniería. (apunte: PAC.pdf — R. Morán, 2001)"},{"simbolo":"SFC","nombre":"Shop Floor Control","significado":"Control del Taller: otra designación del PAC, según el mismo apunte. (apunte: PAC.pdf — R. Morán, 2001)","simboloHtml":"SFC","nombreHtml":"Shop Floor Control","significadoHtml":"Control del Taller: otra designación del PAC, según el mismo apunte. (apunte: PAC.pdf — R. Morán, 2001)"},{"simbolo":"DRP","nombre":"Distribution Requirements Planning","significado":"Planificación de los Requerimientos de Distribución. «Es un sistema muy similar al MRP en su funcionamiento básico, pero referido exclusivamente a productos finales.» Se usa cuando hay centros de distribución (CD) para generar requerimientos hacia el MPS. (apunte: DRP.pdf — R. Morán, 2000)","simboloHtml":"DRP","nombreHtml":"Distribution Requirements Planning","significadoHtml":"Planificación de los Requerimientos de Distribución. «Es un sistema muy similar al MRP en su funcionamiento básico, pero referido exclusivamente a productos finales.» Se usa cuando hay centros de distribución (CD) para generar requerimientos hacia el MPS. (apunte: DRP.pdf — R. Morán, 2000)"},{"simbolo":"MCP","nombre":"duda: ver sección 8","significado":"Aparece en la pregunta textual de final «Qué es MRP, MCP, ERP» (13/12/2012) y el Documento Maestro la escribe como «MRP vs. MRP II/MCP vs. ERP». Ningún apunte leído desarrolla la sigla. Opciones halladas: (1) en el contexto de esa pregunta, la cátedra parece usarla del lado de MRP II, sin definirla; (2) en sitios de software (p. ej. TIC Portal) MCP es Machine Capacity Planning, planificación de la capacidad de las máquinas, distinto de CRP. No se adopta una como definición oficial. (examen 2012 / patrones; Documento Maestro; web: ticportal.es)","simboloHtml":"MCP","nombreHtml":"duda: ver sección 8","significadoHtml":"Aparece en la pregunta textual de final «Qué es MRP, MCP, ERP» (13/12/2012) y el Documento Maestro la escribe como «MRP vs. MRP II/MCP vs. ERP». Ningún apunte leído desarrolla la sigla. Opciones halladas: (1) en el contexto de esa pregunta, la cátedra parece usarla del lado de MRP II, sin definirla; (2) en sitios de software (p. ej. TIC Portal) MCP es Machine Capacity Planning, planificación de la capacidad de las máquinas, distinto de CRP. No se adopta una como definición oficial. (examen 2012 / patrones; Documento Maestro; web: ticportal.es)"}],"introHtml":"Significado según el material. Entre paréntesis, la fuente.","titleHtml":"Planificación, materiales y producto"},{"type":"heading","level":2,"text":"4. Glosario: inventarios y loteo","html":"4. Glosario: inventarios y loteo"},{"type":"glosario","title":"Inventarios y loteo","intro":null,"entries":[{"simbolo":"EOQ","nombre":"Economic Order Quantity","significado":"Lote económico clásico / cantidad de pedido económico. Se usa cuando la demanda período a período es poco variable. (Resumen 7 p.; V6)","simboloHtml":"EOQ","nombreHtml":"Economic Order Quantity","significadoHtml":"Lote económico clásico / cantidad de pedido económico. Se usa cuando la demanda período a período es poco variable. (Resumen 7 p.; V6)"},{"simbolo":"LEC","nombre":"lote económico de compra (lectura del material + uso estándar)","significado":"En los bancos de teoría aparece junto a LEF, y con LTF / LTC, en el archivo de gestión de stock (LEC y LEF, LTF y LTC). El Documento Maestro y el mapa lo escriben «EOQ/LEC» como loteo. El material de cátedra no escribe la frase «lote económico de compra» letra por letra; sí define LEF como lote económico de fabricación. En textos universitarios de producción, LEC es el lote económico de compra, contraparte del LEF (p. ej. programa de Administración IV, UNLP). (banco: Preguntas SG1.txt; Documento Maestro; web/conocimiento general: uso estándar LEC/LEF). Duda menor: la forma larga no está textual en los PDF de la cátedra. En el OCR de EjerciciosFinalesResueltos.pdf (p.30), un EOQ de *compra* (hospital, 500 kg de algodón) pregunta «Cual es su L.E.C.». Eso refuerza esta lectura, pero la frase «lote económico de compra» sigue sin aparecer completa en el material.","simboloHtml":"LEC","nombreHtml":"lote económico de compra (lectura del material + uso estándar)","significadoHtml":"En los bancos de teoría aparece junto a LEF, y con LTF / LTC, en el archivo de gestión de stock (LEC y LEF, LTF y LTC). El Documento Maestro y el mapa lo escriben «EOQ/LEC» como loteo. El material de cátedra no escribe la frase «lote económico de compra» letra por letra; sí define LEF como lote económico de fabricación. En textos universitarios de producción, LEC es el lote económico de compra, contraparte del LEF (p. ej. programa de Administración IV, UNLP). (banco: Preguntas SG1.txt; Documento Maestro; web/conocimiento general: uso estándar LEC/LEF). Duda menor: la forma larga no está textual en los PDF de la cátedra. En el OCR de EjerciciosFinalesResueltos.pdf (p.30), un EOQ de <em>compra</em> (hospital, 500 kg de algodón) pregunta «Cual es su L.E.C.». Eso refuerza esta lectura, pero la frase «lote económico de compra» sigue sin aparecer completa en el material."},{"simbolo":"TBO","nombre":"Time Between Orders","significado":"Tiempo entre órdenes, expresado en períodos de planificación. (Resumen 7 p.)","simboloHtml":"TBO","nombreHtml":"Time Between Orders","significadoHtml":"Tiempo entre órdenes, expresado en períodos de planificación. (Resumen 7 p.)"},{"simbolo":"POQ","nombre":"Periodic Order Quantity","significado":"Cantidad periódica de producción: modelo de período fijo y cantidad variable, que usa la fórmula del EOQ para hallar el TBO y luego las cantidades a ordenar. (Resumen 7 p.)","simboloHtml":"POQ","nombreHtml":"Periodic Order Quantity","significadoHtml":"Cantidad periódica de producción: modelo de período fijo y cantidad variable, que usa la fórmula del EOQ para hallar el TBO y luego las cantidades a ordenar. (Resumen 7 p.)"},{"simbolo":"PPB","nombre":"Part Period Balancing","significado":"Balance cantidad-período: agrupa los requerimientos del MRP para minimizar el costo unitario total de producción y mantenimiento en stock. (Resumen 7 p.)","simboloHtml":"PPB","nombreHtml":"Part Period Balancing","significadoHtml":"Balance cantidad-período: agrupa los requerimientos del MRP para minimizar el costo unitario total de producción y mantenimiento en stock. (Resumen 7 p.)"},{"simbolo":"ABC","nombre":"análisis / clasificación ABC","significado":"Método para analizar el inventario con base en el valor; el V6 lo presenta como aplicación del análisis de Pareto al inventario. El programa y el mapa lo ubican en logística.","simboloHtml":"ABC","nombreHtml":"análisis / clasificación ABC","significadoHtml":"Método para analizar el inventario con base en el valor; el V6 lo presenta como aplicación del análisis de Pareto al inventario. El programa y el mapa lo ubican en logística."},{"simbolo":"SS","nombre":"stock de seguridad","significado":"Así lo usa el mapa de frecuencias («EOQ + SS»). En el programa y el mapa de la materia el tema se nombra «stock de seguridad».","simboloHtml":"SS","nombreHtml":"stock de seguridad","significadoHtml":"Así lo usa el mapa de frecuencias («EOQ + SS»). En el programa y el mapa de la materia el tema se nombra «stock de seguridad»."},{"simbolo":"OP / OC","nombre":"orden de producción / orden de compra","significado":"En el Resumen 7 p., un ingreso programado significa que existe una OP o una OC, y que las materias primas y piezas ya están comprometidas con esa orden.","simboloHtml":"OP / OC","nombreHtml":"orden de producción / orden de compra","significadoHtml":"En el Resumen 7 p., un ingreso programado significa que existe una OP o una OC, y que las materias primas y piezas ya están comprometidas con esa orden."},{"simbolo":"LEF","nombre":"lote económico de fabricación","significado":"Así lo escribe el banco de teoría: «Inventarios aporta los saldos, lote económico de fabricación (LEF) y lead time (LTF) para las componentes a fabricar». Se usa en pareja con LEC. (banco: Preguntas SG1.txt y equivalentes)","simboloHtml":"LEF","nombreHtml":"lote económico de fabricación","significadoHtml":"Así lo escribe el banco de teoría: «Inventarios aporta los saldos, lote económico de fabricación (LEF) y lead time (LTF) para las componentes a fabricar». Se usa en pareja con LEC. (banco: Preguntas SG1.txt y equivalentes)"}],"titleHtml":"Inventarios y loteo"},{"type":"heading","level":2,"text":"5. Glosario: pronósticos","html":"5. Glosario: pronósticos"},{"type":"glosario","title":"Pronósticos y error","intro":"Nombres según Hanke y la Clase 4 (Medidas de error).","entries":[{"simbolo":"SES","nombre":"nivelación / suavización exponencial simple","significado":"Así aparece en finales (p. ej. 2018: el MPS parte de un pronóstico por «Nivelación Exponencial Simple») y en las clases de pronósticos.","simboloHtml":"SES","nombreHtml":"nivelación / suavización exponencial simple","significadoHtml":"Así aparece en finales (p. ej. 2018: el MPS parte de un pronóstico por «Nivelación Exponencial Simple») y en las clases de pronósticos."},{"simbolo":"MAD","nombre":"desviación absoluta media (o de la media)","significado":"Mide el error de pronóstico en unidades, con valor absoluto. Hanke: Desviación Absoluta de la Media. Clase 4: desviación / error absoluto medio.","simboloHtml":"MAD","nombreHtml":"desviación absoluta media (o de la media)","significadoHtml":"Mide el error de pronóstico en unidades, con valor absoluto. Hanke: Desviación Absoluta de la Media. Clase 4: desviación / error absoluto medio."},{"simbolo":"MSE","nombre":"error cuadrático medio","significado":"Promedio de los errores al cuadrado; castiga más los errores grandes. Se usa para elegir parámetros. (Hanke; Clase 4). El V6 también nombra RMSE como √MSE.","simboloHtml":"MSE","nombreHtml":"error cuadrático medio","significadoHtml":"Promedio de los errores al cuadrado; castiga más los errores grandes. Se usa para elegir parámetros. (Hanke; Clase 4). El V6 también nombra RMSE como √MSE."},{"simbolo":"MAPE","nombre":"porcentaje de error medio absoluto","significado":"El error en porcentaje; permite comparar series de distinta escala. (Hanke; Clase 4)","simboloHtml":"MAPE","nombreHtml":"porcentaje de error medio absoluto","significadoHtml":"El error en porcentaje; permite comparar series de distinta escala. (Hanke; Clase 4)"},{"simbolo":"PME","nombre":"porcentaje medio de error","significado":"Conserva el signo, por eso muestra el sesgo. Un PME alto y consistente delata un patrón no capturado. (Clase 4)","simboloHtml":"PME","nombreHtml":"porcentaje medio de error","significadoHtml":"Conserva el signo, por eso muestra el sesgo. Un PME alto y consistente delata un patrón no capturado. (Clase 4)"},{"simbolo":"FAC / ACF","nombre":"función de autocorrelación","significado":"El correlograma de la Clase 3.b; sirve para probar el patrón de la serie (tendencia, estacionalidad, etc.).","simboloHtml":"FAC / ACF","nombreHtml":"función de autocorrelación","significadoHtml":"El correlograma de la Clase 3.b; sirve para probar el patrón de la serie (tendencia, estacionalidad, etc.)."},{"simbolo":"r / R²","nombre":"correlación / coeficiente de determinación","significado":"Clase 2: r mide si dos variables se mueven juntas (signo = dirección, valor absoluto = fuerza). r² es el porcentaje de variación explicada.","simboloHtml":"r / R²","nombreHtml":"correlación / coeficiente de determinación","significadoHtml":"Clase 2: r mide si dos variables se mueven juntas (signo = dirección, valor absoluto = fuerza). r² es el porcentaje de variación explicada."}],"introHtml":"Nombres según Hanke y la Clase 4 (Medidas de error).","titleHtml":"Pronósticos y error"},{"type":"heading","level":2,"text":"6. Glosario: proceso de producción","html":"6. Glosario: proceso de producción"},{"type":"glosario","title":"Proceso (U4 del programa)","intro":"El programa nombra SMED, TQM, Kanban, JIT, producción sincronizada y Teoría de las restricciones. Las expansiones de abajo están en el V6 o en el Documento Maestro.","entries":[{"simbolo":"JIT","nombre":"justo a tiempo","significado":"En Preguntas frecuentes y en el mapa: JIT (justo a tiempo). El V6: «Justo a tiempo significa producir lo que se necesita cuando se necesita». El final 2018 preguntó cuándo una empresa JIT necesita MRP.","simboloHtml":"JIT","nombreHtml":"justo a tiempo","significadoHtml":"En Preguntas frecuentes y en el mapa: JIT (justo a tiempo). El V6: «Justo a tiempo significa producir lo que se necesita cuando se necesita». El final 2018 preguntó cuándo una empresa JIT necesita MRP."},{"simbolo":"Kanban","nombre":"«signo» o «tarjeta de instrucción»","significado":"El V6: «Kanban significa “signo” o “tarjeta de instrucción” en japonés». Sistema de señalización para regular los flujos justo a tiempo.","simboloHtml":"Kanban","nombreHtml":"«signo» o «tarjeta de instrucción»","significadoHtml":"El V6: «Kanban significa “signo” o “tarjeta de instrucción” en japonés». Sistema de señalización para regular los flujos justo a tiempo."},{"simbolo":"SMED","nombre":"single-minute exchange of die","significado":"Cambio de troqueles en un minuto: procedimientos para bajar los tiempos de preparación de las máquinas. (V6)","simboloHtml":"SMED","nombreHtml":"single-minute exchange of die","significadoHtml":"Cambio de troqueles en un minuto: procedimientos para bajar los tiempos de preparación de las máquinas. (V6)"},{"simbolo":"TQM","nombre":"administración de (por) la calidad total","significado":"El V6 usa «administración de la calidad total» y «administración por calidad total». El programa lo lista entre los conceptos básicos de la U4.","simboloHtml":"TQM","nombreHtml":"administración de (por) la calidad total","significadoHtml":"El V6 usa «administración de la calidad total» y «administración por calidad total». El programa lo lista entre los conceptos básicos de la U4."},{"simbolo":"TOC","nombre":"Teoría de las Restricciones","significado":"Documento Maestro: «Teoría de las Restricciones (TOC): cuellos de botella, la meta, mejora continua según Goldratt». El programa nombra «Teoría de las restricciones» sin la sigla inglesa.","simboloHtml":"TOC","nombreHtml":"Teoría de las Restricciones","significadoHtml":"Documento Maestro: «Teoría de las Restricciones (TOC): cuellos de botella, la meta, mejora continua según Goldratt». El programa nombra «Teoría de las restricciones» sin la sigla inglesa."}],"introHtml":"El programa nombra SMED, TQM, Kanban, JIT, producción sincronizada y Teoría de las restricciones. Las expansiones de abajo están en el V6 o en el Documento Maestro.","titleHtml":"Proceso (U4 del programa)"},{"type":"heading","level":2,"text":"7. Glosario: información, BI y otras","html":"7. Glosario: información, BI y otras"},{"type":"glosario","title":"Información, calidad de código y referencias","intro":"BI no está en el programa 2008, pero cayó en la teoría de 2018 (relación ERP–BI).","entries":[{"simbolo":"BI","nombre":"Business Intelligence / Inteligencia de Negocios","significado":"El V6: «La Inteligencia de Negocios (Business Intelligence, BI) es una disciplina que combina consultas, servicios, aplicaciones y tecnologías» para transformar datos en información útil. El Documento Maestro la relaciona con Data Warehouse y con el examen 2018.","simboloHtml":"BI","nombreHtml":"Business Intelligence / Inteligencia de Negocios","significadoHtml":"El V6: «La Inteligencia de Negocios (Business Intelligence, BI) es una disciplina que combina consultas, servicios, aplicaciones y tecnologías» para transformar datos en información útil. El Documento Maestro la relaciona con Data Warehouse y con el examen 2018."},{"simbolo":"ETL","nombre":"Extracción, Transformación y Carga","significado":"Así lo titula el V6. Sirve para poblar el Data Warehouse, moviendo bloques de datos desde los sistemas operacionales.","simboloHtml":"ETL","nombreHtml":"Extracción, Transformación y Carga","significadoHtml":"Así lo titula el V6. Sirve para poblar el Data Warehouse, moviendo bloques de datos desde los sistemas operacionales."},{"simbolo":"DW","nombre":"Data Warehouse","significado":"El V6: «un conjunto de datos integrados orientados a una materia, que varían con el tiempo y que no son transitorios, los cuales soportan el proceso de toma de decisiones de una organización».","simboloHtml":"DW","nombreHtml":"Data Warehouse","significadoHtml":"El V6: «un conjunto de datos integrados orientados a una materia, que varían con el tiempo y que no son transitorios, los cuales soportan el proceso de toma de decisiones de una organización»."},{"simbolo":"IBM-11","nombre":"dígito verificador módulo 11","significado":"Preguntas frecuentes: el dígito verificador es un elemento de control; el módulo 11 aplica pesos 2 a 7. Cayó en teoría (2013, 2018; código 2018: 987-95617-03-01). No es ejercicio de práctica en los finales fechados.","simboloHtml":"IBM-11","nombreHtml":"dígito verificador módulo 11","significadoHtml":"Preguntas frecuentes: el dígito verificador es un elemento de control; el módulo 11 aplica pesos 2 a 7. Cayó en teoría (2013, 2018; código 2018: 987-95617-03-01). No es ejercicio de práctica en los finales fechados."},{"simbolo":"APICS","nombre":"American Production & Inventory Control Society","significado":"Así la cita el Documento Maestro, como referencia de vocabulario de la bibliografía de cátedra.","simboloHtml":"APICS","nombreHtml":"American Production &amp; Inventory Control Society","significadoHtml":"Así la cita el Documento Maestro, como referencia de vocabulario de la bibliografía de cátedra."},{"simbolo":"DSS / SSD","nombre":"Decision Support System / Sistema de Soporte de Decisiones","significado":"El apunte de 2014 define el Sistema de Soporte de Decisiones (SSD): «un sistema de computación diseñado para apoyar al proceso de toma de decisiones (de planeamiento, de administración y operacionales) en un negocio» y «la ventana del usuario a los datos informativos almacenados en el Data Warehouse». El Documento Maestro lista el tema como DSS, junto a BI / Data Warehouse. DSS es la forma inglesa habitual de ese mismo concepto (Decision Support System). El apunte 2014 no escribe la sigla DSS, sino SSD. (apunte: 2014 - Inteligencia de Negocios.pdf; Documento Maestro v2)","simboloHtml":"DSS / SSD","nombreHtml":"Decision Support System / Sistema de Soporte de Decisiones","significadoHtml":"El apunte de 2014 define el Sistema de Soporte de Decisiones (SSD): «un sistema de computación diseñado para apoyar al proceso de toma de decisiones (de planeamiento, de administración y operacionales) en un negocio» y «la ventana del usuario a los datos informativos almacenados en el Data Warehouse». El Documento Maestro lista el tema como DSS, junto a BI / Data Warehouse. DSS es la forma inglesa habitual de ese mismo concepto (Decision Support System). El apunte 2014 no escribe la sigla DSS, sino SSD. (apunte: 2014 - Inteligencia de Negocios.pdf; Documento Maestro v2)"},{"simbolo":"WIP","nombre":"Work in Process / trabajo en proceso o en curso","significado":"El Resumen V6 (Chase) usa «inventario WIP» en el control de piso, sin expandir la sigla. El apunte PAC habla de «trabajo en curso» como lo que administra el PAC. En administración de operaciones, WIP es Work in Process: materiales o productos que ya empezaron a fabricarse y todavía no son producto terminado (trabajo en proceso / en curso). (apunte/uso: V6 y PAC.pdf; web/conocimiento general: Work in Process)","simboloHtml":"WIP","nombreHtml":"Work in Process / trabajo en proceso o en curso","significadoHtml":"El Resumen V6 (Chase) usa «inventario WIP» en el control de piso, sin expandir la sigla. El apunte PAC habla de «trabajo en curso» como lo que administra el PAC. En administración de operaciones, WIP es Work in Process: materiales o productos que ya empezaron a fabricarse y todavía no son producto terminado (trabajo en proceso / en curso). (apunte/uso: V6 y PAC.pdf; web/conocimiento general: Work in Process)"},{"simbolo":"IBM-13","nombre":"duda: ver sección 8","significado":"Solo aparece en el recuerdo de un alumno del final 17/03/2011: «Calcular el dígito verificador en IBM13». Los apuntes de cátedra desarrollan IBM 11 (módulo 11, Preguntas frecuentes y exámenes) y las claves de control módulo 10 (PAC no; Clasificación y Codificación de Productos.pdf de R. Morán, y Preguntas frecuentes). No hay un procedimiento rotulado «IBM-13». No se inventa el cálculo. (examen 2011, transcripción de alumno; apunte: Clasificación y Codificación de Productos.pdf)","simboloHtml":"IBM-13","nombreHtml":"duda: ver sección 8","significadoHtml":"Solo aparece en el recuerdo de un alumno del final 17/03/2011: «Calcular el dígito verificador en IBM13». Los apuntes de cátedra desarrollan IBM 11 (módulo 11, Preguntas frecuentes y exámenes) y las claves de control módulo 10 (PAC no; Clasificación y Codificación de Productos.pdf de R. Morán, y Preguntas frecuentes). No hay un procedimiento rotulado «IBM-13». No se inventa el cálculo. (examen 2011, transcripción de alumno; apunte: Clasificación y Codificación de Productos.pdf)"}],"introHtml":"BI no está en el programa 2008, pero cayó en la teoría de 2018 (relación ERP–BI).","titleHtml":"Información, calidad de código y referencias"},{"type":"heading","level":2,"text":"8. Lo que quedó en duda (y lo que ya no)","html":"8. Lo que quedó en duda (y lo que ya no)"},{"type":"paragraph","text":"Después de leer PAC.pdf, DRP.pdf, Planificación de la Capacidad, el apunte de BI 2014, el de Codificación y los bancos de teoría, PAC, DRP, DSS/SSD, LEC/LEF y WIP ya tienen significado con fuente. Quedan dos casos dudosos. No se elige una definición oficial inventada.","html":"Después de leer PAC.pdf, DRP.pdf, Planificación de la Capacidad, el apunte de BI 2014, el de Codificación y los bancos de teoría, PAC, DRP, DSS/SSD, LEC/LEF y WIP ya tienen significado con fuente. Quedan dos casos dudosos. No se elige una definición oficial inventada."},{"type":"table","headers":["Sigla","Qué se encontró","Estado"],"rows":[["MCP","Pregunta de final 2012: «Qué es MRP, MCP, ERP». El Documento Maestro escribe «MRP vs. MRP II/MCP vs. ERP», como si MCP fuera el término intermedio (del lado de MRP II). Ningún PDF de la cátedra expande la sigla. En la web, TIC Portal usa MCP como Machine Capacity Planning (planificación de la capacidad de las máquinas), que no es lo mismo que CRP.","Duda. No se adopta una sola expansión."],["IBM-13","Solo en el recuerdo de un alumno (final 17/03/2011). El material de cátedra desarrolla IBM 11 (módulo 11) y las claves módulo 10 (Morán, Codificación; Preguntas frecuentes). No hay un método titulado IBM-13.","Duda. No se inventa el procedimiento."],["LEC","No está la frase «lote económico de compra» en los PDF leídos. Sí está LEF = lote económico de fabricación, y LEC aparece como su pareja (LEC y LEF, LTF y LTC) y como EOQ/LEC. En la bibliografía universitaria de producción, LEC es lote económico de compra.","Lectura fundada, con esa salvedad."]],"headersHtml":["Sigla","Qué se encontró","Estado"],"rowsHtml":[["MCP","Pregunta de final 2012: «Qué es MRP, MCP, ERP». El Documento Maestro escribe «MRP vs. MRP II/MCP vs. ERP», como si MCP fuera el término intermedio (del lado de MRP II). Ningún PDF de la cátedra expande la sigla. En la web, TIC Portal usa MCP como Machine Capacity Planning (planificación de la capacidad de las máquinas), que no es lo mismo que CRP.","Duda. No se adopta una sola expansión."],["IBM-13","Solo en el recuerdo de un alumno (final 17/03/2011). El material de cátedra desarrolla IBM 11 (módulo 11) y las claves módulo 10 (Morán, Codificación; Preguntas frecuentes). No hay un método titulado IBM-13.","Duda. No se inventa el procedimiento."],["LEC","No está la frase «lote económico de compra» en los PDF leídos. Sí está LEF = lote económico de fabricación, y LEC aparece como su pareja (LEC y LEF, LTF y LTC) y como EOQ/LEC. En la bibliografía universitaria de producción, LEC es lote económico de compra.","Lectura fundada, con esa salvedad."]]},{"type":"callout","kind":"examen","text":"**Para el final:** en 2012 preguntaron MRP, MCP y ERP. MCP es de las que siguen en duda: si cae, conviene decir lo que sí está en el material (la serie MRP → MRP II → ERP, y que MCP aparece escrito junto a MRP II) y no afirmar una forma inglesa que la cátedra no da. IBM-11 sí hay que saber calcularlo; IBM-13, no hay apunte.","html":"<strong>Para el final:</strong> en 2012 preguntaron MRP, MCP y ERP. MCP es de las que siguen en duda: si cae, conviene decir lo que sí está en el material (la serie MRP → MRP II → ERP, y que MCP aparece escrito junto a MRP II) y no afirmar una forma inglesa que la cátedra no da. IBM-11 sí hay que saber calcularlo; IBM-13, no hay apunte."},{"type":"heading","level":2,"text":"9. Qué sigue","html":"9. Qué sigue"},{"type":"paragraph","text":"Con el mapa y las siglas en su lugar, entra la **Clase 1 · Base estadística** (ya cargada): media, dispersión, n − 1, la campana, Z y t, hasta el stock de seguridad.","html":"Con el mapa y las siglas en su lugar, entra la <strong>Clase 1 · Base estadística</strong> (ya cargada): media, dispersión, n − 1, la campana, Z y t, hasta el stock de seguridad."}],"historias":[{"type":"concepto","k":"Para qué","title":"El examen pide vocabulario específico.","text":"Esta clase no inventa significados. Si una sigla aparece en un final o en un apunte y no se desarrolla, se deja marcada. El resto sale de los textos que ya tenemos.","html":"Esta clase no inventa significados. Si una sigla aparece en un final o en un apunte y no se desarrolla, se deja marcada. El resto sale de los textos que ya tenemos.","titleHtml":"El examen pide vocabulario específico."},{"type":"concepto","k":"La cadena","title":"MPS dice el qué y el cuándo. MRP explota las partes.","text":"MPS: plan maestro, cuántas piezas finales y cuándo (V6). MRP: planificación de los requerimientos de materiales. Parte del MPS y calcula, período a período, conjuntos, piezas y materias primas (Resumen 7 p.). Es demanda dependiente.","svg":"<svg viewBox=\"0 0 280 72\" width=\"100%\" height=\"72\" aria-hidden=\"true\"><rect x=\"8\" y=\"18\" width=\"46\" height=\"32\" rx=\"6\" fill=\"none\" stroke=\"#e8c56a\" stroke-width=\"1.6\"/><text x=\"31\" y=\"39\" font-size=\"12\" fill=\"#e8c56a\" font-weight=\"700\" text-anchor=\"middle\">MPS</text><text x=\"58\" y=\"40\" font-size=\"12\" fill=\"#9aa3ad\">→</text><rect x=\"63\" y=\"18\" width=\"46\" height=\"32\" rx=\"6\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.6\"/><text x=\"86\" y=\"39\" font-size=\"12\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">CRP</text><text x=\"113\" y=\"40\" font-size=\"12\" fill=\"#9aa3ad\">→</text><rect x=\"118\" y=\"18\" width=\"46\" height=\"32\" rx=\"6\" fill=\"none\" stroke=\"#e8c56a\" stroke-width=\"1.6\"/><text x=\"141\" y=\"39\" font-size=\"12\" fill=\"#e8c56a\" font-weight=\"700\" text-anchor=\"middle\">MRP</text><text x=\"168\" y=\"40\" font-size=\"12\" fill=\"#9aa3ad\">→</text><rect x=\"173\" y=\"18\" width=\"46\" height=\"32\" rx=\"6\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.6\"/><text x=\"196\" y=\"39\" font-size=\"12\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">PAC</text><text x=\"223\" y=\"40\" font-size=\"12\" fill=\"#9aa3ad\">→</text><rect x=\"228\" y=\"18\" width=\"46\" height=\"32\" rx=\"6\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.6\"/><text x=\"251\" y=\"39\" font-size=\"12\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">ERP</text></svg>","chartLabel":"Cadena corta: el MPS alimenta al MRP; el ERP las empaqueta","html":"MPS: plan maestro, cuántas piezas finales y cuándo (V6). MRP: planificación de los requerimientos de materiales. Parte del MPS y calcula, período a período, conjuntos, piezas y materias primas (Resumen 7 p.). Es demanda dependiente.","titleHtml":"MPS dice el qué y el cuándo. MRP explota las partes."},{"type":"concepto","k":"La historia","title":"MRP se agranda y termina en ERP.","text":"MRP II, en el V6, es planeación de recursos de manufactura. El programa habla de sistemas MRPII (CRP); el Documento Maestro anota CRP como planificación de requerimientos de capacidad. ERP, en el programa, es la gestión integral de los recursos en empresas industriales.","html":"MRP II, en el V6, es planeación de recursos de manufactura. El programa habla de sistemas MRPII (CRP); el Documento Maestro anota CRP como planificación de requerimientos de capacidad. ERP, en el programa, es la gestión integral de los recursos en empresas industriales.","titleHtml":"MRP se agranda y termina en ERP."},{"type":"pregunta","k":"A ver…","title":"El MRP calcula las necesidades de partes a partir de…","options":["Un pronóstico suelto de cada tornillo","Las cantidades de productos finales fijadas en el MPS","El stock de seguridad de la U5"],"correct":1,"feedback":"El Resumen de 7 páginas lo dice: el MRP obtiene las necesidades de cada parte para cumplir el Plan Maestro de Producción. Por eso es demanda dependiente.","titleHtml":"El MRP calcula las necesidades de partes a partir de…"},{"type":"concepto","k":"El producto y el lote","title":"BOM es la lista. EOQ es el lote económico.","text":"BOM: lista de materiales / estructura de producto (programa y Preguntas frecuentes). EOQ: Economic Order Quantity, lote económico clásico (7 p. y V6). Junto a él aparecen TBO (tiempo entre órdenes), POQ (cantidad periódica) y PPB (balance cantidad-período).","html":"BOM: lista de materiales / estructura de producto (programa y Preguntas frecuentes). EOQ: Economic Order Quantity, lote económico clásico (7 p. y V6). Junto a él aparecen TBO (tiempo entre órdenes), POQ (cantidad periódica) y PPB (balance cantidad-período).","titleHtml":"BOM es la lista. EOQ es el lote económico."},{"type":"concepto","k":"El proceso","title":"JIT, Kanban, SMED, TQM, TOC.","text":"JIT es justo a tiempo: producir lo que se necesita cuando se necesita (V6). Kanban es «signo» o «tarjeta de instrucción» en japonés. SMED: cambio de troqueles en un minuto. TQM: administración de la calidad total. TOC: Teoría de las Restricciones (Documento Maestro).","html":"JIT es justo a tiempo: producir lo que se necesita cuando se necesita (V6). Kanban es «signo» o «tarjeta de instrucción» en japonés. SMED: cambio de troqueles en un minuto. TQM: administración de la calidad total. TOC: Teoría de las Restricciones (Documento Maestro).","titleHtml":"JIT, Kanban, SMED, TQM, TOC."},{"type":"pregunta","k":"A ver…","title":"JIT significa…","options":["Justo a tiempo: producir lo que se necesita cuando se necesita","Un tipo de MRP","Un software ERP"],"correct":0,"feedback":"Así lo traen el Resumen V6 y las Preguntas frecuentes. El final 2018, además, preguntó cuándo una empresa JIT necesita MRP.","titleHtml":"JIT significa…"},{"type":"concepto","k":"Los errores","title":"Cuatro siglas para medir el pronóstico.","text":"MAD: desviación absoluta media (en unidades). MSE: error cuadrático medio (castiga los grandes). MAPE: porcentaje de error medio absoluto (para comparar series). PME: porcentaje medio de error, el que muestra el sesgo. (Hanke y Clase 4)","html":"MAD: desviación absoluta media (en unidades). MSE: error cuadrático medio (castiga los grandes). MAPE: porcentaje de error medio absoluto (para comparar series). PME: porcentaje medio de error, el que muestra el sesgo. (Hanke y Clase 4)","titleHtml":"Cuatro siglas para medir el pronóstico."},{"type":"concepto","k":"Inventarios","title":"ABC por valor. SS, el stock de seguridad.","text":"ABC clasifica ítems por valor de consumo (A pocos y valiosos, C muchos y baratos). SS es el stock de seguridad: cubre la incertidumbre de la demanda o del lead time. OP/OC es el punto de pedido.","html":"ABC clasifica ítems por valor de consumo (A pocos y valiosos, C muchos y baratos). SS es el stock de seguridad: cubre la incertidumbre de la demanda o del lead time. OP/OC es el punto de pedido.","titleHtml":"ABC por valor. SS, el stock de seguridad."},{"type":"pregunta","k":"A ver…","title":"¿Cuál de estas medidas sirve para ver si el método tiene sesgo?","options":["MAD","MSE","PME"],"correct":2,"feedback":"El PME conserva el signo y por eso muestra el sesgo. MAD y MSE miran magnitud, no dirección.","titleHtml":"¿Cuál de estas medidas sirve para ver si el método tiene sesgo?"},{"type":"concepto","k":"Información","title":"BI, ETL y el dígito verificador.","text":"BI: Inteligencia de Negocios / Business Intelligence (V6). ETL: Extracción, Transformación y Carga, para poblar el Data Warehouse. IBM-11: dígito verificador módulo 11 (cayó en 2018). APICS: American Production & Inventory Control Society.","html":"BI: Inteligencia de Negocios / Business Intelligence (V6). ETL: Extracción, Transformación y Carga, para poblar el Data Warehouse. IBM-11: dígito verificador módulo 11 (cayó en 2018). APICS: American Production &amp; Inventory Control Society.","titleHtml":"BI, ETL y el dígito verificador."},{"type":"concepto","k":"Con honestidad","title":"Dos siglas siguen en duda.","text":"PAC, DRP, DSS (SSD), LEC/LEF y WIP ya están en los apuntes o con fuente clara. Quedan MCP (aparece en «qué es MRP, MCP, ERP», sin expansión en la cátedra) e IBM-13 (solo un recuerdo de 2011, sin procedimiento). Esas no se inventan.","html":"PAC, DRP, DSS (SSD), LEC/LEF y WIP ya están en los apuntes o con fuente clara. Quedan MCP (aparece en «qué es MRP, MCP, ERP», sin expansión en la cátedra) e IBM-13 (solo un recuerdo de 2011, sin procedimiento). Esas no se inventan.","titleHtml":"Dos siglas siguen en duda."},{"type":"cierre","title":"Llevate el vocabulario.","text":"MPS y MRP son el corazón de la cadena; el PAC controla el piso; el DRP lleva el MRP a la distribución; ERP integra el software. JIT, EOQ, BOM, MAD/MSE/MAPE/PME y BI están en los apuntes. MCP e IBM-13 siguen marcadas como duda. Sigue la Clase 1: la base estadística.","html":"MPS y MRP son el corazón de la cadena; el PAC controla el piso; el DRP lleva el MRP a la distribución; ERP integra el software. JIT, EOQ, BOM, MAD/MSE/MAPE/PME y BI están en los apuntes. MCP e IBM-13 siguen marcadas como duda. Sigue la Clase 1: la base estadística.","titleHtml":"Llevate el vocabulario."}],"titleHtml":"Clase 0.1 · Siglas","ledeHtml":"El criterio de evaluación pide vocabulario específico. Esta clase junta las siglas del programa, el mapa, los apuntes y los exámenes, con el significado tal como aparece en el material. Si una sigla se usa pero no se desarrolla, va al final: no se inventa."},"c1":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c1","title":"Clase 1 · Base estadística","name":"Base estadística","lede":"el promedio dice el CENTRO de los datos; el desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio engaña. El desvío es el protagonista silencioso de la materia: reaparece en el error de pronósticos (U2), en el stock de seguridad (U5) y en la confiabilidad de la regresión (U2).","visto":true,"source":["clases_previas/SG/Clase01_y_01b_BaseEstadistica.md","clases_previas/SG/Clase01_BaseEstadistica.svg"],"laminas":["u2/img/Clase01_BaseEstadistica.svg"],"next":"Clase 1.b · La tabla Z y los 5 casos","teoria":[{"type":"paragraph","text":"**Sistemas de Gestión (UTN FRRo) · Unidad 2.a · Serie de clases: 0 → 0.1 → 1 → 1.b**","html":"<strong>Sistemas de Gestión (UTN FRRo) · Unidad 2.a · Serie de clases: 0 → 0.1 → 1 → 1.b</strong>"},{"type":"callout","kind":"idea","text":"**Idea central de toda la clase:** el promedio dice el CENTRO de los datos; el desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio engaña. El desvío es el protagonista silencioso de la materia: reaparece en el error de pronósticos (U2), en el stock de seguridad (U5) y en la confiabilidad de la regresión (U2).","html":"<strong>Idea central de toda la clase:</strong> el promedio dice el CENTRO de los datos; el desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio engaña. El desvío es el protagonista silencioso de la materia: reaparece en el error de pronósticos (U2), en el stock de seguridad (U5) y en la confiabilidad de la regresión (U2)."},{"type":"heading","level":2,"text":"1. El promedio engaña si viene solo","html":"1. El promedio engaña si viene solo"},{"type":"paragraph","text":"Dos fábricas, ventas de 4 meses:","html":"Dos fábricas, ventas de 4 meses:"},{"type":"table","headers":["","Mes 1","Mes 2","Mes 3","Mes 4","Promedio"],"rows":[["---","---","---","---","---","---"],["**Fábrica A**","490","510","495","505","**500**"],["**Fábrica B**","200","800","350","650","**500**"]],"headersHtml":["","Mes 1","Mes 2","Mes 3","Mes 4","Promedio"],"rowsHtml":[["---","---","---","---","---","---"],["<strong>Fábrica A</strong>","490","510","495","505","<strong>500</strong>"],["<strong>Fábrica B</strong>","200","800","350","650","<strong>500</strong>"]]},{"type":"svg","svg":"<svg viewBox=\"0 0 280 132\" width=\"100%\" height=\"132\" aria-hidden=\"true\"><line x1=\"28\" y1=\"108\" x2=\"272\" y2=\"108\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><line x1=\"28\" y1=\"57.41176470588235\" x2=\"250\" y2=\"57.41176470588235\" stroke=\"#a67c00\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"254\" y=\"60.41176470588235\" font-size=\"9\" fill=\"#a67c00\">500</text><polyline fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"2\" points=\"48,58.42352941176471 100,56.4 152,57.917647058823526 204,56.90588235294118\"/><circle cx=\"48\" cy=\"58.42352941176471\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"100\" cy=\"56.4\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"152\" cy=\"57.917647058823526\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"204\" cy=\"56.90588235294118\" r=\"3.2\" fill=\"#1f4e79\"/><polyline fill=\"none\" stroke=\"#c45c26\" stroke-width=\"2\" points=\"48,87.76470588235294 100,27.058823529411768 152,72.58823529411765 204,42.23529411764706\"/><circle cx=\"48\" cy=\"87.76470588235294\" r=\"3.2\" fill=\"#c45c26\"/><circle cx=\"100\" cy=\"27.058823529411768\" r=\"3.2\" fill=\"#c45c26\"/><circle cx=\"152\" cy=\"72.58823529411765\" r=\"3.2\" fill=\"#c45c26\"/><circle cx=\"204\" cy=\"42.23529411764706\" r=\"3.2\" fill=\"#c45c26\"/><text x=\"48\" y=\"124\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 1</text><text x=\"100\" y=\"124\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 2</text><text x=\"152\" y=\"124\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 3</text><text x=\"204\" y=\"124\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 4</text><text x=\"40\" y=\"14\" font-size=\"10\" fill=\"#1f4e79\" font-weight=\"700\">A (s≈9)</text><text x=\"110\" y=\"14\" font-size=\"10\" fill=\"#c45c26\" font-weight=\"700\">B (s≈274)</text></svg>","caption":"Mismo promedio (500). La A casi no se mueve; la B pega saltos de 200 a 800."},{"type":"paragraph","text":"Mismo promedio, realidades opuestas. A la A se la planifica tranquilo; la B necesita depósitos grandes, stock de seguridad enorme y pronósticos con margen. Lo que las diferencia es **cuánto se dispersan los datos alrededor del promedio** → el desvío estándar.","html":"Mismo promedio, realidades opuestas. A la A se la planifica tranquilo; la B necesita depósitos grandes, stock de seguridad enorme y pronósticos con margen. Lo que las diferencia es <strong>cuánto se dispersan los datos alrededor del promedio</strong> → el desvío estándar."},{"type":"heading","level":2,"text":"2. Fórmulas base (con su lectura)","html":"2. Fórmulas base (con su lectura)"},{"type":"heading","level":3,"text":"Media muestral","html":"Media muestral"},{"type":"formula","tex":"\\bar{X} = \\frac{\\sum X}{n}","html":"<span class=\"eq-block\"><span class=\"ov\">X</span> = <span class=\"frac\"><span class=\"num\">Σ X</span><span class=\"den\">n</span></span></span>"},{"type":"svg","file":"u2/img/Clase01_BaseEstadistica.svg","caption":"Lámina de la Clase 1 · Base estadística","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 760\" width=\"980\" height=\"760\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n  </defs>\n\n  <rect width=\"980\" height=\"760\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"36\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">CLASE 1 · Base estadística</text>\n  <text x=\"360\" y=\"36\" font-size=\"12.5\" fill=\"#666\">Unidad 2.a — la herramienta transversal de toda la materia</text>\n  <text x=\"40\" y=\"58\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">Idea central: el promedio dice el CENTRO; el desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio engaña.</text>\n\n  <!-- ===== BLOQUE 1: PROMEDIO Y DESVIO ===== -->\n  <rect x=\"40\" y=\"76\" width=\"440\" height=\"250\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"100\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">1 · Promedio y desvío estándar</text>\n\n  <text x=\"56\" y=\"126\" font-size=\"12\" font-weight=\"700\" fill=\"#333\">Promedio (media muestral):</text>\n  <text x=\"270\" y=\"126\" font-size=\"13\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\">X̄ = ΣX / n</text>\n\n  <text x=\"56\" y=\"152\" font-size=\"12\" font-weight=\"700\" fill=\"#333\">Desvío estándar muestral:</text>\n  <text x=\"245\" y=\"154\" font-size=\"13\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\">s = √[ Σ(X − X̄)² / (n−1) ]</text>\n\n  <text x=\"56\" y=\"176\" font-size=\"12\" font-weight=\"700\" fill=\"#333\">Varianza:</text>\n  <text x=\"135\" y=\"176\" font-size=\"13\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\">s²</text>\n  <text x=\"165\" y=\"176\" font-size=\"11\" fill=\"#666\">(el desvío al cuadrado)</text>\n\n  <rect x=\"56\" y=\"190\" width=\"408\" height=\"120\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"68\" y=\"210\" font-size=\"11.5\" font-weight=\"700\" fill=\"#555\">Ejemplo (Fábrica B): 200, 800, 350, 650  →  X̄ = 500</text>\n  <text x=\"68\" y=\"230\" font-size=\"11\" fill=\"#333\">① Desvíos: −300, +300, −150, +150   (suman 0: por eso se elevan ²)</text>\n  <text x=\"68\" y=\"248\" font-size=\"11\" fill=\"#333\">② Cuadrados: 90.000 + 90.000 + 22.500 + 22.500 = 225.000</text>\n  <text x=\"68\" y=\"266\" font-size=\"11\" fill=\"#333\">③ Varianza: 225.000 / (4−1) = 75.000</text>\n  <text x=\"68\" y=\"284\" font-size=\"11\" fill=\"#333\">④ Desvío: √75.000 ≈ <tspan font-weight=\"700\" fill=\"#C00000\">274 unidades</tspan>  → “vende 500 ± 274 típicamente”</text>\n  <text x=\"68\" y=\"302\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Comparar: Fábrica A (490,510,495,505) → mismo X̄=500 pero s≈9. Otra empresa.</text>\n\n  <!-- ===== BLOQUE 2: POR QUE n-1 ===== -->\n  <rect x=\"500\" y=\"76\" width=\"440\" height=\"110\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"100\" font-size=\"14\" font-weight=\"700\" fill=\"#8A5A16\">2 · ¿Por qué n−1?  (grados de libertad)</text>\n  <text x=\"516\" y=\"124\" font-size=\"11.5\" fill=\"#333\">Uso una MUESTRA (pocos meses) para estimar la POBLACIÓN (todos</text>\n  <text x=\"516\" y=\"141\" font-size=\"11.5\" fill=\"#333\">los meses posibles). Dividir por n subestimaría la dispersión;</text>\n  <text x=\"516\" y=\"158\" font-size=\"11.5\" fill=\"#333\">n−1 corrige ese sesgo.</text>\n  <text x=\"516\" y=\"177\" font-size=\"11\" fill=\"#8A5A16\" font-weight=\"700\">Grados de libertad = n − 1 → también se usan para leer la tabla t.</text>\n\n  <!-- ===== BLOQUE 3: NORMAL ===== -->\n  <rect x=\"500\" y=\"200\" width=\"440\" height=\"220\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"224\" font-size=\"14\" font-weight=\"700\" fill=\"#1E6B33\">3 · Distribución normal (la campana)</text>\n\n  <!-- campana dibujada -->\n  <path d=\"M 530 330 C 580 330, 600 245, 650 245 C 700 245, 720 330, 770 330\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2.5\"/>\n  <line x1=\"650\" y1=\"245\" x2=\"650\" y2=\"336\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"530\" y1=\"336\" x2=\"770\" y2=\"336\" stroke=\"#666\" stroke-width=\"1.5\"/>\n  <text x=\"650\" y=\"352\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\">μ</text>\n  <text x=\"610\" y=\"352\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\">−1σ</text>\n  <text x=\"690\" y=\"352\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\">+1σ</text>\n  <text x=\"570\" y=\"352\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\">−2σ</text>\n  <text x=\"730\" y=\"352\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\">+2σ</text>\n  <line x1=\"610\" y1=\"336\" x2=\"610\" y2=\"330\" stroke=\"#666\" stroke-width=\"1.5\"/>\n  <line x1=\"690\" y1=\"336\" x2=\"690\" y2=\"330\" stroke=\"#666\" stroke-width=\"1.5\"/>\n  <line x1=\"570\" y1=\"336\" x2=\"570\" y2=\"330\" stroke=\"#666\" stroke-width=\"1.5\"/>\n  <line x1=\"730\" y1=\"336\" x2=\"730\" y2=\"330\" stroke=\"#666\" stroke-width=\"1.5\"/>\n\n  <text x=\"790\" y=\"250\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1E6B33\">Regla 68–95–99,7</text>\n  <text x=\"790\" y=\"270\" font-size=\"11\" fill=\"#333\">μ ± 1σ → 68%</text>\n  <text x=\"790\" y=\"288\" font-size=\"11\" fill=\"#333\">μ ± 2σ → 95%</text>\n  <text x=\"790\" y=\"306\" font-size=\"11\" fill=\"#333\">μ ± 3σ → 99,7%</text>\n\n  <text x=\"516\" y=\"380\" font-size=\"11\" fill=\"#333\">Con solo dos números (μ y σ) queda definida TODA la campana.</text>\n  <text x=\"516\" y=\"398\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Ej.: μ=500, σ=9 → el 95% de los meses vende entre 482 y 518.</text>\n\n  <!-- ===== BLOQUE 4: Z ===== -->\n  <rect x=\"40\" y=\"340\" width=\"440\" height=\"230\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"364\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">4 · Estandarización Z  (una tabla para todas las campanas)</text>\n\n  <text x=\"56\" y=\"392\" font-size=\"15\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Z = (X − μ) / σ</text>\n  <text x=\"220\" y=\"392\" font-size=\"11\" fill=\"#666\">= “a cuántos desvíos del promedio está X”</text>\n\n  <rect x=\"56\" y=\"406\" width=\"408\" height=\"112\" rx=\"6\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"68\" y=\"426\" font-size=\"11.5\" font-weight=\"700\" fill=\"#555\">Ejemplo: μ=500, σ=80 · ¿P(vender menos de 620)?</text>\n  <text x=\"68\" y=\"446\" font-size=\"11\" fill=\"#333\">① Z = (620−500)/80 = <tspan font-weight=\"700\">1,5</tspan></text>\n  <text x=\"68\" y=\"464\" font-size=\"11\" fill=\"#333\">② Tabla (área centro→Z): 0,4332</text>\n  <text x=\"68\" y=\"482\" font-size=\"11\" fill=\"#333\">③ “Menos de” ⇒ sumo la mitad izquierda: 0,5 + 0,4332 = <tspan font-weight=\"700\" fill=\"#C00000\">93,3%</tspan></text>\n  <text x=\"68\" y=\"504\" font-size=\"10.5\" fill=\"#8A5A16\" font-weight=\"700\">⚠ Verificar QUÉ área devuelve tu tabla (centro→Z vs. acumulada desde la izq.)</text>\n\n  <text x=\"56\" y=\"544\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C00000\">El número estrella: Z = 1,64 cubre el 95%</text>\n  <text x=\"56\" y=\"562\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">(cuenta inversa: busco área 0,45 en la tabla → lo usarás en stock de seguridad)</text>\n\n  <!-- ===== BLOQUE 5: t STUDENT ===== -->\n  <rect x=\"500\" y=\"434\" width=\"440\" height=\"136\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#D3C4E4\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"458\" font-size=\"14\" font-weight=\"700\" fill=\"#5B3E8E\">5 · t de Student  (la normal para pocos datos)</text>\n  <text x=\"516\" y=\"482\" font-size=\"11.5\" fill=\"#333\">Se usa cuando n es chico (&lt;30) y σ se estimó de la muestra.</text>\n  <text x=\"516\" y=\"500\" font-size=\"11.5\" fill=\"#333\">Campana más “achatada”: exige valores mayores para la misma confianza.</text>\n  <text x=\"516\" y=\"520\" font-size=\"11.5\" fill=\"#333\">Se lee con DOS entradas: <tspan font-weight=\"700\">confianza</tspan> + <tspan font-weight=\"700\">grados de libertad (n−1)</tspan>.</text>\n  <text x=\"516\" y=\"542\" font-size=\"11\" fill=\"#5B3E8E\" font-weight=\"700\">La vas a usar en regresión (Clases 8–10).</text>\n  <text x=\"516\" y=\"560\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Regla rápida: muchos datos → normal · pocos datos → t</text>\n\n  <!-- ===== CONEXION A LA MATERIA ===== -->\n  <line x1=\"490\" y1=\"586\" x2=\"490\" y2=\"606\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <rect x=\"40\" y=\"610\" width=\"900\" height=\"76\" rx=\"8\" fill=\"#EDF3F9\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"634\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">¿Dónde reaparece todo esto en la materia?</text>\n  <text x=\"58\" y=\"656\" font-size=\"11.5\" fill=\"#333\">· <tspan font-weight=\"700\">Pronósticos (U2):</tspan> medir el error del método (MAD/MSE usan desvíos)   · <tspan font-weight=\"700\">Stock de seguridad (U5):</tspan> SS = Z · σ → el Z=1,64 del 95%</text>\n  <text x=\"58\" y=\"674\" font-size=\"11.5\" fill=\"#333\">· <tspan font-weight=\"700\">Regresión (U2):</tspan> confiabilidad de la recta, intervalos de predicción (con t)   · <tspan font-weight=\"700\">Interpretación:</tspan> mismo promedio ≠ misma empresa</text>\n\n  <!-- PIE -->\n  <rect x=\"40\" y=\"702\" width=\"900\" height=\"42\" rx=\"6\" fill=\"#FAFAFA\" stroke=\"#CCC\"/>\n  <text x=\"58\" y=\"720\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">Ejercicio pendiente: ventas 120, 135, 105, 140, 100 → a) X̄ y s   b) P(X&lt;150) con Z   c) ¿Fábrica “A” o “B”? ¿qué implica para planificar?</text>\n  <text x=\"58\" y=\"737\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Material de mesa: tabla normal y t (tablas_practica_1.xlsx) — practicar su lectura desde YA.</text>\n</svg>"},{"type":"paragraph","text":"*\"Sumo todo, divido por cuántos.\"* El centro de gravedad de los datos.","html":"<em>\"Sumo todo, divido por cuántos.\"</em> El centro de gravedad de los datos."},{"type":"heading","level":3,"text":"Desvío estándar muestral","html":"Desvío estándar muestral"},{"type":"formula","tex":"s = \\sqrt{\\frac{\\sum (X - \\bar{X})^2}{n-1}}","html":"<span class=\"eq-block\">s = √<span class=\"rad\"><span class=\"frac\"><span class=\"num\">Σ (X - <span class=\"ov\">X</span>)<sup>2</sup></span><span class=\"den\">n-1</span></span></span></span>"},{"type":"paragraph","text":"*\"El error típico respecto del promedio.\"* Por qué cada pieza:","html":"<em>\"El error típico respecto del promedio.\"</em> Por qué cada pieza:"},{"type":"list","ordered":false,"items":["**(X − X̄)**: el desvío de cada dato contra el promedio.","**(...)²**: se eleva al cuadrado porque los desvíos crudos siempre suman cero (los negativos cancelan a los positivos).","**÷ (n−1)**: corrección por trabajar con una muestra (ver §3).","**√**: deshace el cuadrado y devuelve las unidades originales."],"itemsHtml":["<strong>(X − X̄)</strong>: el desvío de cada dato contra el promedio.","<strong>(...)²</strong>: se eleva al cuadrado porque los desvíos crudos siempre suman cero (los negativos cancelan a los positivos).","<strong>÷ (n−1)</strong>: corrección por trabajar con una muestra (ver §3).","<strong>√</strong>: deshace el cuadrado y devuelve las unidades originales."]},{"type":"heading","level":3,"text":"Varianza","html":"Varianza"},{"type":"formula","tex":"s^2","html":"<span class=\"eq-block\">s<sup>2</sup></span>"},{"type":"paragraph","text":"El desvío sin la raíz final. Aparece en pasos intermedios; para **interpretar**, siempre usar s (está en unidades reales).","html":"El desvío sin la raíz final. Aparece en pasos intermedios; para <strong>interpretar</strong>, siempre usar s (está en unidades reales)."},{"type":"ejemplo","title":"Ejemplo resuelto (Fábrica B: 200, 800, 350, 650 → X̄ = 500)","blocks":[{"type":"list","ordered":true,"items":["Desvíos: −300, +300, −150, +150 *(suman 0 → por eso se elevan al cuadrado)*","Cuadrados: 90.000 + 90.000 + 22.500 + 22.500 = **225.000**","Varianza: 225.000 / (4−1) = **75.000**","Desvío: √75.000 ≈ **274 unidades** → \"vende 500 ± 274 típicamente\""],"itemsHtml":["Desvíos: −300, +300, −150, +150 <em>(suman 0 → por eso se elevan al cuadrado)</em>","Cuadrados: 90.000 + 90.000 + 22.500 + 22.500 = <strong>225.000</strong>","Varianza: 225.000 / (4−1) = <strong>75.000</strong>","Desvío: √75.000 ≈ <strong>274 unidades</strong> → \"vende 500 ± 274 típicamente\""]},{"type":"paragraph","text":"Comparar: Fábrica A → mismo X̄=500, pero s ≈ 9. Otra empresa.","html":"Comparar: Fábrica A → mismo X̄=500, pero s ≈ 9. Otra empresa."}],"titleHtml":"Ejemplo resuelto (Fábrica B: 200, 800, 350, 650 → X̄ = 500)"},{"type":"heading","level":2,"text":"3. ¿Por qué n−1? (grados de libertad)","html":"3. ¿Por qué n−1? (grados de libertad)"},{"type":"paragraph","text":"Trabajamos con una **muestra** (4 meses) para estimar la **población** (todos los meses posibles). Dividir por n subestimaría la dispersión con pocos datos; **n−1 corrige ese sesgo**. Los n−1 se llaman **grados de libertad (gl)** y son también la fila con la que se entra a la tabla t.","html":"Trabajamos con una <strong>muestra</strong> (4 meses) para estimar la <strong>población</strong> (todos los meses posibles). Dividir por n subestimaría la dispersión con pocos datos; <strong>n−1 corrige ese sesgo</strong>. Los n−1 se llaman <strong>grados de libertad (gl)</strong> y son también la fila con la que se entra a la tabla t."},{"type":"paragraph","text":"*Versión para el final:* \"se divide por n−1 porque al estimar la dispersión poblacional desde una muestra, usar n produce un estimador sesgado (subestima); n−1 lo corrige.\"","html":"<em>Versión para el final:</em> \"se divide por n−1 porque al estimar la dispersión poblacional desde una muestra, usar n produce un estimador sesgado (subestima); n−1 lo corrige.\""},{"type":"heading","level":2,"text":"4. La distribución normal (la campana)","html":"4. La distribución normal (la campana)"},{"type":"paragraph","text":"Si graficás miles de observaciones de un proceso estable, se apilan en forma de **campana**: la mayoría cerca del promedio, cada vez menos hacia los extremos. Propiedad clave: **con solo μ y σ queda definida TODA la campana.**","html":"Si graficás miles de observaciones de un proceso estable, se apilan en forma de <strong>campana</strong>: la mayoría cerca del promedio, cada vez menos hacia los extremos. Propiedad clave: <strong>con solo μ y σ queda definida TODA la campana.</strong>"},{"type":"heading","level":3,"text":"Regla 68–95–99,7","html":"Regla 68–95–99,7"},{"type":"table","headers":["Intervalo","% de los casos"],"rows":[["---","---"],["μ ± 1σ","68%"],["μ ± 2σ","95%"],["μ ± 3σ","99,7%"]],"headersHtml":["Intervalo","% de los casos"],"rowsHtml":[["---","---"],["μ ± 1σ","68%"],["μ ± 2σ","95%"],["μ ± 3σ","99,7%"]]},{"type":"paragraph","text":"Ejemplo: μ=500, σ=9 → el 95% de los meses vende entre 482 y 518. Con σ=274 → entre −48 y 1048 (ni garantiza vender algo). **El desvío ES la información.**","html":"Ejemplo: μ=500, σ=9 → el 95% de los meses vende entre 482 y 518. Con σ=274 → entre −48 y 1048 (ni garantiza vender algo). <strong>El desvío ES la información.</strong>"},{"type":"heading","level":2,"text":"5. Estandarización Z: una tabla para todas las campanas","html":"5. Estandarización Z: una tabla para todas las campanas"},{"type":"formula","tex":"Z = \\frac{X - \\mu}{\\sigma}","html":"<span class=\"eq-block\">Z = <span class=\"frac\"><span class=\"num\">X - μ</span><span class=\"den\">σ</span></span></span>"},{"type":"paragraph","text":"*\"¿A cuántos desvíos del promedio está X?\"* El numerador mide la distancia; dividir por σ la expresa en \"desvíos\" en lugar de unidades. Permite usar UNA sola tabla para infinitas campanas.","html":"<em>\"¿A cuántos desvíos del promedio está X?\"</em> El numerador mide la distancia; dividir por σ la expresa en \"desvíos\" en lugar de unidades. Permite usar UNA sola tabla para infinitas campanas."},{"type":"paragraph","text":"**Despeje inverso (des-estandarización):**","html":"<strong>Despeje inverso (des-estandarización):</strong>"},{"type":"formula","tex":"X = \\mu + Z\\cdot\\sigma","html":"<span class=\"eq-block\">X = μ + Z·σ</span>"},{"type":"paragraph","text":"Es la fórmula del stock de seguridad y de los intervalos. Para cola izquierda: X = μ − Z·σ.","html":"Es la fórmula del stock de seguridad y de los intervalos. Para cola izquierda: X = μ − Z·σ."},{"type":"glosario","title":"10. Glosario de símbolos","intro":"**Convención madre: letras GRIEGAS = población (lo verdadero, desconocido) · letras LATINAS = muestra (lo que calculaste vos).**","entries":[{"simbolo":"---","nombre":"---","significado":"---","simboloHtml":"---","nombreHtml":"---","significadoHtml":"---"},{"simbolo":"X","nombre":"equis","significado":"La variable estudiada (ventas, demanda); cada dato es un valor de X","simboloHtml":"X","nombreHtml":"equis","significadoHtml":"La variable estudiada (ventas, demanda); cada dato es un valor de X"},{"simbolo":"X̄","nombre":"equis barra","significado":"**Media muestral** (promedio de TUS datos); la barra = \"promedio de\"","simboloHtml":"X̄","nombreHtml":"equis barra","significadoHtml":"<strong>Media muestral</strong> (promedio de TUS datos); la barra = \"promedio de\""},{"simbolo":"μ","nombre":"mu","significado":"**Media poblacional**: el promedio verdadero, que se estima con X̄","simboloHtml":"μ","nombreHtml":"mu","significadoHtml":"<strong>Media poblacional</strong>: el promedio verdadero, que se estima con X̄"},{"simbolo":"s","nombre":"ese","significado":"**Desvío estándar muestral** (dividiendo por n−1)","simboloHtml":"s","nombreHtml":"ese","significadoHtml":"<strong>Desvío estándar muestral</strong> (dividiendo por n−1)"},{"simbolo":"σ","nombre":"sigma (minúsc.)","significado":"**Desvío estándar poblacional**: el verdadero; s es su estimación","simboloHtml":"σ","nombreHtml":"sigma (minúsc.)","significadoHtml":"<strong>Desvío estándar poblacional</strong>: el verdadero; s es su estimación"},{"simbolo":"s², σ²","nombre":"...cuadrado","significado":"**Varianza** muestral / poblacional (desvío al cuadrado)","simboloHtml":"s², σ²","nombreHtml":"...cuadrado","significadoHtml":"<strong>Varianza</strong> muestral / poblacional (desvío al cuadrado)"},{"simbolo":"Σ","nombre":"sigma MAYÚSC.","significado":"**Sumatoria**: \"sumá todo lo que sigue\". ¡No confundir con σ!","simboloHtml":"Σ","nombreHtml":"sigma MAYÚSC.","significadoHtml":"<strong>Sumatoria</strong>: \"sumá todo lo que sigue\". ¡No confundir con σ!"},{"simbolo":"√","nombre":"raíz cuadrada","significado":"Deshace el cuadrado; devuelve unidades originales","simboloHtml":"√","nombreHtml":"raíz cuadrada","significadoHtml":"Deshace el cuadrado; devuelve unidades originales"},{"simbolo":"n","nombre":"ene","significado":"**Tamaño de la muestra** (cuántos datos)","simboloHtml":"n","nombreHtml":"ene","significadoHtml":"<strong>Tamaño de la muestra</strong> (cuántos datos)"},{"simbolo":"n−1 / gl / df","nombre":"grados de libertad","significado":"Corrección muestral; fila de entrada a la tabla t","simboloHtml":"n−1 / gl / df","nombreHtml":"grados de libertad","significadoHtml":"Corrección muestral; fila de entrada a la tabla t"},{"simbolo":"P( )","nombre":"probabilidad de","significado":"P(X<620) = \"prob. de que X sea menor que 620\"; entre 0 y 1","simboloHtml":"P( )","nombreHtml":"probabilidad de","significadoHtml":"P(X&lt;620) = \"prob. de que X sea menor que 620\"; entre 0 y 1"},{"simbolo":"Z","nombre":"zeta","significado":"**Valor estandarizado**: a cuántos desvíos del promedio está un valor","simboloHtml":"Z","nombreHtml":"zeta","significadoHtml":"<strong>Valor estandarizado</strong>: a cuántos desvíos del promedio está un valor"},{"simbolo":"t","nombre":"te (de Student)","significado":"Primo de Z para muestras chicas (colas más gordas). \"Student\" = seudónimo de W. Gosset, cervecería Guinness","simboloHtml":"t","nombreHtml":"te (de Student)","significadoHtml":"Primo de Z para muestras chicas (colas más gordas). \"Student\" = seudónimo de W. Gosset, cervecería Guinness"},{"simbolo":"E(X)","nombre":"esperanza de X","significado":"Valor esperado (promedio a largo plazo de una v. aleatoria)","simboloHtml":"E(X)","nombreHtml":"esperanza de X","significadoHtml":"Valor esperado (promedio a largo plazo de una v. aleatoria)"},{"simbolo":"Ŷ","nombre":"i griega sombrero","significado":"**^ = estimado/pronosticado**. Y = real; Ŷ = lo que el modelo predijo","simboloHtml":"Ŷ","nombreHtml":"i griega sombrero","significadoHtml":"<strong>^ = estimado/pronosticado</strong>. Y = real; Ŷ = lo que el modelo predijo"},{"simbolo":"e","nombre":"error / residual","significado":"e = Y − Ŷ (real menos pronosticado); materia prima de MAD/MSE/MAPE","simboloHtml":"e","nombreHtml":"error / residual","significadoHtml":"e = Y − Ŷ (real menos pronosticado); materia prima de MAD/MSE/MAPE"},{"simbolo":"r","nombre":"erre","significado":"**Coeficiente de correlación** (−1 a +1); Clase 2","simboloHtml":"r","nombreHtml":"erre","significadoHtml":"<strong>Coeficiente de correlación</strong> (−1 a +1); Clase 2"},{"simbolo":"r², R²","nombre":"erre cuadrado","significado":"**Coef. de determinación**: % de variación de Y que explica el modelo","simboloHtml":"r², R²","nombreHtml":"erre cuadrado","significadoHtml":"<strong>Coef. de determinación</strong>: % de variación de Y que explica el modelo"},{"simbolo":"α, β, γ","nombre":"alfa, beta, gamma","significado":"En suavizado: **constantes de atenuación** (nivel/tendencia/estacionalidad, entre 0 y 1). ⚠ α tiene otro significado en tests (nivel de significancia)","simboloHtml":"α, β, γ","nombreHtml":"alfa, beta, gamma","significadoHtml":"En suavizado: <strong>constantes de atenuación</strong> (nivel/tendencia/estacionalidad, entre 0 y 1). ⚠ α tiene otro significado en tests (nivel de significancia)"},{"simbolo":"b₀, b₁","nombre":"be sub cero/uno","significado":"Coeficientes de la recta de regresión: ordenada al origen y pendiente","simboloHtml":"b₀, b₁","nombreHtml":"be sub cero/uno","significadoHtml":"Coeficientes de la recta de regresión: ordenada al origen y pendiente"},{"simbolo":"Yₜ","nombre":"i griega sub te","significado":"Valor de la serie en el período t; Yₜ₋₁ = período anterior","simboloHtml":"Yₜ","nombreHtml":"i griega sub te","significadoHtml":"Valor de la serie en el período t; Yₜ₋₁ = período anterior"}],"introHtml":"<strong>Convención madre: letras GRIEGAS = población (lo verdadero, desconocido) · letras LATINAS = muestra (lo que calculaste vos).</strong>","titleHtml":"10. Glosario de símbolos"},{"type":"paragraph","text":"*Consejo de examen: usar la notación correcta (X̄ y no \"prom\"; σ si es dato, s si lo calculaste) suma en el criterio \"vocabulario específico\".*","html":"<em>Consejo de examen: usar la notación correcta (X̄ y no \"prom\"; σ si es dato, s si lo calculaste) suma en el criterio \"vocabulario específico\".</em>"},{"type":"heading","level":2,"text":"12. Mini-resúmenes oficiales de las clases","html":"12. Mini-resúmenes oficiales de las clases"},{"type":"callout","kind":"idea","text":"**Clase 1.** El promedio dice el centro; el desvío estándar (s = √[Σ(X−X̄)²/(n−1)]) dice la dispersión típica — es el número clave de la materia. Varianza = desvío². Normal: 68/95/99,7% dentro de ±1/2/3σ. Estandarización Z=(X−μ)/σ permite usar una sola tabla; Z=1,64 cubre el 95% (clave en stock de seguridad). t de Student: como la normal pero para muestras chicas, se lee con grados de libertad (n−1). Verificar siempre qué área devuelve la tabla que uso.","html":"<strong>Clase 1.</strong> El promedio dice el centro; el desvío estándar (s = √[Σ(X−X̄)²/(n−1)]) dice la dispersión típica — es el número clave de la materia. Varianza = desvío². Normal: 68/95/99,7% dentro de ±1/2/3σ. Estandarización Z=(X−μ)/σ permite usar una sola tabla; Z=1,64 cubre el 95% (clave en stock de seguridad). t de Student: como la normal pero para muestras chicas, se lee con grados de libertad (n−1). Verificar siempre qué área devuelve la tabla que uso."},{"type":"heading","level":2,"text":"13. Dónde reaparece todo esto","html":"13. Dónde reaparece todo esto"},{"type":"table","headers":["Concepto","Reaparece en"],"rows":[["---","---"],["Desvío estándar","Error de pronóstico (MAD/MSE), stock de seguridad, regresión"],["Z y caso 5 inverso","**Stock de seguridad: SS = Z·σ** (U5)"],["t de Student","Intervalos de predicción en regresión (U2, Clases 8–10)"],["Interpretación X̄ vs. s","\"Mismo promedio ≠ misma empresa\" — tipo de justificación que puntúa la cátedra"]],"headersHtml":["Concepto","Reaparece en"],"rowsHtml":[["---","---"],["Desvío estándar","Error de pronóstico (MAD/MSE), stock de seguridad, regresión"],["Z y caso 5 inverso","<strong>Stock de seguridad: SS = Z·σ</strong> (U5)"],["t de Student","Intervalos de predicción en regresión (U2, Clases 8–10)"],["Interpretación X̄ vs. s","\"Mismo promedio ≠ misma empresa\" — tipo de justificación que puntúa la cátedra"]]},{"type":"paragraph","text":"**Láminas SVG asociadas:** `Clase01_BaseEstadistica.svg` · `Clase01b_TablaZ_5Casos.svg`\n**Material de mesa:** tabla normal y t (`tablas_practica_1.xlsx` del Drive) — practicar su lectura desde ya.","html":"<strong>Láminas SVG asociadas:</strong> <code>Clase01_BaseEstadistica.svg</code> · <code>Clase01b_TablaZ_5Casos.svg</code>\n<strong>Material de mesa:</strong> tabla normal y t (<code>tablas_practica_1.xlsx</code> del Drive) — practicar su lectura desde ya."},{"type":"paragraph","text":"**Próxima clase → Clase 2: Correlación** (diagramas de dispersión, coeficiente r, correlación ≠ causalidad): el puente entre esta base y los pronósticos.","html":"<strong>Próxima clase → Clase 2: Correlación</strong> (diagramas de dispersión, coeficiente r, correlación ≠ causalidad): el puente entre esta base y los pronósticos."}],"historias":[{"type":"concepto","k":"La idea","title":"El promedio, solo, engaña.","text":"El promedio dice el CENTRO de los datos. El desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio te miente. Es el protagonista silencioso de la materia.","html":"El promedio dice el CENTRO de los datos. El desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio te miente. Es el protagonista silencioso de la materia.","titleHtml":"El promedio, solo, engaña."},{"type":"concepto","k":"Mirá los números","title":"Mismo promedio, otra empresa.","text":"Dos fábricas, cuatro meses, las dos promedian 500. La A casi no se mueve (490, 510, 495, 505). La B salta de 200 a 800 (200, 800, 350, 650).","svg":"<svg viewBox=\"0 0 280 150\" width=\"100%\" height=\"150\" aria-hidden=\"true\">\n  <line x1=\"36\" y1=\"16\" x2=\"36\" y2=\"118\" stroke=\"rgba(255,255,255,.25)\" stroke-width=\"1\"/>\n  <line x1=\"36\" y1=\"118\" x2=\"268\" y2=\"118\" stroke=\"rgba(255,255,255,.25)\" stroke-width=\"1\"/>\n  <line x1=\"36\" y1=\"62.4\" x2=\"260\" y2=\"62.4\" stroke=\"rgba(232,197,106,.7)\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <text x=\"32\" y=\"59\" font-size=\"9\" fill=\"#e8c56a\" text-anchor=\"end\">500</text>\n  <polyline fill=\"none\" stroke=\"#e25b16\" stroke-width=\"2.4\" points=\"56,95.8 114,29.1 172,79.1 230,45.8\"/>\n  <circle cx=\"56\" cy=\"95.8\" r=\"3\" fill=\"#e25b16\"/><circle cx=\"114\" cy=\"29.1\" r=\"3\" fill=\"#e25b16\"/>\n  <circle cx=\"172\" cy=\"79.1\" r=\"3\" fill=\"#e25b16\"/><circle cx=\"230\" cy=\"45.8\" r=\"3\" fill=\"#e25b16\"/>\n  <polyline fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.6\" points=\"56,63.6 114,61.3 172,63.0 230,61.9\"/>\n  <circle cx=\"56\" cy=\"63.6\" r=\"3\" fill=\"#8cb4d6\"/><circle cx=\"114\" cy=\"61.3\" r=\"3\" fill=\"#8cb4d6\"/>\n  <circle cx=\"172\" cy=\"63.0\" r=\"3\" fill=\"#8cb4d6\"/><circle cx=\"230\" cy=\"61.9\" r=\"3\" fill=\"#8cb4d6\"/>\n  <text x=\"56\" y=\"132\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">Mes 1</text>\n  <text x=\"114\" y=\"132\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">Mes 2</text>\n  <text x=\"172\" y=\"132\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">Mes 3</text>\n  <text x=\"230\" y=\"132\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">Mes 4</text>\n  <text x=\"48\" y=\"14\" font-size=\"10\" fill=\"#8cb4d6\" font-weight=\"700\">A (estable)</text>\n  <text x=\"130\" y=\"14\" font-size=\"10\" fill=\"#e25b16\" font-weight=\"700\">B (dispersa)</text>\n</svg>","chartLabel":"Ventas de 4 meses · promedio 500 en las dos","ejemplo":"A la A se la planifica tranquilo. La B necesita depósitos grandes, stock de seguridad enorme y pronósticos con margen.","html":"Dos fábricas, cuatro meses, las dos promedian 500. La A casi no se mueve (490, 510, 495, 505). La B salta de 200 a 800 (200, 800, 350, 650).","titleHtml":"Mismo promedio, otra empresa."},{"type":"pregunta","k":"A ver…","title":"Las dos fábricas promedian 500. ¿Qué las diferencia?","options":["El tipo de producto que fabrican","Cuánto se dispersan los datos alrededor del promedio","La cantidad de meses que se midieron"],"correct":1,"feedback":"Lo que las diferencia es la dispersión alrededor del promedio: el desvío estándar. Mismo promedio, realidades opuestas.","titleHtml":"Las dos fábricas promedian 500. ¿Qué las diferencia?"},{"type":"concepto","k":"Las fórmulas","title":"Centro, dispersión y varianza.","text":"Media muestral: «sumo todo, divido por cuántos». Es el centro de gravedad de los datos.","formula":"X̄ = ΣX / n\ns = √[ Σ(X − X̄)² / (n−1) ]\nVarianza = s²","ejemplo":"s es «el error típico respecto del promedio». Se eleva al cuadrado porque los desvíos crudos siempre suman cero. Se divide por n−1 porque es una muestra. La raíz devuelve las unidades originales. La varianza aparece en el medio; para interpretar, usá s.","formulaHtml":"<span class=\"eq-block\">X̄ = ΣX / n s = √[ Σ(X − X̄)² / (n−1) ] Varianza = s²</span>","html":"Media muestral: «sumo todo, divido por cuántos». Es el centro de gravedad de los datos.","titleHtml":"Centro, dispersión y varianza."},{"type":"concepto","k":"Paso a paso","title":"La Fábrica B vende 500 ± 274.","text":"Datos: 200, 800, 350, 650 → X̄ = 500. Desvíos: −300, +300, −150, +150 (suman 0: por eso se elevan al cuadrado). Cuadrados = 225.000. Varianza: 225.000 / (4−1) = 75.000. Desvío: √75.000 ≈ 274.","svg":"<svg viewBox=\"0 0 280 86\" width=\"100%\" height=\"86\" aria-hidden=\"true\">\n  <text x=\"8\" y=\"16\" font-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\">A · 500 ± 9</text>\n  <line x1=\"20\" y1=\"32\" x2=\"260\" y2=\"32\" stroke=\"rgba(255,255,255,.15)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  <line x1=\"133\" y1=\"32\" x2=\"147\" y2=\"32\" stroke=\"#8cb4d6\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  <circle cx=\"140\" cy=\"32\" r=\"4\" fill=\"#e8c56a\"/>\n  <text x=\"8\" y=\"58\" font-size=\"11\" fill=\"#e25b16\" font-weight=\"700\">B · 500 ± 274</text>\n  <line x1=\"20\" y1=\"74\" x2=\"260\" y2=\"74\" stroke=\"rgba(255,255,255,.15)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  <line x1=\"54\" y1=\"74\" x2=\"226\" y2=\"74\" stroke=\"#e25b16\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  <circle cx=\"140\" cy=\"74\" r=\"4\" fill=\"#e8c56a\"/>\n</svg>","chartLabel":"Mismo centro, otra dispersión","ejemplo":"La A, con el mismo promedio, tiene s ≈ 9. Otra empresa.","html":"Datos: 200, 800, 350, 650 → X̄ = 500. Desvíos: −300, +300, −150, +150 (suman 0: por eso se elevan al cuadrado). Cuadrados = 225.000. Varianza: 225.000 / (4−1) = 75.000. Desvío: √75.000 ≈ 274.","titleHtml":"La Fábrica B vende 500 ± 274."},{"type":"pregunta","k":"A ver…","title":"Las dos promedian 500. A tiene s ≈ 9 y B tiene s ≈ 274. ¿Cuál necesita más stock de seguridad?","options":["La A, porque vende más estable","La B, porque sus ventas se dispersan mucho","Da igual: mismo promedio, mismo plan"],"correct":1,"feedback":"A la A se la planifica tranquilo. La B, con s ≈ 274, necesita depósitos grandes, stock de seguridad enorme y pronósticos con margen. El desvío es la información.","titleHtml":"Las dos promedian 500. A tiene s ≈ 9 y B tiene s ≈ 274. ¿Cuál necesita más stock de seguridad?"},{"type":"concepto","k":"Un detalle que importa","title":"¿Por qué se divide por n − 1?","text":"Usás una muestra (4 meses) para estimar la población (todos los meses posibles). Dividir por n subestimaría la dispersión; n−1 corrige ese sesgo.","ejemplo":"Esos n−1 se llaman grados de libertad (gl): también son la fila con la que entrás a la tabla t. Versión para el final: usar n produce un estimador sesgado (subestima); n−1 lo corrige.","html":"Usás una muestra (4 meses) para estimar
