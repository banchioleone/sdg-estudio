 la población (todos los meses posibles). Dividir por n subestimaría la dispersión; n−1 corrige ese sesgo.","titleHtml":"¿Por qué se divide por n − 1?"},{"type":"concepto","k":"La campana","title":"Con μ y σ queda definida toda la campana.","text":"Si graficás muchas observaciones de un proceso estable, se apilan en forma de campana: la mayoría cerca del promedio, cada vez menos hacia los extremos.","svg":"<svg viewBox=\"0 0 280 130\" width=\"100%\" height=\"130\" aria-hidden=\"true\">\n  <path d=\"M 16 108 C 40 108, 58 22, 140 22 C 222 22, 240 108, 264 108\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.4\"/>\n  <line x1=\"20\" y1=\"108\" x2=\"260\" y2=\"108\" stroke=\"rgba(255,255,255,.3)\" stroke-width=\"1.2\"/>\n  <line x1=\"140\" y1=\"22\" x2=\"140\" y2=\"108\" stroke=\"rgba(232,197,106,.7)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"100\" y1=\"108\" x2=\"100\" y2=\"100\" stroke=\"#9aa3ad\"/><line x1=\"180\" y1=\"108\" x2=\"180\" y2=\"100\" stroke=\"#9aa3ad\"/>\n  <line x1=\"60\" y1=\"108\" x2=\"60\" y2=\"100\" stroke=\"#9aa3ad\"/><line x1=\"220\" y1=\"108\" x2=\"220\" y2=\"100\" stroke=\"#9aa3ad\"/>\n  <line x1=\"28\" y1=\"108\" x2=\"28\" y2=\"100\" stroke=\"#9aa3ad\"/><line x1=\"252\" y1=\"108\" x2=\"252\" y2=\"100\" stroke=\"#9aa3ad\"/>\n  <text x=\"140\" y=\"122\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ</text>\n  <text x=\"100\" y=\"122\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">−1σ</text>\n  <text x=\"180\" y=\"122\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">+1σ</text>\n  <text x=\"60\" y=\"122\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">−2σ</text>\n  <text x=\"220\" y=\"122\" font-size=\"9\" fill=\"#9aa3ad\" text-anchor=\"middle\">+2σ</text>\n  <text x=\"168\" y=\"40\" font-size=\"11\" fill=\"#f3f1ea\" font-weight=\"700\">68%  ·  ±1σ</text>\n  <text x=\"168\" y=\"56\" font-size=\"11\" fill=\"#f3f1ea\">95%  ·  ±2σ</text>\n  <text x=\"168\" y=\"72\" font-size=\"11\" fill=\"#f3f1ea\">99,7%  ·  ±3σ</text>\n</svg>","chartLabel":"Regla 68–95–99,7","ejemplo":"μ = 500 y σ = 9: el 95% de los meses vende entre 482 y 518. Con σ = 274, el intervalo va de −48 a 1.048 (ni garantiza vender algo). El desvío ES la información.","html":"Si graficás muchas observaciones de un proceso estable, se apilan en forma de campana: la mayoría cerca del promedio, cada vez menos hacia los extremos.","titleHtml":"Con μ y σ queda definida toda la campana."},{"type":"pregunta","k":"A ver…","title":"Si μ = 500 y σ = 9, el 95% de los meses vende entre…","options":["491 y 509 (eso es μ ± 1σ, el 68%)","482 y 518 (μ ± 2σ)","473 y 527 (eso es μ ± 3σ, el 99,7%)"],"correct":1,"feedback":"Regla 68–95–99,7: el 95% está en μ ± 2σ. 500 ± 2×9 = 482 a 518.","titleHtml":"Si μ = 500 y σ = 9, el 95% de los meses vende entre…"},{"type":"concepto","k":"Una sola tabla","title":"Z te dice a cuántos desvíos estás.","text":"Z = (X − μ) / σ. El numerador es la distancia; al dividir por σ la expresás en desvíos. Así usás UNA tabla para todas las campanas. Al revés: X = μ + Z·σ (es la fórmula del stock de seguridad).","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\">\n  <path d=\"M 20 100 C 70 100, 95 28, 140 28 C 185 28, 210 100, 260 100 L 20 100 Z\" fill=\"rgba(140,180,214,.35)\"/>\n  <path d=\"M 20 100 C 70 100, 95 28, 140 28 C 185 28, 210 100, 260 100\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.2\"/>\n  <line x1=\"16\" y1=\"100\" x2=\"264\" y2=\"100\" stroke=\"rgba(255,255,255,.3)\"/>\n  <line x1=\"140\" y1=\"28\" x2=\"140\" y2=\"100\" stroke=\"rgba(232,197,106,.75)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"58\" stroke=\"#e25b16\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"114\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ = 500</text>\n  <text x=\"200\" y=\"114\" font-size=\"10\" fill=\"#e25b16\" text-anchor=\"middle\" font-weight=\"700\">620 · Z=1,5</text>\n  <text x=\"48\" y=\"86\" font-size=\"11\" fill=\"#f3f1ea\" font-weight=\"700\">0,5 + 0,4332</text>\n  <text x=\"48\" y=\"72\" font-size=\"12\" fill=\"#e8c56a\" font-weight=\"700\">93,3%</text>\n</svg>","chartLabel":"μ = 500, σ = 80 · P(X < 620)","ejemplo":"Z = (620−500)/80 = 1,5. Tabla centro→Z: 0,4332. «Menos de» = 0,5 + 0,4332 = 93,3%. Verificá siempre qué área devuelve tu tabla (centro→Z vs. acumulada). El número estrella: Z = 1,64 cubre el 95%.","html":"Z = (X − μ) / σ. El numerador es la distancia; al dividir por σ la expresás en desvíos. Así usás UNA tabla para todas las campanas. Al revés: X = μ + Z·σ (es la fórmula del stock de seguridad).","titleHtml":"Z te dice a cuántos desvíos estás."},{"type":"concepto","k":"Pocos datos","title":"Con muestras chicas, entra t de Student.","text":"Cuando n es chico (menos de 30) y σ se estimó de la muestra, la campana de t es más achatada, con colas más gordas. Para la misma confianza exige un valor mayor que Z: con tan pocos datos, cubrite más.","ejemplo":"Se lee con dos entradas: confianza + grados de libertad (n−1). Regla para el final: n < 30 y desvío estimado de la muestra → t; n ≥ 30 o σ conocido → Z; en regresión, siempre t.","html":"Cuando n es chico (menos de 30) y σ se estimó de la muestra, la campana de t es más achatada, con colas más gordas. Para la misma confianza exige un valor mayor que Z: con tan pocos datos, cubrite más.","titleHtml":"Con muestras chicas, entra t de Student."},{"type":"pregunta","k":"A ver…","title":"Tenés 5 meses de ventas y estimaste s de esa muestra. Para un intervalo del 95%, ¿qué usás?","options":["La normal (Z = 1,96), porque es más simple","t de Student, con 4 grados de libertad","Da igual: con 5 datos Z y t coinciden"],"correct":1,"feedback":"n < 30 y desvío estimado de la muestra → t con n−1 gl. Acá n = 5, gl = 4. La t exige un multiplicador mayor (2,776 contra Z = 1,96) porque hay pocos datos.","titleHtml":"Tenés 5 meses de ventas y estimaste s de esa muestra. Para un intervalo del 95%, ¿qué usás?"},{"type":"concepto","k":"En la materia","title":"El desvío vuelve a aparecer.","text":"En el error de pronósticos (MAD y MSE usan desvíos), en el stock de seguridad (SS = Z·σ, con el Z = 1,64 del 95%) y en la confiabilidad de la regresión (intervalos con t).","ejemplo":"«Mismo promedio ≠ misma empresa» es el tipo de justificación que puntúa la cátedra.","html":"En el error de pronósticos (MAD y MSE usan desvíos), en el stock de seguridad (SS = Z·σ, con el Z = 1,64 del 95%) y en la confiabilidad de la regresión (intervalos con t).","titleHtml":"El desvío vuelve a aparecer."},{"type":"cierre","title":"Llevate esto de la Clase 1.","text":"El promedio dice el centro; el desvío (s) dice la dispersión típica y es el número clave. Varianza = s². Normal: 68/95/99,7% en ±1/2/3σ. Z = (X−μ)/σ; Z = 1,64 cubre el 95%. t es para muestras chicas, con gl = n−1. Siguiente: Clase 1.b, la tabla Z y los 5 casos.","html":"El promedio dice el centro; el desvío (s) dice la dispersión típica y es el número clave. Varianza = s². Normal: 68/95/99,7% en ±1/2/3σ. Z = (X−μ)/σ; Z = 1,64 cubre el 95%. t es para muestras chicas, con gl = n−1. Siguiente: Clase 1.b, la tabla Z y los 5 casos.","titleHtml":"Llevate esto de la Clase 1."}],"titleHtml":"Clase 1 · Base estadística","ledeHtml":"el promedio dice el CENTRO de los datos; el desvío estándar dice la DISPERSIÓN. Sin el desvío, el promedio engaña. El desvío es el protagonista silencioso de la materia: reaparece en el error de pronósticos (U2), en el stock de seguridad (U5) y en la confiabilidad de la regresión (U2)."},"c1b":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c1b","title":"Clase 1.b · Tabla Z","name":"Tabla Z","lede":"Clase 1.b. Paso cero: identificar la tabla (Z=1,00 → 0,3413 centro→Z / 0,8413 acumulada). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que (0,5+área), más-que (0,5−área), Z negativo (simetría), entre-dos (distinto lado sumo / mismo lado resto), inverso (tabla al revés + X=μ±Z·σ). Z famosos: 1,28/1,64/1,96/2,33. t de Student: colas gordas, 2 entradas (confianza + gl=n−1), converge a Z en n≈30; en regresión siempre t.","visto":true,"source":["clases_previas/SG/Clase01_y_01b_BaseEstadistica.md","clases_previas/SG/Clase01b_TablaZ_5Casos.svg"],"laminas":["u2/img/Clase01b_TablaZ_5Casos.svg"],"next":"Clase 2 · Correlación","teoria":[{"type":"callout","kind":"idea","text":"**Clase 1.b.** Paso cero: identificar la tabla (Z=1,00 → 0,3413 centro→Z / 0,8413 acumulada). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que (0,5+área), más-que (0,5−área), Z negativo (simetría), entre-dos (distinto lado sumo / mismo lado resto), inverso (tabla al revés + X=μ±Z·σ). Z famosos: 1,28/1,64/1,96/2,33. t de Student: colas gordas, 2 entradas (confianza + gl=n−1), converge a Z en n≈30; en regresión siempre t.","html":"<strong>Clase 1.b.</strong> Paso cero: identificar la tabla (Z=1,00 → 0,3413 centro→Z / 0,8413 acumulada). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que (0,5+área), más-que (0,5−área), Z negativo (simetría), entre-dos (distinto lado sumo / mismo lado resto), inverso (tabla al revés + X=μ±Z·σ). Z famosos: 1,28/1,64/1,96/2,33. t de Student: colas gordas, 2 entradas (confianza + gl=n−1), converge a Z en n≈30; en regresión siempre t."},{"type":"svg","file":"u2/img/Clase01b_TablaZ_5Casos.svg","caption":"Lámina de la Clase 1.b · La tabla normal Z — los 5 casos","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 1000\" width=\"980\" height=\"1000\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <rect width=\"980\" height=\"1000\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">CLASE 1.b · La tabla normal Z — los 5 casos</text>\n  <text x=\"560\" y=\"34\" font-size=\"12\" fill=\"#666\">Ejemplo base: μ=500, σ=80 · tabla “centro→Z”</text>\n\n  <!-- IDENTIFICAR TABLA -->\n  <rect x=\"40\" y=\"48\" width=\"900\" height=\"54\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"70\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">⚠ PASO CERO — identificá tu tabla: buscá Z=1,00.</text>\n  <text x=\"56\" y=\"90\" font-size=\"11.5\" fill=\"#333\">Si dice <tspan font-weight=\"700\">0,3413</tspan> → tabla “centro→Z” (máx. 0,5; la usual en UTN y la de esta lámina). Si dice <tspan font-weight=\"700\">0,8413</tspan> → “acumulada” (ya incluye el 0,5 izquierdo).</text>\n\n  <!-- METODO -->\n  <rect x=\"40\" y=\"112\" width=\"900\" height=\"40\" rx=\"8\" fill=\"#EDF3F9\" stroke=\"#1F4E79\"/>\n  <text x=\"56\" y=\"137\" font-size=\"12\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODO (siempre igual):  ① Z=(X−μ)/σ   ② dibujar campana y PINTAR el área pedida   ③ tabla   ④ armar con ±0,5 (cada mitad vale 0,5)</text>\n\n  <!-- ============ FILA 1: CASOS 1 y 2 ============ -->\n  <!-- CASO 1 -->\n  <rect x=\"40\" y=\"164\" width=\"440\" height=\"188\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"186\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">CASO 1 · “Menos que” X mayor al promedio</text>\n  <text x=\"56\" y=\"204\" font-size=\"11.5\" fill=\"#333\">P(X &lt; 620) → Z = (620−500)/80 = <tspan font-weight=\"700\">+1,5</tspan></text>\n  <!-- campana: area izquierda + centro a Z pintada -->\n  <path d=\"M 70 320 C 115 320, 133 244, 175 244 C 217 244, 235 320, 280 320 L 70 320 Z\" fill=\"#9DC3E6\" opacity=\"0.75\"/>\n  <path d=\"M 280 320 C 296 320, 306 308, 320 302 L 320 320 Z\" fill=\"none\"/>\n  <path d=\"M 70 320 C 115 320, 133 244, 175 244 C 217 244, 235 320, 320 320\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"175\" y1=\"244\" x2=\"175\" y2=\"324\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"280\" y1=\"320\" x2=\"280\" y2=\"290\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <line x1=\"60\" y1=\"320\" x2=\"330\" y2=\"320\" stroke=\"#555\" stroke-width=\"1.5\"/>\n  <text x=\"175\" y=\"338\" font-size=\"10\" fill=\"#333\" text-anchor=\"middle\">μ=500</text>\n  <text x=\"280\" y=\"338\" font-size=\"10\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">620 (Z=1,5)</text>\n  <text x=\"350\" y=\"256\" font-size=\"11\" fill=\"#333\">pinto TODO lo</text>\n  <text x=\"350\" y=\"272\" font-size=\"11\" fill=\"#333\">izquierdo de 620:</text>\n  <text x=\"350\" y=\"294\" font-size=\"11.5\" fill=\"#333\">0,5 + tabla(1,5)</text>\n  <text x=\"350\" y=\"312\" font-size=\"11.5\" fill=\"#333\">= 0,5 + 0,4332</text>\n  <text x=\"350\" y=\"332\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">= 93,3%</text>\n\n  <!-- CASO 2 -->\n  <rect x=\"500\" y=\"164\" width=\"440\" height=\"188\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"186\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">CASO 2 · “Más que” X mayor al promedio</text>\n  <text x=\"516\" y=\"204\" font-size=\"11.5\" fill=\"#333\">P(X &gt; 620) → mismo Z = +1,5 · pinto la colita derecha</text>\n  <path d=\"M 740 290 C 748 302, 760 314, 780 320 L 740 320 Z\" fill=\"#9DC3E6\" opacity=\"0.85\"/>\n  <path d=\"M 530 320 C 575 320, 593 244, 635 244 C 677 244, 695 320, 780 320\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"635\" y1=\"244\" x2=\"635\" y2=\"324\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"740\" y1=\"320\" x2=\"740\" y2=\"288\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <line x1=\"520\" y1=\"320\" x2=\"790\" y2=\"320\" stroke=\"#555\" stroke-width=\"1.5\"/>\n  <text x=\"635\" y=\"338\" font-size=\"10\" fill=\"#333\" text-anchor=\"middle\">μ=500</text>\n  <text x=\"740\" y=\"338\" font-size=\"10\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">620</text>\n  <text x=\"810\" y=\"256\" font-size=\"11\" fill=\"#333\">la mitad derecha</text>\n  <text x=\"810\" y=\"272\" font-size=\"11\" fill=\"#333\">vale 0,5; le quito</text>\n  <text x=\"810\" y=\"288\" font-size=\"11\" fill=\"#333\">lo pintado del c.1:</text>\n  <text x=\"810\" y=\"308\" font-size=\"11.5\" fill=\"#333\">0,5 − 0,4332</text>\n  <text x=\"810\" y=\"328\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">= 6,7%</text>\n\n  <!-- ============ FILA 2: CASOS 3 y 4 ============ -->\n  <!-- CASO 3 -->\n  <rect x=\"40\" y=\"364\" width=\"440\" height=\"196\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"386\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">CASO 3 · Z NEGATIVO (X menor al promedio)</text>\n  <text x=\"56\" y=\"404\" font-size=\"11.5\" fill=\"#333\">P(X &lt; 420) → Z = (420−500)/80 = <tspan font-weight=\"700\">−1,0</tspan></text>\n  <text x=\"56\" y=\"421\" font-size=\"11\" fill=\"#1E6B33\" font-weight=\"700\">La tabla no tiene negativos: por SIMETRÍA busco Z=+1,00 → 0,3413</text>\n  <path d=\"M 70 528 C 90 528, 102 518, 112 508 L 112 528 Z\" fill=\"#A9D6B0\" opacity=\"0.9\"/>\n  <path d=\"M 70 528 C 115 528, 133 452, 175 452 C 217 452, 235 528, 320 528\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <line x1=\"175\" y1=\"452\" x2=\"175\" y2=\"532\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"112\" y1=\"528\" x2=\"112\" y2=\"505\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <line x1=\"60\" y1=\"528\" x2=\"330\" y2=\"528\" stroke=\"#555\" stroke-width=\"1.5\"/>\n  <text x=\"175\" y=\"546\" font-size=\"10\" fill=\"#333\" text-anchor=\"middle\">μ=500</text>\n  <text x=\"112\" y=\"546\" font-size=\"10\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">420 (Z=−1)</text>\n  <text x=\"350\" y=\"464\" font-size=\"11\" fill=\"#333\">pinto la colita</text>\n  <text x=\"350\" y=\"480\" font-size=\"11\" fill=\"#333\">izquierda de 420:</text>\n  <text x=\"350\" y=\"502\" font-size=\"11.5\" fill=\"#333\">0,5 − 0,3413</text>\n  <text x=\"350\" y=\"522\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">= 15,9%</text>\n  <text x=\"350\" y=\"546\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">chequeo: bajo μ ⇒ &lt;50% ✔</text>\n\n  <!-- CASO 4 -->\n  <rect x=\"500\" y=\"364\" width=\"440\" height=\"196\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"386\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">CASO 4 · ENTRE dos valores</text>\n  <text x=\"516\" y=\"404\" font-size=\"11.5\" fill=\"#333\">P(420 &lt; X &lt; 620): áreas 0,3413 (izq) y 0,4332 (der)</text>\n  <path d=\"M 592 585 C 600 570, 610 532, 635 532 C 660 532, 672 562, 697 578 C 703 582, 710 585, 718 587 L 718 608 L 592 608 Z\" fill=\"#A9D6B0\" opacity=\"0.85\"/>\n  <path d=\"M 530 608 C 575 608, 593 532, 635 532 C 677 532, 695 608, 780 608\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <line x1=\"635\" y1=\"532\" x2=\"635\" y2=\"612\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <line x1=\"592\" y1=\"608\" x2=\"592\" y2=\"583\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <line x1=\"718\" y1=\"608\" x2=\"718\" y2=\"585\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <line x1=\"520\" y1=\"608\" x2=\"790\" y2=\"608\" stroke=\"#555\" stroke-width=\"1.5\"/>\n  <text x=\"592\" y=\"625\" font-size=\"10\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">420</text>\n  <text x=\"635\" y=\"625\" font-size=\"10\" fill=\"#333\" text-anchor=\"middle\">μ</text>\n  <text x=\"718\" y=\"625\" font-size=\"10\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">620</text>\n  <text x=\"810\" y=\"464\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">Regla:</text>\n  <text x=\"810\" y=\"482\" font-size=\"11\" fill=\"#333\">distinto lado de μ</text>\n  <text x=\"810\" y=\"498\" font-size=\"11\" fill=\"#333\">→ SUMO:</text>\n  <text x=\"810\" y=\"516\" font-size=\"11.5\" fill=\"#333\">0,3413+0,4332</text>\n  <text x=\"810\" y=\"534\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">= 77,5%</text>\n  <text x=\"810\" y=\"556\" font-size=\"10.5\" fill=\"#555\">mismo lado → RESTO</text>\n  <text x=\"810\" y=\"572\" font-size=\"10.5\" fill=\"#555\">(580–620: 0,4332−0,3413)</text>\n\n  <!-- ============ CASO 5 ============ -->\n  <rect x=\"40\" y=\"572\" width=\"440\" height=\"230\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#E5C2C2\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"596\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">CASO 5 · INVERSO — tengo la probabilidad, busco X</text>\n  <text x=\"56\" y=\"615\" font-size=\"11\" fill=\"#9C3838\" font-weight=\"700\">★ El del stock de seguridad — casi seguro cae</text>\n  <text x=\"56\" y=\"636\" font-size=\"11.5\" fill=\"#333\">“Cubrir la demanda el 95% de las veces: ¿cuánto stock?”</text>\n  <text x=\"56\" y=\"658\" font-size=\"11\" fill=\"#333\">① Busco X tal que P(demanda&lt;X)=0,95 = 0,5 + <tspan font-weight=\"700\">0,45</tspan></text>\n  <text x=\"56\" y=\"678\" font-size=\"11\" fill=\"#333\">② Leo la tabla AL REVÉS: ¿qué Z tiene área 0,45?</text>\n  <text x=\"76\" y=\"696\" font-size=\"11\" fill=\"#333\">0,4495→Z=1,64 · 0,4505→Z=1,65 ⇒ <tspan font-weight=\"700\">Z≈1,64</tspan></text>\n  <text x=\"56\" y=\"718\" font-size=\"11\" fill=\"#333\">③ Des-estandarizo:  <tspan font-weight=\"700\" font-family=\"Cambria Math, Georgia, serif\">X = μ + Z·σ</tspan> = 500 + 1,64×80</text>\n  <text x=\"56\" y=\"740\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">= 631 unidades de stock</text>\n  <rect x=\"56\" y=\"754\" width=\"408\" height=\"36\" rx=\"6\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"68\" y=\"770\" font-size=\"10.5\" font-weight=\"700\" fill=\"#555\">Z famosos (memorizar): 90%→1,28 · 95%→1,64 · 97,5%→1,96 · 99%→2,33</text>\n  <text x=\"68\" y=\"784\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">cola izquierda (“superar el 90% de las veces”): X = μ − Z·σ</text>\n\n  <!-- ============ t STUDENT ============ -->\n  <rect x=\"500\" y=\"572\" width=\"440\" height=\"230\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#D3C4E4\" stroke-width=\"1.5\"/>\n  <text x=\"516\" y=\"596\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">t DE STUDENT — pocos datos, más prudencia</text>\n  <text x=\"516\" y=\"617\" font-size=\"11\" fill=\"#333\">Con n chico, s es una estimación imprecisa de σ →</text>\n  <text x=\"516\" y=\"633\" font-size=\"11\" fill=\"#333\">la t es una campana con <tspan font-weight=\"700\">colas más gordas</tspan>: exige</text>\n  <text x=\"516\" y=\"649\" font-size=\"11\" fill=\"#333\">multiplicadores mayores para la misma confianza.</text>\n  <!-- mini campanas comparadas -->\n  <path d=\"M 545 720 C 580 720, 594 664, 625 664 C 656 664, 670 720, 705 720\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <path d=\"M 530 718 C 575 712, 596 678, 625 678 C 654 678, 675 712, 720 718\" fill=\"none\" stroke=\"#C00000\" stroke-width=\"1.8\" stroke-dasharray=\"5 3\"/>\n  <line x1=\"525\" y1=\"722\" x2=\"725\" y2=\"722\" stroke=\"#555\" stroke-width=\"1.2\"/>\n  <text x=\"548\" y=\"700\" font-size=\"9.5\" fill=\"#5B3E8E\" font-weight=\"700\">normal</text>\n  <text x=\"672\" y=\"694\" font-size=\"9.5\" fill=\"#C00000\" font-weight=\"700\">t (colas ↑)</text>\n  <!-- tabla convergencia -->\n  <text x=\"745\" y=\"662\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">t al 95% (2 colas):</text>\n  <text x=\"745\" y=\"680\" font-size=\"10.5\" fill=\"#333\">n=5 (gl 4) → 2,78</text>\n  <text x=\"745\" y=\"696\" font-size=\"10.5\" fill=\"#333\">n=10 (gl 9) → 2,26</text>\n  <text x=\"745\" y=\"712\" font-size=\"10.5\" fill=\"#333\">n=30 (gl 29) → 2,05</text>\n  <text x=\"745\" y=\"728\" font-size=\"10.5\" fill=\"#333\">n=∞ → 1,96 = Z</text>\n  <text x=\"516\" y=\"752\" font-size=\"10.5\" fill=\"#333\">Se lee con 2 entradas: <tspan font-weight=\"700\">confianza</tspan> + <tspan font-weight=\"700\">gl = n−1</tspan>.</text>\n  <text x=\"516\" y=\"770\" font-size=\"10.5\" fill=\"#333\">Ej.: X̄=120, s=15, n=5 → 120 ± 2,776×15 = [78 ; 162]</text>\n  <text x=\"516\" y=\"790\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Decisión: n&lt;30 y s muestral → t · n≥30 o σ conocido → Z · regresión → siempre t</text>\n\n  <!-- PIE -->\n  <rect x=\"40\" y=\"816\" width=\"900\" height=\"86\" rx=\"8\" fill=\"#EDF3F9\" stroke=\"#1F4E79\"/>\n  <text x=\"56\" y=\"840\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">CHEQUEOS DE SENSATEZ (hacerlos SIEMPRE — valen puntos de fundamentación):</text>\n  <text x=\"56\" y=\"862\" font-size=\"11\" fill=\"#333\">· X sobre el promedio ⇒ P(“menos que X”) &gt; 50% · X bajo el promedio ⇒ &lt; 50%   · Un área jamás es negativa ni mayor que 1</text>\n  <text x=\"56\" y=\"880\" font-size=\"11\" fill=\"#333\">· “Más que” y “menos que” del mismo X suman 100%   · Si tu resultado viola algo de esto: revisá el DIBUJO, no la tabla</text>\n\n  <rect x=\"40\" y=\"912\" width=\"900\" height=\"70\" rx=\"6\" fill=\"#FAFAFA\" stroke=\"#CCC\"/>\n  <text x=\"56\" y=\"934\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">Ejercicio (ventas 120, 135, 105, 140, 100):  a) X̄ y s   b) P(X&lt;150) — caso 1   c) P(X&gt;90) — caso 3 espejado   d) P(110&lt;X&lt;145) — caso 4</text>\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">e) ¿qué nivel superás el 90% de los meses? — caso 5, cola izquierda   f) intervalo del promedio con n=5: ¿Z o t? ¿por qué?</text>\n  <text x=\"56\" y=\"972\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Dibujá la campana en cada ítem: es método y es puntaje.</text>\n</svg>"},{"type":"heading","level":2,"text":"6. La tabla Z: paso cero y método","html":"6. La tabla Z: paso cero y método"},{"type":"heading","level":3,"text":"⚠ PASO CERO — identificar qué tabla tenés","html":"⚠ PASO CERO — identificar qué tabla tenés"},{"type":"paragraph","text":"Buscá Z = 1,00:","html":"Buscá Z = 1,00:"},{"type":"list","ordered":false,"items":["Dice **0,3413** → tabla **\"centro→Z\"** (da el área entre el medio y tu Z; máximo 0,5). La usual en UTN y la usada en este apunte.","Dice **0,8413** → tabla **\"acumulada\"** (área desde −∞ hasta Z; ya incluye el 0,5 izquierdo)."],"itemsHtml":["Dice <strong>0,3413</strong> → tabla <strong>\"centro→Z\"</strong> (da el área entre el medio y tu Z; máximo 0,5). La usual en UTN y la usada en este apunte.","Dice <strong>0,8413</strong> → tabla <strong>\"acumulada\"</strong> (área desde −∞ hasta Z; ya incluye el 0,5 izquierdo)."]},{"type":"paragraph","text":"Anotalo con lapicera arriba de tu tabla. Es EL error clásico de examen.","html":"Anotalo con lapicera arriba de tu tabla. Es EL error clásico de examen."},{"type":"paragraph","text":"**Cómo se busca:** fila = Z hasta el primer decimal; columna = segundo decimal. Z=1,64 → fila \"1,6\", columna \"0,04\" → 0,4495.","html":"<strong>Cómo se busca:</strong> fila = Z hasta el primer decimal; columna = segundo decimal. Z=1,64 → fila \"1,6\", columna \"0,04\" → 0,4495."},{"type":"heading","level":3,"text":"Método de los 4 pasos (siempre igual)","html":"Método de los 4 pasos (siempre igual)"},{"type":"formula","tex":"Z = \\frac{X - \\mu}{\\sigma}","html":"<span class=\"eq-block\">Z = <span class=\"frac\"><span class=\"num\">X - μ</span><span class=\"den\">σ</span></span></span>"},{"type":"formula","tex":"X = \\mu + Z\\cdot\\sigma","html":"<span class=\"eq-block\">X = μ + Z·σ</span>"},{"type":"formula","tex":"Z = \\frac{X - \\mu}{\\sigma}","html":"<span class=\"eq-block\">Z = <span class=\"frac\"><span class=\"num\">X - μ</span><span class=\"den\">σ</span></span></span>"},{"type":"paragraph","text":"*¿A cuántos desvíos del promedio está X?* Después, en el caso inverso:","html":"<em>¿A cuántos desvíos del promedio está X?</em> Después, en el caso inverso:"},{"type":"formula","tex":"X = \\mu + Z\\cdot\\sigma","html":"<span class=\"eq-block\">X = μ + Z·σ</span>"},{"type":"paragraph","text":"Es la des-estandarización: la del stock de seguridad. Para cola izquierda, X = μ − Z·σ.","html":"Es la des-estandarización: la del stock de seguridad. Para cola izquierda, X = μ − Z·σ."},{"type":"list","ordered":true,"items":["**Calcular Z** = (X−μ)/σ","**Dibujar la campana** y **pintar** el área que pide la pregunta","**Buscar en la tabla** el área de tu Z","**Armar la respuesta** sumando/restando 0,5 (cada mitad de la campana vale 0,5)"],"itemsHtml":["<strong>Calcular Z</strong> = (X−μ)/σ","<strong>Dibujar la campana</strong> y <strong>pintar</strong> el área que pide la pregunta","<strong>Buscar en la tabla</strong> el área de tu Z","<strong>Armar la respuesta</strong> sumando/restando 0,5 (cada mitad de la campana vale 0,5)"]},{"type":"heading","level":2,"text":"7. Los 5 casos (no existen más que estos)","html":"7. Los 5 casos (no existen más que estos)"},{"type":"paragraph","text":"*Ejemplo base para todos: μ = 500, σ = 80, tabla centro→Z.*","html":"<em>Ejemplo base para todos: μ = 500, σ = 80, tabla centro→Z.</em>"},{"type":"heading","level":3,"text":"CASO 1 — \"Menos que\" un X mayor al promedio","html":"CASO 1 — \"Menos que\" un X mayor al promedio"},{"type":"paragraph","text":"**P(X < 620):** Z = (620−500)/80 = **+1,5**. Pinto todo lo izquierdo de 620 = mitad izquierda entera + pedazo centro→620.\nTabla(1,50) = 0,4332 → **P = 0,5 + 0,4332 = 0,9332 → 93,3%**\n*Chequeo: 620 está sobre μ ⇒ debe dar >50%. ✔*","html":"**P(X < 620):** Z = (620−500)/80 = **+1,5**. Pinto todo lo izquierdo de 620 = mitad izquierda entera + pedazo centro→620.\nTabla(1,50) = 0,4332 → **P = 0,5 + 0,4332 = 0,9332 → 93,3%**\n*Chequeo: 620 está sobre μ ⇒ debe dar >50%. ✔*"},{"type":"heading","level":3,"text":"CASO 2 — \"Más que\" un X mayor al promedio","html":"CASO 2 — \"Más que\" un X mayor al promedio"},{"type":"paragraph","text":"**P(X > 620):** mismo Z=1,5. Pinto la colita derecha. La mitad derecha vale 0,5, le quito lo del caso 1:\n**P = 0,5 − 0,4332 = 0,0668 → 6,7%**\n*Chequeo: complemento del caso 1 (93,3 + 6,7 = 100). ✔*","html":"<strong>P(X &gt; 620):</strong> mismo Z=1,5. Pinto la colita derecha. La mitad derecha vale 0,5, le quito lo del caso 1:\n<strong>P = 0,5 − 0,4332 = 0,0668 → 6,7%</strong>\n<em>Chequeo: complemento del caso 1 (93,3 + 6,7 = 100). ✔</em>"},{"type":"heading","level":3,"text":"CASO 3 — Z negativo (X menor al promedio)","html":"CASO 3 — Z negativo (X menor al promedio)"},{"type":"paragraph","text":"**P(X < 420):** Z = (420−500)/80 = **−1,0**. La tabla no tiene negativos: por **SIMETRÍA** busco Z=+1,00 → 0,3413. Pinto la colita izquierda:\n**P = 0,5 − 0,3413 = 0,1587 → 15,9%**\n*Chequeo: bajo μ ⇒ <50%. ✔*","html":"<strong>P(X &lt; 420):</strong> Z = (420−500)/80 = <strong>−1,0</strong>. La tabla no tiene negativos: por <strong>SIMETRÍA</strong> busco Z=+1,00 → 0,3413. Pinto la colita izquierda:\n<strong>P = 0,5 − 0,3413 = 0,1587 → 15,9%</strong>\n<em>Chequeo: bajo μ ⇒ &lt;50%. ✔</em>"},{"type":"heading","level":3,"text":"CASO 4 — Entre dos valores","html":"CASO 4 — Entre dos valores"},{"type":"paragraph","text":"**P(420 < X < 620):** piezas 0,3413 (izq) y 0,4332 (der), en **lados opuestos** del centro → se **SUMAN**:\n**P = 0,3413 + 0,4332 = 0,7745 → 77,5%**","html":"<strong>P(420 &lt; X &lt; 620):</strong> piezas 0,3413 (izq) y 0,4332 (der), en <strong>lados opuestos</strong> del centro → se <strong>SUMAN</strong>:\n<strong>P = 0,3413 + 0,4332 = 0,7745 → 77,5%</strong>"},{"type":"paragraph","text":"**Variante con trampa — mismo lado:** P(580 < X < 620): Z₁=1,0 y Z₂=1,5, ambos a la derecha → se **RESTAN**: 0,4332 − 0,3413 = **9,2%**.","html":"<strong>Variante con trampa — mismo lado:</strong> P(580 &lt; X &lt; 620): Z₁=1,0 y Z₂=1,5, ambos a la derecha → se <strong>RESTAN</strong>: 0,4332 − 0,3413 = <strong>9,2%</strong>."},{"type":"callout","kind":"idea","text":"**Regla: distinto lado de μ → sumo · mismo lado → resto.** El dibujo de la campana evita confundirse.","html":"<strong>Regla: distinto lado de μ → sumo · mismo lado → resto.</strong> El dibujo de la campana evita confundirse."},{"type":"heading","level":3,"text":"CASO 5 — INVERSO ★ (el del stock de seguridad — casi seguro cae)","html":"CASO 5 — INVERSO ★ (el del stock de seguridad — casi seguro cae)"},{"type":"paragraph","text":"Tengo la probabilidad deseada, busco el X. *\"Cubrir la demanda el 95% de las veces: ¿cuánto stock?\"*","html":"Tengo la probabilidad deseada, busco el X. <em>\"Cubrir la demanda el 95% de las veces: ¿cuánto stock?\"</em>"},{"type":"list","ordered":true,"items":["Busco X tal que P(demanda < X) = 0,95 = 0,5 + **0,45**","Leo la tabla **al revés**: ¿qué Z tiene área 0,45? → 0,4495→Z=1,64 · 0,4505→Z=1,65 ⇒ **Z ≈ 1,64**","Des-estandarizo: X = μ + Z·σ = 500 + 1,64×80 = **631 unidades**"],"itemsHtml":["Busco X tal que P(demanda &lt; X) = 0,95 = 0,5 + <strong>0,45</strong>","Leo la tabla <strong>al revés</strong>: ¿qué Z tiene área 0,45? → 0,4495→Z=1,64 · 0,4505→Z=1,65 ⇒ <strong>Z ≈ 1,64</strong>","Des-estandarizo: X = μ + Z·σ = 500 + 1,64×80 = <strong>631 unidades</strong>"]},{"type":"paragraph","text":"**Z famosos (memorizar):**","html":"<strong>Z famosos (memorizar):</strong>"},{"type":"table","headers":["Cobertura","Z"],"rows":[["---","---"],["90%","1,28"],["95%","1,64"],["97,5%","1,96"],["99%","2,33"]],"headersHtml":["Cobertura","Z"],"rowsHtml":[["---","---"],["90%","1,28"],["95%","1,64"],["97,5%","1,96"],["99%","2,33"]]},{"type":"heading","level":2,"text":"8. t de Student — pocos datos, más prudencia","html":"8. t de Student — pocos datos, más prudencia"},{"type":"paragraph","text":"**Problema que resuelve:** las fórmulas usan σ (desvío verdadero), pero en la realidad lo estimás con s desde pocos datos. Hay doble incertidumbre: el próximo valor es incierto Y tu regla de medir (s) también es imprecisa.","html":"<strong>Problema que resuelve:</strong> las fórmulas usan σ (desvío verdadero), pero en la realidad lo estimás con s desde pocos datos. Hay doble incertidumbre: el próximo valor es incierto Y tu regla de medir (s) también es imprecisa."},{"type":"paragraph","text":"**Solución:** la t es una campana **más baja en el centro y con colas más gordas** → para la misma confianza exige un multiplicador **mayor** que Z. Es la estadística diciendo \"con tan pocos datos, cubrite más\".","html":"<strong>Solución:</strong> la t es una campana <strong>más baja en el centro y con colas más gordas</strong> → para la misma confianza exige un multiplicador <strong>mayor</strong> que Z. Es la estadística diciendo \"con tan pocos datos, cubrite más\"."},{"type":"paragraph","text":"**Cómo se lee su tabla (2 entradas):** filas = **grados de libertad (n−1)**; columnas = confianza o cola (identificar si la tabla es de una o dos colas). Adentro: el valor t que reemplaza a Z.","html":"<strong>Cómo se lee su tabla (2 entradas):</strong> filas = <strong>grados de libertad (n−1)</strong>; columnas = confianza o cola (identificar si la tabla es de una o dos colas). Adentro: el valor t que reemplaza a Z."},{"type":"heading","level":3,"text":"Convergencia a la normal (t al 95%, dos colas)","html":"Convergencia a la normal (t al 95%, dos colas)"},{"type":"table","headers":["n (datos)","gl","t","vs. Z=1,96"],"rows":[["---","---","---","---"],["5","4","2,776","+42% más exigente"],["10","9","2,262","+15%"],["20","19","2,093","+7%"],["30","29","2,045","+4%"],["∞","∞","1,960","= Z"]],"headersHtml":["n (datos)","gl","t","vs. Z=1,96"],"rowsHtml":[["---","---","---","---"],["5","4","2,776","+42% más exigente"],["10","9","2,262","+15%"],["20","19","2,093","+7%"],["30","29","2,045","+4%"],["∞","∞","1,960","= Z"]]},{"type":"paragraph","text":"De ahí la regla \"con n≥30 usá la normal\".","html":"De ahí la regla \"con n≥30 usá la normal\"."},{"type":"ejemplo","title":"Ejemplo completo","blocks":[{"type":"paragraph","text":"5 meses de ventas, X̄=120, s=15. Intervalo del 95% para un mes típico:","html":"5 meses de ventas, X̄=120, s=15. Intervalo del 95% para un mes típico:"},{"type":"list","ordered":false,"items":["Con normal (incorrecto acá): 120 ± 1,96×15 = [90,6 ; 149,4]","Con t (correcto): gl=4 → t=2,776 → **120 ± 2,776×15 = [78,4 ; 161,6]**"],"itemsHtml":["Con normal (incorrecto acá): 120 ± 1,96×15 = [90,6 ; 149,4]","Con t (correcto): gl=4 → t=2,776 → <strong>120 ± 2,776×15 = [78,4 ; 161,6]</strong>"]},{"type":"paragraph","text":"El intervalo correcto es más ancho: la t cobra el precio de saber poco.","html":"El intervalo correcto es más ancho: la t cobra el precio de saber poco."}],"titleHtml":"Ejemplo completo"},{"type":"heading","level":3,"text":"Regla de decisión para el final","html":"Regla de decisión para el final"},{"type":"list","ordered":false,"items":["n < 30 y desvío estimado de la muestra → **t con n−1 gl**","n ≥ 30 o σ conocido/dado por enunciado → **normal (Z)**","Regresión → **siempre t** (con n−2 gl; el porqué, en la clase de regresión)"],"itemsHtml":["n &lt; 30 y desvío estimado de la muestra → <strong>t con n−1 gl</strong>","n ≥ 30 o σ conocido/dado por enunciado → <strong>normal (Z)</strong>","Regresión → <strong>siempre t</strong> (con n−2 gl; el porqué, en la clase de regresión)"]},{"type":"heading","level":2,"text":"9. Chequeos de sensatez (hacerlos SIEMPRE — valen puntos de \"fundamentación\")","html":"9. Chequeos de sensatez (hacerlos SIEMPRE — valen puntos de \"fundamentación\")"},{"type":"list","ordered":false,"items":["X sobre el promedio ⇒ P(\"menos que X\") > 50% · X bajo el promedio ⇒ < 50%","Un área jamás es negativa ni mayor que 1","\"Más que\" y \"menos que\" del mismo X suman 100%","Si el resultado viola algo de esto: **revisá el DIBUJO, no la tabla**"],"itemsHtml":["X sobre el promedio ⇒ P(\"menos que X\") &gt; 50% · X bajo el promedio ⇒ &lt; 50%","Un área jamás es negativa ni mayor que 1","\"Más que\" y \"menos que\" del mismo X suman 100%","Si el resultado viola algo de esto: <strong>revisá el DIBUJO, no la tabla</strong>"]},{"type":"ejercicio","title":"11. EJERCICIO PENDIENTE (traerlo resuelto)","estado":"para resolver","blocks":[{"type":"paragraph","text":"**Datos: ventas mensuales de una autopartista = 120, 135, 105, 140, 100** (n=5)","html":"<strong>Datos: ventas mensuales de una autopartista = 120, 135, 105, 140, 100</strong> (n=5)"},{"type":"paragraph","text":"a) **X̄ y s**, paso a paso como el ejemplo de la Fábrica B.\nb) **P(X < 150)** — caso 1.\nc) **P(X > 90)** — caso 3 espejado: Z negativo, pensarlo con el dibujo.\nd) **P(110 < X < 145)** — caso 4.\ne) **Inverso:** ¿qué nivel de ventas superás el 90% de los meses? — caso 5, cola izquierda: X = μ − Z·σ.\nf) Con n=5, ¿el intervalo de confianza del promedio conviene hacerlo con Z o con t? ¿Por qué?","html":"a) <strong>X̄ y s</strong>, paso a paso como el ejemplo de la Fábrica B.\nb) **P(X < 150)** — caso 1.\nc) **P(X > 90)** — caso 3 espejado: Z negativo, pensarlo con el dibujo.\nd) <strong>P(110 &lt; X &lt; 145)</strong> — caso 4.\ne) <strong>Inverso:</strong> ¿qué nivel de ventas superás el 90% de los meses? — caso 5, cola izquierda: X = μ − Z·σ.\nf) Con n=5, ¿el intervalo de confianza del promedio conviene hacerlo con Z o con t? ¿Por qué?"},{"type":"paragraph","text":"**Dibujá la campana en cada ítem: es método y es puntaje** (criterio oficial: \"interpretación de los resultados\" y \"fundamentación\").","html":"<strong>Dibujá la campana en cada ítem: es método y es puntaje</strong> (criterio oficial: \"interpretación de los resultados\" y \"fundamentación\")."}],"nota":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","notaHtml":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","titleHtml":"11. EJERCICIO PENDIENTE (traerlo resuelto)"},{"type":"heading","level":2,"text":"Mini-resumen de la Clase 1.b","html":"Mini-resumen de la Clase 1.b"},{"type":"callout","kind":"idea","text":"**Clase 1.b.** Paso cero: identificar la tabla (Z=1,00 → 0,3413 centro→Z / 0,8413 acumulada). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que (0,5+área), más-que (0,5−área), Z negativo (simetría), entre-dos (distinto lado sumo / mismo lado resto), inverso (tabla al revés + X=μ±Z·σ). Z famosos: 1,28/1,64/1,96/2,33. t de Student: colas gordas, 2 entradas (confianza + gl=n−1), converge a Z en n≈30; en regresión siempre t.","html":"<strong>Clase 1.b.</strong> Paso cero: identificar la tabla (Z=1,00 → 0,3413 centro→Z / 0,8413 acumulada). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que (0,5+área), más-que (0,5−área), Z negativo (simetría), entre-dos (distinto lado sumo / mismo lado resto), inverso (tabla al revés + X=μ±Z·σ). Z famosos: 1,28/1,64/1,96/2,33. t de Student: colas gordas, 2 entradas (confianza + gl=n−1), converge a Z en n≈30; en regresión siempre t."}],"historias":[{"type":"concepto","k":"La idea","title":"Una tabla, para todas las campanas.","text":"Z convierte cualquier campana en una sola. El método es siempre el mismo: calcular Z, dibujar y pintar el área, buscar en la tabla y armar la respuesta con ±0,5.","html":"Z convierte cualquier campana en una sola. El método es siempre el mismo: calcular Z, dibujar y pintar el área, buscar en la tabla y armar la respuesta con ±0,5.","titleHtml":"Una tabla, para todas las campanas."},{"type":"concepto","k":"Paso cero","title":"Primero, identificá tu tabla.","text":"Buscá Z = 1,00. Si dice 0,3413, es tabla «centro→Z» (máximo 0,5): la usual en UTN y la de este apunte. Si dice 0,8413, es acumulada (ya incluye el 0,5 izquierdo).","ejemplo":"Anotalo arriba de la tabla. Es EL error clásico de examen.","html":"Buscá Z = 1,00. Si dice 0,3413, es tabla «centro→Z» (máximo 0,5): la usual en UTN y la de este apunte. Si dice 0,8413, es acumulada (ya incluye el 0,5 izquierdo).","titleHtml":"Primero, identificá tu tabla."},{"type":"pregunta","k":"A ver…","title":"Si para Z = 1,00 la tabla da 0,3413, ¿qué tabla tenés?","options":["Acumulada, desde −∞ hasta Z","Centro→Z, el área entre el medio y tu Z","Una tabla t de Student"],"correct":1,"feedback":"0,3413 es el área entre el centro y Z = 1. Es la tabla centro→Z, la usual en UTN. La acumulada, para el mismo Z, daría 0,8413.","titleHtml":"Si para Z = 1,00 la tabla da 0,3413, ¿qué tabla tenés?"},{"type":"concepto","k":"El método","title":"Siempre los mismos 4 pasos.","text":"① Z = (X − μ) / σ. ② Dibujá la campana y pintá el área que pide la pregunta. ③ Buscá en la tabla el área de tu Z. ④ Armá la respuesta sumando o restando 0,5 (cada mitad vale 0,5).","ejemplo":"Cómo se busca: fila = Z hasta el primer decimal; columna = segundo decimal. Z = 1,64 → fila 1,6, columna 0,04 → 0,4495.","html":"① Z = (X − μ) / σ. ② Dibujá la campana y pintá el área que pide la pregunta. ③ Buscá en la tabla el área de tu Z. ④ Armá la respuesta sumando o restando 0,5 (cada mitad vale 0,5).","titleHtml":"Siempre los mismos 4 pasos."},{"type":"concepto","k":"Caso 1","title":"«Menos que» un X mayor al promedio.","text":"Ejemplo base: μ = 500, σ = 80. P(X < 620): Z = (620−500)/80 = +1,5. Pinto todo lo izquierdo de 620.","ejemplo":"Tabla(1,50) = 0,4332 → P = 0,5 + 0,4332 = 0,9332 → 93,3%. Chequeo: 620 está sobre μ ⇒ debe dar > 50%.","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 222 18, 240 100, 264 100\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.2\"/><line x1=\"20\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"140\" y1=\"18\" x2=\"140\" y2=\"100\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140\" y=\"114\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ=500</text><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 175 18, 190 40, 200 58 L 200 100 L 16 100 Z\" fill=\"#8cb4d6\" fill-opacity=\".35\"/><line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"58\" stroke=\"#e25b16\" stroke-width=\"2\"/><text x=\"200\" y=\"114\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\" font-weight=\"700\">620</text><text x=\"90\" y=\"72\" font-size=\"12\" fill=\"#d5dbe2\" font-weight=\"700\">93,3%</text></svg>","chartLabel":"μ = 500, σ = 80 · P(X < 620) = 93,3%","html":"Ejemplo base: μ = 500, σ = 80. P(X &lt; 620): Z = (620−500)/80 = +1,5. Pinto todo lo izquierdo de 620.","titleHtml":"«Menos que» un X mayor al promedio."},{"type":"concepto","k":"Caso 2","title":"«Más que» es el complemento.","text":"P(X > 620) usa el mismo Z = +1,5. Pinto la colita derecha: 0,5 − 0,4332 = 0,0668 → 6,7%.","ejemplo":"Chequeo: 93,3% + 6,7% = 100%.","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 222 18, 240 100, 264 100\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.2\"/><line x1=\"20\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"140\" y1=\"18\" x2=\"140\" y2=\"100\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140\" y=\"114\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ=500</text><path d=\"M 200 58 C 222 80, 240 100, 264 100 L 200 100 Z\" fill=\"#e25b16\" fill-opacity=\".4\"/><line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"58\" stroke=\"#e25b16\" stroke-width=\"2\"/><text x=\"200\" y=\"114\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\" font-weight=\"700\">620</text><text x=\"222\" y=\"86\" font-size=\"11\" fill=\"#d5dbe2\" font-weight=\"700\">6,7%</text></svg>","chartLabel":"P(X > 620) = 6,7%, complemento del caso 1","html":"P(X &gt; 620) usa el mismo Z = +1,5. Pinto la colita derecha: 0,5 − 0,4332 = 0,0668 → 6,7%.","titleHtml":"«Más que» es el complemento."},{"type":"pregunta","k":"A ver…","title":"Si P(X < 620) = 93,3%, ¿cuánto vale P(X > 620)?","options":["También 93,3%","6,7%, porque son complementarias","50%, porque es la mitad derecha"],"correct":1,"feedback":"«Más que» y «menos que» del mismo X suman 100%. 100 − 93,3 = 6,7%.","titleHtml":"Si P(X < 620) = 93,3%, ¿cuánto vale P(X > 620)?"},{"type":"concepto","k":"Caso 3","title":"Z negativo: usá la simetría.","text":"P(X < 420): Z = (420−500)/80 = −1,0. La tabla no tiene negativos: buscá Z = +1,00 → 0,3413. Pinto la colita izquierda: 0,5 − 0,3413 = 0,1587 → 15,9%.","ejemplo":"Chequeo: 420 está bajo μ ⇒ debe dar < 50%.","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 222 18, 240 100, 264 100\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.2\"/><line x1=\"20\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"140\" y1=\"18\" x2=\"140\" y2=\"100\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140\" y=\"114\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ=500</text><path d=\"M 16 100 C 40 100, 58 18, 80 58 L 80 100 Z\" fill=\"#e25b16\" fill-opacity=\".4\"/><line x1=\"80\" y1=\"100\" x2=\"80\" y2=\"58\" stroke=\"#e25b16\" stroke-width=\"2\"/><text x=\"80\" y=\"114\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\" font-weight=\"700\">420</text><text x=\"44\" y=\"86\" font-size=\"11\" fill=\"#d5dbe2\" font-weight=\"700\">15,9%</text></svg>","chartLabel":"P(X < 420): Z = −1 → por simetría, 15,9%","html":"P(X &lt; 420): Z = (420−500)/80 = −1,0. La tabla no tiene negativos: buscá Z = +1,00 → 0,3413. Pinto la colita izquierda: 0,5 − 0,3413 = 0,1587 → 15,9%.","titleHtml":"Z negativo: usá la simetría."},{"type":"concepto","k":"Caso 4","title":"Entre dos valores: sumo o resto.","text":"P(420 < X < 620): piezas 0,3413 (izq.) y 0,4332 (der.), en lados opuestos del centro → se SUMAN: 77,5%. Si ambos quedan del mismo lado, se RESTAN.","ejemplo":"Regla: distinto lado de μ → sumo · mismo lado → resto. El dibujo evita confundirse.","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 222 18, 240 100, 264 100\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.2\"/><line x1=\"20\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"140\" y1=\"18\" x2=\"140\" y2=\"100\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140\" y=\"114\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ=500</text><path d=\"M 80 58 C 100 30, 120 18, 140 18 C 175 18, 190 40, 200 58 L 200 100 L 80 100 Z\" fill=\"#8cb4d6\" fill-opacity=\".35\"/><line x1=\"80\" y1=\"100\" x2=\"80\" y2=\"58\" stroke=\"#e25b16\" stroke-width=\"2\"/><line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"58\" stroke=\"#e25b16\" stroke-width=\"2\"/><text x=\"80\" y=\"114\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\">420</text><text x=\"200\" y=\"114\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\">620</text><text x=\"140\" y=\"70\" font-size=\"12\" fill=\"#d5dbe2\" font-weight=\"700\" text-anchor=\"middle\">77,5%</text></svg>","chartLabel":"P(420 < X < 620) = 0,3413 + 0,4332 = 77,5%","html":"P(420 &lt; X &lt; 620): piezas 0,3413 (izq.) y 0,4332 (der.), en lados opuestos del centro → se SUMAN: 77,5%. Si ambos quedan del mismo lado, se RESTAN.","titleHtml":"Entre dos valores: sumo o resto."},{"type":"concepto","k":"Caso 5 ★","title":"El inverso: el del stock de seguridad.","text":"Tengo la probabilidad y busco el X. Cubrir la demanda el 95% de las veces: área 0,5 + 0,45. Tabla al revés: Z ≈ 1,64. X = μ + Z·σ = 500 + 1,64×80 = 631.","ejemplo":"Z famosos: 90% → 1,28 · 95% → 1,64 · 97,5% → 1,96 · 99% → 2,33.","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 222 18, 240 100, 264 100\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"2.2\"/><line x1=\"20\" y1=\"100\" x2=\"260\" y2=\"100\" stroke=\"rgba(255,255,255,.22)\" stroke-width=\"1.2\"/><line x1=\"140\" y1=\"18\" x2=\"140\" y2=\"100\" stroke=\"#e8c56a\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140\" y=\"114\" font-size=\"10\" fill=\"#e8c56a\" text-anchor=\"middle\">μ=500</text><path d=\"M 16 100 C 40 100, 58 18, 140 18 C 185 18, 205 48, 214 64 L 214 100 L 16 100 Z\" fill=\"#8cb4d6\" fill-opacity=\".35\"/><line x1=\"214\" y1=\"100\" x2=\"214\" y2=\"64\" stroke=\"#e25b16\" stroke-width=\"2\"/><text x=\"214\" y=\"114\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\" font-weight=\"700\">631</text><text x=\"100\" y=\"72\" font-size=\"12\" fill=\"#d5dbe2\" font-weight=\"700\">95%</text></svg>","chartLabel":"Cobertura 95% → Z ≈ 1,64 → X = 500 + 1,64×80 = 631","html":"Tengo la probabilidad y busco el X. Cubrir la demanda el 95% de las veces: área 0,5 + 0,45. Tabla al revés: Z ≈ 1,64. X = μ + Z·σ = 500 + 1,64×80 = 631.","titleHtml":"El inverso: el del stock de seguridad."},{"type":"pregunta","k":"A ver…","title":"Para cubrir la demanda el 95% de las veces, el Z que se usa es…","options":["1,28","1,64","1,96"],"correct":1,"feedback":"Se busca el área 0,45 en la tabla centro→Z: 0,4495 → Z = 1,64. Es el número estrella del stock de seguridad. 1,96 es el 97,5% (o el 95% a dos colas).","titleHtml":"Para cubrir la demanda el 95% de las veces, el Z que se usa es…"},{"type":"concepto","k":"Pocos datos","title":"Con n chico, entra t de Student.","text":"La t es más baja en el centro y con colas más gordas: para la misma confianza exige un multiplicador mayor que Z. Se lee con dos entradas: confianza + grados de libertad (n−1).","ejemplo":"n < 30 y desvío estimado de la muestra → t. n ≥ 30 o σ conocido → Z. En regresión, siempre t (con n−2 gl). Con n = 5, gl = 4, t al 95% = 2,776 (contra Z = 1,96).","html":"La t es más baja en el centro y con colas más gordas: para la misma confianza exige un multiplicador mayor que Z. Se lee con dos entradas: confianza + grados de libertad (n−1).","titleHtml":"Con n chico, entra t de Student."},{"type":"concepto","k":"Chequeos","title":"Si no cierra, revisá el dibujo.","text":"X sobre el promedio ⇒ P(«menos que X») > 50%. Un área jamás es negativa ni mayor que 1. «Más que» y «menos que» del mismo X suman 100%.","ejemplo":"Si el resultado viola algo de esto: revisá el DIBUJO, no la tabla.","html":"X sobre el promedio ⇒ P(«menos que X») &gt; 50%. Un área jamás es negativa ni mayor que 1. «Más que» y «menos que» del mismo X suman 100%.","titleHtml":"Si no cierra, revisá el dibujo."},{"type":"cierre","title":"Llevate esto de la Clase 1.b.","text":"Paso cero: identificá la tabla (0,3413 = centro→Z). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que, más-que, Z negativo, entre-dos, inverso. Z famosos: 1,28 / 1,64 / 1,96 / 2,33. t: colas gordas, dos entradas, converge a Z cerca de n = 30.","html":"Paso cero: identificá la tabla (0,3413 = centro→Z). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que, más-que, Z negativo, entre-dos, inverso. Z famosos: 1,28 / 1,64 / 1,96 / 2,33. t: colas gordas, dos entradas, converge a Z cerca de n = 30.","titleHtml":"Llevate esto de la Clase 1.b."}],"titleHtml":"Clase 1.b · Tabla Z","ledeHtml":"Clase 1.b. Paso cero: identificar la tabla (Z=1,00 → 0,3413 centro→Z / 0,8413 acumulada). Método: Z → dibujo → tabla → armar con ±0,5. Cinco casos: menos-que (0,5+área), más-que (0,5−área), Z negativo (simetría), entre-dos (distinto lado sumo / mismo lado resto), inverso (tabla al revés + X=μ±Z·σ). Z famosos: 1,28/1,64/1,96/2,33. t de Student: colas gordas, 2 entradas (confianza + gl=n−1), converge a Z en n≈30; en regresión siempre t."},"c2":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c2","title":"Clase 2 · Correlación","name":"Correlación","lede":"hasta ahora mirábamos UNA variable (ventas y su dispersión). La correlación mide si DOS variables se mueven juntas. Si encontrás una variable que acompaña a tus ventas, ganás dos cosas: entendés por qué varían y podés pronosticarlas. Es la antesala directa de la regresión.","visto":true,"source":["clases_previas/SG/Clase02_Correlacion.md","clases_previas/SG/Clase02_Correlacion.svg"],"laminas":["u2/img/Clase02_Correlacion.svg"],"next":"Clase 3.a · Series de tiempo","teoria":[{"type":"paragraph","text":"**Sistemas de Gestión (UTN FRRo) · Unidad 2.a (cierre) · Serie: 0 → 0.1 → 1 → 1.b → **2****","html":"<strong>Sistemas de Gestión (UTN FRRo) · Unidad 2.a (cierre) · Serie: 0 → 0.1 → 1 → 1.b → </strong>2****"},{"type":"callout","kind":"idea","text":"**Idea central:** hasta ahora mirábamos UNA variable (ventas y su dispersión). La correlación mide si DOS variables se mueven juntas. Si encontrás una variable que acompaña a tus ventas, ganás dos cosas: entendés por qué varían y podés pronosticarlas. Es la antesala directa de la regresión.","html":"<strong>Idea central:</strong> hasta ahora mirábamos UNA variable (ventas y su dispersión). La correlación mide si DOS variables se mueven juntas. Si encontrás una variable que acompaña a tus ventas, ganás dos cosas: entendés por qué varían y podés pronosticarlas. Es la antesala directa de la regresión."},{"type":"heading","level":2,"text":"1. El problema que resuelve","html":"1. El problema que resuelve"},{"type":"paragraph","text":"La pregunta útil para una empresa no es solo \"¿cuánto vendo en promedio?\", sino **\"¿de qué dependen mis ventas?\"** — del precio, de la publicidad, de la temperatura, del PBI.","html":"La pregunta útil para una empresa no es solo \"¿cuánto vendo en promedio?\", sino <strong>\"¿de qué dependen mis ventas?\"</strong> — del precio, de la publicidad, de la temperatura, del PBI."},{"type":"paragraph","text":"Si dos variables se mueven juntas:","html":"Si dos variables se mueven juntas:"},{"type":"list","ordered":true,"items":["**Entendés** el fenómeno (por qué suben o bajan las ventas).","**Podés pronosticar**: si conocés la publicidad del mes próximo, estimás las ventas."],"itemsHtml":["<strong>Entendés</strong> el fenómeno (por qué suben o bajan las ventas).","<strong>Podés pronosticar</strong>: si conocés la publicidad del mes próximo, estimás las ventas."]},{"type":"heading","level":2,"text":"2. Primer paso SIEMPRE: el diagrama de dispersión","html":"2. Primer paso SIEMPRE: el diagrama de dispersión"},{"type":"paragraph","text":"Antes de calcular nada, **se grafica**. Cada punto es un par de datos: X en el eje horizontal, Y en el vertical.","html":"Antes de calcular nada, <strong>se grafica</strong>. Cada punto es un par de datos: X en el eje horizontal, Y en el vertical."},{"type":"heading","level":3,"text":"Convención de variables","html":"Convención de variables"},{"type":"table","headers":["Variable","Nombre","Qué es"],"rows":[["---","---","---"],["**X**","**independiente**","La que explica; la causa candidata; la que conocés primero"],["**Y**","**dependiente**","La que querés explicar o predecir"]],"headersHtml":["Variable","Nombre","Qué es"],"rowsHtml":[["---","---","---"],["<strong>X</strong>","<strong>independiente</strong>","La que explica; la causa candidata; la que conocés primero"],["<strong>Y</strong>","<strong>dependiente</strong>","La que querés explicar o predecir"]]},{"type":"paragraph","text":"*Ejemplo:* para estimar ventas a partir de publicidad → publicidad = X, ventas = Y.","html":"<em>Ejemplo:</em> para estimar ventas a partir de publicidad → publicidad = X, ventas = Y."},{"type":"heading","level":3,"text":"Datos del ejemplo (5 meses)","html":"Datos del ejemplo (5 meses)"},{"type":"table","headers":["Publicidad (X, miles $)","Ventas (Y, unidades)"],"rows":[["---","---"],["10","120"],["15","135"],["8","105"],["18","140"],["6","100"]],"headersHtml":["Publicidad (X, miles $)","Ventas (Y, unidades)"],"rowsHtml":[["---","---"],["10","120"],["15","135"],["8","105"],["18","140"],["6","100"]]},{"type":"paragraph","text":"Al graficar se ve que suben juntos: a más publicidad, más ventas. **Eso ya es información, antes de cualquier fórmula.**","html":"Al graficar se ve que suben juntos: a más publicidad, más ventas. <strong>Eso ya es información, antes de cualquier fórmula.</strong>"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><line x1=\"32\" y1=\"118\" x2=\"272\" y2=\"118\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><line x1=\"32\" y1=\"20\" x2=\"32\" y2=\"118\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><line x1=\"59.5\" y1=\"102.66666666666667\" x2=\"224.5\" y2=\"41.33333333333333\" stroke=\"#a67c00\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"114.5\" cy=\"72.0\" r=\"4\" fill=\"#1f4e79\"/><circle cx=\"183.25\" cy=\"49.0\" r=\"4\" fill=\"#1f4e79\"/><circle cx=\"87.0\" cy=\"95.0\" r=\"4\" fill=\"#1f4e79\"/><circle cx=\"224.5\" cy=\"41.33333333333333\" r=\"4\" fill=\"#1f4e79\"/><circle cx=\"59.5\" cy=\"102.66666666666667\" r=\"4\" fill=\"#1f4e79\"/><text x=\"150\" y=\"134\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Publicidad X (miles $)</text><text x=\"12\" y=\"70\" font-size=\"9\" fill=\"#5c6670\" transform=\"rotate(-90 12 70)\">Ventas Y</text></svg>","caption":"Diagrama de dispersión del ejemplo: publicidad (X) vs. ventas (Y). Nube lineal positiva, puntos apretados — el r ≈ 0,98 se ve antes de calcularlo."},{"type":"heading","level":2,"text":"3. Los 6 patrones posibles (Hanke, cap. 2)","html":"3. Los 6 patrones posibles (Hanke, cap. 2)"},{"type":"table","headers":["#","Patrón","Cómo se ve","Ejemplo típico"],"rows":[["---","---","---","---"],["1","**Lineal positiva perfecta**","puntos exactos sobre recta ascendente","(teórico)"],["2","**Lineal negativa perfecta**","puntos exactos sobre recta descendente","(teórico)"],["3","**Lineal positiva imperfecta**","nube alargada hacia arriba","publicidad vs. ventas ← *el caso realista*"],["4","**Lineal negativa imperfecta**","nube alargada hacia abajo","precio vs. cantidad vendida"],["5","**Curva**","relación clara pero no recta (U, exponencial)","⚠ el caso trampa"],["6","**Sin relación**","nube redonda, sin dirección","X no dice nada de Y"]],"headersHtml":["#","Patrón","Cómo se ve","Ejemplo típico"],"rowsHtml":[["---","---","---","---"],["1","<strong>Lineal positiva perfecta</strong>","puntos exactos sobre recta ascendente","(teórico)"],["2","<strong>Lineal negativa perfecta</strong>","puntos exactos sobre recta descendente","(teórico)"],["3","<strong>Lineal positiva imperfecta</strong>","nube alargada hacia arriba","publicidad vs. ventas ← <em>el caso realista</em>"],["4","<strong>Lineal negativa imperfecta</strong>","nube alargada hacia abajo","precio vs. cantidad vendida"],["5","<strong>Curva</strong>","relación clara pero no recta (U, exponencial)","⚠ el caso trampa"],["6","<strong>Sin relación</strong>","nube redonda, sin dirección","X no dice nada de Y"]]},{"type":"paragraph","text":"**Qué buscar en el gráfico, en este orden:**","html":"<strong>Qué buscar en el gráfico, en este orden:</strong>"},{"type":"list","ordered":true,"items":["¿Lineal o curva?","Si es lineal: ¿positiva o negativa?","¿Cuán apretados están los puntos alrededor de la recta? (el grado de la relación)"],"itemsHtml":["¿Lineal o curva?","Si es lineal: ¿positiva o negativa?","¿Cuán apretados están los puntos alrededor de la recta? (el grado de la relación)"]},{"type":"heading","level":2,"text":"4. El coeficiente de correlación (r)","html":"4. El coeficiente de correlación (r)"},{"type":"paragraph","text":"**Definición:** mide el grado en que dos variables se relacionan **LINEALMENTE**.","html":"<strong>Definición:</strong> mide el grado en que dos variables se relacionan <strong>LINEALMENTE</strong>."},{"type":"formula","tex":"r = \\frac{n\\sum XY - \\sum X \\sum Y}{\\sqrt{\\left[n\\sum X^2 - (\\sum X)^2\\right]\\cdot\\left[n\\sum Y^2 - (\\sum Y)^2\\right]}}","html":"<span class=\"eq-block\">r = <span class=\"frac\"><span class=\"num\">nΣ XY - Σ X Σ Y</span><span class=\"den\">√<span class=\"rad\">[nΣ X<sup>2</sup> - (Σ X)<sup>2</sup>]·[nΣ Y<sup>2</sup> - (Σ Y)<sup>2</sup>]</span></span></span></span>"},{"type":"svg","file":"u2/img/Clase02_Correlacion.svg","caption":"Lámina de la Clase 2 · Correlación","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 980\" width=\"980\" height=\"980\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n  </defs>\n  <rect width=\"980\" height=\"980\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">CLASE 2 · Correlación</text>\n  <text x=\"290\" y=\"34\" font-size=\"12.5\" fill=\"#666\">U2.a (cierre) — la antesala de la regresión</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">Idea central: ¿DOS variables se mueven juntas? Si sí → entiendo el fenómeno y puedo pronosticar.</text>\n\n  <!-- REGLA DE ORO -->\n  <rect x=\"40\" y=\"70\" width=\"900\" height=\"40\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"95\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8A5A16\">REGLA DE ORO: PRIMERO SE GRAFICA, DESPUÉS SE CALCULA.  ·  X = variable independiente (la que explica) · Y = dependiente (la que quiero predecir)</text>\n\n  <!-- ===== LOS 6 PATRONES ===== -->\n  <rect x=\"40\" y=\"122\" width=\"900\" height=\"216\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"145\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">Los 6 patrones del diagrama de dispersión (Hanke cap. 2)</text>\n\n  <!-- p1 -->\n  <rect x=\"58\" y=\"158\" width=\"136\" height=\"106\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"70\" y1=\"252\" x2=\"70\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"70\" y1=\"252\" x2=\"182\" y2=\"252\" stroke=\"#999\" stroke-width=\"1\"/>\n  <circle cx=\"84\" cy=\"240\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"106\" cy=\"221\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"128\" cy=\"202\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"150\" cy=\"183\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"172\" cy=\"176\" r=\"3\" fill=\"#1F4E79\"/>\n  <text x=\"126\" y=\"280\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">1 · Lineal positiva</text>\n  <text x=\"126\" y=\"294\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">PERFECTA</text>\n  <text x=\"126\" y=\"310\" font-size=\"11\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">r = +1</text>\n\n  <!-- p2 -->\n  <rect x=\"204\" y=\"158\" width=\"136\" height=\"106\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"216\" y1=\"252\" x2=\"216\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"216\" y1=\"252\" x2=\"328\" y2=\"252\" stroke=\"#999\" stroke-width=\"1\"/>\n  <circle cx=\"230\" cy=\"176\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"252\" cy=\"194\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"274\" cy=\"212\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"296\" cy=\"230\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"318\" cy=\"243\" r=\"3\" fill=\"#1F4E79\"/>\n  <text x=\"272\" y=\"280\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">2 · Lineal negativa</text>\n  <text x=\"272\" y=\"294\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">PERFECTA</text>\n  <text x=\"272\" y=\"310\" font-size=\"11\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">r = −1</text>\n\n  <!-- p3 -->\n  <rect x=\"350\" y=\"158\" width=\"136\" height=\"106\" rx=\"5\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.6\"/>\n  <line x1=\"362\" y1=\"252\" x2=\"362\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"362\" y1=\"252\" x2=\"474\" y2=\"252\" stroke=\"#999\" stroke-width=\"1\"/>\n  <circle cx=\"376\" cy=\"236\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"396\" cy=\"242\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"410\" cy=\"215\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"432\" cy=\"206\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"446\" cy=\"218\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"464\" cy=\"181\" r=\"3\" fill=\"#1F4E79\"/>\n  <text x=\"418\" y=\"280\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">3 · Lineal positiva</text>\n  <text x=\"418\" y=\"294\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">imperfecta</text>\n  <text x=\"418\" y=\"310\" font-size=\"10.5\" fill=\"#1F4E79\" text-anchor=\"middle\" font-weight=\"700\">EL CASO REALISTA</text>\n\n  <!-- p4 -->\n  <rect x=\"496\" y=\"158\" width=\"136\" height=\"106\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"508\" y1=\"252\" x2=\"508\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"508\" y1=\"252\" x2=\"620\" y2=\"252\" stroke=\"#999\" stroke-width=\"1\"/>\n  <circle cx=\"522\" cy=\"182\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"542\" cy=\"200\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"558\" cy=\"190\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"578\" cy=\"224\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"596\" cy=\"218\" r=\"3\" fill=\"#1F4E79\"/><circle cx=\"612\" cy=\"242\" r=\"3\" fill=\"#1F4E79\"/>\n  <text x=\"564\" y=\"280\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">4 · Lineal negativa</text>\n  <text x=\"564\" y=\"294\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">imperfecta</text>\n  <text x=\"564\" y=\"310\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\">ej.: precio vs. cantidad</text>\n\n  <!-- p5 -->\n  <rect x=\"642\" y=\"158\" width=\"136\" height=\"106\" rx=\"5\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.6\"/>\n  <line x1=\"654\" y1=\"252\" x2=\"654\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"654\" y1=\"252\" x2=\"766\" y2=\"252\" stroke=\"#999\" stroke-width=\"1\"/>\n  <circle cx=\"666\" cy=\"180\" r=\"3\" fill=\"#B5651D\"/><circle cx=\"686\" cy=\"212\" r=\"3\" fill=\"#B5651D\"/><circle cx=\"706\" cy=\"238\" r=\"3\" fill=\"#B5651D\"/><circle cx=\"726\" cy=\"236\" r=\"3\" fill=\"#B5651D\"/><circle cx=\"744\" cy=\"210\" r=\"3\" fill=\"#B5651D\"/><circle cx=\"760\" cy=\"178\" r=\"3\" fill=\"#B5651D\"/>\n  <text x=\"710\" y=\"280\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">5 · CURVA</text>\n  <text x=\"710\" y=\"296\" font-size=\"10\" fill=\"#8A5A16\" text-anchor=\"middle\" font-weight=\"700\">⚠ relación fuerte</text>\n  <text x=\"710\" y=\"310\" font-size=\"10\" fill=\"#8A5A16\" text-anchor=\"middle\" font-weight=\"700\">pero r ≈ 0</text>\n\n  <!-- p6 -->\n  <rect x=\"788\" y=\"158\" width=\"136\" height=\"106\" rx=\"5\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <line x1=\"800\" y1=\"252\" x2=\"800\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"800\" y1=\"252\" x2=\"912\" y2=\"252\" stroke=\"#999\" stroke-width=\"1\"/>\n  <circle cx=\"820\" cy=\"200\" r=\"3\" fill=\"#888\"/><circle cx=\"850\" cy=\"232\" r=\"3\" fill=\"#888\"/><circle cx=\"874\" cy=\"188\" r=\"3\" fill=\"#888\"/><circle cx=\"836\" cy=\"222\" r=\"3\" fill=\"#888\"/><circle cx=\"892\" cy=\"228\" r=\"3\" fill=\"#888\"/><circle cx=\"862\" cy=\"210\" r=\"3\" fill=\"#888\"/>\n  <text x=\"856\" y=\"280\" font-size=\"10.5\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\">6 · SIN RELACIÓN</text>\n  <text x=\"856\" y=\"296\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\">nube redonda</text>\n  <text x=\"856\" y=\"310\" font-size=\"11\" fill=\"#C00000\" text-anchor=\"middle\" font-weight=\"700\">r ≈ 0</text>\n\n  <!-- ===== FORMULA r ===== -->\n  <rect x=\"40\" y=\"350\" width=\"530\" height=\"188\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"374\" font-size=\"14\" font-weight=\"700\" fill=\"#1F4E79\">Coeficiente de correlación r</text>\n  <text x=\"56\" y=\"394\" font-size=\"11\" fill=\"#666\">Mide el grado de relación LINEAL entre dos variables</text>\n\n  <text x=\"150\" y=\"428\" font-size=\"13.5\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">n·ΣXY − ΣX·ΣY</text>\n  <line x1=\"105\" y1=\"436\" x2=\"500\" y2=\"436\" stroke=\"#1F4E79\" stroke-width=\"1.6\"/>\n  <text x=\"60\" y=\"432\" font-size=\"15\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">r =</text>\n  <text x=\"110\" y=\"460\" font-size=\"13.5\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">√ [ n·ΣX² − (ΣX)² ] · [ n·ΣY² − (ΣY)² ]</text>\n\n  <text x=\"56\" y=\"490\" font-size=\"11\" fill=\"#333\">Se resuelve armando una tabla de 5 columnas y sumando cada una:</text>\n  <rect x=\"56\" y=\"498\" width=\"498\" height=\"30\" rx=\"4\" fill=\"#fff\" stroke=\"#C9DBEA\"/>\n  <text x=\"70\" y=\"518\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\">X   |   Y   |   XY   |   X²   |   Y²      →   ΣX, ΣY, ΣXY, ΣX², ΣY²</text>\n\n  <!-- ESCALA -->\n  <rect x=\"590\" y=\"350\" width=\"350\" height=\"188\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"606\" y=\"374\" font-size=\"14\" font-weight=\"700\" fill=\"#1E6B33\">Escala de lectura</text>\n  <!-- barra -->\n  <rect x=\"606\" y=\"388\" width=\"310\" height=\"18\" rx=\"4\" fill=\"url(#g)\" />\n  <rect x=\"606\" y=\"388\" width=\"103\" height=\"18\" fill=\"#E8A0A0\"/>\n  <rect x=\"709\" y=\"388\" width=\"104\" height=\"18\" fill=\"#E0E0E0\"/>\n  <rect x=\"813\" y=\"388\" width=\"103\" height=\"18\" fill=\"#A9D6B0\"/>\n  <text x=\"612\" y=\"401\" font-size=\"10\" fill=\"#7A2020\" font-weight=\"700\">−1</text>\n  <text x=\"755\" y=\"401\" font-size=\"10\" fill=\"#555\" font-weight=\"700\">0</text>\n  <text x=\"898\" y=\"401\" font-size=\"10\" fill=\"#1E6B33\" font-weight=\"700\">+1</text>\n  <text x=\"606\" y=\"424\" font-size=\"11\" fill=\"#333\"><tspan font-weight=\"700\">El SIGNO</tspan> → dirección (juntas ↑↑ o inversas ↑↓)</text>\n  <text x=\"606\" y=\"442\" font-size=\"11\" fill=\"#333\"><tspan font-weight=\"700\">El VALOR ABSOLUTO</tspan> → fuerza (cercanía a la recta)</text>\n  <text x=\"606\" y=\"466\" font-size=\"10.8\" fill=\"#333\">|r| 0,7–1 → fuerte     |r| 0,3–0,7 → moderada</text>\n  <text x=\"606\" y=\"484\" font-size=\"10.8\" fill=\"#333\">|r| ≈ 0 → sin relación <tspan font-weight=\"700\">lineal</tspan></text>\n  <text x=\"606\" y=\"510\" font-size=\"10.5\" fill=\"#C00000\" font-weight=\"700\">⚠ Si te da fuera de [−1,+1] → error de cálculo</text>\n  <text x=\"606\" y=\"528\" font-size=\"10.5\" fill=\"#1E6B33\" font-weight=\"700\">R² = r² → % de variación de Y explicada</text>\n\n  <!-- ===== EJEMPLO RESUELTO ===== -->\n  <rect x=\"40\" y=\"550\" width=\"530\" height=\"242\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"574\" font-size=\"14\" font-weight=\"700\" fill=\"#8A5A16\">Ejemplo resuelto — publicidad (X) vs. ventas (Y), n=5</text>\n\n  <!-- tabla -->\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"584\" width=\"290\" height=\"18\" fill=\"#8A5A16\"/>\n    <text x=\"72\" y=\"597\" fill=\"#fff\" font-weight=\"700\">X</text><text x=\"122\" y=\"597\" fill=\"#fff\" font-weight=\"700\">Y</text><text x=\"176\" y=\"597\" fill=\"#fff\" font-weight=\"700\">XY</text><text x=\"242\" y=\"597\" fill=\"#fff\" font-weight=\"700\">X²</text><text x=\"292\" y=\"597\" fill=\"#fff\" font-weight=\"700\">Y²</text>\n    <text x=\"72\" y=\"615\" fill=\"#333\">10</text><text x=\"122\" y=\"615\" fill=\"#333\">120</text><text x=\"176\" y=\"615\" fill=\"#333\">1.200</text><text x=\"242\" y=\"615\" fill=\"#333\">100</text><text x=\"292\" y=\"615\" fill=\"#333\">14.400</text>\n    <text x=\"72\" y=\"631\" fill=\"#333\">15</text><text x=\"122\" y=\"631\" fill=\"#333\">135</text><text x=\"176\" y=\"631\" fill=\"#333\">2.025</text><text x=\"242\" y=\"631\" fill=\"#333\">225</text><text x=\"292\" y=\"631\" fill=\"#333\">18.225</text>\n    <text x=\"72\" y=\"647\" fill=\"#333\">8</text><text x=\"122\" y=\"647\" fill=\"#333\">105</text><text x=\"176\" y=\"647\" fill=\"#333\">840</text><text x=\"242\" y=\"647\" fill=\"#333\">64</text><text x=\"292\" y=\"647\" fill=\"#333\">11.025</text>\n    <text x=\"72\" y=\"663\" fill=\"#333\">18</text><text x=\"122\" y=\"663\" fill=\"#333\">140</text><text x=\"176\" y=\"663\" fill=\"#333\">2.520</text><text x=\"242\" y=\"663\" fill=\"#333\">324</text><text x=\"292\" y=\"663\" fill=\"#333\">19.600</text>\n    <text x=\"72\" y=\"679\" fill=\"#333\">6</text><text x=\"122\" y=\"679\" fill=\"#333\">100</text><text x=\"176\" y=\"679\" fill=\"#333\">600</text><text x=\"242\" y=\"679\" fill=\"#333\">36</text><text x=\"292\" y=\"679\" fill=\"#333\">10.000</text>\n    <line x1=\"56\" y1=\"686\" x2=\"346\" y2=\"686\" stroke=\"#8A5A16\" stroke-width=\"1.2\"/>\n    <text x=\"66\" y=\"700\" fill=\"#8A5A16\" font-weight=\"700\">Σ 57</text><text x=\"116\" y=\"700\" fill=\"#8A5A16\" font-weight=\"700\">600</text><text x=\"170\" y=\"700\" fill=\"#8A5A16\" font-weight=\"700\">7.185</text><text x=\"238\" y=\"700\" fill=\"#8A5A16\" font-weight=\"700\">749</text><text x=\"286\" y=\"700\" fill=\"#8A5A16\" font-weight=\"700\">73.250</text>\n  </g>\n\n  <text x=\"360\" y=\"600\" font-size=\"10.8\" fill=\"#333\">① Num: 5(7.185)−57·600</text>\n  <text x=\"374\" y=\"616\" font-size=\"10.8\" font-weight=\"700\" fill=\"#333\">= 1.725</text>\n  <text x=\"360\" y=\"636\" font-size=\"10.8\" fill=\"#333\">② 5(749)−57² = 496</text>\n  <text x=\"360\" y=\"654\" font-size=\"10.8\" fill=\"#333\">③ 5(73.250)−600²</text>\n  <text x=\"374\" y=\"670\" font-size=\"10.8\" font-weight=\"700\" fill=\"#333\">= 6.250</text>\n  <text x=\"360\" y=\"690\" font-size=\"10.8\" fill=\"#333\">④ √(496·6.250)</text>\n  <text x=\"374\" y=\"706\" font-size=\"10.8\" font-weight=\"700\" fill=\"#333\">≈ 1.760,7</text>\n\n  <rect x=\"56\" y=\"714\" width=\"498\" height=\"66\" rx=\"6\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"70\" y=\"736\" font-size=\"14\" font-weight=\"700\" fill=\"#C00000\">r = 1.725 / 1.760,7 ≈ 0,98</text>\n  <text x=\"70\" y=\"756\" font-size=\"11\" fill=\"#333\">→ correlación positiva <tspan font-weight=\"700\">muy fuerte</tspan>; se mueven casi en línea recta.</text>\n  <text x=\"70\" y=\"772\" font-size=\"11\" fill=\"#333\">→ R² = 0,98² = 0,96 ⇒ <tspan font-weight=\"700\">“la publicidad explica el 96% de la variación de las ventas”</tspan></text>\n\n  <!-- ===== LAS DOS ADVERTENCIAS ===== -->\n  <rect x=\"590\" y=\"550\" width=\"350\" height=\"242\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"2\"/>\n  <text x=\"606\" y=\"574\" font-size=\"14\" font-weight=\"700\" fill=\"#9C3838\">★ LAS 2 ADVERTENCIAS DE EXAMEN</text>\n\n  <text x=\"606\" y=\"600\" font-size=\"12\" font-weight=\"700\" fill=\"#C00000\">1 · Correlación ≠ Causalidad</text>\n  <text x=\"606\" y=\"618\" font-size=\"10.8\" fill=\"#333\">Moverse juntas no implica que una cause</text>\n  <text x=\"606\" y=\"634\" font-size=\"10.8\" fill=\"#333\">la otra. Puede haber una TERCERA variable</text>\n  <text x=\"606\" y=\"650\" font-size=\"10.8\" fill=\"#333\">moviendo a ambas, o pura coincidencia.</text>\n  <text x=\"606\" y=\"670\" font-size=\"10.5\" fill=\"#8A5A16\" font-style=\"italic\">Ej.: helados y ahogamientos suben juntos →</text>\n  <text x=\"606\" y=\"684\" font-size=\"10.5\" fill=\"#8A5A16\" font-style=\"italic\">no ahoga el helado: es el CALOR (3ª variable)</text>\n  <text x=\"606\" y=\"702\" font-size=\"10.5\" fill=\"#333\" font-weight=\"700\">r mide asociación, no causa.</text>\n\n  <line x1=\"606\" y1=\"712\" x2=\"924\" y2=\"712\" stroke=\"#E5C2C2\" stroke-width=\"1\"/>\n\n  <text x=\"606\" y=\"732\" font-size=\"12\" font-weight=\"700\" fill=\"#C00000\">2 · r bajo ≠ “sin relación”</text>\n  <text x=\"606\" y=\"750\" font-size=\"10.8\" fill=\"#333\">r mide SOLO relación lineal. Una U perfecta</text>\n  <text x=\"606\" y=\"766\" font-size=\"10.8\" fill=\"#333\">da r≈0 y la relación es fortísima (patrón 5).</text>\n  <text x=\"606\" y=\"784\" font-size=\"10.5\" fill=\"#C00000\" font-weight=\"700\">⇒ por eso: graficar SIEMPRE antes de calcular</text>\n\n  <!-- ===== PUENTE ===== -->\n  <line x1=\"490\" y1=\"796\" x2=\"490\" y2=\"814\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <rect x=\"40\" y=\"818\" width=\"900\" height=\"66\" rx=\"8\" fill=\"#EDF3F9\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"840\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">El puente hacia lo que viene</text>\n  <text x=\"58\" y=\"860\" font-size=\"11.5\" fill=\"#333\">· <tspan font-weight=\"700\">r</tspan> → ¿HAY relación lineal y cuán fuerte? (hoy)    · <tspan font-weight=\"700\">Regresión</tspan> → la ECUACIÓN de la recta para pronosticar (Clases 8–9)</text>\n  <text x=\"58\" y=\"878\" font-size=\"11.5\" fill=\"#333\">· <tspan font-weight=\"700\">R² = r²</tspan> → % de Y explicado    · <tspan font-weight=\"700\">Matriz de correlación</tspan> → todos los r cruzados, para elegir predictoras y detectar colinealidad (reg. múltiple)</text>\n\n  <!-- PIE EJERCICIO -->\n  <rect x=\"40\" y=\"896\" width=\"900\" height=\"66\" rx=\"6\" fill=\"#FAFAFA\" stroke=\"#CCC\"/>\n  <text x=\"56\" y=\"916\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">EJERCICIO — temperatura (X): 18, 25, 30, 22, 15  ·  ventas de bebidas (Y): 40, 65, 78, 52, 30</text>\n  <text x=\"56\" y=\"934\" font-size=\"11\" fill=\"#555\">a) tabla de 5 columnas y sumatorias   b) calcular r   c) interpretar dirección, fuerza y % explicado   d) ¿la temperatura CAUSA las ventas? justificar</text>\n  <text x=\"56\" y=\"952\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Graficar los puntos antes de calcular: es método y es puntaje.</text>\n</svg>"},{"type":"paragraph","text":"Parece compleja pero es pura sumatoria: se arma una tabla con columnas **X, Y, XY, X², Y²**, se suma cada columna y se reemplaza.","html":"Parece compleja pero es pura sumatoria: se arma una tabla con columnas <strong>X, Y, XY, X², Y²</strong>, se suma cada columna y se reemplaza."},{"type":"heading","level":3,"text":"Escala de lectura","html":"Escala de lectura"},{"type":"table","headers":["r","Interpretación"],"rows":[["---","---"],["+1","positiva perfecta"],["+0,7 a +0,99","positiva fuerte"],["+0,3 a +0,7","positiva moderada"],["≈ 0","sin relación **lineal**"],["−0,3 a −0,7","negativa moderada"],["−0,7 a −0,99","negativa fuerte"],["−1","negativa perfecta"]],"headersHtml":["r","Interpretación"],"rowsHtml":[["---","---"],["+1","positiva perfecta"],["+0,7 a +0,99","positiva fuerte"],["+0,3 a +0,7","positiva moderada"],["≈ 0","sin relación <strong>lineal</strong>"],["−0,3 a −0,7","negativa moderada"],["−0,7 a −0,99","negativa fuerte"],["−1","negativa perfecta"]]},{"type":"list","ordered":false,"items":["**El signo** → la **dirección** (¿suben juntas o en direcciones opuestas?)","**El valor absoluto** → la **fuerza** (qué tan pegados a la recta están los puntos)","**Siempre** entre −1 y +1. Si te da 1,3 o −2, hay error de cálculo."],"itemsHtml":["<strong>El signo</strong> → la <strong>dirección</strong> (¿suben juntas o en direcciones opuestas?)","<strong>El valor absoluto</strong> → la <strong>fuerza</strong> (qué tan pegados a la recta están los puntos)","<strong>Siempre</strong> entre −1 y +1. Si te da 1,3 o −2, hay error de cálculo."]},{"type":"heading","level":2,"text":"5. Ejemplo resuelto paso a paso","html":"5. Ejemplo resuelto paso a paso"},{"type":"paragraph","text":"**Datos:** publicidad (X) y ventas (Y), n = 5.","html":"<strong>Datos:</strong> publicidad (X) y ventas (Y), n = 5."},{"type":"table","headers":["X","Y","XY","X²","Y²"],"rows":[["---","---","---","---","---"],["10","120","1.200","100","14.400"],["15","135","2.025","225","18.225"],["8","105","840","64","11.025"],["18","140","2.520","324","19.600"],["6","100","600","36","10.000"],["**ΣX = 57**","**ΣY = 600**","**ΣXY = 7.185**","**ΣX² = 749**","**ΣY² = 73.250**"]],"headersHtml":["X","Y","XY","X²","Y²"],"rowsHtml":[["---","---","---","---","---"],["10","120","1.200","100","14.400"],["15","135","2.025","225","18.225"],["8","105","840","64","11.025"],["18","140","2.520","324","19.600"],["6","100","600","36","10.000"],["<strong>ΣX = 57</strong>","<strong>ΣY = 600</strong>","<strong>ΣXY = 7.185</strong>","<strong>ΣX² = 749</strong>","<strong>ΣY² = 73.250</strong>"]]},{"type":"par
