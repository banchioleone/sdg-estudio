<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistemas de Gestión · Estudio</title>
<style>
:root{
  --bg:#f4f1ea; --surf:#fff; --elev:#fffdf8; --ink:#1c232a; --muted:#5c6570;
  --line:#e3ddd2; --brand:#1f4e79; --brand-soft:#e7f0f7; --ok:#1e6b33; --ok-soft:#e7f5ec;
  --warn:#8a5a16; --warn-soft:#fff3e0; --sample:#7a4a12; --sample-bg:#fff6e4;
  --accent:#c05621; --shadow:0 8px 24px rgba(28,35,42,.07);
  --side:280px; --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:16px/1.5 var(--font);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.lms{display:flex;flex-direction:column;height:100%;min-height:100dvh;max-height:100dvh;overflow:hidden}
header.app{position:sticky;top:0;z-index:20;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px;background:var(--surf);border-bottom:1px solid var(--line)}
.burger{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--elev)}
.brand{flex:1;min-width:0}
.brand strong{display:block;font-size:15px}
.brand span{display:block;font-size:11px;color:var(--muted)}
.prog{width:min(200px,28vw)}
.prog label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .3s}
.shell{display:flex;flex:1;min-height:0}
aside.nav{width:var(--side);flex-shrink:0;background:var(--surf);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 28px}
.nav-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 10px}
.unit{margin:0 0 4px}
.unit b{display:block;padding:8px 10px;font-size:13.5px}
.unit b small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.lessons a,.lessons span{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-left:6px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px}
.lessons a:hover{background:var(--brand-soft)}
.lessons a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.live{background:var(--brand-soft);color:var(--brand)}
main{flex:1;min-width:0;overflow:auto;padding:28px 24px 40px}
.wrap{max-width:680px;margin:0 auto}
.banner{background:var(--sample-bg);border:1px dashed var(--sample);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:18px}
.banner strong{color:var(--sample)}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 8px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.lede{color:var(--muted);margin:0 0 18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sample);border:1px dashed var(--sample);border-radius:99px;padding:2px 8px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:16px}
.btn:active{transform:translateY(1px)}
.ghost{background:var(--elev);color:var(--ink);border:1px solid var(--line);font-weight:700;height:40px;padding:0 14px;border-radius:11px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.muted{color:var(--muted);font-size:14px}
.reset{margin-top:16px;font-size:12px;color:var(--brand);font-weight:700}
.back{display:none;position:fixed;inset:0;background:rgba(16,20,24,.4);z-index:30}

@media(max-width:860px){
  .burger{display:grid;place-items:center}
  .prog{width:100px}
  .prog .lab{display:none}
  aside.nav{position:fixed;z-index:40;top:0;left:0;bottom:0;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.nav.open{transform:none}
  .back.show{display:block}
  main{padding:20px 16px 32px}
  h1{font-size:24px}
}

/* STORIES */
#stories{display:none;position:fixed;inset:0;z-index:50;width:100%;height:100dvh;min-height:100dvh;background:#11161c;color:#f3f1ea;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#stories.on{display:flex;flex-direction:column}
.st-chrome{position:relative;flex:0 0 auto;z-index:4;padding:calc(10px + var(--top)) 12px 8px}
.st-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.x{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.st-name{flex:1;font-size:12.5px;font-weight:700;line-height:1.25;min-width:0}
.st-count{flex-shrink:0;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.75)}
.story-entry{margin:0 0 16px}
.story-chip{display:inline-flex;flex-direction:column;align-items:center;gap:5px;padding:0;background:none;border:0;color:var(--ink);min-width:64px}
.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#f9ce34 0%,#ee2a7b 48%,#6228d7 100%);display:grid;place-items:center}
.story-ring i{width:100%;height:100%;border-radius:50%;background:#fff;border:2.5px solid var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;letter-spacing:-.02em;color:#1f4e79}
.story-chip em{font-style:normal;font-size:11.5px;font-weight:700}
.mute{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);font-size:16px;flex-shrink:0;color:#fff}
.voice{width:34px;height:34px;border-radius:10px;flex-shrink:0;color:#fff;background:rgba(255,255,255,.12);display:grid;place-items:center;padding:0}
.voice svg{display:block}
header.app .voice{background:var(--elev);color:var(--ink);border:1px solid var(--line)}
.voice-menu{position:fixed;z-index:80;width:min(248px,calc(100vw - 20px));padding:6px;border-radius:16px;background:rgba(17,22,28,.94);color:#f3f1ea;border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
.voice-menu.light{background:rgba(255,253,248,.96);color:var(--ink);border-color:var(--line);box-shadow:0 12px 32px rgba(28,35,42,.14)}
.voice-menu[hidden]{display:none !important}
#voiceList{max-height:220px;overflow:auto}
.voice-menu .v{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;color:inherit}
.voice-menu .v b{font-size:13px;font-weight:700;line-height:1.25}
.voice-menu .v small{font-size:11px;color:#9aa3ad;font-weight:650}
.voice-menu.light .v small{color:var(--muted)}
.voice-menu .v.on{background:rgba(255,255,255,.12)}
.voice-menu.light .v.on{background:var(--brand-soft)}
.voice-menu .try{width:100%;margin-top:4px;border-radius:999px;padding:8px 10px;background:#fff;color:#111;font-size:13px;font-weight:700}
.voice-menu.light .try{background:var(--brand);color:#fff}
.voice-menu .empty{margin:6px 8px 8px;font-size:12.5px;line-height:1.35;color:#d5dbe2}
.voice-menu.light .empty{color:var(--muted)}
.voice-hint{position:fixed;left:50%;bottom:calc(16px + var(--bot));transform:translateX(-50%);z-index:90;max-width:min(340px,calc(100% - 24px));background:#11161c;color:#f3f1ea;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:650;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.voice-hint[hidden]{display:none !important}
.replay{position:absolute;right:16px;bottom:calc(16px + var(--bot));width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:16px;z-index:4}
.replay[hidden]{display:none !important}
.seg{display:flex;gap:4px;height:3px}
.seg i{flex:1;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.seg i b{display:block;height:100%;width:0;background:#fff}
.seg i.on b{width:100%}
.seg i.now b{width:0}
.hold-mark{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;font-size:22px;pointer-events:none}
.hold-mark[hidden]{display:none !important}
.stage{position:relative;flex:1 1 auto;min-height:0;z-index:2;display:flex;flex-direction:column;padding:8px 22px 0;pointer-events:none;overflow:hidden}
.hit{position:absolute;top:0;bottom:0;z-index:3}
.hit.L{left:0;width:18%}.hit.R{right:0;width:18%}
.stage .content{flex:1 1 auto;min-height:0;height:100%;pointer-events:auto;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;padding-bottom:calc(64px + var(--bot))}
.stage .content::-webkit-scrollbar{width:0;height:0;display:none}
.stage .content button,.stage .content .opts,.stage .content .audio,.stage .content .opts button{pointer-events:auto}
@media (max-width:480px){
  .stage h2{font-size:clamp(22px,6.2vw,30px);margin:0 0 8px}
  .stage p{font-size:16px;margin:0 0 10px}
}
.st-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e8c56a;border:1px dashed #e8c56a;border-radius:99px;padding:3px 8px;margin-bottom:12px}
.st-k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8cb4d6;margin:0 0 8px}
.stage h2{font-size:clamp(26px,7vw,36px);line-height:1.15;letter-spacing:-.03em;margin:0 0 12px}
.stage p{font-size:17px;line-height:1.4;color:#d5dbe2;margin:0 0 12px}
.chart{
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;padding:12px;margin:8px 0 12px;text-align:center;
}
.chart small{display:block;margin-top:6px;font-size:11px;color:#9aa3ad}
.chart svg{width:100%;height:auto;display:block}
.formula{font-family:Georgia,"Cambria Math",serif;font-size:16.5px;line-height:1.45;color:#f3f1ea;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;margin:0 0 12px;white-space:normal;overflow-x:auto}
.toc{margin:12px 0 0;padding:0;list-style:none}
.toc li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.toc li span{color:var(--muted);font-size:12px;font-weight:700;margin-right:8px}
/* TEORÍA */
.teoria{margin-top:32px}
.teoria h2{font-size:22px;letter-spacing:-.02em;margin:28px 0 10px}
.teoria h3{font-size:17.5px;margin:22px 0 8px;color:var(--brand)}
.teoria p{margin:0 0 12px;line-height:1.6}
.teoria ul,.teoria ol{margin:0 0 14px;padding-left:1.2em}
.teoria li{margin:0 0 6px;line-height:1.55}
blockquote.idea,blockquote.aviso,blockquote.examen{
  margin:0 0 18px;padding:12px 14px;border-radius:0 12px 12px 0;border-left:4px solid var(--brand);background:var(--brand-soft);
}
blockquote.aviso{border-left-color:var(--warn);background:var(--warn-soft)}
blockquote.examen{border-left-color:var(--ok);background:var(--ok-soft)}
.eq-wrap{margin:16px 0;padding:16px 18px;background:var(--elev);border:1px solid var(--line);border-radius:14px;text-align:center;overflow-x:auto}
.eq-block,.eq-inline{font-family:"Cambria Math",Georgia,"Times New Roman",serif;font-size:1.15em;line-height:1.6}
.eq-inline{font-size:1.05em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 .4em 2px;line-height:1.25}
.frac .den{padding:2px .4em 0;line-height:1.25}
.rad{border-top:1.5px solid currentColor;padding:0 2px}
.ov{border-top:1.5px solid currentColor;padding-top:1px}
.hat{position:relative}
.hat::before{content:"ˆ";position:absolute;left:50%;top:-.75em;transform:translateX(-50%);font-size:.85em;line-height:1}
.tabla-wrap{overflow-x:auto;margin:14px 0 18px;-webkit-overflow-scrolling:touch}
.teoria table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--surf)}
.teoria th,.teoria td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.teoria th{background:var(--brand-soft);font-weight:700}
.lamina{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:16px 0 20px;overflow-x:auto;box-shadow:var(--shadow)}
.lamina svg{width:100%;height:auto;display:block}
.lamina figcaption,.eq-wrap small{display:block;margin-top:8px;font-size:12.5px;color:var(--muted);text-align:center}
.ejemplo-box{background:var(--sample-bg);border:1px solid #e3d2b5;border-radius:14px;padding:14px 16px;margin:16px 0}
.ejemplo-box>.n{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sample);margin-bottom:8px}
.ejercicio{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:22px 0;background:var(--surf)}
.para-resolver{background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:var(--warn);font-weight:650}
details.solucion{margin-top:12px;background:var(--ok-soft);border-radius:10px;padding:8px 12px}
details.solucion summary{cursor:pointer;font-weight:700}
.glosario{margin:18px 0}
.glosario .sim{font-family:"Cambria Math",Georgia,serif;font-weight:700;white-space:nowrap}
.unit-link{display:block;width:100%;text-align:left}
.unit-link:hover b{color:var(--brand)}
.class-index{list-style:none;padding:0;margin:8px 0 0}
.class-index li{border-top:1px solid var(--line)}
.class-index a,.class-index span{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;text-decoration:none;color:var(--ink)}

.ej{
  background:rgba(232,197,106,.1);border:1px solid rgba(232,197,106,.3);
  border-radius:14px;padding:12px 14px;margin:8px 0 4px;
}
.ej .n{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e8c56a;margin-bottom:4px}
.ej p{margin:0;font-size:15px;color:#f3f1ea}
.audio{
  margin-top:16px;display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:#f3f1ea;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;
}
.audio .play{width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:11px}
.audio.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
.audio.on .play{background:#e25b16;color:#fff}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opts button{text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;font-size:15.5px;font-weight:650;color:#fff}
.opts button.correct{background:rgba(61,190,116,.3);border-color:#3dbe74}
.opts button.wrong{background:rgba(180,35,24,.32);border-color:#f07a70}
.fb{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(140,180,214,.15);font-size:14.5px}
.fb.show{display:block}
.close{text-align:center;align-items:center}
.trophy{width:84px;height:84px;border-radius:50%;background:#3dbe74;color:#111;display:grid;place-items:center;font-size:38px;font-weight:800;margin:0 auto 14px}
.score{font-size:18px;font-weight:700;margin:8px 0}
.score span{color:#3dbe74}
.hint{margin-top:18px;font-size:15px;color:#e8c56a;font-weight:700}
.toast{position:absolute;left:50%;bottom:calc(24px + var(--bot));transform:translateX(-50%) translateY(10px);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:6;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.slide{transition:transform .28s ease, opacity .28s ease}
.slide.up{transform:translateY(-18px);opacity:0}
.slide.down{transform:translateY(18px);opacity:0}
</style>
</head>
<body>
<div class="lms" id="lms">
  <header class="app">
    <button class="burger" id="btnMenu" type="button" aria-label="Abrir menú">☰</button>
    <div class="brand"><strong>Sistemas de Gestión</strong><span>UTN FRRo · Ingeniería en Sistemas</span></div>
    <div class="prog"><label><span class="lab">Progreso</span><span id="progTxt">0%</span></label><div class="bar"><i id="progFill"></i></div></div>
    <button class="voice" type="button" id="btnVoiceLms" aria-label="Elegir voz" aria-expanded="false" title="Voz"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2-1.5a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.3 1a7.4 7.4 0 0 0-2.6-1.5l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.4 7.4 0 0 0-2.6 1.5l-2.3-1a.5.5 0 0 0-.6.2L.6 8.4a.5.5 0 0 0 .1.6l2 1.5a7.7 7.7 0 0 0-.1 1.5 7.7 7.7 0 0 0 .1 1.5l-2 1.5a.5.5 0 0 0-.1.6l1.9 3.3a.5.5 0 0 0 .6.2l2.3-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5a.5.5 0 0 0 .5.4h3.8a.5.5 0 0 0 .5-.4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.3 1a.5.5 0 0 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </header>
  <div class="back" id="back"></div>
  <div class="shell">
    <aside class="nav" id="menu">
      <div class="nav-h" id="navH">Programa · 7 unidades</div>
      <div id="navUnits"></div>
      <button class="reset" type="button" id="btnReset">Reiniciar progreso</button>
    </aside>
    <main>
      <div class="wrap" id="main"></div>
    </main>
  </div>
</div>

<div id="stories" aria-modal="true">
  <div class="st-chrome">
    <div class="st-top">
      <button class="x" type="button" id="btnCloseSt" aria-label="Cerrar">✕</button>
      <div class="st-name" id="stName"></div>
      <button class="voice" type="button" id="btnVoice" aria-label="Elegir voz" aria-expanded="false" title="Voz"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2-1.5a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.3 1a7.4 7.4 0 0 0-2.6-1.5l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.4 7.4 0 0 0-2.6 1.5l-2.3-1a.5.5 0 0 0-.6.2L.6 8.4a.5.5 0 0 0 .1.6l2 1.5a7.7 7.7 0 0 0-.1 1.5 7.7 7.7 0 0 0 .1 1.5l-2 1.5a.5.5 0 0 0-.1.6l1.9 3.3a.5.5 0 0 0 .6.2l2.3-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5a.5.5 0 0 0 .5.4h3.8a.5.5 0 0 0 .5-.4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.3 1a.5.5 0 0 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
      <button class="mute" type="button" id="btnMute" aria-label="Activar audio">🔇</button>
      <div class="st-count" id="stCount"></div>
    </div>
    <div class="seg" id="seg"></div>
  </div>
  <div class="hit L" id="hitL"></div>
