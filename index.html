ect x=\"60\" y=\"200\" width=\"580\" height=\"60\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SÍ → MÉTODOS CUANTITATIVOS</text>\n  <text x=\"76\" y=\"242\" font-size=\"11\" fill=\"#333\">② ¿Explico la serie con SU PROPIO pasado, o con OTRAS variables?</text>\n  <text x=\"76\" y=\"256\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">(en la práctica se combinan: lo cuantitativo se ajusta con juicio experto)</text>\n\n  <line x1=\"200\" y1=\"260\" x2=\"200\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"500\" y1=\"260\" x2=\"500\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- CAUSALES -->\n  <rect x=\"360\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"376\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#9C3838\">CAUSALES / EXPLICATIVOS</text>\n  <text x=\"376\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Las ventas dependen de X” (precio,</text>\n  <text x=\"376\" y=\"343\" font-size=\"10.8\" fill=\"#333\">publicidad, PBI, temperatura…)</text>\n  <text x=\"376\" y=\"363\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión simple (1 variable X)</text>\n  <text x=\"376\" y=\"379\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión múltiple (varias X)</text>\n  <text x=\"376\" y=\"396\" font-size=\"10.5\" fill=\"#666\">· Modelos econométricos · indicadores</text>\n\n  <!-- SERIES DE TIEMPO -->\n  <rect x=\"60\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SERIES DE TIEMPO</text>\n  <text x=\"76\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Proyecto el patrón que la serie</text>\n  <text x=\"76\" y=\"343\" font-size=\"10.8\" fill=\"#333\">viene mostrando en el tiempo”</text>\n  <text x=\"76\" y=\"366\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">③ ¿QUÉ PATRÓN tiene la serie?</text>\n  <text x=\"76\" y=\"384\" font-size=\"10.5\" fill=\"#666\">→ mirar el gráfico y el correlograma</text>\n  <text x=\"76\" y=\"399\" font-size=\"10.5\" fill=\"#666\">→ bajar a los 4 casos de abajo ↓</text>\n\n  <line x1=\"200\" y1=\"408\" x2=\"200\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"880\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"120\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"373\" y1=\"430\" x2=\"373\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"627\" y1=\"430\" x2=\"627\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"880\" y1=\"430\" x2=\"880\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- ===== CASO A: ESTACIONARIA ===== -->\n  <rect x=\"40\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"54\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">A · ESTACIONARIA</text>\n  <text x=\"54\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">promedio constante, sin rumbo</text>\n  <line x1=\"58\" y1=\"536\" x2=\"58\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"536\" x2=\"248\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"520\" x2=\"248\" y2=\"520\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <polyline points=\"64,526 88,512 112,528 136,514 160,530 184,512 208,524 236,516\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n\n  <text x=\"54\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">MÉTODOS:</text>\n  <text x=\"54\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Promedio simple (todo el historial)</text>\n  <text x=\"54\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil de orden n</text>\n  <text x=\"54\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Suavizado exponencial simple (SES)</tspan></text>\n  <text x=\"54\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Métodos ingenuos: Ŷₜ₊₁ = Yₜ</text>\n  <text x=\"54\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins (ARIMA)</text>\n\n  <rect x=\"52\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <text x=\"62\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\">Elegir n / α:</text>\n  <text x=\"62\" y=\"683\" font-size=\"9.8\" fill=\"#333\">n grande o α chico → más suave</text>\n  <text x=\"62\" y=\"697\" font-size=\"9.8\" fill=\"#333\">n chico o α grande → más reactivo</text>\n\n  <text x=\"54\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"54\" y=\"744\" font-size=\"10\" fill=\"#333\">· Panadería de barrio estable</text>\n  <text x=\"54\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto maduro sin cambios</text>\n  <text x=\"54\" y=\"772\" font-size=\"10\" fill=\"#333\">· Repuestos de demanda pareja</text>\n\n  <!-- ===== CASO B: TENDENCIA ===== -->\n  <rect x=\"274\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">B · TENDENCIA</text>\n  <text x=\"288\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">sube o baja sostenidamente</text>\n  <line x1=\"292\" y1=\"536\" x2=\"292\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"292\" y1=\"536\" x2=\"482\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"298,530 326,522 354,514 382,506 410,514 438,500 466,492\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n\n  <text x=\"288\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODOS:</text>\n  <text x=\"288\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Holt</tspan> (suav. exp. 2 parámetros α, β)</text>\n  <text x=\"288\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Brown (suav. exp. doble, 1 parám.)</text>\n  <text x=\"288\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil doble</text>\n  <text x=\"288\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión simple contra el tiempo</text>\n  <text x=\"288\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Gompertz, curvas de crecimiento</text>\n\n  <rect x=\"286\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"296\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1F4E79\">Holt vs. Brown:</text>\n  <text x=\"296\" y=\"683\" font-size=\"9.8\" fill=\"#333\">Brown usa un solo α → tendencia</text>\n  <text x=\"296\" y=\"697\" font-size=\"9.8\" fill=\"#333\">sensible al ruido. Holt separa β → mejor.</text>\n\n  <text x=\"288\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"288\" y=\"744\" font-size=\"10\" fill=\"#333\">· Suscripciones de una app en alza</text>\n  <text x=\"288\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto en etapa de crecimiento</text>\n  <text x=\"288\" y=\"772\" font-size=\"10\" fill=\"#333\">· Serie inflacionada año a año</text>\n\n  <!-- ===== CASO C: ESTACIONALIDAD ===== -->\n  <rect x=\"508\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#8A5A16\" stroke-width=\"2\"/>\n  <text x=\"522\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · ESTACIONALIDAD</text>\n  <text x=\"522\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">patrón fijo que se repite cada año</text>\n  <line x1=\"526\" y1=\"536\" x2=\"526\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"526\" y1=\"536\" x2=\"716\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 532 528 L 548 508 L 564 528 L 580 530 L 596 508 L 612 528 L 628 530 L 644 506 L 660 528 L 676 530 L 700 508\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2\"/>\n\n  <text x=\"522\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">MÉTODOS:</text>\n  <text x=\"522\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Winter</tspan> (suav. exp. 3 parám. α, β, γ)</text>\n  <text x=\"522\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Descomposición clásica</tspan> (multiplicativa)</text>\n  <text x=\"522\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Desestacionalizar → pronosticar →</text>\n  <text x=\"532\" y=\"622\" font-size=\"10.8\" fill=\"#333\">re-estacionalizar</text>\n  <text x=\"522\" y=\"638\" font-size=\"10.5\" fill=\"#666\">· Regresión múltiple con dummies · Census II</text>\n\n  <rect x=\"520\" y=\"648\" width=\"198\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"530\" y=\"666\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">Ojo con L y la cantidad de datos:</text>\n  <text x=\"530\" y=\"681\" font-size=\"9.8\" fill=\"#333\">L=4 (trim.) · L=12 (mens.) · L=7 (diario)</text>\n  <text x=\"530\" y=\"695\" font-size=\"9.8\" fill=\"#333\">Winter necesita ≥ 2 ciclos completos</text>\n\n  <text x=\"522\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"522\" y=\"744\" font-size=\"10\" fill=\"#333\">· Heladería / aires acondicionados</text>\n  <text x=\"522\" y=\"758\" font-size=\"10\" fill=\"#333\">· Ventas de diciembre, útiles escolares</text>\n  <text x=\"522\" y=\"772\" font-size=\"10\" fill=\"#333\">· Consumo eléctrico</text>\n\n  <!-- ===== CASO D: CICLO ===== -->\n  <rect x=\"742\" y=\"456\" width=\"218\" height=\"330\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"756\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">D · CICLO</text>\n  <text x=\"756\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">ondas plurianuales, período variable</text>\n  <line x1=\"760\" y1=\"536\" x2=\"760\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"760\" y1=\"536\" x2=\"946\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 766 518 C 792 496, 812 496, 834 522 C 858 548, 882 546, 906 512 C 916 498, 926 494, 936 492\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n\n  <text x=\"756\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#5B3E8E\">MÉTODOS:</text>\n  <text x=\"756\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Descomposición clásica</text>\n  <text x=\"756\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Indicadores económicos (líderes)</text>\n  <text x=\"756\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Modelos econométricos</text>\n  <text x=\"756\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión múltiple</text>\n  <text x=\"756\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins</text>\n\n  <rect x=\"754\" y=\"650\" width=\"196\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"764\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">⚠ El más difícil de todos:</text>\n  <text x=\"764\" y=\"683\" font-size=\"9.8\" fill=\"#333\">no tiene período fijo → los métodos</text>\n  <text x=\"764\" y=\"697\" font-size=\"9.8\" fill=\"#333\">de suavizado NO capturan giros bruscos</text>\n\n  <text x=\"756\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"756\" y=\"744\" font-size=\"10\" fill=\"#333\">· Construcción, acero, automotriz</text>\n  <text x=\"756\" y=\"758\" font-size=\"10\" fill=\"#333\">· Bienes durables y de capital</text>\n  <text x=\"756\" y=\"772\" font-size=\"10\" fill=\"#333\">· Cualquier serie ligada al PBI</text>\n\n  <!-- ===== CASO COMBINADO ===== -->\n  <rect x=\"40\" y=\"800\" width=\"920\" height=\"96\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">★ EL CASO MÁS FRECUENTE EN EXAMEN: TENDENCIA **+** ESTACIONALIDAD (los patrones se combinan)</text>\n  <text x=\"56\" y=\"844\" font-size=\"11.5\" fill=\"#333\">Si la serie sube año a año Y además repite picos estacionales → <tspan font-weight=\"700\" fill=\"#C00000\">WINTER</tspan> (captura ambos) o <tspan font-weight=\"700\" fill=\"#C00000\">DESCOMPOSICIÓN</tspan> (los separa y proyecta por partes).</text>\n  <text x=\"56\" y=\"864\" font-size=\"11.5\" fill=\"#333\">Alternativa válida y muy defendible: <tspan font-weight=\"700\">desestacionalizar</tspan> la serie → aplicar Holt a la serie sin estacionalidad → <tspan font-weight=\"700\">re-estacionalizar</tspan> el pronóstico.</text>\n  <text x=\"56\" y=\"884\" font-size=\"11\" fill=\"#8A5A16\" font-style=\"italic\">Nunca usar suavizado simple ni promedio móvil acá: van siempre “atrás” de la serie y subestiman sistemáticamente (sesgo visible en el PME).</text>\n\n  <!-- ===== FACTORES ADICIONALES ===== -->\n  <rect x=\"40\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">④ Otros factores que inclinan la elección</text>\n\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">HORIZONTE:</text>\n  <text x=\"66\" y=\"970\" font-size=\"10.5\" fill=\"#333\">· Corto plazo (días–meses) → suavizados, promedios</text>\n  <text x=\"66\" y=\"985\" font-size=\"10.5\" fill=\"#333\">· Mediano (meses–2 años) → regresión, descomposición</text>\n  <text x=\"66\" y=\"1000\" font-size=\"10.5\" fill=\"#333\">· Largo plazo (&gt;2 años) → cualitativos, econométricos</text>\n\n  <text x=\"56\" y=\"1022\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">CANTIDAD DE DATOS:</text>\n  <text x=\"66\" y=\"1038\" font-size=\"10.5\" fill=\"#333\">· Muy pocos → ingenuos o promedio simple (y graficar!)</text>\n  <text x=\"66\" y=\"1053\" font-size=\"10.5\" fill=\"#333\">· Winter/descomposición exigen ≥2 ciclos completos</text>\n\n  <text x=\"56\" y=\"1075\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">OTROS CRITERIOS (Hanke):</text>\n  <text x=\"66\" y=\"1091\" font-size=\"10.5\" fill=\"#333\">· Costo del método vs. beneficio del pronóstico</text>\n  <text x=\"66\" y=\"1106\" font-size=\"10.5\" fill=\"#333\">· Facilidad de comprensión para quien decide</text>\n  <text x=\"66\" y=\"1121\" font-size=\"10.5\" fill=\"#333\">· Precisión requerida y confiabilidad</text>\n\n  <!-- ===== VALIDACION ===== -->\n  <rect x=\"510\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"526\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">⑤ Elegido el método… ¡hay que VALIDARLO!</text>\n  <text x=\"526\" y=\"952\" font-size=\"11\" fill=\"#333\">El árbol propone candidatos; la <tspan font-weight=\"700\">medida de error decide</tspan>.</text>\n\n  <text x=\"526\" y=\"976\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">Procedimiento (Hanke cap. 5):</text>\n  <text x=\"536\" y=\"992\" font-size=\"10.5\" fill=\"#333\">① Partir los datos: inicialización + prueba</text>\n  <text x=\"536\" y=\"1007\" font-size=\"10.5\" fill=\"#333\">② Ajustar el método con la parte de inicialización</text>\n  <text x=\"536\" y=\"1022\" font-size=\"10.5\" fill=\"#333\">③ Pronosticar la parte de prueba y medir el error</text>\n  <text x=\"536\" y=\"1037\" font-size=\"10.5\" fill=\"#333\">④ Comparar contra un método alternativo</text>\n  <text x=\"536\" y=\"1052\" font-size=\"10.5\" fill=\"#333\">⑤ Decidir: usarlo, ajustarlo o cambiarlo</text>\n\n  <rect x=\"526\" y=\"1062\" width=\"418\" height=\"56\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"536\" y=\"1080\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">Qué mirar en los errores:</text>\n  <text x=\"536\" y=\"1095\" font-size=\"10\" fill=\"#333\">MAD/MSE/MAPE bajos = buen ajuste · <tspan font-weight=\"700\">PME ≈ 0 = sin sesgo</tspan></text>\n  <text x=\"536\" y=\"1110\" font-size=\"10\" fill=\"#333\">Si el PME es grande y del mismo signo → el método pierde un patrón</text>\n\n  <!-- ===== EJEMPLOS RESUELTOS ===== -->\n  <rect x=\"40\" y=\"1142\" width=\"920\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"1164\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">DIAGNÓSTICOS RESUELTOS — así se redacta la justificación en el examen</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"1174\" width=\"888\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"66\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Serie</text>\n    <text x=\"330\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Diagnóstico</text>\n    <text x=\"600\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Método y justificación</text>\n\n    <rect x=\"56\" y=\"1194\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1210\" fill=\"#333\">Ventas parejas 900–1.100 kg hace 10 años</text>\n    <text x=\"330\" y=\"1210\" fill=\"#333\">estacionaria, solo irregularidad</text>\n    <text x=\"600\" y=\"1210\" fill=\"#1E6B33\" font-weight=\"700\">SES o promedio móvil: no hay patrón que proyectar</text>\n\n    <rect x=\"56\" y=\"1218\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1234\" fill=\"#333\">App: 1.000 → 2.290 creciendo parejo</text>\n    <text x=\"330\" y=\"1234\" fill=\"#333\">tendencia lineal, sin estacionalidad</text>\n    <text x=\"600\" y=\"1234\" fill=\"#1F4E79\" font-weight=\"700\">Holt o regresión vs. tiempo: capturan la pendiente</text>\n\n    <rect x=\"56\" y=\"1242\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1258\" fill=\"#333\">Heladería trimestral, picos en T1 y T4, subiendo</text>\n    <text x=\"330\" y=\"1258\" fill=\"#333\">tendencia + estacionalidad (L=4)</text>\n    <text x=\"600\" y=\"1258\" fill=\"#C00000\" font-weight=\"700\">WINTER o descomposición multiplicativa</text>\n\n    <rect x=\"56\" y=\"1266\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1282\" fill=\"#333\">Constructora: sube, se derrumba 3 años, se recupera</text>\n    <text x=\"330\" y=\"1282\" fill=\"#333\">ciclo dominante (+ tendencia)</text>\n    <text x=\"600\" y=\"1282\" fill=\"#5B3E8E\" font-weight=\"700\">Descomposición o indicadores económicos; no suavizado</text>\n\n    <rect x=\"56\" y=\"1290\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1306\" fill=\"#333\">Producto nuevo, sin historia</text>\n    <text x=\"330\" y=\"1306\" fill=\"#333\">sin datos utilizables</text>\n    <text x=\"600\" y=\"1306\" fill=\"#5B3E8E\" font-weight=\"700\">Cualitativo: Delphi, analogía histórica, investigación</text>\n\n    <rect x=\"56\" y=\"1314\" width=\"888\" height=\"22\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1329\" fill=\"#333\">Ventas explicadas por publicidad y precio</text>\n    <text x=\"330\" y=\"1329\" fill=\"#333\">relación causal con otras variables</text>\n    <text x=\"600\" y=\"1329\" fill=\"#9C3838\" font-weight=\"700\">Regresión múltiple (revisar colinealidad y residuos)</text>\n  </g>\n</svg>"},{"type":"callout","kind":"examen","text":"**En el examen**, «justifique la metodología aplicada» se responde con este árbol: si la serie es estacionaria, un promedio simple o un promedio móvil son candidatos; si tiene tendencia lineal, el candidato de esta clase es el promedio móvil doble.","html":"<strong>En el examen</strong>, «justifique la metodología aplicada» se responde con este árbol: si la serie es estacionaria, un promedio simple o un promedio móvil son candidatos; si tiene tendencia lineal, el candidato de esta clase es el promedio móvil doble."},{"type":"heading","level":2,"text":"2. Tres enfoques, y cómo se evalúan","html":"2. Tres enfoques, y cómo se evalúan"},{"type":"paragraph","text":"El capítulo (en el Resumen V6 aparece como **Capítulo 4: Métodos de promedios móviles y de suavización**; en los resúmenes de Hanke de 25 y de 7 páginas, como **Capítulo 5** — cambia el numerado según la edición) describe tres enfoques:","html":"El capítulo (en el Resumen V6 aparece como <strong>Capítulo 4: Métodos de promedios móviles y de suavización</strong>; en los resúmenes de Hanke de 25 y de 7 páginas, como <strong>Capítulo 5</strong> — cambia el numerado según la edición) describe tres enfoques:"},{"type":"list","ordered":true,"items":["**Informal / no formal:** modelos simples que suponen que los datos más recientes ofrecen las mejores predicciones del futuro.","**Promedios:** el pronóstico es un promedio de observaciones pasadas.","**Suavización:** promedio de valores pasados con ponderaciones que decrecen en forma exponencial. **Eso es la Clase 6.**"],"itemsHtml":["<strong>Informal / no formal:</strong> modelos simples que suponen que los datos más recientes ofrecen las mejores predicciones del futuro.","<strong>Promedios:</strong> el pronóstico es un promedio de observaciones pasadas.","<strong>Suavización:</strong> promedio de valores pasados con ponderaciones que decrecen en forma exponencial. <strong>Eso es la Clase 6.</strong>"]},{"type":"paragraph","text":"Hanke repite acá la misma **estrategia de evaluación** que ya vimos en la Clase 4:","html":"Hanke repite acá la misma <strong>estrategia de evaluación</strong> que ya vimos en la Clase 4:"},{"type":"list","ordered":true,"items":["Se elige un método según el análisis y la intuición del pronosticador sobre la naturaleza de los datos.","Se divide el conjunto en una sección de **inicio o ajuste** y una sección de **prueba o pronóstico**.","Se ajusta la técnica con la primera parte.","Se pronostica la segunda, se compara con lo real y se evalúa el **error de pronóstico** ($e_t$).","Se decide: dejar la técnica como está, modificarla, o probar otra y comparar."],"itemsHtml":["Se elige un método según el análisis y la intuición del pronosticador sobre la naturaleza de los datos.","Se divide el conjunto en una sección de <strong>inicio o ajuste</strong> y una sección de <strong>prueba o pronóstico</strong>.","Se ajusta la técnica con la primera parte.","Se pronostica la segunda, se compara con lo real y se evalúa el <strong>error de pronóstico</strong> (<span class=\"eq-inline\">e<sub>t</sub></span>).","Se decide: dejar la técnica como está, modificarla, o probar otra y comparar."]},{"type":"paragraph","text":"No midas el error sobre los mismos datos con los que ajustaste: eso ya quedó en la Clase 4. Acá lo traigo porque el capítulo de promedios **abre** con esos cinco pasos.","html":"No midas el error sobre los mismos datos con los que ajustaste: eso ya quedó en la Clase 4. Acá lo traigo porque el capítulo de promedios <strong>abre</strong> con esos cinco pasos."},{"type":"heading","level":2,"text":"3. Modelos no formales (informales)","html":"3. Modelos no formales (informales)"},{"type":"paragraph","text":"Hanke los llama **no formales**; el Resumen V6, **informales**. Sirven cuando hay **muy pocos datos** —el V6 pone el caso de un negocio nuevo— porque muchas técnicas piden series largas. También se usan **como base de comparación** para evaluar métodos más complejos. El V6 lo dice claro: el número y la complejidad de estos modelos están limitados solo por el **ingenio del analista**, pero hay que usarlos con buen juicio.","html":"Hanke los llama <strong>no formales</strong>; el Resumen V6, <strong>informales</strong>. Sirven cuando hay <strong>muy pocos datos</strong> —el V6 pone el caso de un negocio nuevo— porque muchas técnicas piden series largas. También se usan <strong>como base de comparación</strong> para evaluar métodos más complejos. El V6 lo dice claro: el número y la complejidad de estos modelos están limitados solo por el <strong>ingenio del analista</strong>, pero hay que usarlos con buen juicio."},{"type":"heading","level":3,"text":"3.1 El más sencillo: «sin cambio»","html":"3.1 El más sencillo: «sin cambio»"},{"type":"paragraph","text":"La hipótesis: los períodos recientes son los mejores para predecir el futuro. El modelo más simple es el pronóstico de cada período igual a la observación inmediata anterior. El V6 lo llama pronóstico **«sin cambio»**. Se da el **100% del peso** al valor actual de la serie. $\\hat{Y}_{t+1}$ es el pronóstico hecho en el momento $t$ (origen del pronóstico) para el tiempo $t+1$.","html":"La hipótesis: los períodos recientes son los mejores para predecir el futuro. El modelo más simple es el pronóstico de cada período igual a la observación inmediata anterior. El V6 lo llama pronóstico <strong>«sin cambio»</strong>. Se da el <strong>100% del peso</strong> al valor actual de la serie. <span class=\"eq-inline\"><span class=\"hat\">Y</span><sub>t+1</sub></span> es el pronóstico hecho en el momento <span class=\"eq-inline\">t</span> (origen del pronóstico) para el tiempo <span class=\"eq-inline\">t+1</span>."},{"type":"formula","tex":"\\hat{Y}_{t+1} = Y_t","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t</sub></span>"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><text x=\"8\" y=\"14\" font-size=\"9\" fill=\"#5c6670\">Esquema — no es una serie del apunte</text><polyline fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.8\" points=\"24.0,82.0 66.0,68.0 108.0,90.0 150.0,60.0 192.0,78.0\"/><circle cx=\"24.0\" cy=\"82.0\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"66.0\" cy=\"68.0\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"108.0\" cy=\"90.0\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"150.0\" cy=\"60.0\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"192.0\" cy=\"78.0\" r=\"3.2\" fill=\"#1f4e79\"/><line x1=\"192.0\" y1=\"78.0\" x2=\"234.0\" y2=\"78.0\" stroke=\"#c45c26\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/><circle cx=\"234.0\" cy=\"78.0\" r=\"4\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.8\"/><text x=\"234.0\" y=\"68.0\" font-size=\"9\" fill=\"#c45c26\" font-weight=\"700\" text-anchor=\"middle\">Ŷₜ₊₁ = Yₜ</text><text x=\"140\" y=\"112\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">El 100% del peso va al valor actual. Copia también las fluctuaciones.</text></svg>","caption":"Esquema del informal «sin cambio»: el próximo pronóstico copia el último valor observado. No es una serie del apunte."},{"type":"paragraph","text":"Como descarta cualquier otra observación, **detecta los cambios muy rápido**. El problema, dice el V6, es que las **fluctuaciones aleatorias** se reproducen con la misma fidelidad que los cambios de fondo.","html":"Como descarta cualquier otra observación, <strong>detecta los cambios muy rápido</strong>. El problema, dice el V6, es que las <strong>fluctuaciones aleatorias</strong> se reproducen con la misma fidelidad que los cambios de fondo."},{"type":"heading","level":3,"text":"3.2 Si hay tendencia","html":"3.2 Si hay tendencia"},{"type":"paragraph","text":"Cuando los valores aumentan con el tiempo, el V6 dice que son de **nivel no estacionario** o que tienen una **tendencia**. Se puede ajustar el informal **sumando la diferencia** entre este período y el anterior (Hanke 25p trae la misma ecuación):","html":"Cuando los valores aumentan con el tiempo, el V6 dice que son de <strong>nivel no estacionario</strong> o que tienen una <strong>tendencia</strong>. Se puede ajustar el informal <strong>sumando la diferencia</strong> entre este período y el anterior (Hanke 25p trae la misma ecuación):"},{"type":"formula","tex":"\\hat{Y}_{t+1} = Y_t + (Y_t - Y_{t-1})","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t</sub> + (Y<sub>t</sub> - Y<sub>t-1</sub>)</span>"},{"type":"paragraph","text":"En algunos casos, dice el V6, conviene más la **tasa de cambio** que el cambio absoluto:","html":"En algunos casos, dice el V6, conviene más la <strong>tasa de cambio</strong> que el cambio absoluto:"},{"type":"formula","tex":"\\hat{Y}_{t+1} = Y_t \\cdot \\frac{Y_t}{Y_{t-1}}","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t</sub> · <span class=\"frac\"><span class=\"num\">Y<sub>t</sub></span><span class=\"den\">Y<sub>t-1</sub></span></span></span>"},{"type":"heading","level":3,"text":"3.3 Si hay estacionalidad trimestral","html":"3.3 Si hay estacionalidad trimestral"},{"type":"paragraph","text":"Si el patrón estacional es fuerte, el V6 propone, para datos **trimestrales**, copiar el mismo trimestre del año anterior:","html":"Si el patrón estacional es fuerte, el V6 propone, para datos <strong>trimestrales</strong>, copiar el mismo trimestre del año anterior:"},{"type":"formula","tex":"\\hat{Y}_{t+1} = Y_{t-3}","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t-3</sub></span>"},{"type":"paragraph","text":"Eso quiere decir: el próximo trimestre tendrá el mismo valor que el trimestre correspondiente del año anterior. La debilidad, según el V6, es que **ignora todo lo ocurrido desde el año anterior y también cualquier tendencia**. Una forma de meter esa información reciente:","html":"Eso quiere decir: el próximo trimestre tendrá el mismo valor que el trimestre correspondiente del año anterior. La debilidad, según el V6, es que <strong>ignora todo lo ocurrido desde el año anterior y también cualquier tendencia</strong>. Una forma de meter esa información reciente:"},{"type":"formula","tex":"\\hat{Y}_{t+1} = Y_{t-3} + \\frac{Y_t - Y_{t-4}}{4}","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t-3</sub> + <span class=\"frac\"><span class=\"num\">Y<sub>t</sub> - Y<sub>t-4</sub></span><span class=\"den\">4</span></span></span>"},{"type":"paragraph","text":"El término $Y_{t-3}$ arrastra el patrón estacional; el otro promedia la magnitud del cambio de los cuatro trimestres anteriores y estima la tendencia. (En el V6 también aparece escrito como el promedio de las cuatro diferencias $(Y_t-Y_{t-1})+…+(Y_{t-3}-Y_{t-4})$, que es lo mismo que $(Y_t-Y_{t-4})/4$.)","html":"El término <span class=\"eq-inline\">Y<sub>t-3</sub></span> arrastra el patrón estacional; el otro promedia la magnitud del cambio de los cuatro trimestres anteriores y estima la tendencia. (En el V6 también aparece escrito como el promedio de las cuatro diferencias <span class=\"eq-inline\">(Y<sub>t</sub>-Y<sub>t-1</sub>)+…+(Y<sub>t-3</sub>-Y<sub>t-4</sub>)</span>, que es lo mismo que <span class=\"eq-inline\">(Y<sub>t</sub>-Y<sub>t-4</sub>)/4</span>.)"},{"type":"heading","level":2,"text":"4. Métodos basados en promedios","html":"4. Métodos basados en promedios"},{"type":"paragraph","text":"Estas técnicas usan alguna forma de **promedio ponderado** de observaciones pasadas para suavizar las fluctuaciones de corto plazo. La suposición (Hanke / V6): esas fluctuaciones son apartamientos aleatorios de una estructura (una «curva atenuada», en el 25p). Una vez identificada, se la proyecta hacia el futuro.","html":"Estas técnicas usan alguna forma de <strong>promedio ponderado</strong> de observaciones pasadas para suavizar las fluctuaciones de corto plazo. La suposición (Hanke / V6): esas fluctuaciones son apartamientos aleatorios de una estructura (una «curva atenuada», en el 25p). Una vez identificada, se la proyecta hacia el futuro."},{"type":"heading","level":3,"text":"4.1 Promedio simple","html":"4.1 Promedio simple"},{"type":"paragraph","text":"Se usa la **media de todos los valores pertinentes** (Hanke 25p y 7p) como pronóstico del período siguiente. En la práctica, se toma una parte de los datos como **inicialización**, se la promedia, y ese promedio pronostica el período que sigue. El Resumen V6 lo escribe así ($n$ es la cantidad de observaciones de esa parte de inicialización; el índice superior de la suma aparece como $t$):","html":"Se usa la <strong>media de todos los valores pertinentes</strong> (Hanke 25p y 7p) como pronóstico del período siguiente. En la práctica, se toma una parte de los datos como <strong>inicialización</strong>, se la promedia, y ese promedio pronostica el período que sigue. El Resumen V6 lo escribe así (<span class=\"eq-inline\">n</span> es la cantidad de observaciones de esa parte de inicialización; el índice superior de la suma aparece como <span class=\"eq-inline\">t</span>):"},{"type":"formula","tex":"\\hat{Y}_{t+1} = \\frac{1}{n}\\sum_{i=1}^{t} Y_i","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n</span></span><span class=\"op\">Σ<sub>i=1</sub><sup>t</sup></span> Y<sub>i</sub></span>"},{"type":"paragraph","text":"Cuando entra una observación nueva, no hace falta guardar toda la historia: alcanza el último pronóstico y el último dato. El V6 da esta forma de actualización:","html":"Cuando entra una observación nueva, no hace falta guardar toda la historia: alcanza el último pronóstico y el último dato. El V6 da esta forma de actualización:"},{"type":"formula","tex":"\\hat{Y}_{t+2} = \\frac{t \\hat{Y}_{t+1} + Y_{t+1}}{t+1}","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+2</sub> = <span class=\"frac\"><span class=\"num\">t <span class=\"hat\">Y</span><sub>t+1</sub> + Y<sub>t+1</sub></span><span class=\"den\">t+1</span></span></span>"},{"type":"paragraph","text":"**Cuándo usarlo.** Hanke 25p y 7p: cuando los datos son **estacionarios** (sin tendencia, estacionalidad u otros patrones). El V6 lo dice en otros términos: cuando los factores que producen la serie **se estabilizaron** y el ambiente **permanece sin cambios**.","html":"<strong>Cuándo usarlo.</strong> Hanke 25p y 7p: cuando los datos son <strong>estacionarios</strong> (sin tendencia, estacionalidad u otros patrones). El V6 lo dice en otros términos: cuando los factores que producen la serie <strong>se estabilizaron</strong> y el ambiente <strong>permanece sin cambios</strong>."},{"type":"heading","level":3,"text":"4.2 Promedio móvil, $MA(k)$","html":"4.2 Promedio móvil, <span class=\"eq-inline\">MA(k)</span>"},{"type":"paragraph","text":"El promedio simple usa **todos** los datos. Si el analista está más interesado en las observaciones recientes, se fija un número constante de puntos y se calcula la media solo con los **más recientes**. Cuando entra un dato nuevo, se suma ese valor y se **elimina el más antiguo**. El tamaño de la ventana no cambia con el tiempo.","html":"El promedio simple usa <strong>todos</strong> los datos. Si el analista está más interesado en las observaciones recientes, se fija un número constante de puntos y se calcula la media solo con los <strong>más recientes</strong>. Cuando entra un dato nuevo, se suma ese valor y se <strong>elimina el más antiguo</strong>. El tamaño de la ventana no cambia con el tiempo."},{"type":"paragraph","text":"El V6 llama $k$ al número de términos (un promedio móvil de orden $k$, $MA(k)$). El resumen de Hanke de 25 páginas usa $n$ para lo mismo. Acá dejo la $k$ del V6:","html":"El V6 llama <span class=\"eq-inline\">k</span> al número de términos (un promedio móvil de orden <span class=\"eq-inline\">k</span>, <span class=\"eq-inline\">MA(k)</span>). El resumen de Hanke de 25 páginas usa <span class=\"eq-inline\">n</span> para lo mismo. Acá dejo la <span class=\"eq-inline\">k</span> del V6:"},{"type":"formula","tex":"\\hat{Y}_{t+1} = \\frac{Y_t + Y_{t-1} + \\ldots + Y_{t-k+1}}{k}","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = <span class=\"frac\"><span class=\"num\">Y<sub>t</sub> + Y<sub>t-1</sub> + … + Y<sub>t-k+1</sub></span><span class=\"den\">k</span></span></span>"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 128\" width=\"100%\" height=\"128\" aria-hidden=\"true\"><text x=\"8\" y=\"14\" font-size=\"9\" fill=\"#5c6670\">Esquema — no es una serie del apunte</text><rect x=\"94\" y=\"42\" width=\"122\" height=\"40\" rx=\"8\" fill=\"#c45c2622\" stroke=\"#1f4e79\" stroke-width=\"1.2\"/><text x=\"155\" y=\"36\" font-size=\"9\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">ventana de k = 3</text><rect x=\"18\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#d0d5db\" stroke-width=\"1.4\"/><text x=\"35\" y=\"66\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₄</text><rect x=\"58\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#d0d5db\" stroke-width=\"1.4\"/><text x=\"75\" y=\"66\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₃</text><rect x=\"98\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"115\" y=\"66\" font-size=\"9\" fill=\"#1f4e79\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₂</text><rect x=\"138\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"155\" y=\"66\" font-size=\"9\" fill=\"#1f4e79\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₁</text><rect x=\"178\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"195\" y=\"66\" font-size=\"9\" fill=\"#1f4e79\" text-anchor=\"middle\" font-weight=\"700\">Yₜ</text><rect x=\"230\" y=\"48\" width=\"40\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/><text x=\"250\" y=\"66\" font-size=\"9\" fill=\"#c45c26\" text-anchor=\"middle\" font-weight=\"700\">Ŷₜ₊₁</text><path d=\"M214 62 H228\" stroke=\"#c45c26\" stroke-width=\"1.6\" marker-end=\"none\"/><text x=\"140\" y=\"96\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Entra Yₜ, sale Yₜ₋₃. El promedio de la ventana es Ŷₜ₊₁.</text><text x=\"140\" y=\"114\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">Pesos iguales dentro de la ventana (Hanke / V6).</text></svg>","caption":"Esquema de la ventana del promedio móvil: entra el dato nuevo, sale el más viejo. No es una serie del apunte."},{"type":"paragraph","text":"En un promedio móvil (el de Hanke / V6, no el ponderado de Chase) se asignan **pesos iguales** a cada observación de la ventana. El porcentaje de respuesta a los cambios del patrón depende de $k$.","html":"En un promedio móvil (el de Hanke / V6, no el ponderado de Chase) se asignan <strong>pesos iguales</strong> a cada observación de la ventana. El porcentaje de respuesta a los cambios del patrón depende de <span class=\"eq-inline\">k</span>."},{"type":"list","ordered":false,"items":["**$k$ chico:** más peso en los períodos recientes. Conveniente cuando hay **cambios repentinos** de nivel: el pronóstico alcanza más rápido el nivel real.","**$k$ grande:** más suavizado, menos atención a las fluctuaciones. Conveniente cuando hay **fluctuaciones amplias** (Hanke 25p) o **amplias y poco frecuentes** (V6)."],"itemsHtml":["**<span class=\"eq-inline\">k</span> chico:<strong> más peso en los períodos recientes. Conveniente cuando hay </strong>cambios repentinos** de nivel: el pronóstico alcanza más rápido el nivel real.","**<span class=\"eq-inline\">k</span> grande:<strong> más suavizado, menos atención a las fluctuaciones. Conveniente cuando hay </strong>fluctuaciones amplias<strong> (Hanke 25p) o </strong>amplias y poco frecuentes** (V6)."]},{"type":"svg","svg":"<svg viewBox=\"0 0 280 128\" width=\"100%\" height=\"128\" aria-hidden=\"true\"><text x=\"8\" y=\"12\" font-size=\"9\" fill=\"#5c6670\">Esquema — no es una serie del apunte</text><text x=\"8\" y=\"26\" font-size=\"9\" fill=\"#1f4e79\" font-weight=\"700\">serie</text><text x=\"60\" y=\"26\" font-size=\"9\" fill=\"#c45c26\" font-weight=\"700\">k chico</text><text x=\"130\" y=\"26\" font-size=\"9\" fill=\"#5c6670\" font-weight=\"700\">k grande</text><polyline fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.7\" points=\"16.0,60.0 40.0,62.0 64.0,58.0 88.0,61.0 112.0,59.0 136.0,20.0 160.0,22.0 184.0,18.0 208.0,21.0 232.0,19.0\"/><polyline fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.7\" points=\"64.0,60.0 88.0,60.3 112.0,59.3 136.0,46.7 160.0,33.7 184.0,20.0 208.0,20.3 232.0,19.3\"/><polyline fill=\"none\" stroke=\"#5c6670\" stroke-width=\"1.7\" stroke-dasharray=\"4 3\" points=\"136.0,53.3 160.0,47.0 184.0,39.7 208.0,33.5 232.0,26.5\"/><text x=\"140\" y=\"118\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">k chico reacciona más rápido al cambio de nivel; k grande suaviza más y retrasa.</text></svg>","caption":"Esquema (no es una serie del apunte): ante un salto de nivel, un $k$ chico sigue el cambio más de cerca; un $k$ grande suaviza más y se atrasa. La misma idea aparece en Chase (Resumen V6) al comparar promedios de 3 y de 9 semanas."},{"type":"paragraph","text":"**Límite importante (Hanke / V6):** el promedio móvil **no maneja muy bien la tendencia ni la estacionalidad**, aunque lo hace **mejor que el promedio simple**. Sigue siendo, en el árbol, un método de serie **estacionaria**.","html":"<strong>Límite importante (Hanke / V6):</strong> el promedio móvil <strong>no maneja muy bien la tendencia ni la estacionalidad</strong>, aunque lo hace <strong>mejor que el promedio simple</strong>. Sigue siendo, en el árbol, un método de serie <strong>estacionaria</strong>."},{"type":"heading","level":3,"text":"4.3 Promedio móvil doble","html":"4.3 Promedio móvil doble"},{"type":"paragraph","text":"Para series con **tendencia lineal**, Hanke y el V6 proponen el promedio móvil doble: se calcula un conjunto de promedios móviles y después un **segundo conjunto** como promedio móvil del primero. (En la tabla de la Clase 3.a aparece también como *promedio móvil lineal*.)","html":"Para series con <strong>tendencia lineal</strong>, Hanke y el V6 proponen el promedio móvil doble: se calcula un conjunto de promedios móviles y después un <strong>segundo conjunto</strong> como promedio móvil del primero. (En la tabla de la Clase 3.a aparece también como <em>promedio móvil lineal</em>.)"},{"type":"paragraph","text":"Primero, el promedio móvil de orden $k$ (el V6 lo llama $M_t$; coincide con $\\hat{Y}_{t+1}$ de ese primer promedio):","html":"Primero, el promedio móvil de orden <span class=\"eq-inline\">k</span> (el V6 lo llama <span class=\"eq-inline\">M<sub>t</sub></span>; coincide con <span class=\"eq-inline\"><span class=\"hat\">Y</span><sub>t+1</sub></span> de ese primer promedio):"},{"type":"formula","tex":"M_t = \\hat{Y}_{t+1} = \\frac{Y_t + Y_{t-1} + \\ldots + Y_{t-k+1}}{k}","html":"<span class=\"eq-block\">M<sub>t</sub> = <span class=\"hat\">Y</span><sub>t+1</sub> = <span class=\"frac\"><span class=\"num\">Y<sub>t</sub> + Y<sub>t-1</sub> + … + Y<sub>t-k+1</sub></span><span class=\"den\">k</span></span></span>"},{"type":"paragraph","text":"Después, el segundo promedio móvil:","html":"Después, el segundo promedio móvil:"},{"type":"formula","tex":"M'_t = \\frac{M_t + M_{t-1} + \\ldots + M_{t-k+1}}{k}","html":"<span class=\"eq-block\">M'<sub>t</sub> = <span class=\"frac\"><span class=\"num\">M<sub>t</sub> + M<sub>t-1</sub> + … + M<sub>t-k+1</sub></span><span class=\"den\">k</span></span></span>"},{"type":"paragraph","text":"Se arma un pronóstico sumando al promedio simple la diferencia entre el simple y el segundo. Eso define el **nivel** $a_t$. El V6 agrega un factor de ajuste $b_t$, «similar a la medida de cambio a lo largo de la serie»:","html":"Se arma un pronóstico sumando al promedio simple la diferencia entre el simple y el segundo. Eso define el <strong>nivel</strong> <span class=\"eq-inline\">a<sub>t</sub></span>. El V6 agrega un factor de ajuste <span class=\"eq-inline\">b<sub>t</sub></span>, «similar a la medida de cambio a lo largo de la serie»:"},{"type":"formula","tex":"a_t = 2M_t - M'_t","html":"<span class=\"eq-block\">a<sub>t</sub> = 2M<sub>t</sub> - M'<sub>t</sub></span>"},{"type":"formula","tex":"b_t = \\frac{2}{k-1}(M_t - M'_t)","html":"<span class=\"eq-block\">b<sub>t</sub> = <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">k-1</span></span>(M<sub>t</sub> - M'<sub>t</sub>)</span>"},{"type":"paragraph","text":"El pronóstico a $p$ períodos hacia adelante:","html":"El pronóstico a <span class=\"eq-inline\">p</span> períodos hacia adelante:"},{"type":"formula","tex":"\\hat{Y}_{t+p} = a_t + b_t p","html":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+p</sub> = a<sub>t</sub> + b<sub>t</sub> p</span>"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 112\" width=\"100%\" height=\"112\" aria-hidden=\"true\"><text x=\"8\" y=\"16\" font-size=\"9\" fill=\"#5c6670\">Promedio móvil doble (Hanke / V6) · tendencia lineal</text><rect x=\"8\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"33\" y=\"54\" font-size=\"11\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">Yₜ</text><text x=\"33\" y=\"70\" font-size=\"7.5\" fill=\"#5c6670\" text-anchor=\"middle\">serie</text><path d=\"M60 58 H58\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><rect x=\"60\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"85\" y=\"54\" font-size=\"11\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">Mₜ</text><text x=\"85\" y=\"70\" font-size=\"7.5\" fill=\"#5c6670\" text-anchor=\"middle\">MA(k)</text><path d=\"M112 58 H110\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><rect x=\"112\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"137\" y=\"54\" font-size=\"11\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">M′ₜ</text><text x=\"137\" y=\"70\" font-size=\"7.5\" fill=\"#5c6670\" text-anchor=\"middle\">MA de M</text><path d=\"M164 58 H162\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><rect x=\"164\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.4\"/><text x=\"189\" y=\"54\" font-size=\"11\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">aₜ, bₜ</text><text x=\"189\" y=\"70\" font-size=\"7.5\" fill=\"#5c6670\" text-anchor=\"middle\">nivel y pendiente</text><path d=\"M216 58 H220\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><rect x=\"222\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.4\"/><text x=\"247\" y=\"54\" font-size=\"11\" fill=\"#c45c26\" font-weight=\"700\" text-anchor=\"middle\">Ŷₜ₊ₚ</text><text x=\"247\" y=\"70\" font-size=\"7.5\" fill=\"#5c6670\" text-anchor=\"middle\">aₜ + bₜ p</text><text x=\"140\" y=\"100\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">aₜ = 2Mₜ − M′ₜ  bₜ = [2/(k−1)](Mₜ − M′ₜ)</text></svg>","caption":"Circuito del promedio móvil doble, con las fórmulas de $a_t$ y $b_t$ del Resumen V6 / Hanke 25p. En el 25p el orden se llama $n$ en vez de $k$."},{"type":"paragraph","text":"En los resúmenes de Hanke y en el V6 **no hay una tabla numérica resuelta** de móvil doble. No invento una serie para rellenar ese hueco. Las fórmulas y el orden de los pasos están completos; el número se practica con un ejercicio cuando haya datos en el material.","html":"En los resúmenes de Hanke y en el V6 <strong>no hay una tabla numérica resuelta</strong> de móvil doble. No invento una serie para rellenar ese hueco. Las fórmulas y el orden de los pasos están completos; el número se practica con un ejercicio cuando haya datos en el material."},{"type":"heading","level":3,"text":"4.4 Promedio móvil ponderado (Chase, Resumen V6)","html":"4.4 Promedio móvil ponderado (Chase, Resumen V6)"},{"type":"callout","kind":"aviso","text":"**Esta sección no está desarrollada en el capítulo de Hanke** de los resúmenes 25p / 7p / V6 (ahí el promedio móvil lleva pesos **iguales**). Sí está en el mismo Resumen V6, más adelante, en el capítulo de pronósticos de Chase (págs. 222–224 del resumen; ilustración y fórmulas 15.1 / 15.2, estas últimas no se pudieron leer porque son imagen). Chase es bibliografía oficial de la materia. Lo marco así porque en los finales aparece seguido el promedio móvil **ponderado**.","html":"<strong>Esta sección no está desarrollada en el capítulo de Hanke</strong> de los resúmenes 25p / 7p / V6 (ahí el promedio móvil lleva pesos <strong>iguales</strong>). Sí está en el mismo Resumen V6, más adelante, en el capítulo de pronósticos de Chase (págs. 222–224 del resumen; ilustración y fórmulas 15.1 / 15.2, estas últimas no se pudieron leer porque son imagen). Chase es bibliografía oficial de la materia. Lo marco así porque en los finales aparece seguido el promedio móvil <strong>ponderado</strong>."},{"type":"paragraph","text":"Chase: el promedio móvil simple da **igual importancia** a cada dato de la ventana; el **ponderado** permite asignar otra importancia a cada elemento, **siempre que la suma de las ponderaciones sea igual a uno**. Las ponderaciones pueden estar en cualquier orden e incluso algunos períodos pueden tener peso cero; la regla que no se negocia es que sumen 1.","html":"Chase: el promedio móvil simple da <strong>igual importancia</strong> a cada dato de la ventana; el <strong>ponderado</strong> permite asignar otra importancia a cada elemento, <strong>siempre que la suma de las ponderaciones sea igual a uno</strong>. Las ponderaciones pueden estar en cualquier orden e incluso algunos períodos pueden tener peso cero; la regla que no se negocia es que sumen 1."},{"type":"paragraph","text":"**Elección de pesos (Chase):** la experiencia y las pruebas. Por regla general, el pasado más reciente es el indicador más importante y debería tener mayor ponderación. Si los datos son estacionales, los pesos se acomodan a esa estación (el ejemplo del V6: trajes de baño en julio del año anterior vs. diciembre, en el hemisferio norte).","html":"<strong>Elección de pesos (Chase):</strong> la experiencia y las pruebas. Por regla general, el pasado más reciente es el indicador más importante y debería tener mayor ponderación. Si los datos son estacionales, los pesos se acomodan a esa estación (el ejemplo del V6: trajes de baño en julio del año anterior vs. diciembre, en el hemisferio norte)."},{"type":"ejemplo","title":"Ejemplo de Chase (Resumen V6, págs. 223–224)","blocks":[{"type":"paragraph","text":"Una tienda departamental encuentra que, en un período de cuatro meses, el mejor pronóstico sale de usar **40%** de las ventas del mes más reciente, **30%** de hace dos meses, **20%** de hace tres y **10%** de hace cuatro. Las ventas reales fueron:","html":"Una tienda departamental encuentra que, en un período de cuatro meses, el mejor pronóstico sale de usar <strong>40%</strong> de las ventas del mes más reciente, <strong>30%</strong> de hace dos meses, <strong>20%</strong> de hace tres y <strong>10%</strong> de hace cuatro. Las ventas reales fueron:"},{"type":"table","headers":["Mes 1","Mes 2","Mes 3","Mes 4","Mes 5"],"rows":[["100","90","105","95","?"]],"headersHtml":["Mes 1","Mes 2","Mes 3","Mes 4","Mes 5"],"rowsHtml":[["100","90","105","95","?"]]},{"type":"paragraph","text":"El pronóstico para el mes 5, aplicando esos porcentajes a las ventas (el cálculo es imagen en el PDF; acá está hecha la cuenta con los números que sí están en el texto):","html":"El pronóstico para el mes 5, aplicando esos porcentajes a las ventas (el cálculo es imagen en el PDF; acá está hecha la cuenta con los números que sí están en el texto):"},{"type":"formula","tex":"0{,}40\\cdot 95 + 0{,}30\\cdot 105 + 0{,}20\\cdot 90 + 0{,}10\\cdot 100 = 97{,}5","html":"<span class=\"eq-block\">0,40· 95 + 0,30· 105 + 0,20· 90 + 0,10· 100 = 97,5</span>"},{"type":"paragraph","text":"El V6 sigue: supongamos que las ventas del mes 5 resultaron ser **110**. Entonces el pronóstico para el mes 6 (misma cuenta, con los cuatro meses más recientes):","html":"El V6 sigue: supongamos que las ventas del mes 5 resultaron ser <strong>110</strong>. Entonces el pronóstico para el mes 6 (misma cuenta, con los cuatro meses más recientes):"},{"type":"formula","tex":"0{,}40\\cdot 110 + 0{,}30\\cdot 95 + 0{,}20\\cdot 105 + 0{,}10\\cdot 90 = 102{,}5","html":"<span class=\"eq-block\">0,40· 110 + 0,30· 95 + 0,20· 105 + 0,10· 90 = 102,5</span>"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 136\" width=\"100%\" height=\"136\" aria-hidden=\"true\"><text x=\"8\" y=\"12\" font-size=\"9\" fill=\"#5c6670\">Ponderaciones de Chase (suman 100%)</text><line x1=\"28\" y1=\"108\" x2=\"260\" y2=\"108\" stroke=\"#d0d5db\" stroke-width=\"1\"/><rect x=\"43.0\" y=\"86.5\" width=\"28\" height=\"21.5\" fill=\"#1f4e79\" rx=\"3\"/><text x=\"57.0\" y=\"82.5\" font-size=\"10\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">10%</text><text x=\"57.0\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 1</text><rect x=\"101.0\" y=\"65.0\" width=\"28\" height=\"43.0\" fill=\"#1f4e79\" rx=\"3\"/><text x=\"115.0\" y=\"61.0\" font-size=\"10\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">20%</text><text x=\"115.0\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 2</text><rect x=\"159.0\" y=\"43.5\" width=\"28\" height=\"64.5\" fill=\"#1f4e79\" rx=\"3\"/><text x=\"173.0\" y=\"39.5\" font-size=\"10\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">30%</text><text x=\"173.0\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 3</text><rect x=\"217.0\" y=\"22.0\" width=\"28\" height=\"86.0\" fill=\"#c45c26\" rx=\"3\"/><text x=\"231.0\" y=\"18.0\" font-size=\"10\" fill=\"#c45c26\" font-weight=\"700\" text-anchor=\"middle\">40%</text><text x=\"231.0\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">Mes 4</text><text x=\"140\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">El mes más reciente (4) lleva el 40%.</text></svg>","caption":"Pesos de Chase para el ejemplo: 10%, 20%, 30% y 40% (el más reciente)."},{"type":"svg","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><text x=\"8\" y=\"12\" font-size=\"9\" fill=\"#1f4e79\" font-weight=\"700\">Ventas reales</text><text x=\"118\" y=\"12\" font-size=\"9\" fill=\"#c45c26\" font-weight=\"700\">Ŷ mes 5 = 97,5</text><line x1=\"32\" y1=\"84.1\" x2=\"268\" y2=\"84.1\" stroke=\"#d0d5db\" stroke-width=\"0.6\"/><line x1=\"32\" y1=\"60.2\" x2=\"268\" y2=\"60.2\" stroke=\"#d0d5db\" stroke-width=\"0.6\"/><line x1=\"32\" y1=\"36.3\" x2=\"268\" y2=\"36.3\" stroke=\"#d0d5db\" stroke-width=\"0.6\"/><line x1=\"32\" y1=\"22\" x2=\"32\" y2=\"108\" stroke=\"#d0d5db\" stroke-width=\"1\"/><line x1=\"32\" y1=\"108\" x2=\"268\" y2=\"108\" stroke=\"#d0d5db\" stroke-width=\"1\"/><text x=\"26\" y=\"87.1\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"end\">90</text><text x=\"26\" y=\"63.2\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"end\">100</text><text x=\"26\" y=\"39.3\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"end\">110</text><text x=\"32.0\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">1</text><text x=\"79.2\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">2</text><text x=\"126.4\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">3</text><text x=\"173.6\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">4</text><text x=\"220.8\" y=\"122\" font-size=\"9\" fill=\"#5c6670\" text-anchor=\"middle\">5</text><polyline fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.8\" points=\"32.0,60.2 79.2,84.1 126.4,48.3 173.6,72.2\"/><circle cx=\"32.0\" cy=\"60.2\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"79.2\" cy=\"84.1\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"126.4\" cy=\"48.3\" r=\"3.2\" fill=\"#1f4e79\"/><circle cx=\"173.6\" cy=\"72.2\" r=\"3.2\" fill=\"#1f4e79\"/><line x1=\"173.6\" y1=\"72.2\" x2=\"220.8\" y2=\"66.2\" stroke=\"#c45c26\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/><circle cx=\"220.8\" cy=\"66.2\" r=\"4\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.8\"/><text x=\"226.8\" y=\"69.2\" font-size=\"9\" fill=\"#c45c26\" font-weight=\"700\">97,5</text><text x=\"140\" y=\"134\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">Datos de Chase, Resumen V6</text></svg>","caption":"Serie del ejemplo de Chase y el pronóstico 97,5 para el mes 5. Datos del Resumen V6."}],"titleHtml":"Ejemplo de Chase (Resumen V6, págs. 223–224)"},{"type":"heading","level":2,"text":"5. Cómo elegir, en una frase","html":"5. Cómo elegir, en una frase"},{"type":"table","headers":["Método","Idea","Cuándo, según el material"],"rows":[["Informal «sin cambio»","$\\hat{Y}_{t+1}=Y_t$","Pocos datos; detecta cambios rápido, pero copia el ruido. Base de comparación."],["Informal con tendencia","Se suma (o se aplica) el último cambio","Nivel no estacionario / tendencia. El V6 también da la versión por tasa y la estacional trimestral."],["Promedio simple","Media de toda la inicialización","Serie estacionaria, ambiente estable."],["Promedio móvil $MA(k)$","Media de los últimos $k$, pesos iguales","Estacionaria; mejor que el simple si hay algo de patrón, pero no resuelve bien tendencia ni estacionalidad. $k$ chico si el nivel cambia de golpe; $k$ grande si las fluctuaciones son amplias."],["Promedio móvil doble","$a_t$, $b_t$ y $\\hat{Y}_{t+p}=a_t+b_t p$","Tendencia lineal."],["Promedio móvil ponderado (Chase)","Pesos que suman 1","Misma familia que el móvil, con más peso (en general) en lo reciente o en la estación que corresponda."]],"headersHtml":["Método","Idea","Cuándo, según el material"],"rowsHtml":[["Informal «sin cambio»","<span class=\"eq-inline\"><span class=\"hat\">Y</span><sub>t+1</sub>=Y<sub>t</sub></span>","Pocos datos; detecta cambios rápido, pero copia el ruido. Base de comparación."],["Informal con tendencia","Se suma (o se aplica) el último cambio","Nivel no estacionario / tendencia. El V6 también da la versión por tasa y la estacional trimestral."],["Promedio simple","Media de toda la inicialización","Serie estacionaria, ambiente estable."],["Promedio móvil <span class=\"eq-inline\">MA(k)</span>","Media de los últimos <span class=\"eq-inline\">k</span>, pesos iguales","Estacionaria; mejor que el simple si hay algo de patrón, pero no resuelve bien tendencia ni estacionalidad. <span class=\"eq-inline\">k</span> chico si el nivel cambia de golpe; <span class=\"eq-inline\">k</span> grande si las fluctuaciones son amplias."],["Promedio móvil doble","<span class=\"eq-inline\">a<sub>t</sub></span>, <span class=\"eq-inline\">b<sub>t</sub></span> y <span class=\"eq-inline\"><span class=\"hat\">Y</span><sub>t+p</sub>=a<sub>t</sub>+b<sub>t</sub> p</span>","Tendencia lineal."],["Promedio móvil ponderado (Chase)","Pesos que suman 1","Misma familia que el móvil, con más peso (en general) en lo reciente o en la estación que corresponda."]]},{"type":"heading","level":2,"text":"6. Lo que no entra en esta clase","html":"6. Lo que no entra en esta clase"},{"type":"paragraph","text":"Inmediatamente después del móvil doble, Hanke y el V6 entran en **suavización exponencial simple**, elección de $\\alpha$ y sistemas de control del error (el V6 habla de señal de control; la **señal de rastreo** ya la viste en la Clase 4). Eso se arma en la **Clase 6**. No adelanto fórmulas de $\\alpha$ acá.","html":"Inmediatamente después del móvil doble, Hanke y el V6 entran en <strong>suavización exponencial simple</strong>, elección de <span class=\"eq-inline\">α</span> y sistemas de control del error (el V6 habla de señal de control; la <strong>señal de rastreo</strong> ya la viste en la Clase 4). Eso se arma en la <strong>Clase 6</strong>. No adelanto fórmulas de <span class=\"eq-inline\">α</span> acá."},{"type":"heading","level":2,"text":"7. Mini-resumen para tu doc","html":"7. Mini-resumen para tu doc"},{"type":"callout","kind":"examen","text":"**Clase 5.** Informales (Hanke: no formales): el más simple es Ŷₜ₊₁ = Yₜ («sin cambio», 100% al actual). Si hay tendencia, se suma la última diferencia o se aplica la tasa; si es trimestral estacional, Ŷₜ₊₁ = Yₜ₋₃, y se le puede sumar (Yₜ − Yₜ₋₄)/4. Promedio simple: media de toda la inicialización, solo si la serie es estacionaria. Promedio móvil MA(k): media de los últimos k, pesos iguales; k chico reacciona, k grande suaviza; no resuelve bien tendencia ni estacionalidad. Móvil doble: M, M′, aₜ = 2M − M′, bₜ = [2/(k−1)](M − M′), Ŷₜ₊ₚ = aₜ + bₜ p, para tendencia lineal. Promedio ponderado (Chase): pesos que suman 1. Evaluar siempre sobre una parte de prueba, no sobre la de ajuste.","html":"<strong>Clase 5.</strong> Informales (Hanke: no formales): el más simple es Ŷₜ₊₁ = Yₜ («sin cambio», 100% al actual). Si hay tendencia, se suma la última diferencia o se aplica la tasa; si es trimestral estacional, Ŷₜ₊₁ = Yₜ₋₃, y se le puede sumar (Yₜ − Yₜ₋₄)/4. Promedio simple: media de toda la inicialización, solo si la serie es estacionaria. Promedio móvil MA(k): media de los últimos k, pesos iguales; k chico reacciona, k grande suaviza; no resuelve bien tendencia ni estacionalidad. Móvil doble: M, M′, aₜ = 2M − M′, bₜ = [2/(k−1)](M − M′), Ŷₜ₊ₚ = aₜ + bₜ p, para tendencia lineal. Promedio ponderado (Chase): pesos que suman 1. Evaluar siempre sobre una parte de prueba, no sobre la de ajuste."},{"type":"ejercicio","title":"8. EJERCICIO — Clase 5 (de un final, SG!EVA)","estado":"parcial","blocks":[{"type":"paragraph","text":"Enunciado tal cual figura en `SG!EVA.txt` (compilado de evaluaciones hasta 2006, ítem 2; también en EFR como ítem 3, con una variante en 3.3). **Demanda mensual en toneladas** de un fabricante de alimentos para perros:","html":"Enunciado tal cual figura en <code>SG!EVA.txt</code> (compilado de evaluaciones hasta 2006, ítem 2; también en EFR como ítem 3, con una variante en 3.3). <strong>Demanda mensual en toneladas</strong> de un fabricante de alimentos para perros:"},{"type":"table","headers":["Feb","Mar","Abr","May","Jun","Jul","Ago"],"rows":[["620","840","770","250","1000","870","?"]],"headersHtml":["Feb","Mar","Abr","May","Jun","Jul","Ago"],"rowsHtml":[["620","840","770","250","1000","870","?"]]},{"type":"paragraph","text":"**2.1** ¿Cuál hubiera sido el resultado para **mayo** y **junio** si se utilizaba un promedio móvil ponderado **fp (1,2,3)** de tres meses? Interpretar y analizar el resultado obtenido.\n\n**2.2** (se resuelve con la Clase 6) Utilizando nivelación exponencial, pronosticar para agosto. Interpretar y analizar el resultado. En esta clase no lo pedimos.","html":"<strong>2.1</strong> ¿Cuál hubiera sido el resultado para <strong>mayo</strong> y <strong>junio</strong> si se utilizaba un promedio móvil ponderado <strong>fp (1,2,3)</strong> de tres meses? Interpretar y analizar el resultado obtenido.\n\n<strong>2.2</strong> (se resuelve con la Clase 6) Utilizando nivelación exponencial, pronosticar para agosto. Interpretar y analizar el resultado. En esta clase no lo pedimos."}],"solucion":[{"type":"callout","kind":"aviso","text":"**Fuente de esta resolución:** no es una clave oficial de la cátedra. Es la resolución **manuscrita** de SG1.doc, rotulada Final (1), pág. 2 (`texto/ocr/sg1_ppm/p-02.png`). Transcribo el procedimiento y los números que se leen en esa hoja.","html":"<strong>Fuente de esta resolución:</strong> no es una clave oficial de la cátedra. Es la resolución <strong>manuscrita</strong> de SG1.doc, rotulada Final (1), pág. 2 (<code>texto/ocr/sg1_ppm/p-02.png</code>). Transcribo el procedimiento y los números que se leen en esa hoja."},{"type":"paragraph","text":"En esa hoja el promedio móvil ponderado se define:","html":"En esa hoja el promedio móvil ponderado se define:"},{"type":"formula","tex":"fp(1,2,3)=\\frac{\\sum(\\text{peso}\\cdot\\text{demanda})}{\\sum\\text{peso}}","html":"<span class=\"eq-block\">fp(1,2,3)=<span class=\"frac\"><span class=\"num\">Σ(<span class=\"mathrm\">peso</span>·<span class=\"mathrm\">demanda</span>)</span><span class=\"den\">Σ<span class=\"mathrm\">peso</span></span></span></span>"},{"type":"paragraph","text":"Para mayo (usa feb, mar y abr; el peso 1 es el más antiguo y el 3, el más reciente):","html":"Para mayo (usa feb, mar y abr; el peso 1 es el más antiguo y el 3, el más reciente):"},{"type":"formula","tex":"\\frac{1\\cdot 620 + 2\\cdot 840 + 3\\cdot 770}{1+2+3}=\\frac{4610}{6}=768{,}33","html":"<span class=\"eq-block\"><span class=\"frac\"><span class=\"num\">1· 620 + 2· 840 + 3· 770</span><span class=\"den\">1+2+3</span></span>=<span class=\"frac\"><span class=\"num\">4610</span><span class=\"den\">6</span></span>=768,33</span>"},{"type":"paragraph","text":"Para junio (mar, abr y may):","html":"Para junio (mar, abr y may):"},{"type":"formula","tex":"\\frac{1\\cdot 840 + 2\\cdot 770 + 3\\cdot 250}{6}=\\frac{3130}{6}=521{,}67","html":"<span class=\"eq-block\"><span class=\"frac\"><span class=\"num\">1· 840 + 2· 770 + 3· 250</span><span class=\"den\">6</span></span>=<span class=\"frac\"><span class=\"num\">3130</span><span class=\"den\">6</span></span>=521,67</span>"},{"type":"paragraph","text":"Interpretación, también de esa hoja (transcripción): el valor pronosticado para mayo con fp es 768,33, con una diferencia de 518,33 respecto del valor original 250. «Esto se debe a que 250 puede ser un valor anómalo; lo mismo para junio.»","html":"Interpretación, también de esa hoja (transcripción): el valor pronosticado para mayo con fp es 768,33, con una diferencia de 518,33 respecto del valor original 250. «Esto se debe a que 250 puede ser un valor anómalo; lo mismo para junio.»"}],"titleHtml":"8. EJERCICIO — Clase 5 (de un final, SG!EVA)"},{"type":"glosario","title":"9. Glosario de símbolos","intro":"Notación de Hanke / V6 para esta clase. Chase usa $A$ para la observación en algunos renglones que no se pudieron leer (son imagen).","entries":[{"simbolo":"Yₜ","nombre":"i griega sub te","significado":"Observación real en el período t","simboloHtml":"Yₜ","nombreHtml":"i griega sub te","significadoHtml":"Observación real en el período t"},{"simbolo":"Ŷₜ₊₁","nombre":"i griega sombrero","significado":"Pronóstico hecho en t (origen) para el período t+1","simboloHtml":"Ŷₜ₊₁","nombreHtml":"i griega sombrero","significadoHtml":"Pronóstico hecho en t (origen) para el período t+1"},{"simbolo":"t","nombre":"origen del pronóstico","significado":"El momento en que se calcula Ŷ; el V6 lo llama origen del pronóstico","simboloHtml":"t","nombreHtml":"origen del pronóstico","significadoHtml":"El momento en que se calcula Ŷ; el V6 lo llama origen del pronóstico"},{"simbolo":"k (V6) / n (Hanke 25p)","nombre":"orden del promedio","significado":"Cantidad de términos de la ventana del promedio móvil. En el promedio simple, n es el tamaño de la inicialización","simboloHtml":"k (V6) / n (Hanke 25p)","nombreHtml":"orden del promedio","significadoHtml":"Cantidad de términos de la ventana del promedio móvil. En el promedio simple, n es el tamaño de la inicialización"},{"simbolo":"MA(k)","nombre":"promedio móvil de orden k","significado":"Media de las últimas k observaciones; pesos iguales","simboloHtml":"MA(k)","nombreHtml":"promedio móvil de orden k","significadoHtml":"Media de las últimas k observaciones; pesos iguales"},{"simbolo":"Mₜ","nombre":"eme sub te","significado":"Primer promedio móvil (móvil doble)","simboloHtml":"Mₜ","nombreHtml":"eme sub te","significadoHtml":"Primer promedio móvil (móvil doble)"},{"simbolo":"M′ₜ","nombre":"eme prima","significado":"Segundo promedio móvil: media de los M","simboloHtml":"M′ₜ","nombreHtml":"eme prima","significadoHtml":"Segundo promedio móvil: media de los M"},{"simbolo":"aₜ","nombre":"a sub te","significado":"Nivel: aₜ = 2Mₜ − M′ₜ","simboloHtml":"aₜ","nombreHtml":"a sub te","significadoHtml":"Nivel: aₜ = 2Mₜ − M′ₜ"},{"simbolo":"bₜ","nombre":"be sub te","significado":"Pendiente: bₜ = [2/(k−1)](Mₜ − M′ₜ)","simboloHtml":"bₜ","nombreHtml":"be sub te","significadoHtml":"Pendiente: bₜ = [2/(k−1)](Mₜ − M′ₜ)"},{"simbolo":"p","nombre":"pe","significado":"Períodos hacia adelante en el móvil doble: Ŷₜ₊ₚ = aₜ + bₜ p","simboloHtml":"p","nombreHtml":"pe","significadoHtml":"Períodos hacia adelante en el móvil doble: Ŷₜ₊ₚ = aₜ + bₜ p"},{"simbolo":"wᵢ","nombre":"ponderaciones (Chase)","significado":"Pesos del promedio móvil ponderado; tienen que sumar 1","simboloHtml":"wᵢ","nombreHtml":"ponderaciones (Chase)","significadoHtml":"Pesos del promedio móvil ponderado; tienen que sumar 1"},{"simbolo":"fp(1,2,3)","nombre":"factores de ponderación","significado":"En el final resuelto de SG1, pesos 1, 2 y 3 (el 3 al más reciente), divididos por 6. No aparece definido en Hanke","simboloHtml":"fp(1,2,3)","nombreHtml":"factores de ponderación","significadoHtml":"En el final resuelto de SG1, pesos 1, 2 y 3 (el 3 al más reciente), divididos por 6. No aparece definido en Hanke"}],"introHtml":"Notación de Hanke / V6 para esta clase. Chase usa <span class=\"eq-inline\">A</span> para la observación en algunos renglones que no se pudieron leer (son imagen).","titleHtml":"9. Glosario de símbolos"},{"type":"paragraph","text":"**Material asociado:** `ArbolDecisorio_MetodosPronostico.svg` · Resumen Hanke 25p y 7p · Resumen V6 (Cap. 4 y Chase págs. 222–224) · `Formulas SdG` (título del capítulo; las fórmulas son imagen y no se pudieron extraer).\n**No está en el material descargado:** un apunte «Clase 5», las tablas de la ilustración 15.5 de Chase, ni `practica_1.pdf` / `tablas_practica_1.xlsx` que cita el Documento Maestro.","html":"<strong>Material asociado:</strong> <code>ArbolDecisorio_MetodosPronostico.svg</code> · Resumen Hanke 25p y 7p · Resumen V6 (Cap. 4 y Chase págs. 222–224) · <code>Formulas SdG</code> (título del capítulo; las fórmulas son imagen y no se pudieron extraer).\n<strong>No está en el material descargado:</strong> un apunte «Clase 5», las tablas de la ilustración 15.5 de Chase, ni <code>practica_1.pdf</code> / <code>tablas_practica_1.xlsx</code> que cita el Documento Maestro."},{"type":"paragraph","text":"**Próxima clase → Clase 6: Suavizado exponencial simple** (elección de α, inicialización). La señal de rastreo ya está en la Clase 4.","html":"<strong>Próxima clase → Clase 6: Suavizado exponencial simple</strong> (elección de α, inicialización). La señal de rastreo ya está en la Clase 4."}],"historias":[{"type":"concepto","k":"El árbol","title":"¿Estacionaria o con tendencia?","text":"Si la serie es estacionaria, en esta clase los candidatos son el promedio simple y el móvil. Si tiene tendencia lineal, el candidato es el móvil doble. Eso ya lo fijó el árbol de la Clase 3.a: no se inventan asignaciones nuevas.","html":"Si la serie es estacionaria, en esta clase los candidatos son el promedio simple y el móvil. Si tiene tendencia lineal, el candidato es el móvil doble. Eso ya lo fijó el árbol de la Clase 3.a: no se inventan asignaciones nuevas.","titleHtml":"¿Estacionaria o con tendencia?"},{"type":"concepto","k":"Tres enfoques","title":"Informal, promedios y suavización.","text":"Hanke abre el capítulo con esos tres. Esta clase cubre los dos primeros. La suavización exponencial es la Clase 6, aunque el Documento Maestro la lista en la misma semana.","ejemplo":"En el plan las llamamos «ingenuos»; Hanke dice no formales, el V6 dice informales.","html":"Hanke abre el capítulo con esos tres. Esta clase cubre los dos primeros. La suavización exponencial es la Clase 6, aunque el Documento Maestro la lista en la misma semana.","titleHtml":"Informal, promedios y suavización."},{"type":"concepto","k":"Sin cambio","title":"El informal más simple copia el último valor.","text":"Ŷₜ₊₁ = Yₜ. El 100% del peso va al valor actual. Detecta los cambios rápido, pero también copia el ruido. El V6 lo llama pronóstico «sin cambio». Sirve cuando hay pocos datos, y como base para comparar métodos más complejos.","formula":"\\hat{Y}_{t+1} = Y_t","svg":"<svg viewBox=\"0 0 280 120\" width=\"100%\" height=\"120\" aria-hidden=\"true\"><text x=\"8\" y=\"14\" font-size=\"9\" fill=\"#b7c0c8\">Esquema — no es una serie del apunte</text><polyline fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.8\" points=\"24.0,82.0 66.0,68.0 108.0,90.0 150.0,60.0 192.0,78.0\"/><circle cx=\"24.0\" cy=\"82.0\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"66.0\" cy=\"68.0\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"108.0\" cy=\"90.0\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"150.0\" cy=\"60.0\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"192.0\" cy=\"78.0\" r=\"3.2\" fill=\"#8cb4d6\"/><line x1=\"192.0\" y1=\"78.0\" x2=\"234.0\" y2=\"78.0\" stroke=\"#e25b16\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/><circle cx=\"234.0\" cy=\"78.0\" r=\"4\" fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.8\"/><text x=\"234.0\" y=\"68.0\" font-size=\"9\" fill=\"#e25b16\" font-weight=\"700\" text-anchor=\"middle\">Ŷₜ₊₁ = Yₜ</text><text x=\"140\" y=\"112\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"middle\">El 100% del peso va al valor actual. Copia también las fluctuaciones.</text></svg>","chartLabel":"Esquema: el próximo punto copia el último (no es una serie del apunte)","formulaHtml":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t</sub></span>","html":"Ŷₜ₊₁ = Yₜ. El 100% del peso va al valor actual. Detecta los cambios rápido, pero también copia el ruido. El V6 lo llama pronóstico «sin cambio». Sirve cuando hay pocos datos, y como base para comparar métodos más complejos.","titleHtml":"El informal más simple copia el último valor."},{"type":"pregunta","k":"A ver…","title":"Si la serie viene subiendo, el informal «sin cambio»…","options":["Suma la última diferencia, o se queda corto si no lo ajustás","Promedia toda la historia y atrapa la tendencia","Usa siempre el mismo trimestre del año anterior"],"correct":0,"feedback":"Sin ajuste, Ŷₜ₊₁ = Yₜ no incorpora la tendencia. El V6 / Hanke lo corrigen sumando (Yₜ − Yₜ₋₁), o con la tasa Yₜ/Yₜ₋₁. El trimestral Yₜ₋₃ es otro informal, para estacionalidad.","titleHtml":"Si la serie viene subiendo, el informal «sin cambio»…"},{"type":"concepto","k":"Más informales","title":"Tendencia, tasa o estación.","text":"Con tendencia: Ŷₜ₊₁ = Yₜ + (Yₜ − Yₜ₋₁), o Ŷₜ₊₁ = Yₜ · (Yₜ/Yₜ₋₁). Si es trimestral y la estación es fuerte: Ŷₜ₊₁ = Yₜ₋₃, y se le puede sumar (Yₜ − Yₜ₋₄)/4 para estimar la tendencia de esos cuatro trimestres.","formula":"\\hat{Y}_{t+1} = Y_t + (Y_t - Y_{t-1})","formulaHtml":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = Y<sub>t</sub> + (Y<sub>t</sub> - Y<sub>t-1</sub>)</span>","html":"Con tendencia: Ŷₜ₊₁ = Yₜ + (Yₜ − Yₜ₋₁), o Ŷₜ₊₁ = Yₜ · (Yₜ/Yₜ₋₁). Si es trimestral y la estación es fuerte: Ŷₜ₊₁ = Yₜ₋₃, y se le puede sumar (Yₜ − Yₜ₋₄)/4 para estimar la tendencia de esos cuatro trimestres.","titleHtml":"Tendencia, tasa o estación."},{"type":"concepto","k":"Promedio simple","title":"La media de toda la inicialización.","text":"Se promedian todos los valores pertinentes y esa media es el pronóstico del período que sigue. Hanke: usalo cuando la serie es estacionaria, sin tendencia ni estacionalidad. El V6 agrega una forma de actualizar sin guardar toda la historia.","formula":"\\hat{Y}_{t+1} = \\frac{1}{n}\\sum_{i=1}^{t} Y_i","formulaHtml":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n</span></span><span class=\"op\">Σ<sub>i=1</sub><sup>t</sup></span> Y<sub>i</sub></span>","html":"Se promedian todos los valores pertinentes y esa media es el pronóstico del período que sigue. Hanke: usalo cuando la serie es estacionaria, sin tendencia ni estacionalidad. El V6 agrega una forma de actualizar sin guardar toda la historia.","titleHtml":"La media de toda la inicialización."},{"type":"concepto","k":"La ventana","title":"El móvil mira solo los últimos k.","text":"Entra el dato nuevo, sale el más viejo. Pesos iguales. k chico reacciona a un cambio de nivel; k grande suaviza más. No maneja muy bien tendencia ni estacionalidad, aunque lo hace mejor que el promedio simple.","formula":"\\hat{Y}_{t+1} = \\frac{Y_t + Y_{t-1} + \\ldots + Y_{t-k+1}}{k}","svg":"<svg viewBox=\"0 0 280 128\" width=\"100%\" height=\"128\" aria-hidden=\"true\"><text x=\"8\" y=\"14\" font-size=\"9\" fill=\"#b7c0c8\">Esquema — no es una serie del apunte</text><rect x=\"94\" y=\"42\" width=\"122\" height=\"40\" rx=\"8\" fill=\"#e25b1633\" stroke=\"#8cb4d6\" stroke-width=\"1.2\"/><text x=\"155\" y=\"36\" font-size=\"9\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">ventana de k = 3</text><rect x=\"18\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#5a6570\" stroke-width=\"1.4\"/><text x=\"35\" y=\"66\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₄</text><rect x=\"58\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#5a6570\" stroke-width=\"1.4\"/><text x=\"75\" y=\"66\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₃</text><rect x=\"98\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"115\" y=\"66\" font-size=\"9\" fill=\"#8cb4d6\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₂</text><rect x=\"138\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"155\" y=\"66\" font-size=\"9\" fill=\"#8cb4d6\" text-anchor=\"middle\" font-weight=\"700\">Yₜ₋₁</text><rect x=\"178\" y=\"48\" width=\"34\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"195\" y=\"66\" font-size=\"9\" fill=\"#8cb4d6\" text-anchor=\"middle\" font-weight=\"700\">Yₜ</text><rect x=\"230\" y=\"48\" width=\"40\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/><text x=\"250\" y=\"66\" font-size=\"9\" fill=\"#e25b16\" text-anchor=\"middle\" font-weight=\"700\">Ŷₜ₊₁</text><path d=\"M214 62 H228\" stroke=\"#e25b16\" stroke-width=\"1.6\" marker-end=\"none\"/><text x=\"140\" y=\"96\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\">Entra Yₜ, sale Yₜ₋₃. El promedio de la ventana es Ŷₜ₊₁.</text><text x=\"140\" y=\"114\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"middle\">Pesos iguales dentro de la ventana (Hanke / V6).</text></svg>","chartLabel":"Ventana MA(3): entra Yₜ, sale Yₜ₋₃ (esquema)","formulaHtml":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+1</sub> = <span class=\"frac\"><span class=\"num\">Y<sub>t</sub> + Y<sub>t-1</sub> + … + Y<sub>t-k+1</sub></span><span class=\"den\">k</span></span></span>","html":"Entra el dato nuevo, sale el más viejo. Pesos iguales. k chico reacciona a un cambio de nivel; k grande suaviza más. No maneja muy bien tendencia ni estacionalidad, aunque lo hace mejor que el promedio simple.","titleHtml":"El móvil mira solo los últimos k."},{"type":"pregunta","k":"A ver…","title":"Si el nivel de la serie cambia de golpe, conviene un k…","options":["Grande: suaviza las fluctuaciones amplias","Chico: pone más peso en lo reciente y alcanza antes el nuevo nivel","Da igual: el móvil no usa k"],"correct":1,"feedback":"Hanke y el V6: un número pequeño es deseable cuando hay cambios repentinos, porque carga más la historia reciente. El k grande conviene cuando las fluctuaciones son amplias.","titleHtml":"Si el nivel de la serie cambia de golpe, conviene un k…"},{"type":"concepto","k":"Móvil doble","title":"Para tendencia lineal: dos promedios, después a y b.","text":"M es el móvil de Y; M′ es el móvil de los M. El nivel aₜ = 2Mₜ − M′ₜ y la pendiente bₜ = [2/(k−1)](Mₜ − M′ₜ). El pronóstico a p períodos es aₜ + bₜ p. En los resúmenes no hay una tabla numérica resuelta.","formula":"\\hat{Y}_{t+p} = a_t + b_t p","svg":"<svg viewBox=\"0 0 280 112\" width=\"100%\" height=\"112\" aria-hidden=\"true\"><text x=\"8\" y=\"16\" font-size=\"9\" fill=\"#b7c0c8\">Promedio móvil doble (Hanke / V6) · tendencia lineal</text><rect x=\"8\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"33\" y=\"54\" font-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">Yₜ</text><text x=\"33\" y=\"70\" font-size=\"7.5\" fill=\"#b7c0c8\" text-anchor=\"middle\">serie</text><path d=\"M60 58 H58\" stroke=\"#5a6570\" stroke-width=\"1.2\"/><rect x=\"60\" y=\"36\" width=\"50
