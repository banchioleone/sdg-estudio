<script>
window.SDG_CONTENT = {"index":{"title":"Sistemas de Gestión","subtitle":"UTN FRRo · Ingeniería en Sistemas","units":[{"id":"u1","title":"U1 · La empresa como productora de bienes","kind":"Teoría","classes":[{"id":"u1-intro","title":"Enfoque sistémico","soon":false,"file":"u1/enfoque.json","visto":false,"name":"Enfoque sistémico","titleHtml":"Enfoque sistémico"}],"lede":"Unidad 1 del programa: la empresa como productora de bienes (y servicios), bajo un enfoque sistémico. Es el marco de las demás unidades.","titleHtml":"U1 · La empresa como productora de bienes","ledeHtml":"Unidad 1 del programa: la empresa como productora de bienes (y servicios), bajo un enfoque sistémico. Es el marco de las demás unidades."},{"id":"u2","title":"U2 · Métodos de pronósticos","kind":"Práctica","laminas":[{"file":"u2/img/MapaMateria_SistemasDeGestion_v2.svg","caption":"Mapa de la materia (versión 2)","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 940\" width=\"980\" height=\"940\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n    <marker id=\"arG\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#8A8A8A\"/>\n    </marker>\n  </defs>\n\n  <rect width=\"980\" height=\"940\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"36\" font-size=\"24\" font-weight=\"700\" fill=\"#1F4E79\">SISTEMAS DE GESTIÓN — mapa v2 según programa oficial</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" fill=\"#666\">Hilo conductor: la materia es la anatomía de un ERP — de la empresa como sistema (U1) al software que la gestiona (U7)</text>\n\n  <!-- ============ U1: MARCO SUPERIOR ============ -->\n  <rect x=\"40\" y=\"76\" width=\"900\" height=\"96\" rx=\"10\" fill=\"#EDF3F9\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"102\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 1 · LA EMPRESA COMO PRODUCTORA DE BIENES</text>\n  <text x=\"700\" y=\"102\" font-size=\"11\" font-weight=\"700\" fill=\"#2E74B5\">[T] el marco de todo</text>\n  <text x=\"58\" y=\"124\" font-size=\"11.5\" fill=\"#444\">La empresa como sistema · diagrama funcional · proceso de conversión (insumos → transformación → productos)</text>\n  <text x=\"58\" y=\"142\" font-size=\"11.5\" fill=\"#444\">Subsistemas y sus interacciones · flujo de información · el modelo ERP como integrador · productividad e indicadores · mejora continua</text>\n  <text x=\"58\" y=\"162\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Pregunta típica: “¿cómo se genera esta información? indique los subsistemas participantes”</text>\n\n  <line x1=\"490\" y1=\"172\" x2=\"490\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ FILA CENTRAL: U2 U3 U4 U5 (los insumos de la planificación) ============ -->\n  <text x=\"40\" y=\"216\" font-size=\"13\" font-weight=\"700\" fill=\"#555\">LOS 4 INSUMOS DE LA PLANIFICACIÓN — qué necesito saber antes de planificar:</text>\n\n  <!-- U2 -->\n  <rect x=\"40\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"54\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">U2 · PRONÓSTICOS</text>\n  <text x=\"54\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P] ½ de la práctica</text>\n  <text x=\"54\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto van a comprar?</text>\n  <text x=\"54\" y=\"311\" font-size=\"10.8\" fill=\"#333\">· Base estadística (normal, t)</text>\n  <text x=\"54\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Patrones: tendencia, ciclo,</text>\n  <text x=\"62\" y=\"343\" font-size=\"10.8\" fill=\"#333\">estacionalidad · autocorrelación</text>\n  <text x=\"54\" y=\"360\" font-size=\"10.8\" fill=\"#333\">· Errores MAD/MSE/MAPE</text>\n  <text x=\"54\" y=\"377\" font-size=\"10.8\" fill=\"#333\">· Suavización: simple, Holt, Winter</text>\n  <text x=\"54\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Descomposición multiplicativa</text>\n  <text x=\"54\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Regresión simple y múltiple</text>\n  <text x=\"54\" y=\"426\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Clave: elegir método y justificar</text>\n\n  <!-- U3 -->\n  <rect x=\"270\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"284\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">U3 · EL PRODUCTO</text>\n  <text x=\"284\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">[T + cálculo puntual]</text>\n  <text x=\"284\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Qué fabricamos y cómo</text>\n  <text x=\"284\" y=\"305\" font-size=\"11\" fill=\"#444\">se representa en el sistema?</text>\n  <text x=\"284\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tangibles vs. intangibles</text>\n  <text x=\"284\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Ciclo de vida y sus etapas ★</text>\n  <text x=\"284\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Codificación: significativos o no,</text>\n  <text x=\"292\" y=\"377\" font-size=\"10.8\" fill=\"#333\">códigos de barras</text>\n  <text x=\"284\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Dígito verificador IBM-11 ★ [P]</text>\n  <text x=\"284\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· BOM: explosión por niveles,</text>\n  <text x=\"292\" y=\"426\" font-size=\"10.8\" fill=\"#333\">implosión indentada ★</text>\n\n  <!-- U4 -->\n  <rect x=\"500\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"514\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1E6B33\">U4 · EL PROCESO</text>\n  <text x=\"514\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1E6B33\">[T + P]</text>\n  <text x=\"514\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cómo se produce</text>\n  <text x=\"514\" y=\"305\" font-size=\"11\" fill=\"#444\">físicamente?</text>\n  <text x=\"514\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tipos de procesos industriales</text>\n  <text x=\"514\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Máquinas y centros de trabajo</text>\n  <text x=\"514\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Estudio del trabajo:</text>\n  <text x=\"522\" y=\"377\" font-size=\"10.8\" fill=\"#333\">gráfica hombre–máquina ★ [P]</text>\n  <text x=\"514\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· JIT ★ · Kanban · TQM · SMED</text>\n  <text x=\"514\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Teoría de las Restricciones</text>\n  <text x=\"522\" y=\"426\" font-size=\"10.8\" fill=\"#333\">(Goldratt, cuellos de botella)</text>\n\n  <!-- U5 -->\n  <rect x=\"730\" y=\"228\" width=\"210\" height=\"204\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#E5C2C2\" stroke-width=\"1.5\"/>\n  <text x=\"744\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#9C3838\">U5 · LOGÍSTICA</text>\n  <text x=\"744\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P + T]</text>\n  <text x=\"744\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto material tener</text>\n  <text x=\"744\" y=\"305\" font-size=\"11\" fill=\"#444\">y cómo abastecerse?</text>\n  <text x=\"744\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· EOQ/LEC · punto de reorden</text>\n  <text x=\"744\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· EOQ con descuentos ★</text>\n  <text x=\"744\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Periódico vs. perpetuo ★</text>\n  <text x=\"744\" y=\"379\" font-size=\"10.8\" fill=\"#333\">· Stock de seguridad (normal)</text>\n  <text x=\"744\" y=\"396\" font-size=\"10.8\" fill=\"#333\">· Clasificación ABC ★</text>\n  <text x=\"744\" y=\"413\" font-size=\"10.8\" fill=\"#333\">· Compras, proveedores JIT ★</text>\n  <text x=\"744\" y=\"428\" font-size=\"10.8\" fill=\"#333\">· Almacenes y trazabilidad</text>\n\n  <!-- flechas de los 4 a U6 -->\n  <line x1=\"146\" y1=\"432\" x2=\"330\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"376\" y1=\"432\" x2=\"420\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"606\" y1=\"432\" x2=\"560\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"835\" y1=\"432\" x2=\"650\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n\n  <!-- ============ U6: EL MOTOR ============ -->\n  <rect x=\"120\" y=\"504\" width=\"740\" height=\"196\" rx=\"10\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2.5\"/>\n  <text x=\"140\" y=\"530\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 6 · PLANIFICACIÓN Y CONTROL DE LA PRODUCCIÓN</text>\n  <text x=\"700\" y=\"530\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">[P] la otra ½ de la práctica</text>\n  <text x=\"140\" y=\"548\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">El motor donde se juntan los 4 insumos — la cadena operativa:</text>\n\n  <g font-size=\"11\" font-weight=\"700\">\n    <rect x=\"140\" y=\"560\" width=\"126\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"203\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">PLAN AGREGADO ★</text>\n    <line x1=\"270\" y1=\"575\" x2=\"288\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"292\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"335\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MPS ★</text>\n    <line x1=\"382\" y1=\"575\" x2=\"400\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"404\" y=\"560\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"464\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CAPACIDAD ★</text>\n    <line x1=\"528\" y1=\"575\" x2=\"546\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"550\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"593\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MRP ★</text>\n    <line x1=\"640\" y1=\"575\" x2=\"658\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"662\" y=\"560\" width=\"178\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"751\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CONTROL DE PISO</text>\n  </g>\n\n  <text x=\"140\" y=\"618\" font-size=\"10.8\" fill=\"#333\">· Plan agregado: persecución / nivelación, costos ★   · MPS: pronóstico vs. ventas confirmadas ★ (examen 2018)</text>\n  <text x=\"140\" y=\"636\" font-size=\"10.8\" fill=\"#333\">· Capacidad: listas de capacidad y perfiles de recursos ★, factor de actividad, scrap, curvas de aprendizaje</text>\n  <text x=\"140\" y=\"654\" font-size=\"10.8\" fill=\"#333\">· MRP: brutos→netos, lead times, scrap ★, loteo LEC/TBO-POQ ★/PPB   [tema huérfano: refuerzo extra]   · MRP II (CRP)</text>\n  <text x=\"140\" y=\"672\" font-size=\"10.8\" fill=\"#333\">· Balanceo de línea ★: precedencias, tiempo de ciclo, eficiencia   · Emisión y lanzamiento de órdenes, hoja de ruta ★</text>\n  <text x=\"140\" y=\"691\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">La U6 consume: la demanda de U2, el BOM de U3, la capacidad y métodos de U4, y los modelos de stock de U5.</text>\n\n  <line x1=\"490\" y1=\"700\" x2=\"490\" y2=\"724\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ U7 ============ -->\n  <rect x=\"120\" y=\"728\" width=\"740\" height=\"80\" rx=\"10\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"140\" y=\"754\" font-size=\"15\" font-weight=\"700\" fill=\"#5B3E8E\">UNIDAD 7 · SOFTWARES ERP</text>\n  <text x=\"700\" y=\"754\" font-size=\"11\" font-weight=\"700\" fill=\"#7B5AA6\">[T] el zoom out final</text>\n  <text x=\"140\" y=\"776\" font-size=\"11.5\" fill=\"#444\">Historia: MRP → MRP II → ERP · caracterización de los sistemas comerciales (SAP como caso típico)</text>\n  <text x=\"140\" y=\"795\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Todo lo anterior, empaquetado en software: por eso esta materia es “la anatomía de un ERP”.</text>\n\n  <!-- ============ COMPLEMENTOS ============ -->\n  <rect x=\"120\" y=\"822\" width=\"740\" height=\"56\" rx=\"8\" fill=\"#FAFAFA\" stroke=\"#BBB\" stroke-dasharray=\"5 4\"/>\n  <text x=\"140\" y=\"844\" font-size=\"12\" font-weight=\"700\" fill=\"#555\">COMPLEMENTOS (fuera del programa 2008, pero preguntados en el examen 2018):</text>\n  <text x=\"140\" y=\"864\" font-size=\"11\" fill=\"#444\">· BI / Data Warehouse: relación ERP–BI ★, modelo dimensional, Kimball    · Métodos de decisión racional ★ (nivel conceptual)</text>\n\n  <!-- LEYENDA -->\n  <text x=\"40\" y=\"906\" font-size=\"11.5\" fill=\"#333\"><tspan font-weight=\"700\" fill=\"#C00000\">[P]</tspan> se calcula → práctica (eliminatoria, primero)    <tspan font-weight=\"700\">[T]</tspan> se explica → teoría + coloquio globalizador    <tspan font-weight=\"700\">★</tspan> cayó en finales relevados</text>\n  <text x=\"40\" y=\"926\" font-size=\"11.5\" fill=\"#333\">Evaluación oficial: claridad conceptual · relaciones entre contenidos · vocabulario específico · interpretación · fundamentación</text>\n</svg>","captionHtml":"Mapa de la materia (versión 2)"},{"file":"u2/img/ArbolDecisorio_MetodosPronostico.svg","caption":"Árbol decisorio de métodos de pronóstico","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 1360\" width=\"1000\" height=\"1360\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"a1\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"a2\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#888\"/></marker>\n  </defs>\n  <rect width=\"1000\" height=\"1360\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">ÁRBOL DECISORIO · ¿Qué método de pronóstico uso?</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina complementaria Clase 3.a — U2 · La respuesta a “justifique la metodología aplicada”</text>\n\n  <rect x=\"40\" y=\"68\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">REGLA MADRE: graficar la serie SIEMPRE antes de decidir. Con pocos datos, graficar es obligatorio. El gráfico manda sobre cualquier fórmula.</text>\n\n  <!-- ===== NIVEL 0 ===== -->\n  <rect x=\"380\" y=\"116\" width=\"240\" height=\"42\" rx=\"21\" fill=\"#1F4E79\"/>\n  <text x=\"500\" y=\"142\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Necesito pronosticar</text>\n\n  <line x1=\"500\" y1=\"158\" x2=\"500\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"770\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"230\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"770\" y1=\"176\" x2=\"770\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- PREGUNTA 1 -->\n  <text x=\"500\" y=\"170\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\" text-anchor=\"middle\">① ¿Tengo datos históricos suficientes y representativos?</text>\n\n  <!-- RAMA NO: CUALITATIVOS -->\n  <rect x=\"700\" y=\"200\" width=\"260\" height=\"152\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"716\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">NO → MÉTODOS CUALITATIVOS</text>\n  <text x=\"716\" y=\"240\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Se basan en juicio e intuición, no en datos</text>\n  <text x=\"716\" y=\"260\" font-size=\"10.8\" fill=\"#333\">· Delphi (panel de expertos anónimo)</text>\n  <text x=\"716\" y=\"276\" font-size=\"10.8\" fill=\"#333\">· Investigación de mercado / encuestas</text>\n  <text x=\"716\" y=\"292\" font-size=\"10.8\" fill=\"#333\">· Analogía histórica (producto similar)</text>\n  <text x=\"716\" y=\"308\" font-size=\"10.8\" fill=\"#333\">· Consenso de comité / fuerza de ventas</text>\n  <text x=\"716\" y=\"330\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Cuándo: producto nuevo, sin historia,</text>\n  <text x=\"716\" y=\"345\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">o largo plazo (&gt; 2 años)</text>\n\n  <!-- RAMA SI: CUANTITATIVOS -->\n  <rect x=\"60\" y=\"200\" width=\"580\" height=\"60\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SÍ → MÉTODOS CUANTITATIVOS</text>\n  <text x=\"76\" y=\"242\" font-size=\"11\" fill=\"#333\">② ¿Explico la serie con SU PROPIO pasado, o con OTRAS variables?</text>\n  <text x=\"76\" y=\"256\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">(en la práctica se combinan: lo cuantitativo se ajusta con juicio experto)</text>\n\n  <line x1=\"200\" y1=\"260\" x2=\"200\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"500\" y1=\"260\" x2=\"500\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- CAUSALES -->\n  <rect x=\"360\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"376\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#9C3838\">CAUSALES / EXPLICATIVOS</text>\n  <text x=\"376\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Las ventas dependen de X” (precio,</text>\n  <text x=\"376\" y=\"343\" font-size=\"10.8\" fill=\"#333\">publicidad, PBI, temperatura…)</text>\n  <text x=\"376\" y=\"363\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión simple (1 variable X)</text>\n  <text x=\"376\" y=\"379\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión múltiple (varias X)</text>\n  <text x=\"376\" y=\"396\" font-size=\"10.5\" fill=\"#666\">· Modelos econométricos · indicadores</text>\n\n  <!-- SERIES DE TIEMPO -->\n  <rect x=\"60\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SERIES DE TIEMPO</text>\n  <text x=\"76\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Proyecto el patrón que la serie</text>\n  <text x=\"76\" y=\"343\" font-size=\"10.8\" fill=\"#333\">viene mostrando en el tiempo”</text>\n  <text x=\"76\" y=\"366\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">③ ¿QUÉ PATRÓN tiene la serie?</text>\n  <text x=\"76\" y=\"384\" font-size=\"10.5\" fill=\"#666\">→ mirar el gráfico y el correlograma</text>\n  <text x=\"76\" y=\"399\" font-size=\"10.5\" fill=\"#666\">→ bajar a los 4 casos de abajo ↓</text>\n\n  <line x1=\"200\" y1=\"408\" x2=\"200\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"880\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"120\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"373\" y1=\"430\" x2=\"373\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"627\" y1=\"430\" x2=\"627\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"880\" y1=\"430\" x2=\"880\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- ===== CASO A: ESTACIONARIA ===== -->\n  <rect x=\"40\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"54\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">A · ESTACIONARIA</text>\n  <text x=\"54\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">promedio constante, sin rumbo</text>\n  <line x1=\"58\" y1=\"536\" x2=\"58\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"536\" x2=\"248\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"520\" x2=\"248\" y2=\"520\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <polyline points=\"64,526 88,512 112,528 136,514 160,530 184,512 208,524 236,516\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n\n  <text x=\"54\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">MÉTODOS:</text>\n  <text x=\"54\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Promedio simple (todo el historial)</text>\n  <text x=\"54\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil de orden n</text>\n  <text x=\"54\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Suavizado exponencial simple (SES)</tspan></text>\n  <text x=\"54\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Métodos ingenuos: Ŷₜ₊₁ = Yₜ</text>\n  <text x=\"54\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins (ARIMA)</text>\n\n  <rect x=\"52\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <text x=\"62\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\">Elegir n / α:</text>\n  <text x=\"62\" y=\"683\" font-size=\"9.8\" fill=\"#333\">n grande o α chico → más suave</text>\n  <text x=\"62\" y=\"697\" font-size=\"9.8\" fill=\"#333\">n chico o α grande → más reactivo</text>\n\n  <text x=\"54\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"54\" y=\"744\" font-size=\"10\" fill=\"#333\">· Panadería de barrio estable</text>\n  <text x=\"54\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto maduro sin cambios</text>\n  <text x=\"54\" y=\"772\" font-size=\"10\" fill=\"#333\">· Repuestos de demanda pareja</text>\n\n  <!-- ===== CASO B: TENDENCIA ===== -->\n  <rect x=\"274\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">B · TENDENCIA</text>\n  <text x=\"288\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">sube o baja sostenidamente</text>\n  <line x1=\"292\" y1=\"536\" x2=\"292\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"292\" y1=\"536\" x2=\"482\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"298,530 326,522 354,514 382,506 410,514 438,500 466,492\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n\n  <text x=\"288\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODOS:</text>\n  <text x=\"288\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Holt</tspan> (suav. exp. 2 parámetros α, β)</text>\n  <text x=\"288\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Brown (suav. exp. doble, 1 parám.)</text>\n  <text x=\"288\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil doble</text>\n  <text x=\"288\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión simple contra el tiempo</text>\n  <text x=\"288\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Gompertz, curvas de crecimiento</text>\n\n  <rect x=\"286\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"296\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1F4E79\">Holt vs. Brown:</text>\n  <text x=\"296\" y=\"683\" font-size=\"9.8\" fill=\"#333\">Brown usa un solo α → tendencia</text>\n  <text x=\"296\" y=\"697\" font-size=\"9.8\" fill=\"#333\">sensible al ruido. Holt separa β → mejor.</text>\n\n  <text x=\"288\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"288\" y=\"744\" font-size=\"10\" fill=\"#333\">· Suscripciones de una app en alza</text>\n  <text x=\"288\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto en etapa de crecimiento</text>\n  <text x=\"288\" y=\"772\" font-size=\"10\" fill=\"#333\">· Serie inflacionada año a año</text>\n\n  <!-- ===== CASO C: ESTACIONALIDAD ===== -->\n  <rect x=\"508\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#8A5A16\" stroke-width=\"2\"/>\n  <text x=\"522\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · ESTACIONALIDAD</text>\n  <text x=\"522\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">patrón fijo que se repite cada año</text>\n  <line x1=\"526\" y1=\"536\" x2=\"526\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"526\" y1=\"536\" x2=\"716\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 532 528 L 548 508 L 564 528 L 580 530 L 596 508 L 612 528 L 628 530 L 644 506 L 660 528 L 676 530 L 700 508\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2\"/>\n\n  <text x=\"522\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">MÉTODOS:</text>\n  <text x=\"522\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Winter</tspan> (suav. exp. 3 parám. α, β, γ)</text>\n  <text x=\"522\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Descomposición clásica</tspan> (multiplicativa)</text>\n  <text x=\"522\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Desestacionalizar → pronosticar →</text>\n  <text x=\"532\" y=\"622\" font-size=\"10.8\" fill=\"#333\">re-estacionalizar</text>\n  <text x=\"522\" y=\"638\" font-size=\"10.5\" fill=\"#666\">· Regresión múltiple con dummies · Census II</text>\n\n  <rect x=\"520\" y=\"648\" width=\"198\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"530\" y=\"666\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">Ojo con L y la cantidad de datos:</text>\n  <text x=\"530\" y=\"681\" font-size=\"9.8\" fill=\"#333\">L=4 (trim.) · L=12 (mens.) · L=7 (diario)</text>\n  <text x=\"530\" y=\"695\" font-size=\"9.8\" fill=\"#333\">Winter necesita ≥ 2 ciclos completos</text>\n\n  <text x=\"522\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"522\" y=\"744\" font-size=\"10\" fill=\"#333\">· Heladería / aires acondicionados</text>\n  <text x=\"522\" y=\"758\" font-size=\"10\" fill=\"#333\">· Ventas de diciembre, útiles escolares</text>\n  <text x=\"522\" y=\"772\" font-size=\"10\" fill=\"#333\">· Consumo eléctrico</text>\n\n  <!-- ===== CASO D: CICLO ===== -->\n  <rect x=\"742\" y=\"456\" width=\"218\" height=\"330\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"756\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">D · CICLO</text>\n  <text x=\"756\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">ondas plurianuales, período variable</text>\n  <line x1=\"760\" y1=\"536\" x2=\"760\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"760\" y1=\"536\" x2=\"946\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 766 518 C 792 496, 812 496, 834 522 C 858 548, 882 546, 906 512 C 916 498, 926 494, 936 492\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n\n  <text x=\"756\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#5B3E8E\">MÉTODOS:</text>\n  <text x=\"756\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Descomposición clásica</text>\n  <text x=\"756\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Indicadores económicos (líderes)</text>\n  <text x=\"756\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Modelos econométricos</text>\n  <text x=\"756\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión múltiple</text>\n  <text x=\"756\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins</text>\n\n  <rect x=\"754\" y=\"650\" width=\"196\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"764\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">⚠ El más difícil de todos:</text>\n  <text x=\"764\" y=\"683\" font-size=\"9.8\" fill=\"#333\">no tiene período fijo → los métodos</text>\n  <text x=\"764\" y=\"697\" font-size=\"9.8\" fill=\"#333\">de suavizado NO capturan giros bruscos</text>\n\n  <text x=\"756\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"756\" y=\"744\" font-size=\"10\" fill=\"#333\">· Construcción, acero, automotriz</text>\n  <text x=\"756\" y=\"758\" font-size=\"10\" fill=\"#333\">· Bienes durables y de capital</text>\n  <text x=\"756\" y=\"772\" font-size=\"10\" fill=\"#333\">· Cualquier serie ligada al PBI</text>\n\n  <!-- ===== CASO COMBINADO ===== -->\n  <rect x=\"40\" y=\"800\" width=\"920\" height=\"96\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">★ EL CASO MÁS FRECUENTE EN EXAMEN: TENDENCIA **+** ESTACIONALIDAD (los patrones se combinan)</text>\n  <text x=\"56\" y=\"844\" font-size=\"11.5\" fill=\"#333\">Si la serie sube año a año Y además repite picos estacionales → <tspan font-weight=\"700\" fill=\"#C00000\">WINTER</tspan> (captura ambos) o <tspan font-weight=\"700\" fill=\"#C00000\">DESCOMPOSICIÓN</tspan> (los separa y proyecta por partes).</text>\n  <text x=\"56\" y=\"864\" font-size=\"11.5\" fill=\"#333\">Alternativa válida y muy defendible: <tspan font-weight=\"700\">desestacionalizar</tspan> la serie → aplicar Holt a la serie sin estacionalidad → <tspan font-weight=\"700\">re-estacionalizar</tspan> el pronóstico.</text>\n  <text x=\"56\" y=\"884\" font-size=\"11\" fill=\"#8A5A16\" font-style=\"italic\">Nunca usar suavizado simple ni promedio móvil acá: van siempre “atrás” de la serie y subestiman sistemáticamente (sesgo visible en el PME).</text>\n\n  <!-- ===== FACTORES ADICIONALES ===== -->\n  <rect x=\"40\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">④ Otros factores que inclinan la elección</text>\n\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">HORIZONTE:</text>\n  <text x=\"66\" y=\"970\" font-size=\"10.5\" fill=\"#333\">· Corto plazo (días–meses) → suavizados, promedios</text>\n  <text x=\"66\" y=\"985\" font-size=\"10.5\" fill=\"#333\">· Mediano (meses–2 años) → regresión, descomposición</text>\n  <text x=\"66\" y=\"1000\" font-size=\"10.5\" fill=\"#333\">· Largo plazo (&gt;2 años) → cualitativos, econométricos</text>\n\n  <text x=\"56\" y=\"1022\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">CANTIDAD DE DATOS:</text>\n  <text x=\"66\" y=\"1038\" font-size=\"10.5\" fill=\"#333\">· Muy pocos → ingenuos o promedio simple (y graficar!)</text>\n  <text x=\"66\" y=\"1053\" font-size=\"10.5\" fill=\"#333\">· Winter/descomposición exigen ≥2 ciclos completos</text>\n\n  <text x=\"56\" y=\"1075\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">OTROS CRITERIOS (Hanke):</text>\n  <text x=\"66\" y=\"1091\" font-size=\"10.5\" fill=\"#333\">· Costo del método vs. beneficio del pronóstico</text>\n  <text x=\"66\" y=\"1106\" font-size=\"10.5\" fill=\"#333\">· Facilidad de comprensión para quien decide</text>\n  <text x=\"66\" y=\"1121\" font-size=\"10.5\" fill=\"#333\">· Precisión requerida y confiabilidad</text>\n\n  <!-- ===== VALIDACION ===== -->\n  <rect x=\"510\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"526\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">⑤ Elegido el método… ¡hay que VALIDARLO!</text>\n  <text x=\"526\" y=\"952\" font-size=\"11\" fill=\"#333\">El árbol propone candidatos; la <tspan font-weight=\"700\">medida de error decide</tspan>.</text>\n\n  <text x=\"526\" y=\"976\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">Procedimiento (Hanke cap. 5):</text>\n  <text x=\"536\" y=\"992\" font-size=\"10.5\" fill=\"#333\">① Partir los datos: inicialización + prueba</text>\n  <text x=\"536\" y=\"1007\" font-size=\"10.5\" fill=\"#333\">② Ajustar el método con la parte de inicialización</text>\n  <text x=\"536\" y=\"1022\" font-size=\"10.5\" fill=\"#333\">③ Pronosticar la parte de prueba y medir el error</text>\n  <text x=\"536\" y=\"1037\" font-size=\"10.5\" fill=\"#333\">④ Comparar contra un método alternativo</text>\n  <text x=\"536\" y=\"1052\" font-size=\"10.5\" fill=\"#333\">⑤ Decidir: usarlo, ajustarlo o cambiarlo</text>\n\n  <rect x=\"526\" y=\"1062\" width=\"418\" height=\"56\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"536\" y=\"1080\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">Qué mirar en los errores:</text>\n  <text x=\"536\" y=\"1095\" font-size=\"10\" fill=\"#333\">MAD/MSE/MAPE bajos = buen ajuste · <tspan font-weight=\"700\">PME ≈ 0 = sin sesgo</tspan></text>\n  <text x=\"536\" y=\"1110\" font-size=\"10\" fill=\"#333\">Si el PME es grande y del mismo signo → el método pierde un patrón</text>\n\n  <!-- ===== EJEMPLOS RESUELTOS ===== -->\n  <rect x=\"40\" y=\"1142\" width=\"920\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"1164\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">DIAGNÓSTICOS RESUELTOS — así se redacta la justificación en el examen</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"1174\" width=\"888\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"66\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Serie</text>\n    <text x=\"330\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Diagnóstico</text>\n    <text x=\"600\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Método y justificación</text>\n\n    <rect x=\"56\" y=\"1194\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1210\" fill=\"#333\">Ventas parejas 900–1.100 kg hace 10 años</text>\n    <text x=\"330\" y=\"1210\" fill=\"#333\">estacionaria, solo irregularidad</text>\n    <text x=\"600\" y=\"1210\" fill=\"#1E6B33\" font-weight=\"700\">SES o promedio móvil: no hay patrón que proyectar</text>\n\n    <rect x=\"56\" y=\"1218\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1234\" fill=\"#333\">App: 1.000 → 2.290 creciendo parejo</text>\n    <text x=\"330\" y=\"1234\" fill=\"#333\">tendencia lineal, sin estacionalidad</text>\n    <text x=\"600\" y=\"1234\" fill=\"#1F4E79\" font-weight=\"700\">Holt o regresión vs. tiempo: capturan la pendiente</text>\n\n    <rect x=\"56\" y=\"1242\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1258\" fill=\"#333\">Heladería trimestral, picos en T1 y T4, subiendo</text>\n    <text x=\"330\" y=\"1258\" fill=\"#333\">tendencia + estacionalidad (L=4)</text>\n    <text x=\"600\" y=\"1258\" fill=\"#C00000\" font-weight=\"700\">WINTER o descomposición multiplicativa</text>\n\n    <rect x=\"56\" y=\"1266\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1282\" fill=\"#333\">Constructora: sube, se derrumba 3 años, se recupera</text>\n    <text x=\"330\" y=\"1282\" fill=\"#333\">ciclo dominante (+ tendencia)</text>\n    <text x=\"600\" y=\"1282\" fill=\"#5B3E8E\" font-weight=\"700\">Descomposición o indicadores económicos; no suavizado</text>\n\n    <rect x=\"56\" y=\"1290\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1306\" fill=\"#333\">Producto nuevo, sin historia</text>\n    <text x=\"330\" y=\"1306\" fill=\"#333\">sin datos utilizables</text>\n    <text x=\"600\" y=\"1306\" fill=\"#5B3E8E\" font-weight=\"700\">Cualitativo: Delphi, analogía histórica, investigación</text>\n\n    <rect x=\"56\" y=\"1314\" width=\"888\" height=\"22\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1329\" fill=\"#333\">Ventas explicadas por publicidad y precio</text>\n    <text x=\"330\" y=\"1329\" fill=\"#333\">relación causal con otras variables</text>\n    <text x=\"600\" y=\"1329\" fill=\"#9C3838\" font-weight=\"700\">Regresión múltiple (revisar colinealidad y residuos)</text>\n  </g>\n</svg>","captionHtml":"Árbol decisorio de métodos de pronóstico"}],"lede":"Unidad 2 del programa: los métodos de pronósticos. Empieza con el mapa de toda la materia y las siglas (Clases 0 y 0.1), y sigue con las clases que ya vimos: base estadística, correlación, series, autocorrelación, medidas de error y el integrador.","classes":[{"id":"c0","title":"Clase 0 · Mapa","soon":false,"file":"u2/clase00.json","visto":true,"name":"Mapa","titleHtml":"Clase 0 · Mapa"},{"id":"c01","title":"Clase 0.1 · Siglas","soon":false,"file":"u2/clase01_siglas.json","visto":true,"name":"Siglas","titleHtml":"Clase 0.1 · Siglas"},{"id":"c1","title":"Clase 1 · Base estadística","file":"u2/clase01.json","soon":false,"visto":true,"name":"Base estadística","titleHtml":"Clase 1 · Base estadística"},{"id":"c1b","title":"Clase 1.b · Tabla Z","file":"u2/clase01b.json","soon":false,"visto":true,"name":"Tabla Z","titleHtml":"Clase 1.b · Tabla Z"},{"id":"c2","title":"Clase 2 · Correlación","file":"u2/clase02.json","soon":false,"visto":true,"name":"Correlación","titleHtml":"Clase 2 · Correlación"},{"id":"c3a","title":"Clase 3.a · Series de tiempo","file":"u2/clase03a.json","soon":false,"visto":true,"name":"Series de tiempo","titleHtml":"Clase 3.a · Series de tiempo"},{"id":"c3b","title":"Clase 3.b · Autocorrelación","file":"u2/clase03b.json","soon":false,"visto":true,"name":"Autocorrelación","titleHtml":"Clase 3.b · Autocorrelación"},{"id":"c4","title":"Clase 4 · Medidas de error","file":"u2/clase04.json","soon":false,"visto":true,"name":"Medidas de error","titleHtml":"Clase 4 · Medidas de error"},{"id":"cint","title":"Integrador · Proceso completo","file":"u2/integrador.json","soon":false,"visto":true,"name":"Proceso completo","titleHtml":"Integrador · Proceso completo"},{"id":"c5","title":"Clase 5 · Métodos no formales y promedios","soon":false,"file":"u2/clase05.json","visto":false,"name":"No formales y promedios","titleHtml":"Clase 5 · Métodos no formales y promedios"},{"id":"c6","title":"Clase 6 · Suavizado simple","soon":true,"titleHtml":"Clase 6 · Suavizado simple"}],"titleHtml":"U2 · Métodos de pronósticos","ledeHtml":"Unidad 2 del programa: los métodos de pronósticos. Empieza con el mapa de toda la materia y las siglas (Clases 0 y 0.1), y sigue con las clases que ya vimos: base estadística, correlación, series, autocorrelación, medidas de error y el integrador."},{"id":"u3","title":"U3 · El producto","kind":"Teoría + cálculo","classes":[{"id":"u3-intro","title":"Ciclo de vida, BOM, codificación","soon":true,"titleHtml":"Ciclo de vida, BOM, codificación"}],"titleHtml":"U3 · El producto"},{"id":"u4","title":"U4 · El proceso de producción","kind":"Teoría + práctica","classes":[{"id":"u4-intro","title":"JIT, TOC, hombre-máquina","soon":true,"titleHtml":"JIT, TOC, hombre-máquina"}],"titleHtml":"U4 · El proceso de producción"},{"id":"u5","title":"U5 · Logística","kind":"Práctica + teoría","classes":[{"id":"u5-intro","title":"EOQ, stock, ABC","soon":true,"titleHtml":"EOQ, stock, ABC"}],"titleHtml":"U5 · Logística"},{"id":"u6","title":"U6 · Planificación y control","kind":"Práctica","classes":[{"id":"u6-intro","title":"Plan agregado, MPS, MRP","soon":true,"titleHtml":"Plan agregado, MPS, MRP"}],"titleHtml":"U6 · Planificación y control"},{"id":"u7","title":"U7 · Softwares ERP","kind":"Teoría","classes":[{"id":"u7-intro","title":"De MRP a ERP","soon":true,"titleHtml":"De MRP a ERP"}],"titleHtml":"U7 · Softwares ERP"}],"titleHtml":"Sistemas de Gestión"},"classes":{"u1-intro":{"unitId":"u1","unitLabel":"Unidad 1","unitTitle":"La empresa como productora de bienes","id":"u1-intro","title":"Enfoque sistémico","name":"Enfoque sistémico","lede":"Objetivo del programa: conocer la empresa bajo un enfoque sistémico y desde la administración de la producción. Es la unidad-marco: da el vocabulario que atraviesa las otras seis. Esta clase no está marcada como Vista: no se dictó en la serie 0 → 1, se arma ahora con el programa, el mapa y los apuntes.","visto":false,"source":["programa.md (SG1Progr2008.doc), Unidad temática 1","clases_previas/SG/SistemasDeGestion_DocumentoMaestro_v2.txt","clases_previas/SG/MapaMateria_SistemasDeGestion_v2.svg","drive/04_Sistemas de Gestión de las Organizaciones/Evolucion de la Gestion en Operaciones.pdf (R. Morán, 2000)","patrones_examenes.md (pregunta típica de subsistemas / información)"],"laminas":["u2/img/MapaMateria_SistemasDeGestion_v2.svg"],"next":"Clase 0 · Mapa de la materia","teoria":[{"type":"callout","kind":"idea","text":"**Idea central:** mirar la empresa como un **sistema**. El programa pide un conocimiento general de las empresas «bajo un enfoque sistémico y desde la función de la administración de la producción». El Documento Maestro lo dice así: es la unidad-marco, la que da el vocabulario que atraviesa todo. El mapa v2 la ubica como el marco de las otras seis, hasta el software ERP (U7).","html":"<strong>Idea central:</strong> mirar la empresa como un <strong>sistema</strong>. El programa pide un conocimiento general de las empresas «bajo un enfoque sistémico y desde la función de la administración de la producción». El Documento Maestro lo dice así: es la unidad-marco, la que da el vocabulario que atraviesa todo. El mapa v2 la ubica como el marco de las otras seis, hasta el software ERP (U7)."},{"type":"heading","level":2,"text":"1. De dónde sale esta clase","html":"1. De dónde sale esta clase"},{"type":"paragraph","text":"No hay un apunte titulado «Enfoque sistémico» ni una clase 0.x de la Unidad 1 en la serie que ya vimos. El contenido se arma con el **programa oficial 2008** (eje, objetivo y temas), el Documento Maestro v2, el mapa v2 y el apunte de cátedra *Evolución de la Gestión de la Producción y de las Operaciones* (R. Morán, 2000), que cubre sobre todo los **antecedentes**. El Maestro remite también a Monks y al cap. 1 de Chase (V6) para el diagrama funcional y el proceso de conversión: esos capítulos no se extractaron aquí como texto corrido, así que no se reconstruye un diagrama que no está en los archivos leídos.","html":"No hay un apunte titulado «Enfoque sistémico» ni una clase 0.x de la Unidad 1 en la serie que ya vimos. El contenido se arma con el <strong>programa oficial 2008</strong> (eje, objetivo y temas), el Documento Maestro v2, el mapa v2 y el apunte de cátedra <em>Evolución de la Gestión de la Producción y de las Operaciones</em> (R. Morán, 2000), que cubre sobre todo los <strong>antecedentes</strong>. El Maestro remite también a Monks y al cap. 1 de Chase (V6) para el diagrama funcional y el proceso de conversión: esos capítulos no se extractaron aquí como texto corrido, así que no se reconstruye un diagrama que no está en los archivos leídos."},{"type":"heading","level":2,"text":"2. Qué pide el programa","html":"2. Qué pide el programa"},{"type":"paragraph","text":"**Eje conceptual:** La Empresa como productora de Bienes (y Servicios). **Objetivo:** que los alumnos adquieran un conocimiento general de las empresas bajo un enfoque sistémico y desde la función de la administración de la producción.","html":"<strong>Eje conceptual:</strong> La Empresa como productora de Bienes (y Servicios). <strong>Objetivo:</strong> que los alumnos adquieran un conocimiento general de las empresas bajo un enfoque sistémico y desde la función de la administración de la producción."},{"type":"paragraph","text":"Temas, en el orden del programa 2008:","html":"Temas, en el orden del programa 2008:"},{"type":"list","ordered":false,"items":["Función de las empresas. Criterios de clasificación. Antecedentes de la empresa industrial.","La empresa como sistema. El diagrama funcional de la empresa industrial. El proceso de conversión.","Funciones e interacciones de los subsistemas. El modelo ERP. Administración y gestión del sistema de producción. Flujo de información.","Los procesos y actividades industriales. La participación del cliente en el modelo.","Productividad industrial. Principales indicadores de la actividad industrial.","Excelencia en manufactura. Mejora continua."],"itemsHtml":["Función de las empresas. Criterios de clasificación. Antecedentes de la empresa industrial.","La empresa como sistema. El diagrama funcional de la empresa industrial. El proceso de conversión.","Funciones e interacciones de los subsistemas. El modelo ERP. Administración y gestión del sistema de producción. Flujo de información.","Los procesos y actividades industriales. La participación del cliente en el modelo.","Productividad industrial. Principales indicadores de la actividad industrial.","Excelencia en manufactura. Mejora continua."]},{"type":"heading","level":2,"text":"3. La empresa como sistema y el proceso de conversión","html":"3. La empresa como sistema y el proceso de conversión"},{"type":"svg","svg":"<svg viewBox=\"0 0 280 72\" width=\"100%\" height=\"72\" aria-hidden=\"true\"><rect x=\"8\" y=\"16\" width=\"80\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#1f4e79\" stroke-width=\"1.6\"/><text x=\"48\" y=\"39\" font-size=\"10\" fill=\"#1f4e79\" font-weight=\"700\" text-anchor=\"middle\">Insumos</text><text x=\"90\" y=\"40\" font-size=\"14\" fill=\"#5c6670\">→</text><rect x=\"100\" y=\"16\" width=\"80\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#a67c00\" stroke-width=\"1.6\"/><text x=\"140\" y=\"39\" font-size=\"10\" fill=\"#a67c00\" font-weight=\"700\" text-anchor=\"middle\">Transformación</text><text x=\"182\" y=\"40\" font-size=\"14\" fill=\"#5c6670\">→</text><rect x=\"192\" y=\"16\" width=\"80\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#c45c26\" stroke-width=\"1.6\"/><text x=\"232\" y=\"39\" font-size=\"10\" fill=\"#c45c26\" font-weight=\"700\" text-anchor=\"middle\">Productos</text></svg>","caption":"Proceso de conversión del mapa y del Documento Maestro: insumos → transformación → productos."},{"type":"paragraph","text":"El mapa v2 y el Documento Maestro resumen el núcleo así: **la empresa como sistema**, el diagrama funcional de la empresa industrial y **el proceso de conversión: insumos → transformación → productos**. Es el esquema mínimo para no estudiar cada unidad suelta: lo que entra, lo que se transforma y lo que sale, con un flujo de información que lo sostiene.","html":"El mapa v2 y el Documento Maestro resumen el núcleo así: <strong>la empresa como sistema</strong>, el diagrama funcional de la empresa industrial y <strong>el proceso de conversión: insumos → transformación → productos</strong>. Es el esquema mínimo para no estudiar cada unidad suelta: lo que entra, lo que se transforma y lo que sale, con un flujo de información que lo sostiene."},{"type":"paragraph","text":"El apunte de Evolución (Morán, 2000) llega a la misma idea por la historia: en los años 20 y 30 se vio que había que tomar en cuenta la interacción de factores (diseño del producto, layout, mano de obra, condiciones ambientales, materiales, actitudes de los clientes). «Estas consideraciones condujeron naturalmente al estudio de los medios de producción como sistemas.»","html":"El apunte de Evolución (Morán, 2000) llega a la misma idea por la historia: en los años 20 y 30 se vio que había que tomar en cuenta la interacción de factores (diseño del producto, layout, mano de obra, condiciones ambientales, materiales, actitudes de los clientes). «Estas consideraciones condujeron naturalmente al estudio de los medios de producción como sistemas.»"},{"type":"callout","kind":"examen","text":"**Pregunta típica de final** (Documento Maestro y mapa v2): «¿cómo se genera esta información? indique los subsistemas participantes». El criterio oficial de evaluación pide justamente relaciones entre contenidos y vocabulario específico: no alcanza con nombrar un módulo, hay que decir de dónde sale el dato y quiénes intervienen.","html":"<strong>Pregunta típica de final</strong> (Documento Maestro y mapa v2): «¿cómo se genera esta información? indique los subsistemas participantes». El criterio oficial de evaluación pide justamente relaciones entre contenidos y vocabulario específico: no alcanza con nombrar un módulo, hay que decir de dónde sale el dato y quiénes intervienen."},{"type":"svg","file":"u2/img/MapaMateria_SistemasDeGestion_v2.svg","caption":"Mapa v2: la U1 es el marco; las unidades 2 a 5 son insumos; la U6 es el motor; la U7 empaqueta el modelo en un ERP","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 940\" width=\"980\" height=\"940\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/>\n    </marker>\n    <marker id=\"arG\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#8A8A8A\"/>\n    </marker>\n  </defs>\n\n  <rect width=\"980\" height=\"940\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"36\" font-size=\"24\" font-weight=\"700\" fill=\"#1F4E79\">SISTEMAS DE GESTIÓN — mapa v2 según programa oficial</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" fill=\"#666\">Hilo conductor: la materia es la anatomía de un ERP — de la empresa como sistema (U1) al software que la gestiona (U7)</text>\n\n  <!-- ============ U1: MARCO SUPERIOR ============ -->\n  <rect x=\"40\" y=\"76\" width=\"900\" height=\"96\" rx=\"10\" fill=\"#EDF3F9\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"58\" y=\"102\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 1 · LA EMPRESA COMO PRODUCTORA DE BIENES</text>\n  <text x=\"700\" y=\"102\" font-size=\"11\" font-weight=\"700\" fill=\"#2E74B5\">[T] el marco de todo</text>\n  <text x=\"58\" y=\"124\" font-size=\"11.5\" fill=\"#444\">La empresa como sistema · diagrama funcional · proceso de conversión (insumos → transformación → productos)</text>\n  <text x=\"58\" y=\"142\" font-size=\"11.5\" fill=\"#444\">Subsistemas y sus interacciones · flujo de información · el modelo ERP como integrador · productividad e indicadores · mejora continua</text>\n  <text x=\"58\" y=\"162\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Pregunta típica: “¿cómo se genera esta información? indique los subsistemas participantes”</text>\n\n  <line x1=\"490\" y1=\"172\" x2=\"490\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ FILA CENTRAL: U2 U3 U4 U5 (los insumos de la planificación) ============ -->\n  <text x=\"40\" y=\"216\" font-size=\"13\" font-weight=\"700\" fill=\"#555\">LOS 4 INSUMOS DE LA PLANIFICACIÓN — qué necesito saber antes de planificar:</text>\n\n  <!-- U2 -->\n  <rect x=\"40\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"54\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">U2 · PRONÓSTICOS</text>\n  <text x=\"54\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P] ½ de la práctica</text>\n  <text x=\"54\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto van a comprar?</text>\n  <text x=\"54\" y=\"311\" font-size=\"10.8\" fill=\"#333\">· Base estadística (normal, t)</text>\n  <text x=\"54\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Patrones: tendencia, ciclo,</text>\n  <text x=\"62\" y=\"343\" font-size=\"10.8\" fill=\"#333\">estacionalidad · autocorrelación</text>\n  <text x=\"54\" y=\"360\" font-size=\"10.8\" fill=\"#333\">· Errores MAD/MSE/MAPE</text>\n  <text x=\"54\" y=\"377\" font-size=\"10.8\" fill=\"#333\">· Suavización: simple, Holt, Winter</text>\n  <text x=\"54\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Descomposición multiplicativa</text>\n  <text x=\"54\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Regresión simple y múltiple</text>\n  <text x=\"54\" y=\"426\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Clave: elegir método y justificar</text>\n\n  <!-- U3 -->\n  <rect x=\"270\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"284\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">U3 · EL PRODUCTO</text>\n  <text x=\"284\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">[T + cálculo puntual]</text>\n  <text x=\"284\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Qué fabricamos y cómo</text>\n  <text x=\"284\" y=\"305\" font-size=\"11\" fill=\"#444\">se representa en el sistema?</text>\n  <text x=\"284\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tangibles vs. intangibles</text>\n  <text x=\"284\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Ciclo de vida y sus etapas ★</text>\n  <text x=\"284\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Codificación: significativos o no,</text>\n  <text x=\"292\" y=\"377\" font-size=\"10.8\" fill=\"#333\">códigos de barras</text>\n  <text x=\"284\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· Dígito verificador IBM-11 ★ [P]</text>\n  <text x=\"284\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· BOM: explosión por niveles,</text>\n  <text x=\"292\" y=\"426\" font-size=\"10.8\" fill=\"#333\">implosión indentada ★</text>\n\n  <!-- U4 -->\n  <rect x=\"500\" y=\"228\" width=\"212\" height=\"204\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"514\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1E6B33\">U4 · EL PROCESO</text>\n  <text x=\"514\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1E6B33\">[T + P]</text>\n  <text x=\"514\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cómo se produce</text>\n  <text x=\"514\" y=\"305\" font-size=\"11\" fill=\"#444\">físicamente?</text>\n  <text x=\"514\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· Tipos de procesos industriales</text>\n  <text x=\"514\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· Máquinas y centros de trabajo</text>\n  <text x=\"514\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Estudio del trabajo:</text>\n  <text x=\"522\" y=\"377\" font-size=\"10.8\" fill=\"#333\">gráfica hombre–máquina ★ [P]</text>\n  <text x=\"514\" y=\"394\" font-size=\"10.8\" fill=\"#333\">· JIT ★ · Kanban · TQM · SMED</text>\n  <text x=\"514\" y=\"411\" font-size=\"10.8\" fill=\"#333\">· Teoría de las Restricciones</text>\n  <text x=\"522\" y=\"426\" font-size=\"10.8\" fill=\"#333\">(Goldratt, cuellos de botella)</text>\n\n  <!-- U5 -->\n  <rect x=\"730\" y=\"228\" width=\"210\" height=\"204\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#E5C2C2\" stroke-width=\"1.5\"/>\n  <text x=\"744\" y=\"252\" font-size=\"13.5\" font-weight=\"700\" fill=\"#9C3838\">U5 · LOGÍSTICA</text>\n  <text x=\"744\" y=\"269\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">[P + T]</text>\n  <text x=\"744\" y=\"290\" font-size=\"11\" fill=\"#444\">¿Cuánto material tener</text>\n  <text x=\"744\" y=\"305\" font-size=\"11\" fill=\"#444\">y cómo abastecerse?</text>\n  <text x=\"744\" y=\"328\" font-size=\"10.8\" fill=\"#333\">· EOQ/LEC · punto de reorden</text>\n  <text x=\"744\" y=\"345\" font-size=\"10.8\" fill=\"#333\">· EOQ con descuentos ★</text>\n  <text x=\"744\" y=\"362\" font-size=\"10.8\" fill=\"#333\">· Periódico vs. perpetuo ★</text>\n  <text x=\"744\" y=\"379\" font-size=\"10.8\" fill=\"#333\">· Stock de seguridad (normal)</text>\n  <text x=\"744\" y=\"396\" font-size=\"10.8\" fill=\"#333\">· Clasificación ABC ★</text>\n  <text x=\"744\" y=\"413\" font-size=\"10.8\" fill=\"#333\">· Compras, proveedores JIT ★</text>\n  <text x=\"744\" y=\"428\" font-size=\"10.8\" fill=\"#333\">· Almacenes y trazabilidad</text>\n\n  <!-- flechas de los 4 a U6 -->\n  <line x1=\"146\" y1=\"432\" x2=\"330\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"376\" y1=\"432\" x2=\"420\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"606\" y1=\"432\" x2=\"560\" y2=\"496\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n  <line x1=\"835\" y1=\"432\" x2=\"650\" y2=\"500\" stroke=\"#8A8A8A\" stroke-width=\"1.8\" marker-end=\"url(#arG)\"/>\n\n  <!-- ============ U6: EL MOTOR ============ -->\n  <rect x=\"120\" y=\"504\" width=\"740\" height=\"196\" rx=\"10\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2.5\"/>\n  <text x=\"140\" y=\"530\" font-size=\"15\" font-weight=\"700\" fill=\"#1F4E79\">UNIDAD 6 · PLANIFICACIÓN Y CONTROL DE LA PRODUCCIÓN</text>\n  <text x=\"700\" y=\"530\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">[P] la otra ½ de la práctica</text>\n  <text x=\"140\" y=\"548\" font-size=\"11\" fill=\"#666\" font-style=\"italic\">El motor donde se juntan los 4 insumos — la cadena operativa:</text>\n\n  <g font-size=\"11\" font-weight=\"700\">\n    <rect x=\"140\" y=\"560\" width=\"126\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"203\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">PLAN AGREGADO ★</text>\n    <line x1=\"270\" y1=\"575\" x2=\"288\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"292\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"335\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MPS ★</text>\n    <line x1=\"382\" y1=\"575\" x2=\"400\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"404\" y=\"560\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"464\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CAPACIDAD ★</text>\n    <line x1=\"528\" y1=\"575\" x2=\"546\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"550\" y=\"560\" width=\"86\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"593\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">MRP ★</text>\n    <line x1=\"640\" y1=\"575\" x2=\"658\" y2=\"575\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n    <rect x=\"662\" y=\"560\" width=\"178\" height=\"30\" rx=\"15\" fill=\"#1F4E79\"/>\n    <text x=\"751\" y=\"580\" fill=\"#fff\" text-anchor=\"middle\">CONTROL DE PISO</text>\n  </g>\n\n  <text x=\"140\" y=\"618\" font-size=\"10.8\" fill=\"#333\">· Plan agregado: persecución / nivelación, costos ★   · MPS: pronóstico vs. ventas confirmadas ★ (examen 2018)</text>\n  <text x=\"140\" y=\"636\" font-size=\"10.8\" fill=\"#333\">· Capacidad: listas de capacidad y perfiles de recursos ★, factor de actividad, scrap, curvas de aprendizaje</text>\n  <text x=\"140\" y=\"654\" font-size=\"10.8\" fill=\"#333\">· MRP: brutos→netos, lead times, scrap ★, loteo LEC/TBO-POQ ★/PPB   [tema huérfano: refuerzo extra]   · MRP II (CRP)</text>\n  <text x=\"140\" y=\"672\" font-size=\"10.8\" fill=\"#333\">· Balanceo de línea ★: precedencias, tiempo de ciclo, eficiencia   · Emisión y lanzamiento de órdenes, hoja de ruta ★</text>\n  <text x=\"140\" y=\"691\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">La U6 consume: la demanda de U2, el BOM de U3, la capacidad y métodos de U4, y los modelos de stock de U5.</text>\n\n  <line x1=\"490\" y1=\"700\" x2=\"490\" y2=\"724\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n\n  <!-- ============ U7 ============ -->\n  <rect x=\"120\" y=\"728\" width=\"740\" height=\"80\" rx=\"10\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"140\" y=\"754\" font-size=\"15\" font-weight=\"700\" fill=\"#5B3E8E\">UNIDAD 7 · SOFTWARES ERP</text>\n  <text x=\"700\" y=\"754\" font-size=\"11\" font-weight=\"700\" fill=\"#7B5AA6\">[T] el zoom out final</text>\n  <text x=\"140\" y=\"776\" font-size=\"11.5\" fill=\"#444\">Historia: MRP → MRP II → ERP · caracterización de los sistemas comerciales (SAP como caso típico)</text>\n  <text x=\"140\" y=\"795\" font-size=\"10.5\" fill=\"#888\" font-style=\"italic\">Todo lo anterior, empaquetado en software: por eso esta materia es “la anatomía de un ERP”.</text>\n\n  <!-- ============ COMPLEMENTOS ============ -->\n  <rect x=\"120\" y=\"822\" width=\"740\" height=\"56\" rx=\"8\" fill=\"#FAFAFA\" stroke=\"#BBB\" stroke-dasharray=\"5 4\"/>\n  <text x=\"140\" y=\"844\" font-size=\"12\" font-weight=\"700\" fill=\"#555\">COMPLEMENTOS (fuera del programa 2008, pero preguntados en el examen 2018):</text>\n  <text x=\"140\" y=\"864\" font-size=\"11\" fill=\"#444\">· BI / Data Warehouse: relación ERP–BI ★, modelo dimensional, Kimball    · Métodos de decisión racional ★ (nivel conceptual)</text>\n\n  <!-- LEYENDA -->\n  <text x=\"40\" y=\"906\" font-size=\"11.5\" fill=\"#333\"><tspan font-weight=\"700\" fill=\"#C00000\">[P]</tspan> se calcula → práctica (eliminatoria, primero)    <tspan font-weight=\"700\">[T]</tspan> se explica → teoría + coloquio globalizador    <tspan font-weight=\"700\">★</tspan> cayó en finales relevados</text>\n  <text x=\"40\" y=\"926\" font-size=\"11.5\" fill=\"#333\">Evaluación oficial: claridad conceptual · relaciones entre contenidos · vocabulario específico · interpretación · fundamentación</text>\n</svg>"},{"type":"heading","level":2,"text":"4. Subsistemas, flujo de información y el modelo ERP","html":"4. Subsistemas, flujo de información y el modelo ERP"},{"type":"paragraph","text":"El programa pone juntos: funciones e interacciones de los subsistemas, flujo de información, administración y gestión del sistema de producción, y **el modelo ERP**. El mapa v2 lo formula como «el modelo ERP como integrador». Es la misma tesis de toda la materia: la U1 anticipa lo que la U7 va a mostrar como software (paquetes pre-programados parametrizables para la gestión integral de los recursos).","html":"El programa pone juntos: funciones e interacciones de los subsistemas, flujo de información, administración y gestión del sistema de producción, y <strong>el modelo ERP</strong>. El mapa v2 lo formula como «el modelo ERP como integrador». Es la misma tesis de toda la materia: la U1 anticipa lo que la U7 va a mostrar como software (paquetes pre-programados parametrizables para la gestión integral de los recursos)."},{"type":"paragraph","text":"También entra **la participación del cliente en el modelo**. El programa lo lista entre los temas de esta unidad; no hay en los archivos leídos un desarrollo largo de ese punto, así que acá se deja enunciado, sin inventar un esquema de «el cliente adentro del sistema» que no esté en el apunte.","html":"También entra <strong>la participación del cliente en el modelo</strong>. El programa lo lista entre los temas de esta unidad; no hay en los archivos leídos un desarrollo largo de ese punto, así que acá se deja enunciado, sin inventar un esquema de «el cliente adentro del sistema» que no esté en el apunte."},{"type":"heading","level":2,"text":"5. Antecedentes de la empresa industrial (apunte de Evolución)","html":"5. Antecedentes de la empresa industrial (apunte de Evolución)"},{"type":"paragraph","text":"El apunte de R. Morán (2000) recorre cómo se llegó a gestionar la producción como sistema. Lo que sigue es ese relato, no un invento posterior:","html":"El apunte de R. Morán (2000) recorre cómo se llegó a gestionar la producción como sistema. Lo que sigue es ese relato, no un invento posterior:"},{"type":"list","ordered":false,"items":["**Siglo XVIII–XIX:** máquina de vapor, máquinas-herramientas, división del trabajo, intercambiabilidad de piezas; de la fabricación unitaria a la producción en volumen. Eso desemboca en la Revolución Industrial, con departamentalización, flujo de materiales, reducción de costos y planes de incentivos.","**Comienzos del siglo XX — Administración Científica:** Taylor (métodos; planificación separada de la ejecución); Gantt (programación, sus diagramas); Frank y Lillian Gilbreth (estudios de tiempos y movimientos). El apunte señala que ahí nace la Ingeniería Industrial, aunque en muchas empresas todavía se la identifica solo con métodos y tiempos.","**Años 20–30:** se ve que el incentivo salarial no basta (teorías del comportamiento; el apunte cita los Estudios de Hawthorne y a Elton Mayo). Walter Shewhart introduce el control estadístico de procesos, ligado a la intercambiabilidad en la producción en masa de Ford. Y aparece el enfoque de **sistemas**.","**2.ª Guerra y años 40:** Investigación Operativa; computadoras y automatización.","**Años 70:** primeros sistemas de programación de la producción basados en computadoras, «por ejemplo el sistema MRP de Joseph Orlicky», y después más integración de las funciones de la empresa.","**Años 80:** just-in-time (Taiichi Ohno, Toyota), gestión de la calidad total (Deming, Juran) y fabricación flexible.","**Años 90:** era de la información; el apunte también resume aportes de la «administración estilo japonés» (empleo de por vida en las grandes empresas, promociones lentas, decisión por consenso, atención a la calidad) y cierra: ninguno de esos movimientos es una teoría completa, pero un buen conocimiento de todos es la mejor preparación para gestionar los sistemas de producción."],"itemsHtml":["<strong>Siglo XVIII–XIX:</strong> máquina de vapor, máquinas-herramientas, división del trabajo, intercambiabilidad de piezas; de la fabricación unitaria a la producción en volumen. Eso desemboca en la Revolución Industrial, con departamentalización, flujo de materiales, reducción de costos y planes de incentivos.","<strong>Comienzos del siglo XX — Administración Científica:</strong> Taylor (métodos; planificación separada de la ejecución); Gantt (programación, sus diagramas); Frank y Lillian Gilbreth (estudios de tiempos y movimientos). El apunte señala que ahí nace la Ingeniería Industrial, aunque en muchas empresas todavía se la identifica solo con métodos y tiempos.","<strong>Años 20–30:</strong> se ve que el incentivo salarial no basta (teorías del comportamiento; el apunte cita los Estudios de Hawthorne y a Elton Mayo). Walter Shewhart introduce el control estadístico de procesos, ligado a la intercambiabilidad en la producción en masa de Ford. Y aparece el enfoque de <strong>sistemas</strong>.","<strong>2.ª Guerra y años 40:</strong> Investigación Operativa; computadoras y automatización.","<strong>Años 70:</strong> primeros sistemas de programación de la producción basados en computadoras, «por ejemplo el sistema MRP de Joseph Orlicky», y después más integración de las funciones de la empresa.","<strong>Años 80:</strong> just-in-time (Taiichi Ohno, Toyota), gestión de la calidad total (Deming, Juran) y fabricación flexible.","<strong>Años 90:</strong> era de la información; el apunte también resume aportes de la «administración estilo japonés» (empleo de por vida en las grandes empresas, promociones lentas, decisión por consenso, atención a la calidad) y cierra: ninguno de esos movimientos es una teoría completa, pero un buen conocimiento de todos es la mejor preparación para gestionar los sistemas de producción."]},{"type":"heading","level":2,"text":"6. Productividad, excelencia en manufactura y mejora continua","html":"6. Productividad, excelencia en manufactura y mejora continua"},{"type":"paragraph","text":"El programa cierra la unidad con productividad industrial, principales indicadores, excelencia en manufactura y mejora continua. El Documento Maestro los agrupa como tema de teoría y remite a Monks y a Chase (caps. 1–2). En los archivos extractados para esta clase **no hay una lista oficial de indicadores** ni una definición de cátedra de «excelencia en manufactura». Se dejan como temas del programa, para desarrollarlos cuando se lea esa bibliografía, sin inventar un tablero de indicadores.","html":"El programa cierra la unidad con productividad industrial, principales indicadores, excelencia en manufactura y mejora continua. El Documento Maestro los agrupa como tema de teoría y remite a Monks y a Chase (caps. 1–2). En los archivos extractados para esta clase <strong>no hay una lista oficial de indicadores</strong> ni una definición de cátedra de «excelencia en manufactura». Se dejan como temas del programa, para desarrollarlos cuando se lea esa bibliografía, sin inventar un tablero de indicadores."},{"type":"heading","level":2,"text":"7. Cómo se conecta con el resto de la materia","html":"7. Cómo se conecta con el resto de la materia"},{"type":"paragraph","text":"Si la U1 es el marco (empresa-sistema y conversión), las unidades 2 a 5 son los cuatro insumos de la planificación (demanda, producto, proceso, stock), la U6 es el motor y la U7 es el ERP que empaqueta el modelo. Por eso el mapa habla de «la anatomía de un ERP». Estudiar la U1 no es un prólogo decorativo: es el lugar desde el cual se entienden las relaciones que el final pide fundamentar.","html":"Si la U1 es el marco (empresa-sistema y conversión), las unidades 2 a 5 son los cuatro insumos de la planificación (demanda, producto, proceso, stock), la U6 es el motor y la U7 es el ERP que empaqueta el modelo. Por eso el mapa habla de «la anatomía de un ERP». Estudiar la U1 no es un prólogo decorativo: es el lugar desde el cual se entienden las relaciones que el final pide fundamentar."},{"type":"heading","level":2,"text":"8. Qué no está (todavía) en esta clase","html":"8. Qué no está (todavía) en esta clase"},{"type":"list","ordered":false,"items":["El **diagrama funcional** de la empresa industrial, que el programa nombra y el Maestro remite a Monks / Chase cap. 1: no está reproducido en los archivos leídos.","Una lista de **indicadores de productividad** con fórmula o definición de cátedra.","El desarrollo largo de **participación del cliente** y de **criterios de clasificación** de empresas (están en el programa; no hay apunte específico extractado).","Esta clase **no se marca como Vista**: no formó parte de la serie ya dictada. Queda disponible para estudiar."],"itemsHtml":["El <strong>diagrama funcional</strong> de la empresa industrial, que el programa nombra y el Maestro remite a Monks / Chase cap. 1: no está reproducido en los archivos leídos.","Una lista de <strong>indicadores de productividad</strong> con fórmula o definición de cátedra.","El desarrollo largo de <strong>participación del cliente</strong> y de <strong>criterios de clasificación</strong> de empresas (están en el programa; no hay apunte específico extractado).","Esta clase <strong>no se marca como Vista</strong>: no formó parte de la serie ya dictada. Queda disponible para estudiar."]}],"historias":[{"type":"concepto","k":"La idea","title":"Mirar la empresa como un sistema.","text":"El programa pide conocer las empresas bajo un enfoque sistémico y desde la administración de la producción. El Documento Maestro lo llama unidad-marco: da el vocabulario que después usan todas las demás.","html":"El programa pide conocer las empresas bajo un enfoque sistémico y desde la administración de la producción. El Documento Maestro lo llama unidad-marco: da el vocabulario que después usan todas las demás.","titleHtml":"Mirar la empresa como un sistema."},{"type":"concepto","k":"El programa","title":"El eje es la empresa como productora de bienes (y servicios).","text":"Los temas oficiales: función y clasificación, antecedentes, la empresa como sistema, el proceso de conversión, subsistemas y flujo de información, el modelo ERP, la participación del cliente, productividad, excelencia y mejora continua.","html":"Los temas oficiales: función y clasificación, antecedentes, la empresa como sistema, el proceso de conversión, subsistemas y flujo de información, el modelo ERP, la participación del cliente, productividad, excelencia y mejora continua.","titleHtml":"El eje es la empresa como productora de bienes (y servicios)."},{"type":"concepto","k":"La conversión","title":"Insumos → transformación → productos.","text":"Así resumen el mapa v2 y el Documento Maestro el proceso de conversión. Es el esquema mínimo: lo que entra, lo que se transforma y lo que sale, con un flujo de información que lo sostiene.","svg":"<svg viewBox=\"0 0 280 72\" width=\"100%\" height=\"72\" aria-hidden=\"true\"><rect x=
