/strong> Ventas de una constructora que subieron hasta 2018, se derrumbaron 2019–2021 y se recuperan desde 2022."},{"type":"callout","kind":"idea","text":"Este ejercicio es **de criterio, no de cuenta** — es exactamente lo que la cátedra evalúa cuando pide \"fundamentar la metodología aplicada\".","html":"Este ejercicio es <strong>de criterio, no de cuenta</strong> — es exactamente lo que la cátedra evalúa cuando pide \"fundamentar la metodología aplicada\"."}],"nota":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","notaHtml":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","titleHtml":"8. EJERCICIO — Clase 3.a"},{"type":"heading","level":2,"text":"9. Ejercicios acumulados pendientes de corrección","html":"9. Ejercicios acumulados pendientes de corrección"},{"type":"list","ordered":true,"items":["**Clase 1.b** (ventas 120, 135, 105, 140, 100): a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110<X<145) · e) inverso 90% · f) ¿Z o t?","**Clase 2** (temperatura vs. bebidas): a) tabla y sumatorias · b) r · c) interpretación · d) ¿causalidad?","**Clase 3.a** (diagnóstico de 4 series): a) a d)"],"itemsHtml":["<strong>Clase 1.b</strong> (ventas 120, 135, 105, 140, 100): a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110&lt;X&lt;145) · e) inverso 90% · f) ¿Z o t?","<strong>Clase 2</strong> (temperatura vs. bebidas): a) tabla y sumatorias · b) r · c) interpretación · d) ¿causalidad?","<strong>Clase 3.a</strong> (diagnóstico de 4 series): a) a d)"]},{"type":"paragraph","text":"**Material asociado:** `Clase03a_SeriesDeTiempo.svg`\n**Fuente:** Hanke, *Pronósticos en los Negocios*, caps. 3 y 4 — completo en Drive/Teoría/Libros.","html":"<strong>Material asociado:</strong> <code>Clase03a_SeriesDeTiempo.svg</code>\n<strong>Fuente:</strong> Hanke, <em>Pronósticos en los Negocios</em>, caps. 3 y 4 — completo en Drive/Teoría/Libros."},{"type":"paragraph","text":"**Próxima clase → Clase 3.b: Autocorrelación y correlograma** — la herramienta técnica para detectar estos mismos patrones con números en lugar de a ojo.","html":"<strong>Próxima clase → Clase 3.b: Autocorrelación y correlograma</strong> — la herramienta técnica para detectar estos mismos patrones con números en lugar de a ojo."}],"historias":[{"type":"concepto","k":"La idea","title":"Mirar el gráfico es elegir el método.","text":"Toda serie de ventas es la superposición de cuatro componentes: tendencia, ciclo, estacionalidad e irregularidad. Aprender a mirar un gráfico y decir qué componentes tiene es lo que permite elegir y justificar el método de pronóstico: exactamente lo que evalúa la cátedra.","html":"Toda serie de ventas es la superposición de cuatro componentes: tendencia, ciclo, estacionalidad e irregularidad. Aprender a mirar un gráfico y decir qué componentes tiene es lo que permite elegir y justificar el método de pronóstico: exactamente lo que evalúa la cátedra.","titleHtml":"Mirar el gráfico es elegir el método."},{"type":"concepto","k":"Dos tipos de datos","title":"En una serie, el orden ES la información.","text":"Corte transversal: datos en un solo momento (el sueldo de 50 empleados hoy); el orden no importa. Serie de tiempo: secuencia ordenada (ventas de ene, feb, mar…). Mezclar los períodos destruye la información.","ejemplo":"Notación: Yₜ = valor en el período t · Yₜ₋₁ = el anterior · Ŷₜ = pronóstico para ese período. Si descubro el patrón del pasado, puedo proyectarlo al futuro.","html":"Corte transversal: datos en un solo momento (el sueldo de 50 empleados hoy); el orden no importa. Serie de tiempo: secuencia ordenada (ventas de ene, feb, mar…). Mezclar los períodos destruye la información.","titleHtml":"En una serie, el orden ES la información."},{"type":"concepto","k":"Cuatro componentes","title":"T, C, S e I, como instrumentos de una canción.","text":"Tendencia (largo plazo), ciclo (ondas de varios años, período variable), estacionalidad (se repite con período fijo: L=4 trimestral, L=12 mensual) e irregularidad (el ruido impredecible).","ejemplo":"Helados en verano, pico en diciembre: estacionalidad. Recesión de varios años: ciclo.","html":"Tendencia (largo plazo), ciclo (ondas de varios años, período variable), estacionalidad (se repite con período fijo: L=4 trimestral, L=12 mensual) e irregularidad (el ruido impredecible).","titleHtml":"T, C, S e I, como instrumentos de una canción."},{"type":"pregunta","k":"A ver…","title":"¿Qué diferencia a la estacionalidad del ciclo?","options":["El ciclo se repite todos los años en la misma fecha","La estacionalidad tiene período fijo y se puede marcar en el calendario; el ciclo no","No hay diferencia: son dos nombres del mismo componente"],"correct":1,"feedback":"Regla del apunte: si podés poner en el calendario cuándo va a pasar → estacionalidad. Si depende de la economía y nadie sabe cuándo → ciclo.","titleHtml":"¿Qué diferencia a la estacionalidad del ciclo?"},{"type":"concepto","k":"La confusión clásica","title":"Si va en el calendario, es estacionalidad.","text":"Estacionalidad: duración fija, dentro del año, predecible, clima o calendario. Ciclo: duración variable, varios años, difícil de anticipar, economía o mercado.","html":"Estacionalidad: duración fija, dentro del año, predecible, clima o calendario. Ciclo: duración variable, varios años, difícil de anticipar, economía o mercado.","titleHtml":"Si va en el calendario, es estacionalidad."},{"type":"concepto","k":"Cómo se combinan","title":"Aditivo o multiplicativo.","text":"Aditivo: los componentes se suman (en diciembre, +200 unidades). Multiplicativo: se multiplican (en diciembre, +40%). En la industria, el multiplicativo es el más común, y es el que nombra el programa.","formula":"Y = T \\times C \\times S \\times I","ejemplo":"En la práctica industrial el multiplicativo es el más común, y es el que menciona el programa de la cátedra («modelos de descomposición multiplicativo»).","svg":"<svg viewBox=\"0 0 280 128\" width=\"100%\" height=\"128\" aria-hidden=\"true\"><polyline fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.8\" points=\"20.0,44.0 25.0,49.1 30.0,50.1 35.0,45.8 40.0,38.4 45.0,32.3 50.0,31.2 55.0,35.1 60.0,40.8 65.0,43.7 70.0,41.4 75.0,34.7 80.0,27.6 85.0,24.3 90.0,26.5 95.0,32.0 100.0,36.5 105.0,36.3 110.0,31.0 115.0,23.5 120.0,18.3 125.0,18.4 130.0,23.0 135.0,28.5 140.0,30.4\"/><text x=\"20\" y=\"14\" font-size=\"9\" fill=\"#8cb4d6\" font-weight=\"700\">Aditivo: ondas del mismo tamaño</text><polyline fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.8\" points=\"20.0,100.0 25.0,105.7 30.0,107.6 35.0,103.0 40.0,93.6 45.0,85.1 50.0,83.1 55.0,89.4 60.0,99.7 65.0,106.2 70.0,103.2 75.0,91.3 80.0,77.4 85.0,70.8 90.0,76.1 95.0,90.0 100.0,102.6 105.0,104.2 110.0,92.2 115.0,73.5 120.0,60.2 125.0,61.4 130.0,76.6 135.0,95.3 140.0,104.0\"/><text x=\"20\" y=\"70\" font-size=\"9\" fill=\"#e25b16\" font-weight=\"700\">Multiplicativo: ondas que se agrandan</text></svg>","chartLabel":"Aditivo: mismas ondas. Multiplicativo: se agrandan con la tendencia","formulaHtml":"<span class=\"eq-block\">Y = T × C × S × I</span>","html":"Aditivo: los componentes se suman (en diciembre, +200 unidades). Multiplicativo: se multiplican (en diciembre, +40%). En la industria, el multiplicativo es el más común, y es el que nombra el programa.","titleHtml":"Aditivo o multiplicativo."},{"type":"pregunta","k":"A ver…","title":"Si en el gráfico las ondas se agrandan a medida que crece la serie, el modelo es…","options":["Aditivo: la estacionalidad es una cantidad fija de unidades","Multiplicativo: la estacionalidad es un porcentaje","Solo irregularidad, no hay estacionalidad"],"correct":1,"feedback":"Ondas que se agrandan con el nivel (embudo abierto) → multiplicativo. Si mantienen el mismo tamaño → aditivo.","titleHtml":"Si en el gráfico las ondas se agrandan a medida que crece la serie, el modelo es…"},{"type":"concepto","k":"Estacionaria","title":"La primera pregunta del árbol.","text":"Una serie es estacionaria cuando su valor promedio no cambia a través del tiempo. Fluctúa, pero alrededor de un nivel constante. «¿Es estacionaria?» es la primera bifurcación del árbol de decisión.","ejemplo":"Si no lo es, se puede diferenciar: trabajar con Yₜ − Yₜ₋₁. Si una serie crece de a 10 por mes, sus diferencias son todas 10: queda plana, estacionaria.","html":"Una serie es estacionaria cuando su valor promedio no cambia a través del tiempo. Fluctúa, pero alrededor de un nivel constante. «¿Es estacionaria?» es la primera bifurcación del árbol de decisión.","titleHtml":"La primera pregunta del árbol."},{"type":"concepto","k":"El árbol ★","title":"Esta tabla justifica la metodología.","text":"Estacionaria → promedio simple, móvil, suavizado exponencial simple, Box-Jenkins. Tendencia → móvil doble, Brown, Holt, regresión. Estacionalidad → Winter, descomposición, regresión múltiple de series, Census II. Ciclo → descomposición, indicadores, econométricos.","ejemplo":"Este cuadro es la respuesta a «justifique la metodología aplicada» del examen.","html":"Estacionaria → promedio simple, móvil, suavizado exponencial simple, Box-Jenkins. Tendencia → móvil doble, Brown, Holt, regresión. Estacionalidad → Winter, descomposición, regresión múltiple de series, Census II. Ciclo → descomposición, indicadores, econométricos.","titleHtml":"Esta tabla justifica la metodología."},{"type":"concepto","k":"Ejemplo","title":"Aires acondicionados, ventas trimestrales.","text":"Cada año vende más: tendencia. Cada verano se dispara y cada invierno se hunde: estacionalidad, L = 4. En 2020 cayó por la recesión: ciclo. Un pedido raro de un hotel: irregularidad. Los picos de verano cada vez más grandes: multiplicativo. No es estacionaria.","ejemplo":"¿Qué método? Winter o descomposición, porque tiene tendencia Y estacionalidad.","html":"Cada año vende más: tendencia. Cada verano se dispara y cada invierno se hunde: estacionalidad, L = 4. En 2020 cayó por la recesión: ciclo. Un pedido raro de un hotel: irregularidad. Los picos de verano cada vez más grandes: multiplicativo. No es estacionaria.","titleHtml":"Aires acondicionados, ventas trimestrales."},{"type":"pregunta","k":"A ver…","title":"Ventas trimestrales de aires: tendencia + estacionalidad, no estacionaria. ¿Qué familia usarías?","options":["Promedio móvil o suavizado exponencial simple","Winter o descomposición","Solo un promedio simple, porque es más estable"],"correct":1,"feedback":"El árbol: si tiene tendencia y estacionalidad, corresponden Winter o descomposición. El suavizado simple es para series estacionarias.","titleHtml":"Ventas trimestrales de aires: tendencia + estacionalidad, no estacionaria. ¿Qué familia usarías?"},{"type":"cierre","title":"Llevate esto de la Clase 3.a.","text":"El orden de la serie es información. Diagnosticá T, C, S e I a ojo, decidí aditivo o multiplicativo, y usá el árbol para justificar el método. El ejercicio de las 4 series queda para resolver juntos.","html":"El orden de la serie es información. Diagnosticá T, C, S e I a ojo, decidí aditivo o multiplicativo, y usá el árbol para justificar el método. El ejercicio de las 4 series queda para resolver juntos.","titleHtml":"Llevate esto de la Clase 3.a."}],"titleHtml":"Clase 3.a · Series de tiempo","ledeHtml":"toda serie de ventas es la superposición de cuatro componentes (tendencia, ciclo, estacionalidad, irregularidad). Aprender a mirar un gráfico y decir qué componentes tiene es lo que permite elegir y justificar el método de pronóstico — exactamente lo que evalúa la cátedra."},"c3b":{"unitId":"u2","unitLabel":"Unidad 2","unitTitle":"Métodos de pronósticos","id":"c3b","title":"Clase 3.b · Autocorrelación","name":"Autocorrelación","lede":"en la Clase 3.a diagnosticabas la serie a ojo. La autocorrelación es el mismo diagnóstico con números: evidencia objetiva de qué patrón tiene la serie, y por lo tanto de qué método corresponde aplicar.","visto":true,"source":["clases_previas/SG/Clase03b_Autocorrelacion.md","clases_previas/SG/Clase03b_Autocorrelacion.svg","clases_previas/SG/ArbolDecisorio_MetodosPronostico.svg"],"laminas":["u2/img/Clase03b_Autocorrelacion.svg","u2/img/ArbolDecisorio_MetodosPronostico.svg"],"next":"Clase 4 · Medidas de error","teoria":[{"type":"paragraph","text":"**Sistemas de Gestión (UTN FRRo) · Unidad 2.b (cierre) · Serie: 0 → 0.1 → 1 → 1.b → 2 → 3.a → **3.b****","html":"<strong>Sistemas de Gestión (UTN FRRo) · Unidad 2.b (cierre) · Serie: 0 → 0.1 → 1 → 1.b → 2 → 3.a → </strong>3.b****"},{"type":"callout","kind":"idea","text":"**Idea central:** en la Clase 3.a diagnosticabas la serie **a ojo**. La autocorrelación es el mismo diagnóstico **con números**: evidencia objetiva de qué patrón tiene la serie, y por lo tanto de qué método corresponde aplicar.","html":"<strong>Idea central:</strong> en la Clase 3.a diagnosticabas la serie <strong>a ojo</strong>. La autocorrelación es el mismo diagnóstico <strong>con números</strong>: evidencia objetiva de qué patrón tiene la serie, y por lo tanto de qué método corresponde aplicar."},{"type":"heading","level":2,"text":"1. El problema que resuelve","html":"1. El problema que resuelve"},{"type":"paragraph","text":"Mirar el gráfico funciona cuando el patrón es evidente. Pero:","html":"Mirar el gráfico funciona cuando el patrón es evidente. Pero:"},{"type":"list","ordered":false,"items":["¿Y si la serie es ruidosa y no estás seguro?","¿Y si te preguntan \"¿en qué te basás?\" y \"me pareció ver una onda\" no alcanza?"],"itemsHtml":["¿Y si la serie es ruidosa y no estás seguro?","¿Y si te preguntan \"¿en qué te basás?\" y \"me pareció ver una onda\" no alcanza?"]},{"type":"paragraph","text":"La autocorrelación convierte la intuición visual en un dato verificable.","html":"La autocorrelación convierte la intuición visual en un dato verificable."},{"type":"heading","level":2,"text":"2. La idea: correlacionar la serie CONSIGO MISMA","html":"2. La idea: correlacionar la serie CONSIGO MISMA"},{"type":"paragraph","text":"En la Clase 2 correlacionabas **dos variables distintas** (publicidad y ventas). Acá el giro: se correlaciona la serie con **su propio pasado**.","html":"En la Clase 2 correlacionabas <strong>dos variables distintas</strong> (publicidad y ventas). Acá el giro: se correlaciona la serie con <strong>su propio pasado</strong>."},{"type":"paragraph","text":"Se toma la serie y se la compara contra sí misma corrida **k** períodos hacia atrás. Ese corrimiento se llama **desfasamiento** o **lag (k)**.","html":"Se toma la serie y se la compara contra sí misma corrida <strong>k</strong> períodos hacia atrás. Ese corrimiento se llama <strong>desfasamiento</strong> o <strong>lag (k)</strong>."},{"type":"table","headers":["Mes","Yₜ (original)","Yₜ₋₁ (lag 1)","Yₜ₋₂ (lag 2)"],"rows":[["---","---","---","---"],["Ene","100","—","—"],["Feb","110","100","—"],["Mar","105","110","100"],["Abr","120","105","110"],["May","115","120","105"]],"headersHtml":["Mes","Yₜ (original)","Yₜ₋₁ (lag 1)","Yₜ₋₂ (lag 2)"],"rowsHtml":[["---","---","---","---"],["Ene","100","—","—"],["Feb","110","100","—"],["Mar","105","110","100"],["Abr","120","105","110"],["May","115","120","105"]]},{"type":"paragraph","text":"**Qué compara cada rₖ:**","html":"<strong>Qué compara cada rₖ:</strong>"},{"type":"list","ordered":false,"items":["**r₁** → cada mes con el mes anterior","**r₄** → cada trimestre con el mismo trimestre del año pasado (datos trimestrales)","**r₁₂** → cada mes con el mismo mes del año anterior (datos mensuales)"],"itemsHtml":["<strong>r₁</strong> → cada mes con el mes anterior","<strong>r₄</strong> → cada trimestre con el mismo trimestre del año pasado (datos trimestrales)","<strong>r₁₂</strong> → cada mes con el mismo mes del año anterior (datos mensuales)"]},{"type":"heading","level":3,"text":"Fórmula","html":"Fórmula"},{"type":"formula","tex":"r_k = \\frac{\\sum_{t=k+1}^{n}(Y_t - \\bar{Y})(Y_{t-k} - \\bar{Y})}{\\sum_{t=1}^{n}(Y_t - \\bar{Y})^2}","html":"<span class=\"eq-block\">r<sub>k</sub> = <span class=\"frac\"><span class=\"num\"><span class=\"op\">Σ<sub>t=k+1</sub><sup>n</sup></span>(Y<sub>t</sub> - <span class=\"ov\">Y</span>)(Y<sub>t-k</sub> - <span class=\"ov\">Y</span>)</span><span class=\"den\"><span class=\"op\">Σ<sub>t=1</sub><sup>n</sup></span>(Y<sub>t</sub> - <span class=\"ov\">Y</span>)<sup>2</sup></span></span></span>"},{"type":"svg","file":"u2/img/Clase03b_Autocorrelacion.svg","caption":"Lámina de la Clase 3.b · Autocorrelación y correlograma","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 980 1040\" width=\"980\" height=\"1040\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L10,4 L0,8 Z\" fill=\"#1F4E79\"/></marker>\n  </defs>\n  <rect width=\"980\" height=\"1040\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">CLASE 3.b · Autocorrelación y correlograma</text>\n  <text x=\"530\" y=\"34\" font-size=\"12.5\" fill=\"#666\">U2.b (cierre) — el diagnóstico con NÚMEROS</text>\n  <text x=\"40\" y=\"56\" font-size=\"12.5\" font-weight=\"700\" fill=\"#C00000\">Idea: correlacionar la serie CONSIGO MISMA desfasada k períodos → mide la “memoria” de la serie.</text>\n\n  <!-- ===== CONCEPTO ===== -->\n  <rect x=\"40\" y=\"72\" width=\"450\" height=\"196\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"94\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">El desfasamiento (lag k)</text>\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"104\" width=\"416\" height=\"18\" fill=\"#1F4E79\"/>\n    <text x=\"68\" y=\"117\" fill=\"#fff\" font-weight=\"700\">Mes</text>\n    <text x=\"150\" y=\"117\" fill=\"#fff\" font-weight=\"700\">Yₜ (original)</text>\n    <text x=\"270\" y=\"117\" fill=\"#fff\" font-weight=\"700\">Yₜ₋₁ (lag 1)</text>\n    <text x=\"382\" y=\"117\" fill=\"#fff\" font-weight=\"700\">Yₜ₋₂ (lag 2)</text>\n    <text x=\"68\" y=\"135\" fill=\"#333\">Ene</text><text x=\"150\" y=\"135\" fill=\"#333\">100</text><text x=\"270\" y=\"135\" fill=\"#bbb\">—</text><text x=\"382\" y=\"135\" fill=\"#bbb\">—</text>\n    <text x=\"68\" y=\"151\" fill=\"#333\">Feb</text><text x=\"150\" y=\"151\" fill=\"#333\">110</text><text x=\"270\" y=\"151\" fill=\"#333\">100</text><text x=\"382\" y=\"151\" fill=\"#bbb\">—</text>\n    <text x=\"68\" y=\"167\" fill=\"#333\">Mar</text><text x=\"150\" y=\"167\" fill=\"#333\">105</text><text x=\"270\" y=\"167\" fill=\"#333\">110</text><text x=\"382\" y=\"167\" fill=\"#333\">100</text>\n    <text x=\"68\" y=\"183\" fill=\"#333\">Abr</text><text x=\"150\" y=\"183\" fill=\"#333\">120</text><text x=\"270\" y=\"183\" fill=\"#333\">105</text><text x=\"382\" y=\"183\" fill=\"#333\">110</text>\n    <text x=\"68\" y=\"199\" fill=\"#333\">May</text><text x=\"150\" y=\"199\" fill=\"#333\">115</text><text x=\"270\" y=\"199\" fill=\"#333\">120</text><text x=\"382\" y=\"199\" fill=\"#333\">105</text>\n  </g>\n  <text x=\"56\" y=\"222\" font-size=\"11\" fill=\"#333\"><tspan font-weight=\"700\">r₁</tspan> = cada mes vs. el anterior · <tspan font-weight=\"700\">r₄</tspan> = vs. mismo trimestre del año pasado</text>\n  <text x=\"56\" y=\"240\" font-size=\"11\" fill=\"#333\"><tspan font-weight=\"700\">r₁₂</tspan> = cada mes vs. el mismo mes del año anterior</text>\n  <text x=\"56\" y=\"260\" font-size=\"10.5\" fill=\"#1F4E79\" font-weight=\"700\">rₖ alto ⇒ el pasado de hace k períodos predice el presente ⇒ hay patrón</text>\n\n  <!-- ===== FORMULA ===== -->\n  <rect x=\"504\" y=\"72\" width=\"436\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"520\" y=\"94\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">Fórmula del coeficiente de autocorrelación</text>\n\n  <text x=\"560\" y=\"132\" font-size=\"12.5\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Σ (Yₜ − Ȳ)(Yₜ₋ₖ − Ȳ)</text>\n  <line x1=\"548\" y1=\"140\" x2=\"800\" y2=\"140\" stroke=\"#1F4E79\" stroke-width=\"1.6\"/>\n  <text x=\"520\" y=\"138\" font-size=\"14\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">rₖ =</text>\n  <text x=\"600\" y=\"162\" font-size=\"12.5\" fill=\"#1F4E79\" font-family=\"Cambria Math, Georgia, serif\" font-weight=\"700\">Σ (Yₜ − Ȳ)²</text>\n\n  <text x=\"520\" y=\"190\" font-size=\"10.8\" fill=\"#333\"><tspan font-weight=\"700\">Numerador:</tspan> por cada par separado k períodos, multiplico</text>\n  <text x=\"520\" y=\"205\" font-size=\"10.8\" fill=\"#333\">sus desvíos contra la media, y sumo.</text>\n  <text x=\"520\" y=\"224\" font-size=\"10.8\" fill=\"#333\"><tspan font-weight=\"700\">Denominador:</tspan> suma de desvíos² → normaliza entre −1 y +1.</text>\n  <text x=\"520\" y=\"248\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Es el mismo r de la Clase 2, adaptado a la propia serie.</text>\n\n  <!-- ===== LAS 4 HUELLAS ===== -->\n  <rect x=\"40\" y=\"282\" width=\"900\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"306\" font-size=\"14\" font-weight=\"700\" fill=\"#8A5A16\">★ LAS 4 HUELLAS DACTILARES — cada patrón deja una marca distinta en el correlograma</text>\n  <text x=\"56\" y=\"324\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Eje horizontal = lag k · Eje vertical = valor de rₖ · Líneas punteadas = banda de significancia</text>\n\n  <!-- H1 ALEATORIA -->\n  <rect x=\"58\" y=\"336\" width=\"208\" height=\"256\" rx=\"6\" fill=\"#fff\" stroke=\"#BFDCC4\" stroke-width=\"1.5\"/>\n  <text x=\"72\" y=\"358\" font-size=\"12\" font-weight=\"700\" fill=\"#1E6B33\">1 · ALEATORIA</text>\n  <text x=\"72\" y=\"373\" font-size=\"9.8\" fill=\"#666\">(estacionaria pura)</text>\n  <line x1=\"76\" y1=\"452\" x2=\"76\" y2=\"386\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"76\" y1=\"430\" x2=\"252\" y2=\"430\" stroke=\"#555\" stroke-width=\"1.2\"/>\n  <line x1=\"76\" y1=\"404\" x2=\"252\" y2=\"404\" stroke=\"#C00000\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <line x1=\"76\" y1=\"456\" x2=\"252\" y2=\"456\" stroke=\"#C00000\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <rect x=\"86\" y=\"422\" width=\"9\" height=\"8\" fill=\"#1E6B33\"/>\n  <rect x=\"102\" y=\"430\" width=\"9\" height=\"7\" fill=\"#1E6B33\"/>\n  <rect x=\"118\" y=\"424\" width=\"9\" height=\"6\" fill=\"#1E6B33\"/>\n  <rect x=\"134\" y=\"430\" width=\"9\" height=\"9\" fill=\"#1E6B33\"/>\n  <rect x=\"150\" y=\"421\" width=\"9\" height=\"9\" fill=\"#1E6B33\"/>\n  <rect x=\"166\" y=\"430\" width=\"9\" height=\"6\" fill=\"#1E6B33\"/>\n  <rect x=\"182\" y=\"425\" width=\"9\" height=\"5\" fill=\"#1E6B33\"/>\n  <rect x=\"198\" y=\"430\" width=\"9\" height=\"8\" fill=\"#1E6B33\"/>\n  <rect x=\"214\" y=\"423\" width=\"9\" height=\"7\" fill=\"#1E6B33\"/>\n  <rect x=\"230\" y=\"430\" width=\"9\" height=\"5\" fill=\"#1E6B33\"/>\n  <text x=\"72\" y=\"482\" font-size=\"10.5\" fill=\"#333\">Todas las barras cerca de</text>\n  <text x=\"72\" y=\"496\" font-size=\"10.5\" fill=\"#333\">cero, ninguna se destaca.</text>\n  <text x=\"72\" y=\"516\" font-size=\"10.5\" font-weight=\"700\" fill=\"#1E6B33\">⇒ ESTACIONARIA</text>\n  <text x=\"72\" y=\"536\" font-size=\"10.2\" fill=\"#333\">Sin patrón: el pasado no</text>\n  <text x=\"72\" y=\"549\" font-size=\"10.2\" fill=\"#333\">dice nada del presente.</text>\n  <text x=\"72\" y=\"570\" font-size=\"10.2\" font-weight=\"700\" fill=\"#8A5A16\">Método: promedio móvil,</text>\n  <text x=\"72\" y=\"583\" font-size=\"10.2\" font-weight=\"700\" fill=\"#8A5A16\">suavizado exp. simple</text>\n\n  <!-- H2 TENDENCIA -->\n  <rect x=\"278\" y=\"336\" width=\"208\" height=\"256\" rx=\"6\" fill=\"#fff\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"292\" y=\"358\" font-size=\"12\" font-weight=\"700\" fill=\"#1F4E79\">2 · TENDENCIA</text>\n  <text x=\"292\" y=\"373\" font-size=\"9.8\" fill=\"#666\">decaimiento gradual</text>\n  <line x1=\"296\" y1=\"452\" x2=\"296\" y2=\"386\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"296\" y1=\"452\" x2=\"472\" y2=\"452\" stroke=\"#555\" stroke-width=\"1.2\"/>\n  <line x1=\"296\" y1=\"426\" x2=\"472\" y2=\"426\" stroke=\"#C00000\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <rect x=\"306\" y=\"390\" width=\"9\" height=\"62\" fill=\"#1F4E79\"/>\n  <rect x=\"322\" y=\"396\" width=\"9\" height=\"56\" fill=\"#1F4E79\"/>\n  <rect x=\"338\" y=\"402\" width=\"9\" height=\"50\" fill=\"#1F4E79\"/>\n  <rect x=\"354\" y=\"409\" width=\"9\" height=\"43\" fill=\"#1F4E79\"/>\n  <rect x=\"370\" y=\"416\" width=\"9\" height=\"36\" fill=\"#1F4E79\"/>\n  <rect x=\"386\" y=\"423\" width=\"9\" height=\"29\" fill=\"#1F4E79\"/>\n  <rect x=\"402\" y=\"430\" width=\"9\" height=\"22\" fill=\"#9DC3E6\"/>\n  <rect x=\"418\" y=\"436\" width=\"9\" height=\"16\" fill=\"#9DC3E6\"/>\n  <rect x=\"434\" y=\"441\" width=\"9\" height=\"11\" fill=\"#9DC3E6\"/>\n  <rect x=\"450\" y=\"445\" width=\"9\" height=\"7\" fill=\"#9DC3E6\"/>\n  <text x=\"292\" y=\"482\" font-size=\"10.5\" fill=\"#333\">Altas al principio y caen</text>\n  <text x=\"292\" y=\"496\" font-size=\"10.5\" fill=\"#333\">GRADUALMENTE a cero.</text>\n  <text x=\"292\" y=\"516\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">⇒ NO ESTACIONARIA</text>\n  <text x=\"292\" y=\"536\" font-size=\"10.2\" fill=\"#333\">El mes pasado se parece</text>\n  <text x=\"292\" y=\"549\" font-size=\"10.2\" fill=\"#333\">mucho; el de hace un año, menos.</text>\n  <text x=\"292\" y=\"570\" font-size=\"10.2\" font-weight=\"700\" fill=\"#8A5A16\">Método: Holt, Brown,</text>\n  <text x=\"292\" y=\"583\" font-size=\"10.2\" font-weight=\"700\" fill=\"#8A5A16\">regresión — o diferenciar</text>\n\n  <!-- H3 ESTACIONALIDAD -->\n  <rect x=\"498\" y=\"336\" width=\"208\" height=\"256\" rx=\"6\" fill=\"#fff\" stroke=\"#E3D2B5\" stroke-width=\"1.5\"/>\n  <text x=\"512\" y=\"358\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">3 · ESTACIONALIDAD</text>\n  <text x=\"512\" y=\"373\" font-size=\"9.8\" fill=\"#666\">pico aislado en el lag L</text>\n  <line x1=\"516\" y1=\"452\" x2=\"516\" y2=\"386\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"516\" y1=\"452\" x2=\"692\" y2=\"452\" stroke=\"#555\" stroke-width=\"1.2\"/>\n  <line x1=\"516\" y1=\"426\" x2=\"692\" y2=\"426\" stroke=\"#C00000\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <rect x=\"526\" y=\"440\" width=\"9\" height=\"12\" fill=\"#D9954A\"/>\n  <rect x=\"542\" y=\"443\" width=\"9\" height=\"9\" fill=\"#D9954A\"/>\n  <rect x=\"558\" y=\"438\" width=\"9\" height=\"14\" fill=\"#D9954A\"/>\n  <rect x=\"574\" y=\"392\" width=\"9\" height=\"60\" fill=\"#B5651D\"/>\n  <rect x=\"590\" y=\"442\" width=\"9\" height=\"10\" fill=\"#D9954A\"/>\n  <rect x=\"606\" y=\"444\" width=\"9\" height=\"8\" fill=\"#D9954A\"/>\n  <rect x=\"622\" y=\"440\" width=\"9\" height=\"12\" fill=\"#D9954A\"/>\n  <rect x=\"638\" y=\"402\" width=\"9\" height=\"50\" fill=\"#B5651D\"/>\n  <rect x=\"654\" y=\"443\" width=\"9\" height=\"9\" fill=\"#D9954A\"/>\n  <rect x=\"670\" y=\"445\" width=\"9\" height=\"7\" fill=\"#D9954A\"/>\n  <text x=\"578\" y=\"470\" font-size=\"9\" fill=\"#B5651D\" font-weight=\"700\" text-anchor=\"middle\">k=4</text>\n  <text x=\"642\" y=\"470\" font-size=\"9\" fill=\"#B5651D\" font-weight=\"700\" text-anchor=\"middle\">k=8</text>\n  <text x=\"512\" y=\"490\" font-size=\"10.5\" fill=\"#333\">Pico aislado en el lag del</text>\n  <text x=\"512\" y=\"504\" font-size=\"10.5\" fill=\"#333\">ciclo (y sus múltiplos).</text>\n  <text x=\"512\" y=\"524\" font-size=\"10.5\" font-weight=\"700\" fill=\"#B5651D\">⇒ L = 4 (trim) o 12 (mens)</text>\n  <text x=\"512\" y=\"544\" font-size=\"10.2\" fill=\"#C00000\" font-weight=\"700\">El lag del pico TE DICE</text>\n  <text x=\"512\" y=\"557\" font-size=\"10.2\" fill=\"#C00000\" font-weight=\"700\">la longitud estacional.</text>\n  <text x=\"512\" y=\"578\" font-size=\"10.2\" font-weight=\"700\" fill=\"#8A5A16\">Método: Winter, descomposición</text>\n\n  <!-- H4 COMBINADA -->\n  <rect x=\"718\" y=\"336\" width=\"204\" height=\"256\" rx=\"6\" fill=\"#fff\" stroke=\"#C00000\" stroke-width=\"1.8\"/>\n  <text x=\"732\" y=\"358\" font-size=\"12\" font-weight=\"700\" fill=\"#9C3838\">4 · COMBINADA</text>\n  <text x=\"732\" y=\"373\" font-size=\"9.8\" fill=\"#666\">el caso REAL más frecuente</text>\n  <line x1=\"736\" y1=\"452\" x2=\"736\" y2=\"386\" stroke=\"#999\" stroke-width=\"1\"/>\n  <line x1=\"736\" y1=\"452\" x2=\"908\" y2=\"452\" stroke=\"#555\" stroke-width=\"1.2\"/>\n  <line x1=\"736\" y1=\"426\" x2=\"908\" y2=\"426\" stroke=\"#C00000\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <rect x=\"744\" y=\"390\" width=\"9\" height=\"62\" fill=\"#9C3838\"/>\n  <rect x=\"759\" y=\"398\" width=\"9\" height=\"54\" fill=\"#9C3838\"/>\n  <rect x=\"774\" y=\"406\" width=\"9\" height=\"46\" fill=\"#9C3838\"/>\n  <rect x=\"789\" y=\"414\" width=\"9\" height=\"38\" fill=\"#9C3838\"/>\n  <rect x=\"804\" y=\"422\" width=\"9\" height=\"30\" fill=\"#9C3838\"/>\n  <rect x=\"819\" y=\"430\" width=\"9\" height=\"22\" fill=\"#E8A0A0\"/>\n  <rect x=\"834\" y=\"436\" width=\"9\" height=\"16\" fill=\"#E8A0A0\"/>\n  <rect x=\"849\" y=\"396\" width=\"9\" height=\"56\" fill=\"#9C3838\"/>\n  <rect x=\"864\" y=\"438\" width=\"9\" height=\"14\" fill=\"#E8A0A0\"/>\n  <rect x=\"879\" y=\"442\" width=\"9\" height=\"10\" fill=\"#E8A0A0\"/>\n  <text x=\"853\" y=\"470\" font-size=\"9\" fill=\"#9C3838\" font-weight=\"700\" text-anchor=\"middle\">k=L</text>\n  <text x=\"732\" y=\"490\" font-size=\"10.5\" fill=\"#333\">Decaimiento gradual CON</text>\n  <text x=\"732\" y=\"504\" font-size=\"10.5\" fill=\"#333\">picos cada L lags.</text>\n  <text x=\"732\" y=\"524\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">⇒ TENDENCIA + ESTAC.</text>\n  <text x=\"732\" y=\"546\" font-size=\"10.2\" fill=\"#333\">Es lo más común en series</text>\n  <text x=\"732\" y=\"559\" font-size=\"10.2\" fill=\"#333\">industriales reales.</text>\n  <text x=\"732\" y=\"580\" font-size=\"10.2\" font-weight=\"700\" fill=\"#8A5A16\">Método: WINTER o descomposición</text>\n\n  <!-- ===== BANDA DE SIGNIFICANCIA ===== -->\n  <rect x=\"40\" y=\"626\" width=\"450\" height=\"176\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"648\" font-size=\"13.5\" font-weight=\"700\" fill=\"#9C3838\">¿Cuándo un rₖ es SIGNIFICATIVO?</text>\n  <text x=\"56\" y=\"668\" font-size=\"11\" fill=\"#333\">Un rₖ nunca da exactamente cero por azar. Se traza una banda:</text>\n  <text x=\"180\" y=\"700\" font-size=\"18\" font-weight=\"700\" fill=\"#C00000\" font-family=\"Cambria Math, Georgia, serif\">± 2 / √n</text>\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"712\" width=\"418\" height=\"18\" fill=\"#9C3838\"/>\n    <text x=\"80\" y=\"725\" fill=\"#fff\" font-weight=\"700\">n = 24</text><text x=\"164\" y=\"725\" fill=\"#fff\" font-weight=\"700\">n = 36</text><text x=\"248\" y=\"725\" fill=\"#fff\" font-weight=\"700\">n = 48</text><text x=\"332\" y=\"725\" fill=\"#fff\" font-weight=\"700\">n = 60</text><text x=\"410\" y=\"725\" fill=\"#fff\" font-weight=\"700\">n = 100</text>\n    <text x=\"80\" y=\"744\" fill=\"#333\">±0,41</text><text x=\"164\" y=\"744\" fill=\"#333\">±0,33</text><text x=\"248\" y=\"744\" fill=\"#333\">±0,29</text><text x=\"332\" y=\"744\" fill=\"#333\">±0,26</text><text x=\"410\" y=\"744\" fill=\"#333\">±0,20</text>\n  </g>\n  <text x=\"56\" y=\"768\" font-size=\"11\" fill=\"#333\">Barras <tspan font-weight=\"700\">FUERA</tspan> de la banda → patrón real · <tspan font-weight=\"700\">DENTRO</tspan> → ruido</text>\n  <text x=\"56\" y=\"790\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">En Minitab (software de la cátedra) la banda aparece como líneas punteadas.</text>\n\n  <!-- ===== EJEMPLO DE LECTURA ===== -->\n  <rect x=\"504\" y=\"626\" width=\"436\" height=\"176\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"520\" y=\"648\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">Ejemplo de lectura completa (n = 48)</text>\n  <text x=\"520\" y=\"668\" font-size=\"10.8\" fill=\"#333\">Banda: ±2/√48 ≈ ±0,29</text>\n  <text x=\"520\" y=\"685\" font-size=\"10.8\" fill=\"#333\">r₁=0,85 · r₂=0,72 · r₃=0,61 · r₄=0,50 … r₁₁=0,15 · <tspan font-weight=\"700\" fill=\"#C00000\">r₁₂=0,68</tspan> · r₁₃=0,55</text>\n  <text x=\"520\" y=\"706\" font-size=\"10.8\" fill=\"#333\">① Decaen gradualmente → <tspan font-weight=\"700\">tendencia</tspan></text>\n  <text x=\"520\" y=\"722\" font-size=\"10.8\" fill=\"#333\">② Repunte en r₁₂ que rompe la caída → <tspan font-weight=\"700\">estacionalidad anual</tspan></text>\n  <text x=\"520\" y=\"738\" font-size=\"10.8\" fill=\"#333\">③ Ambos &gt; 0,29 → significativos</text>\n  <rect x=\"520\" y=\"746\" width=\"404\" height=\"46\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"530\" y=\"762\" font-size=\"9.8\" fill=\"#333\" font-style=\"italic\">“La serie presenta tendencia (autocorrelaciones significativas que decaen</text>\n  <text x=\"530\" y=\"774\" font-size=\"9.8\" fill=\"#333\" font-style=\"italic\">gradualmente) y estacionalidad de período 12 (pico significativo en el lag 12).</text>\n  <text x=\"530\" y=\"786\" font-size=\"9.8\" fill=\"#333\" font-style=\"italic\">No es estacionaria. Corresponde aplicar Winter o descomposición multiplicativa.”</text>\n\n  <!-- ===== TRUCO DE LOS ERRORES ===== -->\n  <line x1=\"490\" y1=\"806\" x2=\"490\" y2=\"822\" stroke=\"#1F4E79\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n  <rect x=\"40\" y=\"826\" width=\"900\" height=\"86\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"848\" font-size=\"13.5\" font-weight=\"700\" fill=\"#5B3E8E\">★ TRUCO AVANZADO: el correlograma DE LOS ERRORES — el mejor test de calidad de un modelo</text>\n  <text x=\"56\" y=\"870\" font-size=\"11.5\" fill=\"#333\">Una vez hecho el pronóstico, calculá la autocorrelación de los errores (e = Y − Ŷ):</text>\n  <text x=\"56\" y=\"890\" font-size=\"11.5\" fill=\"#333\">· Si los errores <tspan font-weight=\"700\" fill=\"#C00000\">TODAVÍA tienen autocorrelación</tspan> → el modelo dejó un patrón sin capturar → hay que mejorarlo</text>\n  <text x=\"56\" y=\"906\" font-size=\"11.5\" fill=\"#333\">· Si los errores son <tspan font-weight=\"700\" fill=\"#1E6B33\">ruido puro</tspan> (todo dentro de la banda) → se exprimió toda la información disponible ✔</text>\n\n  <!-- PIE EJERCICIO -->\n  <rect x=\"40\" y=\"922\" width=\"900\" height=\"102\" rx=\"6\" fill=\"#FAFAFA\" stroke=\"#CCC\"/>\n  <text x=\"56\" y=\"942\" font-size=\"11\" font-weight=\"700\" fill=\"#555\">EJERCICIOS:</text>\n  <text x=\"56\" y=\"960\" font-size=\"10.8\" fill=\"#555\">1) Trimestral, n=32: r₁=0,22 r₂=0,18 r₃=0,25 <tspan font-weight=\"700\">r₄=0,79</tspan> r₅=0,20 r₆=0,15 r₇=0,21 <tspan font-weight=\"700\">r₈=0,64</tspan> → a) banda  b) ¿cuáles significativas?  c) diagnóstico + método</text>\n  <text x=\"56\" y=\"978\" font-size=\"10.8\" fill=\"#555\">2) Mensual, n=60: r₁=0,91 r₂=0,86 r₃=0,80 r₄=0,74 r₅=0,69 r₆=0,63 (bajan parejo) → a) ¿qué patrón?  b) ¿estacionaria? ¿cómo la volverías estacionaria?</text>\n  <text x=\"56\" y=\"996\" font-size=\"10.8\" fill=\"#555\">3) Conceptual: pronosticaste con suavizado simple y el correlograma de los ERRORES tiene pico en r₁₂. ¿Qué significa? ¿Qué harías?</text>\n  <text x=\"56\" y=\"1015\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">Redactar la (1c) con el molde: diagnóstico + evidencia + método + justificación.</text>\n</svg>"},{"type":"svg","file":"u2/img/ArbolDecisorio_MetodosPronostico.svg","caption":"Árbol decisorio de métodos de pronóstico","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 1360\" width=\"1000\" height=\"1360\" font-family=\"Segoe UI, Calibri, Helvetica, Arial, sans-serif\">\n  <defs>\n    <marker id=\"a1\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#1F4E79\"/></marker>\n    <marker id=\"a2\" markerWidth=\"9\" markerHeight=\"7\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L9,3.5 L0,7 Z\" fill=\"#888\"/></marker>\n  </defs>\n  <rect width=\"1000\" height=\"1360\" fill=\"#FFFFFF\"/>\n\n  <!-- TITULO -->\n  <text x=\"40\" y=\"34\" font-size=\"22\" font-weight=\"700\" fill=\"#1F4E79\">ÁRBOL DECISORIO · ¿Qué método de pronóstico uso?</text>\n  <text x=\"40\" y=\"55\" font-size=\"12.5\" fill=\"#666\">Lámina complementaria Clase 3.a — U2 · La respuesta a “justifique la metodología aplicada”</text>\n\n  <rect x=\"40\" y=\"68\" width=\"920\" height=\"34\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"90\" font-size=\"12\" font-weight=\"700\" fill=\"#8A5A16\">REGLA MADRE: graficar la serie SIEMPRE antes de decidir. Con pocos datos, graficar es obligatorio. El gráfico manda sobre cualquier fórmula.</text>\n\n  <!-- ===== NIVEL 0 ===== -->\n  <rect x=\"380\" y=\"116\" width=\"240\" height=\"42\" rx=\"21\" fill=\"#1F4E79\"/>\n  <text x=\"500\" y=\"142\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Necesito pronosticar</text>\n\n  <line x1=\"500\" y1=\"158\" x2=\"500\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"770\" y2=\"176\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"230\" y1=\"176\" x2=\"230\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"770\" y1=\"176\" x2=\"770\" y2=\"196\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- PREGUNTA 1 -->\n  <text x=\"500\" y=\"170\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1F4E79\" text-anchor=\"middle\">① ¿Tengo datos históricos suficientes y representativos?</text>\n\n  <!-- RAMA NO: CUALITATIVOS -->\n  <rect x=\"700\" y=\"200\" width=\"260\" height=\"152\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"1.5\"/>\n  <text x=\"716\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5B3E8E\">NO → MÉTODOS CUALITATIVOS</text>\n  <text x=\"716\" y=\"240\" font-size=\"10.5\" fill=\"#666\" font-style=\"italic\">Se basan en juicio e intuición, no en datos</text>\n  <text x=\"716\" y=\"260\" font-size=\"10.8\" fill=\"#333\">· Delphi (panel de expertos anónimo)</text>\n  <text x=\"716\" y=\"276\" font-size=\"10.8\" fill=\"#333\">· Investigación de mercado / encuestas</text>\n  <text x=\"716\" y=\"292\" font-size=\"10.8\" fill=\"#333\">· Analogía histórica (producto similar)</text>\n  <text x=\"716\" y=\"308\" font-size=\"10.8\" fill=\"#333\">· Consenso de comité / fuerza de ventas</text>\n  <text x=\"716\" y=\"330\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">Cuándo: producto nuevo, sin historia,</text>\n  <text x=\"716\" y=\"345\" font-size=\"10.5\" font-weight=\"700\" fill=\"#5B3E8E\">o largo plazo (&gt; 2 años)</text>\n\n  <!-- RAMA SI: CUANTITATIVOS -->\n  <rect x=\"60\" y=\"200\" width=\"580\" height=\"60\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"222\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SÍ → MÉTODOS CUANTITATIVOS</text>\n  <text x=\"76\" y=\"242\" font-size=\"11\" fill=\"#333\">② ¿Explico la serie con SU PROPIO pasado, o con OTRAS variables?</text>\n  <text x=\"76\" y=\"256\" font-size=\"10\" fill=\"#888\" font-style=\"italic\">(en la práctica se combinan: lo cuantitativo se ajusta con juicio experto)</text>\n\n  <line x1=\"200\" y1=\"260\" x2=\"200\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"500\" y1=\"260\" x2=\"500\" y2=\"284\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- CAUSALES -->\n  <rect x=\"360\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"376\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#9C3838\">CAUSALES / EXPLICATIVOS</text>\n  <text x=\"376\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Las ventas dependen de X” (precio,</text>\n  <text x=\"376\" y=\"343\" font-size=\"10.8\" fill=\"#333\">publicidad, PBI, temperatura…)</text>\n  <text x=\"376\" y=\"363\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión simple (1 variable X)</text>\n  <text x=\"376\" y=\"379\" font-size=\"11\" font-weight=\"700\" fill=\"#C00000\">· Regresión múltiple (varias X)</text>\n  <text x=\"376\" y=\"396\" font-size=\"10.5\" fill=\"#666\">· Modelos econométricos · indicadores</text>\n\n  <!-- SERIES DE TIEMPO -->\n  <rect x=\"60\" y=\"288\" width=\"280\" height=\"120\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#1F4E79\" stroke-width=\"1.5\"/>\n  <text x=\"76\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1F4E79\">SERIES DE TIEMPO</text>\n  <text x=\"76\" y=\"328\" font-size=\"10.8\" fill=\"#333\">“Proyecto el patrón que la serie</text>\n  <text x=\"76\" y=\"343\" font-size=\"10.8\" fill=\"#333\">viene mostrando en el tiempo”</text>\n  <text x=\"76\" y=\"366\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">③ ¿QUÉ PATRÓN tiene la serie?</text>\n  <text x=\"76\" y=\"384\" font-size=\"10.5\" fill=\"#666\">→ mirar el gráfico y el correlograma</text>\n  <text x=\"76\" y=\"399\" font-size=\"10.5\" fill=\"#666\">→ bajar a los 4 casos de abajo ↓</text>\n\n  <line x1=\"200\" y1=\"408\" x2=\"200\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"880\" y2=\"430\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <line x1=\"120\" y1=\"430\" x2=\"120\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"373\" y1=\"430\" x2=\"373\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"627\" y1=\"430\" x2=\"627\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n  <line x1=\"880\" y1=\"430\" x2=\"880\" y2=\"452\" stroke=\"#1F4E79\" stroke-width=\"2\" marker-end=\"url(#a1)\"/>\n\n  <!-- ===== CASO A: ESTACIONARIA ===== -->\n  <rect x=\"40\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#F1F7F2\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n  <text x=\"54\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1E6B33\">A · ESTACIONARIA</text>\n  <text x=\"54\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">promedio constante, sin rumbo</text>\n  <line x1=\"58\" y1=\"536\" x2=\"58\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"536\" x2=\"248\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"58\" y1=\"520\" x2=\"248\" y2=\"520\" stroke=\"#1E6B33\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <polyline points=\"64,526 88,512 112,528 136,514 160,530 184,512 208,524 236,516\" fill=\"none\" stroke=\"#1E6B33\" stroke-width=\"2\"/>\n\n  <text x=\"54\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1E6B33\">MÉTODOS:</text>\n  <text x=\"54\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Promedio simple (todo el historial)</text>\n  <text x=\"54\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil de orden n</text>\n  <text x=\"54\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Suavizado exponencial simple (SES)</tspan></text>\n  <text x=\"54\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Métodos ingenuos: Ŷₜ₊₁ = Yₜ</text>\n  <text x=\"54\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins (ARIMA)</text>\n\n  <rect x=\"52\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#BFDCC4\"/>\n  <text x=\"62\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1E6B33\">Elegir n / α:</text>\n  <text x=\"62\" y=\"683\" font-size=\"9.8\" fill=\"#333\">n grande o α chico → más suave</text>\n  <text x=\"62\" y=\"697\" font-size=\"9.8\" fill=\"#333\">n chico o α grande → más reactivo</text>\n\n  <text x=\"54\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"54\" y=\"744\" font-size=\"10\" fill=\"#333\">· Panadería de barrio estable</text>\n  <text x=\"54\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto maduro sin cambios</text>\n  <text x=\"54\" y=\"772\" font-size=\"10\" fill=\"#333\">· Repuestos de demanda pareja</text>\n\n  <!-- ===== CASO B: TENDENCIA ===== -->\n  <rect x=\"274\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"288\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">B · TENDENCIA</text>\n  <text x=\"288\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">sube o baja sostenidamente</text>\n  <line x1=\"292\" y1=\"536\" x2=\"292\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"292\" y1=\"536\" x2=\"482\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <polyline points=\"298,530 326,522 354,514 382,506 410,514 438,500 466,492\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n\n  <text x=\"288\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#1F4E79\">MÉTODOS:</text>\n  <text x=\"288\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Holt</tspan> (suav. exp. 2 parámetros α, β)</text>\n  <text x=\"288\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Brown (suav. exp. doble, 1 parám.)</text>\n  <text x=\"288\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Promedio móvil doble</text>\n  <text x=\"288\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión simple contra el tiempo</text>\n  <text x=\"288\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Gompertz, curvas de crecimiento</text>\n\n  <rect x=\"286\" y=\"650\" width=\"198\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#B7D0E5\"/>\n  <text x=\"296\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#1F4E79\">Holt vs. Brown:</text>\n  <text x=\"296\" y=\"683\" font-size=\"9.8\" fill=\"#333\">Brown usa un solo α → tendencia</text>\n  <text x=\"296\" y=\"697\" font-size=\"9.8\" fill=\"#333\">sensible al ruido. Holt separa β → mejor.</text>\n\n  <text x=\"288\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"288\" y=\"744\" font-size=\"10\" fill=\"#333\">· Suscripciones de una app en alza</text>\n  <text x=\"288\" y=\"758\" font-size=\"10\" fill=\"#333\">· Producto en etapa de crecimiento</text>\n  <text x=\"288\" y=\"772\" font-size=\"10\" fill=\"#333\">· Serie inflacionada año a año</text>\n\n  <!-- ===== CASO C: ESTACIONALIDAD ===== -->\n  <rect x=\"508\" y=\"456\" width=\"222\" height=\"330\" rx=\"8\" fill=\"#FBF6EE\" stroke=\"#8A5A16\" stroke-width=\"2\"/>\n  <text x=\"522\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#8A5A16\">C · ESTACIONALIDAD</text>\n  <text x=\"522\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">patrón fijo que se repite cada año</text>\n  <line x1=\"526\" y1=\"536\" x2=\"526\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"526\" y1=\"536\" x2=\"716\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 532 528 L 548 508 L 564 528 L 580 530 L 596 508 L 612 528 L 628 530 L 644 506 L 660 528 L 676 530 L 700 508\" fill=\"none\" stroke=\"#B5651D\" stroke-width=\"2\"/>\n\n  <text x=\"522\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#8A5A16\">MÉTODOS:</text>\n  <text x=\"522\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Winter</tspan> (suav. exp. 3 parám. α, β, γ)</text>\n  <text x=\"522\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· <tspan font-weight=\"700\">Descomposición clásica</tspan> (multiplicativa)</text>\n  <text x=\"522\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Desestacionalizar → pronosticar →</text>\n  <text x=\"532\" y=\"622\" font-size=\"10.8\" fill=\"#333\">re-estacionalizar</text>\n  <text x=\"522\" y=\"638\" font-size=\"10.5\" fill=\"#666\">· Regresión múltiple con dummies · Census II</text>\n\n  <rect x=\"520\" y=\"648\" width=\"198\" height=\"62\" rx=\"5\" fill=\"#fff\" stroke=\"#E3D2B5\"/>\n  <text x=\"530\" y=\"666\" font-size=\"10\" font-weight=\"700\" fill=\"#8A5A16\">Ojo con L y la cantidad de datos:</text>\n  <text x=\"530\" y=\"681\" font-size=\"9.8\" fill=\"#333\">L=4 (trim.) · L=12 (mens.) · L=7 (diario)</text>\n  <text x=\"530\" y=\"695\" font-size=\"9.8\" fill=\"#333\">Winter necesita ≥ 2 ciclos completos</text>\n\n  <text x=\"522\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"522\" y=\"744\" font-size=\"10\" fill=\"#333\">· Heladería / aires acondicionados</text>\n  <text x=\"522\" y=\"758\" font-size=\"10\" fill=\"#333\">· Ventas de diciembre, útiles escolares</text>\n  <text x=\"522\" y=\"772\" font-size=\"10\" fill=\"#333\">· Consumo eléctrico</text>\n\n  <!-- ===== CASO D: CICLO ===== -->\n  <rect x=\"742\" y=\"456\" width=\"218\" height=\"330\" rx=\"8\" fill=\"#F6F2FA\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n  <text x=\"756\" y=\"478\" font-size=\"13\" font-weight=\"700\" fill=\"#5B3E8E\">D · CICLO</text>\n  <text x=\"756\" y=\"494\" font-size=\"10\" fill=\"#666\" font-style=\"italic\">ondas plurianuales, período variable</text>\n  <line x1=\"760\" y1=\"536\" x2=\"760\" y2=\"504\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"760\" y1=\"536\" x2=\"946\" y2=\"536\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <path d=\"M 766 518 C 792 496, 812 496, 834 522 C 858 548, 882 546, 906 512 C 916 498, 926 494, 936 492\" fill=\"none\" stroke=\"#5B3E8E\" stroke-width=\"2\"/>\n\n  <text x=\"756\" y=\"558\" font-size=\"11\" font-weight=\"700\" fill=\"#5B3E8E\">MÉTODOS:</text>\n  <text x=\"756\" y=\"576\" font-size=\"10.8\" fill=\"#333\">· Descomposición clásica</text>\n  <text x=\"756\" y=\"592\" font-size=\"10.8\" fill=\"#333\">· Indicadores económicos (líderes)</text>\n  <text x=\"756\" y=\"608\" font-size=\"10.8\" fill=\"#333\">· Modelos econométricos</text>\n  <text x=\"756\" y=\"624\" font-size=\"10.8\" fill=\"#333\">· Regresión múltiple</text>\n  <text x=\"756\" y=\"640\" font-size=\"10.5\" fill=\"#666\">· Box-Jenkins</text>\n\n  <rect x=\"754\" y=\"650\" width=\"196\" height=\"60\" rx=\"5\" fill=\"#fff\" stroke=\"#D3C4E4\"/>\n  <text x=\"764\" y=\"668\" font-size=\"10\" font-weight=\"700\" fill=\"#C00000\">⚠ El más difícil de todos:</text>\n  <text x=\"764\" y=\"683\" font-size=\"9.8\" fill=\"#333\">no tiene período fijo → los métodos</text>\n  <text x=\"764\" y=\"697\" font-size=\"9.8\" fill=\"#333\">de suavizado NO capturan giros bruscos</text>\n\n  <text x=\"756\" y=\"728\" font-size=\"10.5\" font-weight=\"700\" fill=\"#8A5A16\">EJEMPLOS:</text>\n  <text x=\"756\" y=\"744\" font-size=\"10\" fill=\"#333\">· Construcción, acero, automotriz</text>\n  <text x=\"756\" y=\"758\" font-size=\"10\" fill=\"#333\">· Bienes durables y de capital</text>\n  <text x=\"756\" y=\"772\" font-size=\"10\" fill=\"#333\">· Cualquier serie ligada al PBI</text>\n\n  <!-- ===== CASO COMBINADO ===== -->\n  <rect x=\"40\" y=\"800\" width=\"920\" height=\"96\" rx=\"8\" fill=\"#FFF3E8\" stroke=\"#D9954A\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"822\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8A5A16\">★ EL CASO MÁS FRECUENTE EN EXAMEN: TENDENCIA **+** ESTACIONALIDAD (los patrones se combinan)</text>\n  <text x=\"56\" y=\"844\" font-size=\"11.5\" fill=\"#333\">Si la serie sube año a año Y además repite picos estacionales → <tspan font-weight=\"700\" fill=\"#C00000\">WINTER</tspan> (captura ambos) o <tspan font-weight=\"700\" fill=\"#C00000\">DESCOMPOSICIÓN</tspan> (los separa y proyecta por partes).</text>\n  <text x=\"56\" y=\"864\" font-size=\"11.5\" fill=\"#333\">Alternativa válida y muy defendible: <tspan font-weight=\"700\">desestacionalizar</tspan> la serie → aplicar Holt a la serie sin estacionalidad → <tspan font-weight=\"700\">re-estacionalizar</tspan> el pronóstico.</text>\n  <text x=\"56\" y=\"884\" font-size=\"11\" fill=\"#8A5A16\" font-style=\"italic\">Nunca usar suavizado simple ni promedio móvil acá: van siempre “atrás” de la serie y subestiman sistemáticamente (sesgo visible en el PME).</text>\n\n  <!-- ===== FACTORES ADICIONALES ===== -->\n  <rect x=\"40\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#F4F8FC\" stroke=\"#B7D0E5\" stroke-width=\"1.5\"/>\n  <text x=\"56\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#1F4E79\">④ Otros factores que inclinan la elección</text>\n\n  <text x=\"56\" y=\"954\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">HORIZONTE:</text>\n  <text x=\"66\" y=\"970\" font-size=\"10.5\" fill=\"#333\">· Corto plazo (días–meses) → suavizados, promedios</text>\n  <text x=\"66\" y=\"985\" font-size=\"10.5\" fill=\"#333\">· Mediano (meses–2 años) → regresión, descomposición</text>\n  <text x=\"66\" y=\"1000\" font-size=\"10.5\" fill=\"#333\">· Largo plazo (&gt;2 años) → cualitativos, econométricos</text>\n\n  <text x=\"56\" y=\"1022\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">CANTIDAD DE DATOS:</text>\n  <text x=\"66\" y=\"1038\" font-size=\"10.5\" fill=\"#333\">· Muy pocos → ingenuos o promedio simple (y graficar!)</text>\n  <text x=\"66\" y=\"1053\" font-size=\"10.5\" fill=\"#333\">· Winter/descomposición exigen ≥2 ciclos completos</text>\n\n  <text x=\"56\" y=\"1075\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">OTROS CRITERIOS (Hanke):</text>\n  <text x=\"66\" y=\"1091\" font-size=\"10.5\" fill=\"#333\">· Costo del método vs. beneficio del pronóstico</text>\n  <text x=\"66\" y=\"1106\" font-size=\"10.5\" fill=\"#333\">· Facilidad de comprensión para quien decide</text>\n  <text x=\"66\" y=\"1121\" font-size=\"10.5\" fill=\"#333\">· Precisión requerida y confiabilidad</text>\n\n  <!-- ===== VALIDACION ===== -->\n  <rect x=\"510\" y=\"908\" width=\"450\" height=\"222\" rx=\"8\" fill=\"#FDF2F2\" stroke=\"#C00000\" stroke-width=\"1.5\"/>\n  <text x=\"526\" y=\"930\" font-size=\"13\" font-weight=\"700\" fill=\"#9C3838\">⑤ Elegido el método… ¡hay que VALIDARLO!</text>\n  <text x=\"526\" y=\"952\" font-size=\"11\" fill=\"#333\">El árbol propone candidatos; la <tspan font-weight=\"700\">medida de error decide</tspan>.</text>\n\n  <text x=\"526\" y=\"976\" font-size=\"11\" font-weight=\"700\" fill=\"#333\">Procedimiento (Hanke cap. 5):</text>\n  <text x=\"536\" y=\"992\" font-size=\"10.5\" fill=\"#333\">① Partir los datos: inicialización + prueba</text>\n  <text x=\"536\" y=\"1007\" font-size=\"10.5\" fill=\"#333\">② Ajustar el método con la parte de inicialización</text>\n  <text x=\"536\" y=\"1022\" font-size=\"10.5\" fill=\"#333\">③ Pronosticar la parte de prueba y medir el error</text>\n  <text x=\"536\" y=\"1037\" font-size=\"10.5\" fill=\"#333\">④ Comparar contra un método alternativo</text>\n  <text x=\"536\" y=\"1052\" font-size=\"10.5\" fill=\"#333\">⑤ Decidir: usarlo, ajustarlo o cambiarlo</text>\n\n  <rect x=\"526\" y=\"1062\" width=\"418\" height=\"56\" rx=\"5\" fill=\"#fff\" stroke=\"#E5C2C2\"/>\n  <text x=\"536\" y=\"1080\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C00000\">Qué mirar en los errores:</text>\n  <text x=\"536\" y=\"1095\" font-size=\"10\" fill=\"#333\">MAD/MSE/MAPE bajos = buen ajuste · <tspan font-weight=\"700\">PME ≈ 0 = sin sesgo</tspan></text>\n  <text x=\"536\" y=\"1110\" font-size=\"10\" fill=\"#333\">Si el PME es grande y del mismo signo → el método pierde un patrón</text>\n\n  <!-- ===== EJEMPLOS RESUELTOS ===== -->\n  <rect x=\"40\" y=\"1142\" width=\"920\" height=\"196\" rx=\"8\" fill=\"#EAF6FB\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n  <text x=\"56\" y=\"1164\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1F4E79\">DIAGNÓSTICOS RESUELTOS — así se redacta la justificación en el examen</text>\n\n  <g font-size=\"10.5\">\n    <rect x=\"56\" y=\"1174\" width=\"888\" height=\"20\" fill=\"#1F4E79\"/>\n    <text x=\"66\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Serie</text>\n    <text x=\"330\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Diagnóstico</text>\n    <text x=\"600\" y=\"1189\" fill=\"#fff\" font-weight=\"700\">Método y justificación</text>\n\n    <rect x=\"56\" y=\"1194\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1210\" fill=\"#333\">Ventas parejas 900–1.100 kg hace 10 años</text>\n    <text x=\"330\" y=\"1210\" fill=\"#333\">estacionaria, solo irregularidad</text>\n    <text x=\"600\" y=\"1210\" fill=\"#1E6B33\" font-weight=\"700\">SES o promedio móvil: no hay patrón que proyectar</text>\n\n    <rect x=\"56\" y=\"1218\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1234\" fill=\"#333\">App: 1.000 → 2.290 creciendo parejo</text>\n    <text x=\"330\" y=\"1234\" fill=\"#333\">tendencia lineal, sin estacionalidad</text>\n    <text x=\"600\" y=\"1234\" fill=\"#1F4E79\" font-weight=\"700\">Holt o regresión vs. tiempo: capturan la pendiente</text>\n\n    <rect x=\"56\" y=\"1242\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1258\" fill=\"#333\">Heladería trimestral, picos en T1 y T4, subiendo</text>\n    <text x=\"330\" y=\"1258\" fill=\"#333\">tendencia + estacionalidad (L=4)</text>\n    <text x=\"600\" y=\"1258\" fill=\"#C00000\" font-weight=\"700\">WINTER o descomposición multiplicativa</text>\n\n    <rect x=\"56\" y=\"1266\" width=\"888\" height=\"24\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1282\" fill=\"#333\">Constructora: sube, se derrumba 3 años, se recupera</text>\n    <text x=\"330\" y=\"1282\" fill=\"#333\">ciclo dominante (+ tendencia)</text>\n    <text x=\"600\" y=\"1282\" fill=\"#5B3E8E\" font-weight=\"700\">Descomposición o indicadores económicos; no suavizado</text>\n\n    <rect x=\"56\" y=\"1290\" width=\"888\" height=\"24\" fill=\"#fff\"/>\n    <text x=\"66\" y=\"1306\" fill=\"#333\">Producto nuevo, sin historia</text>\n    <text x=\"330\" y=\"1306\" fill=\"#333\">sin datos utilizables</text>\n    <text x=\"600\" y=\"1306\" fill=\"#5B3E8E\" font-weight=\"700\">Cualitativo: Delphi, analogía histórica, investigación</text>\n\n    <rect x=\"56\" y=\"1314\" width=\"888\" height=\"22\" fill=\"#F2F6FA\"/>\n    <text x=\"66\" y=\"1329\" fill=\"#333\">Ventas explicadas por publicidad y precio</text>\n    <text x=\"330\" y=\"1329\" fill=\"#333\">relación causal con otras variables</text>\n    <text x=\"600\" y=\"1329\" fill=\"#9C3838\" font-weight=\"700\">Regresión múltiple (revisar colinealidad y residuos)</text>\n  </g>\n</svg>"},{"type":"paragraph","text":"**Lectura de la fórmula:**","html":"<strong>Lectura de la fórmula:</strong>"},{"type":"list","ordered":false,"items":["**Numerador:** para cada par de valores separados por k períodos, multiplico sus desvíos contra la media y sumo.","**Denominador:** suma de todos los desvíos al cuadrado → normaliza el resultado entre −1 y +1, como cualquier correlación."],"itemsHtml":["<strong>Numerador:</strong> para cada par de valores separados por k períodos, multiplico sus desvíos contra la media y sumo.","<strong>Denominador:</strong> suma de todos los desvíos al cuadrado → normaliza el resultado entre −1 y +1, como cualquier correlación."]},{"type":"callout","kind":"idea","text":"**Qué significa un rₖ alto:** que saber el valor de hace k períodos te dice mucho sobre el valor de hoy. **Hay memoria en la serie.**","html":"<strong>Qué significa un rₖ alto:</strong> que saber el valor de hace k períodos te dice mucho sobre el valor de hoy. <strong>Hay memoria en la serie.</strong>"},{"type":"heading","level":2,"text":"3. El correlograma","html":"3. El correlograma"},{"type":"paragraph","text":"Calcular un rₖ suelto sirve poco. Se calculan **muchos** (r₁, r₂, r₃… hasta r₁₂ o más) y se grafican como barras: eje horizontal = lag k, eje vertical = valor de rₖ.","html":"Calcular un rₖ suelto sirve poco. Se calculan <strong>muchos</strong> (r₁, r₂, r₃… hasta r₁₂ o más) y se grafican como barras: eje horizontal = lag k, eje vertical = valor de rₖ."},{"type":"paragraph","text":"Eso es el **correlograma** (o función de autocorrelación, FAC/ACF).","html":"Eso es el <strong>correlograma</strong> (o función de autocorrelación, FAC/ACF)."},{"type":"callout","kind":"idea","text":"**Clave del tema: cada patrón de serie deja una HUELLA DACTILAR distinta en el correlograma.**","html":"<strong>Clave del tema: cada patrón de serie deja una HUELLA DACTILAR distinta en el correlograma.</strong>"},{"type":"heading","level":2,"text":"4. Las 4 huellas ★ (esto es lo que se pregunta)","html":"4. Las 4 huellas ★ (esto es lo que se pregunta)"},{"type":"heading","level":3,"text":"Huella 1 — Serie ALEATORIA (estacionaria pura)","html":"Huella 1 — Serie ALEATORIA (estacionaria pura)"},{"type":"paragraph","text":"**Cómo se ve:** todas las barras cerca de cero, ninguna se destaca.\n**Por qué:** si no hay patrón, conocer el pasado no dice nada del presente.\n→ **Diagnóstico:** serie estacionaria. **Métodos:** promedio móvil, suavizado exponencial simple.","html":"<strong>Cómo se ve:</strong> todas las barras cerca de cero, ninguna se destaca.\n<strong>Por qué:</strong> si no hay patrón, conocer el pasado no dice nada del presente.\n→ <strong>Diagnóstico:</strong> serie estacionaria. <strong>Métodos:</strong> promedio móvil, suavizado exponencial simple."},{"type":"heading","level":3,"text":"Huella 2 — Serie con TENDENCIA","html":"Huella 2 — Serie con TENDENCIA"},{"type":"paragraph","text":"**Cómo se ve:** primeras barras **grandes y positivas**, que **caen gradualmente** hacia cero al crecer el lag.\n**Por qué:** si la serie viene subiendo, el mes pasado se parece mucho a este; el de hace un año, bastante menos, pero todavía algo.\n→ **Diagnóstico:** hay tendencia, la serie **NO es estacionaria**. **Métodos:** Holt, Brown, regresión — o **diferenciar** para volverla estacionaria.","html":"<strong>Cómo se ve:</strong> primeras barras <strong>grandes y positivas</strong>, que <strong>caen gradualmente</strong> hacia cero al crecer el lag.\n<strong>Por qué:</strong> si la serie viene subiendo, el mes pasado se parece mucho a este; el de hace un año, bastante menos, pero todavía algo.\n→ <strong>Diagnóstico:</strong> hay tendencia, la serie <strong>NO es estacionaria</strong>. <strong>Métodos:</strong> Holt, Brown, regresión — o <strong>diferenciar</strong> para volverla estacionaria."},{"type":"heading","level":3,"text":"Huella 3 — Serie con ESTACIONALIDAD","html":"Huella 3 — Serie con ESTACIONALIDAD"},{"type":"paragraph","text":"**Cómo se ve:** **pico aislado** justo en el lag del ciclo: **r₄** (trimestral) o **r₁₂** (mensual), a veces repitiendo en r₈, r₂₄… Los lags intermedios quedan chicos.\n→ **Diagnóstico:** estacionalidad de longitud L. **Métodos:** Winter, descomposición.","html":"<strong>Cómo se ve:</strong> <strong>pico aislado</strong> justo en el lag del ciclo: <strong>r₄</strong> (trimestral) o <strong>r₁₂</strong> (mensual), a veces repitiendo en r₈, r₂₄… Los lags intermedios quedan chicos.\n→ <strong>Diagnóstico:</strong> estacionalidad de longitud L. <strong>Métodos:</strong> Winter, descomposición."},{"type":"callout","kind":"idea","text":"**El criterio más útil del tema: el lag donde salta el pico TE DICE cuál es la longitud estacional.** Datos mensuales con pico en r₁₂ → estacionalidad anual. Pico en r₆ → semestral.","html":"<strong>El criterio más útil del tema: el lag donde salta el pico TE DICE cuál es la longitud estacional.</strong> Datos mensuales con pico en r₁₂ → estacionalidad anual. Pico en r₆ → semestral."},{"type":"heading","level":3,"text":"Huella 4 — COMBINACIÓN (el caso real más frecuente)","html":"Huella 4 — COMBINACIÓN (el caso real más frecuente)"},{"type":"paragraph","text":"**Cómo se ve:** barras que decaen lentamente (tendencia) **con picos sobresalientes cada L lags** (estacionalidad).\n→ **Métodos:** Winter o descomposición multiplicativa.","html":"<strong>Cómo se ve:</strong> barras que decaen lentamente (tendencia) <strong>con picos sobresalientes cada L lags</strong> (estacionalidad).\n→ <strong>Métodos:</strong> Winter o descomposición multiplicativa."},{"type":"heading","level":2,"text":"5. ¿Cuándo un rₖ es significativo?","html":"5. ¿Cuándo un rₖ es significativo?"},{"type":"paragraph","text":"Un rₖ nunca da exactamente cero por puro azar. Para distinguir patrón real de ruido se traza una **banda de significancia** alrededor del cero:","html":"Un rₖ nunca da exactamente cero por puro azar. Para distinguir patrón real de ruido se traza una <strong>banda de significancia</strong> alrededor del cero:"},{"type":"formula","tex":"\\pm \\frac{2}{\\sqrt{n}}","html":"<span class=\"eq-block\">± <span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">√<span class=\"rad\">n</span></span></span></span>"},{"type":"paragraph","text":"**Ejemplos:**","html":"<strong>Ejemplos:</strong>"},{"type":"table","headers":["n (datos)","Banda"],"rows":[["---","---"],["24","±0,41"],["36","±0,33"],["48","±0,29"],["60","±0,26"],["100","±0,20"]],"headersHtml":["n (datos)","Banda"],"rowsHtml":[["---","---"],["24","±0,41"],["36","±0,33"],["48","±0,29"],["60","±0,26"],["100","±0,20"]]},{"type":"list","ordered":false,"items":["Barras **fuera** de la banda → estadísticamente **significativas** (patrón real)","Barras **dentro** de la banda → se consideran **ruido**"],"itemsHtml":["Barras <strong>fuera</strong> de la banda → estadísticamente <strong>significativas</strong> (patrón real)","Barras <strong>dentro</strong> de la banda → se consideran <strong>ruido</strong>"]},{"type":"callout","kind":"idea","text":"En los correlogramas de **Minitab** (el software de la cátedra) estas bandas aparecen dibujadas como líneas punteadas. Interpretarlas es exactamente lo que pueden pedir.","html":"En los correlogramas de <strong>Minitab</strong> (el software de la cátedra) estas bandas aparecen dibujadas como líneas punteadas. Interpretarlas es exactamente lo que pueden pedir."},{"type":"heading","level":2,"text":"6. Ejemplo de lectura completa","html":"6. Ejemplo de lectura completa"},{"type":"paragraph","text":"**Datos:** correlograma de ventas mensuales, n = 48.","html":"<strong>Datos:</strong> correlograma de ventas mensuales, n = 48."},{"type":"list","ordered":false,"items":["Banda: ±2/√48 ≈ **±0,29**","r₁=0,85 · r₂=0,72 · r₃=0,61 · r₄=0,50 · … · r₁₁=0,15 · **r₁₂=0,68** · r₁₃=0,55"],"itemsHtml":["Banda: ±2/√48 ≈ <strong>±0,29</strong>","r₁=0,85 · r₂=0,72 · r₃=0,61 · r₄=0,50 · … · r₁₁=0,15 · <strong>r₁₂=0,68</strong> · r₁₃=0,55"]},{"type":"svg","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><line x1=\"28\" y1=\"69.91304347826087\" x2=\"272\" y2=\"69.91304347826087\" stroke=\"#d0d5db\" stroke-width=\"1.2\"/><line x1=\"28\" y1=\"54.34968839575791\" x2=\"272\" y2=\"54.34968839575791\" stroke=\"#a67c00\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"28\" y1=\"85.47639856076383\" x2=\"272\" y2=\"85.47639856076383\" stroke=\"#a67c00\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"140.0\" y=\"12\" font-size=\"8\" fill=\"#a67c00\" text-anchor=\"middle\">banda ±2/√n</text><rect x=\"34.91428571428571\" y=\"24.086956521739125\" width=\"19.014285714285716\" height=\"45.82608695652175\" fill=\"#1f4e79\"/><text x=\"44.42142857142857\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">1</text><rect x=\"69.48571428571428\" y=\"31.095652173913038\" width=\"19.014285714285716\" height=\"38.81739130434784\" fill=\"#1f4e79\"/><text x=\"78.99285714285713\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">2</text><rect x=\"104.05714285714285\" y=\"37.02608695652174\" width=\"19.014285714285716\" height=\"32.88695652173914\" fill=\"#1f4e79\"/><text x=\"113.5642857142857\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">3</text><rect x=\"138.62857142857143\" y=\"42.95652173913043\" width=\"19.014285714285716\" height=\"26.956521739130444\" fill=\"#1f4e79\"/><text x=\"148.1357142857143\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">4</text><rect x=\"173.2\" y=\"61.826086956521735\" width=\"19.014285714285716\" height=\"8.08695652173914\" fill=\"#1f4e79\"/><text x=\"182.70714285714286\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">11</text><rect x=\"207.77142857142854\" y=\"33.25217391304347\" width=\"19.014285714285716\" height=\"36.6608695652174\" fill=\"#c45c26\"/><text x=\"217.2785714285714\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">12</text><rect x=\"242.34285714285713\" y=\"40.260869565217384\" width=\"19.014285714285716\" height=\"29.65217391304349\" fill=\"#1f4e79\"/><text x=\"251.85\" y=\"132\" font-size=\"8\" fill=\"#5c6670\" text-anchor=\"middle\">13</text></svg>","caption":"Correlograma del ejemplo (n=48): decaimiento de r₁ a r₄, y un pico en r₁₂ que rompe la caída. Solo se grafican los lags que da el apunte (no se inventan r₅–r₁₀). La banda punteada es ±2/√48 ≈ ±0,29."},{"type":"paragraph","text":"**Lectura:**","html":"<strong>Lectura:</strong>"},{"type":"list","ordered":true,"items":["Las primeras autocorrelaciones son altas y **decaen gradualmente** → tendencia","Hay un **repunte marcado en r₁₂** que rompe la caída → estacionalidad anual","Ambos superan la banda de ±0,29 → son significativos"],"itemsHtml":["Las primeras autocorrelaciones son altas y <strong>decaen gradualmente</strong> → tendencia","Hay un <strong>repunte marcado en r₁₂</strong> que rompe la caída → estacionalidad anual","Ambos superan la banda de ±0,29 → son significativos"]},{"type":"paragraph","text":"**Redacción como respuesta de examen:**","html":"<strong>Redacción como respuesta de examen:</strong>"},{"type":"callout","kind":"idea","text":"*\"La serie presenta tendencia (autocorrelaciones significativas que decaen gradualmente) y estacionalidad de período 12 (pico significativo en el desfasamiento 12). No es estacionaria. Corresponde aplicar Winter o descomposición multiplicativa.\"*","html":"<em>\"La serie presenta tendencia (autocorrelaciones significativas que decaen gradualmente) y estacionalidad de período 12 (pico significativo en el desfasamiento 12). No es estacionaria. Corresponde aplicar Winter o descomposición multiplicativa.\"</em>"},{"type":"paragraph","text":"**Estructura de esa respuesta:** diagnóstico + evidencia + método + justificación. Ese es el molde.","html":"<strong>Estructura de esa respuesta:</strong> diagnóstico + evidencia + método + justificación. Ese es el molde."},{"type":"heading","level":2,"text":"7. Por qué importa más de lo que parece","html":"7. Por qué importa más de lo que parece"},{"type":"list","ordered":true,"items":["**Es evidencia objetiva.** *\"La serie tiene estacionalidad\"* es una opinión; *\"r₁₂ = 0,68 supera la banda de significancia\"* es un dato.","**Detecta lo que el ojo no ve.** En series ruidosas, un patrón estacional puede estar escondido y el correlograma lo revela.","**★ Sirve para evaluar tu propio modelo.** Truco avanzado que suma mucho: una vez hecho el pronóstico, se calcula el correlograma **de los errores**:","Si los errores **todavía tienen autocorrelación** → el modelo dejó un patrón sin capturar → hay que mejorarlo.","Si los errores son **ruido puro** (todas las barras dentro de la banda) → se exprimió toda la información disponible."],"itemsHtml":["<strong>Es evidencia objetiva.</strong> <em>\"La serie tiene estacionalidad\"</em> es una opinión; <em>\"r₁₂ = 0,68 supera la banda de significancia\"</em> es un dato.","<strong>Detecta lo que el ojo no ve.</strong> En series ruidosas, un patrón estacional puede estar escondido y el correlograma lo revela.","<strong>★ Sirve para evaluar tu propio modelo.</strong> Truco avanzado que suma mucho: una vez hecho el pronóstico, se calcula el correlograma <strong>de los errores</strong>:","Si los errores <strong>todavía tienen autocorrelación</strong> → el modelo dejó un patrón sin capturar → hay que mejorarlo.","Si los errores son <strong>ruido puro</strong> (todas las barras dentro de la banda) → se exprimió toda la información disponible."]},{"type":"paragraph","text":"Es el mejor test de calidad de un modelo de pronóstico.","html":"Es el mejor test de calidad de un modelo de pronóstico."},{"type":"heading","level":2,"text":"8. Chequeos de sensatez","html":"8. Chequeos de sensatez"},{"type":"list","ordered":false,"items":["rₖ siempre entre −1 y +1","r₀ = 1 siempre (la serie contra sí misma sin desfasar), por eso no se grafica","A mayor k, menos pares disponibles para calcular → los rₖ de lags muy altos son menos confiables","Si TODAS las barras son enormes y no decaen nunca, revisá los datos: puede haber un error de carga"],"itemsHtml":["rₖ siempre entre −1 y +1","r₀ = 1 siempre (la serie contra sí misma sin desfasar), por eso no se grafica","A mayor k, menos pares disponibles para calcular → los rₖ de lags muy altos son menos confiables","Si TODAS las barras son enormes y no decaen nunca, revisá los datos: puede haber un error de carga"]},{"type":"heading","level":2,"text":"9. Mini-resumen para tu doc","html":"9. Mini-resumen para tu doc"},{"type":"callout","kind":"idea","text":"**Clase 3.b.** Autocorrelación (rₖ) = correlación de la serie consigo misma desfasada k períodos; mide la \"memoria\" de la serie. El correlograma grafica r₁, r₂, r₃… y cada patrón deja una huella distinta: aleatoria → todas cerca de cero; tendencia → altas al principio y decaen gradualmente; estacionalidad → pico aislado en el lag L (4 trimestral, 12 mensual); combinada → decaimiento con picos periódicos. Banda de significancia ±2/√n: fuera de la banda = patrón real. Es el diagnóstico objetivo que respalda la elección del método, y aplicado a los errores permite verificar si el modelo dejó patrones sin capturar.","html":"<strong>Clase 3.b.</strong> Autocorrelación (rₖ) = correlación de la serie consigo misma desfasada k períodos; mide la \"memoria\" de la serie. El correlograma grafica r₁, r₂, r₃… y cada patrón deja una huella distinta: aleatoria → todas cerca de cero; tendencia → altas al principio y decaen gradualmente; estacionalidad → pico aislado en el lag L (4 trimestral, 12 mensual); combinada → decaimiento con picos periódicos. Banda de significancia ±2/√n: fuera de la banda = patrón real. Es el diagnóstico objetivo que respalda la elección del método, y aplicado a los errores permite verificar si el modelo dejó patrones sin capturar."},{"type":"ejercicio","title":"10. EJERCICIO — Clase 3.b","estado":"para resolver","blocks":[{"type":"paragraph","text":"**1)** Serie **trimestral** de **32 datos**. Correlograma:\nr₁=0,22 · r₂=0,18 · r₃=0,25 · **r₄=0,79** · r₅=0,20 · r₆=0,15 · r₇=0,21 · **r₈=0,64**","html":"<strong>1)</strong> Serie <strong>trimestral</strong> de <strong>32 datos</strong>. Correlograma:\nr₁=0,22 · r₂=0,18 · r₃=0,25 · <strong>r₄=0,79</strong> · r₅=0,20 · r₆=0,15 · r₇=0,21 · <strong>r₈=0,64</strong>"},{"type":"paragraph","text":"a) Calculá la banda de significancia.\nb) ¿Qué barras son significativas?\nc) Diagnosticá el patrón y decí qué método aplicarías, **redactándolo como respuesta de examen**.","html":"a) Calculá la banda de significancia.\nb) ¿Qué barras son significativas?\nc) Diagnosticá el patrón y decí qué método aplicarías, <strong>redactándolo como respuesta de examen</strong>."},{"type":"paragraph","text":"**2)** Serie **mensual** de **60 datos**:\nr₁=0,91 · r₂=0,86 · r₃=0,80 · r₄=0,74 · r₅=0,69 · r₆=0,63 (siguen bajando parejo, sin repuntes)","html":"<strong>2)</strong> Serie <strong>mensual</strong> de <strong>60 datos</strong>:\nr₁=0,91 · r₂=0,86 · r₃=0,80 · r₄=0,74 · r₅=0,69 · r₆=0,63 (siguen bajando parejo, sin repuntes)"},{"type":"paragraph","text":"a) ¿Qué patrón es?\nb) ¿Es estacionaria? Si no, ¿cómo la volverías estacionaria?","html":"a) ¿Qué patrón es?\nb) ¿Es estacionaria? Si no, ¿cómo la volverías estacionaria?"},{"type":"paragraph","text":"**3)** *Conceptual:* hiciste un pronóstico con suavizado exponencial simple y el correlograma de los **errores** muestra un pico significativo en r₁₂. ¿Qué te está diciendo? ¿Qué harías?","html":"<strong>3)</strong> <em>Conceptual:</em> hiciste un pronóstico con suavizado exponencial simple y el correlograma de los <strong>errores</strong> muestra un pico significativo en r₁₂. ¿Qué te está diciendo? ¿Qué harías?"}],"nota":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","notaHtml":"Para resolver — en el material no figura la resolución. Cuando lo corriamos, la cargamos acá.","titleHtml":"10. EJERCICIO — Clase 3.b"},{"type":"heading","level":2,"text":"11. Ejercicios acumulados pendientes de corrección","html":"11. Ejercicios acumulados pendientes de corrección"},{"type":"list","ordered":true,"items":["**Clase 1.b** (ventas 120, 135, 105, 140, 100): a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110<X<145) · e) inverso 90% · f) ¿Z o t?","**Clase 2** (temperatura vs. bebidas): a) tabla y sumatorias · b) r · c) interpretación · d) ¿causalidad?","**Clase 3.a** (diagnóstico de 4 series): a) a d)","**Clase 3.b** (correlogramas): 1) a 3)"],"itemsHtml":["<strong>Clase 1.b</strong> (ventas 120, 135, 105, 140, 100): a) X̄ y s · b) P(X<150) · c) P(X>90) · d) P(110&lt;X&lt;145) · e) inverso 90% · f) ¿Z o t?","<strong>Clase 2</strong> (temperatura vs. bebidas): a) tabla y sumatorias · b) r · c) interpretación · d) ¿causalidad?","<strong>Clase 3.a</strong> (diagnóstico de 4 series): a) a d)","<strong>Clase 3.b</strong> (correlogramas): 1) a 3)"]},{"type":"paragraph","text":"**Material asociado:** `Clase03b_Autocorrelacion.svg` · `ArbolDecisorio_MetodosPronostico.svg`\n**Fuente:** Hanke, *Pronósticos en los Negocios*, cap. 4 — completo en Drive/Teoría/Libros.","html":"<strong>Material asociado:</strong> <code>Clase03b_Autocorrelacion.svg</code> · <code>ArbolDecisorio_MetodosPronostico.svg</code>\n<strong>Fuente:</strong> Hanke, <em>Pronósticos en los Negocios</em>, cap. 4 — completo en Drive/Teoría/Libros."},{"type":"paragraph","text":"**Próxima clase → Clase 4: Medidas de error del pronóstico** (MAD, MSE, MAPE, PME): cómo se mide si un pronóstico es bueno y cómo se comparan dos métodos entre sí. Cierra la Unidad 2.b y abre los métodos.","html":"<strong>Próxima clase → Clase 4: Medidas de error del pronóstico</strong> (MAD, MSE, MAPE, PME): cómo se mide si un pronóstico es bueno y cómo se comparan dos métodos entre sí. Cierra la Unidad 2.b y abre los métodos."}],"historias":[{"type":"concepto","k":"La idea","title":"El mismo diagnóstico, con números.","text":"En la 3.a diagnosticabas la serie a ojo. La autocorrelación es esa misma lectura, pero objetiva: evidencia de qué patrón tiene la serie y, por lo tanto, de qué método corresponde.","html":"En la 3.a diagnosticabas la serie a ojo. La autocorrelación es esa misma lectura, pero objetiva: evidencia de qué patrón tiene la serie y, por lo tanto, de qué método corresponde.","titleHtml":"El mismo diagnóstico, con números."},{"type":"concepto","k":"El giro","title":"La serie, correlacionada consigo misma.","text":"En la Clase 2 correlacionabas dos variables distintas. Acá se correlaciona la serie con su propio pasado, corrida k períodos. Ese corrimiento es el desfasamiento o lag (k).","ejemplo":"r₁ compara cada mes con el anterior. r₄, en datos trimestrales, cada trimestre con el mismo del año pasado. r₁₂, en mensuales, cada mes con el mismo mes del año anterior.","html":"En la Clase 2 correlacionabas dos variables distintas. Acá se correlaciona la serie con su propio pasado, corrida k períodos. Ese corrimiento es el desfasamiento o lag (k).","titleHtml":"La serie, correlacionada consigo misma."},{"type":"concepto","k":"La fórmula","title":"rₖ mide la «memoria» de la serie.","text":"El numerador suma, para cada par separado por k períodos, el producto de sus desvíos contra la media. El denominador normaliza entre −1 y +1.","formula":"r_k = \\frac{\\sum_{t=k+1}^{n}(Y_t - \\bar{Y})(Y_{t-k} - \\bar{Y})}{\\sum_{t=1}^{n}(Y_t - \\bar{Y})^2}","ejemplo":"Un rₖ alto significa que saber el valor de hace k períodos te dice mucho sobre el de hoy. Hay memoria en la serie.","formulaHtml":"<span class=\"eq-block\">r<sub>k</sub> = <span class=\"frac\"><span class=\"num\"><span class=\"op\">Σ<sub>t=k+1</sub><sup>n</sup></span
