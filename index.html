\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"85\" y=\"54\" font-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">Mₜ</text><text x=\"85\" y=\"70\" font-size=\"7.5\" fill=\"#b7c0c8\" text-anchor=\"middle\">MA(k)</text><path d=\"M112 58 H110\" stroke=\"#5a6570\" stroke-width=\"1.2\"/><rect x=\"112\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"137\" y=\"54\" font-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">M′ₜ</text><text x=\"137\" y=\"70\" font-size=\"7.5\" fill=\"#b7c0c8\" text-anchor=\"middle\">MA de M</text><path d=\"M164 58 H162\" stroke=\"#5a6570\" stroke-width=\"1.2\"/><rect x=\"164\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.4\"/><text x=\"189\" y=\"54\" font-size=\"11\" fill=\"#8cb4d6\" font-weight=\"700\" text-anchor=\"middle\">aₜ, bₜ</text><text x=\"189\" y=\"70\" font-size=\"7.5\" fill=\"#b7c0c8\" text-anchor=\"middle\">nivel y pendiente</text><path d=\"M216 58 H220\" stroke=\"#5a6570\" stroke-width=\"1.2\"/><rect x=\"222\" y=\"36\" width=\"50\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.4\"/><text x=\"247\" y=\"54\" font-size=\"11\" fill=\"#e25b16\" font-weight=\"700\" text-anchor=\"middle\">Ŷₜ₊ₚ</text><text x=\"247\" y=\"70\" font-size=\"7.5\" fill=\"#b7c0c8\" text-anchor=\"middle\">aₜ + bₜ p</text><text x=\"140\" y=\"100\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"middle\">aₜ = 2Mₜ − M′ₜ  bₜ = [2/(k−1)](Mₜ − M′ₜ)</text></svg>","chartLabel":"Y → M → M′ → a, b → Ŷₜ₊ₚ","formulaHtml":"<span class=\"eq-block\"><span class=\"hat\">Y</span><sub>t+p</sub> = a<sub>t</sub> + b<sub>t</sub> p</span>","html":"M es el móvil de Y; M′ es el móvil de los M. El nivel aₜ = 2Mₜ − M′ₜ y la pendiente bₜ = [2/(k−1)](Mₜ − M′ₜ). El pronóstico a p períodos es aₜ + bₜ p. En los resúmenes no hay una tabla numérica resuelta.","titleHtml":"Para tendencia lineal: dos promedios, después a y b."},{"type":"concepto","k":"Chase","title":"Ponderado: los pesos suman 1.","text":"Chase, Resumen V6: pesos 40-30-20-10 (el 40% al más reciente) sobre ventas 95, 105, 90 y 100. Ŷ del mes 5 = 97,5. Si ese mes cierra en 110, el del 6 queda 102,5. No está en el capítulo de Hanke.","formula":"0{,}40\\cdot 95 + 0{,}30\\cdot 105 + 0{,}20\\cdot 90 + 0{,}10\\cdot 100 = 97{,}5","svg":"<svg viewBox=\"0 0 280 140\" width=\"100%\" height=\"140\" aria-hidden=\"true\"><text x=\"8\" y=\"12\" font-size=\"9\" fill=\"#8cb4d6\" font-weight=\"700\">Ventas reales</text><text x=\"118\" y=\"12\" font-size=\"9\" fill=\"#e25b16\" font-weight=\"700\">Ŷ mes 5 = 97,5</text><line x1=\"32\" y1=\"84.1\" x2=\"268\" y2=\"84.1\" stroke=\"#5a6570\" stroke-width=\"0.6\"/><line x1=\"32\" y1=\"60.2\" x2=\"268\" y2=\"60.2\" stroke=\"#5a6570\" stroke-width=\"0.6\"/><line x1=\"32\" y1=\"36.3\" x2=\"268\" y2=\"36.3\" stroke=\"#5a6570\" stroke-width=\"0.6\"/><line x1=\"32\" y1=\"22\" x2=\"32\" y2=\"108\" stroke=\"#5a6570\" stroke-width=\"1\"/><line x1=\"32\" y1=\"108\" x2=\"268\" y2=\"108\" stroke=\"#5a6570\" stroke-width=\"1\"/><text x=\"26\" y=\"87.1\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"end\">90</text><text x=\"26\" y=\"63.2\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"end\">100</text><text x=\"26\" y=\"39.3\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"end\">110</text><text x=\"32.0\" y=\"122\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\">1</text><text x=\"79.2\" y=\"122\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\">2</text><text x=\"126.4\" y=\"122\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\">3</text><text x=\"173.6\" y=\"122\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\">4</text><text x=\"220.8\" y=\"122\" font-size=\"9\" fill=\"#b7c0c8\" text-anchor=\"middle\">5</text><polyline fill=\"none\" stroke=\"#8cb4d6\" stroke-width=\"1.8\" points=\"32.0,60.2 79.2,84.1 126.4,48.3 173.6,72.2\"/><circle cx=\"32.0\" cy=\"60.2\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"79.2\" cy=\"84.1\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"126.4\" cy=\"48.3\" r=\"3.2\" fill=\"#8cb4d6\"/><circle cx=\"173.6\" cy=\"72.2\" r=\"3.2\" fill=\"#8cb4d6\"/><line x1=\"173.6\" y1=\"72.2\" x2=\"220.8\" y2=\"66.2\" stroke=\"#e25b16\" stroke-width=\"1.8\" stroke-dasharray=\"4 3\"/><circle cx=\"220.8\" cy=\"66.2\" r=\"4\" fill=\"none\" stroke=\"#e25b16\" stroke-width=\"1.8\"/><text x=\"226.8\" y=\"69.2\" font-size=\"9\" fill=\"#e25b16\" font-weight=\"700\">97,5</text><text x=\"140\" y=\"134\" font-size=\"8\" fill=\"#b7c0c8\" text-anchor=\"middle\">Datos de Chase, Resumen V6</text></svg>","chartLabel":"Ventas de Chase y Ŷ₅ = 97,5","formulaHtml":"<span class=\"eq-block\">0,40· 95 + 0,30· 105 + 0,20· 90 + 0,10· 100 = 97,5</span>","html":"Chase, Resumen V6: pesos 40-30-20-10 (el 40% al más reciente) sobre ventas 95, 105, 90 y 100. Ŷ del mes 5 = 97,5. Si ese mes cierra en 110, el del 6 queda 102,5. No está en el capítulo de Hanke.","titleHtml":"Ponderado: los pesos suman 1."},{"type":"pregunta","k":"A ver…","title":"En el promedio móvil ponderado de Chase, los pesos…","options":["Tienen que ser todos iguales a 1/k","Pueden ser cualquiera, mientras sumen 1","Tienen que crecer siempre hacia el pasado"],"correct":1,"feedback":"Chase: se puede asignar cualquier importancia, incluso en otro orden o con algún peso en cero, pero la suma de las ponderaciones debe ser igual a uno.","titleHtml":"En el promedio móvil ponderado de Chase, los pesos…"},{"type":"concepto","k":"Cómo se evalúa","title":"Ajustá con una parte, medí el error en la otra.","text":"Hanke abre este capítulo con los cinco pasos de la Clase 4: elegir el método según el patrón, partir en inicio y prueba, ajustar, pronosticar la prueba y decidir. El error no se mide sobre los datos con los que ajustaste.","html":"Hanke abre este capítulo con los cinco pasos de la Clase 4: elegir el método según el patrón, partir en inicio y prueba, ajustar, pronosticar la prueba y decidir. El error no se mide sobre los datos con los que ajustaste.","titleHtml":"Ajustá con una parte, medí el error en la otra."},{"type":"cierre","k":"Para llevar","title":"Llevate esto de la Clase 5.","text":"Informales: Ŷ = Yₜ, o con tendencia, tasa o estación. Promedio simple si es estacionaria. Móvil MA(k): ventana, pesos iguales; k chico reacciona, k grande suaviza. Móvil doble si hay tendencia lineal. Ponderado (Chase): pesos que suman 1. Siguiente: suavizado exponencial simple.","html":"Informales: Ŷ = Yₜ, o con tendencia, tasa o estación. Promedio simple si es estacionaria. Móvil MA(k): ventana, pesos iguales; k chico reacciona, k grande suaviza. Móvil doble si hay tendencia lineal. Ponderado (Chase): pesos que suman 1. Siguiente: suavizado exponencial simple.","titleHtml":"Llevate esto de la Clase 5."}],"titleHtml":"Clase 5 · Métodos no formales y promedios","ledeHtml":"Los períodos recientes son, en estos métodos, los mejores pronosticadores del futuro. Arrancamos por los modelos informales y seguimos por promedio simple, móvil, móvil doble y —con Chase— el móvil ponderado. La suavización exponencial queda para la Clase 6."}}};
</script>
<script>
(function(){
  const KEY = "sdg.estudio";
  const CONTENT = window.SDG_CONTENT;
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
  }
  function units(){ return (CONTENT && CONTENT.index && CONTENT.index.units) || []; }
  function allClasses(){
    const out=[];
    units().forEach(u => (u.classes||[]).forEach(c => out.push(Object.assign({unitId:u.id, unitTitle:u.title, unitKind:u.kind}, c))));
    return out;
  }
  function classMeta(id){ return allClasses().find(c => c.id===id); }
  function classData(id){ return (CONTENT && CONTENT.classes && CONTENT.classes[id]) || null; }
  function unitById(id){ return units().find(u => u.id===id); }
  function isOpen(c){ return !!(c && !c.soon && classData(c.id)); }
  const PLAYABLE = allClasses().filter(isOpen);
  function firstPlayable(){ return PLAYABLE[0] ? PLAYABLE[0].id : null; }
  function isQuiz(c){ return !!(c && (c.type==="pregunta" || c.type==="quiz")); }
  function isClose(c){ return !!(c && (c.type==="cierre" || c.type==="close")); }
  function correctIdx(c){ return (c.correct!=null)?c.correct:c.a; }

  const AUDIO_KEY = "sdg.audio";
  function load(){
    const def={completed:[], answers:{}, pos:{}, lastClass:firstPlayable(), muted:true};
    try{ return Object.assign(def, JSON.parse(localStorage.getItem(KEY)||"null")); }
    catch(e){ return def; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function readAudioOn(){
    try { return localStorage.getItem(AUDIO_KEY) === "on"; }
    catch(e){ return false; }
  }
  function applyAudioPref(){
    state.muted = !readAudioOn();
  }
  let state = load();
  applyAudioPref();
  state.answers = state.answers || {};
  state.pos = state.pos || {};
  if(!state.lastClass || !PLAYABLE.some(c=>c.id===state.lastClass)) state.lastClass = firstPlayable();
  let view = "home";
  let st = {open:false, classId:state.lastClass||firstPlayable(), i:0};

  const $ = (s,r=document)=>r.querySelector(s);

  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800);
  }

  function progress(){
    const n=state.completed.filter(id=>PLAYABLE.some(c=>c.id===id)).length;
    const pct=Math.round(n/PLAYABLE.length*100);
    $("#progTxt").textContent=pct+"%";
    $("#progFill").style.width=pct+"%";
  }

  function applyBrand(){
    const idx=CONTENT && CONTENT.index;
    if(!idx) return;
    const b=$(".brand");
    if(b) b.innerHTML="<strong>"+esc(idx.title||"Sistemas de Gestión")+"</strong><span>"+esc(idx.subtitle||"")+"</span>";
    const n=$("#navH");
    if(n) n.textContent="Programa · "+units().length+" unidades";
  }
  function menu(){
    const host=$("#navUnits");
    if(!host) return;
    host.innerHTML = units().map(u=>{
      const lessons=(u.classes||[]).map(c=>{
        if(!isOpen(c)) return '<span>'+esc(c.title)+' <span class="badge">Próximamente</span></span>';
        const done=state.completed.includes(c.id);
        const on=view===c.id?" on":"";
        const badge=done?'<span class="badge ok">Hecha</span>':'<span class="badge live">'+(c.visto?"Vista":"Lista")+"</span>";
        return '<a href="#'+esc(c.id)+'" class="'+on.trim()+'" data-id="'+esc(c.id)+'">'+esc(c.title)+" "+badge+"</a>";
      }).join("");
      const uon=view===u.id?" on":"";
      return '<div class="unit"><button class="unit-link" type="button" data-unit="'+esc(u.id)+'"><b>'+esc(u.title)+' <small>'+esc(u.kind||"")+'</small></b></button><div class="lessons">'+lessons+"</div></div>";
    }).join("");
    host.querySelectorAll("a[data-id]").forEach(a=>a.addEventListener("click",e=>{
      e.preventDefault(); openClass(a.dataset.id); closeMenu();
    }));
    host.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",e=>{
      e.preventDefault(); openUnit(b.dataset.unit); closeMenu();
    }));
  }

  function rich(b){ return (b && (b.html||b.titleHtml||"")) || esc((b && (b.text||b.title)) || ""); }
  function renderBlocks(blocks){
    return (blocks||[]).map(renderBlock).join("");
  }
  function renderBlock(b){
    if(!b) return "";
    const typ=b.type;
    if(typ==="heading"){
      const lv=Math.min(Math.max(+(b.level||2),2),4);
      return "<h"+lv+">"+rich(b)+"</h"+lv+">";
    }
    if(typ==="paragraph") return "<p>"+rich(b)+"</p>";
    if(typ==="formula") return '<div class="eq-wrap">'+(b.html||"")+(b.caption?"<small>"+esc(b.caption)+"</small>":"")+"</div>";
    if(typ==="table"){
      const heads=b.headersHtml||(b.headers||[]).map(esc);
      const rows=b.rowsHtml||(b.rows||[]).map(r=>r.map(esc));
      const thead="<thead><tr>"+heads.map(h=>"<th>"+h+"</th>").join("")+"</tr></thead>";
      const tb="<tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody>";
      return '<div class="tabla-wrap"><table>'+thead+tb+"</table></div>"+(b.caption?"<p class='muted'>"+esc(b.caption)+"</p>":"");
    }
    if(typ==="svg"){
      return '<figure class="lamina">'+(b.svg||"")+(b.caption?"<figcaption>"+esc(b.caption)+"</figcaption>":"")+"</figure>";
    }
    if(typ==="callout"){
      const k=b.kind||"idea";
      return '<blockquote class="'+k+'">'+rich(b)+"</blockquote>";
    }
    if(typ==="list"){
      const tag=b.ordered?"ol":"ul";
      const items=b.itemsHtml||(b.items||[]).map(esc);
      return "<"+tag+">"+items.map(i=>"<li>"+i+"</li>").join("")+"</"+tag+">";
    }
    if(typ==="ejemplo"){
      return '<div class="ejemplo-box"><div class="n">'+esc(b.title||"Ejemplo")+"</div>"+renderBlocks(b.blocks)+"</div>";
    }
    if(typ==="ejercicio"){
      const sol=b.solucion
        ? '<details class="solucion"><summary>Ver resolución</summary>'+(typeof b.solucion==="string"? "<p>"+esc(b.solucion)+"</p>":renderBlocks(b.solucion))+"</details>"
        : '<p class="para-resolver">'+esc(b.nota||"Para resolver — todavía no hay resolución en el material.")+"</p>";
      return '<section class="ejercicio"><h2>'+esc(b.title||"Ejercicio")+"</h2>"+renderBlocks(b.blocks)+sol+"</section>";
    }
    if(typ==="glosario"){
      const rows=(b.entries||[]).map(e=>"<tr><td class='sim'>"+(e.simboloHtml||esc(e.simbolo||""))+"</td><td>"+(e.nombreHtml||esc(e.nombre||""))+"</td><td>"+(e.significadoHtml||esc(e.significado||""))+"</td></tr>").join("");
      return '<section class="glosario"><h2>'+esc(b.title||"Glosario")+"</h2>"+(b.intro||b.introHtml? "<p>"+(b.introHtml||esc(b.intro||""))+"</p>":"")+'<div class="tabla-wrap"><table><thead><tr><th>Símbolo</th><th>Nombre</th><th>Significado</th></tr></thead><tbody>'+rows+"</tbody></table></div></section>";
    }
    if(b.text||b.html) return "<p>"+rich(b)+"</p>";
    return "";
  }
  function homeHTML(){
    if(!CONTENT){
      return '<div class="banner"><strong>Falta generar el contenido.</strong> Corré <code>python3 build.py</code> en la carpeta web/ y abrí <strong>sdg_estudio.html</strong>.</div>';
    }
    const items=PLAYABLE.map(c=>{
      const tag=c.visto?"Vista":"Lista";
      return '<li><a href="#'+esc(c.id)+'" data-go="'+esc(c.id)+'">'+esc(c.title)+' <span class="badge live">'+tag+"</span></a></li>";
    }).join("");
    return '<div class="story-entry"><button class="story-chip" type="button" id="btnSeguirStories" aria-label="Seguir en modo historias"><span class="story-ring"><i>SG</i></span><em>Historias</em></button></div>'
      +'<div class="banner"><strong>Están cargadas las clases que ya vimos</strong> (1 a 4 y el integrador). Cada una tiene la teoría completa —fórmulas, tablas y láminas— y el modo historias para repasar. El audio lee cada tarjeta; lo podés silenciar arriba a la derecha.</div>'
      +'<div class="kicker">Inicio</div><h1>Elegí una clase</h1>'
      +'<p class="lede">El índice de la izquierda ordena el programa. En cada clase disponible leés la teoría acá y, si querés, la repasás en modo historias.</p>'
      +'<div class="card"><span class="tag">Vistas</span><p>Clases listas. También podés abrir el mapa y el árbol de la unidad.</p>'
      +'<div class="row"><button class="ghost" type="button" data-unit="u2">Mapa y árbol de la U2</button></div>'
      +'<ul class="class-index">'+items+"</ul></div>";
  }
  function classHTML(id){
    const meta=classMeta(id);
    const data=classData(id);
    const done=state.completed.includes(id);
    if(!meta||!data){
      return '<div class="kicker">Programa</div><h1>Todavía no está esta clase</h1><p class="lede">Está marcada como próximamente. No hay un apunte fuente para cargarla todavía.</p>';
    }
    const unitKicker=esc((data.unitLabel||"Unidad")+" · "+(data.unitTitle||""));
    const teor=renderBlocks(data.teoria||[]);
    return '<div class="kicker">'+unitKicker+' · <a href="#'+esc(data.unitId||"u2")+'" data-unit="'+esc(data.unitId||"u2")+'">Ver unidad</a></div><h1>'+esc(data.title||meta.title)+"</h1>"
      +'<p class="lede">'+esc(data.lede||"")+"</p>"
      +'<div class="card"><span class="tag">'+(meta.visto?"Vista":"Clase")+"</span>"
      +'<p>Abajo está la teoría completa. El ícono abre el modo historias, un repaso rápido de la misma clase. El audio lee sola cada tarjeta; lo podés silenciar arriba a la derecha.</p>'
      +'<div class="row"><button class="story-chip" type="button" id="btnStories" aria-label="Modo historias"><span class="story-ring"><i>SG</i></span><em>Historias</em></button>'
      +(done?'<span class="muted">✓ Clase marcada como hecha</span>':'')
      +"</div></div>"
      +'<div class="teoria">'+teor+"</div>";
  }
  function unitHTML(id){
    const u=unitById(id);
    if(!u) return classHTML(id);
    const laminas=(u.laminas||[]).map(l=>'<figure class="lamina">'+(l.svg||"")+(l.caption?"<figcaption>"+esc(l.caption)+"</figcaption>":"")+"</figure>").join("");
    const items=(u.classes||[]).map(c=>{
      if(!isOpen(c)) return "<li><span>"+esc(c.title)+' <span class="badge">Próximamente</span></span></li>';
      const done=state.completed.includes(c.id);
      const badge=done?'<span class="badge ok">Hecha</span>':'<span class="badge live">'+(c.visto?"Vista":"Lista")+"</span>";
      return '<li><a href="#'+esc(c.id)+'" data-go="'+esc(c.id)+'">'+esc(c.title)+" "+badge+"</a></li>";
    }).join("");
    return '<div class="kicker">Programa</div><h1>'+esc(u.title)+"</h1>"
      +'<p class="lede">'+esc(u.lede||"")+"</p>"
      +laminas
      +'<div class="card"><span class="tag">Clases</span><ul class="class-index">'+items+"</ul></div>";
  }
  function renderMain(){
    const el=$("#main");
    applyBrand();
    if(view==="home"){
      el.innerHTML=homeHTML();
    } else if(unitById(view)){
      el.innerHTML=unitHTML(view);
    } else {
      el.innerHTML=classHTML(view);
    }
    const chip=$("#btnSeguirStories");
    if(chip) chip.onclick=resumeStories;
    const stbtn=$("#btnStories");
    if(stbtn) stbtn.onclick=()=>openStories(view);
    el.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{ e.preventDefault(); openClass(b.dataset.go); });
    el.querySelectorAll("[data-unit]").forEach(b=>b.onclick=e=>{ e.preventDefault(); openUnit(b.dataset.unit); });
    menu(); progress();
  }
  function openUnit(id){
    view=id; location.hash=id; renderMain(); window.scrollTo(0,0);
  }
  function openClass(id){
    view=id; location.hash=id; renderMain(); window.scrollTo(0,0);
  }

  /* menu */
  function closeMenu(){ $("#menu").classList.remove("open"); $("#back").classList.remove("show"); }
  $("#btnMenu").onclick=()=>{ const o=!$("#menu").classList.contains("open"); $("#menu").classList.toggle("open",o); $("#back").classList.toggle("show",o); };
  $("#back").onclick=closeMenu;
  $("#btnReset").onclick=()=>{
    localStorage.removeItem(KEY);
    state={completed:[],answers:{},pos:{},lastClass:firstPlayable(),muted:true};
    applyAudioPref();
    view="home"; location.hash="";
    closeMenu(); renderMain();
  };

  /* stories */

  function speakable(text){
    let s = String(text == null ? "" : text);
    s = s.replace(/<[^>]+>/g, " ");
    let guard = 0;
    while(/\\(?:d?frac|sqrt|text|mathrm|textrm|mathbf|bar|overline|hat|widehat)\b/.test(s) && guard++ < 6){
      s = s.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, " $1 sobre $2 ");
      s = s.replace(/\\sqrt\s*(?:\[[^\]]*\])?\s*\{([^{}]*)\}/g, " raíz de $1 ");
      s = s.replace(/\\(?:text|mathrm|textrm|mathbf)\s*\{([^{}]*)\}/g, " $1 ");
      s = s.replace(/\\(?:bar|overline|hat|widehat)\s*\{([^{}]*)\}/g, " $1 ");
    }
    const latexWord = {sigma:"sigma", mu:"mu", alpha:"alfa", beta:"beta", pi:"pi", theta:"theta", lambda:"lambda", gamma:"gamma", delta:"delta", times:"por", cdot:"por", pm:"más o menos", approx:"aproximadamente", leq:"menor o igual que", geq:"mayor o igual que", neq:"distinto de", infty:"infinito", sum:"sumatoria", sqrt:"raíz"};
    s = s.replace(/\\([a-zA-Z]+)/g, (_, cmd) => latexWord[cmd] ? " " + latexWord[cmd] + " " : " ");
    s = s.replace(/\$\$?/g, " ").replace(/[{}`]/g, " ");
    s = s.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1");
    try { s = s.replace(/\p{Extended_Pictographic}/gu, " "); }
    catch(e){ s = s.replace(/[\u{1F300}-\u{1FAFF}]/gu, " "); }
    const sym = {"×":" por ","·":" por ","±":" más o menos ","≈":" aproximadamente ","≤":" menor o igual que ","≥":" mayor o igual que ","≠":" distinto de ","∞":" infinito ","√":" raíz cuadrada de ","Σ":" sumatoria de ","∑":" sumatoria de ","μ":" mu ","σ":" sigma ","α":" alfa ","β":" beta ","π":" pi ","²":" al cuadrado ","³":" al cubo ","−":" menos ","—":", ","–":", ","…":" ","✓":" ","✔":" ","✕":" ","→":" hacia "};
    s = s.replace(/[×·±≈≤≥≠∞√Σ∑μσαβπ²³−—–…✓✔✕→]/g, ch => sym[ch] || " ");
    s = s.replace(/=/g, " igual ").replace(/\+/g, " más ").replace(/-/g, " menos ");
    try { s = s.replace(/[^\p{L}\p{M}\p{N}\s.,;:¿?¡!%()]/gu, " "); }
    catch(e){ s = s.replace(/[^0-9A-Za-zÁÉÍÓÚÜÑáéíóúüñ\s.,;:¿?¡!%()]/g, " "); }
    return s.replace(/\s+/g, " ").trim();
  }
  function formulaToSpeech(el){
    const clone = el.cloneNode(true);
    clone.querySelectorAll(".frac").forEach(f => {
      const num = (f.querySelector(".num") && f.querySelector(".num").textContent) || "";
      const den = (f.querySelector(".den") && f.querySelector(".den").textContent) || "";
      f.replaceWith(document.createTextNode(num + " sobre " + den));
    });
    clone.querySelectorAll(".rad").forEach(r => {
      r.replaceWith(document.createTextNode("raíz de " + (r.textContent || "")));
    });
    clone.querySelectorAll("sup").forEach(s => {
      const t = (s.textContent || "").trim();
      const word = t === "2" ? " al cuadrado" : t === "3" ? " al cubo" : " a la " + t;
      s.replaceWith(document.createTextNode(word));
    });
    clone.querySelectorAll("sub").forEach(s => {
      s.replaceWith(document.createTextNode(" sub " + (s.textContent || "")));
    });
    let raw = clone.textContent || "";
    raw = raw.replace(/(\S+)\s*\/\s*(\S+)/g, "$1 sobre $2");

  function chunkSpeech(text){
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    if(!clean) return [];
    const bits = clean.split(/(?<=[.!?])\s+/);
    const out = [];
    bits.forEach(bit => {
      let rest = bit.trim();
      while(rest.length > 180){
        let cut = rest.lastIndexOf(", ", 180);
        if(cut < 40) cut = rest.lastIndexOf(" ", 180);
        if(cut < 40) cut = 180;
        out.push(rest.slice(0, cut).trim());
        rest = rest.slice(cut).replace(/^[, ]+/, "").trim();
      }
      if(rest) out.push(rest);
    });
    return out;
  }

        if(speechSynthesis.paused){ speechHold = "pause"; return; }
      }
    } catch(e){}
    if(speaking || speechOn()){
      stopSpeech();
      speechHold = "restart";
    }
  }
  function resumeStorySpeech(){
    const mode = speechHold;
    speechHold = null;
    if(state.muted || !st.open) return;
    if(mode === "pause"){
      try {
        if(speechSynthesis.paused && speechSynthesis.resume){ speechSynthesis.resume(); return; }
      } catch(e){}
      startSpeech();
      return;
    }
    if(mode === "restart") startSpeech();
  }
  function beginHold(){
    if(holding || !st.open) return;
    holding = true;
    root.classList.add("holding");
    const mark = $("#holdMark");
    if(mark) mark.hidden = false;
    pauseStorySpeech();
  }
  function endHold(resume){
    if(press){ clearTimeout(press.timer); press = null; }
    if(!holding) return;
    holding = false;
    root.classList.remove("holding");
    const mark = $("#holdMark");
    if(mark) mark.hidden = true;
    if(resume !== false) resumeStorySpeech();
    else speechHold = null;
  }
  function storyZone(x){
    const r = root.getBoundingClientRect();
    const rel = r.width ? (x - r.left) / r.width : 0.5;
    if(rel <= 0.18) return "prev";
    if(rel >= 0.82) return "next";
    return "mid";
  }
  function interactiveTarget(el){
    return !!(el && el.closest && el.closest("button, a, input, textarea, .opts, .voice-menu"));
  }
  function onPressStart(e){
    if(!st.open || e.isPrimary === false) return;
    if(e.button != null && e.button !== 0) return;
    if(interactiveTarget(e.target)) return;
    if(press) clearTimeout(press.timer);
    press = {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), held:false, moved:false};

  }
  function onPressMove(e){
    if(!press || e.pointerId !== press.id) return;
    const dx = e.clientX - press.x, dy = e.clientY - press.y;
    if(!press.held && (Math.abs(dx) > 18 || Math.abs(dy) > 18)){
      clearTimeout(press.timer);
      press.moved = true;
    }
  }
  function onPressEnd(e){
    if(!press || e.pointerId !== press.id) return;
    clearTimeout(press.timer);
    const dx = e.clientX - press.x, dy = e.clientY - press.y;
    const held = press.held || (performance.now() - press.t) >= HOLD_MS;
    const swipe = Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.2;
    const zone = storyZone(press.x);
    press = null;
    if(!st.open){ endHold(false); return; }
    if(swipe){
      endHold(false);
      if(dy < 0) nextClass(); else prevClass();
      return;
    }
    if(held){ endHold(true); return; }
    if(zone === "prev") prevCard();
    else if(zone === "next") nextCard();
  }
  root.addEventListener("pointerdown", onPressStart);
  root.addEventListener("pointermove", onPressMove);
  window.addEventListener("pointerup", onPressEnd);
  window.addEventListener("pointercancel", function(e){
    if(!press || e.pointerId !== press.id) return;
    clearTimeout(press.timer);
    press = null;
    endHold(true);
  });
  root.addEventListener("contextmenu", function(e){ if(st.open) e.preventDefault(); });
  root.addEventListener("selectstart", function(e){ e.preventDefault(); });

  let wheelLock=0;
  root.addEventListener("wheel",e=>{
    if(!st.open) return;
    e.preventDefault();
    const now=Date.now();
    if(now-wheelLock<500) return;
    if(Math.abs(e.deltaY)<20) return;
    wheelLock=now;
    if(e.deltaY>0) nextClass(); else prevClass();
  },{passive:false});

  document.addEventListener("keydown",e=>{
    if(!st.open) return;
    if(e.key==="ArrowRight") { e.preventDefault(); nextCard(); }
    if(e.key==="ArrowLeft") { e.preventDefault(); prevCard(); }
    if(e.key==="ArrowDown") { e.preventDefault(); nextClass(); }
    if(e.key==="ArrowUp") { e.preventDefault(); prevClass(); }
    if(e.key==="Escape"){
      if(!$("#voiceMenu").hidden){ closeVoiceMenu(); return; }
      closeStories();
    }
  });

  window.__sdg={openStories,closeStories,resumeStories,nextCard,prevCard,nextClass,prevClass,openClass,openUnit,paintStories,toggleSpeech,toggleMute,startSpeech,stopSpeech,cardSpeakText,pickVoice,spanishVoices,rankVoices,speakable,formulaToSpeech,chunkSpeech,utteranceLang,noteVoices,openVoiceMenu,previewVoice,get holding(){return holding;},get st(){return st;},state};
  paintMute();
  applyBrand();
  const hid=location.hash.replace("#","");
  if(hid && (classMeta(hid) || unitById(hid))) view=hid;

  renderMain();
})();
