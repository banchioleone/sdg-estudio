<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="392" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Mapa de la Unidad 6 · Planificación y control</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Esquema propio con la jerarquía de Morán y Chase (no es lámina de la cátedra)</text><defs><marker id="u6m" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><rect x="40" y="70" width="330" height="52" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="205.0" y="90" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">Plan agregado (PA)</text><text x="205.0" y="108" font-size="11" fill="#333" text-anchor="middle">familias · meses (mediano plazo)</text><rect x="430" y="70" width="230" height="52" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.6"/><text x="545.0" y="101.0" font-size="12.5" font-weight="700" fill="#8A5A16" text-anchor="middle">RRP · recursos</text><line x1="370" y1="96" x2="430" y2="96" stroke="#D9954A" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="40" y="140" width="330" height="52" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="205.0" y="160" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">Programa maestro (MPS)</text><text x="205.0" y="178" font-size="11" fill="#333" text-anchor="middle">productos finales · semanas</text><rect x="430" y="140" width="230" height="52" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.6"/><text x="545.0" y="171.0" font-size="12.5" font-weight="700" fill="#8A5A16" text-anchor="middle">RCCP · CPOF / CB / RP</text><line x1="370" y1="166" x2="430" y2="166" stroke="#D9954A" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="40" y="210" width="330" height="52" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="205.0" y="230" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">MRP</text><text x="205.0" y="248" font-size="11" fill="#333" text-anchor="middle">piezas y materiales · semanas</text><rect x="430" y="210" width="230" height="52" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.6"/><text x="545.0" y="241.0" font-size="12.5" font-weight="700" fill="#8A5A16" text-anchor="middle">CRP · carga por centro</text><line x1="370" y1="236" x2="430" y2="236" stroke="#D9954A" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="40" y="280" width="330" height="52" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="205.0" y="300" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">Control de la producción (PAC)</text><text x="205.0" y="318" font-size="11" fill="#333" text-anchor="middle">órdenes · días y turnos</text><rect x="430" y="280" width="230" height="52" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.6"/><text x="545.0" y="311.0" font-size="12.5" font-weight="700" fill="#8A5A16" text-anchor="middle">control de entradas / salidas</text><line x1="370" y1="306" x2="430" y2="306" stroke="#D9954A" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="205" y1="122" x2="205" y2="138" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6m)"/><line x1="205" y1="192" x2="205" y2="208" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6m)"/><line x1="205" y1="262" x2="205" y2="278" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6m)"/><text x="350" y="360" font-size="11.5" fill="#5c6670" text-anchor="middle">Cada nivel desagrega al anterior y se valida contra su propio cálculo de capacidad (columna naranja).</text><text x="350" y="376" font-size="11.5" fill="#5c6670" text-anchor="middle">Balanceo de línea (Clase 11) es el equivalente en producción repetitiva.</text></svg>