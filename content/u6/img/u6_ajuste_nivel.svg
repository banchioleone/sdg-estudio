<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 368" width="700" height="368" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="368" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Ajuste vs. nivel con los requerimientos de JC Company</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Datos de Chase, ilustración 16.3; la línea de nivel es cálculo propio (promedio)</text><defs><marker id="u6an" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><line x1="80" y1="300" x2="660" y2="300" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u6an)"/><line x1="80" y1="300" x2="80" y2="60" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u6an)"/><text x="660" y="292" font-size="12" fill="#1F4E79" text-anchor="end"></text><text x="86" y="64" font-size="12" fill="#1F4E79">unidades</text><text x="130" y="318" font-size="12" fill="#1F4E79" text-anchor="middle">Ene</text><text x="130" y="86.5" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">1.850</text><text x="225" y="318" font-size="12" fill="#1F4E79" text-anchor="middle">Feb</text><text x="225" y="133.25" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">1.425</text><text x="320" y="318" font-size="12" fill="#1F4E79" text-anchor="middle">Mar</text><text x="320" y="180.0" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">1.000</text><text x="415" y="318" font-size="12" fill="#1F4E79" text-anchor="middle">Abr</text><text x="415" y="196.5" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">850</text><text x="510" y="318" font-size="12" fill="#1F4E79" text-anchor="middle">May</text><text x="510" y="163.5" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">1.150</text><text x="605" y="318" font-size="12" fill="#1F4E79" text-anchor="middle">Jun</text><text x="605" y="100.25" font-size="11" fill="#1F4E79" text-anchor="middle" font-weight="700">1.725</text><polyline points="130.0,96.5 225.0,143.2 320.0,190.0 415.0,206.5 510.0,173.5 605.0,110.2" fill="none" stroke="#1F4E79" stroke-width="2.6"/><circle cx="130.0" cy="96.5" r="4" fill="#1F4E79"/><circle cx="225.0" cy="143.2" r="4" fill="#1F4E79"/><circle cx="320.0" cy="190.0" r="4" fill="#1F4E79"/><circle cx="415.0" cy="206.5" r="4" fill="#1F4E79"/><circle cx="510.0" cy="173.5" r="4" fill="#1F4E79"/><circle cx="605.0" cy="110.2" r="4" fill="#1F4E79"/><line x1="80" y1="153.3" x2="640" y2="153.3" stroke="#D9954A" stroke-width="2.4" stroke-dasharray="7 5"/><text x="400" y="143.33333333333334" font-size="11.5" fill="#8A5A16" text-anchor="middle" font-weight="700">nivel: 8.000 / 6 ≈ 1.333 por mes</text><text x="20" y="338" font-size="11.5" fill="#5c6670" text-anchor="start">Azul = ajuste (producir lo que pide cada mes, moviendo la fuerza de trabajo). Naranja = nivel (tasa constante:</text><text x="20" y="354" font-size="11.5" fill="#5c6670" text-anchor="start">sobra stock en marzo–mayo y falta en enero, febrero y junio). Los requerimientos ya incluyen el stock de seguridad.</text></svg>