<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="380" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Las cinco estructuras de proceso y el volumen</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Esquema propio de la matriz producto–proceso de Chase cap. 7 (no es la ilustración del libro)</text><defs><marker id="u6x" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><line x1="60" y1="310" x2="680" y2="310" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u6x)"/><line x1="60" y1="310" x2="60" y2="60" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u6x)"/><text x="680" y="302" font-size="12" fill="#1F4E79" text-anchor="end"></text><text x="66" y="64" font-size="12" fill="#1F4E79"></text><text x="680" y="330" font-size="12" fill="#1F4E79" text-anchor="end" font-weight="700">volumen y estandarización →</text><text x="68" y="64" font-size="12" fill="#1F4E79" text-anchor="start" font-weight="700">flujo más continuo ↓</text><rect x="75" y="82" width="150" height="40" rx="8" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.4"/><text x="150" y="100" font-size="11.5" fill="#1F4E79" text-anchor="middle" font-weight="700">Proyecto</text><text x="150" y="114" font-size="10.5" fill="#333" text-anchor="middle">casas, caminos</text><rect x="190" y="130" width="150" height="40" rx="8" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.4"/><text x="265" y="148" font-size="11.5" fill="#1F4E79" text-anchor="middle" font-weight="700">Centro de trabajo (taller)</text><text x="265" y="162" font-size="10.5" fill="#333" text-anchor="middle">perforadoras juntas</text><rect x="305" y="178" width="150" height="40" rx="8" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.4"/><text x="380" y="196" font-size="11.5" fill="#1F4E79" text-anchor="middle" font-weight="700">Celda de manufactura</text><text x="380" y="210" font-size="10.5" fill="#333" text-anchor="middle">familias de piezas</text><rect x="420" y="226" width="150" height="40" rx="8" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.4"/><text x="495" y="244" font-size="11.5" fill="#1F4E79" text-anchor="middle" font-weight="700">Línea de ensamble</text><text x="495" y="258" font-size="10.5" fill="#333" text-anchor="middle">autos, aparatos</text><rect x="535" y="274" width="150" height="40" rx="8" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.4"/><text x="610" y="292" font-size="11.5" fill="#1F4E79" text-anchor="middle" font-weight="700">Proceso continuo</text><text x="610" y="306" font-size="10.5" fill="#333" text-anchor="middle">petróleo, químicos</text><text x="20" y="350" font-size="11.5" fill="#5c6670" text-anchor="start">Fuera de la diagonal (p. ej. un producto masivo hecho en taller) el proceso queda caro o poco flexible.</text><text x="20" y="366" font-size="11.5" fill="#5c6670" text-anchor="start">Cómo se planifica: proyecto → técnicas de proyectos; taller → MRP y secuencia; línea → tasa y balanceo.</text></svg>