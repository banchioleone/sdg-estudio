<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="330" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Pieza Z: costo total con cada regla de lote</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Datos de Morán, MRP §2.1; gráfico propio</text><text x="170" y="114.0" font-size="12.5" fill="#222" text-anchor="end">EOQ</text><rect x="180" y="90" width="385.4" height="40" rx="4" fill="#1F4E79"/><text x="573.35" y="114.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$1.835</text><text x="170" y="178.0" font-size="12.5" fill="#222" text-anchor="end">TBO / POQ</text><rect x="180" y="154" width="346.5" height="40" rx="4" fill="#1F4E79"/><text x="534.5" y="178.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$1.650</text><text x="170" y="242.0" font-size="12.5" fill="#222" text-anchor="end">Silver-Meal</text><rect x="180" y="218" width="330.1" height="40" rx="4" fill="#2E7D4F"/><text x="518.12" y="242.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$1.572</text><text x="20" y="300" font-size="11.5" fill="#5c6670" text-anchor="start">Pieza Z (demanda propia de 300 por semana + la que generan las órdenes de X). Mismo orden en la pieza Y: 789 / 682 / 654.</text><text x="20" y="316" font-size="11.5" fill="#5c6670" text-anchor="start">El lote dinámico (Silver-Meal) genera menos stock; el EOQ propaga excesos a los niveles inferiores (Morán).</text></svg>