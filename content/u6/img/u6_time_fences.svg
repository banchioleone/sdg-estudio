<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="300" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Restricciones de tiempo (time fences) del MPS</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Datos de Chase, ilustración 18.2; dibujo propio</text><defs><marker id="u6tf" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><rect x="40.0" y="90" width="190.8" height="90" fill="#B03A2E" fill-opacity="0.18" stroke="#B03A2E" stroke-width="1.6"/><text x="135.3846153846154" y="128" font-size="13.5" fill="#B03A2E" text-anchor="middle" font-weight="700">Congelado</text><text x="135.3846153846154" y="148" font-size="11.5" fill="#333" text-anchor="middle">sin cambios (o menores)</text><rect x="230.8" y="90" width="166.9" height="90" fill="#D9954A" fill-opacity="0.18" stroke="#D9954A" stroke-width="1.6"/><text x="314.2307692307692" y="128" font-size="13.5" fill="#D9954A" text-anchor="middle" font-weight="700">Moderadamente firme</text><text x="314.2307692307692" y="148" font-size="11.5" fill="#333" text-anchor="middle">cambios dentro del grupo</text><rect x="397.7" y="90" width="262.3" height="90" fill="#2E7D4F" fill-opacity="0.18" stroke="#2E7D4F" stroke-width="1.6"/><text x="528.8461538461538" y="128" font-size="13.5" fill="#2E7D4F" text-anchor="middle" font-weight="700">Flexible</text><text x="528.8461538461538" y="148" font-size="11.5" fill="#333" text-anchor="middle">casi cualquier cambio</text><line x1="40" y1="205" x2="675" y2="205" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6tf)"/><line x1="40.0" y1="198" x2="40.0" y2="212" stroke="#1F4E79" stroke-width="1.6"/><text x="40.0" y="230" font-size="12.5" fill="#1F4E79" text-anchor="middle" font-weight="700">0</text><line x1="230.8" y1="198" x2="230.8" y2="212" stroke="#1F4E79" stroke-width="1.6"/><text x="230.76923076923077" y="230" font-size="12.5" fill="#1F4E79" text-anchor="middle" font-weight="700">8</text><line x1="397.7" y1="198" x2="397.7" y2="212" stroke="#1F4E79" stroke-width="1.6"/><text x="397.6923076923077" y="230" font-size="12.5" fill="#1F4E79" text-anchor="middle" font-weight="700">15</text><line x1="660.0" y1="198" x2="660.0" y2="212" stroke="#1F4E79" stroke-width="1.6"/><text x="660.0" y="230" font-size="12.5" fill="#1F4E79" text-anchor="middle" font-weight="700">26</text><text x="670" y="248" font-size="11.5" fill="#1F4E79" text-anchor="end">semanas</text><text x="20" y="270" font-size="11.5" fill="#5c6670" text-anchor="start">Más cerca de hoy, más caro cambiar: los materiales ya se compraron y la capacidad ya se asignó.</text><text x="20" y="286" font-size="11.5" fill="#5c6670" text-anchor="start">Disponible para prometer (Chase): lo que queda sin comprometer, p. ej. 100 programadas − 65 vendidas = 35.</text></svg>