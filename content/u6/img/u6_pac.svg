<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" width="700" height="396" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="396" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Control de las actividades de producción (PAC)</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Esquema propio según Morán, PAC (figura 1 y §2)</text><defs><marker id="u6k" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><rect x="20" y="70" width="200" height="60" rx="10" fill="#F6F8FA" stroke="#1F4E79" stroke-width="1.6"/><text x="120.0" y="90" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">Entradas</text><text x="120.0" y="108" font-size="11" fill="#333" text-anchor="middle">MPS · MRP · CRP</text><text x="120.0" y="122" font-size="11" fill="#333" text-anchor="middle">ingeniería (rutas, tiempos)</text><rect x="250" y="70" width="220" height="80" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="360.0" y="90" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">1 · Lanzamiento</text><text x="360.0" y="108" font-size="11" fill="#333" text-anchor="middle">hoja de ruta · requisición</text><text x="360.0" y="122" font-size="11" fill="#333" text-anchor="middle">vales de trabajo y movimiento</text><text x="360.0" y="136" font-size="11" fill="#333" text-anchor="middle">lista de piezas</text><rect x="250" y="170" width="220" height="80" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="360.0" y="190" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">2 · Programación</text><text x="360.0" y="208" font-size="11" fill="#333" text-anchor="middle">lista de despacho por centro</text><text x="360.0" y="222" font-size="11" fill="#333" text-anchor="middle">(carga + secuencia,</text><text x="360.0" y="236" font-size="11" fill="#333" text-anchor="middle">reglas de prioridad)</text><line x1="360" y1="150" x2="360" y2="168" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6k)"/><rect x="250" y="270" width="220" height="80" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="360.0" y="290" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">3 · Control del progreso</text><text x="360.0" y="308" font-size="11" fill="#333" text-anchor="middle">datos de planta · órdenes abiertas</text><text x="360.0" y="322" font-size="11" fill="#333" text-anchor="middle">informes de estado, progreso</text><text x="360.0" y="336" font-size="11" fill="#333" text-anchor="middle">y excepción · control E/S</text><line x1="360" y1="250" x2="360" y2="268" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6k)"/><line x1="220" y1="100" x2="248" y2="100" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6k)"/><rect x="500" y="170" width="180" height="80" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.6"/><text x="590.0" y="190" font-size="13.5" font-weight="700" fill="#8A5A16" text-anchor="middle">Decisor humano</text><text x="590.0" y="208" font-size="11" fill="#333" text-anchor="middle">adelantar / atrasar órdenes</text><text x="590.0" y="222" font-size="11" fill="#333" text-anchor="middle">horas extra, rutas alternativas</text><path d="M470,310 C520,310 590,300 590,252" fill="none" stroke="#D9954A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#u6k)"/><path d="M500,195 C480,150 490,110 472,110" fill="none" stroke="#D9954A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#u6k)"/><text x="20" y="380" font-size="11.5" fill="#5c6670" text-anchor="start">Morán: «aún los sistemas más evolucionados cierran el bucle de control con un decisor humano».</text></svg>