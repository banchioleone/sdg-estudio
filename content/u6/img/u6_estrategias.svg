<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="350" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">JC Company: costo total de cada estrategia (6 meses)</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Datos de Chase, ejemplo 16.1 / ilustración 16.5; gráfico propio</text><text x="210" y="101.0" font-size="12.5" fill="#222" text-anchor="end">Plan 1 · ajuste</text><rect x="220" y="80" width="364.8" height="34" rx="4" fill="#1F4E79"/><text x="592.8" y="101.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$172.800</text><text x="210" y="153.0" font-size="12.5" fill="#222" text-anchor="end">Plan 2 · nivel</text><rect x="220" y="132" width="343.0" height="34" rx="4" fill="#1F4E79"/><text x="571.0302222222222" y="153.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$162.488</text><text x="210" y="205.0" font-size="12.5" fill="#222" text-anchor="end">Plan 3 · subcontrato</text><rect x="220" y="184" width="337.8" height="34" rx="4" fill="#2E7D4F"/><text x="565.7777777777778" y="205.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$160.000</text><text x="210" y="257.0" font-size="12.5" fill="#222" text-anchor="end">Plan 4 · horas extras</text><rect x="220" y="236" width="349.4" height="34" rx="4" fill="#1F4E79"/><text x="577.3698888888889" y="257.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">$165.491</text><text x="20" y="320" font-size="11.5" fill="#5c6670" text-anchor="start">El más barato es el Plan 3, pero Chase advierte que la subcontratación es de «alto riesgo» (calidad, dependencia).</text><text x="20" y="336" font-size="11.5" fill="#5c6670" text-anchor="start">Barras empiezan en 0; la diferencia entre planes es de 8% como mucho: el costo de tiempo regular domina.</text></svg>