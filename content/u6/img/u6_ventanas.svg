x1="399.66156609245695" y1="123.76309626471988" x2="558.699970066505" y2="235.08997904655345" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6v)"/><line x1="403.28342000348795" y1="205.820855000872" x2="554.7762949962214" y2="243.69407374905535" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6v)"/><circle cx="70" cy="190" r="23" fill="#DDEBF7" stroke="#1F4E79" stroke-width="1.6"/><text x="70" y="191" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">A</text><text x="70" y="205" font-size="10.5" fill="#333" text-anchor="middle">70 s</text><circle cx="220" cy="90" r="23" fill="#E2F0D9" stroke="#1F4E79" stroke-width="1.6"/><text x="220" y="91" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">B</text><text x="220" y="105" font-size="10.5" fill="#333" text-anchor="middle">80 s</text><circle cx="220" cy="170" r="23" fill="#FFF2CC" stroke="#1F4E79" stroke-width="1.6"/><text x="220" y="171" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">C</text><text x="220" y="185" font-size="10.5" fill="#333" text-anchor="middle">40 s</text><circle cx="220" cy="250" r="23" fill="#DDEBF7" stroke="#1F4E79" stroke-width="1.6"/><text x="220" y="251" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">D</text><text x="220" y="265" font-size="10.5" fill="#333" text-anchor="middle">20 s</text><circle cx="220" cy="320" r="23" fill="#FFF2CC" stroke="#1F4E79" stroke-width="1.6"/><text x="220" y="321" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">E</text><text x="220" y="335" font-size="10.5" fill="#333" text-anchor="middle">40 s</text><circle cx="380" cy="110" r="23" fill="#FCE4D6" stroke="#1F4E79" stroke-width="1.6"/><text x="380" y="111" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">F</text><text x="380" y="125" font-size="10.5" fill="#333" text-anchor="middle">30 s</text><circle cx="380" cy="200" r="23" fill="#FCE4D6" stroke="#1F4E79" stroke-width="1.6"/><text x="380" y="201" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">G</text><text x="380" y="215" font-size="10.5" fill="#333" text-anchor="middle">50 s</text><circle cx="580" cy="250" r="23" fill="#EDE7F6" stroke="#1F4E79" stroke-width="1.6"/><text x="580" y="251" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="700">H</text><text x="580" y="265" font-size="10.5" fill="#333" text-anchor="middle">50 s</text><rect x="470" y="60" width="16" height="16" fill="#DDEBF7" stroke="#1F4E79"/><text x="492" y="73" font-size="11" fill="#222" text-anchor="start">Est. 1: A + D (90)</text><rect x="470" y="82" width="16" height="16" fill="#E2F0D9" stroke="#1F4E79"/><text x="492" y="95" font-size="11" fill="#222" text-anchor="start">Est. 2: B (80)</text><rect x="470" y="104" width="16" height="16" fill="#FFF2CC" stroke="#1F4E79"/><text x="492" y="117" font-size="11" fill="#222" text-anchor="start">Est. 3: C + E (80)</text><rect x="470" y="126" width="16" height="16" fill="#FCE4D6" stroke="#1F4E79"/><text x="492" y="139" font-size="11" fill="#222" text-anchor="start">Est. 4: F + G (80)</text><rect x="470" y="148" width="16" height="16" fill="#EDE7F6" stroke="#1F4E79"/><text x="492" y="161" font-size="11" fill="#222" text-anchor="start">Est. 5: H (50)</text><text x="20" y="372" font-size="11.5" fill="#5c6670" text-anchor="start">Balance propio con C = 90 s (dos turnos): {A,D} 90 · {B} 80 · {C,E} 80 · {F,G} 80 · {H} 50 → 380 / (5 × 90) = 84,4%.</text><text x="20" y="388" font-size="11.5" fill="#5c6670" text-anchor="start">El ciclo de 90 s y el 84,44% están en la resolución manuscrita (EFR p. 19); la asignación por colores es cálculo propio.</text></svg>