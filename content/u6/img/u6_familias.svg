<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 346" width="700" height="346" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="346" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">¿Qué ejercicios de la U6 toman en el final?</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Conteos propios sobre los 19 finales con fecha del Drive</text><text x="180" y="87.0" font-size="12.5" fill="#222" text-anchor="end">MRP</text><rect x="190" y="70" width="168.4" height="26" rx="4" fill="#1F4E79"/><text x="366.42105263157896" y="87.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">8 de 19</text><text x="180" y="125.0" font-size="12.5" fill="#222" text-anchor="end">Balanceo</text><rect x="190" y="108" width="84.2" height="26" rx="4" fill="#1F4E79"/><text x="282.2105263157895" y="125.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">4 de 19</text><text x="180" y="163.0" font-size="12.5" fill="#222" text-anchor="end">Plan agregado</text><rect x="190" y="146" width="42.1" height="26" rx="4" fill="#1F4E79"/><text x="240.10526315789474" y="163.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">2 de 19</text><text x="180" y="201.0" font-size="12.5" fill="#222" text-anchor="end">Hombre–máquina</text><rect x="190" y="184" width="42.1" height="26" rx="4" fill="#d0d5db"/><text x="240.10526315789474" y="201.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">2 de 19</text><text x="180" y="239.0" font-size="12.5" fill="#222" text-anchor="end">MPS</text><rect x="190" y="222" width="21.1" height="26" rx="4" fill="#1F4E79"/><text x="219.05263157894737" y="239.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">1 de 19</text><text x="180" y="277.0" font-size="12.5" fill="#222" text-anchor="end">Capacidad (cálculo)</text><rect x="190" y="260" width="21.1" height="26" rx="4" fill="#1F4E79"/><text x="219.05263157894737" y="277.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="700">1 de 19</text><text x="20" y="316" font-size="11.5" fill="#5c6670" text-anchor="start">Finales con fecha 2002–2018 (patrones_examenes.md). En la teoría 2011–2018 la capacidad de una estación salió en 5 de 7.</text><text x="20" y="332" font-size="11.5" fill="#5c6670" text-anchor="start">Hombre–máquina en gris: lo trae el final pero corresponde a estudio del trabajo (Monks), no al material de esta unidad.</text></svg>