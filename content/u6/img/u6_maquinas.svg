<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="290" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Dos máquinas en serie con scrap (final, versión de EFR p. 20)</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Datos del enunciado; los dos primeros pasos están en la hoja manuscrita, el resto es cálculo propio</text><defs><marker id="u6mq" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><rect x="20" y="110" width="110" height="70" rx="10" fill="#F6F8FA" stroke="#1F4E79" stroke-width="1.6"/><text x="75.0" y="130" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">Entran</text><text x="75.0" y="148" font-size="11" fill="#333" text-anchor="middle">1064 piezas</text><rect x="170" y="100" width="140" height="90" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="240.0" y="120" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">M1</text><text x="240.0" y="138" font-size="11" fill="#333" text-anchor="middle">23" / 0,80 = 28,75 s</text><text x="240.0" y="152" font-size="11" fill="#333" text-anchor="middle">scrap 2,5%</text><text x="240.0" y="166" font-size="11" fill="#333" text-anchor="middle">→ 1037 buenas</text><rect x="350" y="100" width="130" height="90" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.6"/><text x="415.0" y="120" font-size="12.5" font-weight="700" fill="#8A5A16" text-anchor="middle">Depósito D1-2</text><text x="415.0" y="138" font-size="11" fill="#333" text-anchor="middle">máx. ≈ 272 piezas</text><text x="415.0" y="152" font-size="11" fill="#333" text-anchor="middle">(M2 es más lenta)</text><rect x="520" y="100" width="160" height="90" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="600.0" y="120" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="middle">M2</text><text x="600.0" y="138" font-size="11" fill="#333" text-anchor="middle">30" / 0,75 = 40 s</text><text x="600.0" y="152" font-size="11" fill="#333" text-anchor="middle">scrap 3,5%</text><text x="600.0" y="166" font-size="11" fill="#333" text-anchor="middle">→ 1000 buenas</text><line x1="130" y1="145" x2="168" y2="145" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6mq)"/><line x1="310" y1="145" x2="348" y2="145" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6mq)"/><line x1="480" y1="145" x2="518" y2="145" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#u6mq)"/><text x="20" y="240" font-size="11.5" fill="#5c6670" text-anchor="start">Se calcula hacia atrás: 1000 / 0,965 = 1037 que procesa M2; 1037 / 0,975 = 1064 que procesa M1.</text><text x="20" y="256" font-size="11.5" fill="#5c6670" text-anchor="start">Tiempo real = estándar / factor de actividad. El cuello de botella (M2, 40 s) fija el tiempo de entrega:</text><text x="20" y="272" font-size="11.5" fill="#5c6670" text-anchor="start">≈ 28,75 + 1037 × 40 ≈ 41.509 s ≈ 11 h 32 min, con transferencia de a una pieza (cálculo propio).</text></svg>