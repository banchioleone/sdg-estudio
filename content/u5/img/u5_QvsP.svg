<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="370" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Perpetuo vs. periódico</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Esquema propio a partir de Chase cap. 17 y de la definición del banco de preguntas (preguntasabastecimiento)</text><defs><marker id="u5a4" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><line x1="30" y1="290" x2="310" y2="290" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u5a4)"/><line x1="30" y1="290" x2="30" y2="90" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u5a4)"/><text x="310" y="282" font-size="12" fill="#1F4E79" text-anchor="end">t</text><text x="36" y="94" font-size="12" fill="#1F4E79">stock</text><text x="30" y="74" font-size="13.5" font-weight="700" fill="#1F4E79">Perpetuo (modelo Q)</text><circle cx="77.4" cy="200" r="4" fill="#D9954A"/><circle cx="158.7" cy="200" r="4" fill="#D9954A"/><circle cx="222.1" cy="200" r="4" fill="#D9954A"/><path d="M30,110 L77.4,200 L109.4,260.8 L109.4,140.8 L158.7,200 L190.7,238.4 L190.7,118.4 L222.1,200 L254.1,283.2 L254.1,163.2" fill="none" stroke="#1F4E79" stroke-width="2.2"/><line x1="30" y1="200" x2="300" y2="200" stroke="#D9954A" stroke-dasharray="5 4"/><text x="302" y="204" font-size="11.5" fill="#D9954A">R</text><text x="30" y="316" font-size="11.5" fill="#5c6670">Cantidad fija Q, fechas variables.</text><text x="30" y="332" font-size="11.5" fill="#5c6670">Se dispara por un evento: llegar a R.</text><line x1="380" y1="290" x2="660" y2="290" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u5a4)"/><line x1="380" y1="290" x2="380" y2="90" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u5a4)"/><text x="660" y="282" font-size="12" fill="#1F4E79" text-anchor="end">t</text><text x="386" y="94" font-size="12" fill="#1F4E79">stock</text><text x="380" y="74" font-size="13.5" font-weight="700" fill="#1F4E79">Periódico (modelo P)</text><circle cx="460.0" cy="200.0" r="4" fill="#D9954A"/><line x1="460.0" y1="200.0" x2="460.0" y2="110" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="3 3"/><text x="463.0" y="155.0" font-size="10.5" fill="#B03A2E">q</text><circle cx="540.0" cy="254.0" r="4" fill="#D9954A"/><line x1="540.0" y1="254.0" x2="540.0" y2="110" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="3 3"/><text x="543.0" y="182.0" font-size="10.5" fill="#B03A2E">q</text><circle cx="620.0" cy="166.0" r="4" fill="#D9954A"/><line x1="620.0" y1="166.0" x2="620.0" y2="110" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="3 3"/><text x="623.0" y="138.0" font-size="10.5" fill="#B03A2E">q</text><path d="M380,120 L460.0,200.0 L460.0,110 L540.0,254.0 L540.0,110 L620.0,166.0 L620.0,110" fill="none" stroke="#1F4E79" stroke-width="2.2"/><line x1="380" y1="110" x2="650" y2="110" stroke="#2E7D4F" stroke-dasharray="5 4"/><text x="652" y="114" font-size="11.5" fill="#2E7D4F">M</text><text x="460.0" y="305" font-size="11" fill="#D9954A" text-anchor="middle">T</text><text x="540.0" y="305" font-size="11" fill="#D9954A" text-anchor="middle">T</text><text x="620.0" y="305" font-size="11" fill="#D9954A" text-anchor="middle">T</text><text x="380" y="316" font-size="11.5" fill="#5c6670">Período fijo T, cantidades q variables.</text><text x="380" y="332" font-size="11.5" fill="#5c6670">Se dispara por el paso del tiempo.</text><text x="20" y="356" font-size="11.5" fill="#5c6670">Simplificado: en el periódico el pedido q lleva la posición hasta M; la llegada real ocurre L después (no dibujado).</text></svg>