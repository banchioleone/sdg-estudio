<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 368" width="700" height="368" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="368" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Modelo de cantidad fija (perpetuo): el «efecto sierra»</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Esquema propio a partir del texto de Chase cap. 17 (las ilustraciones 17.5 y 17.7 son imagen en el resumen V6)</text><defs><marker id="u5a1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><line x1="60" y1="300" x2="660" y2="300" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u5a1)"/><line x1="60" y1="300" x2="60" y2="60" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#u5a1)"/><text x="660" y="292" font-size="12" fill="#1F4E79" text-anchor="end">tiempo</text><text x="66" y="64" font-size="12" fill="#1F4E79">existencias</text><path d="M60,90 L230,260 L230,90 L400,260 L400,90 L570,260" fill="none" stroke="#1F4E79" stroke-width="2.4"/><line x1="60" y1="260" x2="650" y2="260" stroke="#2E7D4F" stroke-width="1.4" stroke-dasharray="6 4"/><text x="652" y="264" font-size="12" fill="#2E7D4F">SS</text><line x1="60" y1="210.0" x2="650" y2="210.0" stroke="#D9954A" stroke-width="1.4" stroke-dasharray="6 4"/><text x="652" y="214.0" font-size="12" fill="#D9954A">R (PP)</text><circle cx="180" cy="210.0" r="4.5" fill="#D9954A"/><line x1="180" y1="308" x2="230" y2="308" stroke="#D9954A" stroke-width="2"/><text x="205.0" y="324" font-size="11.5" fill="#D9954A" text-anchor="middle">L</text><circle cx="350" cy="210.0" r="4.5" fill="#D9954A"/><line x1="350" y1="308" x2="400" y2="308" stroke="#D9954A" stroke-width="2"/><text x="375.0" y="324" font-size="11.5" fill="#D9954A" text-anchor="middle">L</text><circle cx="520" cy="210.0" r="4.5" fill="#D9954A"/><line x1="520" y1="308" x2="570" y2="308" stroke="#D9954A" stroke-width="2"/><text x="545.0" y="324" font-size="11.5" fill="#D9954A" text-anchor="middle">L</text><line x1="236" y1="90" x2="236" y2="260" stroke="#B03A2E" stroke-width="1.6"/><text x="242" y="175" font-size="13" font-weight="700" fill="#B03A2E">Q</text><text x="72" y="82" font-size="11.5" fill="#5c6670">llega el pedido: sube Q</text><text x="20" y="352" font-size="11.5" fill="#5c6670">Se pide Q cuando la posición del inventario baja a R. El pedido llega L después. Con demanda incierta, R = d̄·L + SS.</text></svg>