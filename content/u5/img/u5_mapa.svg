<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif"><rect width="700" height="350" fill="#FFFFFF"/><text x="20" y="26" font-size="17" font-weight="700" fill="#1F4E79">Mapa de la Unidad 5 · Logística</text><text x="20" y="44" font-size="11.5" fill="#5c6670">Esquema propio que ordena los temas del programa 2008; no es una lámina de la cátedra</text><defs><marker id="u5a7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1F4E79"/></marker></defs><rect x="20" y="70" width="200" height="70" rx="12" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="120.0" y="92" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle">Demanda</text><text x="120.0" y="112" font-size="11.5" fill="#333" text-anchor="middle">independiente → pronóstico (U2)</text><text x="120.0" y="127" font-size="11.5" fill="#333" text-anchor="middle">dependiente → MRP (U6)</text><rect x="250" y="70" width="200" height="70" rx="12" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="350.0" y="92" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle">Modelo de stock</text><text x="350.0" y="112" font-size="11.5" fill="#333" text-anchor="middle">perpetuo (Q) · periódico (P)</text><text x="350.0" y="127" font-size="11.5" fill="#333" text-anchor="middle">EOQ · SS · descuentos</text><rect x="480" y="70" width="200" height="70" rx="12" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="580.0" y="92" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle">Compras</text><text x="580.0" y="112" font-size="11.5" fill="#333" text-anchor="middle">cotizar · evaluar · asignar</text><text x="580.0" y="127" font-size="11.5" fill="#333" text-anchor="middle">colocar la O.C. · seguir</text><rect x="480" y="190" width="200" height="70" rx="12" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="580.0" y="212" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle">Proveedores</text><text x="580.0" y="232" font-size="11.5" fill="#333" text-anchor="middle">precio · entrega · calidad</text><text x="580.0" y="247" font-size="11.5" fill="#333" text-anchor="middle">JIT: pocos, cerca, frecuentes</text><rect x="250" y="190" width="200" height="70" rx="12" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="350.0" y="212" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle">Almacenes</text><text x="350.0" y="232" font-size="11.5" fill="#333" text-anchor="middle">recepción · registro · conteo</text><text x="350.0" y="247" font-size="11.5" fill="#333" text-anchor="middle">ABC · trazabilidad</text><rect x="20" y="190" width="200" height="70" rx="12" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.6"/><text x="120.0" y="212" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle">Distribución</text><text x="120.0" y="232" font-size="11.5" fill="#333" text-anchor="middle">CD · DRP · transporte</text><text x="120.0" y="247" font-size="11.5" fill="#333" text-anchor="middle">ubicación de plantas</text><line x1="220" y1="105" x2="248" y2="105" stroke="#1F4E79" stroke-width="2" marker-end="url(#u5a7)"/><line x1="450" y1="105" x2="478" y2="105" stroke="#1F4E79" stroke-width="2" marker-end="url(#u5a7)"/><line x1="580" y1="140" x2="580" y2="188" stroke="#1F4E79" stroke-width="2" marker-end="url(#u5a7)"/><line x1="480" y1="225" x2="452" y2="225" stroke="#1F4E79" stroke-width="2" marker-end="url(#u5a7)"/><line x1="250" y1="225" x2="222" y2="225" stroke="#1F4E79" stroke-width="2" marker-end="url(#u5a7)"/><rect x="20" y="290" width="660" height="44" rx="10" fill="#FFF3E8" stroke="#D9954A" stroke-width="1.4"/><text x="350" y="309" font-size="12.5" font-weight="700" fill="#8A5A16" text-anchor="middle">Cliente: nivel de servicio = probabilidad de no quedarse sin stock</text><text x="350" y="325" font-size="11.5" fill="#8A5A16" text-anchor="middle">Todo el circuito se mide contra eso y contra el costo de tener inventario (25–35% de su valor por año, Chase)</text></svg>