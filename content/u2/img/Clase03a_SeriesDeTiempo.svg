<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1010" width="980" height="1010" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect width="980" height="1010" fill="#FFFFFF"/>

  <!-- TITULO -->
  <text x="40" y="34" font-size="22" font-weight="700" fill="#1F4E79">CLASE 3.a · La serie de tiempo y sus 4 componentes</text>
  <text x="620" y="34" font-size="12.5" fill="#666">U2.b — el diagnóstico de la serie</text>
  <text x="40" y="56" font-size="12.5" font-weight="700" fill="#C00000">Serie de tiempo = secuencia ORDENADA de observaciones (Yₜ). El orden ES la información.</text>

  <!-- ===== LOS 4 COMPONENTES ===== -->
  <rect x="40" y="72" width="900" height="238" rx="8" fill="#F4F8FC" stroke="#B7D0E5" stroke-width="1.5"/>
  <text x="56" y="95" font-size="14" font-weight="700" fill="#1F4E79">Descomposición clásica: toda serie es la superposición de 4 componentes</text>
  <text x="56" y="113" font-size="10.5" fill="#666" font-style="italic">Como una canción: batería, bajo y voz suenan juntos, pero son fuentes separadas.</text>

  <!-- T -->
  <rect x="58" y="124" width="208" height="170" rx="6" fill="#fff" stroke="#C9DBEA"/>
  <text x="72" y="146" font-size="13" font-weight="700" fill="#1F4E79">T · TENDENCIA</text>
  <line x1="76" y1="232" x2="76" y2="158" stroke="#aaa" stroke-width="1"/>
  <line x1="76" y1="232" x2="252" y2="232" stroke="#aaa" stroke-width="1"/>
  <polyline points="82,224 110,214 138,200 166,192 194,178 222,166 246,158" fill="none" stroke="#1F4E79" stroke-width="2.5"/>
  <text x="72" y="252" font-size="10.5" fill="#333">Largo plazo: crecimiento o</text>
  <text x="72" y="266" font-size="10.5" fill="#333">disminución sostenida.</text>
  <text x="72" y="284" font-size="10" fill="#888" font-style="italic">Población, tecnología, mercado</text>

  <!-- C -->
  <rect x="278" y="124" width="208" height="170" rx="6" fill="#fff" stroke="#C9DBEA"/>
  <text x="292" y="146" font-size="13" font-weight="700" fill="#8A5A16">C · CICLO</text>
  <line x1="296" y1="232" x2="296" y2="158" stroke="#aaa" stroke-width="1"/>
  <line x1="296" y1="232" x2="472" y2="232" stroke="#aaa" stroke-width="1"/>
  <path d="M 302 200 C 330 165, 350 165, 372 200 C 396 235, 420 235, 444 190 C 452 175, 460 170, 466 168" fill="none" stroke="#B5651D" stroke-width="2.5"/>
  <text x="292" y="252" font-size="10.5" fill="#333">Ondas de VARIOS AÑOS</text>
  <text x="292" y="266" font-size="10.5" fill="#C00000" font-weight="700">sin período fijo (2 a 10 años)</text>
  <text x="292" y="284" font-size="10" fill="#888" font-style="italic">Economía, gusto popular, ciclo de vida</text>

  <!-- S -->
  <rect x="498" y="124" width="208" height="170" rx="6" fill="#fff" stroke="#C9DBEA"/>
  <text x="512" y="146" font-size="13" font-weight="700" fill="#1E6B33">S · ESTACIONALIDAD</text>
  <line x1="516" y1="232" x2="516" y2="158" stroke="#aaa" stroke-width="1"/>
  <line x1="516" y1="232" x2="692" y2="232" stroke="#aaa" stroke-width="1"/>
  <path d="M 522 220 L 538 172 L 554 220 L 570 224 L 586 172 L 602 220 L 618 224 L 634 172 L 650 220 L 666 224 L 682 176" fill="none" stroke="#1E6B33" stroke-width="2.2"/>
  <text x="512" y="252" font-size="10.5" fill="#333">Se repite AÑO TRAS AÑO</text>
  <text x="512" y="266" font-size="10.5" fill="#1E6B33" font-weight="700">período FIJO: L=4 trim · L=12 mens</text>
  <text x="512" y="284" font-size="10" fill="#888" font-style="italic">Clima y calendario</text>

  <!-- I -->
  <rect x="718" y="124" width="204" height="170" rx="6" fill="#fff" stroke="#C9DBEA"/>
  <text x="732" y="146" font-size="13" font-weight="700" fill="#666">I · IRREGULARIDAD</text>
  <line x1="736" y1="232" x2="736" y2="158" stroke="#aaa" stroke-width="1"/>
  <line x1="736" y1="232" x2="908" y2="232" stroke="#aaa" stroke-width="1"/>
  <polyline points="742,200 758,182 774,206 790,190 806,212 822,178 838,204 854,194 870,214 886,186 902,202" fill="none" stroke="#888" stroke-width="2"/>
  <text x="732" y="252" font-size="10.5" fill="#333">El RUIDO que queda tras</text>
  <text x="732" y="266" font-size="10.5" fill="#333">sacar los otros tres.</text>
  <text x="732" y="284" font-size="10" fill="#C00000" font-weight="700">Impredecible por definición</text>

  <!-- ===== CICLO VS ESTACIONALIDAD ===== -->
  <rect x="40" y="322" width="440" height="176" rx="8" fill="#FFF3E8" stroke="#D9954A" stroke-width="2"/>
  <text x="56" y="345" font-size="13.5" font-weight="700" fill="#8A5A16">⚠ La confusión clásica de examen</text>
  <g font-size="11">
    <rect x="56" y="356" width="408" height="20" fill="#D9954A"/>
    <text x="66" y="371" fill="#fff" font-weight="700"> </text>
    <text x="160" y="371" fill="#fff" font-weight="700">ESTACIONALIDAD</text>
    <text x="330" y="371" fill="#fff" font-weight="700">CICLO</text>
    <text x="66" y="394" fill="#333" font-weight="700">Duración</text><text x="160" y="394" fill="#333">fija, dentro del año</text><text x="330" y="394" fill="#333">variable, varios años</text>
    <text x="66" y="414" fill="#333" font-weight="700">¿Predecible?</text><text x="160" y="414" fill="#333">sí, se sabe cuándo</text><text x="330" y="414" fill="#333">no</text>
    <text x="66" y="434" fill="#333" font-weight="700">Causa</text><text x="160" y="434" fill="#333">clima, calendario</text><text x="330" y="434" fill="#333">economía, mercado</text>
    <text x="66" y="454" fill="#333" font-weight="700">Ejemplo</text><text x="160" y="454" fill="#333">picos cada diciembre</text><text x="330" y="454" fill="#333">recesión 2018–2020</text>
  </g>
  <rect x="56" y="464" width="408" height="24" rx="4" fill="#fff" stroke="#D9954A"/>
  <text x="66" y="481" font-size="11" font-weight="700" fill="#8A5A16">Regla: si podés ponerlo en el CALENDARIO → estacionalidad. Si no → ciclo.</text>

  <!-- ===== ADITIVO VS MULTIPLICATIVO ===== -->
  <rect x="500" y="322" width="440" height="176" rx="8" fill="#F1F7F2" stroke="#BFDCC4" stroke-width="1.5"/>
  <text x="516" y="345" font-size="13.5" font-weight="700" fill="#1E6B33">¿Cómo se combinan? Mirá la amplitud de las ondas</text>

  <text x="530" y="368" font-size="12" font-weight="700" fill="#1E6B33">ADITIVO:  Y = T + C + S + I</text>
  <line x1="530" y1="424" x2="530" y2="378" stroke="#aaa" stroke-width="1"/>
  <line x1="530" y1="424" x2="700" y2="424" stroke="#aaa" stroke-width="1"/>
  <path d="M 536 412 L 552 388 L 568 412 L 584 414 L 600 390 L 616 414 L 632 416 L 648 392 L 664 416 L 680 418 L 694 394" fill="none" stroke="#1E6B33" stroke-width="2"/>
  <text x="712" y="392" font-size="10.5" fill="#333">ondas de amplitud</text>
  <text x="712" y="406" font-size="10.5" fill="#333">CONSTANTE</text>
  <text x="712" y="422" font-size="10" fill="#888" font-style="italic">“+200 u. cada dic.”</text>

  <text x="530" y="448" font-size="12" font-weight="700" fill="#C00000">MULTIPLICATIVO:  Y = T × C × S × I</text>
  <line x1="530" y1="492" x2="530" y2="456" stroke="#aaa" stroke-width="1"/>
  <line x1="530" y1="492" x2="700" y2="492" stroke="#aaa" stroke-width="1"/>
  <path d="M 536 484 L 550 472 L 564 484 L 580 482 L 596 464 L 612 482 L 628 478 L 644 456 L 660 478 L 676 474 L 694 458" fill="none" stroke="#C00000" stroke-width="2"/>
  <text x="712" y="466" font-size="10.5" fill="#333">ondas que se AGRANDAN</text>
  <text x="712" y="480" font-size="10" fill="#888" font-style="italic">“+40% cada dic.”</text>
  <text x="712" y="494" font-size="10" fill="#C00000" font-weight="700">el más común en industria</text>

  <!-- ===== ESTACIONARIA + ARBOL ===== -->
  <rect x="40" y="510" width="900" height="266" rx="8" fill="#EAF6FB" stroke="#1F4E79" stroke-width="2"/>
  <text x="56" y="534" font-size="14" font-weight="700" fill="#1F4E79">SERIE ESTACIONARIA — la primera pregunta del diagnóstico</text>
  <text x="56" y="554" font-size="11.5" fill="#333">Definición: su <tspan font-weight="700">valor promedio NO cambia a través del tiempo</tspan>. Fluctúa, pero alrededor de un nivel constante.</text>

  <!-- mini graficos estacionaria vs no -->
  <rect x="56" y="566" width="180" height="88" rx="5" fill="#fff" stroke="#C9DBEA"/>
  <line x1="66" y1="640" x2="66" y2="578" stroke="#aaa" stroke-width="1"/>
  <line x1="66" y1="640" x2="226" y2="640" stroke="#aaa" stroke-width="1"/>
  <line x1="66" y1="608" x2="226" y2="608" stroke="#1E6B33" stroke-width="1" stroke-dasharray="4 3"/>
  <polyline points="72,614 92,598 112,616 132,600 152,618 172,602 192,612 212,604" fill="none" stroke="#1E6B33" stroke-width="2"/>
  <text x="146" y="586" font-size="10" font-weight="700" fill="#1E6B33" text-anchor="middle">ESTACIONARIA ✔</text>

  <rect x="248" y="566" width="180" height="88" rx="5" fill="#fff" stroke="#C9DBEA"/>
  <line x1="258" y1="640" x2="258" y2="578" stroke="#aaa" stroke-width="1"/>
  <line x1="258" y1="640" x2="418" y2="640" stroke="#aaa" stroke-width="1"/>
  <polyline points="264,630 284,620 304,614 324,600 344,596 364,586 384,580 404,586" fill="none" stroke="#C00000" stroke-width="2"/>
  <text x="338" y="586" font-size="10" font-weight="700" fill="#C00000" text-anchor="middle">NO estacionaria (tendencia)</text>

  <!-- arbol -->
  <text x="450" y="584" font-size="12.5" font-weight="700" fill="#1F4E79">★ ÁRBOL DE DECISIÓN — “justifique la metodología aplicada”</text>
  <g font-size="11">
    <rect x="450" y="592" width="474" height="20" fill="#1F4E79"/>
    <text x="462" y="607" fill="#fff" font-weight="700">Si la serie…</text>
    <text x="606" y="607" fill="#fff" font-weight="700">Métodos aplicables</text>

    <rect x="450" y="612" width="474" height="20" fill="#fff"/>
    <text x="462" y="627" fill="#1E6B33" font-weight="700">es ESTACIONARIA</text>
    <text x="606" y="627" fill="#333">promedio simple/móvil, suavizado exp. simple</text>

    <rect x="450" y="632" width="474" height="20" fill="#F2F6FA"/>
    <text x="462" y="647" fill="#1F4E79" font-weight="700">tiene TENDENCIA</text>
    <text x="606" y="647" fill="#333">prom. móvil doble, Brown, HOLT, regresión</text>

    <rect x="450" y="652" width="474" height="20" fill="#fff"/>
    <text x="462" y="667" fill="#8A5A16" font-weight="700">tiene ESTACIONALIDAD</text>
    <text x="606" y="667" fill="#333">WINTER, descomposición clásica, Census II</text>

    <rect x="450" y="672" width="474" height="20" fill="#F2F6FA"/>
    <text x="462" y="687" fill="#B5651D" font-weight="700">tiene CICLO</text>
    <text x="606" y="687" fill="#333">descomposición, indicadores económicos, reg. múltiple</text>
  </g>

  <rect x="56" y="668" width="372" height="94" rx="6" fill="#fff" stroke="#1F4E79"/>
  <text x="70" y="690" font-size="12" font-weight="700" fill="#1F4E79">¿No es estacionaria? → DIFERENCIACIÓN</text>
  <text x="70" y="710" font-size="11" fill="#333">Trabajar con las diferencias entre períodos:</text>
  <text x="70" y="730" font-size="13" font-weight="700" fill="#1F4E79" font-family="Cambria Math, Georgia, serif">Yₜ − Yₜ₋₁</text>
  <text x="70" y="750" font-size="10.5" fill="#666" font-style="italic">Si crece de a 10 por mes → todas las diferencias = 10</text>
  <text x="70" y="762" font-size="10.5" fill="#666" font-style="italic">→ serie plana → estacionaria. Se le sacó la tendencia.</text>

  <text x="450" y="710" font-size="11.5" font-weight="700" fill="#C00000">⚠ Este cuadro ES la respuesta a la consigna</text>
  <text x="450" y="728" font-size="11.5" font-weight="700" fill="#C00000">“elabore el MPS justificando la metodología”</text>
  <text x="450" y="750" font-size="11" fill="#333">y a toda pregunta de “¿qué método usaría y por qué?”</text>
  <text x="450" y="766" font-size="10.5" fill="#888" font-style="italic">Memorizarlo: es de las cosas más rentables de la unidad.</text>

  <!-- ===== EJEMPLO INTEGRADOR ===== -->
  <line x1="490" y1="780" x2="490" y2="796" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="40" y="800" width="900" height="122" rx="8" fill="#FBF6EE" stroke="#E3D2B5" stroke-width="1.5"/>
  <text x="56" y="822" font-size="13" font-weight="700" fill="#8A5A16">Ejemplo integrador — aires acondicionados (ventas trimestrales)</text>
  <text x="56" y="843" font-size="11" fill="#333">· Cada año vende más que el anterior → <tspan font-weight="700">TENDENCIA</tspan>     · Verano se dispara, invierno se hunde, siempre igual → <tspan font-weight="700">ESTACIONALIDAD (L=4)</tspan></text>
  <text x="56" y="861" font-size="11" fill="#333">· En 2020 cayó todo por la recesión y se recuperó → <tspan font-weight="700">CICLO</tspan>     · Un mes, pedido raro de un hotel → <tspan font-weight="700">IRREGULARIDAD</tspan></text>
  <text x="56" y="879" font-size="11" fill="#333">· Los picos de verano son cada vez más grandes en unidades → modelo <tspan font-weight="700">MULTIPLICATIVO</tspan>     · ¿Estacionaria? <tspan font-weight="700">No</tspan>, el promedio sube</text>
  <text x="56" y="901" font-size="12" font-weight="700" fill="#C00000">⇒ Método: WINTER o DESCOMPOSICIÓN (porque tiene tendencia Y estacionalidad)</text>

  <!-- PIE EJERCICIO -->
  <rect x="40" y="932" width="900" height="64" rx="6" fill="#FAFAFA" stroke="#CCC"/>
  <text x="56" y="952" font-size="11" font-weight="700" fill="#555">EJERCICIO — diagnosticar 4 series (componentes / ¿estacionaria? / aditivo o multiplicativo / familia de métodos):</text>
  <text x="56" y="970" font-size="10.8" fill="#555">a) panadería estable 900–1.100 kg hace 10 años   b) heladería trimestral 2022–24: 800/200/150/700 · 950/240/180/830 · 1100/280/210/980</text>
  <text x="56" y="987" font-size="10.8" fill="#555">c) app: 1.000, 1.250, 1.480, 1.760, 2.010, 2.290   d) constructora: sube hasta 2018, cae 2019–21, se recupera desde 2022</text>
</svg>
