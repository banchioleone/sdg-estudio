<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-label="Descomponer para volver a pronosticar" font-family="Arial,sans-serif"><text x="10" y="16" font-size="10" fill="#1f4e79">Descomponer para volver a pronosticar</text><rect x="10" y="30" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="45" font-size="9" fill="#1f4e79">Serie Y = T × S × C × I</text><text x="20" y="59" font-size="8" fill="#5c6670">Elegí multiplicativo si el patrón es proporcional</text><path d="M140 71 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="84" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="99" font-size="9" fill="#1f4e79">Estimá estación S y quitála</text><text x="20" y="113" font-size="8" fill="#5c6670">Y / S conserva T × C × I</text><path d="M140 125 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="138" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="153" font-size="9" fill="#1f4e79">Modelá la base y proyectá</text><text x="20" y="167" font-size="8" fill="#5c6670">Tendencia: b₀ + b₁t · control de residuos</text><path d="M140 179 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="192" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="207" font-size="9" fill="#1f4e79">Devolvé la estación correcta</text><text x="20" y="221" font-size="8" fill="#5c6670">Pronóstico = tendencia futura × S futura</text><path d="M140 233 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="246" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="261" font-size="9" fill="#1f4e79">Controlá y revisá</text><text x="20" y="275" font-size="8" fill="#5c6670">No confundas tendencia histórica con certeza</text></svg>