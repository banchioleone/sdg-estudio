<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 266" role="img" aria-label="Winter multiplicativo: orden de cálculo" font-family="Arial,sans-serif"><text x="10" y="16" font-size="10" fill="#1f4e79">Winter multiplicativo: orden de cálculo</text><rect x="10" y="30" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="45" font-size="9" fill="#1f4e79">1 · Quitá la estación anterior</text><text x="20" y="59" font-size="8" fill="#5c6670">Yₜ / Sₜ₋ₛ</text><path d="M140 71 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="84" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="99" font-size="9" fill="#1f4e79">2 · Actualizá nivel y tendencia</text><text x="20" y="113" font-size="8" fill="#5c6670">Lₜ usa Yₜ/Sₜ₋ₛ · después calculás Tₜ</text><path d="M140 125 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="138" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="153" font-size="9" fill="#1f4e79">3 · Actualizá el índice de esta estación</text><text x="20" y="167" font-size="8" fill="#5c6670">Sₜ = γ Yₜ/Lₜ + (1−γ) Sₜ₋ₛ</text><path d="M140 179 v10 m-3 -4 l3 4 l3 -4" fill="none" stroke="#c45c26"/><rect x="10" y="192" width="260" height="40" rx="6" fill="#f4f8fc" stroke="#d0d5db"/><text x="20" y="207" font-size="9" fill="#1f4e79">4 · Proyectá y reestacionalizá</text><text x="20" y="221" font-size="8" fill="#5c6670">(Lₜ + p Tₜ) × índice correspondiente</text></svg>